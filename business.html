<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Checkout</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 15px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #111827;
    text-decoration: none;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

nav a {
    text-decoration: none;
    color: #374151;
    font-size: 14px;
}

nav a:hover {
    color: #2563eb;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 20px 60px;
}

h1 {
    margin-top: 0;
}

.checkout-layout {
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 20px;
}

.box {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
}

.box h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 6px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;

    border: 1px solid #d1d5db;
    border-radius: 8px;

    font-size: 15px;
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

.required {
    color: #dc2626;
}

.order-item {
    display: flex;
    gap: 12px;

    padding: 12px 0;

    border-bottom: 1px solid #e5e7eb;
}

.order-image {
    width: 65px;
    height: 65px;

    object-fit: cover;

    border-radius: 8px;

    background: #eef2f7;
}

.no-image {
    width: 65px;
    height: 65px;

    background: #eef2f7;

    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
}

.order-info {
    flex: 1;
}

.order-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.order-meta {
    color: #6b7280;
    font-size: 13px;
}

.order-price {
    font-weight: bold;
    white-space: nowrap;
}

.summary-row {
    display: flex;
    justify-content: space-between;

    margin: 12px 0;
}

.total {
    border-top: 1px solid #e5e7eb;

    padding-top: 15px;

    font-size: 22px;
    font-weight: bold;
}

.btn {
    width: 100%;

    border: none;
    border-radius: 8px;

    padding: 13px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    margin-top: 10px;
}

.btn-success {
    background: #16a34a;
    color: white;
}

.btn-success:hover {
    background: #15803d;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.status {
    margin-bottom: 20px;
    padding: 12px;

    border-radius: 8px;

    display: none;
}

.status.error {
    display: block;

    background: #fee2e2;
    color: #991b1b;
}

.status.success {
    display: block;

    background: #dcfce7;
    color: #166534;
}

.empty {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 12px;

    padding: 60px 20px;

    text-align: center;
}

.empty-icon {
    font-size: 60px;
}

.confirmation {
    display: none;

    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 12px;

    padding: 50px 20px;

    text-align: center;
}

.confirmation.show {
    display: block;
}

.confirmation-icon {
    font-size: 65px;
}

.confirmation h2 {
    color: #16a34a;
}

.order-number {
    background: #f3f4f6;

    display: inline-block;

    padding: 10px 15px;

    border-radius: 8px;

    margin: 10px 0 20px;

    font-weight: bold;
}

@media (max-width: 750px) {

    header {
        flex-direction: column;
        align-items: flex-start;
    }

    .checkout-layout {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<header>

<a
    href="index.html"
    class="logo">

    BERAKAH

</a>

<nav>

<a href="index.html">
Home
</a>

<a href="feed.html">
Feed
</a>

<a href="people.html">
👥 People
</a>

<a href="marketplace.html">
Market
</a>

<a href="notifications.html">
🔔 Notifications
</a>

<a href="messages.html">
💬 Messages
</a>

<a href="cart.html">
🛒 Cart
</a>

<a href="#"
   onclick="logout()">

Logout

</a>

</nav>

</header>


<main class="container">

<h1>
💳 Checkout
</h1>


<div
    id="status"
    class="status">
</div>


<!-- =========================
     CHECKOUT
========================= -->

<div
    id="checkoutArea">

    <div class="checkout-layout">


        <!-- =========================
             CUSTOMER INFORMATION
        ========================= -->

        <div class="box">

            <h2>
                📦 Shipping Information
            </h2>


            <div class="form-group">

                <label>
                    Full Name
                    <span class="required">*</span>
                </label>

                <input
                    id="shippingName"
                    type="text"
                    placeholder="Your full name"
                    autocomplete="name">

            </div>


            <div class="form-group">

                <label>
                    Email
                    <span class="required">*</span>
                </label>

                <input
                    id="shippingEmail"
                    type="email"
                    placeholder="your@email.com"
                    autocomplete="email">

            </div>


            <div class="form-group">

                <label>
                    Phone
                    <span class="required">*</span>
                </label>

                <input
                    id="shippingPhone"
                    type="tel"
                    placeholder="Your phone number"
                    autocomplete="tel">

            </div>


            <div class="form-group">

                <label>
                    Shipping Address
                    <span class="required">*</span>
                </label>

                <textarea
                    id="shippingAddress"
                    placeholder="Street, city, state, ZIP code, country"
                    autocomplete="street-address"></textarea>

            </div>


            <button
                id="placeOrderButton"
                class="btn btn-success"
                onclick="placeOrder()">

                🛍️ Place Order

            </button>


            <button
                class="btn btn-primary"
                onclick="goToCart()">

                ← Back to Cart

            </button>

        </div>


        <!-- =========================
             ORDER SUMMARY
        ========================= -->

        <div class="box">

            <h2>
                🛒 Your Order
            </h2>

            <div
                id="orderItems">
            </div>


            <div class="summary-row">

                <span>
                    Items
                </span>

                <strong id="itemCount">
                    0
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong id="subtotal">
                    $0.00
                </strong>

            </div>


            <div class="summary-row total">

                <span>
                    Total
                </span>

                <span id="total">
                    $0.00
                </span>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     CONFIRMATION
========================= -->

<div
    id="confirmation"
    class="confirmation">

    <div class="confirmation-icon">
        ✅
    </div>

    <h2>
        Order Placed Successfully!
    </h2>

    <p>
        Thank you for shopping with BERAKAH.
    </p>

    <div
        id="orderNumber"
        class="order-number">
    </div>

    <p>
        Your order has been submitted.
    </p>

    <button
        class="btn btn-primary"
        onclick="goToMarketplace()">

        🛍️ Continue Shopping

    </button>

</div>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken =
    localStorage.getItem(
        "berakah_access_token"
    );

let currentUser = null;


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
    endpoint,
    options = {}
) {

    const response =
        await fetch(
            SUPABASE_URL + endpoint,
            {
                ...options,

                headers: {
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                }
            }
        );


    const text =
        await response.text();


    let data = null;


    try {

        data =
            text
            ? JSON.parse(text)
            : null;

    } catch {

        data = text;

    }


    if (!response.ok) {

        throw new Error(
            data?.message ||
            data?.msg ||
            "Supabase request failed"
        );

    }


    return data;

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser() {

    if (!accessToken) {

        window.location.href =
            "login.html";

        return false;

    }


    try {

        currentUser =
            await supabaseRequest(
                "/auth/v1/user"
            );


        return true;

    } catch (error) {

        console.error(error);

        localStorage.removeItem(
            "berakah_access_token"
        );

        localStorage.removeItem(
            "berakah_refresh_token"
        );

        window.location.href =
            "login.html";

        return false;

    }

}


/* =====================================================
   GET CART
===================================================== */

function getCart() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "berakahCart"
            )
        ) || [];

    } catch {

        return [];

    }

}


/* =====================================================
   DISPLAY ORDER
===================================================== */

function renderOrder() {

    const cart =
        getCart();


    const orderItems =
        document.getElementById(
            "orderItems"
        );


    if (
        cart.length === 0
    ) {

        document.getElementById(
            "checkoutArea"
        ).innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🛒
                </div>

                <h2>
                    Your cart is empty
                </h2>

                <p>
                    Add products before checking out.
                </p>

                <button
                    class="btn btn-primary"
                    onclick="goToMarketplace()">

                    🛍️ Go to Marketplace

                </button>

            </div>

        `;

        return;

    }


    let subtotal = 0;


    let html = "";


    cart.forEach(
        item => {

            const price =
                Number(
                    item.price || 0
                );


            const quantity =
                Number(
                    item.quantity || 1
                );


            const itemTotal =
                price * quantity;


            subtotal +=
                itemTotal;


            let imageHTML;


            if (item.image_url) {

                imageHTML = `

                    <img
                        class="order-image"
                        src="${escapeAttribute(item.image_url)}"
                        alt="${escapeHTML(item.name || "Product")}">

                `;

            } else {

                imageHTML = `

                    <div class="no-image">
                        🛍️
                    </div>

                `;

            }


            html += `

                <div class="order-item">

                    ${imageHTML}

                    <div class="order-info">

                        <div class="order-name">

                            ${escapeHTML(
                                item.name ||
                                "Product"
                            )}

                        </div>

                        <div class="order-meta">

                            Qty:
                            ${quantity}

                            <br>

                            Seller:
                            ${escapeHTML(
                                item.seller_name ||
                                "BERAKAH Member"
                            )}

                        </div>

                    </div>

                    <div class="order-price">

                        $${itemTotal.toFixed(2)}

                    </div>

                </div>

            `;

        }
    );


    const itemCount =
        cart.reduce(
            (total, item) =>
                total +
                Number(
                    item.quantity || 0
                ),
            0
        );


    orderItems.innerHTML =
        html;


    document.getElementById(
        "itemCount"
    ).textContent =
        itemCount;


    document.getElementById(
        "subtotal"
    ).textContent =
        "$" +
        subtotal.toFixed(2);


    document.getElementById(
        "total"
    ).textContent =
        "$" +
        subtotal.toFixed(2);

}


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder() {

    const cart =
        getCart();


    if (
        cart.length === 0
    ) {

        showError(
            "Your cart is empty."
        );

        return;

    }


    const shippingName =
        document.getElementById(
            "shippingName"
        ).value.trim();


    const shippingEmail =
        document.getElementById(
            "shippingEmail"
        ).value.trim();


    const shippingPhone =
        document.getElementById(
            "shippingPhone"
        ).value.trim();


    const shippingAddress =
        document.getElementById(
            "shippingAddress"
        ).value.trim();


    if (!shippingName) {

        showError(
            "Please enter your full name."
        );

        return;

    }


    if (!shippingEmail) {

        showError(
            "Please enter your email."
        );

        return;

    }


    if (!shippingPhone) {

        showError(
            "Please enter your phone number."
        );

        return;

    }


    if (!shippingAddress) {

        showError(
            "Please enter your shipping address."
        );

        return;

    }


    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (
        !emailPattern.test(
            shippingEmail
        )
    ) {

        showError(
            "Please enter a valid email address."
        );

        return;

    }


    const button =
        document.getElementById(
            "placeOrderButton"
        );


    button.disabled = true;

    button.textContent =
        "⏳ Placing Order...";


    try {

        /*
         * Group products by seller.
         *
         * Each seller receives
         * their own order rows.
         */

        for (
            const item of cart
        ) {

            const quantity =
                Number(
                    item.quantity || 1
                );


            const price =
                Number(
                    item.price || 0
                );


            const total =
                price * quantity;


            if (!item.seller_id) {

                /*
                 * Older cart items may not have
                 * seller_id.
                 *
                 * Try to retrieve it from
                 * the products table.
                 */

                const products =
                    await supabaseRequest(
                        "/rest/v1/products" +
                        "?select=id,seller_id,stock" +
                        "&id=eq." +
                        encodeURIComponent(
                            item.id
                        )
                    );


                if (
                    !products ||
                    products.length === 0
                ) {

                    throw new Error(
                        "Product no longer exists: " +
                        item.name
                    );

                }


                item.seller_id =
                    products[0].seller_id;


                if (
                    !item.seller_id
                ) {

                    throw new Error(
                        "Seller information is missing for: " +
                        item.name
                    );

                }

            }


            const order = {

                buyer_id:
                    currentUser.id,

                seller_id:
                    item.seller_id,

                product_id:
                    item.id,

                product_name:
                    item.name,

                quantity:
                    quantity,

                price:
                    price,

                total:
                    total,

                status:
                    "pending",

                shipping_name:
                    shippingName,

                shipping_email:
                    shippingEmail,

                shipping_phone:
                    shippingPhone,

                shipping_address:
                    shippingAddress

            };


            await supabaseRequest(
                "/rest/v1/orders",
                {
                    method: "POST",

                    headers: {
                        "Prefer":
                            "return=minimal"
                    },

                    body:
                        JSON.stringify(order)
                }
            );

        }


        /*
         * All orders successfully created.
         */

        localStorage.removeItem(
            "berakahCart"
        );


        document.getElementById(
            "checkoutArea"
        ).style.display =
            "none";


        const confirmation =
            document.getElementById(
                "confirmation"
            );


        confirmation.classList.add(
            "show"
        );


        document.getElementById(
            "orderNumber"
        ).textContent =
            "Order submitted successfully";


        document.getElementById(
            "status"
        ).className =
            "status success";


        document.getElementById(
            "status"
        ).textContent =
            "Your order was successfully created.";

    } catch (error) {

        console.error(error);

        showError(
            "Could not place order: " +
            error.message
        );


        button.disabled = false;

        button.textContent =
            "🛍️ Place Order";

    }

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

    const status =
        document.getElementById(
            "status"
        );


    status.className =
        "status error";


    status.textContent =
        message;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   CART
===================================================== */

function goToCart() {

    window.location.href =
        "cart.html";

}


/* =====================================================
   MARKETPLACE
===================================================== */

function goToMarketplace() {

    window.location.href =
        "marketplace.html";

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        "berakah_access_token"
    );

    localStorage.removeItem(
        "berakah_refresh_token"
    );


    window.location.href =
        "login.html";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");

}


/* =====================================================
   START
===================================================== */

async function startCheckout() {

    const loggedIn =
        await loadUser();


    if (!loggedIn) {

        return;

    }


    /*
     * Pre-fill email from
     * the logged-in account.
     */

    if (
        currentUser.email
    ) {

        document.getElementById(
            "shippingEmail"
        ).value =
            currentUser.email;

    }


    /*
     * Pre-fill name if available.
     */

    const metadata =
        currentUser.user_metadata ||
        {};


    const name =
        metadata.full_name ||
        metadata.name ||
        "";


    if (name) {

        document.getElementById(
            "shippingName"
        ).value =
            name;

    }


    renderOrder();

}


/* START */

startCheckout();

</script>

</body>

</html>
