<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BERAKAH - Business</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    header a {
      text-decoration: none;
      color: #111827;
      font-weight: bold;
    }

    .container {
      max-width: 850px;
      margin: 35px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      margin-top: 22px;
      padding: 13px 22px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .preview {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 25px;
      margin-top: 25px;
    }

    .business-logo {
      width: 80px;
      height: 80px;
      border-radius: 15px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      margin-bottom: 15px;
    }

    .info {
      line-height: 1.7;
      color: #4b5563;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">BERAKAH</div>
    <a href="index.html">HOME</a>
  </header>

  <main class="container">

    <section class="card">

      <h1>🏪 Create Your Business</h1>

      <p>
        Build your business presence on BERAKAH and connect
        with customers and communities.
      </p>

      <label>Business Name</label>
      <input type="text" placeholder="Enter business name">

      <label>Business Description</label>
      <textarea placeholder="Tell people about your business"></textarea>

      <label>Business Type</label>
      <select>
        <option>Retail</option>
        <option>Restaurant</option>
        <option>Professional Services</option>
        <option>Technology</option>
        <option>Beauty & Wellness</option>
        <option>Other</option>
      </select>

      <label>Location</label>
      <input type="text" placeholder="City, State or Country">

      <label>Phone</label>
      <input type="tel" placeholder="Business phone">

      <label>Website</label>
      <input type="url" placeholder="https://">

      <label>Preferred Language</label>
      <select>
        <option>Haitian Creole</option>
        <option>English</option>
        <option>French</option>
        <option>Spanish</option>
      </select>

      <button type="button">CREATE BUSINESS</button>
      <a href="add-product.html" style="text-decoration: none;">
        <a href="products.html" style="text-decoration: none;">
  <button type="button">🛍️ MY PRODUCTS</button>
</a>
  <button type="button">➕ ADD PRODUCT</button>
</a>

    </section>

    <section class="card">

      <h2>Business Preview</h2>

      <div class="preview">

        <div class="business-logo">🏪</div>

        <h2>Your Business Name</h2>

        <p class="info">
          Your business description will appear here.
        </p>

        <p class="info">
          📍 Location
        </p>

        <p class="info">
          📞 Phone
        </p>

        <p class="info">
          🌎 Haitian Creole • English • French • Spanish
        </p>

      </div>

    </section>

  </main>

</body>
</html>
