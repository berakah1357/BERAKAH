<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Messages</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #2563eb;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

nav a {
    text-decoration: none;
    color: #374151;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
}

nav a:hover {
    background: #eff6ff;
    color: #2563eb;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

h1 {
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

select:focus,
textarea:focus {
    border-color: #2563eb;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #1d4ed8;
}

button.delete {
    background: #dc2626;
    padding: 7px 11px;
    font-size: 12px;
}

button.delete:hover {
    background: #b91c1c;
}

button.refresh {
    background: #4b5563;
}

button.refresh:hover {
    background: #374151;
}

.status {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    display: none;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.messages-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
}

.members {
    max-height: 600px;
    overflow-y: auto;
}

.member {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    cursor: pointer;
    border-radius: 8px;
}

.member:hover {
    background: #f3f4f6;
}

.member.active {
    background: #eff6ff;
}

.member-name {
    font-weight: bold;
}

.member-username {
    color: #6b7280;
    font-size: 13px;
}

.conversation {
    min-height: 500px;
    display: flex;
    flex-direction: column;
}

.conversation-header {
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 15px;
    margin-bottom: 15px;
}

.conversation-header h2 {
    margin: 0 0 5px;
    font-size: 20px;
}

.conversation-header a {
    color: #2563eb;
    text-decoration: none;
    font-size: 14px;
}

.messages-box {
    flex: 1;
    min-height: 300px;
    max-height: 500px;
    overflow-y: auto;
    padding: 10px;
    background: #f9fafb;
    border-radius: 10px;
}

.message {
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
}

.message.mine {
    align-items: flex-end;
}

.message.theirs {
    align-items: flex-start;
}

.bubble {
    max-width: 75%;
    padding: 10px 13px;
    border-radius: 14px;
    word-wrap: break-word;
    white-space: pre-wrap;
}

.mine .bubble {
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 4px;
}

.theirs .bubble {
    background: #e5e7eb;
    color: #111827;
    border-bottom-left-radius: 4px;
}

.message-time {
    font-size: 11px;
    color: #6b7280;
    margin-top: 4px;
}

.message-actions {
    margin-top: 4px;
}

.send-area {
    margin-top: 15px;
    display: flex;
    gap: 10px;
}

.send-area textarea {
    flex: 1;
    min-height: 55px;
}

.send-area button {
    align-self: flex-end;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 40px 15px;
}

.loading {
    text-align: center;
    color: #6b7280;
    padding: 20px;
}

@media (max-width: 750px) {
    .messages-layout {
        grid-template-columns: 1fr;
    }

    .members {
        max-height: 220px;
    }

    .conversation {
        min-height: 450px;
    }

    .bubble {
        max-width: 85%;
    }

    header {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">BERAKAH</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="feed.html">Feed</a>
        <a href="people.html">👥 People</a>
        <a href="marketplace.html">Market</a>
        <a href="notifications.html">🔔 Notifications</a>
        <a href="messages.html">💬 Messages</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>
</header>

<div class="container">

    <h1>💬 Messages</h1>

    <div id="status" class="status"></div>

    <div class="messages-layout">

        <!-- MEMBERS -->
        <div class="card members">
            <h2>New Message</h2>

            <select id="memberSelect">
                <option value="">Choose a member...</option>
            </select>

            <div id="membersList" style="margin-top:15px;">
                <div class="loading">Loading members...</div>
            </div>
        </div>

        <!-- CONVERSATION -->
        <div class="card conversation">

            <div class="conversation-header">
                <h2 id="conversationTitle">👋 Start the conversation</h2>

                <a id="profileLink"
                   href="#"
                   style="display:none;">
                    View Profile
                </a>
            </div>

            <div id="messagesBox" class="messages-box">
                <div class="empty">
                    Select a member to start a conversation.
                </div>
            </div>

            <div class="send-area">
                <textarea
                    id="messageInput"
                    placeholder="Write a message..."
                    disabled
                ></textarea>

                <button id="sendButton"
                        onclick="sendMessage()"
                        disabled>
                    Send
                </button>
            </div>

        </div>

    </div>

    <div style="margin-top:15px;">
        <button class="refresh" onclick="loadMessages()">
            🔄 Refresh
        </button>
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

let accessToken =
    localStorage.getItem("berakah_access_token");

let currentUser = null;
let profiles = [];
let allMessages = [];
let selectedUserId = null;


/* =========================
   SUPABASE REQUEST
========================= */

async function supabaseFetch(path, options = {}) {

    const headers = {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + accessToken,
        "Content-Type": "application/json",
        ...(options.headers || {})
    };

    const response = await fetch(
        SUPABASE_URL + path,
        {
            ...options,
            headers
        }
    );

    const text = await response.text();

    let data = null;

    try {
        data = text ? JSON.parse(text) : null;
    } catch {
        data = text;
    }

    if (!response.ok) {
        throw new Error(
            typeof data === "object"
                ? JSON.stringify(data)
                : data
        );
    }

    return data;
}


/* =========================
   STATUS
========================= */

function showStatus(message, type = "error") {

    const box = document.getElementById("status");

    box.textContent = message;

    box.className = "status " + type;

    box.style.display = "block";

    setTimeout(() => {
        box.style.display = "none";
    }, 5000);
}


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin() {

    if (!accessToken) {
        window.location.href = "login.html";
        return false;
    }

    try {

        currentUser = await supabaseFetch(
            "/auth/v1/user"
        );

        return true;

    } catch (error) {

        console.error(error);

        localStorage.removeItem("berakah_access_token");
        localStorage.removeItem("berakah_refresh_token");

        window.location.href = "login.html";

        return false;
    }
}


/* =========================
   LOAD MEMBERS
========================= */

async function loadMembers() {

    const data = await supabaseFetch(
        "/rest/v1/profiles?select=id,user_id,%22Full%20name%22,username,language&order=id.asc"
    );

    profiles = data || [];

    profiles = profiles.filter(
        profile =>
            profile.user_id !== currentUser.id
    );

    const select =
        document.getElementById("memberSelect");

    select.innerHTML =
        '<option value="">Choose a member...</option>';

    const list =
        document.getElementById("membersList");

    list.innerHTML = "";

    if (profiles.length === 0) {

        list.innerHTML =
            '<div class="empty">No members found.</div>';

        return;
    }

    profiles.forEach(profile => {

        const name =
            profile["Full name"] ||
            profile.full_name ||
            profile.name ||
            profile.username ||
            "Member";

        const username =
            profile.username
                ? "@" + profile.username
                : "";

        /* SELECT OPTION */

        const option =
            document.createElement("option");

        option.value = profile.user_id;

        option.textContent =
            name + " " + username;

        select.appendChild(option);


        /* MEMBER LIST */

        const div =
            document.createElement("div");

        div.className = "member";

        div.dataset.userid =
            profile.user_id;

        div.innerHTML = `
            <div class="member-name">
                ${escapeHtml(name)}
            </div>

            <div class="member-username">
                ${escapeHtml(username)}
            </div>
        `;

        div.onclick = () => {

            select.value =
                profile.user_id;

            select.dispatchEvent(
                new Event("change")
            );
        };

        list.appendChild(div);
    });
}


/* =========================
   MEMBER SELECT
========================= */

document
    .getElementById("memberSelect")
    .addEventListener("change", function() {

        selectedUserId = this.value || null;

        document
            .querySelectorAll(".member")
            .forEach(member => {

                member.classList.toggle(
                    "active",
                    member.dataset.userid === selectedUserId
                );
            });

        if (!selectedUserId) {

            document.getElementById(
                "conversationTitle"
            ).textContent =
                "👋 Start the conversation";

            document.getElementById(
                "profileLink"
            ).style.display = "none";

            document.getElementById(
                "messagesBox"
            ).innerHTML =
                '<div class="empty">Select a member to start a conversation.</div>';

            document.getElementById(
                "messageInput"
            ).disabled = true;

            document.getElementById(
                "sendButton"
            ).disabled = true;

            return;
        }

        const profile =
            profiles.find(
                p => p.user_id === selectedUserId
            );

        if (profile) {

            const name =
                profile["Full name"] ||
                profile.full_name ||
                profile.name ||
                profile.username ||
                "Member";

            document.getElementById(
                "conversationTitle"
            ).textContent =
                "💬 " + name;

            const profileLink =
                document.getElementById(
                    "profileLink"
                );

            profileLink.href =
                "profile.html?id=" + profile.id;

            profileLink.textContent =
                "View " + name + "'s Profile";

            profileLink.style.display =
                "inline-block";
        }

        document.getElementById(
            "messageInput"
        ).disabled = false;

        document.getElementById(
            "sendButton"
        ).disabled = false;

        renderMessages();
    });


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

    try {

        const data =
            await supabaseFetch(
                "/rest/v1/messages?select=*&order=created_at.asc"
            );

        allMessages = data || [];

        renderMessages();

    } catch (error) {

        console.error(error);

        showStatus(
            "Could not load messages: " +
            error.message
        );

        document.getElementById(
            "messagesBox"
        ).innerHTML = `
            <div class="empty">
                Could not load messages.
            </div>
        `;
    }
}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages() {

    const box =
        document.getElementById("messagesBox");

    if (!selectedUserId) {
        return;
    }

    const conversation =
        allMessages.filter(message => {

            return (
                (
                    message.sender_id === currentUser.id &&
                    message.receiver_id === selectedUserId
                )
                ||
                (
                    message.sender_id === selectedUserId &&
                    message.receiver_id === currentUser.id
                )
            );

        });

    if (conversation.length === 0) {

        const profile =
            profiles.find(
                p => p.user_id === selectedUserId
            );

        const name =
            profile
                ? (
                    profile["Full name"] ||
                    profile.full_name ||
                    profile.name ||
                    profile.username ||
                    "Member"
                )
                : "this member";

        box.innerHTML = `
            <div class="empty">
                No messages yet.<br>
                Send a message to ${escapeHtml(name)}.
            </div>
        `;

        return;
    }

    box.innerHTML = "";

    conversation.forEach(message => {

        const mine =
            message.sender_id === currentUser.id;

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message " +
            (mine ? "mine" : "theirs");

        const bubble =
            document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent =
            message.content || "";

        wrapper.appendChild(bubble);

        const time =
            document.createElement("div");

        time.className = "message-time";

        time.textContent =
            formatTime(message.created_at);

        wrapper.appendChild(time);

        if (mine) {

            const actions =
                document.createElement("div");

            actions.className =
                "message-actions";

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete";

            deleteButton.textContent =
                "Delete";

            deleteButton.onclick =
                () => deleteMessage(message.id);

            actions.appendChild(
                deleteButton
            );

            wrapper.appendChild(actions);
        }

        box.appendChild(wrapper);
    });

    box.scrollTop =
        box.scrollHeight;
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    if (!selectedUserId) {
        showStatus(
            "Please choose a member first."
        );
        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const content =
        input.value.trim();

    if (!content) {
        return;
    }

    const button =
        document.getElementById(
            "sendButton"
        );

    button.disabled = true;

    try {

        await supabaseFetch(
            "/rest/v1/messages",
            {
                method: "POST",

                headers: {
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify({
                    sender_id: currentUser.id,
                    receiver_id: selectedUserId,
                    content: content
                })
            }
        );

        input.value = "";

        await loadMessages();

    } catch (error) {

        console.error(error);

        showStatus(
            "Could not send message: " +
            error.message
        );

    } finally {

        button.disabled = false;

        input.focus();
    }
}


/* =========================
   DELETE MESSAGE
========================= */

async function deleteMessage(messageId) {

    if (!confirm(
        "Delete this message?"
    )) {
        return;
    }

    try {

        await supabaseFetch(
            "/rest/v1/messages?id=eq." +
            encodeURIComponent(messageId),
            {
                method: "DELETE"
            }
        );

        await loadMessages();

        showStatus(
            "Message deleted.",
            "success"
        );

    } catch (error) {

        console.error(error);

        showStatus(
            "Could not delete message: " +
            error.message
        );
    }
}


/* =========================
   TIME
========================= */

function formatTime(dateString) {

    if (!dateString) {
        return "";
    }

    const date =
        new Date(dateString);

    if (isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString(
        [],
        {
            dateStyle: "short",
            timeStyle: "short"
        }
    );
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   ENTER TO SEND
========================= */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "berakah_access_token"
    );

    localStorage.removeItem(
        "berakah_refresh_token"
    );

    window.location.href =
        "login.html";
}


/* =========================
   AUTO REFRESH
========================= */

setInterval(() => {

    if (currentUser) {
        loadMessages();
    }

}, 5000);


/* =========================
   START
========================= */

async function start() {

    const loggedIn =
        await checkLogin();

    if (!loggedIn) {
        return;
    }

    try {

        await loadMembers();

        await loadMessages();

    } catch (error) {

        console.error(error);

        showStatus(
            "Could not load Messages: " +
            error.message
        );
    }
}

start();

</script>

</body>
</html>
