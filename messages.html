<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Messages</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons a,
.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  color: #111827;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
  text-decoration: none;
  font-weight: bold;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 900px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 18px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
  overflow: hidden;
}

.title {
  padding: 22px;
  border-bottom: 1px solid #e5e7eb;
}

.title h1 {
  margin: 0;
}

.status {
  padding: 12px 22px;
  background: #f3f4f6;
  white-space: pre-wrap;
}

.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 600px;
}

.people {
  border-right: 1px solid #e5e7eb;
  padding: 15px;
  overflow-y: auto;
}

.people h3 {
  margin-top: 5px;
}

.person {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border: 1px solid #e5e7eb;
  background: white;
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  text-align: left;
}

.person:hover {
  background: #f9fafb;
}

.person.active {
  background: #f3f4f6;
}

.person-avatar {
  width: 42px;
  height: 42px;
  min-width: 42px;
  border-radius: 50%;
  background: #111827;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.person-name {
  font-weight: bold;
}

.person-username {
  color: #6b7280;
  font-size: 12px;
  margin-top: 3px;
}

.chat {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.chat-header {
  padding: 15px 20px;
  border-bottom: 1px solid #e5e7eb;
  font-weight: bold;
}

.messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  min-height: 430px;
  max-height: 500px;
}

.message-row {
  display: flex;
  margin-bottom: 12px;
}

.message-row.mine {
  justify-content: flex-end;
}

.bubble {
  max-width: 75%;
  padding: 11px 14px;
  border-radius: 14px;
  background: #f3f4f6;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.4;
}

.mine .bubble {
  background: #111827;
  color: white;
}

.message-time {
  font-size: 10px;
  opacity: 0.65;
  margin-top: 5px;
}

.composer {
  display: flex;
  gap: 8px;
  padding: 15px;
  border-top: 1px solid #e5e7eb;
}

.composer textarea {
  flex: 1;
  resize: none;
  min-height: 45px;
  max-height: 120px;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-family: Arial, sans-serif;
  font-size: 15px;
}

.send-button {
  border: none;
  background: #111827;
  color: white;
  padding: 0 18px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.send-button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 60px 20px;
}

@media (max-width: 700px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .nav-buttons {
    width: 100%;
  }

  .layout {
    grid-template-columns: 1fr;
  }

  .people {
    border-right: none;
    border-bottom: 1px solid #e5e7eb;
    max-height: 230px;
  }

  .messages {
    min-height: 350px;
    max-height: 450px;
  }

}

</style>

</head>


<body>


<header>

<div class="nav">

<div class="logo">
BERAKAH
</div>

<div class="nav-buttons">

<a href="index.html">
Home
</a>

<a href="feed.html">
Feed
</a>

<a href="people.html">
👥 People
</a>

<a href="marketplace.html">
Market
</a>

<a href="notifications.html">
🔔
</a>

<button
class="logout"
id="logoutButton">
Logout
</button>

</div>

</div>

</header>


<main>

<div class="card">

<div class="title">

<h1>
💬 BERAKAH Messages
</h1>

</div>


<div
id="status"
class="status">
Loading messages...
</div>


<div class="layout">


<!-- PEOPLE -->

<div class="people">

<h3>
BERAKAH People
</h3>

<div id="peopleList"></div>

</div>


<!-- CHAT -->

<div class="chat">

<div
id="chatHeader"
class="chat-header">
Select a person to start messaging
</div>


<div
id="messages"
class="messages">

<div class="empty">

💬

<br><br>

Select a BERAKAH member on the left.

</div>

</div>


<div class="composer">

<textarea
id="messageInput"
placeholder="Write a message..."
maxlength="2000"
disabled></textarea>

<button
id="sendButton"
class="send-button"
disabled>
SEND
</button>

</div>

</div>

</div>

</div>

</main>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const accessToken =
localStorage.getItem(
"berakah_access_token"
);

let currentUser = null;
let people = [];
let selectedPerson = null;


/* =========================================
   HEADERS
========================================= */

function headers(extra) {

return Object.assign({

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + accessToken

}, extra || {});

}


/* =========================================
   SAFE
========================================= */

function safe(value) {

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

document.getElementById(
"status"
).textContent = text;

}


/* =========================================
   CURRENT USER
========================================= */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"Your login session is missing. Please log in again."
);

}

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{
method: "GET",
headers: headers()
}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Login session error:\n\n" +
text
);

}

return JSON.parse(text);

}


/* =========================================
   LOAD PEOPLE
========================================= */

async function loadPeople() {

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=id,\"Full name\",username,avatar_url,user_id" +
"&order=username.asc";


const response =
await fetch(

url,

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load people:\n\n" +
text
);

}


people =
text.trim()
?
JSON.parse(text)
:
[];


/*
 Remove current account.
*/

people =
people.filter(
function(person) {

return String(person.user_id) !==
String(currentUser.id);

}
);


displayPeople();

}


/* =========================================
   DISPLAY PEOPLE
========================================= */

function displayPeople() {

const container =
document.getElementById(
"peopleList"
);

container.innerHTML =
"";


if (!people.length) {

container.innerHTML = `

<div class="empty">

No other BERAKAH members found.

</div>

`;

return;

}


people.forEach(
function(person) {

const button =
document.createElement(
"button"
);

button.className =
"person";


const name =
person["Full name"] ||
person.username ||
"BERAKAH User";


const letter =
name.charAt(0)
.toUpperCase();


button.innerHTML = `

<div class="person-avatar">
${safe(letter)}
</div>

<div>

<div class="person-name">
${safe(name)}
</div>

<div class="person-username">
@${safe(
(person.username || "")
.toLowerCase()
)}
</div>

</div>

`;


button.addEventListener(
"click",
function() {

selectPerson(
person,
button
);

});


container.appendChild(
button
);

});

}


/* =========================================
   SELECT PERSON
========================================= */

async function selectPerson(
person,
button
) {

selectedPerson =
person;


document
.querySelectorAll(".person")
.forEach(
function(item) {

item.classList.remove(
"active"
);

}
);


button.classList.add(
"active"
);


const name =
person["Full name"] ||
person.username ||
"BERAKAH User";


document.getElementById(
"chatHeader"
).textContent =
"💬 " + name;


document.getElementById(
"messageInput"
).disabled =
false;


document.getElementById(
"sendButton"
).disabled =
false;


await loadConversation();

}


/* =========================================
   LOAD CONVERSATION
========================================= */

async function loadConversation() {

if (!selectedPerson) {

return;

}


const otherId =
selectedPerson.user_id;


setStatus(
"Loading conversation..."
);


/*
 IMPORTANT:

 messages.sender_id
 messages.receiver_id

 both use Supabase AUTH UUIDs.

*/

const url =
SUPABASE_URL +
"/rest/v1/messages" +
"?select=*" +
"&or=(" +
"and(sender_id.eq." +
encodeURIComponent(currentUser.id) +
",receiver_id.eq." +
encodeURIComponent(otherId) +
")," +
"and(sender_id.eq." +
encodeURIComponent(otherId) +
",receiver_id.eq." +
encodeURIComponent(currentUser.id) +
"))" +
"&order=created_at.asc";


console.log(
"MESSAGES URL:",
url
);


const response =
await fetch(

url,

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load messages:\n\n" +
text
);

}


const messages =
text.trim()
?
JSON.parse(text)
:
[];


displayMessages(
messages
);


setStatus(
"Conversation loaded."
);

}


/* =========================================
   DISPLAY MESSAGES
========================================= */

function displayMessages(
messages
) {

const container =
document.getElementById(
"messages"
);

container.innerHTML =
"";


if (!messages.length) {

container.innerHTML = `

<div class="empty">

💬

<br><br>

No messages yet.

<br>

Send the first message!

</div>

`;

return;

}


messages.forEach(
function(message) {

const row =
document.createElement(
"div"
);


const mine =
String(message.sender_id) ===
String(currentUser.id);


row.className =
"message-row" +
(mine ? " mine" : "");


let time =
"";


if (message.created_at) {

const date =
new Date(
message.created_at
);

if (!isNaN(date.getTime())) {

time =
date.toLocaleString();

}

}


row.innerHTML = `

<div class="bubble">

${safe(message.content || "")}

<div class="message-time">
${safe(time)}
</div>

</div>

`;


container.appendChild(
row
);

});


container.scrollTop =
container.scrollHeight;

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

if (!selectedPerson) {

return;

}


const input =
document.getElementById(
"messageInput"
);

const button =
document.getElementById(
"sendButton"
);


const content =
input.value.trim();


if (!content) {

return;

}


button.disabled =
true;

button.textContent =
"SENDING...";


try {


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/messages",

{

method: "POST",

headers: headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

sender_id:
currentUser.id,

receiver_id:
selectedPerson.user_id,

content:
content

})

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not send message:\n\n" +
text
);

}


input.value =
"";


await loadConversation();


}
catch(error) {

console.error(
"SEND MESSAGE ERROR:",
error
);

setStatus(
error.message
);

}
finally {

button.disabled =
false;

button.textContent =
"SEND";

}

}


/* =========================================
   ENTER TO SEND
========================================= */

document
.getElementById(
"messageInput"
)
.addEventListener(
"keydown",
function(event) {

if (
event.key === "Enter" &&
!event.shiftKey
) {

event.preventDefault();

sendMessage();

}

}
);


/* =========================================
   SEND BUTTON
========================================= */

document
.getElementById(
"sendButton"
)
.addEventListener(
"click",
sendMessage
);


/* =========================================
   LOGOUT
========================================= */

document
.getElementById(
"logoutButton"
)
.addEventListener(
"click",
function() {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

location.href =
"login.html";

}
);


/* =========================================
   START
========================================= */

async function start() {

try {

if (!accessToken) {

location.href =
"login.html";

return;

}


currentUser =
await getCurrentUser();


await loadPeople();


setStatus(
"BERAKAH Messages ready."
);

}
catch(error) {

console.error(
"BERAKAH MESSAGES ERROR:",
error
);

setStatus(
"ERROR:\n\n" +
error.message
);

}

}


start();

</script>

</body>

</html>
