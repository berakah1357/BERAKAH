<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Messages</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

/* HEADER */

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 15px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #2563eb;
}

nav {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

nav a {
    text-decoration: none;
    color: #374151;
    font-weight: bold;
}

nav a:hover {
    color: #2563eb;
}

/* MAIN */

.container {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 15px;
}

.page-title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* LAYOUT */

.messages-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
}

/* SIDEBAR */

.sidebar {
    background: white;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    overflow: hidden;
}

.sidebar-header {
    padding: 18px;
    border-bottom: 1px solid #e5e7eb;
}

.sidebar-header h2 {
    margin: 0 0 12px 0;
    font-size: 20px;
}

.member-select {
    width: 100%;
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: white;
    font-size: 14px;
}

.conversations {
    max-height: 650px;
    overflow-y: auto;
}

.conversation {
    padding: 14px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
}

.conversation:hover {
    background: #f3f4f6;
}

.conversation.active {
    background: #e8f0ff;
}

.conversation-name {
    font-weight: bold;
    margin-bottom: 4px;
}

.conversation-username {
    color: #6b7280;
    font-size: 13px;
}

.conversation-preview {
    margin-top: 7px;
    color: #6b7280;
    font-size: 13px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.no-conversations {
    padding: 25px;
    text-align: center;
    color: #6b7280;
}

/* CHAT */

.chat {
    background: white;
    border-radius: 12px;
    border: 1px solid #e5e7eb;

    min-height: 700px;

    display: flex;
    flex-direction: column;
}

.chat-header {
    padding: 18px;
    border-bottom: 1px solid #e5e7eb;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chat-user {
    font-weight: bold;
    font-size: 18px;
}

.chat-user a {
    color: #2563eb;
    text-decoration: none;
}

.chat-user small {
    display: block;
    color: #6b7280;
    font-size: 13px;
    margin-top: 3px;
}

.refresh-btn {
    border: none;
    background: #f3f4f6;
    padding: 9px 12px;
    border-radius: 7px;
    cursor: pointer;
}

.refresh-btn:hover {
    background: #e5e7eb;
}

/* CHAT BODY */

.chat-body {
    flex: 1;
    padding: 20px;

    overflow-y: auto;

    display: flex;
    flex-direction: column;
    gap: 12px;

    min-height: 520px;
}

.empty-chat {
    margin: auto;
    text-align: center;
    color: #6b7280;
}

.empty-chat h2 {
    color: #374151;
}

/* MESSAGE */

.message-row {
    display: flex;
}

.message-row.mine {
    justify-content: flex-end;
}

.message-row.theirs {
    justify-content: flex-start;
}

.message {
    max-width: 75%;
    padding: 11px 14px;
    border-radius: 14px;
}

.message.mine {
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 4px;
}

.message.theirs {
    background: #f3f4f6;
    color: #111827;
    border-bottom-left-radius: 4px;
}

.message-content {
    white-space: pre-wrap;
    word-break: break-word;
}

.message-meta {
    margin-top: 5px;
    font-size: 10px;
    opacity: 0.7;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.delete-message {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 10px;
    padding: 0;
}

/* COMPOSER */

.composer {
    border-top: 1px solid #e5e7eb;
    padding: 15px;

    display: flex;
    gap: 10px;
}

.message-input {
    flex: 1;

    border: 1px solid #d1d5db;
    border-radius: 9px;

    padding: 12px;

    font-size: 15px;

    resize: none;
    min-height: 45px;
    max-height: 120px;
}

.send-btn {
    border: none;
    background: #2563eb;
    color: white;

    padding: 0 20px;

    border-radius: 9px;

    font-weight: bold;
    cursor: pointer;
}

.send-btn:hover {
    background: #1d4ed8;
}

.send-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

/* STATUS */

.status {
    padding: 10px 15px;
    font-size: 13px;
    color: #6b7280;
}

.error {
    color: #dc2626;
}

.success {
    color: #16a34a;
}

/* MOBILE */

@media (max-width: 800px) {

    header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
    }

    nav {
        gap: 10px;
    }

    .messages-layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        order: 2;
    }

    .chat {
        order: 1;
        min-height: 650px;
    }

    .conversations {
        max-height: 250px;
    }

    .message {
        max-width: 88%;
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">
        BERAKAH
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="feed.html">Feed</a>

        <a href="people.html">👥 People</a>

        <a href="marketplace.html">Market</a>

        <a href="notifications.html">🔔 Notifications</a>

        <a href="messages.html">💬 Messages</a>

        <a href="#" onclick="logout()">Logout</a>

    </nav>

</header>


<div class="container">

    <div class="page-title">
        💬 Messages
    </div>

    <div id="status" class="status">
        Loading...
    </div>

    <div class="messages-layout">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <div class="sidebar-header">

                <h2>
                    New Message
                </h2>

                <select
                    id="memberSelect"
                    class="member-select"
                >

                    <option value="">
                        Choose a member...
                    </option>

                </select>

            </div>

            <div
                id="conversations"
                class="conversations"
            >

                <div class="no-conversations">
                    No conversations yet.
                </div>

            </div>

        </div>


        <!-- CHAT -->

        <div class="chat">

            <div class="chat-header">

                <div
                    id="chatUser"
                    class="chat-user"
                >
                    Select a member
                </div>

                <button
                    class="refresh-btn"
                    onclick="loadCurrentConversation()"
                >
                    🔄 Refresh
                </button>

            </div>


            <div
                id="chatBody"
                class="chat-body"
            >

                <div class="empty-chat">

                    <h2>
                        💬 Your Messages
                    </h2>

                    <p>
                        Choose a member to start a conversation.
                    </p>

                </div>

            </div>


            <div class="composer">

                <textarea
                    id="messageInput"
                    class="message-input"
                    placeholder="Write a message..."
                    disabled
                ></textarea>

                <button
                    id="sendButton"
                    class="send-btn"
                    onclick="sendMessage()"
                    disabled
                >
                    Send
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* ============================================
   SUPABASE
============================================ */

const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* ============================================
   STATE
============================================ */

let accessToken =
    localStorage.getItem(
        "berakah_access_token"
    );

let currentUser = null;

let currentProfile = null;

let selectedUser = null;

let allProfiles = [];

let allMessages = [];

let refreshTimer = null;


/* ============================================
   SUPABASE REQUEST
============================================ */

async function supabaseRequest(
    endpoint,
    options = {}
) {

    const headers = {

        "apikey": SUPABASE_KEY,

        "Authorization":
            "Bearer " + accessToken,

        "Content-Type":
            "application/json",

        ...(options.headers || {})

    };

    return fetch(
        SUPABASE_URL + endpoint,
        {
            ...options,
            headers
        }
    );

}


/* ============================================
   STATUS
============================================ */

function setStatus(
    message,
    type = ""
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* ============================================
   ESCAPE HTML
============================================ */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================
   PROFILE NAME
============================================ */

function getProfileName(profile) {

    return (
        profile["Full name"] ||
        profile.full_name ||
        profile.name ||
        profile.username ||
        "BERAKAH Member"
    );

}


/* ============================================
   FIND PROFILE
============================================ */

function findProfile(userId) {

    return allProfiles.find(
        profile =>
            profile.user_id === userId
    );

}


/* ============================================
   DATE
============================================ */

function formatDate(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleString(
        [],
        {
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


/* ============================================
   LOGOUT
============================================ */

function logout() {

    localStorage.removeItem(
        "berakah_access_token"
    );

    localStorage.removeItem(
        "berakah_refresh_token"
    );

    window.location.href =
        "login.html";

}


/* ============================================
   LOGIN CHECK
============================================ */

async function checkLogin() {

    if (!accessToken) {

        window.location.href =
            "login.html";

        return false;

    }


    const response =
        await supabaseRequest(
            "/auth/v1/user"
        );


    if (!response.ok) {

        localStorage.removeItem(
            "berakah_access_token"
        );

        localStorage.removeItem(
            "berakah_refresh_token"
        );

        window.location.href =
            "login.html";

        return false;

    }


    currentUser =
        await response.json();

    return true;

}


/* ============================================
   LOAD MY PROFILE
============================================ */

async function loadMyProfile() {

    const response =
        await supabaseRequest(
            "/rest/v1/profiles" +
            "?select=*" +
            "&user_id=eq." +
            encodeURIComponent(
                currentUser.id
            )
        );


    if (!response.ok) {

        throw new Error(
            "Could not load your profile."
        );

    }


    const profiles =
        await response.json();


    if (!profiles.length) {

        throw new Error(
            "Your BERAKAH profile was not found."
        );

    }


    currentProfile =
        profiles[0];

}


/* ============================================
   LOAD MEMBERS
============================================ */

async function loadMembers() {

    const response =
        await supabaseRequest(
            "/rest/v1/profiles" +
            "?select=id,user_id,%22Full%20name%22,username,language" +
            "&order=id.asc"
        );


    if (!response.ok) {

        throw new Error(
            "Could not load members."
        );

    }


    allProfiles =
        await response.json();


    const select =
        document.getElementById(
            "memberSelect"
        );


    select.innerHTML =
        `<option value="">
            Choose a member...
         </option>`;


    allProfiles
        .filter(
            profile =>
                profile.user_id !==
                currentUser.id
        )
        .forEach(
            profile => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    profile.user_id;

                option.textContent =
                    getProfileName(
                        profile
                    ) +
                    " @" +
                    (
                        profile.username ||
                        ""
                    );

                select.appendChild(
                    option
                );

            }
        );

}


/* ============================================
   MEMBER SELECT
============================================ */

document
    .getElementById(
        "memberSelect"
    )
    .addEventListener(
        "change",
        async function() {

            const userId =
                this.value;


            if (!userId) {
                return;
            }


            const profile =
                findProfile(
                    userId
                );


            if (!profile) {
                return;
            }


            await openConversation(
                profile
            );

        }
    );


/* ============================================
   LOAD MESSAGES
============================================ */

async function loadAllMessages() {

    const response =
        await supabaseRequest(
            "/rest/v1/messages" +
            "?select=*" +
            "&order=%22Created%20time%22.asc"
        );


    if (!response.ok) {

        const error =
            await response.text();

        throw new Error(
            "Could not load messages: " +
            error
        );

    }


    allMessages =
        await response.json();

}


/* ============================================
   GET MESSAGE TIME
============================================ */

function getMessageTime(message) {

    return (
        message["Created time"] ||
        message.created_time ||
        message.created_at
    );

}


/* ============================================
   BUILD CONVERSATIONS
============================================ */

function buildConversations() {

    const container =
        document.getElementById(
            "conversations"
        );


    const conversationMap =
        new Map();


    allMessages.forEach(
        message => {

            const otherUser =
                message.sender_id ===
                currentUser.id

                ? message.receiver_id

                : message.sender_id;


            conversationMap.set(
                otherUser,
                message
            );

        }
    );


    if (
        conversationMap.size ===
        0
    ) {

        container.innerHTML =
            `<div class="no-conversations">
                No conversations yet.
             </div>`;

        return;

    }


    const conversations =
        Array.from(
            conversationMap.entries()
        )
        .sort(
            (a, b) => {

                return (
                    new Date(
                        getMessageTime(
                            b[1]
                        )
                    ) -
                    new Date(
                        getMessageTime(
                            a[1]
                        )
                    )
                );

            }
        );


    container.innerHTML = "";


    conversations.forEach(
        ([userId, latestMessage]) => {

            const profile =
                findProfile(
                    userId
                );


            if (!profile) {
                return;
            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "conversation";


            if (
                selectedUser &&
                selectedUser.user_id ===
                userId
            ) {

                div.classList.add(
                    "active"
                );

            }


            div.innerHTML = `

                <div class="conversation-name">
                    ${escapeHTML(
                        getProfileName(
                            profile
                        )
                    )}
                </div>

                <div class="conversation-username">
                    @${escapeHTML(
                        profile.username ||
                        ""
                    )}
                </div>

                <div class="conversation-preview">
                    ${escapeHTML(
                        latestMessage.content ||
                        ""
                    )}
                </div>

            `;


            div.onclick =
                () =>
                    openConversation(
                        profile
                    );


            container.appendChild(
                div
            );

        }
    );

}


/* ============================================
   OPEN CONVERSATION
============================================ */

async function openConversation(
    profile
) {

    selectedUser =
        profile;


    document
        .getElementById(
            "memberSelect"
        )
        .value =
            profile.user_id;


    const name =
        getProfileName(
            profile
        );


    const username =
        profile.username ||
        "";


    document
        .getElementById(
            "chatUser"
        )
        .innerHTML = `

            <a href="profile.html?id=${encodeURIComponent(
                profile.id
            )}">
                ${escapeHTML(name)}
            </a>

            <small>
                @${escapeHTML(username)}
            </small>

        `;


    document
        .getElementById(
            "messageInput"
        )
        .disabled =
            false;


    document
        .getElementById(
            "sendButton"
        )
        .disabled =
            false;


    renderConversation();

    buildConversations();

}


/* ============================================
   RENDER CONVERSATION
============================================ */

function renderConversation() {

    const body =
        document.getElementById(
            "chatBody"
        );


    if (!selectedUser) {

        body.innerHTML = `

            <div class="empty-chat">

                <h2>
                    💬 Your Messages
                </h2>

                <p>
                    Choose a member to start a conversation.
                </p>

            </div>

        `;

        return;

    }


    const conversationMessages =
        allMessages.filter(
            message => {

                return (

                    (
                        message.sender_id ===
                        currentUser.id

                        &&

                        message.receiver_id ===
                        selectedUser.user_id
                    )

                    ||

                    (
                        message.sender_id ===
                        selectedUser.user_id

                        &&

                        message.receiver_id ===
                        currentUser.id
                    )

                );

            }
        );


    if (
        conversationMessages.length ===
        0
    ) {

        body.innerHTML = `

            <div class="empty-chat">

                <h2>
                    👋 Start the conversation
                </h2>

                <p>
                    Send a message to
                    ${escapeHTML(
                        getProfileName(
                            selectedUser
                        )
                    )}.
                </p>

            </div>

        `;

        return;

    }


    body.innerHTML = "";


    conversationMessages.forEach(
        message => {

            const mine =
                message.sender_id ===
                currentUser.id;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row " +
                (
                    mine
                        ? "mine"
                        : "theirs"
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message " +
                (
                    mine
                        ? "mine"
                        : "theirs"
                );


            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "message-content";


            content.textContent =
                message.content ||
                "";


            const meta =
                document.createElement(
                    "div"
                );


            meta.className =
                "message-meta";


            const time =
                document.createElement(
                    "span"
                );


            time.textContent =
                formatDate(
                    getMessageTime(
                        message
                    )
                );


            meta.appendChild(
                time
            );


            if (mine) {

                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete-message";


                deleteButton.textContent =
                    "Delete";


                deleteButton.onclick =
                    () =>
                        deleteMessage(
                            message.id
                        );


                meta.appendChild(
                    deleteButton
                );

            }


            bubble.appendChild(
                content
            );

            bubble.appendChild(
                meta
            );

            row.appendChild(
                bubble
            );

            body.appendChild(
                row
            );

        }
    );


    body.scrollTop =
        body.scrollHeight;

}


/* ============================================
   SEND MESSAGE
============================================ */

async function sendMessage() {

    if (!selectedUser) {

        alert(
            "Choose a member first."
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const content =
        input.value.trim();


    if (!content) {
        return;
    }


    button.disabled =
        true;


    const response =
        await supabaseRequest(
            "/rest/v1/messages",
            {
                method: "POST",

                headers: {
                    "Prefer":
                        "return=minimal"
                },

                body:
                    JSON.stringify({

                        sender_id:
                            currentUser.id,

                        receiver_id:
                            selectedUser.user_id,

                        content:
                            content

                    })

            }
        );


    if (!response.ok) {

        const error =
            await response.text();

        console.error(
            error
        );

        alert(
            "Could not send message."
        );

        button.disabled =
            false;

        return;

    }


    input.value = "";


    await loadAllMessages();


    buildConversations();

    renderConversation();


    button.disabled =
        false;


    setStatus(
        "Message sent.",
        "success"
    );

}


/* ============================================
   DELETE MESSAGE
============================================ */

async function deleteMessage(
    messageId
) {

    if (
        !confirm(
            "Delete this message?"
        )
    ) {
        return;
    }


    const response =
        await supabaseRequest(
            "/rest/v1/messages" +
            "?id=eq." +
            encodeURIComponent(
                messageId
            ),
            {
                method:
                    "DELETE"
            }
        );


    if (!response.ok) {

        const error =
            await response.text();

        console.error(
            error
        );

        alert(
            "Could not delete message."
        );

        return;

    }


    await loadAllMessages();

    buildConversations();

    renderConversation();

}


/* ============================================
   REFRESH
============================================ */

async function loadCurrentConversation() {

    try {

        await loadAllMessages();

        buildConversations();

        renderConversation();

        setStatus(
            "Messages refreshed.",
            "success"
        );

    }
    catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message,
            "error"
        );

    }

}


/* ============================================
   ENTER TO SEND
============================================ */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* ============================================
   INITIALIZE
============================================ */

async function initialize() {

    try {

        setStatus(
            "Checking login..."
        );


        const loggedIn =
            await checkLogin();


        if (!loggedIn) {
            return;
        }


        setStatus(
            "Loading profile..."
        );


        await loadMyProfile();


        setStatus(
            "Loading members..."
        );


        await loadMembers();


        setStatus(
            "Loading messages..."
        );


        await loadAllMessages();


        buildConversations();


        setStatus(
            "Messages ready.",
            "success"
        );


        /*
         * Automatically refresh every 5 seconds.
         */

        refreshTimer =
            setInterval(
                async function() {

                    try {

                        await loadAllMessages();

                        buildConversations();

                        renderConversation();

                    }
                    catch (error) {

                        console.error(
                            "Refresh error:",
                            error
                        );

                    }

                },
                5000
            );

    }
    catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message ||
            "Something went wrong.",
            "error"
        );

    }

}


/* ============================================
   START
============================================ */

initialize();

</script>

</body>
