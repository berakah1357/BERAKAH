<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Feed</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

/* =========================
   HEADER
========================= */

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav {
    max-width: 1100px;
    margin: auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #111827;
    text-decoration: none;
}

.nav-links {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}

.nav-links a,
.logout-btn {
    text-decoration: none;
    color: #374151;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
}

.nav-links a:hover,
.logout-btn:hover {
    background: #f3f4f6;
}

.logout-btn {
    border: none;
    background: transparent;
    font-family: inherit;
}

/* =========================
   PAGE
========================= */

.container {
    max-width: 760px;
    margin: 25px auto;
    padding: 0 15px;
}

.page-title {
    font-size: 28px;
    margin: 0 0 18px;
}

/* =========================
   CREATE POST
========================= */

.create-post {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.create-post h2 {
    margin: 0 0 14px;
    font-size: 18px;
}

textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 12px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    outline: none;
}

textarea:focus {
    border-color: #2563eb;
}

.create-bottom {
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.file-label {
    display: inline-block;
    background: #f3f4f6;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.file-label:hover {
    background: #e5e7eb;
}

#postImage {
    display: none;
}

#imageName {
    font-size: 12px;
    color: #6b7280;
    margin-top: 7px;
}

.post-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.post-btn:hover {
    background: #1d4ed8;
}

.post-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* =========================
   STATUS
========================= */

.status {
    text-align: center;
    margin: 15px 0;
    color: #6b7280;
    font-size: 14px;
}

.error {
    color: #dc2626;
}

.success {
    color: #16a34a;
}

/* =========================
   POST CARD
========================= */

.post {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 16px 10px;
}

.author {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
}

.avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    background: #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #374151;
    overflow: hidden;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.author-name {
    font-weight: bold;
    font-size: 15px;
}

.username {
    color: #6b7280;
    font-size: 13px;
    margin-top: 2px;
}

.post-date {
    color: #9ca3af;
    font-size: 12px;
}

.post-content {
    padding: 5px 16px 15px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
    font-size: 15px;
}

.post-image {
    width: 100%;
    max-height: 600px;
    object-fit: cover;
    display: block;
}

.post-actions {
    border-top: 1px solid #f0f0f0;
    padding: 10px 16px;
    display: flex;
    gap: 10px;
}

.action-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    color: #4b5563;
    padding: 7px 10px;
    border-radius: 7px;
}

.action-btn:hover {
    background: #f3f4f6;
}

.delete-btn {
    margin-left: auto;
    color: #dc2626;
}

.delete-btn:hover {
    background: #fef2f2;
}

/* =========================
   EMPTY
========================= */

.empty {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 40px 20px;
    text-align: center;
    color: #6b7280;
}

.refresh-btn {
    margin-top: 15px;
    background: #111827;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .nav {
        padding: 12px;
        align-items: flex-start;
        flex-direction: column;
    }

    .nav-links {
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
    }

    .nav-links a,
    .logout-btn {
        white-space: nowrap;
    }

    .container {
        margin-top: 18px;
        padding: 0 10px;
    }

    .page-title {
        font-size: 24px;
    }

    .create-bottom {
        align-items: stretch;
        flex-direction: column;
    }

    .post-btn {
        width: 100%;
    }

}

</style>

</head>

<body>

<header>

    <div class="nav">

        <a class="logo" href="index.html">
            BERAKAH
        </a>

        <nav class="nav-links">

            <a href="index.html">Home</a>

            <a href="feed.html">Feed</a>

            <a href="people.html">👥 People</a>

            <a href="marketplace.html">Market</a>

            <a href="notifications.html">🔔</a>

            <a href="messages.html">💬</a>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </nav>

    </div>

</header>


<main class="container">

    <h1 class="page-title">
        Feed
    </h1>


    <!-- CREATE POST -->

    <section class="create-post">

        <h2>
            Create a post
        </h2>

        <textarea
            id="postContent"
            placeholder="What's on your mind?"
        ></textarea>

        <div id="imageName"></div>

        <div class="create-bottom">

            <label class="file-label">

                📷 Add Image

                <input
                    type="file"
                    id="postImage"
                    accept="image/*"
                >

            </label>

            <button
                class="post-btn"
                id="publishBtn"
                onclick="createPost()"
            >
                POST
            </button>

        </div>

    </section>


    <div id="status" class="status"></div>


    <section id="feed"></section>

</main>


<script>

/* =========================================================
   BERAKAH SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken =
    localStorage.getItem("berakah_access_token");

let currentUser = null;


/* =========================================================
   SUPABASE HEADERS
========================================================= */

function supabaseHeaders(extra = {}) {

    return {

        "apikey": SUPABASE_KEY,

        "Authorization":
            "Bearer " + accessToken,

        ...extra

    };

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(message, type = "") {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.className =
        "status " + type;

}


/* =========================================================
   GET LOGGED-IN USER
========================================================= */

async function getCurrentUser() {

    if (!accessToken) {

        window.location.href =
            "login.html";

        return null;
    }


    const response = await fetch(

        SUPABASE_URL +
        "/auth/v1/user",

        {
            method: "GET",

            headers:
                supabaseHeaders()
        }

    );


    if (!response.ok) {

        localStorage.removeItem(
            "berakah_access_token"
        );

        localStorage.removeItem(
            "berakah_refresh_token"
        );

        window.location.href =
            "login.html";

        return null;
    }


    currentUser =
        await response.json();

    return currentUser;

}


/* =========================================================
   LOAD FEED
========================================================= */

async function loadFeed() {

    const feed =
        document.getElementById("feed");

    feed.innerHTML = "";

    showStatus("Loading posts...");


    try {

        /*
         IMPORTANT:
         posts.user_id is the Supabase Auth UUID.
        */

        const postsUrl =
            SUPABASE_URL +
            "/rest/v1/posts" +
            "?select=*" +
            "&order=created_at.desc";


        const response =
            await fetch(
                postsUrl,
                {
                    method: "GET",
                    headers:
                        supabaseHeaders()
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);
        }


        const posts =
            await response.json();


        if (!posts || posts.length === 0) {

            showEmpty();

            return;
        }


        /*
         Load profile information for
         each post author.
        */

        const userIds = [
            ...new Set(
                posts
                    .map(post => post.user_id)
                    .filter(Boolean)
            )
        ];


        let profiles = [];


        if (userIds.length > 0) {

            const profileFilter =
                userIds
                    .map(id =>
                        `"${id}"`
                    )
                    .join(",");


            const profileUrl =
                SUPABASE_URL +
                "/rest/v1/profiles" +
                "?select=*" +
                "&user_id=in.(" +
                userIds.join(",") +
                ")";


            const profileResponse =
                await fetch(
                    profileUrl,
                    {
                        method: "GET",
                        headers:
                            supabaseHeaders()
                    }
                );


            if (profileResponse.ok) {

                profiles =
                    await profileResponse.json();

            }

        }


        const profileMap = {};

        profiles.forEach(profile => {

            profileMap[
                profile.user_id
            ] = profile;

        });


        posts.forEach(post => {

            const profile =
                profileMap[post.user_id] || null;

            feed.appendChild(
                createPostCard(
                    post,
                    profile
                )
            );

        });


        showStatus(
            posts.length +
            (posts.length === 1
                ? " post"
                : " posts")
        );


    } catch (error) {

        console.error(
            "Feed error:",
            error
        );

        showStatus(
            "Could not load the feed.",
            "error"
        );

        feed.innerHTML = `
            <div class="empty">
                <strong>Something went wrong.</strong>
                <br><br>
                Please refresh the page.
                <br>
                <button
                    class="refresh-btn"
                    onclick="loadFeed()"
                >
                    Refresh Feed
                </button>
            </div>
        `;

    }

}


/* =========================================================
   CREATE POST CARD
========================================================= */

function createPostCard(post, profile) {

    const article =
        document.createElement("article");

    article.className = "post";


    const fullName =
        profile
            ? (
                profile["Full name"] ||
                profile.full_name ||
                profile.name ||
                profile.username ||
                "BERAKAH Member"
            )
            : "BERAKAH Member";


    const username =
        profile && profile.username
            ? profile.username
            : "";


    const avatarUrl =
        profile && profile.avatar_url
            ? profile.avatar_url
            : "";


    const profileId =
        profile && profile.id
            ? profile.id
            : null;


    const isOwnPost =
        currentUser &&
        post.user_id === currentUser.id;


    const formattedDate =
        formatDate(post.created_at);


    let avatarHTML = "";


    if (avatarUrl) {

        avatarHTML = `
            <div class="avatar">
                <img
                    src="${escapeAttribute(avatarUrl)}"
                    alt="Profile"
                >
            </div>
        `;

    } else {

        const firstLetter =
            escapeHTML(
                fullName
                    .charAt(0)
                    .toUpperCase()
            );

        avatarHTML = `
            <div class="avatar">
                ${firstLetter}
            </div>
        `;

    }


    let authorHTML;


    if (profileId) {

        authorHTML = `
            <a
                class="author"
                href="profile.html?id=${encodeURIComponent(profileId)}"
            >

                ${avatarHTML}

                <div>

                    <div class="author-name">
                        ${escapeHTML(fullName)}
                    </div>

                    ${
                        username
                        ? `
                            <div class="username">
                                @${escapeHTML(
                                    username.replace(/^@/, "")
                                )}
                            </div>
                          `
                        : ""
                    }

                </div>

            </a>
        `;

    } else {

        authorHTML = `
            <div class="author">

                ${avatarHTML}

                <div>

                    <div class="author-name">
                        ${escapeHTML(fullName)}
                    </div>

                    ${
                        username
                        ? `
                            <div class="username">
                                @${escapeHTML(
                                    username.replace(/^@/, "")
                                )}
                            </div>
                          `
                        : ""
                    }

                </div>

            </div>
        `;

    }


    let imageHTML = "";

    const imageUrl =
        post.image_url ||
        post.image ||
        null;


    if (imageUrl) {

        imageHTML = `
            <img
                class="post-image"
                src="${escapeAttribute(imageUrl)}"
                alt="Post image"
                loading="lazy"
            >
        `;

    }


    let deleteButton = "";


    if (isOwnPost) {

        deleteButton = `
            <button
                class="action-btn delete-btn"
                onclick="deletePost('${escapeAttribute(post.id)}')"
            >
                🗑 Delete
            </button>
        `;

    }


    article.innerHTML = `

        <div class="post-header">

            ${authorHTML}

            <div class="post-date">
                ${formattedDate}
            </div>

        </div>


        ${
            post.content
            ? `
                <div class="post-content">
                    ${escapeHTML(post.content)}
                </div>
              `
            : ""
        }


        ${imageHTML}


        <div class="post-actions">

            <button
                class="action-btn"
                type="button"
                onclick="showLikeMessage()"
            >
                ❤️ Like
            </button>

            ${deleteButton}

        </div>

    `;


    return article;

}


/* =========================================================
   CREATE POST
========================================================= */

async function createPost() {

    const contentInput =
        document.getElementById(
            "postContent"
        );

    const imageInput =
        document.getElementById(
            "postImage"
        );

    const publishBtn =
        document.getElementById(
            "publishBtn"
        );


    const content =
        contentInput.value.trim();


    const file =
        imageInput.files[0] || null;


    if (!content && !file) {

        showStatus(
            "Write something or choose an image.",
            "error"
        );

        return;
    }


    publishBtn.disabled = true;

    publishBtn.textContent =
        "POSTING...";


    try {

        let imageUrl = null;


        /*
         If an image is selected,
         save it as a Data URL.

         This works with the existing
         image_url text field.
        */

        if (file) {

            if (!file.type.startsWith("image/")) {

                throw new Error(
                    "Please select an image file."
                );

            }


            if (file.size > 5 * 1024 * 1024) {

                throw new Error(
                    "Image must be smaller than 5 MB."
                );

            }


            imageUrl =
                await fileToDataURL(file);

        }


        const postData = {

            user_id:
                currentUser.id,

            content:
                content || null,

            image_url:
                imageUrl

        };


        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/posts",

                {
                    method: "POST",

                    headers:
                        supabaseHeaders({
                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=representation"
                        }),

                    body:
                        JSON.stringify(
                            postData
                        )
                }

            );


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);
        }


        contentInput.value = "";

        imageInput.value = "";

        document.getElementById(
            "imageName"
        ).textContent = "";


        showStatus(
            "Post published successfully! 🎉",
            "success"
        );


        await loadFeed();


    } catch (error) {

        console.error(
            "Create post error:",
            error
        );

        showStatus(
            error.message ||
            "Could not publish post.",
            "error"
        );

    } finally {

        publishBtn.disabled = false;

        publishBtn.textContent =
            "POST";

    }

}


/* =========================================================
   DELETE POST
========================================================= */

async function deletePost(postId) {

    if (!postId) {

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this post?"
        );


    if (!confirmed) {

        return;
    }


    try {

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/posts" +
                "?id=eq." +
                encodeURIComponent(postId) +
                "&user_id=eq." +
                encodeURIComponent(
                    currentUser.id
                ),

                {
                    method: "DELETE",

                    headers:
                        supabaseHeaders()
                }

            );


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);
        }


        showStatus(
            "Post deleted.",
            "success"
        );


        await loadFeed();


    } catch (error) {

        console.error(
            "Delete error:",
            error
        );

        showStatus(
            "Could not delete the post.",
            "error"
        );

    }

}


/* =========================================================
   IMAGE TO DATA URL
========================================================= */

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload = () =>
                resolve(
                    reader.result
                );


            reader.onerror = () =>
                reject(
                    new Error(
                        "Could not read image."
                    )
                );


            reader.readAsDataURL(file);

        }
    );

}


/* =========================================================
   IMAGE NAME
========================================================= */

document
    .getElementById("postImage")
    .addEventListener(
        "change",
        function () {

            const imageName =
                document.getElementById(
                    "imageName"
                );


            if (this.files.length > 0) {

                imageName.textContent =
                    "Selected: " +
                    this.files[0].name;

            } else {

                imageName.textContent = "";

            }

        }
    );


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(dateString) {

    if (!dateString) {

        return "";
    }


    const date =
        new Date(dateString);


    if (isNaN(date.getTime())) {

        return "";
    }


    return date.toLocaleString(
        undefined,
        {
            month: "short",
            day: "numeric",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   EMPTY FEED
========================================================= */

function showEmpty() {

    showStatus("");

    document.getElementById(
        "feed"
    ).innerHTML = `

        <div class="empty">

            <h3>No posts yet</h3>

            <p>
                Be the first person to post
                something on BERAKAH.
            </p>

        </div>

    `;

}


/* =========================================================
   LIKE PLACEHOLDER
========================================================= */

function showLikeMessage() {

    showStatus(
        "Likes are coming next. ❤️"
    );

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";
    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    try {

        if (accessToken) {

            await fetch(
                SUPABASE_URL +
                "/auth/v1/logout",

                {
                    method: "POST",

                    headers:
                        supabaseHeaders()
                }
            );

        }

    } catch (error) {

        console.error(
            "Logout error:",
            error
        );

    }


    localStorage.removeItem(
        "berakah_access_token"
    );

    localStorage.removeItem(
        "berakah_refresh_token"
    );


    window.location.href =
        "login.html";

}


/* =========================================================
   START
========================================================= */

async function startFeed() {

    const user =
        await getCurrentUser();


    if (!user) {

        return;
    }


    await loadFeed();

}


startFeed();

</script>

</body>
</html>
