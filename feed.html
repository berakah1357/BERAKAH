<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BERAKAH - Feed</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}


/* ==========================================
   HEADER
========================================== */

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav {
    max-width: 1100px;
    margin: auto;
    padding: 14px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #111827;
    text-decoration: none;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.nav-links a,
.logout-btn {
    text-decoration: none;
    color: #374151;

    padding: 8px 10px;

    border-radius: 8px;

    font-size: 14px;

    cursor: pointer;
}

.nav-links a:hover,
.logout-btn:hover {
    background: #f3f4f6;
}

.logout-btn {
    border: none;
    background: transparent;
    font-family: inherit;
}


/* ==========================================
   MAIN
========================================== */

.container {
    max-width: 760px;

    margin: 25px auto;

    padding: 0 15px;
}

.page-title {
    font-size: 28px;

    margin:
        0 0 18px;
}


/* ==========================================
   CREATE POST
========================================== */

.create-post {
    background: white;

    border:
        1px solid #e5e7eb;

    border-radius: 14px;

    padding: 18px;

    margin-bottom: 22px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.04);
}

.create-post h2 {
    margin:
        0 0 14px;

    font-size: 18px;
}

textarea {
    width: 100%;

    min-height: 110px;

    resize: vertical;

    border:
        1px solid #d1d5db;

    border-radius: 10px;

    padding: 12px;

    font-family: Arial, sans-serif;

    font-size: 15px;

    outline: none;
}

textarea:focus {
    border-color: #2563eb;
}

.create-bottom {
    margin-top: 12px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}

.file-label {
    display: inline-block;

    background: #f3f4f6;

    padding: 10px 14px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 14px;
}

.file-label:hover {
    background: #e5e7eb;
}

#postImage {
    display: none;
}

#imageName {
    font-size: 12px;

    color: #6b7280;

    margin-top: 7px;
}

.post-btn {
    background: #2563eb;

    color: white;

    border: none;

    padding: 11px 18px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;
}

.post-btn:hover {
    background: #1d4ed8;
}

.post-btn:disabled {
    opacity: 0.6;

    cursor: not-allowed;
}


/* ==========================================
   STATUS
========================================== */

.status {
    text-align: center;

    margin: 15px 0;

    color: #6b7280;

    font-size: 14px;
}

.error {
    color: #dc2626;
}

.success {
    color: #16a34a;
}


/* ==========================================
   POST
========================================== */

.post {
    background: white;

    border:
        1px solid #e5e7eb;

    border-radius: 14px;

    margin-bottom: 18px;

    overflow: hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.04);
}

.post-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        15px 16px 10px;
}

.author {
    display: flex;

    align-items: center;

    gap: 10px;

    text-decoration: none;

    color: inherit;
}

.avatar {
    width: 44px;
    height: 44px;

    border-radius: 50%;

    object-fit: cover;

    background: #e5e7eb;

    display: flex;

    align-items: center;
    justify-content: center;

    font-weight: bold;

    color: #374151;

    overflow: hidden;

    flex-shrink: 0;
}

.avatar img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.author-name {
    font-weight: bold;

    font-size: 15px;
}

.username {
    color: #6b7280;

    font-size: 13px;

    margin-top: 2px;
}

.post-date {
    color: #9ca3af;

    font-size: 12px;
}

.post-content {
    padding:
        5px 16px 15px;

    white-space: pre-wrap;

    word-break: break-word;

    line-height: 1.5;

    font-size: 15px;
}

.post-image {
    width: 100%;

    max-height: 600px;

    object-fit: cover;

    display: block;
}


/* ==========================================
   POST ACTIONS
========================================== */

.post-actions {
    border-top:
        1px solid #f0f0f0;

    padding:
        10px 16px;

    display: flex;

    align-items: center;

    gap: 10px;
}

.action-btn {
    background: transparent;

    border: none;

    cursor: pointer;

    color: #4b5563;

    padding:
        7px 10px;

    border-radius: 7px;

    font-size: 14px;
}

.action-btn:hover {
    background: #f3f4f6;
}


/* ==========================================
   LIKE BUTTON
========================================== */

.like-btn {
    display: flex;

    align-items: center;

    gap: 5px;
}

.like-btn.liked {
    color: #dc2626;

    font-weight: bold;
}

.like-count {
    color: #6b7280;

    font-size: 13px;

    min-width: 10px;
}


/* ==========================================
   DELETE
========================================== */

.delete-btn {
    margin-left: auto;

    color: #dc2626;
}

.delete-btn:hover {
    background: #fef2f2;
}


/* ==========================================
   EMPTY
========================================== */

.empty {
    background: white;

    border:
        1px solid #e5e7eb;

    border-radius: 14px;

    padding: 40px 20px;

    text-align: center;

    color: #6b7280;
}

.refresh-btn {
    margin-top: 15px;

    background: #111827;

    color: white;

    border: none;

    padding: 10px 16px;

    border-radius: 8px;

    cursor: pointer;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 700px) {

    .nav {
        padding: 12px;

        align-items: flex-start;

        flex-direction: column;
    }

    .nav-links {
        width: 100%;

        overflow-x: auto;

        flex-wrap: nowrap;
    }

    .nav-links a,
    .logout-btn {
        white-space: nowrap;
    }

    .container {
        margin-top: 18px;

        padding:
            0 10px;
    }

    .page-title {
        font-size: 24px;
    }

    .create-bottom {
        align-items: stretch;

        flex-direction: column;
    }

    .post-btn {
        width: 100%;
    }

    .post-header {
        gap: 10px;
    }

    .post-date {
        text-align: right;
    }

}

</style>

</head>

<header>

    <div class="nav">

        <a
            class="logo"
            href="index.html"
        >
            BERAKAH
        </a>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="feed.html">
                Feed
            </a>

            <a href="people.html">
                👥 People
            </a>

            <a href="marketplace.html">
                Market
            </a>

            <a href="notifications.html">
                🔔
            </a>

            <a href="messages.html">
                💬
            </a>

                onclick="logout()"

            </button>

</header>



<main class="container">


    <h1 class="page-title">
        Feed
    </h1>


    <!-- CREATE POST -->

    <section class="create-post">

        <h2>
            Create a post
        </h2>


        <textarea
            id="postContent"
            placeholder="What's on your mind?"
        ></textarea>


        <div id="imageName"></div>

                id="publishBtn"

            </button>

        </div>

    </section>


    <div
        id="status"
        class="status"
    ></div>


    <section id="feed"></section>


</main>



<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken =
    localStorage.getItem(
        "berakah_access_token"
    );


let currentUser = null;


/* =========================================================
   HEADERS
========================================================= */

function supabaseHeaders(extra = {}) {

    return {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " + accessToken,

        ...extra

    };

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type = ""
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* =========================================================
   CURRENT USER
========================================================= */

async function getCurrentUser() {

    if (!accessToken) {

        window.location.href =
            "login.html";

        return null;
    }


    const response =
        await fetch(

            SUPABASE_URL +
            "/auth/v1/user",

            {
                method: "GET",

                headers:
                    supabaseHeaders()
            }

        );


    if (!response.ok) {

        localStorage.removeItem(
            "berakah_access_token"
        );

        localStorage.removeItem(
            "berakah_refresh_token"
        );

        window.location.href =
            "login.html";

        return null;
    }


    currentUser =
        await response.json();


    return currentUser;

}


/* =========================================================
   LOAD FEED
========================================================= */

async function loadFeed() {

    const feed =
        document.getElementById(
            "feed"
        );


    feed.innerHTML = "";


    showStatus(
        "Loading posts..."
    );


    try {

        /* -----------------------------------------
           LOAD POSTS
        ----------------------------------------- */

        const postsUrl =
            SUPABASE_URL +
            "/rest/v1/posts" +
            "?select=*" +
            "&order=created_at.desc";


        const postsResponse =
            await fetch(

                postsUrl,

                {
                    method: "GET",

                    headers:
                        supabaseHeaders()
                }

            );


        if (!postsResponse.ok) {

            throw new Error(
                await postsResponse.text()
            );

        }


        const posts =
            await postsResponse.json();


        if (
            !posts ||
            posts.length === 0
        ) {

            showEmpty();

            return;
        }


        /* -----------------------------------------
           GET UNIQUE USER IDS
        ----------------------------------------- */

        const userIds = [
            ...new Set(

                posts
                    .map(
                        post =>
                            post.user_id
                    )
                    .filter(Boolean)

            )
        ];


        let profiles = [];


        /* -----------------------------------------
           LOAD PROFILES
        ----------------------------------------- */

        if (
            userIds.length > 0
        ) {

            const encodedIds =
                userIds
                    .map(
                        id =>
                            `"${id}"`
                    )
                    .join(",");


            const profilesUrl =
                SUPABASE_URL +
                "/rest/v1/profiles" +
                "?select=*" +
                "&user_id=in.(" +
                encodedIds +
                ")";


            const profilesResponse =
                await fetch(

                    profilesUrl,

                    {
                        method: "GET",

                        headers:
                            supabaseHeaders()
                    }

                );


            if (
                profilesResponse.ok
            ) {

                profiles =
                    await profilesResponse.json();

            }

        }


        const profileMap = {};


        profiles.forEach(
            profile => {

                profileMap[
                    profile.user_id
                ] = profile;

            }
        );


        /* -----------------------------------------
           LOAD LIKES
        ----------------------------------------- */

        const postIds =
            posts
                .map(
                    post =>
                        post.id
                )
                .filter(
                    id =>
                        id !== null &&
                        id !== undefined
                );


        let likes = [];


        if (
            postIds.length > 0
        ) {

            const encodedPostIds =
                postIds
                    .join(",");


            const likesUrl =
                SUPABASE_URL +
                "/rest/v1/post_likes" +
                "?select=post_id,user_id" +
                "&post_id=in.(" +
                encodedPostIds +
                ")";


            const likesResponse =
                await fetch(

                    likesUrl,

                    {
                        method: "GET",

                        headers:
                            supabaseHeaders()
                    }

                );


            if (
                likesResponse.ok
            ) {

                likes =
                    await likesResponse.json();

            } else {

                console.error(
                    "Likes loading error:",
                    await likesResponse.text()
                );

            }

        }


        /* -----------------------------------------
           BUILD LIKE DATA
        ----------------------------------------- */

        const likeMap = {};


        likes.forEach(
            like => {

                const postId =
                    String(
                        like.post_id
                    );


                if (
                    !likeMap[postId]
                ) {

                    likeMap[postId] = {
                        count: 0,
                        liked: false
                    };

                }


                likeMap[
                    postId
                ].count++;


                if (
                    currentUser &&
                    like.user_id ===
                        currentUser.id
                ) {

                    likeMap[
                        postId
                    ].liked = true;

                }

            }
        );


        /* -----------------------------------------
           CREATE POSTS
        ----------------------------------------- */

        posts.forEach(
            post => {

                const profile =
                    profileMap[
                        post.user_id
                    ] || null;


                const postLikes =
                    likeMap[
                        String(post.id)
                    ] || {
                        count: 0,
                        liked: false
                    };


                feed.appendChild(

                    createPostCard(
                        post,
                        profile,
                        postLikes
                    )

                );

            }
        );


        showStatus(
            posts.length +
            (
                posts.length === 1
                ? " post"
                : " posts"
            )
        );


    } catch (error) {

        console.error(
            "Feed error:",
            error
        );


        showStatus(
            "Could not load the feed.",
            "error"
        );


        feed.innerHTML = `

            <div class="empty">

                <strong>
                    Something went wrong.
                </strong>

                <br><br>

                Please refresh the page.

                <br>

                <button
                    class="refresh-btn"
                    onclick="loadFeed()"
                >
                    Refresh Feed
                </button>

            </div>

        `;

    }

}


/* =========================================================
   CREATE POST CARD
========================================================= */

function createPostCard(
    post,
    profile,
    likes
) {

    const article =
        document.createElement(
            "article"
        );


    article.className =
        "post";


    const fullName =
        profile
        ? (
            profile["Full name"] ||
            profile.full_name ||
            profile.name ||
            profile.username ||
            "BERAKAH Member"
        )
        : "BERAKAH Member";


    const username =
        profile &&
        profile.username
        ? profile.username
        : "";


    const avatarUrl =
        profile &&
        profile.avatar_url
        ? profile.avatar_url
        : "";


    const profileId =
        profile &&
        profile.id
        ? profile.id
        : null;


    const isOwnPost =
        currentUser &&
        post.user_id ===
            currentUser.id;


    const formattedDate =
        formatDate(
            post.created_at
        );


    let avatarHTML;


    if (avatarUrl) {

        avatarHTML = `

            <div class="avatar">

                <img
                    src="${escapeAttribute(avatarUrl)}"
                    alt="Profile"
                >

            </div>

        `;

    } else {

        const firstLetter =
            escapeHTML(
                fullName
                    .charAt(0)
                    .toUpperCase()
            );


        avatarHTML = `

            <div class="avatar">

                ${firstLetter}

            </div>

        `;

    }


    let authorHTML;


    if (profileId) {

        authorHTML = `

            <a
                class="author"
                href="profile.html?id=${encodeURIComponent(profileId)}"
            >

                ${avatarHTML}


                <div>

                    <div class="author-name">

                        ${escapeHTML(
                            fullName
                        )}

                    </div>


                    ${
                        username
                        ? `

                            <div class="username">

                                @${escapeHTML(
                                    username.replace(
                                        /^@/,
                                        ""
                                    )
                                )}

                            </div>

                          `
                        : ""
                    }

                </div>

            </a>

        `;

    } else {

        authorHTML = `

            <div class="author">

                ${avatarHTML}


                <div>

                    <div class="author-name">

                        ${escapeHTML(
                            fullName
                        )}

                    </div>

                </div>

            </div>

        `;

    }


    const imageUrl =
        post.image_url ||
        post.image ||
        null;


    let imageHTML = "";


    if (imageUrl) {

        imageHTML = `

            <img
                class="post-image"
                src="${escapeAttribute(imageUrl)}"
                alt="Post image"
                loading="lazy"
            >

        `;

    }


    let deleteButton = "";


    if (isOwnPost) {

        deleteButton = `

            <button
                class="action-btn delete-btn"
                onclick="deletePost('${escapeAttribute(post.id)}')"
            >
                🗑 Delete
            </button>

        `;

    }


    const likedClass =
        likes.liked
        ? "liked"
        : "";


    const likeIcon =
        likes.liked
        ? "❤️"
        : "🤍";


    article.innerHTML = `

        <div class="post-header">

            ${authorHTML}


            <div class="post-date">

                ${formattedDate}

            </div>

        </div>


        ${
            post.content
            ? `

                <div class="post-content">

                    ${escapeHTML(
                        post.content
                    )}

                </div>

              `
            : ""
        }


        ${imageHTML}


        <div class="post-actions">


            <button
                class="action-btn like-btn ${likedClass}"
                id="like-${escapeAttribute(post.id)}"
                onclick="toggleLike('${escapeAttribute(post.id)}', ${likes.liked})"
            >

                <span class="like-icon">
                    ${likeIcon}
                </span>

                <span>
                    Like
                </span>

                <span
                    class="like-count"
                    id="count-${escapeAttribute(post.id)}"
                >
                    ${
                        likes.count > 0
                        ? likes.count
                        : ""
                    }
                </span>

            </button>


            ${deleteButton}


        </div>

    `;


    return article;

}


/* =========================================================
   LIKE / UNLIKE
========================================================= */

async function toggleLike(
    postId,
    currentlyLiked
) {

    const button =
        document.getElementById(
            "like-" + postId
        );


    const countElement =
        document.getElementById(
            "count-" + postId
        );


    if (!button) {

        return;
    }


    button.disabled = true;


    try {

        if (currentlyLiked) {

            /* -------------------------------
               UNLIKE
            -------------------------------- */

            const deleteUrl =
                SUPABASE_URL +
                "/rest/v1/post_likes" +
                "?post_id=eq." +
                encodeURIComponent(postId) +
                "&user_id=eq." +
                encodeURIComponent(
                    currentUser.id
                );


            const response =
                await fetch(

                    deleteUrl,

                    {
                        method: "DELETE",

                        headers:
                            supabaseHeaders()
                    }

                );


            if (!response.ok) {

                throw new Error(
                    await response.text()
                );

            }


            button.classList.remove(
                "liked"
            );


            button.querySelector(
                ".like-icon"
            ).textContent =
                "🤍";


            let count =
                parseInt(
                    countElement.textContent
                ) || 0;


            count =
                Math.max(
                    0,
                    count - 1
                );


            countElement.textContent =
                count > 0
                ? count
                : "";


            button.setAttribute(
                "onclick",
                `toggleLike('${escapeAttribute(postId)}', false)`
            );


        } else {

            /* -------------------------------
               LIKE
            -------------------------------- */

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/post_likes",

                    {
                        method: "POST",

                        headers:
                            supabaseHeaders({
                                "Content-Type":
                                    "application/json",

                                "Prefer":
                                    "return=minimal"
                            }),

                        body:
                            JSON.stringify({

                                post_id:
                                    postId,

                                user_id:
                                    currentUser.id

                            })
                    }

                );


            if (!response.ok) {

                const error =
                    await response.text();


                /*
                 If another request already
                 created the like, simply
                 reload the feed.
                */

                if (
                    response.status === 409
                ) {

                    await loadFeed();

                    return;

                }


                throw new Error(
                    error
                );

            }


            button.classList.add(
                "liked"
            );


            button.querySelector(
                ".like-icon"
            ).textContent =
                "❤️";


            let count =
                parseInt(
                    countElement.textContent
                ) || 0;


            count++;


            countElement.textContent =
                count;


            button.setAttribute(
                "onclick",
                `toggleLike('${escapeAttribute(postId)}', true)`
            );

        }


    } catch (error) {

        console.error(
            "Like error:",
            error
        );


        showStatus(
            "Could not update like.",
            "error"
        );

    } finally {

        button.disabled = false;

    }

}


/* =========================================================
   CREATE POST
========================================================= */

async function createPost() {

    const contentInput =
        document.getElementById(
            "postContent"
        );


    const imageInput =
        document.getElementById(
            "postImage"
        );


    const publishBtn =
        document.getElementById(
            "publishBtn"
        );


    const content =
        contentInput.value.trim();


    const file =
        imageInput.files[0] ||
        null;


    if (
        !content &&
        !file
    ) {

        showStatus(
            "Write something or choose an image.",
            "error"
        );

        return;
    }


    publishBtn.disabled = true;

    publishBtn.textContent =
        "POSTING...";


    try {

        let imageUrl = null;


        if (file) {

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                throw new Error(
                    "Please select an image file."
                );

            }


            if (
                file.size >
                5 * 1024 * 1024
            ) {

                throw new Error(
                    "Image must be smaller than 5 MB."
                );

            }


            imageUrl =
                await fileToDataURL(
                    file
                );

        }


        const postData = {

            user_id:
                currentUser.id,

            content:
                content || null,

            image_url:
                imageUrl

        };


        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/posts",

                {
                    method: "POST",

                    headers:
                        supabaseHeaders({

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=representation"

                        }),

                    body:
                        JSON.stringify(
                            postData
                        )

                }

            );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        contentInput.value =
            "";


        imageInput.value =
            "";


        document.getElementById(
            "imageName"
        ).textContent =
            "";


        showStatus(
            "Post published successfully! 🎉",
            "success"
        );


        await loadFeed();


    } catch (error) {

        console.error(
            "Create post error:",
            error
        );


        showStatus(
            error.message ||
            "Could not publish post.",
            "error"
        );


    } finally {

        publishBtn.disabled =
            false;


        publishBtn.textContent =
            "POST";

    }

}


/* =========================================================
   DELETE POST
========================================================= */

async function deletePost(
    postId
) {

    if (!postId) {

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this post?"
        );


    if (!confirmed) {

        return;
    }


    try {

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/posts" +
                "?id=eq." +
                encodeURIComponent(
                    postId
                ) +
                "&user_id=eq." +
                encodeURIComponent(
                    currentUser.id
                ),

                {
                    method: "DELETE",

                    headers:
                        supabaseHeaders()
                }

            );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        showStatus(
            "Post deleted.",
            "success"
        );


        await loadFeed();


    } catch (error) {

        console.error(
            "Delete error:",
            error
        );


        showStatus(
            "Could not delete the post.",
            "error"
        );

    }

}


/* =========================================================
   IMAGE READER
========================================================= */

function fileToDataURL(
    file
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );


            reader.onerror =
                () =>
                    reject(
                        new Error(
                            "Could not read image."
                        )
                    );


            reader.readAsDataURL(
                file
            );

        }
    );

}

/* =========================================================
   DATE
========================================================= */

function formatDate(
    dateString
) {

    if (!dateString) {

        return "";
    }


    const date =
        new Date(
            dateString
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleString(
        undefined,
        {
            month: "short",
            day: "numeric",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit"
        }
    );

}

/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    try {

        if (accessToken) {

            await fetch(

                SUPABASE_URL +
                "/auth/v1/logout",

                {
                    method: "POST",

                    headers:
                        supabaseHeaders()
                }

            );

        }

    } catch (error) {

        console.error(
            "Logout error:",
            error
        );

    }


    localStorage.removeItem(
        "berakah_access_token"
    );


    localStorage.removeItem(
        "berakah_refresh_token"
    );


    window.location.href =
        "login.html";

}

    await loadFeed();

}


startFeed();
