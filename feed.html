<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Social Feed</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 2px;
}

.nav-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  padding: 8px 12px;
  border-radius: 7px;
  cursor: pointer;
}

.logout {
  background: #111827 !important;
  color: white;
}

main {
  width: 100%;
  max-width: 650px;
  margin: 25px auto;
  padding: 0 15px;
}

.composer,
.post {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

.composer h2 {
  margin-top: 0;
  font-size: 20px;
}

textarea {
  width: 100%;
  min-height: 100px;
  resize: vertical;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 15px;
  font-family: inherit;
}

.comment-input {
  min-height: 55px;
  margin-top: 12px;
}

.image-input {
  width: 100%;
  margin-top: 10px;
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
}

.post-button {
  width: 100%;
  margin-top: 12px;
  padding: 13px;
  border: none;
  border-radius: 9px;
  background: #111827;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.post-button:disabled {
  opacity: 0.6;
}

.post-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.user {
  font-weight: bold;
}

.time {
  color: #6b7280;
  font-size: 12px;
}

.post-content {
  margin: 15px 0;
  line-height: 1.5;
  white-space: pre-wrap;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 8px;
}

.actions {
  display: flex;
  gap: 10px;
  border-top: 1px solid #eee;
  padding-top: 12px;
  flex-wrap: wrap;
}

.actions button {
  border: none;
  background: #f3f4f6;
  padding: 9px 15px;
  border-radius: 8px;
  cursor: pointer;
}

.like-button.liked {
  background: #fee2e2;
}

.delete {
  margin-left: auto;
  color: #b91c1c !important;
}

.comments-section {
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid #eee;
  display: none;
}

.comments-section.open {
  display: block;
}

.comments-title {
  font-weight: bold;
  margin-bottom: 10px;
}

.comment {
  background: #f9fafb;
  border-radius: 9px;
  padding: 10px;
  margin-bottom: 8px;
}

.comment-header {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.comment-user {
  font-weight: bold;
  font-size: 14px;
}

.comment-time {
  color: #6b7280;
  font-size: 11px;
}

.comment-text {
  margin-top: 6px;
  white-space: pre-wrap;
  line-height: 1.4;
}

.comment-delete {
  border: none;
  background: transparent;
  color: #b91c1c;
  cursor: pointer;
  font-size: 12px;
  padding: 0;
  margin-top: 6px;
}

.comment-form {
  margin-top: 12px;
}

.comment-submit {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #111827;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

#message {
  text-align: center;
  margin-bottom: 15px;
  font-weight: bold;
}

#loading {
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      BERAKAH
    </div>

    <div class="nav-buttons">

      <button onclick="window.location.href='index.html'">
        Home
      </button>

      <button onclick="window.location.href='marketplace.html'">
        Market
      </button>

      <button class="logout" id="logoutButton">
        Logout
      </button>

    </div>

  </div>
</header>

<main>

  <div class="composer">

    <h2>Create a Post</h2>

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>

    <input
      id="imageUrl"
      class="image-input"
      type="url"
      placeholder="Optional image URL"
    >

    <button
      class="post-button"
      id="postButton"
    >
      POST
    </button>

  </div>

  <div id="message"></div>

  <div id="loading">
    Loading posts...
  </div>

  <div id="feed"></div>

</main>

<script>

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

let accessToken =
localStorage.getItem("berakah_access_token");

let currentUser = null;

if (!accessToken) {
  window.location.href = "login.html";
}


/* HTML SAFETY */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* SUPABASE HEADERS */

function getHeaders(extra = {}) {

  return {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + accessToken,
    ...extra
  };

}


/* CURRENT USER */

async function getCurrentUser() {

  try {

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/user",
      {
        headers: getHeaders()
      }
    );

    if (!response.ok) {
      throw new Error("Session expired");
    }

    currentUser = await response.json();

  } catch (error) {

    localStorage.clear();

    window.location.href = "login.html";

  }

}


/* LOAD POSTS */

async function loadPosts() {

  const feed =
    document.getElementById("feed");

  const loading =
    document.getElementById("loading");

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/posts?select=*&order=created_at.desc",
      {
        headers: getHeaders()
      }
    );

    const responseText =
      await response.text();

    let data = [];

    if (responseText.trim()) {

      try {
        data = JSON.parse(responseText);
      } catch (e) {
        throw new Error("Could not read posts.");
      }

    }

    if (!response.ok) {

      throw new Error(
        data.message ||
        data.error_description ||
        data.msg ||
        "Could not load posts."
      );

    }

    loading.style.display = "none";

    feed.innerHTML = "";

    if (!data.length) {

      feed.innerHTML =
        "<div class='post'>No posts yet. Be the first to post!</div>";

      return;

    }


    /* LOAD LIKES */

    let likes = [];

    const likesResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/post_likes?select=post_id,user_id",
        {
          headers: getHeaders()
        }
      );

    if (likesResponse.ok) {

      const likesText =
        await likesResponse.text();

      if (likesText.trim()) {

        try {
          likes = JSON.parse(likesText);
        } catch (e) {
          likes = [];
        }

      }

    }


    /* LOAD COMMENTS */

    let comments = [];

    const commentsResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/post_comments?select=*"+
        "&order=created_at.asc",
        {
          headers: getHeaders()
        }
      );

    if (commentsResponse.ok) {

      const commentsText =
        await commentsResponse.text();

      if (commentsText.trim()) {

        try {
          comments = JSON.parse(commentsText);
        } catch (e) {
          comments = [];
        }

      }

    }


    /* DISPLAY POSTS */

    data.forEach(function(post) {

      const article =
        document.createElement("div");

      article.className = "post";

      const postLikes =
        likes.filter(function(like) {
          return like.post_id === post.id;
        });

      const likedByMe =
        postLikes.some(function(like) {
          return like.user_id === currentUser.id;
        });

      const postComments =
        comments.filter(function(comment) {
          return comment.post_id === post.id;
        });

      const username =
        post.username ||
        "BERAKAH User";

      const date =
        new Date(post.created_at);

      let commentsHtml = "";

      if (postComments.length === 0) {

        commentsHtml =
          "<div style='color:#6b7280;font-size:13px;'>No comments yet.</div>";

      } else {

        commentsHtml =
          postComments.map(function(comment) {

            const commentUser =
              comment.username ||
              "BERAKAH User";

            const commentDate =
              new Date(comment.created_at);

            const deleteButton =
              comment.user_id === currentUser.id
              ?
              `
              <button
                class="comment-delete"
                onclick="deleteComment('${comment.id}')"
              >
                Delete
              </button>
              `
              :
              "";

            return `

              <div class="comment">

                <div class="comment-header">

                  <div class="comment-user">
                    ${escapeHtml(commentUser)}
                  </div>

                  <div class="comment-time">
                    ${commentDate.toLocaleString()}
                  </div>

                </div>

                <div class="comment-text">
                  ${escapeHtml(comment.content)}
                </div>

                ${deleteButton}

              </div>

            `;

          }).join("");

      }


      article.innerHTML = `

        <div class="post-header">

          <div class="user">
            ${escapeHtml(username)}
          </div>

          <div class="time">
            ${date.toLocaleString()}
          </div>

        </div>


        <div class="post-content">
          ${escapeHtml(post.content || "")}
        </div>


        ${
          post.image_url
          ?
          `
          <img
            class="post-image"
            src="${escapeHtml(post.image_url)}"
            alt="Post image"
          >
          `
          :
          ""
        }


        <div class="actions">

          <button
            class="like-button ${likedByMe ? "liked" : ""}"
            onclick="likePost('${post.id}')"
          >
            ${likedByMe ? "❤️ Unlike" : "❤️ Like"}
            (${postLikes.length})
          </button>


          <button
            onclick="toggleComments('${post.id}')"
          >
            💬 Comments (${postComments.length})
          </button>


          ${
            post.user_id === currentUser.id
            ?
            `
            <button
              class="delete"
              onclick="deletePost('${post.id}')"
            >
              Delete
            </button>
            `
            :
            ""
          }

        </div>


        <div
          id="comments-${post.id}"
          class="comments-section"
        >

          <div class="comments-title">
            💬 Comments
          </div>

          <div>
            ${commentsHtml}
          </div>


          <div class="comment-form">

            <textarea
              id="comment-input-${post.id}"
              class="comment-input"
              placeholder="Write a comment..."
            ></textarea>

            <button
              class="comment-submit"
              onclick="addComment('${post.id}')"
            >
              POST COMMENT
            </button>

          </div>

        </div>

      `;

      feed.appendChild(article);

    });


  } catch (error) {

    loading.style.display = "none";

    document.getElementById("message")
      .textContent = error.message;

  }

}


/* CREATE POST */

document
  .getElementById("postButton")
  .addEventListener("click", async function() {

    const text =
      document.getElementById("postText")
        .value.trim();

    const imageUrl =
      document.getElementById("imageUrl")
        .value.trim();

    const message =
      document.getElementById("message");

    if (!text) {

      message.textContent =
        "Please write something first.";

      return;

    }

    this.disabled = true;
    this.textContent = "POSTING...";

    try {

      const response =
        await fetch(
          SUPABASE_URL + "/rest/v1/posts",
          {
            method: "POST",

            headers: getHeaders({
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            }),

            body: JSON.stringify({

              user_id:
                currentUser.id,

              username:
                currentUser.user_metadata?.username ||
                currentUser.email?.split("@")[0] ||
                "BERAKAH User",

              content:
                text,

              image_url:
                imageUrl || null

            })

          }
        );

      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          errorText ||
          "Could not create post."
        );

      }

      document.getElementById("postText")
        .value = "";

      document.getElementById("imageUrl")
        .value = "";

      message.textContent =
        "Post published successfully!";

      await loadPosts();

    } catch (error) {

      message.textContent =
        error.message;

    }

    this.disabled = false;
    this.textContent = "POST";

  });


/* LIKE / UNLIKE */

async function likePost(postId) {

  try {

    const checkResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/post_likes?post_id=eq." +
        encodeURIComponent(postId) +
        "&user_id=eq." +
        encodeURIComponent(currentUser.id),
        {
          headers: getHeaders()
        }
      );

    const checkText =
      await checkResponse.text();

    let existingLikes = [];

    if (checkText.trim()) {
      existingLikes = JSON.parse(checkText);
    }


    /* UNLIKE */

    if (existingLikes.length > 0) {

      const deleteResponse =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/post_likes?post_id=eq." +
          encodeURIComponent(postId) +
          "&user_id=eq." +
          encodeURIComponent(currentUser.id),
          {
            method: "DELETE",
            headers: getHeaders()
          }
        );

      if (!deleteResponse.ok) {

        const errorText =
          await deleteResponse.text();

        throw new Error(
          errorText ||
          "Could not unlike post."
        );

      }

    }


    /* LIKE */

    else {

      const likeResponse =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/post_likes",
          {
            method: "POST",

            headers: getHeaders({
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            }),

            body: JSON.stringify({

              post_id:
                postId,

              user_id:
                currentUser.id

            })

          }
        );

      if (!likeResponse.ok) {

        const errorText =
          await likeResponse.text();

        throw new Error(
          errorText ||
          "Could not like post."
        );

      }

    }

    await loadPosts();

  } catch (error) {

    alert(error.message);

  }

}


/* TOGGLE COMMENTS */

function toggleComments(postId) {

  const section =
    document.getElementById(
      "comments-" + postId
    );

  if (!section) {
    return;
  }

  section.classList.toggle("open");

}


/* ADD COMMENT */

async function addComment(postId) {

  const input =
    document.getElementById(
      "comment-input-" + postId
    );

  const content =
    input.value.trim();

  if (!content) {

    alert("Please write a comment.");

    return;

  }

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/post_comments",
        {
          method: "POST",

          headers: getHeaders({
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          }),

          body: JSON.stringify({

            post_id:
              postId,

            user_id:
              currentUser.id,

            username:
              currentUser.user_metadata?.username ||
              currentUser.email?.split("@")[0] ||
              "BERAKAH User",

            content:
              content

          })

        }
      );

    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        "Could not add comment."
      );

    }

    input.value = "";

    await loadPosts();

    const section =
      document.getElementById(
        "comments-" + postId
      );

    if (section) {
      section.classList.add("open");
    }

  } catch (error) {

    alert(error.message);

  }

}


/* DELETE COMMENT */

async function deleteComment(commentId) {

  if (!confirm("Delete this comment?")) {
    return;
  }

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/post_comments?id=eq." +
        encodeURIComponent(commentId),
        {
          method: "DELETE",
          headers: getHeaders()
        }
      );

    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        "Could not delete comment."
      );

    }

    await loadPosts();

  } catch (error) {

    alert(error.message);

  }

}


/* DELETE POST */

async function deletePost(id) {

  if (!confirm("Delete this post?")) {
    return;
  }

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/posts?id=eq." +
        encodeURIComponent(id),
        {
          method: "DELETE",
          headers: getHeaders()
        }
      );

    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        "Could not delete post."
      );

    }

    await loadPosts();

  } catch (error) {

    alert(error.message);

  }

}


/* LOGOUT */

document
  .getElementById("logoutButton")
  .addEventListener("click", function() {

    localStorage.removeItem(
      "berakah_access_token"
    );

    localStorage.removeItem(
      "berakah_refresh_token"
    );

    localStorage.removeItem(
      "berakah_user"
    );

    window.location.href =
      "login.html";

  });


/* START */

(async function() {

  await getCurrentUser();

  if (currentUser) {
    await loadPosts();
  }

})();

</script>

</body>
</html>
