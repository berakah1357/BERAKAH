<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>EPHPHAVORA - Feed</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav {
    max-width: 1100px;
    margin: auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #111827;
    text-decoration: none;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.nav-links a,
.logout-btn {
    text-decoration: none;
    color: #374151;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
}

.nav-links a:hover,
.logout-btn:hover {
    background: #f3f4f6;
}

.logout-btn {
    border: none;
    background: transparent;
    font-family: inherit;
}

.container {
    max-width: 760px;
    margin: 25px auto;
    padding: 0 15px;
}

.page-title {
    font-size: 28px;
    margin: 0 0 18px;
}

.create-post {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.create-post h2 {
    margin: 0 0 14px;
    font-size: 18px;
}

textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 12px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    outline: none;
}

textarea:focus {
    border-color: #2563eb;
}

.create-bottom {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.file-label {
    display: inline-block;
    background: #f3f4f6;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.file-label:hover {
    background: #e5e7eb;
}

#postImage,
#postVideo {
    display: none;
}

#imageName,
#videoName {
    font-size: 12px;
    color: #6b7280;
    margin-top: 7px;
}

.media-type {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
}

.media-type button {
    border: 1px solid #d1d5db;
    background: white;
    padding: 9px 13px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    color: #374151;
}

.media-type button:hover {
    background: #f3f4f6;
}

.media-type button.active {
    background: #111827;
    color: white;
    border-color: #111827;
}

.post-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin-left: auto;
}

.post-btn:hover {
    background: #1d4ed8;
}

.post-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.status {
    text-align: center;
    margin: 15px 0;
    color: #6b7280;
    font-size: 14px;
}

.error {
    color: #dc2626;
}

.success {
    color: #16a34a;
}

.post {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 16px 10px;
}

.author {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
}

.avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    background: #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #374151;
    overflow: hidden;
    flex-shrink: 0;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.author-name {
    font-weight: bold;
    font-size: 15px;
}

.username {
    color: #6b7280;
    font-size: 13px;
    margin-top: 2px;
}

.post-date {
    color: #9ca3af;
    font-size: 12px;
}

.post-content {
    padding: 5px 16px 15px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
    font-size: 15px;
}

.post-image {
    width: 100%;
    max-height: 600px;
    object-fit: cover;
    display: block;
}

.video-wrapper {
    width: 100%;
    background: #000;
    position: relative;
}

.post-video {
    width: 100%;
    max-height: 650px;
    display: block;
    background: #000;
    object-fit: contain;
}

.reel-wrapper {
    width: 100%;
    background: #000;
    display: flex;
    justify-content: center;
}

.reel-video {
    width: 100%;
    max-width: 450px;
    height: min(75vh, 720px);
    display: block;
    background: #000;
    object-fit: contain;
}

.reel-label {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.post-actions {
    border-top: 1px solid #f0f0f0;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.action-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    color: #4b5563;
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 14px;
}

.action-btn:hover {
    background: #f3f4f6;
}

.like-btn {
    display: flex;
    align-items: center;
    gap: 5px;
}

.like-btn.liked {
    color: #dc2626;
    font-weight: bold;
}

.like-count {
    color: #6b7280;
    font-size: 13px;
    min-width: 10px;
}

.delete-btn {
    margin-left: auto;
    color: #dc2626;
}

.delete-btn:hover {
    background: #fef2f2;
}

.empty {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 40px 20px;
    text-align: center;
    color: #6b7280;
}

.refresh-btn {
    margin-top: 15px;
    background: #111827;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

@media (max-width: 700px) {

    .nav {
        padding: 12px;
        align-items: flex-start;
        flex-direction: column;
    }

    .nav-links {
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
    }

    .nav-links a,
    .logout-btn {
        white-space: nowrap;
    }

    .container {
        margin-top: 18px;
        padding: 0 10px;
    }

    .page-title {
        font-size: 24px;
    }

    .create-bottom {
        align-items: stretch;
        flex-direction: column;
    }

    .post-btn {
        width: 100%;
        margin-left: 0;
    }

    .post-header {
        gap: 10px;
    }

    .post-date {
        text-align: right;
    }

    .reel-video {
        height: 75vh;
        max-width: 100%;
    }

}

</style>

</head>

<body>

<header>

    <div class="nav">

        <a
            class="logo"
            href="index.html"
        >
            EPHPHAVORA
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="feed.html">
                Feed
            </a>

            <a href="people.html">
                👥 People
            </a>

            <a href="marketplace.html">
                Market
            </a>

            <a href="notifications.html">
                🔔
            </a>

            <a href="messages.html">
                💬
            </a>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </nav>

    </div>

</header>

<main class="container">

    <h1 class="page-title">
        Feed
    </h1>

    <section class="create-post">

        <h2>
            Create a post
        </h2>

        <textarea
            id="postContent"
            placeholder="What's on your mind?"
        ></textarea>

        <div class="media-type">

            <button
                type="button"
                id="imageModeBtn"
                class="active"
                onclick="selectMediaMode('image')"
            >
                📷 Image
            </button>

            <button
                type="button"
                id="videoModeBtn"
                onclick="selectMediaMode('video')"
            >
                🎥 Video
            </button>

            <button
                type="button"
                id="reelModeBtn"
                onclick="selectMediaMode('reel')"
            >
                🎬 Reel
            </button>

        </div>

        <div
            id="imageUploadArea"
            style="margin-top:12px;"
        >

            <label class="file-label">

                📷 Add Image

                <input
                    type="file"
                    id="postImage"
                    accept="image/*"
                >

            </label>

            <div id="imageName"></div>

        </div>

        <div
            id="videoUploadArea"
            style="display:none;margin-top:12px;"
        >

            <label class="file-label">

                🎥 Choose Video

                <input
                    type="file"
                    id="postVideo"
                    accept="video/mp4,video/webm,video/quicktime"
                >

            </label>

            <div id="videoName"></div>

            <div
                style="
                    margin-top:7px;
                    font-size:12px;
                    color:#6b7280;
                "
            >
                MP4, WEBM, or MOV. Maximum 50 MB.
            </div>

        </div>

        <div class="create-bottom">

            <div></div>

            <button
                class="post-btn"
                id="publishBtn"
                onclick="createPost()"
            >
                POST
            </button>

        </div>

    </section>

    <div
        id="status"
        class="status"
    ></div>

    <section id="feed"></section>

</main>

<script>

const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const VIDEO_BUCKET =
    "videos";

const MAX_VIDEO_SIZE =
    50 * 1024 * 1024;


let accessToken =
    localStorage.getItem(
        "berakah_access_token"
    );


let currentUser = null;

let selectedMediaMode =
    "image";


function supabaseHeaders(extra = {}) {

    return {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " + accessToken,

        ...extra

    };

}


function showStatus(
    message,
    type = ""
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        message;

    status.className =
        "status " + type;

}


function selectMediaMode(
    mode
) {

    selectedMediaMode =
        mode;

    const imageButton =
        document.getElementById(
            "imageModeBtn"
        );

    const videoButton =
        document.getElementById(
            "videoModeBtn"
        );

    const reelButton =
        document.getElementById(
            "reelModeBtn"
        );

    const imageArea =
        document.getElementById(
            "imageUploadArea"
        );

    const videoArea =
        document.getElementById(
            "videoUploadArea"
        );


    imageButton.classList.remove(
        "active"
    );

    videoButton.classList.remove(
        "active"
    );

    reelButton.classList.remove(
        "active"
    );


    if (mode === "image") {

        imageButton.classList.add(
            "active"
        );

        imageArea.style.display =
            "block";

        videoArea.style.display =
            "none";

    } else {

        videoArea.style.display =
            "block";

        imageArea.style.display =
            "none";


        if (mode === "video") {

            videoButton.classList.add(
                "active"
            );

        } else {

            reelButton.classList.add(
                "active"
            );

        }

    }

}


async function getCurrentUser() {

    if (!accessToken) {

        window.location.href =
            "login.html";

        return null;

    }


    const response =
        await fetch(

            SUPABASE_URL +
            "/auth/v1/user",

            {
                method: "GET",

                headers:
                    supabaseHeaders()
            }

        );


    if (!response.ok) {

        localStorage.removeItem(
            "berakah_access_token"
        );

        localStorage.removeItem(
            "berakah_refresh_token"
        );

        window.location.href =
            "login.html";

        return null;

    }


    currentUser =
        await response.json();


    return currentUser;

}


async function loadFeed() {

    const feed =
        document.getElementById(
            "feed"
        );


    feed.innerHTML = "";


    showStatus(
        "Loading posts..."
    );


    try {

        const postsUrl =
            SUPABASE_URL +
            "/rest/v1/posts" +
            "?select=*" +
            "&order=created_at.desc";


        const postsResponse =
            await fetch(

                postsUrl,

                {
                    method: "GET",

                    headers:
                        supabaseHeaders()
                }

            );


        if (!postsResponse.ok) {

            throw new Error(
                await postsResponse.text()
            );

        }


        const posts =
            await postsResponse.json();


        if (
            !posts ||
            posts.length === 0
        ) {

            showEmpty();

            return;

        }


        const userIds = [
            ...new Set(

                posts
                    .map(
                        post =>
                            post.user_id
                    )
                    .filter(Boolean)

            )
        ];


        let profiles = [];


        if (
            userIds.length > 0
        ) {

            const encodedIds =
                userIds
                    .map(
                        id =>
                            `"${id}"`
                    )
                    .join(",");


            const profilesUrl =
                SUPABASE_URL +
                "/rest/v1/profiles" +
                "?select=*" +
                "&user_id=in.(" +
                encodedIds +
                ")";


            const profilesResponse =
                await fetch(

                    profilesUrl,

                    {
                        method: "GET",

                        headers:
                            supabaseHeaders()
                    }

                );


            if (
                profilesResponse.ok
            ) {

                profiles =
                    await profilesResponse.json();

            }

        }


        const profileMap = {};


        profiles.forEach(
            profile => {

                profileMap[
                    profile.user_id
                ] = profile;

            }
        );


        const postIds =
            posts
                .map(
                    post =>
                        post.id
                )
                .filter(
                    id =>
                        id !== null &&
                        id !== undefined
                );


        let likes = [];


        if (
            postIds.length > 0
        ) {

            const encodedPostIds =
                postIds.join(",");


            const likesUrl =
                SUPABASE_URL +
                "/rest/v1/post_likes" +
                "?select=post_id,user_id" +
                "&post_id=in.(" +
                encodedPostIds +
                ")";


            const likesResponse =
                await fetch(

                    likesUrl,

                    {
                        method: "GET",

                        headers:
                            supabaseHeaders()
                    }

                );


            if (
                likesResponse.ok
            ) {

                likes =
                    await likesResponse.json();

            } else {

                console.error(
                    "Likes loading error:",
                    await likesResponse.text()
                );

            }

        }


        const likeMap = {};


        likes.forEach(
            like => {

                const postId =
                    String(
                        like.post_id
                    );


                if (
                    !likeMap[postId]
                ) {

                    likeMap[postId] = {
                        count: 0,
                        liked: false
                    };

                }


                likeMap[
                    postId
                ].count++;


                if (
                    currentUser &&
                    like.user_id ===
                        currentUser.id
                ) {

                    likeMap[
                        postId
                    ].liked = true;

                }

            }
        );


        posts.forEach(
            post => {

                const profile =
                    profileMap[
                        post.user_id
                    ] || null;


                const postLikes =
                    likeMap[
                        String(post.id)
                    ] || {
                        count: 0,
                        liked: false
                    };


                feed.appendChild(

                    createPostCard(
                        post,
                        profile,
                        postLikes
                    )

                );

            }
        );


        showStatus(
            posts.length +
            (
                posts.length === 1
                ? " post"
                : " posts"
            )
        );


    } catch (error) {

        console.error(
            "Feed error:",
            error
        );


        showStatus(
            "Could not load the feed.",
            "error"
        );


        feed.innerHTML = `

            <div class="empty">

                <strong>
                    Something went wrong.
                </strong>

                <br><br>

                Please refresh the page.

                <br>

                <button
                    class="refresh-btn"
                    onclick="loadFeed()"
                >
                    Refresh Feed
                </button>

            </div>

        `;

    }

}


function createPostCard(
    post,
    profile,
    likes
) {

    const article =
        document.createElement(
            "article"
        );


    article.className =
        "post";


    const fullName =
        profile
        ? (
            profile["Full name"] ||
            profile.full_name ||
            profile.name ||
            profile.username ||
            "EPHPHAVORA Member"
        )
        : "EPHPHAVORA Member";


    const username =
        profile &&
        profile.username
        ? profile.username
        : "";


    const avatarUrl =
        profile &&
        profile.avatar_url
        ? profile.avatar_url
        : "";


    const profileId =
        profile &&
        profile.id
        ? profile.id
        : null;


    const isOwnPost =
        currentUser &&
        post.user_id ===
            currentUser.id;


    const formattedDate =
        formatDate(
            post.created_at
        );


    let avatarHTML;


    if (avatarUrl) {

        avatarHTML = `

            <div class="avatar">

                <img
                    src="${escapeAttribute(avatarUrl)}"
                    alt="Profile"
                >

            </div>

        `;

    } else {

        const firstLetter =
            escapeHTML(
                fullName
                    .charAt(0)
                    .toUpperCase()
            );


        avatarHTML = `

            <div class="avatar">

                ${firstLetter}

            </div>

        `;

    }


    let authorHTML;


    if (profileId) {

        authorHTML = `

            <a
                class="author"
                href="profile.html?id=${encodeURIComponent(profileId)}"
            >

                ${avatarHTML}

                <div>

                    <div class="author-name">

                        ${escapeHTML(
                            fullName
                        )}

                    </div>

                    ${
                        username
                        ? `

                            <div class="username">

                                @${escapeHTML(
                                    username.replace(
                                        /^@/,
                                        ""
                                    )
                                )}

                            </div>

                          `
                        : ""
                    }

                </div>

            </a>

        `;

    } else {

        authorHTML = `

            <div class="author">

                ${avatarHTML}

                <div>

                    <div class="author-name">

                        ${escapeHTML(
                            fullName
                        )}

                    </div>

                </div>

            </div>

        `;

    }


    const imageUrl =
        post.image_url ||
        post.image ||
        null;


    let imageHTML = "";


    if (
        imageUrl &&
        !post.video_url
    ) {

        imageHTML = `

            <img
                class="post-image"
                src="${escapeAttribute(imageUrl)}"
                alt="Post image"
                loading="lazy"
            >

        `;

    }


    let videoHTML = "";


    if (post.video_url) {

        const safeVideoUrl =
            escapeAttribute(
                post.video_url
            );


        if (post.is_reel) {

            videoHTML = `

                <div
                    class="reel-wrapper"
                    style="position:relative;"
                >

                    <video
                        class="reel-video"
                        src="${safeVideoUrl}"
                        controls
                        playsinline
                        preload="metadata"
                    ></video>

                    <div class="reel-label">
                        🎬 REEL
                    </div>

                </div>

            `;

        } else {

            videoHTML = `

                <div class="video-wrapper">

                    <video
                        class="post-video"
                        src="${safeVideoUrl}"
                        controls
                        playsinline
                        preload="metadata"
                    ></video>

                </div>

            `;

        }

    }


    let deleteButton = "";


    if (isOwnPost) {

        deleteButton = `

            <button
                class="action-btn delete-btn"
                onclick="deletePost('${escapeAttribute(post.id)}')"
            >
                🗑 Delete
            </button>

        `;

    }


    const likedClass =
        likes.liked
        ? "liked"
        : "";


    const likeIcon =
        likes.liked
        ? "❤️"
        : "🤍";


    article.innerHTML = `

        <div class="post-header">

            ${authorHTML}

            <div class="post-date">

                ${formattedDate}

            </div>

        </div>

        ${
            post.content
            ? `

                <div class="post-content">

                    ${escapeHTML(
                        post.content
                    )}

                </div>

              `
            : ""
        }

        ${imageHTML}

        ${videoHTML}

        <div class="post-actions">

            <button
                class="action-btn like-btn ${likedClass}"
                id="like-${escapeAttribute(post.id)}"
                onclick="toggleLike('${escapeAttribute(post.id)}', ${likes.liked})"
            >

                <span class="like-icon">
                    ${likeIcon}
                </span>

                <span>
                    Like
                </span>

                <span
                    class="like-count"
                    id="count-${escapeAttribute(post.id)}"
                >
                    ${
                        likes.count > 0
                        ? likes.count
                        : ""
                    }
                </span>

            </button>

            ${deleteButton}

        </div>

    `;


    return article;

}


async function toggleLike(
    postId,
    currentlyLiked
) {

    const button =
        document.getElementById(
            "like-" + postId
        );


    const countElement =
        document.getElementById(
            "count-" + postId
        );


    if (!button) {
        return;
    }


    button.disabled = true;


    try {

        if (currentlyLiked) {

            const deleteUrl =
                SUPABASE_URL +
                "/rest/v1/post_likes" +
                "?post_id=eq." +
                encodeURIComponent(postId) +
                "&user_id=eq." +
                encodeURIComponent(
                    currentUser.id
                );


            const response =
                await fetch(

                    deleteUrl,

                    {
                        method: "DELETE",

                        headers:
                            supabaseHeaders()
                    }

                );


            if (!response.ok) {

                throw new Error(
                    await response.text()
                );

            }


            button.classList.remove(
                "liked"
            );


            button.querySelector(
                ".like-icon"
            ).textContent =
                "🤍";


            let count =
                parseInt(
                    countElement.textContent
                ) || 0;


            count =
                Math.max(
                    0,
                    count - 1
                );


            countElement.textContent =
                count > 0
                ? count
                : "";


            button.setAttribute(
                "onclick",
                `toggleLike('${escapeAttribute(postId)}', false)`
            );


        } else {

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/post_likes",

                    {
                        method: "POST",

                        headers:
                            supabaseHeaders({
                                "Content-Type":
                                    "application/json",

                                "Prefer":
                                    "return=minimal"
                            }),

                        body:
                            JSON.stringify({

                                post_id:
                                    postId,

                                user_id:
                                    currentUser.id

                            })
                    }

                );


            if (!response.ok) {

                const error =
                    await response.text();


                if (
                    response.status === 409
                ) {

                    await loadFeed();

                    return;

                }


                throw new Error(
                    error
                );

            }


            button.classList.add(
                "liked"
            );


            button.querySelector(
                ".like-icon"
            ).textContent =
                "❤️";


            let count =
                parseInt(
                    countElement.textContent
                ) || 0;


            count++;


            countElement.textContent =
                count;


            button.setAttribute(
                "onclick",
                `toggleLike('${escapeAttribute(postId)}', true)`
            );

        }


    } catch (error) {

        console.error(
            "Like error:",
            error
        );


        showStatus(
            "Could not update like.",
            "error"
        );

    } finally {

        button.disabled = false;

    }

}


async function uploadVideo(
    file
) {

    if (!file) {

        throw new Error(
            "Please choose a video."
        );

    }


    if (
        !file.type.startsWith(
            "video/"
        )
    ) {

        throw new Error(
            "Please select a video file."
        );

    }


    if (
        file.size >
        MAX_VIDEO_SIZE
    ) {

        throw new Error(
            "Video must be smaller than 50 MB."
        );

    }


    const extension =
        getFileExtension(
            file.name
        );


    const filePath =
        currentUser.id +
        "/video-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 8) +
        "." +
        extension;


    const uploadUrl =
        SUPABASE_URL +
        "/storage/v1/object/" +
        VIDEO_BUCKET +
        "/" +
        filePath;


    const response =
        await fetch(
            uploadUrl,
            {
                method: "POST",

                headers:
                    supabaseHeaders({
                        "Content-Type":
                            file.type,

                        "x-upsert":
                            "false"
                    }),

                body:
                    file
            }
        );


    if (!response.ok) {

        const errorText =
            await response.text();


        console.error(
            "Video upload error:",
            errorText
        );


        throw new Error(
            "Could not upload video. " +
            errorText
        );

    }


    return (
        SUPABASE_URL +
        "/storage/v1/object/public/" +
        VIDEO_BUCKET +
        "/" +
        filePath
    );

}


function getFileExtension(
    fileName
) {

    const parts =
        fileName.split(".");


    if (
        parts.length < 2
    ) {

        return "mp4";

    }


    return parts[
        parts.length - 1
    ]
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        ) || "mp4";

}


async function createPost() {

    const contentInput =
        document.getElementById(
            "postContent"
        );


    const imageInput =
        document.getElementById(
            "postImage"
        );


    const videoInput =
        document.getElementById(
            "postVideo"
        );


    const publishBtn =
        document.getElementById(
            "publishBtn"
        );


    const content =
        contentInput.value.trim();


    const imageFile =
        imageInput.files[0] ||
        null;


    const videoFile =
        videoInput.files[0] ||
        null;


    if (
        selectedMediaMode === "image" &&
        !content &&
        !imageFile
    ) {

        showStatus(
            "Write something or choose an image.",
            "error"
        );

        return;

    }


    if (
        (
            selectedMediaMode === "video" ||
            selectedMediaMode === "reel"
        ) &&
        !videoFile
    ) {

        showStatus(
            selectedMediaMode === "reel"
            ? "Choose a video for your Reel."
            : "Choose a video.",
            "error"
        );

        return;

    }


    publishBtn.disabled = true;

    publishBtn.textContent =
        "POSTING...";


    try {

        let imageUrl = null;

        let videoUrl = null;


        if (
            selectedMediaMode === "image" &&
            imageFile
        ) {

            if (
                !imageFile.type.startsWith(
                    "image/"
                )
            ) {

                throw new Error(
                    "Please select an image file."
                );

            }


            if (
                imageFile.size >
                5 * 1024 * 1024
            ) {

                throw new Error(
                    "Image must be smaller than 5 MB."
                );

            }


            imageUrl =
                await fileToDataURL(
                    imageFile
                );

        }


        if (
            selectedMediaMode === "video" ||
            selectedMediaMode === "reel"
        ) {

            showStatus(
                "Uploading video..."
            );


            videoUrl =
                await uploadVideo(
                    videoFile
                );

        }


        const postData = {

            user_id:
                currentUser.id,

            content:
                content || null,

            image_url:
                imageUrl,

            video_url:
                videoUrl,

            is_reel:
                selectedMediaMode === "reel"

        };


        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/posts",

                {
                    method: "POST",

                    headers:
                        supabaseHeaders({

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=representation"

                        }),

                    body:
                        JSON.stringify(
                            postData
                        )

                }

            );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        contentInput.value =
            "";


        imageInput.value =
            "";


        videoInput.value =
            "";


        document.getElementById(
            "imageName"
        ).textContent =
            "";


        document.getElementById(
            "videoName"
        ).textContent =
            "";


        selectMediaMode(
            "image"
        );


        showStatus(
            selectedMediaMode === "reel"
            ? "Reel published successfully! 🎬"
            : "Post published successfully! 🎉",
            "success"
        );


        await loadFeed();


    } catch (error) {

        console.error(
            "Create post error:",
            error
        );


        showStatus(
            error.message ||
            "Could not publish post.",
            "error"
        );


    } finally {

        publishBtn.disabled =
            false;


        publishBtn.textContent =
            "POST";

    }

}


async function deletePost(
    postId
) {

    if (!postId) {
        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this post?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/posts" +
                "?id=eq." +
                encodeURIComponent(
                    postId
                ) +
                "&user_id=eq." +
                encodeURIComponent(
                    currentUser.id
                ),

                {
                    method: "DELETE",

                    headers:
                        supabaseHeaders()
                }

            );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        showStatus(
            "Post deleted.",
            "success"
        );


        await loadFeed();


    } catch (error) {

        console.error(
            "Delete error:",
            error
        );


        showStatus(
            "Could not delete the post.",
            "error"
        );

    }

}


function fileToDataURL(
    file
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );


            reader.onerror =
                () =>
                    reject(
                        new Error(
                            "Could not read image."
                        )
                    );


            reader.readAsDataURL(
                file
            );

        }
    );

}


document
    .getElementById(
        "postImage"
    )
    .addEventListener(

            ) {

                    " (" +

                    "";

            }

        }
    );


function formatDate(
    dateString
) {

    if (!dateString) {
        return "";
    }


    const date =
        new Date(
            dateString
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleString(
        undefined,
        {
            month: "short",
            day: "numeric",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit"
        }
    );

}

    showStatus("");


    document.getElementById(
        "feed"
    ).innerHTML = `

        <div class="empty">

            <h3>
                No posts yet
            </h3>

            <p>
                Be the first person to
                post something on EPHPHAVORA.
            </p>

        </div>

    `;

}


function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );

}


async function logout() {

    try {

        if (accessToken) {

            await fetch(

                SUPABASE_URL +
                "/auth/v1/logout",

                {
                    method: "POST",

                    headers:
                        supabaseHeaders()
                }

            );

        }

    } catch (error) {

        console.error(
            "Logout error:",
            error
        );

    }


    localStorage.removeItem(
        "berakah_access_token"
    );


    localStorage.removeItem(
        "berakah_refresh_token"
    );


    window.location.href =
        "login.html";

}


async function startFeed() {

    const user =
        await getCurrentUser();


    if (!user) {
        return;
    }


    await loadFeed();

}


startFeed();
