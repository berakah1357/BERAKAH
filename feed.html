<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Feed</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 2px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  width: 100%;
  max-width: 650px;
  margin: 25px auto;
  padding: 0 15px;
}

.composer,
.post {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

.composer h2 {
  margin-top: 0;
}

textarea {
  width: 100%;
  min-height: 90px;
  resize: vertical;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 15px;
  font-family: Arial, sans-serif;
}

.image-input {
  width: 100%;
  margin-top: 10px;
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
}

.post-button,
.comment-button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border: none;
  border-radius: 9px;
  background: #111827;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.post-button:disabled,
.comment-button:disabled {
  opacity: 0.6;
}

.post-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.username {
  font-weight: bold;
}

.time {
  color: #6b7280;
  font-size: 12px;
}

.post-content {
  margin: 15px 0;
  line-height: 1.5;
  white-space: pre-wrap;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 10px;
}

.actions {
  border-top: 1px solid #eee;
  padding-top: 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.actions button {
  border: none;
  background: #f3f4f6;
  padding: 9px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.liked {
  background: #fee2e2 !important;
}

.delete {
  color: #b91c1c !important;
  margin-left: auto;
}

.comments {
  display: none;
  border-top: 1px solid #eee;
  margin-top: 12px;
  padding-top: 12px;
}

.comments.show {
  display: block;
}

.comment {
  background: #f9fafb;
  padding: 10px;
  border-radius: 9px;
  margin-bottom: 8px;
}

.comment-user {
  font-weight: bold;
  font-size: 14px;
}

.comment-time {
  color: #6b7280;
  font-size: 11px;
}

.comment-text {
  margin-top: 5px;
  white-space: pre-wrap;
}

.comment-delete {
  border: none;
  background: transparent;
  color: #b91c1c;
  padding: 5px 0;
  cursor: pointer;
}

#message {
  text-align: center;
  font-weight: bold;
  margin-bottom: 15px;
}

#loading {
  text-align: center;
  padding: 20px;
}

.no-comments {
  color: #6b7280;
  font-size: 13px;
  margin-bottom: 10px;
}

</style>

</head>

<body>

<header>

<div class="nav">

<div class="logo">
BERAKAH
</div>

<div class="nav-buttons">

<button onclick="location.href='index.html'">
Home
</button>

<button onclick="location.href='marketplace.html'">
Market
</button>

<button onclick="location.href='notifications.html'">
🔔
</button>

<button class="logout" id="logoutButton">
Logout
</button>

</div>

</div>

</header>


<main>


<div class="composer">

<h2>Create a Post</h2>

<textarea
id="postText"
placeholder="What's on your mind?"
></textarea>

<input
id="imageUrl"
class="image-input"
type="url"
placeholder="Optional image URL"
>

<button
id="postButton"
class="post-button"
>
POST
</button>

</div>


<div id="message"></div>

<div id="loading">
Loading posts...
</div>

<div id="feed"></div>


</main>


<script>


const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken =
localStorage.getItem("berakah_access_token");


let currentUser = null;


if (!accessToken) {

location.href = "login.html";

}


/* -------------------------
   HEADERS
------------------------- */

function headers(extra) {

return Object.assign({

"apikey": SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + accessToken

}, extra || {});

}


/* -------------------------
   HTML SAFETY
------------------------- */

function safe(value) {

return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* -------------------------
   CURRENT USER
------------------------- */

async function getCurrentUser() {

try {

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{
headers: headers()
}

);


if (!response.ok) {

throw new Error(
"Session expired."
);

}


currentUser =
await response.json();


return true;


} catch(error) {

localStorage.clear();

location.href =
"login.html";

return false;

}

}


/* -------------------------
   LOAD POSTS
------------------------- */

async function loadPosts() {

const loading =
document.getElementById("loading");

const feed =
document.getElementById("feed");

const message =
document.getElementById("message");


try {


/* GET POSTS */

const postsResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/posts?select=*&order=created_at.desc",

{
headers: headers()
}

);


const postsText =
await postsResponse.text();


if (!postsResponse.ok) {

throw new Error(
postsText ||
"Could not load posts."
);

}


let posts = [];

if (postsText.trim()) {

posts =
JSON.parse(postsText);

}


/* GET LIKES */

let likes = [];


try {

const likesResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/post_likes?select=post_id,user_id",

{
headers: headers()
}

);


if (likesResponse.ok) {

const likesText =
await likesResponse.text();

if (likesText.trim()) {

likes =
JSON.parse(likesText);

}

}

} catch(error) {

console.log(
"Likes could not load:",
error
);

}


/* GET COMMENTS */

let comments = [];


try {

const commentsResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/post_comments?select=*",

{
headers: headers()
}

);


if (commentsResponse.ok) {

const commentsText =
await commentsResponse.text();

if (commentsText.trim()) {

comments =
JSON.parse(commentsText);

}

}

} catch(error) {

console.log(
"Comments could not load:",
error
);

}


/* STOP LOADING */

loading.style.display =
"none";


feed.innerHTML = "";


/* NO POSTS */

if (!posts.length) {

feed.innerHTML =

"<div class='post'>" +
"No posts yet. Be the first to post!" +
"</div>";

return;

}


/* DISPLAY POSTS */

posts.forEach(function(post) {


const article =
document.createElement("div");


article.className =
"post";


/* LIKES */

const postLikes =
likes.filter(function(like) {

return like.post_id === post.id;

});


const likedByMe =
postLikes.some(function(like) {

return like.user_id ===
currentUser.id;

});


/* COMMENTS */

const postComments =
comments.filter(function(comment) {

return comment.post_id === post.id;

});


const username =
post.username ||
"BERAKAH User";


const date =
new Date(post.created_at);


/* COMMENTS HTML */

let commentsHTML = "";


if (!postComments.length) {

commentsHTML =
"<div class='no-comments'>" +
"No comments yet." +
"</div>";

} else {


commentsHTML =
postComments.map(function(comment) {


const commentDelete =
comment.user_id ===
currentUser.id

?

"<button class='comment-delete' " +
"onclick=\"deleteComment('" +
comment.id +
"')\">" +
"Delete" +
"</button>"

:

"";


return `

<div class="comment">

<div class="comment-user">
${safe(comment.username || "BERAKAH User")}
</div>

<div class="comment-time">
${new Date(comment.created_at).toLocaleString()}
</div>

<div class="comment-text">
${safe(comment.content)}
</div>

${commentDelete}

</div>

`;

}).join("");

}


/* POST HTML */

article.innerHTML = `

<div class="post-header">

<div class="username">
${safe(username)}
</div>

<div class="time">
${date.toLocaleString()}
</div>

</div>


<div class="post-content">
${safe(post.content)}
</div>


${
post.image_url

?

`
<img
class="post-image"
src="${safe(post.image_url)}"
alt="Post image"
>
`

:

""
}


<div class="actions">


<button
class="${likedByMe ? "liked" : ""}"
onclick="likePost('${post.id}')"
>

${likedByMe ? "❤️ Unlike" : "❤️ Like"}

(${postLikes.length})

</button>


<button
onclick="toggleComments('${post.id}')"
>

💬 Comments
(${postComments.length})

</button>


${
post.user_id === currentUser.id

?

`
<button
class="delete"
onclick="deletePost('${post.id}')"
>
Delete
</button>
`

:

""
}


</div>


<div
id="comments-${post.id}"
class="comments"
>


<strong>
💬 Comments
</strong>


<div>

${commentsHTML}

</div>


<textarea
id="comment-${post.id}"
placeholder="Write a comment..."
></textarea>


<button
class="comment-button"
onclick="addComment('${post.id}')"
>
POST COMMENT
</button>


</div>

`;


feed.appendChild(article);

});


} catch(error) {


loading.style.display =
"none";


message.textContent =
error.message;


console.error(error);

}

}


/* -------------------------
   CREATE POST
------------------------- */

document
.getElementById("postButton")
.addEventListener(
"click",
async function() {


const text =
document
.getElementById("postText")
.value
.trim();


const imageUrl =
document
.getElementById("imageUrl")
.value
.trim();


const message =
document.getElementById("message");


if (!text) {

message.textContent =
"Please write something first.";

return;

}


this.disabled = true;

this.textContent =
"POSTING...";


try {


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/posts",

{

method: "POST",

headers: headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body: JSON.stringify({

user_id:
currentUser.id,

username:
currentUser.user_metadata?.username ||
currentUser.email?.split("@")[0] ||
"BERAKAH User",

content:
text,

image_url:
imageUrl || null

})

}

);


if (!response.ok) {

throw new Error(
await response.text()
);

}


document
.getElementById("postText")
.value = "";


document
.getElementById("imageUrl")
.value = "";


message.textContent =
"Post published successfully!";


await loadPosts();


} catch(error) {

message.textContent =
error.message;

}


this.disabled = false;

this.textContent =
"POST";

});


/* -------------------------
   LIKE / UNLIKE
------------------------- */

async function likePost(postId) {

try {


const check =
await fetch(

SUPABASE_URL +
"/rest/v1/post_likes" +
"?post_id=eq." +
encodeURIComponent(postId) +
"&user_id=eq." +
encodeURIComponent(currentUser.id),

{
headers: headers()
}

);


const checkText =
await check.text();


let existing = [];


if (checkText.trim()) {

existing =
JSON.parse(checkText);

}


/* UNLIKE */

if (existing.length) {


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/post_likes" +
"?post_id=eq." +
encodeURIComponent(postId) +
"&user_id=eq." +
encodeURIComponent(currentUser.id),

{

method: "DELETE",

headers:
headers()

}

);


if (!response.ok) {

throw new Error(
"Could not unlike post."
);

}


}


/* LIKE */

else {


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/post_likes",

{

method: "POST",

headers: headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body: JSON.stringify({

post_id:
postId,

user_id:
currentUser.id

})

}

);


if (!response.ok) {

throw new Error(
await response.text()
);

}

}


await loadPosts();


} catch(error) {

alert(error.message);

}

}


/* -------------------------
   SHOW COMMENTS
------------------------- */

function toggleComments(postId) {

const box =
document.getElementById(
"comments-" + postId
);


if (!box) return;


box.classList.toggle("show");

}


/* -------------------------
   ADD COMMENT
------------------------- */

async function addComment(postId) {


const input =
document.getElementById(
"comment-" + postId
);


const content =
input.value.trim();


if (!content) {

alert(
"Please write a comment."
);

return;

}


try {


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/post_comments",

{

method: "POST",

headers: headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body: JSON.stringify({

post_id:
postId,

user_id:
currentUser.id,

username:
currentUser.user_metadata?.username ||
currentUser.email?.split("@")[0] ||
"BERAKAH User",

content:
content

})

}

);


if (!response.ok) {

throw new Error(
await response.text()
);

}


await loadPosts();


const box =
document.getElementById(
"comments-" + postId
);


if (box) {

box.classList.add("show");

}


} catch(error) {

alert(error.message);

}

}


/* -------------------------
   DELETE COMMENT
------------------------- */

async function deleteComment(commentId) {


if (!confirm(
"Delete this comment?"
)) {

return;

}


try {


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/post_comments" +
"?id=eq." +
encodeURIComponent(commentId),

{

method: "DELETE",

headers:
headers()

}

);


if (!response.ok) {

throw new Error(
await response.text()
);

}


await loadPosts();


} catch(error) {

alert(error.message);

}

}


/* -------------------------
   DELETE POST
------------------------- */

async function deletePost(postId) {


if (!confirm(
"Delete this post?"
)) {

return;

}


try {


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/posts" +
"?id=eq." +
encodeURIComponent(postId),

{

method: "DELETE",

headers:
headers()

}

);


if (!response.ok) {

throw new Error(
await response.text()
);

}


await loadPosts();


} catch(error) {

alert(error.message);

}

}


/* -------------------------
   LOGOUT
------------------------- */

document
.getElementById("logoutButton")
.addEventListener(
"click",
function() {


localStorage.removeItem(
"berakah_access_token"
);


localStorage.removeItem(
"berakah_refresh_token"
);


localStorage.removeItem(
"berakah_user"
);


location.href =
"login.html";

});


/* -------------------------
   START
------------------------- */

(async function() {


const loggedIn =
await getCurrentUser();


if (loggedIn) {

await loadPosts();

}


})();


</script>

</body>
</html>
