<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EPHPHAVORA - Feed</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

/* HEADER */

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #111827;
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav a,
.logout-btn {
    text-decoration: none;
    color: #374151;
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 8px;
}

nav a:hover,
.logout-btn:hover {
    background: #f3f4f6;
}

.logout-btn {
    border: none;
    background: transparent;
    cursor: pointer;
}

/* MAIN */

.container {
    max-width: 700px;
    margin: 25px auto;
    padding: 0 15px;
}

/* CREATE POST */

.create-post {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 22px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.create-post h2 {
    margin-top: 0;
    font-size: 20px;
}

textarea {
    width: 100%;
    min-height: 90px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 12px;
    resize: vertical;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

.media-type {
    display: flex;
    gap: 8px;
    margin: 12px 0;
    flex-wrap: wrap;
}

.media-type button {
    border: 1px solid #d1d5db;
    background: white;
    padding: 9px 13px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.media-type button.active {
    background: #111827;
    color: white;
    border-color: #111827;
}

.file-area {
    margin: 10px 0;
}

.file-area input {
    width: 100%;
}

.upload-note {
    color: #6b7280;
    font-size: 12px;
    margin-top: 5px;
}

.publish-btn {
    width: 100%;
    border: none;
    background: #111827;
    color: white;
    padding: 12px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 8px;
}

.publish-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

/* POST */

.post {
    background: white;
    border-radius: 14px;
    margin-bottom: 22px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: #e5e7eb;
}

.post-user {
    font-weight: bold;
}

.post-date {
    color: #6b7280;
    font-size: 12px;
    margin-top: 3px;
}

.post-content {
    padding: 0 16px 14px;
    white-space: pre-wrap;
    word-break: break-word;
}

.post-image {
    width: 100%;
    max-height: 600px;
    object-fit: contain;
    background: #000;
    display: block;
}

/* VIDEO */

.video-wrapper {
    width: 100%;
    background: #000;
}

.post-video {
    width: 100%;
    max-height: 650px;
    display: block;
    background: #000;
}

/* REELS */

.reel-wrapper {
    width: 100%;
    max-height: 800px;
    background: #000;
    display: flex;
    justify-content: center;
    position: relative;
}

.reel-video {
    width: 100%;
    max-width: 430px;
    max-height: 800px;
    object-fit: contain;
    background: #000;
}

.reel-label {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,.7);
    color: white;
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

/* ACTIONS */

.post-actions {
    display: flex;
    gap: 10px;
    padding: 12px 16px 16px;
    border-top: 1px solid #f0f0f0;
}

.action-btn {
    border: none;
    background: #f3f4f6;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.action-btn:hover {
    background: #e5e7eb;
}

.delete-btn {
    margin-left: auto;
    color: #b91c1c;
}

/* EMPTY */

.empty {
    text-align: center;
    color: #6b7280;
    padding: 30px;
}

/* STATUS */

.status {
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: none;
    font-size: 14px;
}

.status.success {
    display: block;
    background: #ecfdf5;
    color: #065f46;
}

.status.error {
    display: block;
    background: #fef2f2;
    color: #991b1b;
}

/* MOBILE */

@media (max-width: 700px) {

    header {
        padding: 12px;
    }

    .header-inner {
        align-items: flex-start;
        flex-direction: column;
    }

    nav {
        width: 100%;
    }

    nav a,
    .logout-btn {
        font-size: 13px;
    }

    .container {
        margin-top: 15px;
    }

}

</style>
</head>

<body>

<header>

<div class="header-inner">

<div class="logo">
EPHPHAVORA
</div>

<nav>
<a href="index.html">Home</a>
<a href="feed.html">Feed</a>
<a href="people.html">People</a>
<a href="marketplace.html">Market</a>
<a href="notifications.html">Notifications</a>
<a href="messages.html">Messages</a>
<a href="profile.html">Profile</a>
<a href="seller-dashboard.html">Dashboard</a>
<button class="logout-btn" onclick="logout()">Logout</button>
</nav>

</div>

</header>


<main class="container">

<div id="status" class="status"></div>


<!-- CREATE POST -->

<section class="create-post">

<h2>Create a Post</h2>

<textarea
id="postContent"
placeholder="What's on your mind?"
></textarea>


<div class="media-type">

<button
id="imageModeBtn"
class="active"
onclick="selectMediaMode('image')"
>
📷 Image
</button>

<button
id="videoModeBtn"
onclick="selectMediaMode('video')"
>
🎥 Video
</button>

<button
id="reelModeBtn"
onclick="selectMediaMode('reel')"
>
🎬 Reel
</button>

</div>


<div
id="imageArea"
class="file-area"
>

<input
type="file"
id="postImage"
accept="image/*"
>

</div>


<div
id="videoArea"
class="file-area"
style="display:none;"
>

<input
type="file"
id="postVideo"
accept="video/mp4,video/webm,video/quicktime"
>

<div class="upload-note">
Maximum video size: 50 MB
</div>

</div>


<button
id="publishBtn"
class="publish-btn"
onclick="createPost()"
>
Publish
</button>

</section>


<!-- FEED -->

<section id="feed"></section>

</main>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const VIDEO_BUCKET = "videos";

const MAX_VIDEO_SIZE =
    50 * 1024 * 1024;


/* =========================
   STATE
========================= */

let currentUser = null;

let selectedMediaMode = "image";


/* =========================
   ELEMENTS
========================= */

const statusBox =
    document.getElementById("status");

const feed =
    document.getElementById("feed");

const publishBtn =
    document.getElementById("publishBtn");


/* =========================
   STATUS
========================= */

function showStatus(message, type = "success") {

    statusBox.textContent = message;

    statusBox.className =
        "status " + type;

    setTimeout(() => {

        statusBox.className =
            "status";

    }, 5000);
}


/* =========================
   AUTH
========================= */

async function getCurrentUser() {

    const token =
        localStorage.getItem(
            "berakah_access_token"
        );

    if (!token) {

        window.location.href =
            "login.html";

        return null;
    }

    try {

        const response =
            await fetch(
                `${SUPABASE_URL}/auth/v1/user`,
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );

        if (!response.ok) {

            localStorage.removeItem(
                "berakah_access_token"
            );

            window.location.href =
                "login.html";

            return null;
        }

        return await response.json();

    } catch (error) {

        console.error(error);

        showStatus(
            "Unable to verify login.",
            "error"
        );

        return null;
    }
}


/* =========================
   MEDIA MODE
========================= */

function selectMediaMode(mode) {

    selectedMediaMode = mode;

    const imageBtn =
        document.getElementById(
            "imageModeBtn"
        );

    const videoBtn =
        document.getElementById(
            "videoModeBtn"
        );

    const reelBtn =
        document.getElementById(
            "reelModeBtn"
        );

    const imageArea =
        document.getElementById(
            "imageArea"
        );

    const videoArea =
        document.getElementById(
            "videoArea"
        );


    imageBtn.classList.remove("active");

    videoBtn.classList.remove("active");

    reelBtn.classList.remove("active");


    if (mode === "image") {

        imageBtn.classList.add("active");

        imageArea.style.display =
            "block";

        videoArea.style.display =
            "none";

    } else {

        if (mode === "video") {

            videoBtn.classList.add(
                "active"
            );

        }

        if (mode === "reel") {

            reelBtn.classList.add(
                "active"
            );

        }

        imageArea.style.display =
            "none";

        videoArea.style.display =
            "block";
    }
}


/* =========================
   LOAD FEED
========================= */

async function loadFeed() {

    feed.innerHTML =
        `<div class="empty">Loading feed...</div>`;

    try {

        const token =
            localStorage.getItem(
                "berakah_access_token"
            );


        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/posts?select=*,profiles(username,avatar_url),likes(user_id)&order=created_at.desc`,
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Feed error:",
                errorText
            );

            throw new Error(
                "Could not load feed."
            );
        }


        const posts =
            await response.json();


        if (!posts.length) {

            feed.innerHTML =
                `<div class="empty">
                    No posts yet.
                </div>`;

            return;
        }


        feed.innerHTML = "";


        posts.forEach(post => {

            feed.appendChild(
                createPostCard(post)
            );

        });

    } catch (error) {

        console.error(error);

        feed.innerHTML =
            `<div class="empty">
                Unable to load feed.
            </div>`;
    }
}


/* =========================
   CREATE POST CARD
========================= */

function createPostCard(post) {

    const article =
        document.createElement("article");

    article.className = "post";


    const profile =
        post.profiles || {};

    const username =
        profile.username ||
        "EPHPHAVORA User";


    const avatar =
        profile.avatar_url ||
        "https://via.placeholder.com/100";


    const createdDate =
        post.created_at
            ? new Date(
                post.created_at
              ).toLocaleString()
            : "";


    const likes =
        Array.isArray(post.likes)
            ? post.likes
            : [];


    const userLiked =
        currentUser &&
        likes.some(
            like =>
                like.user_id ===
                currentUser.id
        );


    let mediaHTML = "";


    /* IMAGE */

    if (
        post.image_url &&
        !post.video_url
    ) {

        mediaHTML = `
            <img
                class="post-image"
                src="${escapeHtml(
                    post.image_url
                )}"
                alt="Post image"
            >
        `;

    }


    /* VIDEO */

    if (
        post.video_url &&
        !post.is_reel
    ) {

        mediaHTML = `
            <div class="video-wrapper">

                <video
                    class="post-video"
                    controls
                    playsinline
                    preload="metadata"
                >

                    <source
                        src="${escapeHtml(
                            post.video_url
                        )}"
                    >

                    Your browser does not
                    support video playback.

                </video>

            </div>
        `;

    }


    /* REEL */

    if (
        post.video_url &&
        post.is_reel
    ) {

        mediaHTML = `
            <div class="reel-wrapper">

                <div class="reel-label">
                    🎬 REEL
                </div>

                <video
                    class="reel-video"
                    controls
                    playsinline
                    preload="metadata"
                >

                    <source
                        src="${escapeHtml(
                            post.video_url
                        )}"
                    >

                    Your browser does not
                    support video playback.

                </video>

            </div>
        `;

    }


    article.innerHTML = `

        <div class="post-header">

            <img
                class="avatar"
                src="${escapeHtml(avatar)}"
                alt="Profile"
                onerror="this.src='https://via.placeholder.com/100'"
            >

            <div>

                <div class="post-user">
                    ${escapeHtml(username)}
                </div>

                <div class="post-date">
                    ${escapeHtml(createdDate)}
                </div>

            </div>

        </div>


        ${
            post.content
                ? `
                    <div class="post-content">
                        ${escapeHtml(
                            post.content
                        )}
                    </div>
                `
                : ""
        }


        ${mediaHTML}


        <div class="post-actions">

            <button
                class="action-btn"
                onclick="toggleLike('${post.id}')"
            >

                ${userLiked ? "❤️" : "🤍"}

                ${likes.length}

            </button>


            ${
                currentUser &&
                post.user_id === currentUser.id
                    ? `
                        <button
                            class="action-btn delete-btn"
                            onclick="deletePost('${post.id}')"
                        >
                            🗑 Delete
                        </button>
                    `
                    : ""
            }

        </div>

    `;


    return article;
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   IMAGE TO DATA URL
========================= */

function imageToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(file);
        }
    );
}


/* =========================
   UPLOAD VIDEO
========================= */

async function uploadVideo(file) {

    if (!file) {

        throw new Error(
            "Please select a video."
        );
    }


    if (
        !file.type.startsWith(
            "video/"
        )
    ) {

        throw new Error(
            "Please select a valid video file."
        );
    }


    if (
        file.size >
        MAX_VIDEO_SIZE
    ) {

        throw new Error(
            "Video is too large. Maximum size is 50 MB."
        );
    }


    const token =
        localStorage.getItem(
            "berakah_access_token"
        );


    const extension =
        file.name.includes(".")
            ? file.name
                .split(".")
                .pop()
                .toLowerCase()
            : "mp4";


    const filePath =
        `${currentUser.id}/${Date.now()}-${Math.random()
            .toString(36)
            .substring(2)}.${extension}`;


    const uploadResponse =
        await fetch(
            `${SUPABASE_URL}/storage/v1/object/${VIDEO_BUCKET}/${filePath}`,
            {
                method: "POST",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${token}`,
                    "Content-Type":
                        file.type ||
                        "video/mp4"
                },

                body: file
            }
        );


    if (!uploadResponse.ok) {

        const errorText =
            await uploadResponse.text();

        console.error(
            "Video upload error:",
            errorText
        );

        throw new Error(
            "Video upload failed."
        );
    }


    return `${SUPABASE_URL}/storage/v1/object/public/${VIDEO_BUCKET}/${filePath}`;
}


/* =========================
   CREATE POST
========================= */

async function createPost() {

    if (!currentUser) {

        showStatus(
            "Please log in first.",
            "error"
        );

        return;
    }


    const content =
        document
            .getElementById(
                "postContent"
            )
            .value
            .trim();


    const imageInput =
        document.getElementById(
            "postImage"
        );


    const videoInput =
        document.getElementById(
            "postVideo"
        );


    const imageFile =
        imageInput.files[0];


    const videoFile =
        videoInput.files[0];


    const publishedMode =
        selectedMediaMode;


    /* IMAGE VALIDATION */

    if (
        publishedMode === "image" &&
        !content &&
        !imageFile
    ) {

        showStatus(
            "Write something or select an image.",
            "error"
        );

        return;
    }


    /* VIDEO / REEL VALIDATION */

    if (
        (
            publishedMode === "video" ||
            publishedMode === "reel"
        ) &&
        !videoFile
    ) {

        showStatus(
            publishedMode === "reel"
                ? "Please select a Reel video."
                : "Please select a video.",
            "error"
        );

        return;
    }


    publishBtn.disabled = true;

    publishBtn.textContent =
        "Publishing...";


    try {

        let imageUrl = null;

        let videoUrl = null;


        /* IMAGE */

        if (
            publishedMode === "image" &&
            imageFile
        ) {

            if (
                !imageFile.type.startsWith(
                    "image/"
                )
            ) {

                throw new Error(
                    "Please select a valid image."
                );
            }


            imageUrl =
                await imageToDataURL(
                    imageFile
                );
        }


        /* VIDEO */

        if (
            publishedMode === "video" ||
            publishedMode === "reel"
        ) {

            videoUrl =
                await uploadVideo(
                    videoFile
                );
        }


        /*
           IMPORTANT:

           posts.content is currently
           NOT NULL in Supabase.

           Therefore video/Reel posts
           without captions receive
           a default caption.
        */

        let finalContent =
            content;


        if (!finalContent) {

            if (
                publishedMode === "reel"
            ) {

                finalContent =
                    "🎬 Reel";

            } else if (
                publishedMode === "video"
            ) {

                finalContent =
                    "🎥 Video";

            } else {

                finalContent =
                    "📷 Image";
            }
        }


        const postData = {

            user_id:
                currentUser.id,

            content:
                finalContent,

            image_url:
                imageUrl,

            video_url:
                videoUrl,

            is_reel:
                publishedMode === "reel"
        };


        const token =
            localStorage.getItem(
                "berakah_access_token"
            );


        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/posts`,
                {
                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${token}`,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"
                    },

                    body:
                        JSON.stringify(
                            postData
                        )
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Create post error:",
                errorText
            );

            throw new Error(
                errorText ||
                "Failed to create post."
            );
        }


        /*
           RESET FORM
        */

        document
            .getElementById(
                "postContent"
            )
            .value = "";


        imageInput.value = "";

        videoInput.value = "";


        selectMediaMode("image");


        /* SUCCESS MESSAGE */

        if (
            publishedMode === "reel"
        ) {

            showStatus(
                "🎬 Reel published successfully!"
            );

        } else if (
            publishedMode === "video"
        ) {

            showStatus(
                "🎥 Video published successfully!"
            );

        } else {

            showStatus(
                "📷 Post published successfully!"
            );
        }


        await loadFeed();


    } catch (error) {

        console.error(error);

        showStatus(
            error.message ||
            "Something went wrong while publishing.",
            "error"
        );

    } finally {

        publishBtn.disabled = false;

        publishBtn.textContent =
            "Publish";
    }
}


/* =========================
   LIKE / UNLIKE
========================= */

async function toggleLike(postId) {

    if (!currentUser) {

        return;
    }


    const token =
        localStorage.getItem(
            "berakah_access_token"
        );


    try {

        const checkResponse =
            await fetch(
                `${SUPABASE_URL}/rest/v1/likes?select=*&post_id=eq.${encodeURIComponent(postId)}&user_id=eq.${encodeURIComponent(currentUser.id)}`,
                {
                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const existingLikes =
            await checkResponse.json();


        if (
            existingLikes.length > 0
        ) {

            await fetch(
                `${SUPABASE_URL}/rest/v1/likes?post_id=eq.${encodeURIComponent(postId)}&user_id=eq.${encodeURIComponent(currentUser.id)}`,
                {
                    method: "DELETE",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );

        } else {

            await fetch(
                `${SUPABASE_URL}/rest/v1/likes`,
                {
                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${token}`,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"
                    },

                    body:
                        JSON.stringify({
                            post_id:
                                postId,

                            user_id:
                                currentUser.id
                        })
                }
            );
        }


        await loadFeed();


    } catch (error) {

        console.error(
            "Like error:",
            error
        );

        showStatus(
            "Unable to update like.",
            "error"
        );
    }
}


/* =========================
   DELETE POST
========================= */

async function deletePost(postId) {

    if (!currentUser) {

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this post?"
        );


    if (!confirmed) {

        return;
    }


    const token =
        localStorage.getItem(
            "berakah_access_token"
        );


    try {

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/posts?id=eq.${encodeURIComponent(postId)}&user_id=eq.${encodeURIComponent(currentUser.id)}`,
                {
                    method: "DELETE",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Delete error:",
                errorText
            );

            throw new Error(
                "Failed to delete post."
            );
        }


        showStatus(
            "Post deleted successfully."
        );


        await loadFeed();


    } catch (error) {

        console.error(error);

        showStatus(
            error.message ||
            "Unable to delete post.",
            "error"
        );
    }
}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "berakah_access_token"
    );

    localStorage.removeItem(
        "berakah_refresh_token"
    );

    localStorage.removeItem(
        "berakah_user"
    );

    localStorage.removeItem(
        "berakah_username"
    );

    localStorage.removeItem(
        "berakah_auth_user_id"
    );


    window.location.href =
        "login.html";
}


/* =========================
   START
========================= */

(async function init() {

    currentUser =
        await getCurrentUser();


    if (!currentUser) {

        return;
    }


    await loadFeed();

})();
