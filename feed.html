<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - People</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 2px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  width: 100%;
  max-width: 650px;
  margin: 25px auto;
  padding: 0 15px;
}

.box {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

h1 {
  margin-top: 0;
}

#loading {
  text-align: center;
  padding: 20px;
}

#message {
  text-align: center;
  font-weight: bold;
  margin: 15px 0;
}

.person {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px 0;
  border-bottom: 1px solid #eeeeee;
}

.person:last-child {
  border-bottom: none;
}

.avatar {
  width: 52px;
  height: 52px;
  min-width: 52px;
  border-radius: 50%;
  background: #111827;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
}

.person-info {
  flex: 1;
}

.person-name {
  font-size: 17px;
  font-weight: bold;
}

.person-status {
  color: #6b7280;
  font-size: 13px;
  margin-top: 4px;
}

.profile-button {
  border: none;
  background: #111827;
  color: white;
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 25px 10px;
}

</style>

</head>


<body>


<header>

<div class="nav">

<div class="logo">
BERAKAH
</div>


<div class="nav-buttons">

<button onclick="location.href='index.html'">
Home
</button>

<button onclick="location.href='feed.html'">
Feed
</button>

<button onclick="location.href='marketplace.html'">
Market
</button>

<button onclick="location.href='notifications.html'">
🔔
</button>

<button
class="logout"
id="logoutButton"
>
Logout
</button>

</div>

</div>

</header>



<main>

<div class="box">

<h1>👥 People</h1>

<div id="loading">
Loading people...
</div>

<div id="message"></div>

<div id="people"></div>

</div>

</main>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;



/* =========================
   LOGIN CHECK
========================= */

if (!accessToken) {

location.href =
"login.html";

}



/* =========================
   HEADERS
========================= */

function headers(extra) {

return Object.assign({

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + accessToken

}, extra || {});

}



/* =========================
   HTML SAFETY
========================= */

function safe(value) {

return String(value || "")

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}



/* =========================
   CURRENT USER
========================= */

async function getCurrentUser() {

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{
headers:
headers()
}

);


if (!response.ok) {

throw new Error(
"Your login session has expired. Please login again."
);

}


currentUser =
await response.json();

}



/* =========================
   LOAD PEOPLE
========================= */

async function loadPeople() {


const loading =
document.getElementById(
"loading"
);


const peopleBox =
document.getElementById(
"people"
);


const message =
document.getElementById(
"message"
);


try {


/* GET CURRENT USER */

await getCurrentUser();



/* GET POSTS */

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/posts" +
"?select=user_id,username" +
"&order=created_at.desc",

{
headers:
headers()
}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load people.\n\n" +
text
);

}


let posts = [];


if (text.trim()) {

posts =
JSON.parse(text);

}



/* =========================
   FIND UNIQUE USERS
========================= */

const users = [];

const seen = new Set();


for (
const post of posts
) {


if (!post.user_id) {
continue;
}


/* Don't show myself */

if (
post.user_id ===
currentUser.id
) {

continue;

}


/* Don't duplicate */

if (
seen.has(post.user_id)
) {

continue;

}


seen.add(
post.user_id
);


users.push({

id:
post.user_id,

username:
post.username ||
"BERAKAH User"

});

}



/* STOP LOADING */

loading.style.display =
"none";



/* =========================
   NO OTHER USERS
========================= */

if (!users.length) {

peopleBox.innerHTML = `

<div class="empty">

No other BERAKAH users found yet.

</div>

`;

return;

}



/* =========================
   DISPLAY USERS
========================= */

users.forEach(
function(user) {


const div =
document.createElement(
"div"
);


div.className =
"person";


const username =
user.username ||
"BERAKAH User";


const firstLetter =
username
.charAt(0)
.toUpperCase();


div.innerHTML = `

<div class="avatar">

${safe(firstLetter)}

</div>


<div class="person-info">

<div class="person-name">

${safe(username)}

</div>


<div class="person-status">

BERAKAH member

</div>

</div>


<button
class="profile-button"
onclick="viewProfile('${safe(user.id)}')"
>

View profile

</button>

`;


peopleBox.appendChild(
div
);

});


}
catch(error) {


loading.style.display =
"none";


message.textContent =
error.message;


console.error(
"PEOPLE ERROR:",
error
);

}

}



/* =========================
   VIEW PROFILE
========================= */

function viewProfile(userId) {

location.href =
"profile.html?id=" +
encodeURIComponent(userId);

}



/* =========================
   LOGOUT
========================= */

document
.getElementById(
"logoutButton"
)
.addEventListener(
"click",
function() {


localStorage.removeItem(
"berakah_access_token"
);


localStorage.removeItem(
"berakah_refresh_token"
);


localStorage.removeItem(
"berakah_user"
);


location.href =
"login.html";

});



/* =========================
   START
========================= */

loadPeople();

</script>


</body>

</html>
