<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BERAKAH - Social Feed</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-buttons button {
      border: 1px solid #d1d5db;
      background: white;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout {
      background: #111827 !important;
      color: white;
    }

    main {
      width: 100%;
      max-width: 650px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .composer,
    .post {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .composer h2 {
      margin-top: 0;
      font-size: 20px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      font-family: inherit;
    }

    .image-input {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
    }

    .post-button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .post-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .user {
      font-weight: bold;
      word-break: break-word;
    }

    .time {
      color: #6b7280;
      font-size: 12px;
      text-align: right;
    }

    .post-content {
      margin: 15px 0;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-image {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 8px;
    }

    .actions {
      display: flex;
      gap: 10px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }

    .actions button {
      border: none;
      background: #f3f4f6;
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .actions button:hover {
      background: #e5e7eb;
    }

    .delete {
      margin-left: auto;
      color: #b91c1c;
    }

    #message {
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }

    #loading {
      text-align: center;
      padding: 20px;
    }

    .empty {
      text-align: center;
      color: #6b7280;
    }

    @media (max-width: 600px) {

      header {
        padding: 12px;
      }

      .nav {
        align-items: flex-start;
      }

      .logo {
        font-size: 21px;
      }

      .nav-buttons button {
        padding: 7px 9px;
      }

      main {
        margin-top: 18px;
      }

      .composer,
      .post {
        padding: 15px;
      }

      .post-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .time {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      BERAKAH
    </div>

    <div class="nav-buttons">

      <button
        onclick="window.location.href='index.html'">
        Home
      </button>

      <button
        onclick="window.location.href='marketplace.html'">
        Market
      </button>

      <button
        class="logout"
        id="logoutButton">
        Logout
      </button>

    </div>

  </div>

</header>


<main>

  <!-- CREATE POST -->

  <div class="composer">

    <h2>Create a Post</h2>

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>

    <input
      id="imageUrl"
      class="image-input"
      type="url"
      placeholder="Optional image URL"
    >

    <button
      class="post-button"
      id="postButton">
      POST
    </button>

  </div>


  <!-- MESSAGE -->

  <div id="message"></div>


  <!-- LOADING -->

  <div id="loading">
    Loading posts...
  </div>


  <!-- FEED -->

  <div id="feed"></div>

</main>


<script>

/* =====================================================
   SUPABASE SETTINGS
   ===================================================== */

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   VARIABLES
   ===================================================== */

let accessToken =
  localStorage.getItem("berakah_access_token");

let currentUser = null;


/* =====================================================
   HTML SAFETY FUNCTION
   ===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================
   CHECK LOGIN
   ===================================================== */

if (!accessToken) {

  window.location.href = "login.html";

}


/* =====================================================
   GET CURRENT USER
   ===================================================== */

async function getCurrentUser() {

  try {

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/user",
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization":
            "Bearer " + accessToken
        }
      }
    );


    if (!response.ok) {

      throw new Error("Session expired");

    }


    currentUser =
      await response.json();


    return true;

  }

  catch (error) {

    localStorage.removeItem(
      "berakah_access_token"
    );

    localStorage.removeItem(
      "berakah_refresh_token"
    );

    localStorage.removeItem(
      "berakah_user"
    );

    window.location.href =
      "login.html";

    return false;

  }

}


/* =====================================================
   LOAD POSTS
   ===================================================== */

async function loadPosts() {

  const feed =
    document.getElementById("feed");

  const loading =
    document.getElementById("loading");

  const message =
    document.getElementById("message");


  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/posts?select=*&order=created_at.desc",
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_ANON_KEY,

          "Authorization":
            "Bearer " + accessToken
        }
      }
    );


    const responseText =
      await response.text();


    let data = [];


    if (responseText.trim()) {

      try {

        data =
          JSON.parse(responseText);

      }

      catch (error) {

        throw new Error(
          "Invalid response from Supabase."
        );

      }

    }


    if (!response.ok) {

      throw new Error(
        data?.message ||
        data?.error_description ||
        data?.msg ||
        `Could not load posts (${response.status})`
      );

    }


    loading.style.display =
      "none";


    feed.innerHTML = "";


    if (!Array.isArray(data) ||
        data.length === 0) {

      feed.innerHTML = `
        <div class="post empty">
          No posts yet. Be the first to post!
        </div>
      `;

      return;

    }


    data.forEach(function(post) {

      const article =
        document.createElement("div");

      article.className =
        "post";


      const date =
        post.created_at
          ? new Date(post.created_at)
          : new Date();


      const username =
        post.username ||
        "BERAKAH User";


      let imageHTML = "";


      if (post.image_url) {

        imageHTML = `
          <img
            class="post-image"
            src="${escapeHtml(post.image_url)}"
            alt="Post image"
            onerror="this.style.display='none';"
          >
        `;

      }


      let deleteHTML = "";


      if (
        currentUser &&
        post.user_id === currentUser.id
      ) {

        deleteHTML = `
          <button
            class="delete"
            onclick="deletePost('${escapeHtml(post.id)}')">
            Delete
          </button>
        `;

      }


      article.innerHTML = `

        <div class="post-header">

          <div class="user">
            ${escapeHtml(username)}
          </div>

          <div class="time">
            ${date.toLocaleString()}
          </div>

        </div>


        <div class="post-content">
          ${escapeHtml(post.content || "")}
        </div>


        ${imageHTML}


        <div class="actions">

          <button
            onclick="likePost('${escapeHtml(post.id)}')">
            ❤️ Like
          </button>

          ${deleteHTML}

        </div>

      `;


      feed.appendChild(article);

    });

  }


  catch (error) {

    loading.style.display =
      "none";

    message.textContent =
      error.message;

    console.error(
      "LOAD POSTS ERROR:",
      error
    );

  }

}


/* =====================================================
   CREATE POST
   ===================================================== */

document
  .getElementById("postButton")
  .addEventListener(
    "click",
    async function() {

      const button = this;


      const text =
        document
          .getElementById("postText")
          .value
          .trim();


      const imageUrl =
        document
          .getElementById("imageUrl")
          .value
          .trim();


      const message =
        document.getElementById("message");


      /* CHECK TEXT */

      if (!text) {

        message.textContent =
          "Please write something first.";

        return;

      }


      /* CHECK USER */

      if (!currentUser) {

        message.textContent =
          "You must be logged in.";

        return;

      }


      button.disabled =
        true;

      button.textContent =
        "POSTING...";

      message.textContent =
        "";


      try {

        const response =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/posts",
            {

              method: "POST",

              headers: {

                "apikey":
                  SUPABASE_ANON_KEY,

                "Authorization":
                  "Bearer " + accessToken,

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=minimal"

              },

              body: JSON.stringify({

                user_id:
                  currentUser.id,

                username:
                  currentUser.user_metadata?.username ||
                  currentUser.email?.split("@")[0] ||
                  "BERAKAH User",

                content:
                  text,

                image_url:
                  imageUrl || null

              })

            }
          );


        /*
          IMPORTANT:

          We DO NOT call response.json()
          here because "return=minimal"
          can give an empty response.
        */

        const responseText =
          await response.text();


        if (!response.ok) {

          let errorData = {};


          if (responseText.trim()) {

            try {

              errorData =
                JSON.parse(responseText);

            }

            catch (error) {

              errorData = {
                message:
                  responseText
              };

            }

          }


          throw new Error(
            errorData.message ||
            errorData.error_description ||
            errorData.hint ||
            errorData.msg ||
            `Could not create post (${response.status})`
          );

        }


        /* SUCCESS */

        document
          .getElementById("postText")
          .value = "";


        document
          .getElementById("imageUrl")
          .value = "";


        message.textContent =
          "Post published successfully!";


        await loadPosts();


        /*
          Remove success message
          after a few seconds.
        */

        setTimeout(function() {

          if (
            message.textContent ===
            "Post published successfully!"
          ) {

            message.textContent = "";

          }

        }, 3000);

      }


      catch (error) {

        message.textContent =
          error.message;

        console.error(
          "CREATE POST ERROR:",
          error
        );

      }


      finally {

        button.disabled =
          false;

        button.textContent =
          "POST";

      }

    }
  );


/* =====================================================
   DELETE POST
   ===================================================== */

async function deletePost(id) {

  if (!confirm("Delete this post?")) {

    return;

  }


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/posts?id=eq." +
        encodeURIComponent(id),
        {

          method: "DELETE",

          headers: {

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              "Bearer " + accessToken

          }

        }
      );


    const responseText =
      await response.text();


    if (!response.ok) {

      let data = {};


      if (responseText.trim()) {

        try {

          data =
            JSON.parse(responseText);

        }

        catch (error) {

          data = {
            message:
              responseText
          };

        }

      }


      throw new Error(
        data.message ||
        data.error_description ||
        data.hint ||
        "Could not delete post."
      );

    }


    await loadPosts();

  }


  catch (error) {

    alert(
      error.message
    );

  }

}


/* =====================================================
   LIKE
   ===================================================== */

async function likePost(id) {

  /*
    Likes will be connected to Supabase
    in the next step.
  */

  alert(
    "Like system will be connected next."
  );

}


/* =====================================================
   LOGOUT
   ===================================================== */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    function() {

      localStorage.removeItem(
        "berakah_access_token"
      );

      localStorage.removeItem(
        "berakah_refresh_token"
      );

      localStorage.removeItem(
        "berakah_user"
      );


      window.location.href =
        "login.html";

    }
  );


/* =====================================================
   START APPLICATION
   ===================================================== */

(async function() {

  const loggedIn =
    await getCurrentUser();


  if (loggedIn && currentUser) {

    await loadPosts();

  }

})();

</script>

</body>
</html>
