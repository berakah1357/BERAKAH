<script>

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const VIDEO_BUCKET = "videos";

const MAX_VIDEO_SIZE =
50 * 1024 * 1024;


let currentUser = null;

let selectedMediaMode = "image";


const statusBox =
document.getElementById("status");

const feed =
document.getElementById("feed");

const publishBtn =
document.getElementById("publishBtn");


function showStatus(message, type = "success") {

    statusBox.textContent = message;

    statusBox.className =
    "status " + type;

    setTimeout(() => {

        statusBox.className = "status";

    }, 5000);
}


async function getCurrentUser() {

    const token =
    localStorage.getItem(
        "berakah_access_token"
    );

    if (!token) {

        window.location.href =
        "login.html";

        return null;
    }

    try {

        const response =
        await fetch(
            `${SUPABASE_URL}/auth/v1/user`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                    `Bearer ${token}`
                }
            }
        );

        if (!response.ok) {

            localStorage.removeItem(
                "berakah_access_token"
            );

            window.location.href =
            "login.html";

            return null;
        }

        return await response.json();

    } catch (error) {

        console.error(error);

        showStatus(
            "Unable to verify login.",
            "error"
        );

        return null;
    }
}


function selectMediaMode(mode) {

    selectedMediaMode = mode;

    const imageBtn =
    document.getElementById(
        "imageModeBtn"
    );

    const videoBtn =
    document.getElementById(
        "videoModeBtn"
    );

    const reelBtn =
    document.getElementById(
        "reelModeBtn"
    );

    const imageArea =
    document.getElementById(
        "imageArea"
    );

    const videoArea =
    document.getElementById(
        "videoArea"
    );


    imageBtn.classList.remove("active");
    videoBtn.classList.remove("active");
    reelBtn.classList.remove("active");


    if (mode === "image") {

        imageBtn.classList.add("active");

        imageArea.style.display = "block";

        videoArea.style.display = "none";

    } else {

        imageArea.style.display = "none";

        videoArea.style.display = "block";


        if (mode === "video") {

            videoBtn.classList.add("active");

        }

        if (mode === "reel") {

            reelBtn.classList.add("active");

        }
    }
}


/*
==================================================
LOAD POSTS
==================================================
*/

async function loadFeed() {

    feed.innerHTML =
    `<div class="empty">Loading feed...</div>`;


    try {

        const token =
        localStorage.getItem(
            "berakah_access_token"
        );


        /*
        STEP 1:
        Load posts ONLY.

        We intentionally do NOT use:

        profiles(...)
        likes(...)

        in the same query.
        */

        const postsResponse =
        await fetch(
            `${SUPABASE_URL}/rest/v1/posts?select=*&order=created_at.desc`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                    `Bearer ${token}`
                }
            }
        );


        if (!postsResponse.ok) {

            const errorText =
            await postsResponse.text();

            console.error(
                "POSTS ERROR:",
                errorText
            );

            throw new Error(
                "Unable to load posts."
            );
        }


        const posts =
        await postsResponse.json();


        if (!Array.isArray(posts) ||
            posts.length === 0) {

            feed.innerHTML =
            `<div class="empty">
                No posts yet.
            </div>`;

            return;
        }


        /*
        STEP 2:
        Load profiles and likes separately.
        */

        const userIds =
        [
            ...new Set(
                posts
                .map(post => post.user_id)
                .filter(Boolean)
            )
        ];


        let profiles = [];

        if (userIds.length > 0) {

            const profileFilter =
            userIds
            .map(id =>
                `"${id}"`
            )
            .join(",");


            const profileResponse =
            await fetch(
                `${SUPABASE_URL}/rest/v1/profiles?select=user_id,username,avatar_url&user_id=in.(${profileFilter})`,
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                        `Bearer ${token}`
                    }
                }
            );


            if (profileResponse.ok) {

                profiles =
                await profileResponse.json();

            } else {

                console.warn(
                    "Profiles could not be loaded."
                );
            }
        }


        let likes = [];


        const likesResponse =
        await fetch(
            `${SUPABASE_URL}/rest/v1/likes?select=post_id,user_id`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                    `Bearer ${token}`
                }
            }
        );


        if (likesResponse.ok) {

            likes =
            await likesResponse.json();

        } else {

            console.warn(
                "Likes could not be loaded."
            );
        }


        /*
        STEP 3:
        Build lookup tables.
        */

        const profileMap = {};

        profiles.forEach(profile => {

            profileMap[
                profile.user_id
            ] = profile;

        });


        const likesMap = {};


        likes.forEach(like => {

            if (!likesMap[like.post_id]) {

                likesMap[like.post_id] = [];

            }

            likesMap[like.post_id].push(
                like
            );

        });


        feed.innerHTML = "";


        posts.forEach(post => {

            const profile =
            profileMap[post.user_id] || {};


            const postLikes =
            likesMap[post.id] || [];


            const fullPost = {

                ...post,

                profiles: profile,

                likes: postLikes

            };


            feed.appendChild(
                createPostCard(
                    fullPost
                )
            );

        });


    } catch (error) {

        console.error(
            "FEED LOAD ERROR:",
            error
        );


        feed.innerHTML =
        `<div class="empty">
            Unable to load feed.
            <br><br>
            Please refresh the page.
        </div>`;
    }
}


/*
==================================================
CREATE POST CARD
==================================================
*/

function createPostCard(post) {

    const article =
    document.createElement("article");

    article.className = "post";


    const profile =
    post.profiles || {};


    const username =
    profile.username ||
    "EPHPHAVORA User";


    const avatar =
    profile.avatar_url ||
    "https://via.placeholder.com/100";


    const createdDate =
    post.created_at
    ? new Date(
        post.created_at
      ).toLocaleString()
    : "";


    const likes =
    Array.isArray(post.likes)
    ? post.likes
    : [];


    const userLiked =
    currentUser &&
    likes.some(
        like =>
        like.user_id ===
        currentUser.id
    );


    let mediaHTML = "";


    if (
        post.image_url &&
        !post.video_url
    ) {

        mediaHTML = `

        <img
            class="post-image"
            src="${escapeHtml(
                post.image_url
            )}"
            alt="Post image"
        >

        `;

    }


    if (
        post.video_url &&
        !post.is_reel
    ) {

        mediaHTML = `

        <div class="video-wrapper">

            <video
                class="post-video"
                controls
                playsinline
                preload="metadata"
            >

                <source
                    src="${escapeHtml(
                        post.video_url
                    )}"
                >

                Your browser does not
                support video playback.

            </video>

        </div>

        `;

    }


    if (
        post.video_url &&
        post.is_reel
    ) {

        mediaHTML = `

        <div class="reel-wrapper">

            <div class="reel-label">
                🎬 REEL
            </div>

            <video
                class="reel-video"
                controls
                playsinline
                preload="metadata"
            >

                <source
                    src="${escapeHtml(
                        post.video_url
                    )}"
                >

                Your browser does not
                support video playback.

            </video>

        </div>

        `;

    }


    article.innerHTML = `

        <div class="post-header">

            <img
                class="avatar"
                src="${escapeHtml(avatar)}"
                alt="Profile"
                onerror="this.src='https://via.placeholder.com/100'"
            >

            <div>

                <div class="post-user">
                    ${escapeHtml(username)}
                </div>

                <div class="post-date">
                    ${escapeHtml(createdDate)}
                </div>

            </div>

        </div>


        ${
            post.content
            ? `
                <div class="post-content">
                    ${escapeHtml(
                        post.content
                    )}
                </div>
            `
            : ""
        }


        ${mediaHTML}


        <div class="post-actions">

            <button
                class="action-btn"
                onclick="toggleLike('${post.id}')"
            >

                ${userLiked ? "❤️" : "🤍"}

                ${likes.length}

            </button>


            ${
                currentUser &&
                post.user_id ===
                currentUser.id
                ? `
                    <button
                        class="action-btn delete-btn"
                        onclick="deletePost('${post.id}')"
                    >
                        🗑 Delete
                    </button>
                `
                : ""
            }

        </div>

    `;


    return article;
}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/*
==================================================
IMAGE
==================================================
*/

function imageToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
            new FileReader();


            reader.onload =
            () =>
            resolve(
                reader.result
            );


            reader.onerror =
            reject;


            reader.readAsDataURL(
                file
            );

        }
    );
}


/*
==================================================
VIDEO UPLOAD
==================================================
*/

async function uploadVideo(file) {

    if (!file) {

        throw new Error(
            "Please select a video."
        );
    }


    if (
        !file.type.startsWith(
            "video/"
        )
    ) {

        throw new Error(
            "Please select a valid video file."
        );
    }


    if (
        file.size >
        MAX_VIDEO_SIZE
    ) {

        throw new Error(
            "Video is too large. Maximum size is 50 MB."
        );
    }


    const token =
    localStorage.getItem(
        "berakah_access_token"
    );


    const extension =
    file.name.includes(".")
    ? file.name
        .split(".")
        .pop()
        .toLowerCase()
    : "mp4";


    const filePath =
    `${currentUser.id}/${Date.now()}-${Math.random()
        .toString(36)
        .substring(2)}.${extension}`;


    const uploadResponse =
    await fetch(
        `${SUPABASE_URL}/storage/v1/object/${VIDEO_BUCKET}/${filePath}`,
        {
            method: "POST",

            headers: {

                "apikey":
                SUPABASE_KEY,

                "Authorization":
                `Bearer ${token}`,

                "Content-Type":
                file.type ||
                "video/mp4"
            },

            body: file
        }
    );


    if (!uploadResponse.ok) {

        const errorText =
        await uploadResponse.text();

        console.error(
            "VIDEO UPLOAD ERROR:",
            errorText
        );

        throw new Error(
            "Video upload failed."
        );
    }


    return `${SUPABASE_URL}/storage/v1/object/public/${VIDEO_BUCKET}/${filePath}`;
}


/*
==================================================
CREATE POST
==================================================
*/

async function createPost() {

    if (!currentUser) {

        showStatus(
            "Please log in first.",
            "error"
        );

        return;
    }


    const content =
    document
    .getElementById(
        "postContent"
    )
    .value
    .trim();


    const imageInput =
    document.getElementById(
        "postImage"
    );


    const videoInput =
    document.getElementById(
        "postVideo"
    );


    const imageFile =
    imageInput.files[0];


    const videoFile =
    videoInput.files[0];


    const publishedMode =
    selectedMediaMode;


    if (
        publishedMode === "image" &&
        !content &&
        !imageFile
    ) {

        showStatus(
            "Write something or select an image.",
            "error"
        );

        return;
    }


    if (
        (
            publishedMode === "video" ||
            publishedMode === "reel"
        ) &&
        !videoFile
    ) {

        showStatus(
            publishedMode === "reel"
            ? "Please select a Reel video."
            : "Please select a video.",
            "error"
        );

        return;
    }


    publishBtn.disabled = true;

    publishBtn.textContent =
    "Publishing...";


    try {

        let imageUrl = null;

        let videoUrl = null;


        if (
            publishedMode === "image" &&
            imageFile
        ) {

            if (
                !imageFile.type.startsWith(
                    "image/"
                )
            ) {

                throw new Error(
                    "Please select a valid image."
                );
            }


            imageUrl =
            await imageToDataURL(
                imageFile
            );
        }


        if (
            publishedMode === "video" ||
            publishedMode === "reel"
        ) {

            videoUrl =
            await uploadVideo(
                videoFile
            );
        }


        let finalContent =
        content;


        /*
        IMPORTANT:
        posts.content is NOT NULL.
        */

        if (!finalContent) {

            if (
                publishedMode === "reel"
            ) {

                finalContent =
                "🎬 Reel";

            } else if (
                publishedMode === "video"
            ) {

                finalContent =
                "🎥 Video";

            } else {

                finalContent =
                "📷 Image";
            }
        }


        const postData = {

            user_id:
            currentUser.id,

            content:
            finalContent,

            image_url:
            imageUrl,

            video_url:
            videoUrl,

            is_reel:
            publishedMode === "reel"
        };


        const token =
        localStorage.getItem(
            "berakah_access_token"
        );


        const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/posts`,
            {
                method: "POST",

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    `Bearer ${token}`,

                    "Content-Type":
                    "application/json",

                    "Prefer":
                    "return=minimal"
                },

                body:
                JSON.stringify(
                    postData
                )
            }
        );


        if (!response.ok) {

            const errorText =
            await response.text();

            console.error(
                "CREATE POST ERROR:",
                errorText
            );

            throw new Error(
                errorText ||
                "Failed to create post."
            );
        }


        document
        .getElementById(
            "postContent"
        )
        .value = "";


        imageInput.value = "";

        videoInput.value = "";


        selectMediaMode("image");


        if (
            publishedMode === "reel"
        ) {

            showStatus(
                "🎬 Reel published successfully!"
            );

        } else if (
            publishedMode === "video"
        ) {

            showStatus(
                "🎥 Video published successfully!"
            );

        } else {

            showStatus(
                "📷 Post published successfully!"
            );
        }


        await loadFeed();


    } catch (error) {

        console.error(
            error
        );

        showStatus(
            error.message ||
            "Something went wrong.",
            "error"
        );

    } finally {

        publishBtn.disabled = false;

        publishBtn.textContent =
        "Publish";
    }
}

LIKE

async function toggleLike(postId) {

    if (!currentUser) {

        return;
    }


    const token =
    localStorage.getItem(
        "berakah_access_token"
    );


    try {

        const checkResponse =
        await fetch(
            `${SUPABASE_URL}/rest/v1/likes?select=*&post_id=eq.${encodeURIComponent(postId)}&user_id=eq.${encodeURIComponent(currentUser.id)}`,
            {
                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    `Bearer ${token}`
                }
            }
        );


        if (!checkResponse.ok) {

            throw new Error(
                "Unable to check like."
            );
        }


        const existingLikes =
        await checkResponse.json();


        if (
            existingLikes.length > 0
        ) {

            const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/likes?post_id=eq.${encodeURIComponent(postId)}&user_id=eq.${encodeURIComponent(currentUser.id)}`,
                {
                    method: "DELETE",

                    headers: {

                        "apikey":
                        SUPABASE_KEY,

                        "Authorization":
                        `Bearer ${token}`
                    }
                }
            );


            if (!response.ok) {

                throw new Error(
                    "Unable to remove like."
                );
            }

        } else {

            const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/likes`,
                {
                    method: "POST",

                    headers: {

                        "apikey":
                        SUPABASE_KEY,

                        "Authorization":
                        `Bearer ${token}`,

                        "Content-Type":
                        "application/json",

                        "Prefer":
                        "return=minimal"
                    },

                    body:
                    JSON.stringify({

                        post_id:
                        postId,

                        user_id:
                        currentUser.id

                    })
                }
            );


            if (!response.ok) {

                throw new Error(
                    "Unable to like post."
                );
            }
        }


        await loadFeed();


    } catch (error) {

        console.error(
            "LIKE ERROR:",
            error
        );

        showStatus(
            "Unable to update like.",
            "error"
        );
    }
}


/*
==================================================
DELETE
==================================================
*/

async function deletePost(postId) {

    if (!currentUser) {

        return;
    }


    const confirmed =
    confirm(
        "Are you sure you want to delete this post?"
    );


    if (!confirmed) {

        return;
    }


    const token =
    localStorage.getItem(
        "berakah_access_token"
    );


    try {

        const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/posts?id=eq.${encodeURIComponent(postId)}&user_id=eq.${encodeURIComponent(currentUser.id)}`,
            {
                method: "DELETE",

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    `Bearer ${token}`
                }
            }
        );


        if (!response.ok) {

            const errorText =
            await response.text();

            console.error(
                "DELETE ERROR:",
                errorText
            );

            throw new Error(
                "Failed to delete post."
            );
        }


        showStatus(
            "Post deleted successfully."
        );


        await loadFeed();


    } catch (error) {

        console.error(
            error
        );

        showStatus(
            error.message ||
            "Unable to delete post.",
            "error"
        );
    }
}


/*
==================================================
LOGOUT
==================================================
*/

function logout() {

    localStorage.removeItem(
        "berakah_access_token"
    );

    localStorage.removeItem(
        "berakah_refresh_token"
    );

    localStorage.removeItem(
        "berakah_user"
    );

    localStorage.removeItem(
        "berakah_username"
    );

    localStorage.removeItem(
        "berakah_auth_user_id"
    );


    window.location.href =
    "login.html";
}

START

*/

(async function init() {

    currentUser =
    await getCurrentUser();


    if (!currentUser) {

        return;
    }


    await loadFeed();

})();
