<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Order Messages</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #2563eb;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

nav a {
  text-decoration: none;
  color: #374151;
  padding: 8px 10px;
  border-radius: 7px;
  font-size: 14px;
}

nav a:hover {
  background: #eff6ff;
  color: #2563eb;
}

.container {
  max-width: 850px;
  margin: 30px auto;
  padding: 0 15px;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #6b7280;
  margin-top: 0;
}

.order-selector {
  background: white;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  margin-bottom: 15px;
}

select {
  width: 100%;
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
}

.chat-box {
  background: white;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  overflow: hidden;
}

.chat-header {
  padding: 16px 18px;
  border-bottom: 1px solid #e5e7eb;
  font-weight: bold;
}

.messages {
  height: 430px;
  overflow-y: auto;
  padding: 20px;
  background: #f9fafb;
}

.message {
  display: flex;
  margin-bottom: 14px;
}

.message.mine {
  justify-content: flex-end;
}

.bubble {
  max-width: 75%;
  padding: 11px 14px;
  border-radius: 14px;
  background: #e5e7eb;
}

.mine .bubble {
  background: #2563eb;
  color: white;
}

.message-text {
  line-height: 1.45;
  white-space: pre-wrap;
}

.message-time {
  margin-top: 5px;
  font-size: 10px;
  opacity: .65;
}

.empty-chat {
  text-align: center;
  color: #9ca3af;
  padding-top: 150px;
}

.composer {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid #e5e7eb;
}

textarea {
  flex: 1;
  resize: none;
  height: 55px;
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-family: Arial, sans-serif;
}

.send-btn {
  background: #2563eb;
  color: white;
  border: none;
  padding: 0 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.send-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.notice {
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  background: #eff6ff;
  color: #1e40af;
  font-size: 13px;
}

.error {
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  background: #fee2e2;
  color: #991b1b;
  font-size: 13px;
}

@media (max-width: 650px) {

  .header-inner {
    flex-direction: column;
    align-items: flex-start;
  }

  .messages {
    height: 380px;
  }

  .composer {
    flex-direction: column;
  }

  .send-btn {
    height: 45px;
  }

}

</style>

</head>


<body>


<header>

  <div class="header-inner">

    <div class="logo">
      BERAKAH
    </div>

    <nav>

      <a href="index.html">Home</a>

      <a href="feed.html">Feed</a>

      <a href="people.html">👥 People</a>

      <a href="marketplace.html">Market</a>

      <a href="notifications.html">
        🔔 Notifications
      </a>

      <a href="messages.html">
        💬 Messages
      </a>

      <a href="orders.html">
        My Orders
      </a>

      <a href="order-tracking.html">
        🚚 Tracking
      </a>

      <a href="profile.html">
        Profile
      </a>

    </nav>

  </div>

</header>


<div class="container">

  <h1>💬 Order Messages</h1>

  <p class="subtitle">
    Communicate with the seller about your order.
  </p>


  <div class="order-selector">

    <label>
      <strong>Select Order</strong>
    </label>

    <br><br>

    <select
      id="orderSelect"
      onchange="loadConversation()"
    >

      <option value="">
        Loading orders...
      </option>

    </select>

  </div>


  <div class="chat-box">

    <div
      class="chat-header"
      id="chatHeader"
    >
      Select an order
    </div>


    <div
      class="messages"
      id="messages"
    >

      <div class="empty-chat">
        Select an order to start messaging.
      </div>

    </div>


    <div class="composer">

      <textarea
        id="messageInput"
        placeholder="Write a message..."
      ></textarea>

      <button
        class="send-btn"
        id="sendButton"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </div>


  <div
    id="notice"
    class="notice"
    style="display:none"
  ></div>


  <div
    id="error"
    class="error"
    style="display:none"
  ></div>

</div>


<script>

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const ACCESS_TOKEN =
  localStorage.getItem(
    "berakah_access_token"
  );


let currentUser = null;
let orders = [];
let selectedOrder = null;


// =====================================
// HEADERS
// =====================================

function headers() {

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + ACCESS_TOKEN,

    "Content-Type":
      "application/json"

  };

}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// =====================================
// CURRENT USER
// =====================================

async function getCurrentUser() {

  if (!ACCESS_TOKEN) {

    window.location.href =
      "login.html";

    return null;

  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/user",
      {
        headers: headers()
      }
    );


  if (!response.ok) {

    localStorage.removeItem(
      "berakah_access_token"
    );

    window.location.href =
      "login.html";

    return null;

  }


  return await response.json();

}


// =====================================
// LOAD ORDERS
// =====================================

async function loadOrders() {

  const url =
    SUPABASE_URL +
    "/rest/v1/orders" +
    "?select=*" +
    "&buyer_id=eq." +
    encodeURIComponent(
      currentUser.id
    ) +
    "&order=created_at.desc";


  const response =
    await fetch(
      url,
      {
        headers: headers()
      }
    );


  if (!response.ok) {

    throw new Error(
      await response.text()
    );

  }


  orders =
    await response.json();


  const select =
    document.getElementById(
      "orderSelect"
    );


  if (!orders.length) {

    select.innerHTML = `

      <option value="">
        No orders available
      </option>

    `;

    return;

  }


  select.innerHTML =
    orders.map(order => {

      const number =
        order.order_number ||
        "BRK-" + order.id;

      const product =
        order.product_name ||
        "Product";


      return `

        <option
          value="${escapeHTML(order.id)}"
        >
          #${escapeHTML(number)}
          — ${escapeHTML(product)}
        </option>

      `;

    }).join("");


  selectedOrder =
    orders[0];


  await loadConversation();

}


// =====================================
// LOAD CONVERSATION
// =====================================

async function loadConversation() {

  const select =
    document.getElementById(
      "orderSelect"
    );


  const id =
    select.value;


  if (!id) {

    selectedOrder = null;

    document.getElementById(
      "chatHeader"
    ).textContent =
      "Select an order";

    document.getElementById(
      "messages"
    ).innerHTML = `

      <div class="empty-chat">
        Select an order to start messaging.
      </div>

    `;

    return;

  }


  selectedOrder =
    orders.find(
      order =>
        String(order.id) ===
        String(id)
    );


  if (!selectedOrder) {
    return;
  }


  const number =
    selectedOrder.order_number ||
    "BRK-" + selectedOrder.id;


  const product =
    selectedOrder.product_name ||
    "Product";


  document.getElementById(
    "chatHeader"
  ).textContent =
    `Order #${number} — ${product}`;


  /*
    IMPORTANT:

    We do not assume a messages
    database table exists yet.

    For now this page prepares
    the complete buyer messaging
    interface.

    The actual Supabase messages
    table will be created in the
    next database step.
  */


  document.getElementById(
    "messages"
  ).innerHTML = `

    <div class="empty-chat">

      💬 No messages yet.

      <br><br>

      Send a message to contact
      the seller about this order.

    </div>

  `;

}


// =====================================
// SEND MESSAGE
// =====================================

async function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const button =
    document.getElementById(
      "sendButton"
    );


  const text =
    input.value.trim();


  if (!text) {

    showError(
      "Please write a message first."
    );

    return;

  }


  if (!selectedOrder) {

    showError(
      "Please select an order first."
    );

    return;

  }


  /*
    Messaging table is intentionally
    not assumed yet.

    We will connect this button
    after the Supabase table is
    created and secured.
  */


  showNotice(
    "Your message system is ready. The Supabase messaging table is the next database step."
  );

}


// =====================================
// NOTICE
// =====================================

function showNotice(message) {

  const element =
    document.getElementById(
      "notice"
    );

  element.textContent =
    message;

  element.style.display =
    "block";


  document.getElementById(
    "error"
  ).style.display =
    "none";

}


// =====================================
// ERROR
// =====================================

function showError(message) {

  const element =
    document.getElementById(
      "error"
    );

  element.textContent =
    message;

  element.style.display =
    "block";


  document.getElementById(
    "notice"
  ).style.display =
    "none";

}


// =====================================
// START
// =====================================

async function start() {

  try {

    currentUser =
      await getCurrentUser();


    if (!currentUser) {
      return;
    }


    await loadOrders();

  } catch (error) {

    console.error(error);

    showError(
      "Unable to load your orders."
    );

  }

}


start();

</script>


</body>
</html>
