</style></head><body><header><div class="header-inner"><div class="logo">
BERAKAH
</div><nav><a href="index.html">Home</a>

<a href="marketplace.html">Market</a>

<a href="orders.html">My Orders</a>

<a href="profile.html">Profile</a>

</nav></div></header><main class="container"><div class="checkout-card"><h1>🛒 Checkout</h1><div id="status"
     class="status">
</div><h2>🛍️ Order Summary</h2><div id="orderSummary"></div><div class="total"><span>TOTAL</span>

<span id="total">$0.00</span>

</div></div><div class="checkout-card"><h2>👤 Customer Information</h2><div class="form-group"><label for="customerName">
Full Name
</label><input
id="customerName"
type="text"
placeholder="Your full name"
autocomplete="name">

</div><div class="form-group"><label for="customerEmail">
Email
</label><input
id="customerEmail"
type="email"
placeholder="Your email"
autocomplete="email">

</div><div class="form-group"><label for="customerPhone">
Phone
</label><input
id="customerPhone"
type="tel"
placeholder="Your phone number"
autocomplete="tel">

</div><div class="form-group"><label for="customerAddress">
Shipping Address
</label><input
id="customerAddress"
type="text"
placeholder="Your shipping address"
autocomplete="street-address">

</div><button
id="placeOrderButton"
class="place-order"
onclick="placeOrder()">

🛒 PLACE ORDER

</button></div></main><script>


/* =====================================================
   BERAKAH SUPABASE
===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
===================================================== */

const accessToken =
localStorage.getItem(
    "berakah_access_token"
);


let currentUser = null;


/* =====================================================
   CART
===================================================== */

let cart = [];

try{

    cart =
        JSON.parse(
            localStorage.getItem(
                "berakahCart"
            ) || "[]"
        );

}catch(error){

    console.error(
        "CART ERROR:",
        error
    );

    cart = [];

}


/* =====================================================
   ELEMENTS
===================================================== */

const statusBox =
document.getElementById(
    "status"
);

const summaryBox =
document.getElementById(
    "orderSummary"
);

const totalBox =
document.getElementById(
    "total"
);

const placeOrderButton =
document.getElementById(
    "placeOrderButton"
);


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(
    message,
    type
){

    statusBox.textContent =
        message;

    statusBox.className =
        "status " + type;

}


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
    endpoint,
    options={}
){

    const response =
        await fetch(
            SUPABASE_URL + endpoint,
            {

                ...options,

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})

                }

            }
        );


    const text =
        await response.text();


    let data = null;


    try{

        data =
            text
            ? JSON.parse(text)
            : null;

    }catch(error){

        data = text;

    }


    if(!response.ok){

        console.error(
            "SUPABASE ERROR:",
            data
        );


        throw new Error(

            data?.message ||

            data?.msg ||

            data?.hint ||

            data?.details ||

            "Supabase request failed."

        );

    }


    return data;

}


/* =====================================================
   LOAD CURRENT USER
===================================================== */

async function loadCurrentUser(){

    if(!accessToken){

        window.location.href =
            "login.html";

        return false;

    }


    try{

        currentUser =
            await supabaseRequest(
                "/auth/v1/user"
            );


        return true;

    }catch(error){

        console.error(
            "USER ERROR:",
            error
        );


        localStorage.removeItem(
            "berakah_access_token"
        );

        localStorage.removeItem(
            "berakah_refresh_token"
        );


        window.location.href =
            "login.html";


        return false;

    }

}


/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart(){

    if(!cart.length){

        summaryBox.innerHTML = `

            <div class="empty">

                <h3>
                    Your cart is empty.
                </h3>

                <a href="marketplace.html">
                    Continue Shopping
                </a>

            </div>

        `;


        totalBox.textContent =
            "$0.00";


        placeOrderButton.disabled =
            true;


        return;

    }


    let total = 0;


    summaryBox.innerHTML =
        cart.map(
            function(item){

                const quantity =
                    Number(
                        item.quantity || 1
                    );


                const price =
                    Number(
                        item.price || 0
                    );


                const itemTotal =
                    price * quantity;


                total +=
                    itemTotal;


                return `

                    <div class="product-row">

                        <div>

                            <div class="product-name">

                                ${escapeHTML(
                                    item.name ||
                                    "Product"
                                )}

                            </div>


                            <div class="product-meta">

                                Quantity:
                                ${quantity}

                            </div>

                        </div>


                        <div class="product-price">

                            $${itemTotal.toFixed(2)}

                        </div>

                    </div>

                `;

            }
        ).join("");


    totalBox.textContent =
        "$" + total.toFixed(2);

}


/* =====================================================
   GET PRODUCT FROM SUPABASE
===================================================== */

async function getProduct(
    productId
){

    const endpoint =
        "/rest/v1/products" +
        "?select=*" +
        "&id=eq." +
        encodeURIComponent(productId) +
        "&limit=1";


    const products =
        await supabaseRequest(
            endpoint
        );


    if(
        !products ||
        !products.length
    ){

        throw new Error(

            "Product " +
            productId +
            " could not be found."

        );

    }


    return products[0];

}


/* =====================================================
   GENERATE UNIQUE ORDER NUMBER
===================================================== */

function generateOrderNumber(){

    const timestamp =
        Date.now()
        .toString()
        .slice(-8);


    const random =
        Math.floor(
            1000 +
            Math.random() *
            9000
        );


    return "BRK-" +
           timestamp +
           random;

}


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder(){

    if(!currentUser){

        showStatus(
            "Please log in first.",
            "error"
        );

        return;

    }


    if(!cart.length){

        showStatus(
            "Your cart is empty.",
            "error"
        );

        return;

    }


    const customerName =
        document.getElementById(
            "customerName"
        ).value.trim();


    const customerEmail =
        document.getElementById(
            "customerEmail"
        ).value.trim();


    const customerPhone =
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const customerAddress =
        document.getElementById(
            "customerAddress"
        ).value.trim();


    if(
        !customerName ||
        !customerEmail ||
        !customerPhone ||
        !customerAddress
    ){

        showStatus(

            "Please complete your name, email, phone, and shipping address.",

            "error"

        );

        return;

    }


    placeOrderButton.disabled =
        true;


    placeOrderButton.textContent =
        "PLACING ORDER...";


    showStatus(
        "Saving your order...",
        "success"
    );


    try{


        /* =================================================
           PROCESS EACH CART ITEM
           
           IMPORTANT:
           A UNIQUE ORDER NUMBER IS GENERATED
           FOR EVERY ORDER ROW.
        ================================================= */

        for(
            const cartItem of cart
        ){

            const product =
                await getProduct(
                    cartItem.id
                );


            const quantity =
                Number(
                    cartItem.quantity || 1
                );


            const price =
                Number(
                    product.price || 0
                );


            const itemTotal =
                price * quantity;


            /* =================================================
               SELLER
            ================================================= */

            const sellerId =
                product.seller_id ||
                null;


            /* =================================================
               UNIQUE ORDER NUMBER
            ================================================= */

            const orderNumber =
                generateOrderNumber();


            /* =================================================
               PRODUCT SNAPSHOT
            ================================================= */

            const productSnapshot = {

                id:
                    product.id,

                name:
                    product.name,

                price:
                    price,

                quantity:
                    quantity,

                image_url:
                    product.image_url,

                seller_id:
                    sellerId,

                seller_name:
                    product.seller_name,

                category:
                    product.category

            };


            /* =================================================
               ORDER DATA
            ================================================= */

            const order = {

                buyer_id:
                    currentUser.id,

                seller_id:
                    sellerId,

                product_id:
                    product.id,

                product_name:
                    product.name,

                quantity:
                    quantity,

                price:
                    price,

                total:
                    itemTotal,

                status:
                    "pending",

                shipping_name:
                    customerName,

                shipping_email:
                    customerEmail,

                shipping_phone:
                    customerPhone,

                shipping_address:
                    customerAddress,

                customer_id:
                    currentUser.id,

                order_number:
                    orderNumber,

                customer_name:
                    customerName,

                customer_email:
                    customerEmail,

                customer_phone:
                    customerPhone,

                customer_address:
                    customerAddress,

                products:
                    productSnapshot

            };


            console.log(
                "ORDER BEING SENT:",
                order
            );


            /* =================================================
               INSERT ORDER
            ================================================= */

            await supabaseRequest(

                "/rest/v1/orders",

                {

                    method:
                        "POST",

                    headers:{

                        "Prefer":
                            "return=representation"

                    },

                    body:
                        JSON.stringify(
                            order
                        )

                }

            );

        }


        /* =================================================
           SUCCESS
        ================================================= */

        localStorage.removeItem(
            "berakahCart"
        );


        showStatus(

            "Order placed successfully! Redirecting...",

            "success"

        );


        setTimeout(

            function(){

                window.location.href =
                    "orders.html";

            },

            800

        );


    }catch(error){

        console.error(
            "CHECKOUT ERROR:",
            error
        );


        showStatus(

            "Could not save the order to Supabase.\n\n" +
            error.message,

            "error"

        );


        placeOrderButton.disabled =
            false;


        placeOrderButton.textContent =
            "🛒 PLACE ORDER";

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   START CHECKOUT
===================================================== */

async function startCheckout(){

    displayCart();


    const loggedIn =
        await loadCurrentUser();


    if(!loggedIn){

        return;

    }


    /* =================================================
       PREFILL EMAIL
    ================================================= */

    const emailInput =
        document.getElementById(
            "customerEmail"
        );


    if(
        currentUser.email &&
        !emailInput.value
    ){

        emailInput.value =
            currentUser.email;

    }


    /* =================================================
       PREFILL NAME
    ================================================= */

    const metadata =
        currentUser.user_metadata ||
        {};


    const name =
        metadata.full_name ||
        metadata.name ||
        metadata.username ||
        "";


    const nameInput =
        document.getElementById(
            "customerName"
        );


    if(
        name &&
        !nameInput.value
    ){

        nameInput.value =
            name;

    }

}


/* =====================================================
   START
===================================================== */

startCheckout();

</script></body></html>
