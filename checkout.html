<!DOCTYPE html>
<html>

<head>

<title>BERAKAH Checkout</title>

<style>

body{
  font-family:Arial;
  background:#f5f5f5;
  padding:30px;
}

.checkout{
  background:white;
  max-width:500px;
  margin:auto;
  padding:25px;
  border-radius:12px;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0 15px;
  box-sizing:border-box;
}

.total{
  font-size:26px;
  font-weight:bold;
  margin:20px 0;
}

button{
  width:100%;
  padding:14px;
  background:#111827;
  color:white;
  border:none;
  cursor:pointer;
  font-size:16px;
}

</style>

</head>

<body>

<div class="checkout">

<h1>🛒 BERAKAH CHECKOUT</h1>

<h2>Customer Information</h2>

<label>Full Name</label>
<input id="customerName" type="text" placeholder="Your name">

<label>Email</label>
<input id="customerEmail" type="email" placeholder="Your email">

<label>Address</label>
<input id="customerAddress" type="text" placeholder="Your address">

<div id="total" class="total"></div>

<button onclick="placeOrder()">PLACE ORDER</button>

</div>


<script>

let cart = JSON.parse(
  localStorage.getItem("berakahCart") || "[]"
);

let total = 0;

cart.forEach(function(product){

  total += Number(product.price) || 0;

});

document.getElementById("total").innerHTML =
  "TOTAL: $" + total;


function placeOrder(){

  let name =
    document.getElementById("customerName").value.trim();

  let email =
    document.getElementById("customerEmail").value.trim();

  let address =
    document.getElementById("customerAddress").value.trim();


  if(!name || !email || !address){

    alert("PLEASE COMPLETE ALL INFORMATION");

    return;

  }


  if(cart.length === 0){

    alert("YOUR CART IS EMPTY");

    return;

  }


  let order = {

    id: Date.now(),

    customerName: name,

    customerEmail: email,

    customerAddress: address,

    products: cart,

    total: total,

    status: "NEW"

  };


  let orders = JSON.parse(
    localStorage.getItem("berakahOrders") || "[]"
  );


  orders.push(order);


  localStorage.setItem(
    "berakahOrders",
    JSON.stringify(orders)
  );


  // CLEAR CART AFTER ORDER

  localStorage.removeItem("berakahCart");


  alert("ORDER SAVED! 🚀");


  // GO BACK TO MARKETPLACE

  window.location.href =
    "marketplace.html";

}


</script>

</body>

</html>
