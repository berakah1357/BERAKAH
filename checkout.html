<!DOCTYPE html>
<html>

<head>

<title>BERAKAH Checkout</title>

<style>

body{

}

}

button{
  width:100%;
  padding:14px;
  background:#111827;
  color:white;
  border:none;
  cursor:pointer;
  font-size:16px;
}

</style>

</head>

<body>

<div class="checkout">

<label>Full Name</label>

<label>Email</label>
<input id="customerEmail" type="email" placeholder="Your email">

<label>Address</label>
<input id="customerAddress" type="text" placeholder="Your address">

<div id="total" class="total"></div>

<button onclick="placeOrder()">
PLACE ORDER
</button>

</div>

</body>

</html>
