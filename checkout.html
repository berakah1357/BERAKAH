<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Checkout</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#111827;
}

header{
    background:white;
    border-bottom:1px solid #e5e7eb;
    padding:15px 20px;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:1px;
}

nav{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

nav a{
    color:#374151;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px 20px 60px;
}

.checkout-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:25px;
    margin-bottom:20px;
}

h1{
    margin-top:0;
}

h2{
    margin-top:0;
}

.product-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:15px 0;
    border-bottom:1px solid #e5e7eb;
}

.product-name{
    font-weight:bold;
}

.product-meta{
    color:#6b7280;
    font-size:14px;
    margin-top:5px;
}

.product-price{
    font-weight:bold;
    white-space:nowrap;
}

.total{
    display:flex;
    justify-content:space-between;
    font-size:24px;
    font-weight:bold;
    padding-top:20px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#2563eb;
}

.place-order{
    width:100%;
    padding:15px;
    border:0;
    border-radius:9px;
    background:#111827;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.place-order:hover{
    opacity:.92;
}

.place-order:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.status{
    display:none;
    padding:14px;
    border-radius:9px;
    margin-bottom:20px;
    line-height:1.5;
    white-space:pre-line;
}

.status.error{
    display:block;
    background:#fef2f2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.status.success{
    display:block;
    background:#f0fdf4;
    color:#166534;
    border:1px solid #bbf7d0;
}

.empty{
    text-align:center;
    padding:40px;
}

.payment-note{
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    background:#eff6ff;
    color:#1e40af;
    font-size:14px;
    line-height:1.5;
}

@media(max-width:600px){

    .header-inner{
        flex-direction:column;
        gap:12px;
    }

    nav{
        justify-content:center;
    }

    .product-row{
        align-items:flex-start;
    }

    .total{
        font-size:20px;
    }

}

</style>

</head>

<body>

<header>

<div class="header-inner">

<div class="logo">
BERAKAH
</div>

<nav>

<a href="index.html">Home</a>

<a href="marketplace.html">Market</a>

<a href="orders.html">My Orders</a>

<a href="profile.html">Profile</a>

</nav>

</div>

</header>


<main class="container">


<div class="checkout-card">

<h1>🛒 Checkout</h1>

<div id="status" class="status"></div>

<h2>🛍️ Order Summary</h2>

<div id="orderSummary"></div>

<div class="total">

<span>TOTAL</span>

<span id="total">$0.00</span>

</div>

</div>


<div class="checkout-card">

<h2>👤 Customer Information</h2>


<div class="form-group">

<label for="customerName">
Full Name
</label>

<input
id="customerName"
type="text"
placeholder="Your full name"
autocomplete="name">

</div>


<div class="form-group">

<label for="customerEmail">
Email
</label>

<input
id="customerEmail"
type="email"
placeholder="Your email"
autocomplete="email">

</div>


<div class="form-group">

<label for="customerPhone">
Phone
</label>

<input
id="customerPhone"
type="tel"
placeholder="Your phone number"
autocomplete="tel">

</div>


<div class="form-group">

<label for="customerAddress">
Shipping Address
</label>

<input
id="customerAddress"
type="text"
placeholder="Your shipping address"
autocomplete="street-address">

</div>


<div class="payment-note">

💳 You will be securely redirected to Stripe Test Checkout to complete the payment.

</div>


<br>


<button
id="placeOrderButton"
class="place-order"
onclick="placeOrder()">

💳 CONTINUE TO STRIPE

</button>

</div>

</main>


<script>

/* =====================================================
   BERAKAH SUPABASE
===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
===================================================== */

const accessToken =
localStorage.getItem(
    "berakah_access_token"
);

let currentUser = null;


/* =====================================================
   CART
===================================================== */

let cart = [];

try{

    cart =
        JSON.parse(
            localStorage.getItem(
                "berakahCart"
            ) || "[]"
        );

}catch(error){

    console.error(
        "CART ERROR:",
        error
    );

    cart = [];

}


/* =====================================================
   ELEMENTS
===================================================== */

const statusBox =
document.getElementById(
    "status"
);

const summaryBox =
document.getElementById(
    "orderSummary"
);

const totalBox =
document.getElementById(
    "total"
);

const placeOrderButton =
document.getElementById(
    "placeOrderButton"
);


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type
){

    statusBox.textContent =
        message;

    statusBox.className =
        "status " + type;

}


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
    endpoint,
    options={}
){

    if(!accessToken){

        throw new Error(
            "You are not logged in."
        );

    }


    const response =
        await fetch(
            SUPABASE_URL + endpoint,
            {

                ...options,

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})

                }

            }
        );


    const text =
        await response.text();


    let data = null;


    try{

        data =
            text
            ? JSON.parse(text)
            : null;

    }catch(error){

        data = text;

    }


    if(!response.ok){

        console.error(
            "SUPABASE ERROR:",
            data
        );


        throw new Error(

            data?.message ||

            data?.msg ||

            data?.hint ||

            data?.details ||

            "Supabase request failed."

        );

    }


    return data;

}


/* =====================================================
   LOAD CURRENT USER
===================================================== */

async function loadCurrentUser(){

    if(!accessToken){

        window.location.href =
            "login.html";

        return false;

    }


    try{

        currentUser =
            await supabaseRequest(
                "/auth/v1/user"
            );


        return true;

    }catch(error){

        console.error(
            "USER ERROR:",
            error
        );


        localStorage.removeItem(
            "berakah_access_token"
        );

        localStorage.removeItem(
            "berakah_refresh_token"
        );

        localStorage.removeItem(
            "berakah_user"
        );

        localStorage.removeItem(
            "berakah_username"
        );

        localStorage.removeItem(
            "berakah_auth_user_id"
        );


        window.location.href =
            "login.html";


        return false;

    }

}


/* =====================================================
   GET PRODUCT
===================================================== */

async function getProduct(
    productId
){

    const endpoint =
        "/rest/v1/products" +
        "?select=*" +
        "&id=eq." +
        encodeURIComponent(productId) +
        "&limit=1";


    const products =
        await supabaseRequest(
            endpoint
        );


    if(
        !products ||
        !products.length
    ){

        throw new Error(
            "Product could not be found."
        );

    }


    return products[0];

}


/* =====================================================
   DISPLAY CART
===================================================== */

async function displayCart(){

    if(!cart.length){

        summaryBox.innerHTML = `

            <div class="empty">

                <h3>
                    Your cart is empty.
                </h3>

                <a href="marketplace.html">
                    Continue Shopping
                </a>

            </div>

        `;


        totalBox.textContent =
            "$0.00";


        placeOrderButton.disabled =
            true;


        return;

    }


    let total = 0;

    let html = "";


    for(
        const item of cart
    ){

        const quantity =
            Number(
                item.quantity || 1
            );


        const price =
            Number(
                item.price || 0
            );


        const itemTotal =
            price * quantity;


        total +=
            itemTotal;


        html += `

            <div class="product-row">

                <div>

                    <div class="product-name">

                        ${escapeHTML(
                            item.name ||
                            "Product"
                        )}

                    </div>

                    <div class="product-meta">

                        Quantity:
                        ${quantity}

                    </div>

                </div>

                <div class="product-price">

                    $${itemTotal.toFixed(2)}

                </div>

            </div>

        `;

    }


    summaryBox.innerHTML =
        html;


    totalBox.textContent =
        "$" +
        total.toFixed(2);

}


/* =====================================================
   START STRIPE CHECKOUT
===================================================== */

async function createStripeCheckout(){

    if(!currentUser){

        throw new Error(
            "Please log in first."
        );

    }


    if(!cart.length){

        throw new Error(
            "Your cart is empty."
        );

    }


    /*
       For the first Stripe test we use
       ONE product at a time.

       This matches the stripe-checkout
       Edge Function we deployed.
    */

    if(cart.length > 1){

        throw new Error(
            "For the first Stripe test, please checkout one product at a time."
        );

    }


    const cartItem =
        cart[0];


    const quantity =
        Number(
            cartItem.quantity || 1
        );


    if(
        !Number.isInteger(quantity) ||
        quantity < 1
    ){

        throw new Error(
            "Invalid product quantity."
        );

    }


    const customerName =
        document.getElementById(
            "customerName"
        ).value.trim();


    const customerEmail =
        document.getElementById(
            "customerEmail"
        ).value.trim();


    const customerPhone =
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const customerAddress =
        document.getElementById(
            "customerAddress"
        ).value.trim();


    if(
        !customerName ||
        !customerEmail ||
        !customerPhone ||
        !customerAddress
    ){

        throw new Error(
            "Please complete your name, email, phone, and shipping address."
        );

    }


    /*
       Get the real product from Supabase.
       Never trust the price stored only
       in localStorage.
    */

    const product =
        await getProduct(
            cartItem.id
        );


    if(!product){

        throw new Error(
            "Product was not found."
        );

    }


    const stock =
        Number(
            product.stock || 0
        );


    if(
        stock < quantity
    ){

        throw new Error(
            `Only ${stock} item(s) are available.`
        );

    }


    showStatus(
        "Creating your secure Stripe checkout...",
        "success"
    );


    /*
       Call the Supabase Edge Function.
    */

    const response =
        await fetch(
            SUPABASE_URL +
            "/functions/v1/stripe-checkout",
            {

                method:
                    "POST",

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        product_id:
                            product.id,

                        quantity:
                            quantity,

                        customer_name:
                            customerName,

                        customer_email:
                            customerEmail,

                        customer_phone:
                            customerPhone,

                        customer_address:
                            customerAddress

                    })

            }

        );


    const text =
        await response.text();


    let data = null;


    try{

        data =
            text
            ? JSON.parse(text)
            : null;

    }catch(error){

        data = null;

    }


    console.log(
        "STRIPE CHECKOUT RESPONSE:",
        data
    );


    if(!response.ok){

        throw new Error(

            data?.error ||

            data?.message ||

            "Stripe Checkout could not be created."

        );

    }


    if(
        !data ||
        !data.checkout_url
    ){

        throw new Error(
            "Stripe Checkout URL was not returned."
        );

    }


    /*
       Redirect buyer to Stripe.
    */

    showStatus(
        "Redirecting you to Stripe...",
        "success"
    );


    window.location.href =
        data.checkout_url;

}


/* =====================================================
   PLACE ORDER BUTTON
===================================================== */

async function placeOrder(){

    if(
        placeOrderButton.disabled
    ){

        return;

    }


    placeOrderButton.disabled =
        true;


    placeOrderButton.textContent =
        "CONNECTING TO STRIPE...";


    try{

        await createStripeCheckout();

    }catch(error){

        console.error(
            "CHECKOUT ERROR:",
            error
        );


        showStatus(

            error.message ||
            "Could not start Stripe Checkout.",

            "error"

        );


        placeOrderButton.disabled =
            false;


        placeOrderButton.textContent =
            "💳 CONTINUE TO STRIPE";

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   START CHECKOUT
===================================================== */

async function startCheckout(){

    try{

        await displayCart();


        const loggedIn =
            await loadCurrentUser();


        if(!loggedIn){

            return;

        }


        /* =============================================
           PREFILL EMAIL
        ============================================= */

        const emailInput =
            document.getElementById(
                "customerEmail"
            );


        if(
            currentUser.email &&
            !emailInput.value
        ){

            emailInput.value =
                currentUser.email;

        }


        /* =============================================
           PREFILL NAME
        ============================================= */

        const metadata =
            currentUser.user_metadata ||
            {};


        const name =
            metadata.full_name ||
            metadata.name ||
            metadata.username ||
            "";


        const nameInput =
            document.getElementById(
                "customerName"
            );


        if(
            name &&
            !nameInput.value
        ){

            nameInput.value =
                name;

        }

    }catch(error){

        console.error(
            "START CHECKOUT ERROR:",
            error
        );


        showStatus(
            error.message ||
            "Could not load checkout.",
            "error"
        );

    }

}


/* =====================================================
   START
===================================================== */

startCheckout();

</script>

</body>
</html>
