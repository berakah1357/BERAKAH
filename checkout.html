<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BERAKAH - Checkout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    header a {
      text-decoration: none;
      color: #111827;
      font-weight: bold;
    }

    .container {
      max-width: 850px;
      margin: 40px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    .order {
      padding: 20px;
      background: #f5f7fb;
      border-radius: 12px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
    }

    .total {
      border-top: 1px solid #d1d5db;
      padding-top: 15px;
      margin-top: 15px;
      font-size: 21px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .notice {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">BERAKAH</div>
    <a href="cart.html">← CART</a>
  </header>

  <main class="container">

    <section class="card">

      <h1>Checkout</h1>

      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name">

      <label>Email</label>
      <input type="email" placeholder="Enter your email">

      <label>Shipping Address</label>
      <input type="text" placeholder="Street address">

      <label>City</label>
      <input type="text" placeholder="City">

      <label>State</label>
      <input type="text" placeholder="State">

      <label>ZIP Code</label>
      <input type="text" placeholder="ZIP code">

    </section>

    <section class="card">

      <h2>Order Summary</h2>

      <div class="order">

        <div class="row">
          <span>📱 Smartphone</span>
          <strong>$299</strong>
        </div>

        <div class="row total">
          <span>Total</span>
          <span>$299</span>
        </div>

      </div>

      <p class="notice">
        Your payment will be processed securely through a
        payment provider when BERAKAH's real checkout system
        is connected.
      </p>

      <button type="button">
        PLACE ORDER
      </button>

    </section>

  </main>

</body>
</html>
