<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BERAKAH - Product</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    header a {
      text-decoration: none;
      color: #111827;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 15px;
    }

    .product-card {
      background: white;
      padding: 30px;
      border-radius: 18px;
    }

    .product-image {
      height: 300px;
      background: #e5e7eb;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      margin-bottom: 25px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    .description {
      line-height: 1.7;
      color: #4b5563;
    }

    .seller {
      margin-top: 25px;
      padding: 18px;
      background: #f5f7fb;
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">BERAKAH</div>
    <a href="marketplace.html">← MARKETPLACE</a>
  </header>

  <main class="container">

    <section class="product-card">

      <div class="product-image">
        📱
      </div>

      <h1>Smartphone</h1>

      <div class="price">
        $299
      </div>

      <p class="description">
        Discover this smartphone from BERAKAH Tech.
        Connect with the seller for more information about
        the product, availability, and delivery.
      </p>

      <div class="seller">
        <strong>🏪 BERAKAH Tech</strong>
        <br><br>
        Verified BERAKAH Business
      </div>

      <button type="button">
        CONTACT SELLER
      </button>

    </section>

  </main>

</body>
</html>
