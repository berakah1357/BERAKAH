<!DOCTYPE html><html>
<head><title>BERAKAH Product</title><style>

body{
font-family:Arial;
background:#f5f5f5;
padding:30px;
}

.card{
background:white;
max-width:500px;
margin:auto;
padding:25px;
border-radius:12px;
}

button{
width:100%;
padding:15px;
background:#111827;
color:white;
border:none;
margin-top:15px;
cursor:pointer;
font-size:16px;
}

</style></head><body><div class="card"><img id="productImage"
style="width:100%;max-height:350px;object-fit:cover;border-radius:10px;display:none;">

<h1 id="name">Product</h1><h2 id="price"></h2><p id="description"></p><p>🏪 BERAKAH</p><button onclick="addToCart()">
ADD TO CART 🛒
</button></div><script>

let product = JSON.parse(
  localStorage.getItem("berakahProduct")
);

if(product){

  document.getElementById("name").innerHTML = product.name;

  document.getElementById("price").innerHTML =
    "$" + product.price;

  document.getElementById("description").innerHTML =
    product.description;

  let image = localStorage.getItem("berakahImage");

  if(image){

    let imageBox = document.getElementById("productImage");

    imageBox.src = image;
    imageBox.style.display = "block";

  }

}

function addToCart(){

  if(!product){
    alert("Product not found.");
    return;
  }

  let cart = JSON.parse(
    localStorage.getItem("berakahCart") || "[]"
  );

  cart.push(product);

  localStorage.setItem(
    "berakahCart",
    JSON.stringify(cart)
  );

  alert("Product added to cart! 🛒");

}

</script></body>
</html>
