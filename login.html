<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BERAKAH - Log In</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .forgot {
      text-align: right;
      margin-top: 12px;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
    }

    a {
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">BERAKAH</div>

  <h1>Welcome Back</h1>

  <form id="loginForm">

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <div class="forgot">
      <a href="#">Forgot password?</a>
    </div>

    <button id="loginButton" type="submit">
      LOG IN
    </button>

    <div id="message"></div>

  </form>

  <div class="signup">
    Don't have an account?
    <a href="signup.html">Create an account</a>
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  button.disabled = true;
  button.textContent = "LOGGING IN...";
  message.textContent = "";

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        "Login failed."
      );
    }

    localStorage.setItem(
      "berakah_access_token",
      data.access_token
    );

    localStorage.setItem(
      "berakah_refresh_token",
      data.refresh_token
    );

    localStorage.setItem(
      "berakah_user",
      JSON.stringify(data.user)
    );

    message.textContent = "Login successful!";

    setTimeout(function() {
      window.location.href = "feed.html";
    }, 1000);

  } catch (error) {

    message.textContent = error.message;

    button.disabled = false;
    button.textContent = "LOG IN";
  }

});
</script>

</body>
</html>
