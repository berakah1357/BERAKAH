<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Login</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

.container {
  max-width: 430px;
  margin: 60px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 3px;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  margin: 8px 0 28px;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 13px;
  border: 0;
  border-radius: 9px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

.message {
  display: none;
  margin-top: 18px;
  padding: 12px;
  border-radius: 8px;
  white-space: pre-wrap;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.signup {
  text-align: center;
  margin-top: 20px;
}

.signup a {
  color: #111827;
  font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
BERAKAH
</div>

<div class="subtitle">
Connect. Share. Grow Together.
</div>

<form id="loginForm">

<label for="email">
Email
</label>

<input
id="email"
type="email"
autocomplete="email"
required
placeholder="Enter your email">

<label for="password">
Password
</label>

<input
id="password"
type="password"
autocomplete="current-password"
required
placeholder="Enter your password">

<button
id="loginButton"
type="submit">
LOGIN
</button>

</form>

<div
id="message"
class="message">
</div>

<div class="signup">

Don't have an account?

<a href="signup.html">
Create Account
</a>

</div>

</div>

</div>

<script>

/* =====================================================
   BERAKAH SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   ELEMENTS
   ===================================================== */

const form =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");


/* =====================================================
   SHOW MESSAGE
   ===================================================== */

function showMessage(text, type) {

  message.style.display = "block";

  message.className =
    "message " + type;

  message.textContent = text;

}


/* =====================================================
   CLEAR OLD BERAKAH SESSION
   ===================================================== */

function clearOldSession() {

  localStorage.removeItem(
    "berakah_access_token"
  );

  localStorage.removeItem(
    "berakah_refresh_token"
  );

  localStorage.removeItem(
    "berakah_user"
  );

  localStorage.removeItem(
    "berakah_username"
  );

}


/* =====================================================
   LOGIN
   ===================================================== */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if (!email || !password) {

      showMessage(
        "Please enter your email and password.",
        "error"
      );

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
      "LOGGING IN...";

    message.style.display = "none";


    /*
      IMPORTANT:
      Remove the previous user's session
      before authenticating the new user.
    */

    clearOldSession();


    try {

      /* =============================================
         SUPABASE PASSWORD LOGIN
         ============================================= */

      const response =
        await fetch(

          SUPABASE_URL +
          "/auth/v1/token?grant_type=password",

          {
            method: "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              email: email,

              password: password

            })

          }

        );


      const text =
        await response.text();


      let data;

      try {

        data =
          text
          ? JSON.parse(text)
          : {};

      }
      catch {

        data = {};

      }


      /* =============================================
         LOGIN ERROR
         ============================================= */

      if (!response.ok) {

        throw new Error(

          data.error_description ||
          data.msg ||
          data.message ||
          "Login failed."

        );

      }


      if (!data.access_token) {

        throw new Error(
          "Supabase did not return an access token."
        );

      }


      /* =============================================
         SAVE NEW USER SESSION
         ============================================= */

      localStorage.setItem(
        "berakah_access_token",
        data.access_token
      );


      if (data.refresh_token) {

        localStorage.setItem(
          "berakah_refresh_token",
          data.refresh_token
        );

      }


      if (data.user) {

        localStorage.setItem(
          "berakah_user",
          JSON.stringify(data.user)
        );


        const metadata =
          data.user.user_metadata || {};


        const username =
          metadata.username ||
          metadata.user_name ||
          metadata.userName ||
          "";


        if (username) {

          localStorage.setItem(
            "berakah_username",
            username
          );

        }

      }


      /* =============================================
         SUCCESS
         ============================================= */

      showMessage(
        "Login successful! Opening BERAKAH...",
        "success"
      );


      setTimeout(
        function() {

          window.location.href =
            "index.html";

        },
        700
      );


    }
    catch(error) {

      console.error(
        "BERAKAH LOGIN ERROR:",
        error
      );


      /*
        Make sure an old user's session
        is never left behind.
      */

      clearOldSession();


      showMessage(
        error.message,
        "error"
      );


      loginButton.disabled =
        false;

      loginButton.textContent =
        "LOGIN";

    }

  }
);

</script>

</body>
</html>
