/* =====================================================
   LANGUAGE SYSTEM
   ===================================================== */

let currentLanguage = "ht";

function t(key) {
  return translations[currentLanguage][key];
}


function changeLanguage(language) {

  if (!translations[language]) {
    return;
  }

  currentLanguage = language;

  document.documentElement.lang =
    language === "ht" ? "ht" : language;


  document.getElementById("homeLink").textContent =
    t("home");

  document.getElementById("languageLabel").textContent =
    t("languageLabel");

  document.getElementById("pageTitle").textContent =
    t("pageTitle");

  document.getElementById("pageSubtitle").textContent =
    t("pageSubtitle");

  document.getElementById("emailLabel").textContent =
    t("emailLabel");

  document.getElementById("passwordLabel").textContent =
    t("passwordLabel");

  emailInput.placeholder =
    t("emailPlaceholder");

  passwordInput.placeholder =
    t("passwordPlaceholder");

  forgotPassword.textContent =
    t("forgot");

  loginButton.textContent =
    loginButton.disabled
      ? t("loggingIn")
      : t("login");

  document.getElementById("noAccount").textContent =
    t("noAccount");

  document.getElementById("createAccount").textContent =
    t("createAccount");

  document.getElementById("languagesText").textContent =
    t("languages");


  if (passwordInput.type === "password") {

    showPasswordButton.textContent =
      t("show");

  } else {

    showPasswordButton.textContent =
      t("hide");

  }


  localStorage.setItem(
    "ephphavora_language",
    language
  );
}


/* =====================================================
   LOAD SAVED LANGUAGE
   ===================================================== */

const savedLanguage =
  localStorage.getItem("ephphavora_language");

if (
  savedLanguage &&
  translations[savedLanguage]
) {

  currentLanguage =
    savedLanguage;

  document.getElementById("language").value =
    savedLanguage;
}

changeLanguage(currentLanguage);


document
  .getElementById("language")
  .addEventListener(
    "change",
    function() {
      changeLanguage(this.value);
    }
  );


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(message, type) {

  statusBox.textContent =
    message;

  statusBox.className =
    "status " + type;
}


/* =====================================================
   CLEAR OLD SESSION
   KEEP EXISTING KEYS FOR COMPATIBILITY
   ===================================================== */

function clearBERAKAHSession() {

  localStorage.removeItem(
    "berakah_access_token"
  );

  localStorage.removeItem(
    "berakah_refresh_token"
  );

  localStorage.removeItem(
    "berakah_user"
  );

  localStorage.removeItem(
    "berakah_username"
  );

  localStorage.removeItem(
    "berakah_auth_user_id"
  );

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  localStorage.removeItem(
    "supabase.auth.token"
  );
}


/* =====================================================
   SAVE SESSION
   ===================================================== */

function saveBERAKAHSession(data) {

  if (
    !data ||
    !data.access_token
  ) {

    throw new Error(
      "No access token was returned by Supabase."
    );
  }


  localStorage.setItem(
    "berakah_access_token",
    data.access_token
  );


  if (data.refresh_token) {

    localStorage.setItem(
      "berakah_refresh_token",
      data.refresh_token
    );
  }


  if (data.user) {

    localStorage.setItem(
      "berakah_user",
      JSON.stringify(data.user)
    );


    if (data.user.id) {

      localStorage.setItem(
        "berakah_auth_user_id",
        data.user.id
      );
    }


    const metadata =
      data.user.user_metadata || {};

    const username =
      metadata.username ||
      metadata.user_name ||
      metadata.userName ||
      "";


    if (username) {

      localStorage.setItem(
        "berakah_username",
        String(username)
          .replace("@", "")
          .trim()
      );
    }
  }
}


/* =====================================================
   LOGIN WITH SUPABASE
   ===================================================== */

async function loginUser(email, password) {

  clearBERAKAHSession();


  const response =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",

      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );


  const text =
    await response.text();


  let data = null;


  try {

    data =
      text
        ? JSON.parse(text)
        : null;

  } catch (error) {

    throw new Error(
      "Supabase returned an invalid response."
    );
  }


  if (!response.ok) {

    console.error(
      "EPHPHAVORA LOGIN ERROR:",
      data
    );


    if (
      data &&
      data.error_code ===
      "invalid_credentials"
    ) {

      throw new Error(
        t("incorrectCredentials")
      );
    }


    if (
      data &&
      data.msg
    ) {

      throw new Error(
        data.msg
      );
    }


    if (
      data &&
      data.error_description
    ) {

      throw new Error(
        data.error_description
      );
    }


    throw new Error(
      t("loginFailed")
    );
  }


  if (!data.access_token) {

    throw new Error(
      "Login succeeded but Supabase did not return an access token."
    );
  }


  saveBERAKAHSession(data);

  return data;
}


/* =====================================================
   VERIFY SESSION
   ===================================================== */

async function verifyNewSession(accessToken) {

  const response =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/user",

      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken
        }
      }
    );


  const text =
    await response.text();


  if (!response.ok) {

    console.error(
      "SESSION VERIFY ERROR:",
      text
    );

    return null;
  }


  if (!text) {
    return null;
  }


  try {

    return JSON.parse(text);

  } catch (error) {

    return null;
  }
}


/* =====================================================
   GET PROFILE USERNAME
   ===================================================== */

async function getProfileUsername(user) {

  if (
    !user ||
    !user.id
  ) {

    return "";
  }


  const url =
    SUPABASE_URL +
    "/rest/v1/profiles" +
    "?select=username" +
    "&user_id=eq." +
    encodeURIComponent(user.id) +
    "&limit=1";


  try {

    const response =
      await fetch(

        url,

        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              localStorage.getItem(
                "berakah_access_token"
              )
          }
        }
      );


    if (!response.ok) {
      return "";
    }


    const text =
      await response.text();


    const rows =
      text
        ? JSON.parse(text)
        : [];


    if (
      rows.length &&
      rows[0].username
    ) {

      return rows[0].username;
    }

  } catch (error) {

    console.warn(
      "Could not load profile username:",
      error
    );
  }


  return "";
}


/* =====================================================
   LOGIN FORM
   ===================================================== */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;


    if (!email) {

      showStatus(
        t("emailRequired"),
        "error"
      );

      return;
    }


    if (!password) {

      showStatus(
        t("passwordRequired"),
        "error"
      );

      return;
    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      t("loggingIn");


    showStatus(
      t("connecting"),
      "success"
    );


    try {

      /* LOGIN */

      const session =
        await loginUser(
          email,
          password
        );


      /* VERIFY TOKEN */

      const verifiedUser =
        await verifyNewSession(
          session.access_token
        );


      if (!verifiedUser) {

        clearBERAKAHSession();

        throw new Error(
          t("sessionError")
        );
      }


      /* SAVE VERIFIED USER */

      localStorage.setItem(
        "berakah_user",
        JSON.stringify(
          verifiedUser
        )
      );

      localStorage.setItem(
        "berakah_auth_user_id",
        verifiedUser.id
      );


      /* GET USERNAME */

      let username =
        localStorage.getItem(
          "berakah_username"
        ) || "";


      if (!username) {

        username =
          await getProfileUsername(
            verifiedUser
          );
      }


      if (username) {

        localStorage.setItem(
          "berakah_username",
          username
        );
      }


      /* SUCCESS */

      showStatus(
        t("success"),
        "success"
      );


      /* REDIRECT */

      setTimeout(
        function() {

          window.location.href =
            "profile.html";

        },
        700
      );

    } catch (error) {

      console.error(
        "EPHPHAVORA LOGIN ERROR:",
        error
      );


      clearBERAKAHSession();


      showStatus(
        error.message ||
        t("loginFailed"),
        "error"
      );


      loginButton.disabled =
        false;

      loginButton.textContent =
        t("login");
    }

  }
);

      emailInput.focus();

    try {

      showStatus(
        t("forgotSending"),

      const response =
        await fetch(

          SUPABASE_URL +
          "/auth/v1/recover",

          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              email: email
            })
          }
        );


      const text =
        await response.text();


      if (!response.ok) {

        let data = null;


        try {

          data =
            JSON.parse(text);

        } catch (error) {}


        throw new Error(
          data?.msg ||
          data?.message ||
          "Could not send password reset email."
        );
      }


      showStatus(
        t("forgotSuccess"),
        "success"
      );

    } catch (error) {

      console.error(
        "PASSWORD RESET ERROR:",
        error
      );

      showStatus(
        error.message,
        "error"
      );
    }

  }
);
