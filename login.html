<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Login</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

.container {
  max-width: 430px;
  margin: 70px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  margin-bottom: 28px;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 13px;
  border: 0;
  border-radius: 9px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

.message {
  margin-top: 18px;
  padding: 12px;
  border-radius: 8px;
  display: none;
  white-space: pre-wrap;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.signup {
  text-align: center;
  margin-top: 20px;
}

.signup a {
  color: #111827;
  font-weight: bold;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<div class="logo">
BERAKAH
</div>

<div class="subtitle">
Connect. Share. Grow Together.
</div>


<form id="loginForm">

<label for="email">
Email
</label>

<input
id="email"
type="email"
autocomplete="email"
required
placeholder="Enter your email">


<label for="password">
Password
</label>

<input
id="password"
type="password"
autocomplete="current-password"
required
placeholder="Enter your password">


<button
id="loginButton"
type="submit">

LOGIN

</button>

</form>


<div
id="message"
class="message">
</div>


<div class="signup">

Don't have an account?

<a href="signup.html">
Create Account
</a>

</div>

</div>

</div>


<script>

/* =====================================================
   BERAKAH SUPABASE CONFIGURATION
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   ELEMENTS
   ===================================================== */

const form =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text, type) {

message.style.display =
"block";

message.className =
"message " + type;

message.textContent =
text;

}


/* =====================================================
   CLEAR OLD SESSION
   ===================================================== */

function clearOldSession() {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

localStorage.removeItem(
"berakah_username"
);

localStorage.removeItem(
"supabase.auth.token"
);


/*
Clear possible Supabase
browser session keys.
*/

const keys = [];

for (
let i = 0;
i < localStorage.length;
i++
) {

const key =
localStorage.key(i);

if (
key &&
(
key.includes("supabase") ||
key.includes("auth-token")
)
) {

keys.push(key);

}

}

keys.forEach(
key => localStorage.removeItem(key)
);

}


/* =====================================================
   LOGIN
   ===================================================== */

form.addEventListener(
"submit",
async function(event) {

event.preventDefault();


const email =
emailInput.value.trim();

const password =
passwordInput.value;


if (!email || !password) {

showMessage(
"Please enter your email and password.",
"error"
);

return;

}


loginButton.disabled =
true;

loginButton.textContent =
"LOGGING IN...";


showMessage(
"",
"success"
);


/*
IMPORTANT:

Remove the previous account FIRST.

This prevents QUICKENETH's
old token from remaining active.
*/

clearOldSession();


try {


/* =================================================
   AUTHENTICATE WITH SUPABASE
   ================================================= */

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/token?grant_type=password",

{

method: "POST",

headers: {

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

email:
email,

password:
password

})

}

);


const text =
await response.text();


let data = null;

try {

data =
text ?
JSON.parse(text) :
null;

}
catch {

data = null;

}


if (!response.ok) {

throw new Error(

data?.msg ||
data?.message ||
data?.error_description ||
"Invalid email or password."

);

}


if (
!data ||
!data.access_token
) {

throw new Error(
"Supabase did not return an access token."
);

}


/* =================================================
   SAVE NEW ACCOUNT SESSION
   ================================================= */

localStorage.setItem(
"berakah_access_token",
data.access_token
);


if (data.refresh_token) {

localStorage.setItem(
"berakah_refresh_token",
data.refresh_token
);

}


if (data.user) {

localStorage.setItem(
"berakah_user",
JSON.stringify(data.user)
);


/*
Save the authenticated
username when available.
*/

const username =
data.user.user_metadata?.username ||
data.user.user_metadata?.user_name ||
data.user.user_metadata?.userName ||
"";


if (username) {

localStorage.setItem(
"berakah_username",
username
);

}

}


/* =================================================
   SUCCESS
   ================================================= */

showMessage(
"Login successful! Opening BERAKAH...",
"success"
);


/*
Small delay so the user
can see the success message.
*/

setTimeout(
function() {

window.location.href =
"index.html";

},
500
);


}
catch(error) {

console.error(
"BERAKAH LOGIN ERROR:",
error
);


/*
Make absolutely sure a bad
login doesn't leave an old
account token behind.
*/

clearOldSession();


showMessage(
"Login failed:\n\n" +
error.message,
"error"
);


loginButton.disabled =
false;

loginButton.textContent =
"LOGIN";

}

});

</script>

</body>

</html>
