<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BERAKAH - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      white-space: pre-wrap;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">BERAKAH</div>

  <h1>Create Your Account</h1>

  <form id="signupForm">

    <label>Full Name</label>
    <input id="fullName" type="text" required>

    <label>Username</label>
    <input id="username" type="text" required>

    <label>Email</label>
    <input id="email" type="email" required>

    <label>Password</label>
    <input id="password" type="password" minlength="6" required>

    <label>Preferred Language</label>

    <select id="language">

      <option value="ht">Haitian Creole</option>
      <option value="en">English</option>
      <option value="fr">French</option>
      <option value="es">Spanish</option>

    </select>

    <button id="signupButton" type="submit">
      CREATE ACCOUNT
    </button>

    <div id="message"></div>

  </form>

  <div class="login">

    Already have an account?

    <a href="login.html">
      Log In
    </a>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


const form =
  document.getElementById("signupForm");

const button =
  document.getElementById("signupButton");

const message =
  document.getElementById("message");


function showMessage(text) {

  message.textContent = text;

}


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    button.disabled = true;

    button.textContent =
      "CREATING ACCOUNT...";

    showMessage("");


    const fullName =
      document
        .getElementById("fullName")
        .value
        .trim();


    const username =
      document
        .getElementById("username")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const language =
      document
        .getElementById("language")
        .value;


    try {

      /*
        STEP 1
        CREATE SUPABASE AUTH USER
      */

      const authResponse =
        await fetch(

          SUPABASE_URL +
          "/auth/v1/signup",

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_ANON_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_ANON_KEY

            },

            body: JSON.stringify({

              email: email,

              password: password,

              data: {

                full_name:
                  fullName,

                username:
                  username,

                language:
                  language

              }

            })

          }

        );


      const authText =
        await authResponse.text();


      let authData = {};

      if (authText.trim()) {

        authData =
          JSON.parse(authText);

      }


      if (!authResponse.ok) {

        throw new Error(

          authData.error_description ||
          authData.msg ||
          authData.message ||
          "Account creation failed."

        );

      }


      /*
        SUPABASE MAY REQUIRE EMAIL
        CONFIRMATION.

        If there is no session,
        the user ID may still be
        returned as authData.user.id.
      */

      const user =
        authData.user;


      if (!user || !user.id) {

        showMessage(

          "Account created!\n\n" +
          "Please check your email " +
          "to confirm your account, " +
          "then log in."

        );

        setTimeout(

          function() {

            window.location.href =
              "login.html";

          },

          2500

        );

        return;

      }


      /*
        STEP 2
        CREATE PROFILE
      */

      const profileResponse =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/profiles",

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_ANON_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_ANON_KEY,

              "Prefer":
                "return=representation"

            },

            body: JSON.stringify({

              id:
                user.id,

              "Full name":
                fullName,

              username:
                username,

              language:
                language,

              user:
                user.id

            })

          }

        );


      const profileText =
        await profileResponse.text();


      if (!profileResponse.ok) {

        console.error(
          "PROFILE ERROR:",
          profileText
        );

        throw new Error(

          "Account was created, " +
          "but the profile could not be saved.\n\n" +
          profileText

        );

      }


      /*
        SUCCESS
      */

      showMessage(

        "BERAKAH account created successfully! 🎉\n\n" +
        "Your profile has been created."

      );


      setTimeout(

        function() {

          window.location.href =
            "login.html";

        },

        2000

      );


    }

    catch(error) {

      console.error(
        "BERAKAH SIGNUP ERROR:",
        error
      );


      showMessage(
        error.message
      );


      button.disabled = false;

      button.textContent =
        "CREATE ACCOUNT";

    }

  }

);

</script>

</body>

</html>
