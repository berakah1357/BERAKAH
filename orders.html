<script>

/* =========================================================
   BERAKAH SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let accessToken = null;
let currentUser = null;
let currentMode = "buyer";


/* =========================================================
   SUPABASE REQUEST HELPER
========================================================= */

async function supabaseRequest(
    endpoint,
    options = {},
    retry = true
) {

    const headers = {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + accessToken,
        "Content-Type": "application/json",
        ...(options.headers || {})
    };

    const response = await fetch(
        SUPABASE_URL + endpoint,
        {
            ...options,
            headers
        }
    );

    /*
       If the access token expired, refresh it once.
    */

    if (
        response.status === 401 &&
        retry
    ) {

        const refreshed = await refreshSession();

        if (refreshed) {

            return supabaseRequest(
                endpoint,
                options,
                false
            );

        }

    }

    return response;
}


/* =========================================================
   GET STORED ACCESS TOKEN
========================================================= */

function getStoredAccessToken() {

    return localStorage.getItem(
        "berakah_access_token"
    );

}


/* =========================================================
   GET STORED REFRESH TOKEN
========================================================= */

function getStoredRefreshToken() {

    return localStorage.getItem(
        "berakah_refresh_token"
    );

}


/* =========================================================
   SAVE SESSION
========================================================= */

function saveSession(session) {

    if (!session) {
        return;
    }

    if (session.access_token) {

        accessToken =
            session.access_token;

        localStorage.setItem(
            "berakah_access_token",
            session.access_token
        );

    }

    if (session.refresh_token) {

        localStorage.setItem(
            "berakah_refresh_token",
            session.refresh_token
        );

    }

}


/* =========================================================
   REFRESH SUPABASE SESSION
========================================================= */

async function refreshSession() {

    const refreshToken =
        getStoredRefreshToken();

    if (!refreshToken) {

        return false;

    }

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=refresh_token",
            {
                method: "POST",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    refresh_token:
                        refreshToken
                })
            }
        );


        if (!response.ok) {

            console.log(
                "Session refresh failed."
            );

            return false;

        }


        const data =
            await response.json();


        if (!data.access_token) {

            return false;

        }


        saveSession(data);

        return true;

    }

    catch (error) {

        console.error(
            "Refresh error:",
            error
        );

        return false;

    }

}


/* =========================================================
   GET CURRENT USER
========================================================= */

async function getCurrentUser() {

    /*
       First use stored access token.
    */

    accessToken =
        getStoredAccessToken();


    /*
       No access token.
       Try refresh token.
    */

    if (!accessToken) {

        const refreshed =
            await refreshSession();

        if (!refreshed) {

            return null;

        }

    }


    /*
       Ask Supabase for current user.
    */

    try {

        let response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/user",
                {
                    method: "GET",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken
                    }
                }
            );


        /*
           Token expired.
           Refresh and try again.
        */

        if (response.status === 401) {

            const refreshed =
                await refreshSession();

            if (!refreshed) {

                return null;

            }


            response =
                await fetch(
                    SUPABASE_URL +
                    "/auth/v1/user",
                    {
                        method: "GET",

                        headers: {
                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                accessToken
                        }
                    }
                );

        }


        if (!response.ok) {

            console.log(
                "Could not verify login:",
                await response.text()
            );

            return null;

        }


        const user =
            await response.json();


        return user;

    }

    catch (error) {

        console.error(
            "User error:",
            error
        );

        return null;

    }

}


/* =========================================================
   PAGE INITIALIZATION
========================================================= */

async function initializePage() {

    showLoading(
        "Checking your BERAKAH session..."
    );


    currentUser =
        await getCurrentUser();


    /*
       No valid session.
    */

    if (!currentUser) {

        document.getElementById(
            "ordersArea"
        ).style.display = "none";


        document.getElementById(
            "loginRequired"
        ).style.display = "block";


        return;

    }


    /*
       Valid session.
    */

    document.getElementById(
        "loginRequired"
    ).style.display = "none";


    document.getElementById(
        "ordersArea"
    ).style.display = "block";


    await loadBuyerOrders();

}


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(
    message,
    type = "message"
) {

    const area =
        document.getElementById(
            "messageArea"
        );


    area.innerHTML = `
        <div class="message ${type}">
            ${escapeHtml(message)}
        </div>
    `;

}


/* =========================================================
   SHOW LOADING
========================================================= */

function showLoading(message) {

    document.getElementById(
        "ordersList"
    ).innerHTML = `
        <div class="loading">
            ${escapeHtml(message)}
        </div>
    `;

}


/* =========================================================
   BUYER ORDERS
========================================================= */

async function showBuyerOrders() {

    currentMode = "buyer";


    document.getElementById(
        "buyerTab"
    ).classList.add("active");


    document.getElementById(
        "sellerTab"
    ).classList.remove("active");


    await loadBuyerOrders();

}


/* =========================================================
   SELLER ORDERS
========================================================= */

async function showSellerOrders() {

    currentMode = "seller";


    document.getElementById(
        "sellerTab"
    ).classList.add("active");


    document.getElementById(
        "buyerTab"
    ).classList.remove("active");


    await loadSellerOrders();

}


/* =========================================================
   LOAD BUYER ORDERS
========================================================= */

async function loadBuyerOrders() {

    showLoading(
        "Loading your purchases..."
    );


    const endpoint =
        "/rest/v1/orders" +
        "?select=*" +
        "&buyer_id=eq." +
        encodeURIComponent(
            currentUser.id
        ) +
        "&order=created_at.desc";


    try {

        const response =
            await supabaseRequest(
                endpoint
            );


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);

        }


        const orders =
            await response.json();


        renderBuyerOrders(
            orders
        );

    }

    catch (error) {

        console.error(
            "Buyer orders error:",
            error
        );


        showMessage(
            "Could not load your purchases. " +
            error.message,
            "error"
        );


        document.getElementById(
            "ordersList"
        ).innerHTML = "";

    }

}


/* =========================================================
   LOAD SELLER ORDERS
========================================================= */

async function loadSellerOrders() {

    showLoading(
        "Loading seller orders..."
    );


    const endpoint =
        "/rest/v1/orders" +
        "?select=*" +
        "&seller_id=eq." +
        encodeURIComponent(
            currentUser.id
        ) +
        "&order=created_at.desc";


    try {

        const response =
            await supabaseRequest(
                endpoint
            );


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);

        }


        const orders =
            await response.json();


        renderSellerOrders(
            orders
        );

    }

    catch (error) {

        console.error(
            "Seller orders error:",
            error
        );


        showMessage(
            "Could not load seller orders. " +
            error.message,
            "error"
        );


        document.getElementById(
            "ordersList"
        ).innerHTML = "";

    }

}


/* =========================================================
   RENDER BUYER ORDERS
========================================================= */

function renderBuyerOrders(
    orders
) {

    const container =
        document.getElementById(
            "ordersList"
        );


    if (!orders.length) {

        container.innerHTML = `
            <div class="empty">
                <h2>🛍️ No purchases yet</h2>

                <p>
                    Your purchases will appear here
                    after you place an order.
                </p>
            </div>
        `;

        return;

    }


    container.innerHTML =
        orders.map(
            order =>
                createBuyerOrderCard(
                    order
                )
        ).join("");

}


/* =========================================================
   RENDER SELLER ORDERS
========================================================= */

function renderSellerOrders(
    orders
) {

    const container =
        document.getElementById(
            "ordersList"
        );


    if (!orders.length) {

        container.innerHTML = `
            <div class="empty">
                <h2>🏪 No seller orders yet</h2>

                <p>
                    Orders for your products
                    will appear here.
                </p>
            </div>
        `;

        return;

    }


    container.innerHTML =
        orders.map(
            order =>
                createSellerOrderCard(
                    order
                )
        ).join("");

}


/* =========================================================
   BUYER ORDER CARD
========================================================= */

function createBuyerOrderCard(

) {

    const date =
        formatDate(
            order.created_at
        );


    const status =

    const canCancel =

        status !== "delivered";


    return `
        <div class="order-card">

            <div class="order-top">

                <div>

                    <div class="order-id">
                        Order #${escapeHtml(
                            String(order.id)
                        )}
                    </div>

                    <div class="date">
                        ${escapeHtml(date)}
                    </div>

                </div>

                <div class="status">
                    ${escapeHtml(status)}
                </div>

            </div>


            <div class="product-name">
                ${escapeHtml(
                    order.product_name ||
                    "Product"
                )}
            </div>


            <div class="info-row">
                <strong>Quantity:</strong>
                ${escapeHtml(
                    String(order.quantity || 1)
                )}
            </div>


            <div class="info-row">
                <strong>Price:</strong>
                $${formatMoney(
                    order.price
                )}
            </div>


            <div class="total">

                    order.total

            </div>


            <div class="shipping">

                <h3>
                    📦 Shipping Information

                <div class="info-row">
                    <strong>Name:</strong>
                    ${escapeHtml(
                        order.shipping_name ||
                        ""
                    )}
                </div>

                <div class="info-row">
                    <strong>Email:</strong>
                    ${escapeHtml(
                        order.shipping_email ||
                        ""
                    )}
                </div>

                <div class="info-row">
                    <strong>Phone:</strong>
                    ${escapeHtml(
                        order.shipping_phone ||
                        ""
                    )}
                </div>

                <div class="info-row">

}

/* =========================================================
   CANCEL ORDER
========================================================= */

async function cancelOrder(
    orderId
) {

    const confirmed =
        confirm(
            "Are you sure you want to cancel this order?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const endpoint =
            "/rest/v1/orders" +
            "?id=eq." +
            encodeURIComponent(
                orderId
            );


        const response =
            await supabaseRequest(
                endpoint,
                {
                    method: "PATCH",

                    headers: {
                        "Prefer":
                            "return=minimal"
                    },

                    body: JSON.stringify({
                        status:
                            "cancelled"
                    })
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);

        }


        showMessage(
            "Order cancelled successfully.",
            "success"
        );


        await loadBuyerOrders();

    }

    catch (error) {

        console.error(
            "Cancel order error:",
            error
        );


        showMessage(
            "Could not cancel the order. " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   UPDATE SELLER ORDER STATUS
========================================================= */

async function updateOrderStatus(
    orderId
) {

    const select =
        document.getElementById(
            "status-" + orderId
        );


    if (!select) {
        return;
    }


    const newStatus =
        select.value;


    try {

        const endpoint =
            "/rest/v1/orders" +
            "?id=eq." +
            encodeURIComponent(
                orderId
            );


        const response =
            await supabaseRequest(
                endpoint,
                {
                    method: "PATCH",

                    headers: {
                        "Prefer":
                            "return=minimal"
                    },

                    body: JSON.stringify({
                        status:
                            newStatus
                    })
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);

        }


        showMessage(
            "Order status updated successfully.",
            "success"
        );


        await loadSellerOrders();

    }

    catch (error) {

        console.error(
            "Update status error:",
            error
        );


        showMessage(
            "Could not update order status. " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    try {

        if (accessToken) {

            await fetch(
                SUPABASE_URL +
                "/auth/v1/logout",
                {
                    method: "POST",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken
                    }
                }
            );

        }

    }

    catch (error) {

        console.log(
            "Logout request error:",
            error
        );

    }


    /*
       Clear BERAKAH session tokens.
    */

    localStorage.removeItem(
        "berakah_access_token"
    );

    localStorage.removeItem(
        "berakah_refresh_token"
    );


    /*
       Redirect to login.
    */

    window.location.href =
        "login.html";

}


/* =========================================================
   FORMAT MONEY
========================================================= */

function formatMoney(
    value
) {

    const number =
        Number(value);


    if (Number.isNaN(number)) {
        return "0.00";
    }


    return number.toFixed(2);

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    value
) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (Number.isNaN(
        date.getTime()
    )) {

        return String(value);

    }


    return date.toLocaleString();

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
    value
) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   JAVASCRIPT STRING ESCAPE
========================================================= */

function escapeJs(
    value
) {

    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");

}
