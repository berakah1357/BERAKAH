<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BERAKAH - My Orders</title><style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:white;
  padding:15px 20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:24px;
  font-weight:bold;
  text-decoration:none;
  color:#111827;
}

nav{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

nav a{
  color:#374151;
  text-decoration:none;
  font-size:14px;
}

.container{
  max-width:900px;
  margin:30px auto;
  padding:0 15px;
}

h1{
  margin-bottom:25px;
}

.order{
  background:white;
  border-radius:14px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.order-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  border-bottom:1px solid #e5e7eb;
  padding-bottom:15px;
}

.order-number{
  font-weight:bold;
  font-size:18px;
}

.date{
  color:#6b7280;
  font-size:14px;
}

.status{
  display:inline-block;
  padding:7px 13px;
  border-radius:20px;
  background:#fef3c7;
  color:#92400e;
  font-weight:bold;
  font-size:13px;
}

.product{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid #f0f0f0;
}

.product-name{
  font-weight:bold;
}

.quantity{
  color:#6b7280;
  font-size:14px;
  margin-top:5px;
}

.price{
  font-weight:bold;
}

.order-total{
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
  padding-top:18px;
}

.customer{
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #e5e7eb;
  color:#4b5563;
  line-height:1.6;
}

.empty{
  background:white;
  border-radius:14px;
  padding:50px 20px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.empty-icon{
  font-size:55px;
}

.empty h2{
  margin:15px 0 8px;
}

.shop-button{
  display:inline-block;
  margin-top:15px;
  padding:13px 20px;
  background:#111827;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

@media(max-width:600px){

  .header-inner{
    flex-direction:column;
    align-items:flex-start;
  }

  nav{
    gap:10px;
  }

  .product{
    flex-direction:column;
  }

}

</style></head><body><header>  <div class="header-inner"><a class="logo" href="index.html">
  BERAKAH
</a>

<nav>

  <a href="index.html">Home</a>

  <a href="feed.html">Feed</a>

  <a href="people.html">👥 People</a>

  <a href="marketplace.html">Market</a>

  <a href="notifications.html">🔔 Notifications</a>

  <a href="messages.html">💬 Messages</a>

</nav>

  </div></header><div class="container">  <h1>📦 MY ORDERS</h1>  <div id="orders"></div></div><script>

/* =========================
   GET ORDERS
========================= */

let orders = JSON.parse(
  localStorage.getItem("berakahOrders") || "[]"
);


/* =========================
   ORDER CONTAINER
========================= */

let container =
  document.getElementById("orders");


/* =========================
   NO ORDERS
========================= */

if(orders.length === 0){

  container.innerHTML = `

    <div class="empty">

      <div class="empty-icon">
        📦
      </div>

      <h2>
        No orders yet
      </h2>

      <p>
        Your purchases will appear here.
      </p>

      <a
        class="shop-button"
        href="marketplace.html">

        START SHOPPING

      </a>

    </div>

  `;

}


/* =========================
   DISPLAY ORDERS
========================= */

orders
  .slice()
  .reverse()
  .forEach(function(order){

    let orderCard =
      document.createElement("div");

    orderCard.className =
      "order";


    /* ORDER DATE */

    let date = "";

    if(order.createdAt){

      date =
        new Date(order.createdAt)
          .toLocaleString();

    }


    /* PRODUCTS */

    let productsHTML = "";

    let products =
      order.products || [];


    products.forEach(function(product){

      let name =
        product.name ||
        product.productName ||
        "Product";

      let price =
        Number(product.price) || 0;

      let quantity =
        Number(product.quantity) || 1;

      let itemTotal =
        price * quantity;


      productsHTML += `

        <div class="product">

          <div>

            <div class="product-name">

              ${escapeHTML(name)}

            </div>

            <div class="quantity">

              Quantity: ${quantity}

            </div>

          </div>

          <div class="price">

            $${itemTotal.toFixed(2)}

          </div>

        </div>

      `;

    });


    /* ORDER CARD */

    orderCard.innerHTML = `

      <div class="order-header">

        <div>

          <div class="order-number">

            Order #${escapeHTML(
              order.orderNumber ||
              String(order.id || "")
            )}

          </div>

          <div class="date">

            ${escapeHTML(date)}

          </div>

        </div>

        <div class="status">

          ${escapeHTML(
            order.status || "NEW"
          )}

        </div>

      </div>


      <div>

        ${productsHTML}

      </div>


      <div class="order-total">

        <span>TOTAL</span>

        <span>

          $${Number(
            order.total || 0
          ).toFixed(2)}

        </span>

      </div>


      <div class="customer">

        <strong>Shipping to:</strong>

        ${escapeHTML(
          order.customerName || ""
        )}

        <br>

        ${escapeHTML(
          order.customerAddress || ""
        )}

      </div>

    `;


    container.appendChild(orderCard);

  });


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script></body></html>
