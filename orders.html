Order status updates automatically while this page is open.
</div><div id="ordersContainer"><div class="loading">
Loading orders...
</div></div></div><script>


/* =====================================================
   BERAKAH SUPABASE
===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
===================================================== */

const accessToken =
localStorage.getItem(
  "berakah_access_token"
);


/* =====================================================
   ELEMENT
===================================================== */

const ordersContainer =
document.getElementById(
  "ordersContainer"
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
  endpoint,
  options={}
){

  const response =
    await fetch(
      SUPABASE_URL + endpoint,
      {

        ...options,

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }
    );


  const text =
    await response.text();


  let data = null;


  try{

    data =
      text
      ? JSON.parse(text)
      : null;

  }catch(error){

    data = text;

  }


  if(!response.ok){

    console.error(
      "SUPABASE ERROR:",
      data
    );


    throw new Error(

      data?.message ||
      data?.msg ||
      data?.hint ||
      data?.details ||
      "Supabase request failed."

    );

  }


  return data;

}


/* =====================================================
   LOAD CURRENT USER
===================================================== */

async function loadCurrentUser(){

  if(!accessToken){

    window.location.href =
      "login.html";

    return null;

  }


  try{

    return await supabaseRequest(
      "/auth/v1/user"
    );

  }catch(error){

    console.error(
      "USER ERROR:",
      error
    );


    localStorage.removeItem(
      "berakah_access_token"
    );

    localStorage.removeItem(
      "berakah_refresh_token"
    );


    window.location.href =
      "login.html";

    return null;

  }

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
  value
){

  if(!value){
    return "";
  }


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  return date.toLocaleString();

}


/* =====================================================
   STATUS
===================================================== */

function getStatus(
  order
){

  const raw =
    String(
      order.status ||
      "unknown"
    )
    .toLowerCase()
    .trim();


  const allowed = [

    "pending",
    "paid",
    "processing",
    "shipped",
    "delivered",
    "cancelled",
    "refunded"

  ];


  if(
    allowed.includes(raw)
  ){

    return raw;

  }


  return "unknown";

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

  const user =
    await loadCurrentUser();


  if(!user){

    return;

  }


  try{


    const endpoint =

      "/rest/v1/orders" +

      "?select=*" +

      "&customer_id=eq." +

      encodeURIComponent(
        user.id
      ) +

      "&order=created_at.desc";


    const orders =
      await supabaseRequest(
        endpoint
      );


    renderOrders(
      orders || []
    );


  }catch(error){

    console.error(
      "ORDERS ERROR:",
      error
    );


    ordersContainer.innerHTML = `

      <div class="error">

        Could not load your orders.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(
  orders
){

  if(!orders.length){

    ordersContainer.innerHTML = `

      <div class="empty">

        <h2>
          No orders yet
        </h2>

        <p>
          Your purchases will appear here.
        </p>

      </div>

    `;

    return;

  }


  ordersContainer.innerHTML =

    orders.map(
      function(order){

        const status =
          getStatus(
            order
          );


        const orderNumber =
          order.order_number ||
          order.id ||
          "Unknown";


        const productName =
          order.product_name ||
          "Product";


        const quantity =
          Math.max(
            1,
            Number(
              order.quantity
            ) || 1
          );


        const price =
          Number(
            order.price
          ) || 0;


        const total =
          Number(
            order.total
          ) || 0;


        const customerName =
          order.shipping_name ||
          order.customer_name ||
          "";


        const address =
          order.shipping_address ||
          order.customer_address ||
          "";


        const date =
          order.updated_at ||
          order.created_at ||
          "";


        return `

          <div class="order-card">

            <div class="order-top">

              <div>

                <div class="order-number">

                  Order #${escapeHTML(
                    orderNumber
                  )}

                </div>


                <div class="date">

                  ${escapeHTML(
                    formatDate(
                      date
                    )
                  )}

                </div>

              </div>


              <div>

                <span
                  class="status ${status}"
                >

                  ${escapeHTML(
                    status
                      .toUpperCase()
                  )}

                </span>

              </div>

            </div>


            <div class="product">

              <div class="product-name">

                ${escapeHTML(
                  productName
                )}

              </div>


              <div class="product-info">

                Quantity:
                ${quantity}

              </div>


              <div class="product-info">

                $${price.toFixed(2)}

              </div>

            </div>


            <div class="total">

              TOTAL
              $${total.toFixed(2)}

            </div>


            ${
              customerName ||
              address

              ?

              `

                <div class="shipping">

                  <strong>
                    Shipping to:
                  </strong>

                  ${escapeHTML(
                    customerName
                  )}

                  ${
                    address

                    ?

                    `<br>${escapeHTML(
                      address
                    )}`

                    :

                    ""

                  }

                </div>

              `

              :

              ""

            }

          </div>

        `;

      }
    ).join("");

}


/* =====================================================
   START
===================================================== */

loadOrders();


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
  function(){

    loadOrders();

  },
  5000
);


/* =====================================================
   REFRESH WHEN TAB RETURNS
===================================================== */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      !document.hidden
    ){

      loadOrders();

    }

  }
);

</script></body></html>
