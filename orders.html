<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Orders</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

/* =========================
   HEADER
========================= */

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;

    padding: 15px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #111827;
    text-decoration: none;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

nav a {
    text-decoration: none;
    color: #374151;
    font-size: 14px;
}

nav a:hover {
    color: #2563eb;
}

/* =========================
   CONTAINER
========================= */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 20px 50px;
}

h1 {
    margin-top: 0;
}

/* =========================
   USER INFO
========================= */

.user-box {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 15px 20px;
    margin-bottom: 20px;
}

.user-box strong {
    display: block;
    margin-bottom: 5px;
}

.user-box span {
    color: #6b7280;
    font-size: 14px;
}

/* =========================
   TABS
========================= */

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tab-button {
    border: none;
    background: white;
    color: #374151;

    border: 1px solid #d1d5db;

    padding: 12px 18px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;
}

.tab-button:hover {
    background: #f3f4f6;
}

.tab-button.active {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
}

/* =========================
   STATUS
========================= */

.status {
    display: inline-block;

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

    text-transform: capitalize;
}

.status-pending {
    background: #fef3c7;
    color: #92400e;
}

.status-confirmed {
    background: #dbeafe;
    color: #1e40af;
}

.status-processing {
    background: #e0e7ff;
    color: #3730a3;
}

.status-shipped {
    background: #cffafe;
    color: #155e75;
}

.status-delivered {
    background: #dcfce7;
    color: #166534;
}

.status-cancelled {
    background: #fee2e2;
    color: #991b1b;
}

/* =========================
   ORDER CARD
========================= */

.order-card {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 12px;

    padding: 20px;

    margin-bottom: 15px;
}

.order-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    border-bottom: 1px solid #e5e7eb;

    padding-bottom: 15px;

    margin-bottom: 15px;
}

.order-number {
    font-weight: bold;
    font-size: 16px;
}

.order-date {
    color: #6b7280;
    font-size: 13px;
    margin-top: 5px;
}

/* =========================
   ORDER DETAILS
========================= */

.order-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

    margin-bottom: 15px;
}

.detail-box {
    background: #f9fafb;

    border-radius: 8px;

    padding: 12px;
}

.detail-label {
    color: #6b7280;

    font-size: 12px;

    margin-bottom: 5px;

    text-transform: uppercase;
}

.detail-value {
    font-weight: 600;

    word-break: break-word;
}

.product-name {
    font-size: 19px;

    font-weight: bold;

    margin-bottom: 8px;
}

.price {
    font-size: 18px;

    font-weight: bold;

    margin-top: 10px;
}

.total {
    font-size: 22px;

    font-weight: bold;

    margin-top: 10px;
}

/* =========================
   SHIPPING
========================= */

.shipping {
    border-top: 1px solid #e5e7eb;

    padding-top: 15px;

    margin-top: 15px;
}

.shipping h3 {
    margin-top: 0;
}

/* =========================
   SELLER CONTROLS
========================= */

.seller-controls {
    border-top: 1px solid #e5e7eb;

    padding-top: 15px;

    margin-top: 15px;
}

.seller-controls label {
    display: block;

    font-weight: bold;

    margin-bottom: 7px;
}

.status-select {
    width: 100%;

    padding: 11px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    background: white;

    font-size: 14px;
}

.update-button {
    width: 100%;

    margin-top: 10px;

    padding: 11px;

    border: none;

    border-radius: 8px;

    background: #16a34a;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.update-button:hover {
    background: #15803d;
}

.update-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* =========================
   BUYER CANCEL
========================= */

.cancel-button {
    width: 100%;

    margin-top: 10px;

    padding: 11px;

    border: none;

    border-radius: 8px;

    background: #fee2e2;

    color: #dc2626;

    font-weight: bold;

    cursor: pointer;
}

.cancel-button:hover {
    background: #fecaca;
}

/* =========================
   EMPTY
========================= */

.empty {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 12px;

    padding: 50px 20px;

    text-align: center;
}

.empty-icon {
    font-size: 55px;
}

.empty h2 {
    margin-bottom: 8px;
}

.empty p {
    color: #6b7280;
}

/* =========================
   LOADING
========================= */

.loading {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 12px;

    padding: 40px;

    text-align: center;

    color: #6b7280;
}

/* =========================
   ERROR
========================= */

.error {
    background: #fee2e2;

    color: #991b1b;

    border: 1px solid #fecaca;

    border-radius: 10px;

    padding: 15px;

    margin-bottom: 20px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    header {
        flex-direction: column;

        align-items: flex-start;
    }

    .tabs {
        flex-direction: column;
    }

    .tab-button {
        width: 100%;
    }

    .order-header {
        flex-direction: column;

        align-items: flex-start;
    }

    .order-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<a
    href="index.html"
    class="logo">

    BERAKAH

</a>


<nav>

<a href="index.html">
    Home
</a>

<a href="feed.html">
    Feed
</a>

<a href="people.html">
    👥 People
</a>

<a href="marketplace.html">
    Market
</a>

<a href="notifications.html">
    🔔 Notifications
</a>

<a href="messages.html">
    💬 Messages
</a>

<a href="cart.html">
    🛒 Cart
</a>

<a href="#"
   onclick="logout(); return false;">

    Logout

</a>

</nav>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

<h1>
    📦 BERAKAH Orders
</h1>


<div
    id="errorMessage">
</div>


<div
    id="userBox"
    class="user-box"
    style="display:none;">

</div>


<!-- =========================
     TABS
========================= -->

<div class="tabs">

<button
    id="buyerTab"
    class="tab-button active"
    onclick="showBuyerOrders()">

    🛍️ My Purchases

</button>


<button
    id="sellerTab"
    class="tab-button"
    onclick="showSellerOrders()">

    🏪 Seller Orders

</button>

</div>


<!-- =========================
     ORDERS
========================= -->

<div
    id="ordersContent">

    <div class="loading">

        Loading orders...

    </div>

</div>


</main>


<script>

/* =====================================================
   BERAKAH SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken = null;

let currentUser = null;

let currentMode = "buyer";


/* =====================================================
   GET ACCESS TOKEN
===================================================== */

function getAccessToken() {

    return localStorage.getItem(
        "berakah_access_token"
    );

}


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
    endpoint,
    options = {}
) {

    accessToken =
        getAccessToken();


    if (!accessToken) {

        throw new Error(
            "You are not logged in."
        );

    }


    const headers = {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " + accessToken,

        "Content-Type":
            "application/json",

        ...(options.headers || {})

    };


    const response =
        await fetch(
            SUPABASE_URL +
            endpoint,
            {
                ...options,
                headers
            }
        );


    const text =
        await response.text();


    let data = null;


    try {

        data =
            text
                ? JSON.parse(text)
                : null;

    } catch {

        data = text;

    }


    if (!response.ok) {

        console.error(
            "Supabase error:",
            data
        );

        throw new Error(
            data?.message ||
            data?.msg ||
            "Supabase request failed."
        );

    }


    return data;

}


/* =====================================================
   LOAD CURRENT USER
===================================================== */

async function loadCurrentUser() {

    currentUser =
        await supabaseRequest(
            "/auth/v1/user"
        );


    if (!currentUser ||
        !currentUser.id) {

        throw new Error(
            "Could not verify your account."
        );

    }


    displayUser();

}


/* =====================================================
   DISPLAY USER
===================================================== */

function displayUser() {

    const box =
        document.getElementById(
            "userBox"
        );


    const name =
        currentUser.user_metadata?.full_name ||
        currentUser.user_metadata?.name ||
        currentUser.email ||
        "BERAKAH Member";


    box.innerHTML = `

        <strong>
            ${escapeHTML(name)}
        </strong>

        <span>
            ${escapeHTML(
                currentUser.email || ""
            )}
        </span>

    `;


    box.style.display = "block";

}


/* =====================================================
   SHOW BUYER ORDERS
===================================================== */

function showBuyerOrders() {

    currentMode = "buyer";


    document
        .getElementById("buyerTab")
        .classList.add("active");


    document
        .getElementById("sellerTab")
        .classList.remove("active");


    loadOrders();

}


/* =====================================================
   SHOW SELLER ORDERS
===================================================== */

function showSellerOrders() {

    currentMode = "seller";


    document
        .getElementById("sellerTab")
        .classList.add("active");


    document
        .getElementById("buyerTab")
        .classList.remove("active");


    loadOrders();

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContent"
        );


    container.innerHTML = `

        <div class="loading">

            Loading orders...

        </div>

    `;


    try {

        let endpoint;


        if (currentMode === "buyer") {

            endpoint =
                "/rest/v1/orders" +
                "?select=*" +
                "&buyer_id=eq." +
                encodeURIComponent(
                    currentUser.id
                ) +
                "&order=created_at.desc";

        } else {

            endpoint =
                "/rest/v1/orders" +
                "?select=*" +
                "&seller_id=eq." +
                encodeURIComponent(
                    currentUser.id
                ) +
                "&order=created_at.desc";

        }


        const orders =
            await supabaseRequest(
                endpoint
            );


        renderOrders(
            Array.isArray(orders)
                ? orders
                : []
        );

    } catch (error) {

        console.error(error);


        showError(
            error.message
        );


        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h2>
                    Could not load orders
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(orders) {

    const container =
        document.getElementById(
            "ordersContent"
        );


    if (
        !orders ||
        orders.length === 0
    ) {

        if (currentMode === "buyer") {

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🛍️
                    </div>

                    <h2>
                        No purchases yet
                    </h2>

                    <p>
                        Your marketplace purchases
                        will appear here.
                    </p>

                    <button
                        class="update-button"
                        onclick="goMarketplace()">

                        🛒 Shop the Marketplace

                    </button>

                </div>

            `;

        } else {

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🏪
                    </div>

                    <h2>
                        No seller orders yet
                    </h2>

                    <p>
                        Orders for your products
                        will appear here.
                    </p>

                    <button
                        class="update-button"
                        onclick="goMarketplace()">

                        🛍️ Go to Marketplace

                    </button>

                </div>

            `;

        }

        return;

    }


    container.innerHTML =
        orders.map(function(order) {

            return createOrderCard(
                order
            );

        }).join("");

}


/* =====================================================
   CREATE ORDER CARD
===================================================== */

function createOrderCard(order) {

    const productName =
        escapeHTML(
            order.product_name ||
            "Product"
        );


    const quantity =
        Number(
            order.quantity || 1
        );


    const price =
        Number(
            order.price || 0
        );


    const total =
        Number(
            order.total ||
            price * quantity
        );


    const status =
        String(
            order.status ||
            "pending"
        ).toLowerCase();


    const orderDate =
        formatDate(
            order.created_at
        );


    const orderId =
        order.id;


    let otherPersonHTML = "";


    if (currentMode === "seller") {

        otherPersonHTML = `

            <div class="detail-box">

                <div class="detail-label">
                    Buyer
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        order.shipping_name ||
                        "BERAKAH Buyer"
                    )}
                </div>

                ${
                    order.shipping_email
                    ?
                    `<div style="margin-top:5px;font-size:13px;color:#6b7280;">
                        ${escapeHTML(
                            order.shipping_email
                        )}
                    </div>`
                    :
                    ""
                }

            </div>

        `;

    } else {

        otherPersonHTML = `

            <div class="detail-box">

                <div class="detail-label">
                    Seller
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        order.seller_id
                            ? "BERAKAH Seller"
                            : "BERAKAH Member"
                    )}
                </div>

            </div>

        `;

    }


    let sellerControls = "";


    if (currentMode === "seller") {

        sellerControls = `

            <div class="seller-controls">

                <label
                    for="status-${orderId}">

                    Update Order Status

                </label>


                <select
                    id="status-${orderId}"
                    class="status-select">

                    ${statusOption(
                        "pending",
                        status
                    )}

                    ${statusOption(
                        "confirmed",
                        status
                    )}

                    ${statusOption(
                        "processing",
                        status
                    )}

                    ${statusOption(
                        "shipped",
                        status
                    )}

                    ${statusOption(
                        "delivered",
                        status
                    )}

                    ${statusOption(
                        "cancelled",
                        status
                    )}

                </select>


                <button
                    class="update-button"
                    onclick="updateOrderStatus('${escapeJS(orderId)}')">

                    Update Status

                </button>

            </div>

        `;

    }


    let cancelButton = "";


    if (
        currentMode === "buyer" &&
        status !== "delivered" &&
        status !== "cancelled"
    ) {

        cancelButton = `

            <button
                class="cancel-button"
                onclick="cancelOrder('${escapeJS(orderId)}')">

                ❌ Cancel Order

            </button>

        `;

    }


    return `

        <div class="order-card">

            <div class="order-header">

                <div>

                    <div class="order-number">

                        Order #${escapeHTML(
                            orderId
                        )}

                    </div>

                    <div class="order-date">

                        ${orderDate}

                    </div>

                </div>


                <div>

                    <span
                        class="status status-${escapeHTML(status)}">

                        ${escapeHTML(status)}

                    </span>

                </div>

            </div>


            <div class="product-name">

                ${productName}

            </div>


            <div class="order-grid">

                ${otherPersonHTML}


                <div class="detail-box">

                    <div class="detail-label">
                        Quantity
                    </div>

                    <div class="detail-value">

                        ${quantity}

                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Price
                    </div>

                    <div class="detail-value">

                        $${price.toFixed(2)}

                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Total
                    </div>

                    <div class="detail-value">

                        $${total.toFixed(2)}

                    </div>

                </div>

            </div>


            ${
                currentMode === "buyer"
                ?
                `

                <div class="shipping">

                    <h3>
                        📍 Shipping Information
                    </h3>

                    ${
                        order.shipping_name
                        ?
                        `<p>
                            <strong>Name:</strong>
                            ${escapeHTML(
                                order.shipping_name
                            )}
                        </p>`
                        :
                        ""
                    }

                    ${
                        order.shipping_email
                        ?
                        `<p>
                            <strong>Email:</strong>
                            ${escapeHTML(
                                order.shipping_email
                            )}
                        </p>`
                        :
                        ""
                    }

                    ${
                        order.shipping_phone
                        ?
                        `<p>
                            <strong>Phone:</strong>
                            ${escapeHTML(
                                order.shipping_phone
                            )}
                        </p>`
                        :
                        ""
                    }

                    ${
                        order.shipping_address
                        ?
                        `<p>
                            <strong>Address:</strong><br>
                            ${escapeHTML(
                                order.shipping_address
                            )}
                        </p>`
                        :
                        ""
                    }

                </div>

                `
                :
                ""
            }


            ${sellerControls}

            ${cancelButton}

        </div>

    `;

}


/* =====================================================
   STATUS OPTION
===================================================== */

function statusOption(
    value,
    current
) {

    const selected =
        value === current
            ? "selected"
            : "";


    const label =
        value.charAt(0).toUpperCase() +
        value.slice(1);


    return `

        <option
            value="${value}"
            ${selected}>

            ${label}

        </option>

    `;

}


/* =====================================================
   UPDATE ORDER STATUS
===================================================== */

async function updateOrderStatus(
    orderId
) {

    const select =
        document.getElementById(
            "status-" + orderId
        );


    if (!select) {

        return;

    }


    const newStatus =
        select.value;


    const confirmed =
        confirm(
            "Change this order status to " +
            newStatus +
            "?"
        );


    if (!confirmed) {

        return;

    }


    const buttons =
        document.querySelectorAll(
            ".update-button"
        );


    buttons.forEach(function(button) {

        button.disabled = true;

    });


    try {

        await supabaseRequest(

            "/rest/v1/orders" +
            "?id=eq." +
            encodeURIComponent(
                orderId
            ),

            {
                method: "PATCH",

                headers: {

                    "Prefer":
                        "return=minimal"

                },

                body: JSON.stringify({

                    status:
                        newStatus

                })

            }

        );


        alert(
            "Order status updated successfully."
        );


        await loadOrders();

    } catch (error) {

        console.error(error);


        alert(
            "Could not update order: " +
            error.message
        );

    } finally {

        buttons.forEach(function(button) {

            button.disabled = false;

        });

    }

}


/* =====================================================
   BUYER CANCEL ORDER
===================================================== */

async function cancelOrder(
    orderId
) {

    const confirmed =
        confirm(
            "Are you sure you want to cancel this order?"
        );


    if (!confirmed) {

        return;

    }


    try {

        await supabaseRequest(

            "/rest/v1/orders" +
            "?id=eq." +
            encodeURIComponent(
                orderId
            ) +
            "&buyer_id=eq." +
            encodeURIComponent(
                currentUser.id
            ),

            {
                method: "PATCH",

                headers: {

                    "Prefer":
                        "return=minimal"

                },

                body: JSON.stringify({

                    status:
                        "cancelled"

                })

            }

        );


        alert(
            "Order cancelled."
        );


        await loadOrders();

    } catch (error) {

        console.error(error);


        alert(
            "Could not cancel order: " +
            error.message
        );

    }

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value) {

    if (!value) {

        return "Date unavailable";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "Date unavailable";

    }


    return date.toLocaleString();

}


/* =====================================================
   MARKETPLACE
===================================================== */

function goMarketplace() {

    window.location.href =
        "marketplace.html";

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        "berakah_access_token"
    );

    localStorage.removeItem(
        "berakah_refresh_token"
    );


    window.location.href =
        "login.html";

}


/* =====================================================
   ERROR MESSAGE
===================================================== */

function showError(message) {

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.className = "error";


    box.innerHTML =

        escapeHTML(
            message ||
            "Something went wrong."
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJS(value) {

    return String(value)

        .replaceAll(
            "\\",
            "\\\\"
        )

        .replaceAll(
            "'",
            "\\'"
        )

        .replaceAll(
            "\n",
            "\\n"
        )

        .replaceAll(
            "\r",
            "\\r"
        );

}

        `;

    }

}
