  </button>  <div id="message" class="message">
    Loading orders...
  </div>  <div id="orders"></div></main><script>

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const ACCESS_KEY =
  "berakah_access_token";

function getToken() {
  return localStorage.getItem(ACCESS_KEY);
}

async function getCurrentUser() {

  const token = getToken();

  if (!token) {
    throw new Error("You are not logged in.");
  }

  const response = await fetch(
    `${SUPABASE_URL}/auth/v1/user`,
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${token}`
      }
    }
  );

  if (!response.ok) {
    throw new Error("Your login session has expired.");
  }

  return await response.json();
}

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function money(value) {

  return Number(value || 0).toLocaleString(
    "en-US",
    {
      style: "currency",
      currency: "USD"
    }
  );
}

function formatDate(value) {

  if (!value) return "—";

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleString();
}

function getStatus(status) {

  const allowed = [
    "pending",
    "confirmed",
    "processing",
    "shipped",
    "delivered",
    "cancelled"
  ];

  const clean =
    String(status || "")
      .toLowerCase()
      .trim();

  if (!allowed.includes(clean)) {

    return {
      text: "Unknown",
      className: "unknown"
    };
  }

  return {
    text: clean,
    className: clean
  };
}

async function loadOrders() {

  const message =
    document.getElementById("message");

  const container =
    document.getElementById("orders");

  message.style.display = "block";
  message.className = "message";
  message.textContent =
    "Loading your orders...";

  container.innerHTML = "";

  try {

    const token = getToken();

    const user =
      await getCurrentUser();

    /*
      IMPORTANT:
      Only orders belonging to the
      currently logged-in customer
      are requested.
    */

    const url =
      `${SUPABASE_URL}/rest/v1/orders` +
      `?select=*` +
      `&customer_id=eq.${encodeURIComponent(user.id)}` +
      `&order=created_at.desc`;

    const response =
      await fetch(
        url,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              `Bearer ${token}`,
            "Content-Type":
              "application/json"
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      console.error(
        "CUSTOMER ORDERS ERROR:",
        data
      );

      throw new Error(
        data.message ||
        data.hint ||
        "Could not load your orders."
      );
    }

    message.style.display = "none";

    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {

      container.innerHTML = `
        <div class="message empty">

          <h2>No orders yet</h2>

          <p>
            Your purchases will appear here.
          </p>

        </div>
      `;

      return;
    }

    data.forEach(order => {

      const status =
        getStatus(order.status);

      const payment =
        String(
          order.payment_status ||
          "pending"
        ).toLowerCase();

      const paymentClass =
        payment === "paid"
          ? "payment-paid"
          : "payment-pending";

      const product =
        order.product_name ||
        "Product";

      const customerName =
        order.customer_name ||
        order.shipping_name ||
        "Customer";

      const card =
        document.createElement("div");

      card.className =
        "order-card";

      card.innerHTML = `

        <div class="order-top">

          <div>

            <div class="order-number">
              Order #
              ${escapeHtml(
                order.order_number ||
                order.id ||
                "—"
              )}
            </div>

            <div class="date">
              Ordered:
              ${formatDate(
                order.created_at
              )}
            </div>

          </div>

          <div class="status ${status.className}">
            ${escapeHtml(status.text)}
          </div>

        </div>

        <div class="order-body">

          <div class="product-name">
            ${escapeHtml(product)}
          </div>

          <div class="info-grid">

            <div class="info">

              <span class="label">
                Quantity
              </span>

              <span class="value">
                ${escapeHtml(
                  order.quantity ?? 0
                )}
              </span>

            </div>

            <div class="info">

              <span class="label">
                Price
              </span>

              <span class="value">
                ${money(order.price)}
              </span>

            </div>

            <div class="info">

              <span class="label">
                Total
              </span>

              <span class="value">
                ${money(order.total)}
              </span>

            </div>

            <div class="info">

              <span class="label">
                Payment
              </span>

              <span class="value ${paymentClass}">
                ${escapeHtml(payment)}
              </span>

            </div>

          </div>

          <div class="info-grid"
               style="margin-top:12px;">

            <div class="info">

              <span class="label">
                Customer
              </span>

              <span class="value">
                ${escapeHtml(customerName)}
              </span>

            </div>

            <div class="info">

              <span class="label">
                Shipping Address
              </span>

              <span class="value">
                ${escapeHtml(
                  order.shipping_address ||
                  order.customer_address ||
                  "—"
                )}
              </span>

            </div>

          </div>

          <div class="updated">

            Last updated:
            ${formatDate(
              order.updated_at ||
              order.created_at
            )}

          </div>

        </div>
      `;

      container.appendChild(card);

    });

  } catch (error) {

    console.error(error);

    message.style.display = "block";
    message.className =
      "message error";

    message.innerHTML = `
      <strong>Error:</strong><br>
      ${escapeHtml(error.message)}
    `;
  }
}

/*
  Automatically checks for status changes
  every 5 seconds.
*/
setInterval(
  loadOrders,
  5000
);

loadOrders();

</script></body>
