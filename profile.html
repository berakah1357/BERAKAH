<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons a,
.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  color: #111827;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
  text-decoration: none;
  font-weight: bold;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 850px;
  margin: 30px auto;
  padding: 0 15px;
}

#loading {
  background: white;
  padding: 30px;
  border-radius: 18px;
  text-align: center;
  font-weight: bold;
}

#error {
  display: none;
  background: white;
  color: #b91c1c;
  padding: 25px;
  border-radius: 18px;
  white-space: pre-wrap;
  line-height: 1.5;
}

.profile {
  display: none;
}

.cover {
  height: 180px;
  background: #111827;
  border-radius: 18px 18px 0 0;
}

.profile-card {
  background: white;
  padding: 25px;
  border-radius: 0 0 18px 18px;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  font-weight: bold;
  margin-top: -70px;
  border: 5px solid white;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h1 {
  margin: 15px 0 5px;
}

.username {
  color: #6b7280;
  font-size: 16px;
}

.language {
  color: #6b7280;
  font-size: 14px;
  margin-top: 8px;
}

.bio {
  line-height: 1.6;
  margin-top: 20px;
}

.stats {
  display: flex;
  gap: 35px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stat strong {
  display: block;
  font-size: 20px;
}

.buttons {
  margin-top: 25px;
}

.action-button {
  padding: 11px 18px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-right: 8px;
  margin-bottom: 8px;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.action-button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#status {
  margin-top: 10px;
  font-weight: bold;
  min-height: 20px;
}

.edit-box {
  display: none;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  padding: 20px;
  border-radius: 14px;
  margin-top: 20px;
}

.edit-box h3 {
  margin-top: 0;
}

.edit-box label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

.edit-box input,
.edit-box textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  font-family: Arial, sans-serif;
}

.edit-box textarea {
  min-height: 110px;
  resize: vertical;
}

.save-button {
  background: #111827;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

.cancel-button {
  background: #e5e7eb;
  color: #111827;
  border: none;
  padding: 12px 18px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
  margin-left: 5px;
}

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 20px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: none;
}

.post-time {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 10px;
}

.post-content {
  line-height: 1.5;
  white-space: pre-wrap;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 10px;
}

.post-actions {
  margin-top: 12px;
}

.post-actions button {
  border: none;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}

@media (max-width: 600px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .nav-buttons {
    width: 100%;
  }

}

</style>

</head>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;

let profileData = null;

let profileNumberId = null;

let profileAuthUserId = null;


/* =========================================
   HEADERS
========================================= */

function headers(extra) {

return Object.assign({

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + accessToken

}, extra || {});

}


/* =========================================
   SAFE
========================================= */

function safe(value) {

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   ERROR
========================================= */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"profile"
).style.display =
"none";


document.getElementById(
"error"
).style.display =
"block";


document.getElementById(
"error"
).textContent =
message;

}


/* =========================================
   CURRENT USER
========================================= */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"Your login session is missing. Please log in again."
);

}


const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Login session error:\n\n" +
text
);

}


if (!text.trim()) {

throw new Error(
"Supabase returned no user."
);

}


return JSON.parse(text);

}


/* =========================================
   GET PROFILE ID
========================================= */

function getProfileId() {

const params =
new URLSearchParams(
window.location.search
);

return params.get("id");

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile() {

const requestedId =
getProfileId();


if (!requestedId) {

throw new Error(
"No profile ID was provided."
);

}


/*
   IMPORTANT DATABASE STRUCTURE:

   profiles.id = NUMBER

   profiles.user_id = AUTH UUID

   Example:

   id = 2

   user_id =
   574bfeaf-38a9-48f3-879b-966d18d66c32
*/


profileNumberId =
requestedId;


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=id,created_at,%22Full%20name%22,username,language,avatar_url,stripe_connect_account_id,user_id" +
"&id=eq." +
encodeURIComponent(requestedId) +
"&limit=1";


const response =
await fetch(

url,

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


console.log(
"PROFILE RESPONSE:",
text
);


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


let rows = [];


if (text.trim()) {

rows =
JSON.parse(text);

}


if (!rows.length) {

throw new Error(
"Profile not found."
);

}


profileData =
rows[0];


profileAuthUserId =
profileData.user_id;


console.log(
"PROFILE NUMBER ID:",
profileNumberId
);


console.log(
"PROFILE AUTH UUID:",
profileAuthUserId
);


console.log(
"CURRENT AUTH UUID:",
currentUser.id
);


/* =========================================
   DISPLAY NAME
========================================= */

const fullName =
profileData["Full name"] ||
profileData.username ||
"BERAKAH User";


document.getElementById(
"profileName"
).textContent =
fullName;


/* =========================================
   USERNAME
========================================= */

const username =
profileData.username ||
"berakahuser";


document.getElementById(
"profileUsername"
).textContent =
"@" +
username.toLowerCase();


/* =========================================
   LANGUAGE
========================================= */

if (profileData.language) {

document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
profileData.language.toUpperCase();

}


/* =========================================
   AVATAR
========================================= */

const avatar =
document.getElementById(
"avatar"
);


if (profileData.avatar_url) {

avatar.innerHTML = `

<img
src="${safe(profileData.avatar_url)}"
alt="Profile photo">

`;

}
else {

avatar.textContent =
String(fullName)
.charAt(0)
.toUpperCase() ||
"B";

}


/* =========================================
   BIO
========================================= */

document.getElementById(
"profileBio"
).textContent =
profileData.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


/* =========================================
   LOAD POSTS
========================================= */

await loadPosts();


/* =========================================
   LOAD FOLLOW COUNTS
========================================= */

await loadFollowCounts();


/* =========================================
   OWN PROFILE CHECK
========================================= */

const editButton =
document.getElementById(
"editButton"
);


const isOwner =
String(profileAuthUserId).trim() ===
String(currentUser.id).trim();


console.log(
"IS PROFILE OWNER:",
isOwner
);


if (isOwner) {

editButton.style.display =
"inline-block";

}
else {

editButton.style.display =
"none";

}


/* =========================================
   FOLLOW BUTTON
========================================= */

await updateFollowButton();


/* =========================================
   SHOW PROFILE
========================================= */

document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"profile"
).style.display =
"block";

}


/* =========================================
   LOAD POSTS
========================================= */

async function loadPosts() {

if (!profileAuthUserId) {

document.getElementById(
"postsList"
).innerHTML = `

<div class="empty">
No posts yet.
</div>

`;

return;

}


/*
   POSTS USE THE AUTH UUID.

   NEVER USE profiles.id HERE.
*/


const url =
SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(
profileAuthUserId
) +
"&order=created_at.desc";


const response =
await fetch(

url,

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


console.log(
"POSTS RESPONSE:",
text
);


if (!response.ok) {

throw new Error(
"Could not load posts:\n\n" +
text
);

}


let posts =
[];


if (text.trim()) {

posts =
JSON.parse(text);

}


const list =
document.getElementById(
"postsList"
);


list.innerHTML =
"";


document.getElementById(
"postsCount"
).textContent =
posts.length;


if (!posts.length) {

list.innerHTML = `

<div class="empty">
No posts yet.
</div>

`;

return;

}


posts.forEach(
function(post) {

const div =
document.createElement(
"div"
);


div.className =
"post";


let dateText =
"Date unavailable";


if (post.created_at) {

const date =
new Date(
post.created_at
);

if (!isNaN(date.getTime())) {

dateText =
date.toLocaleString();

}

}


let imageHTML =
"";


if (post.image_url) {

imageHTML = `

<img
class="post-image"
src="${safe(post.image_url)}"
alt="Post image">

`;

}


div.innerHTML = `

<div class="post-time">
${safe(dateText)}
</div>

<div class="post-content">
${safe(post.content || "")}
</div>

${imageHTML}

<div class="post-actions">

<button
onclick="location.href='feed.html'">
❤️ Like
</button>

</div>

`;


list.appendChild(
div
);

});

}


/* =========================================
   LOAD FOLLOW COUNTS
========================================= */

async function loadFollowCounts() {

if (!profileAuthUserId) {

return;

}


/* FOLLOWERS */

const followersURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&following_id=eq." +
encodeURIComponent(
profileAuthUserId
);


const followersResponse =
await fetch(

followersURL,

{
method: "GET",
headers: headers()
}

);


const followersText =
await followersResponse.text();


if (!followersResponse.ok) {

throw new Error(
"Could not load followers:\n\n" +
followersText
);

}


const followers =
followersText.trim()
?
JSON.parse(followersText)
:
[];


/* FOLLOWING */

const followingURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
profileAuthUserId
);


const followingResponse =
await fetch(

followingURL,

{
method: "GET",
headers: headers()
}

);


const followingText =
await followingResponse.text();


if (!followingResponse.ok) {

throw new Error(
"Could not load following:\n\n" +
followingText
);

}


const following =
followingText.trim()
?
JSON.parse(followingText)
:
[];


document.getElementById(
"followersCount"
).textContent =
followers.length;


document.getElementById(
"followingCount"
).textContent =
following.length;

}


/* =========================================
   CHECK FOLLOW
========================================= */

async function checkFollowing() {

if (
String(profileAuthUserId) ===
String(currentUser.id)
) {

return false;

}


const url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profileAuthUserId
);


const response =
await fetch(

url,

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not check follow status:\n\n" +
text
);

}


if (!text.trim()) {

return false;

}


return JSON.parse(text).length > 0;

}


/* =========================================
   FOLLOW BUTTON
========================================= */

async function updateFollowButton() {

const button =
document.getElementById(
"followButton"
);


if (
String(profileAuthUserId) ===
String(currentUser.id)
) {

button.style.display =
"none";

return;

}


button.style.display =
"inline-block";


const following =
await checkFollowing();


if (following) {

button.textContent =
"Following";

button.className =
"action-button following";

}
else {

button.textContent =
"Follow";

button.className =
"action-button follow";

}

}


/* =========================================
   FOLLOW NOTIFICATION
========================================= */

async function createFollowNotification() {

const actorName =
currentUser.user_metadata?.username ||
currentUser.email?.split("@")[0] ||
"BERAKAH User";


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/notifications",

{

method:
"POST",

headers:
headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

user_id:
profileAuthUserId,

actor_id:
currentUser.id,

type:
"follow",

message:
actorName +
" follows you",

read:
false

})

}

);


return response.ok;

}


/* =========================================
   FOLLOW / UNFOLLOW
========================================= */

async function toggleFollow() {

const button =
document.getElementById(
"followButton"
);


const status =
document.getElementById(
"status"
);


button.disabled =
true;


try {

const following =
await checkFollowing();


if (following) {

const url =
SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profileAuthUserId
);


const response =
await fetch(

url,

{
method:
"DELETE",
headers:
headers()
}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
text ||
"Could not unfollow."
);

}


status.textContent =
"Unfollowed successfully.";

}
else {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method:
"POST",

headers:
headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profileAuthUserId

})

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
text ||
"Could not follow."
);

}


await createFollowNotification();


status.textContent =
"Following successfully.";

}


await loadFollowCounts();

await updateFollowButton();

}
catch(error) {

console.error(
"FOLLOW ERROR:",
error
);

status.textContent =
error.message;

}


button.disabled =
false;

}


/* =========================================
   OPEN EDIT PROFILE
========================================= */

function openEditProfile() {

document.getElementById(
"editBox"
).style.display =
"block";


document.getElementById(
"editFullName"
).value =
profileData["Full name"] ||
"";


document.getElementById(
"editUsername"
).value =
profileData.username ||
"";


document.getElementById(
"editBio"
).value =
profileData.bio ||
"";


document.getElementById(
"editLanguage"
).value =
profileData.language ||
"";


document.getElementById(
"editBox"
).scrollIntoView({
behavior: "smooth"
});

}


/* =========================================
   CANCEL EDIT
========================================= */

function cancelEdit() {

document.getElementById(
"editBox"
).style.display =
"none";


document.getElementById(
"editStatus"
).textContent =
"";

}


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile() {

const button =
document.getElementById(
"saveProfileButton"
);


const status =
document.getElementById(
"editStatus"
);


const fullName =
document.getElementById(
"editFullName"
).value.trim();


const username =
document.getElementById(
"editUsername"
).value.trim();


const bio =
document.getElementById(
"editBio"
).value.trim();


const language =
document.getElementById(
"editLanguage"
).value.trim();


if (!fullName) {

status.textContent =
"Please enter your full name.";

return;

}


if (!username) {

status.textContent =
"Please enter your username.";

return;

}


button.disabled =
true;

status.textContent =
"Saving...";


try {

const body = {

"Full name":
fullName,

username:
username,

bio:
bio,

language:
language

};


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(
profileNumberId
),

{

method:
"PATCH",

headers:
headers({

"Content-Type":
"application/json",

"Prefer":
"return=representation"

}),

body:
JSON.stringify(body)

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not save profile:\n\n" +
text
);

}


if (text.trim()) {

const updated =
JSON.parse(text);

if (updated.length) {

profileData =
updated[0];

}

}


/* UPDATE SCREEN */

document.getElementById(
"profileName"
).textContent =
fullName;


document.getElementById(
"profileUsername"
).textContent =
"@" +
username.toLowerCase();


document.getElementById(
"profileBio"
).textContent =
bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


document.getElementById(
"profileLanguage"
).textContent =
language
?
"Language: " +
language.toUpperCase()
:
"";


const avatar =
document.getElementById(
"avatar"
);


if (profileData.avatar_url) {

avatar.innerHTML = `

<img
src="${safe(profileData.avatar_url)}"
alt="Profile photo">

`;

}
else {

avatar.textContent =
fullName
.charAt(0)
.toUpperCase();

}


status.textContent =
"Profile saved successfully!";


setTimeout(
function() {

document.getElementById(
"editBox"
).style.display =
"none";

status.textContent =
"";

},
1200
);

}
catch(error) {

console.error(
"SAVE PROFILE ERROR:",
error
);

status.textContent =
error.message;

}


button.disabled =
false;

}


/* =========================================
   BUTTON EVENTS
========================================= */

document.getElementById(
"followButton"
).addEventListener(
"click",
toggleFollow
);


document.getElementById(
"editButton"
).addEventListener(
"click",
openEditProfile
);


document.getElementById(
"cancelEditButton"
).addEventListener(
"click",
cancelEdit
);


document.getElementById(
"saveProfileButton"
).addEventListener(
"click",
saveProfile
);


/* =========================================
   LOGOUT
========================================= */

document.getElementById(
"logoutButton"
).addEventListener(
"click",
function() {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

location.href =
"login.html";

});


/* =========================================
   START
========================================= */

async function start() {

try {

if (!accessToken) {

location.href =
"login.html";

return;

}


currentUser =
await getCurrentUser();


console.log(
"CURRENT USER:",
currentUser.id
);


await loadProfile();

}
catch(error) {

console.error(
"BERAKAH PROFILE ERROR:",
error
);


showError(
error.message
);

}

}


start();

</script>

</body>

</html>
