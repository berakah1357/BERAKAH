<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BERAKAH - Profile</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f3f6fa;
  color: #111827;
}


/* =====================================================
   HEADER
   ===================================================== */

header {
  position: sticky;
  top: 0;
  z-index: 1000;

  background: rgba(255,255,255,.97);

  border-bottom:
    1px solid #e5e7eb;

  box-shadow:
    0 2px 12px rgba(0,0,0,.04);

  padding: 12px 15px;
}

.nav {
  max-width: 1100px;
  margin: auto;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 15px;
}

.logo {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #111827;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-links a,
.nav-links button {

  text-decoration: none;

  border:
    1px solid #d1d5db;

  background: white;
  color: #111827;

  padding:
    8px 11px;

  border-radius: 9px;

  font-weight: 700;

  cursor: pointer;

  transition:
    .2s ease;
}

.nav-links a:hover,
.nav-links button:hover {
  transform: translateY(-1px);
  background: #f3f4f6;
}

.nav-links .logout {
  background: #111827;
  color: white;
  border-color: #111827;
}

.nav-links .logout:hover {
  background: #374151;
}


/* =====================================================
   MAIN
   ===================================================== */

main {
  width: 100%;
  max-width: 950px;

  margin:
    25px auto;

  padding:
    0 15px 50px;
}


/* =====================================================
   LOADING / ERROR
   ===================================================== */

.loading,
.error {

  background: white;

  border-radius: 18px;

  padding: 35px;

  box-shadow:
    0 5px 25px rgba(0,0,0,.05);

  text-align: center;
}

.loading {
  font-weight: 700;
  color: #4b5563;
}

.error {

  display: none;

  color: #b91c1c;

  text-align: left;

  white-space: pre-wrap;

  border:
    1px solid #fecaca;

  background: #fff7f7;
}


/* =====================================================
   PROFILE
   ===================================================== */

.profile {
  display: none;
}


/* =====================================================
   COVER
   ===================================================== */

.cover {

  height: 220px;

  border-radius:
    20px 20px 0 0;

  background:
    linear-gradient(
      135deg,
      #111827,
      #374151,
      #111827
    );

  position: relative;

  overflow: hidden;
}

.cover::after {

  content: "";

  position: absolute;

  inset: 0;

  background:
    radial-gradient(
      circle at 20% 30%,
      rgba(255,255,255,.12),
      transparent 30%
    );

  pointer-events: none;
}


/* =====================================================
   PROFILE CARD
   ===================================================== */

.profile-card {

  background: white;

  padding:
    0 28px 30px;

  border-radius:
    0 0 20px 20px;

  box-shadow:
    0 5px 25px rgba(0,0,0,.05);
}


/* =====================================================
   AVATAR
   ===================================================== */

.avatar {

  width: 125px;
  height: 125px;

  margin-top: -65px;

  border-radius: 50%;

  background: #e5e7eb;

  border:
    5px solid white;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 48px;

  font-weight: 900;

  overflow: hidden;

  position: relative;

  box-shadow:
    0 4px 15px rgba(0,0,0,.15);
}

.avatar img {

  width: 100%;
  height: 100%;

  object-fit: cover;
}


/* =====================================================
   PROFILE TEXT
   ===================================================== */

h1 {

  margin:
    15px 0 3px;

  font-size: 30px;

  word-break: break-word;
}

.username {

  color: #6b7280;

  font-size: 15px;
}

.language {

  color: #6b7280;

  margin-top: 8px;

  font-size: 14px;

  font-weight: 600;
}

.bio {

  margin-top: 18px;

  line-height: 1.65;

  max-width: 700px;

  white-space: pre-wrap;

  word-break: break-word;
}


/* =====================================================
   PROFILE META
   ===================================================== */

.profile-meta {

  display: flex;

  gap: 12px;

  flex-wrap: wrap;

  margin-top: 15px;
}

.meta-badge {

  background: #f3f4f6;

  padding:
    7px 11px;

  border-radius: 20px;

  font-size: 13px;

  color: #4b5563;

  font-weight: 600;
}


/* =====================================================
   STATS
   ===================================================== */

.stats {

  display: flex;

  gap: 40px;

  margin-top: 25px;

  padding-top: 20px;

  border-top:
    1px solid #e5e7eb;

  flex-wrap: wrap;
}

.stat {

  cursor: default;
}

.stat strong {

  display: block;

  font-size: 23px;

  margin-bottom: 3px;
}

.stat span {

  color: #6b7280;

  font-size: 13px;
}


/* =====================================================
   ACTIONS
   ===================================================== */

.actions {

  margin-top: 25px;

  display: flex;

  flex-wrap: wrap;

  gap: 8px;
}

.action {

  border: 0;

  border-radius: 9px;

  padding:
    11px 16px;

  font-weight: 800;

  cursor: pointer;

  transition:
    .2s ease;
}

.action:hover {

  transform:
    translateY(-1px);
}

.primary {

  background: #111827;

  color: white;
}

.primary:hover {

  background: #374151;
}

.secondary {

  background: #e5e7eb;

  color: #111827;
}

.secondary:hover {

  background: #d1d5db;
}

.follow {

  background: #111827;

  color: white;
}

.following {

  background: #e5e7eb;

  color: #111827;
}

.action:disabled {

  opacity: .6;

  cursor:
    not-allowed;

  transform:
    none;
}


/* =====================================================
   STATUS
   ===================================================== */

.status {

  width: 100%;

  margin-top: 5px;

  font-weight: 700;

  font-size: 14px;
}


/* =====================================================
   EDIT BOX
   ===================================================== */

.edit-box {

  display: none;

  margin-top: 22px;

  padding: 22px;

  background: #f9fafb;

  border:
    1px solid #e5e7eb;

  border-radius: 16px;
}

.edit-box h3 {

  margin-top: 0;

  margin-bottom: 10px;
}

.edit-box label {

  display: block;

  font-weight: 800;

  margin:
    15px 0 7px;
}

.edit-box input,
.edit-box textarea,
.edit-box select {

  width: 100%;

  padding: 12px;

  border:
    1px solid #d1d5db;

  border-radius: 9px;

  font-size: 15px;

  background: white;

  outline: none;
}

.edit-box input:focus,
.edit-box textarea:focus,
.edit-box select:focus {

  border-color: #111827;

  box-shadow:
    0 0 0 3px rgba(17,24,39,.08);
}

.edit-box textarea {

  min-height: 110px;

  resize: vertical;
}

.save,
.cancel {

  margin-top: 16px;

  padding:
    11px 17px;

  border: 0;

  border-radius: 9px;

  font-weight: 800;

  cursor: pointer;
}

.save {

  background: #111827;

  color: white;
}

.cancel {

  background: #e5e7eb;

  color: #111827;

  margin-left: 6px;
}

.edit-status {

  margin-top: 12px;

  font-weight: 700;
}


/* =====================================================
   POSTS
   ===================================================== */

.posts {

  margin-top: 25px;

  background: white;

  padding:
    25px;

  border-radius: 20px;

  box-shadow:
    0 5px 25px rgba(0,0,0,.05);
}

.posts-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;
}

.posts-header h2 {

  margin:
    0 0 10px;
}

.post {

  padding:
    20px 0;

  border-bottom:
    1px solid #e5e7eb;
}

.post:last-child {

  border-bottom: 0;
}

.post-date {

  color: #6b7280;

  font-size: 12px;

  margin-bottom: 10px;
}

.post-content {

  white-space: pre-wrap;

  line-height: 1.65;

  font-size: 16px;

  word-break: break-word;
}

.post-image {

  width: 100%;

  max-height: 500px;

  object-fit: cover;

  border-radius: 13px;

  margin-top: 14px;

  display: block;
}


/* =====================================================
   POST ACTIONS
   ===================================================== */

.post-actions {

  display: flex;

  gap: 8px;

  margin-top: 13px;

  flex-wrap: wrap;
}

.like-button,
.share-post-button {

  border: 0;

  background: #f3f4f6;

  color: #111827;

  padding:
    8px 13px;

  border-radius: 9px;

  cursor: pointer;

  font-weight: 700;
}

.like-button:hover,
.share-post-button:hover {

  background: #e5e7eb;
}

.like-button.liked {

  background: #fee2e2;

  color: #b91c1c;
}


/* =====================================================
   EMPTY
   ===================================================== */

.empty {

  text-align: center;

  color: #6b7280;

  padding:
    35px 10px;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 700px) {

  header {
    position: relative;
  }

  .nav {

    align-items:
      flex-start;

    flex-direction:
      column;
  }

  .nav-links {

    width: 100%;

    overflow-x: auto;

    flex-wrap: nowrap;

    padding-bottom: 3px;
  }

  .nav-links a,
  .nav-links button {

    white-space: nowrap;
  }

  main {

    margin-top: 15px;

    padding:
      0 10px 40px;
  }

  .cover {

    height: 160px;

    border-radius:
      16px 16px 0 0;
  }

  .profile-card {

    padding:
      0 18px 24px;

    border-radius:
      0 0 16px 16px;
  }

  .avatar {

    width: 105px;
    height: 105px;

    margin-top: -55px;

    font-size: 40px;
  }

  h1 {

    font-size: 25px;
  }

  .stats {

    gap: 25px;
  }

  .posts {

    padding:
      18px;

    border-radius: 16px;
  }

  .actions {

    display: grid;

    grid-template-columns:
      1fr 1fr;
  }

  .action {

    width: 100%;
  }

}


/* =====================================================
   SMALL PHONE
   ===================================================== */

@media (max-width: 420px) {

  .actions {

    grid-template-columns:
      1fr;
  }

  .stats {

    gap: 20px;
  }

  .stats .stat {

    min-width:
      75px;
  }

}

</style>

</head>

<script>

/* =====================================================
   BERAKAH SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
   ===================================================== */

const accessToken =
localStorage.getItem(
  "berakah_access_token"
);


let currentUser = null;

let profile = null;


/* =====================================================
   LANGUAGE NAMES
   ===================================================== */

const LANGUAGE_NAMES = {

  ht:
    "Haitian Creole",

  en:
    "English",

  fr:
    "French",

  es:
    "Spanish"

};


/* =====================================================
   SUPABASE HEADERS
   ===================================================== */

function supabaseHeaders(extra = {}) {

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + accessToken,

    ...extra

  };

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

  return String(value ?? "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   ERROR
   ===================================================== */

function showError(message) {

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "profile"
  ).style.display =
    "none";


  const error =
    document.getElementById(
      "error"
    );


  error.style.display =
    "block";


  error.textContent =
    message;

}


/* =====================================================
   URL PARAMETER
   ===================================================== */

function getURLParameter(name) {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get(name);

}


/* =====================================================
   GET CURRENT USER
   ===================================================== */

async function getCurrentUser() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/user",

      {

        method:
          "GET",

        headers:
          supabaseHeaders()

      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Could not verify login:\n\n" +
      text
    );

  }


  if (!text) {

    throw new Error(
      "No logged-in user was returned."
    );

  }


  return JSON.parse(text);

}


/* =====================================================
   LOAD OWN PROFILE
   ===================================================== */

async function loadOwnProfile() {

  const userId =
    currentUser.id;


  const url =
    SUPABASE_URL +
    "/rest/v1/profiles" +
    "?select=*" +
    "&user_id=eq." +
    encodeURIComponent(userId) +
    "&limit=1";


  const response =
    await fetch(

      url,

      {

        method:
          "GET",

        headers:
          supabaseHeaders()

      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Could not load your profile:\n\n" +
      text
    );

  }


  const rows =
    text ?
      JSON.parse(text) :
      [];


  if (!rows.length) {

    throw new Error(

      "Your BERAKAH profile was not found.\n\n" +

      "Auth ID:\n" +

      userId

    );

  }


  profile =
    rows[0];


  displayProfile();

}


/* =====================================================
   LOAD PROFILE BY ID
   ===================================================== */

async function loadProfileById(id) {

  if (!/^[0-9]+$/.test(id)) {

    throw new Error(
      "Invalid profile ID."
    );

  }


  const url =
    SUPABASE_URL +
    "/rest/v1/profiles" +
    "?select=*" +
    "&id=eq." +
    encodeURIComponent(id) +
    "&limit=1";


  const response =
    await fetch(

      url,

      {

        method:
          "GET",

        headers:
          supabaseHeaders()

      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Could not load profile:\n\n" +
      text
    );

  }


  const rows =
    text ?
      JSON.parse(text) :
      [];


  if (!rows.length) {

    throw new Error(
      "Profile was not found."
    );

  }


  profile =
    rows[0];


  displayProfile();

}


/* =====================================================
   LOAD PROFILE BY USERNAME
   ===================================================== */

async function loadProfileByUsername(username) {

  username =
    String(username || "")
      .replace("@", "")
      .trim();


  if (!username) {

    throw new Error(
      "Username is empty."
    );

  }


  const url =
    SUPABASE_URL +
    "/rest/v1/profiles" +
    "?select=*" +
    "&username=eq." +
    encodeURIComponent(username) +
    "&limit=1";


  const response =
    await fetch(

      url,

      {

        method:
          "GET",

        headers:
          supabaseHeaders()

      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Could not load profile:\n\n" +
      text
    );

  }


  const rows =
    text ?
      JSON.parse(text) :
      [];


  if (!rows.length) {

    throw new Error(

      "Username @" +
      username +
      " was not found."

    );

  }


  profile =
    rows[0];


  displayProfile();

}


/* =====================================================
   DISPLAY PROFILE
   ===================================================== */

function displayProfile() {

  const fullName =
    profile["Full name"] ||
    profile.full_name ||
    profile.name ||
    profile.username ||
    "BERAKAH";


  const username =
    profile.username ||
    "berakah1357";


  const language =
    profile.language ||
    "en";


  const bio =
    profile.bio ||
    "Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


  document.getElementById(
    "profileName"
  ).textContent =
    fullName;


  document.getElementById(
    "profileUsername"
  ).textContent =
    "@" +
    username;


  document.getElementById(
    "profileLanguage"
  ).textContent =
    "🌍 Language: " +
    (
      LANGUAGE_NAMES[
        String(language).toLowerCase()
      ] ||
      String(language).toUpperCase()
    );


  document.getElementById(
    "profileBio"
  ).textContent =
    bio;


  /* AVATAR */

  const avatar =
    document.getElementById(
      "avatar"
    );


  if (profile.avatar_url) {

    avatar.innerHTML =

      `<img
        src="${escapeHTML(profile.avatar_url)}"
        alt="Profile picture"
        onerror="this.parentElement.textContent='${escapeHTML(fullName.charAt(0).toUpperCase())}'"
      >`;

  }
  else {

    avatar.textContent =
      fullName
        .charAt(0)
        .toUpperCase();

  }


  setupEditPermission();

}


/* =====================================================
   OWN PROFILE CHECK
   ===================================================== */

function isOwnProfile() {

  if (
    !currentUser ||
    !profile
  ) {

    return false;

  }


  if (
    profile.user_id &&
    String(profile.user_id)
      .toLowerCase() ===
    String(currentUser.id)
      .toLowerCase()
  ) {

    return true;

  }


  /*
  OLD PROFILE FALLBACK
  */

  if (!profile.user_id) {

    const metadata =
      currentUser.user_metadata ||
      {};


    const loggedUsername =
      String(

        metadata.username ||
        metadata.user_name ||
        metadata.userName ||
        ""

      )
      .replace("@", "")
      .toLowerCase()
      .trim();


    const profileUsername =
      String(
        profile.username ||
        ""
      )
      .replace("@", "")
      .toLowerCase()
      .trim();


    if (
      loggedUsername &&
      profileUsername &&
      loggedUsername ===
      profileUsername
    ) {

      return true;

    }

  }


  return false;

}

/* =====================================================
   SAVE PROFILE
   ===================================================== */

async function saveProfile() {

  if (!isOwnProfile()) {

    return;

  }


  const fullName =
    document.getElementById(
      "editFullName"
    ).value.trim();


  const username =
    document.getElementById(
      "editUsername"
    ).value
      .trim()
      .replaceAll("@", "");


  const language =
    document.getElementById(
      "editLanguage"
    ).value;


  const bio =
    document.getElementById(
      "editBio"
    ).value.trim();


  const status =
    document.getElementById(
      "editStatus"
    );


  const button =
    document.getElementById(
      "saveButton"
    );


  if (!fullName) {

    status.textContent =
      "Full name is required.";

    return;

  }


  if (!username) {

    status.textContent =
      "Username is required.";

    return;

  }


  if (
    !/^[a-zA-Z0-9_.-]+$/.test(username)
  ) {

    status.textContent =
      "Username can only contain letters, numbers, dots, underscores and hyphens.";

    return;

  }


  button.disabled =
    true;

  status.textContent =
    "Saving...";


  try {

    const updateData = {

      "Full name":
        fullName,

      username:
        username,

      language:
        language,

      bio:
        bio

    };


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/profiles" +
        "?id=eq." +
        encodeURIComponent(
          profile.id
        ),

        {

          method:
            "PATCH",

          headers:
            supabaseHeaders({

              "Content-Type":
                "application/json",

              "Prefer":
                "return=representation"

            }),

          body:
            JSON.stringify(
              updateData
            )

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        "Profile update failed:\n\n" +
        text
      );

    }


    const updatedRows =
      text ?
        JSON.parse(text) :
        [];


    if (updatedRows.length) {

      profile =
        updatedRows[0];

    }
    else {

      profile = {
        ...profile,
        ...updateData
      };

    }


    localStorage.setItem(
      "berakah_username",
      username
    );


    displayProfile();


    status.textContent =
      "Profile saved successfully!";


    setTimeout(
      function() {

        document.getElementById(
          "editBox"
        ).style.display =
          "none";

        status.textContent =
          "";

      },
      1200
    );


  }
  catch(error) {

    console.error(
      "PROFILE SAVE ERROR:",
      error
    );


    status.textContent =
      error.message;

  }


  button.disabled =
    false;

}


/* =====================================================
   LOAD POSTS
   ===================================================== */

async function loadPosts() {

  const userId =
    profile.user_id;


  if (!userId) {

    displayPosts([]);

    return;

  }


  const url =
    SUPABASE_URL +
    "/rest/v1/posts" +
    "?select=*" +
    "&user_id=eq." +
    encodeURIComponent(userId) +
    "&order=created_at.desc";


  const response =
    await fetch(

      url,

      {

        method:
          "GET",

        headers:
          supabaseHeaders()

      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    console.warn(
      "Posts could not be loaded:",
      text
    );

    displayPosts([]);

    return;

  }


  const posts =
    text ?
      JSON.parse(text) :
      [];


  displayPosts(posts);

}


/* =====================================================
   DISPLAY POSTS
   ===================================================== */

function displayPosts(posts) {

  const list =
    document.getElementById(
      "postsList"
    );


  list.innerHTML =
    "";


  document.getElementById(
    "postsCount"
  ).textContent =
    posts.length;


  if (!posts.length) {

    list.innerHTML =

      `<div class="empty">

        <div style="font-size:35px;">
          📝
        </div>

        <div style="margin-top:10px;">
          No posts yet.
        </div>

      </div>`;

    return;

  }


  posts.forEach(
    post => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "post";


      let date =
        "";


      if (post.created_at) {

        const d =
          new Date(
            post.created_at
          );


        if (
          !isNaN(
            d.getTime()
          )
        ) {

          date =
            d.toLocaleString();

        }

      }


      let image =
        "";


      if (post.image_url) {

        image =

          `<img
            class="post-image"
            src="${escapeHTML(post.image_url)}"
            alt="Post image"
            loading="lazy"
          >`;

      }


      const likeCount =
        Number(
          post.likes_count ||
          post.like_count ||
          0
        );


      div.innerHTML =

        `<div class="post-date">
          ${escapeHTML(date)}
        </div>

        <div class="post-content">
          ${escapeHTML(
            post.content || ""
          )}
        </div>

        ${image}

        <div class="post-actions">

          <button
            class="like-button"
            data-post-id="${escapeHTML(post.id || "")}">

            ❤️ Like
            <span class="like-count">
              ${likeCount}
            </span>

          </button>

          <button
            class="share-post-button">

            🔗 Share

          </button>

        </div>`;


      const likeButton =
        div.querySelector(
          ".like-button"
        );


      const shareButton =
        div.querySelector(
          ".share-post-button"
        );


      likeButton.addEventListener(
        "click",
        function() {

          toggleLocalLike(
            post,
            likeButton
          );

        }
      );


      shareButton.addEventListener(
        "click",
        function() {

          sharePost(
            post
          );

        }
      );


      list.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   LOCAL LIKE
   ===================================================== */

function toggleLocalLike(
  post,
  button
) {

  const key =
    "berakah_liked_post_" +
    String(
      post.id || ""
    );


  const liked =
    localStorage.getItem(
      key
    ) === "true";


  let count =
    Number(
      post.likes_count ||
      post.like_count ||
      0
    );


  if (liked) {

    count =
      Math.max(
        0,
        count - 1
      );

    localStorage.removeItem(
      key
    );

    button.classList.remove(
      "liked"
    );

  }
  else {

    count += 1;

    localStorage.setItem(
      key,
      "true"
    );

    button.classList.add(
      "liked"
    );

  }


  const countElement =
    button.querySelector(
      ".like-count"
    );


  if (countElement) {

    countElement.textContent =
      count;

  }

}


/* =====================================================
   SHARE POST
   ===================================================== */

async function sharePost(post) {

  const url =
    window.location.origin +
    window.location.pathname +
    "?username=" +
    encodeURIComponent(
      profile.username
    );


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          "BERAKAH Post",

        text:
          post.content ||
          "Check this post on BERAKAH.",

        url:
          url

      });

      return;

    }
    catch(error) {

      console.log(
        "Share cancelled."
      );

    }

  }


  try {

    await navigator.clipboard.writeText(
      url
    );

    showStatus(
      "Post link copied!"
    );

  }
  catch(error) {

    showStatus(
      "Could not copy link."
    );

  }

}

/* =====================================================
   CHECK FOLLOWING
   ===================================================== */

async function checkFollowingStatus() {

  if (
    !currentUser ||
    !profile ||
    !profile.user_id
  ) {

    return;

  }


  if (
    String(currentUser.id)
      .toLowerCase() ===

    String(profile.user_id)
      .toLowerCase()
  ) {

    return;

  }


  const url =
    SUPABASE_URL +
    "/rest/v1/follows" +
    "?select=id" +
    "&follower_id=eq." +
    encodeURIComponent(
      currentUser.id
    ) +
    "&following_id=eq." +
    encodeURIComponent(
      profile.user_id
    );


  try {

    const response =
      await fetch(

        url,

        {

          headers:
            supabaseHeaders()

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      return;

    }


    const rows =
      text ?
        JSON.parse(text) :
        [];


    const button =
      document.getElementById(
        "followButton"
      );


    if (rows.length) {

      button.textContent =
        "✓ Following";

      button.className =
        "action following";

    }
    else {

      button.textContent =
        "Follow";

      button.className =
        "action follow";

    }

  }
  catch(error) {

    console.warn(
      "Could not check follow status:",
      error
    );

  }

}


/* =====================================================
   FOLLOW / UNFOLLOW
   ===================================================== */

async function followUser() {

  if (
    !currentUser ||
    !profile ||
    !profile.user_id
  ) {

    return;

  }


  if (isOwnProfile()) {

    return;

  }


  const button =
    document.getElementById(
      "followButton"
    );


  button.disabled =
    true;


  showStatus(
    "Please wait..."
  );


  try {

    const checkURL =
      SUPABASE_URL +
      "/rest/v1/follows" +
      "?select=id" +
      "&follower_id=eq." +
      encodeURIComponent(
        currentUser.id
      ) +
      "&following_id=eq." +
      encodeURIComponent(
        profile.user_id
      );


    const checkResponse =
      await fetch(

        checkURL,

        {

          headers:
            supabaseHeaders()

        }

      );


    const checkText =
      await checkResponse.text();


    if (!checkResponse.ok) {

      throw new Error(
        checkText
      );

    }


    const existing =
      checkText ?
        JSON.parse(
          checkText
        ) :
        [];


    if (existing.length) {

      const deleteURL =
        SUPABASE_URL +
        "/rest/v1/follows" +
        "?follower_id=eq." +
        encodeURIComponent(
          currentUser.id
        ) +
        "&following_id=eq." +
        encodeURIComponent(
          profile.user_id
        );


      const deleteResponse =
        await fetch(

          deleteURL,

          {

            method:
              "DELETE",

            headers:
              supabaseHeaders()

          }

        );


      if (!deleteResponse.ok) {

        throw new Error(
          "Could not unfollow."
        );

      }


      button.textContent =
        "Follow";

      button.className =
        "action follow";


      showStatus(
        "Unfollowed."
      );

    }
    else {

      const followResponse =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/follows",

          {

            method:
              "POST",

            headers:
              supabaseHeaders({

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=minimal"

              }),

            body:
              JSON.stringify({

                follower_id:
                  currentUser.id,

                following_id:
                  profile.user_id

              })

          }

        );


      if (!followResponse.ok) {

        const text =
          await followResponse.text();


        throw new Error(
          text
        );

      }


      button.textContent =
        "✓ Following";

      button.className =
        "action following";


      showStatus(
        "Following."
      );

    }


    await loadFollowCounts();


  }
  catch(error) {

    console.error(
      "FOLLOW ERROR:",
      error
    );


    showStatus(
      "Follow error: " +
      error.message
    );

  }


  button.disabled =
    false;

}
