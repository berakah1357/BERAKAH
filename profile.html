<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 850px;
  margin: 30px auto;
  padding: 0 15px;
}

.cover {
  height: 180px;
  background: #111827;
  border-radius: 18px 18px 0 0;
}

.profile-card {
  background: white;
  padding: 25px;
  border-radius: 0 0 18px 18px;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  margin-top: -70px;
  border: 5px solid white;
}

h1 {
  margin: 15px 0 5px;
}

.username {
  color: #6b7280;
}

.bio {
  line-height: 1.6;
  margin-top: 20px;
}

.stats {
  display: flex;
  gap: 35px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stat {
  cursor: default;
}

.stats strong {
  display: block;
  font-size: 20px;
}

.buttons {
  margin-top: 25px;
}

.action-button {
  padding: 11px 18px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-right: 8px;
  margin-bottom: 8px;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.action-button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 20px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: none;
}

.post-time {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 10px;
}

.post-content {
  line-height: 1.5;
  white-space: pre-wrap;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 10px;
}

.post-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.post-actions button {
  border: none;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

#loading {
  text-align: center;
  padding: 30px;
}

#error {
  text-align: center;
  color: #b91c1c;
  font-weight: bold;
  padding: 20px;
  white-space: pre-wrap;
}

#status {
  margin-top: 10px;
  font-weight: bold;
}

</style>

</head>


<body>


<header>

<div class="nav">

<div class="logo">
BERAKAH
</div>


<div class="nav-buttons">

<button onclick="location.href='index.html'">
Home
</button>

<button onclick="location.href='feed.html'">
Feed
</button>

<button onclick="location.href='people.html'">
👥 People
</button>

<button onclick="location.href='marketplace.html'">
Market
</button>

<button onclick="location.href='notifications.html'">
🔔
</button>

<button
class="logout"
id="logoutButton">
Logout
</button>

</div>

</div>

</header>



<main>


<div id="loading">
Loading profile...
</div>


<div id="error"></div>


<div
id="profileContent"
style="display:none;"
>


<div class="cover"></div>


<section class="profile-card">


<div class="avatar">
👤
</div>


<h1 id="profileName">
BERAKAH User
</h1>


<div
class="username"
id="profileUsername">
@berakahuser
</div>


<p
class="bio"
id="profileBio">
Welcome to my BERAKAH profile.
Connect, share, build, and grow together.
</p>


<div class="stats">


<div class="stat">

<strong id="followersCount">
0
</strong>

Followers

</div>


<div class="stat">

<strong id="followingCount">
0
</strong>

Following

</div>


<div class="stat">

<strong id="postsCount">
0
</strong>

Posts

</div>


</div>


<div class="buttons">


<button
id="followButton"
class="action-button follow"
style="display:none;">
Follow
</button>


<button
id="editButton"
class="action-button primary"
style="display:none;">
EDIT PROFILE
</button>


<button
class="action-button secondary"
onclick="location.href='messages.html'">
💬 MESSAGES
</button>


<button
class="action-button secondary"
onclick="location.href='notifications.html'">
🔔 NOTIFICATIONS
</button>


<div id="status"></div>


</div>

</section>



<section class="posts">

<h2>Posts</h2>

<div id="postsList"></div>

</section>


</div>

</main>



<script>


/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


const accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;

let profileUserId = null;


/* =================================
   HEADERS
================================= */

function headers(extra) {

  return Object.assign({

    "apikey":
      SUPABASE_ANON_KEY,

    "Authorization":
      "Bearer " + accessToken

  }, extra || {});

}


/* =================================
   SAFE HTML
================================= */

function safe(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =================================
   CURRENT USER
================================= */

async function getCurrentUser() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/user",

      {
        headers:
          headers()
      }

    );


  if (!response.ok) {

    throw new Error(
      "Your login session has expired."
    );

  }


  return await response.json();

}


/* =================================
   GET PROFILE PARAMETER
================================= */

function getProfileParameter() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if (id) {

    return {
      type: "id",
      value: id
    };

  }


  const username =
    params.get("username");


  if (username) {

    return {
      type: "username",
      value: username
    };

  }


  return {
    type: "id",
    value: currentUser.id
  };

}


/* =================================
   FIND PROFILE
================================= */

async function findProfile() {

  const parameter =
    getProfileParameter();


  /* CURRENT USER */

  if (
    parameter.type === "id" &&
    String(parameter.value) ===
    String(currentUser.id)
  ) {

    return {

      id:
        currentUser.id,

      username:
        currentUser.user_metadata?.username ||
        currentUser.email?.split("@")[0] ||
        "BERAKAH User"

    };

  }


  /* FIND BY ID */

  if (
    parameter.type === "id"
  ) {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/posts" +
        "?select=user_id,username" +
        "&user_id=eq." +
        encodeURIComponent(
          parameter.value
        ) +
        "&limit=1",

        {
          headers:
            headers()
        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        text ||
        "Could not find profile."
      );

    }


    if (text.trim()) {

      const rows =
        JSON.parse(text);


      if (rows.length) {

        return {

          id:
            rows[0].user_id,

          username:
            rows[0].username ||
            "BERAKAH User"

        };

      }

    }

  }


  /* FIND BY USERNAME */

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/posts" +
      "?select=user_id,username" +
      "&username=eq." +
      encodeURIComponent(
        parameter.value
      ) +
      "&limit=1",

      {
        headers:
          headers()
      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      text ||
      "Could not find profile."
    );

  }


  if (text.trim()) {

    const rows =
      JSON.parse(text);


    if (rows.length) {

      return {

        id:
          rows[0].user_id,

        username:
          rows[0].username ||
          "BERAKAH User"

      };

    }

  }


  throw new Error(
    "Profile not found."
  );

}


/* =================================
   LOAD POSTS
================================= */

async function loadPosts() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/posts" +
      "?select=*" +
      "&user_id=eq." +
      encodeURIComponent(
        profileUserId
      ) +
      "&order=created_at.desc",

      {
        headers:
          headers()
      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      text ||
      "Could not load posts."
    );

  }


  if (!text.trim()) {

    return [];

  }


  return JSON.parse(text);

}


/* =================================
   LOAD FOLLOW COUNTS
================================= */

async function loadFollowCounts() {

  /* FOLLOWERS */

  const followersResponse =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/follows" +
      "?select=id" +
      "&following_id=eq." +
      encodeURIComponent(
        profileUserId
      ),

      {
        headers:
          headers()
      }

    );


  const followersText =
    await followersResponse.text();


  if (!followersResponse.ok) {

    throw new Error(
      followersText ||
      "Could not load followers."
    );

  }


  let followers = [];


  if (followersText.trim()) {

    followers =
      JSON.parse(
        followersText
      );

  }


  /* FOLLOWING */

  const followingResponse =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/follows" +
      "?select=id" +
      "&follower_id=eq." +
      encodeURIComponent(
        profileUserId
      ),

      {
        headers:
          headers()
      }

    );


  const followingText =
    await followingResponse.text();


  if (!followingResponse.ok) {

    throw new Error(
      followingText ||
      "Could not load following."
    );

  }


  let following = [];


  if (followingText.trim()) {

    following =
      JSON.parse(
        followingText
      );

  }


  document.getElementById(
    "followersCount"
  ).textContent =
    followers.length;


  document.getElementById(
    "followingCount"
  ).textContent =
    following.length;

}


/* =================================
   CHECK FOLLOWING
================================= */

async function checkFollowing() {

  if (
    String(profileUserId) ===
    String(currentUser.id)
  ) {

    return false;

  }


  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/follows" +
      "?select=id" +
      "&follower_id=eq." +
      encodeURIComponent(
        currentUser.id
      ) +
      "&following_id=eq." +
      encodeURIComponent(
        profileUserId
      ),

      {
        headers:
          headers()
      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      text ||
      "Could not check follow status."
    );

  }


  if (!text.trim()) {

    return false;

  }


  const rows =
    JSON.parse(text);


  return rows.length > 0;

}


/* =================================
   DISPLAY POSTS
================================= */

function displayPosts(posts) {

  const postsList =
    document.getElementById(
      "postsList"
    );


  postsList.innerHTML = "";


  document.getElementById(
    "postsCount"
  ).textContent =
    posts.length;


  if (!posts.length) {

    postsList.innerHTML =
      "<div class='post'>No posts yet.</div>";

    return;

  }


  posts.forEach(
    function(post) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "post";


      let formattedDate =
        "Date unavailable";


      if (post.created_at) {

        const date =
          new Date(
            post.created_at
          );


        if (
          !isNaN(
            date.getTime()
          )
        ) {

          formattedDate =
            date.toLocaleString();

        }

      }


      div.innerHTML = `

        <div class="post-time">
          ${safe(formattedDate)}
        </div>

        <div class="post-content">
          ${safe(post.content)}
        </div>

        ${
          post.image_url
          ?
          `
          <img
            class="post-image"
            src="${safe(post.image_url)}"
            alt="Post image"
          >
          `
          :
          ""
        }

        <div class="post-actions">

          <button
            onclick="location.href='feed.html'">
            ❤️ Like
          </button>

        </div>

      `;


      postsList.appendChild(
        div
      );

    }
  );

}


/* =================================
   UPDATE FOLLOW BUTTON
================================= */

async function updateFollowButton() {

  const button =
    document.getElementById(
      "followButton"
    );


  const editButton =
    document.getElementById(
      "editButton"
    );


  if (
    String(profileUserId) ===
    String(currentUser.id)
  ) {

    button.style.display =
      "none";

    editButton.style.display =
      "inline-block";

    return;

  }


  editButton.style.display =
    "none";


  button.style.display =
    "inline-block";


  const following =
    await checkFollowing();


  if (following) {

    button.textContent =
      "Following";

    button.className =
      "action-button following";

  }
  else {

    button.textContent =
      "Follow";

    button.className =
      "action-button follow";

  }

}


/* =================================
   CREATE NOTIFICATION
================================= */

async function createFollowNotification() {

  const actorName =
    currentUser
      .user_metadata
      ?.username ||

    currentUser
      .email
      ?.split("@")[0] ||

    "BERAKAH User";


  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/notifications",

      {

        method: "POST",

        headers: headers({

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"

        }),

        body:
          JSON.stringify({

            user_id:
              profileUserId,

            actor_id:
              currentUser.id,

            type:
              "follow",

            message:
              actorName +
              " follows you",

            read:
              false

          })

      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    console.error(
      "Notification error:",
      text
    );

    return false;

  }


  return true;

}


/* =================================
   FOLLOW / UNFOLLOW
================================= */

async function toggleFollow() {

  const button =
    document.getElementById(
      "followButton"
    );


  const status =
    document.getElementById(
      "status"
    );


  button.disabled =
    true;


  status.textContent =
    "";


  try {


    const following =
      await checkFollowing();


    /* =========================
       UNFOLLOW
    ========================= */

    if (following) {

      const response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/follows" +
          "?follower_id=eq." +
          encodeURIComponent(
            currentUser.id
          ) +
          "&following_id=eq." +
          encodeURIComponent(
            profileUserId
          ),

          {

            method:
              "DELETE",

            headers:
              headers()

          }

        );


      const text =
        await response.text();


      if (!response.ok) {

        throw new Error(
          text ||
          "Could not unfollow."
        );

      }


      status.textContent =
        "Unfollowed successfully.";

    }


    /* =========================
       FOLLOW
    ========================= */

    else {

      const response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/follows",

          {

            method:
              "POST",

            headers:
              headers({

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=minimal"

              }),

            body:
              JSON.stringify({

                follower_id:
                  currentUser.id,

                following_id:
                  profileUserId

              })

          }

        );


      const text =
        await response.text();


      if (!response.ok) {

        throw new Error(
          text ||
          "Could not follow."
        );

      }


      /* CREATE NOTIFICATION */

      const notificationCreated =
        await createFollowNotification();


      if (notificationCreated) {

        status.textContent =
          "Following successfully.";

      }
      else {

        status.textContent =
          "Following successfully. Notification could not be created.";

      }

    }


    await loadFollowCounts();

    await updateFollowButton();

  }


  catch(error) {

    console.error(
      error
    );

    status.textContent =
      error.message;

  }


  button.disabled =
    false;

}


/* =================================
   FOLLOW BUTTON
================================= */

document
.getElementById(
  "followButton"
)
.addEventListener(
  "click",
  toggleFollow
);


/* =================================
   EDIT PROFILE
================================= */

document
.getElementById(
  "editButton"
)
.addEventListener(
  "click",
  function() {

    alert(
      "Profile editing is coming next."
    );

  }
);


/* =================================
   LOGOUT
================================= */

document
.getElementById(
  "logoutButton"
)
.addEventListener(
  "click",
  function() {

    localStorage.removeItem(
      "berakah_access_token"
    );

    localStorage.removeItem(
      "berakah_refresh_token"
    );

    localStorage.removeItem(
      "berakah_user"
    );

    location.href =
      "login.html";

  }
);


/* =================================
   START
================================= */

async function start() {

  try {


    if (!accessToken) {

      location.href =
        "login.html";

      return;

    }


    currentUser =
      await getCurrentUser();


    const profile =
      await findProfile();


    profileUserId =
      profile.id;


    document.getElementById(
      "profileName"
    ).textContent =
      profile.username;


    document.getElementById(
      "profileUsername"
    ).textContent =
      "@" +
      profile.username.toLowerCase();


    document.getElementById(
      "profileBio"
    ).textContent =
      "Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


    const posts =
      await loadPosts();


    displayPosts(
      posts
    );


    await loadFollowCounts();

    await updateFollowButton();


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "profileContent"
    ).style.display =
      "block";


  }

  catch(error) {

    console.error(
      error
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "error"
    ).textContent =
      "Could not load profile.\n\n" +
      error.message;

  }

}


start();

</script>

</body>
</html>
