<title>BERAKAH - Profile</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:14px;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:2px;
}

.nav-links{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.nav-links a,
.nav-links button{
  text-decoration:none;
  border:1px solid #d1d5db;
  background:#fff;
  color:#111827;
  padding:8px 11px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
}

.nav-links .logout{
  background:#111827;
  color:#fff;
}

main{
  max-width:900px;
  margin:25px auto;
  padding:0 15px;
}

.loading,
.error{
  background:#fff;
  border-radius:16px;
  padding:30px;
  text-align:center;
}

.error{
  display:none;
  color:#b91c1c;
  text-align:left;
  white-space:pre-wrap;
}

.profile{
  display:none;
}

.cover{
  height:210px;
  background:linear-gradient(135deg,#111827,#374151);
  border-radius:18px 18px 0 0;
}

.profile-card{
  background:#fff;
  padding:25px;
  border-radius:0 0 18px 18px;
}

.avatar{
  width:120px;
  height:120px;
  margin-top:-70px;
  border-radius:50%;

  border:5px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:46px;
  font-weight:bold;
  overflow:hidden;
}

.avatar img{
  width:100%;

  object-fit:cover;
}

h1{
  margin:14px 0 4px;
}

.username{
  color:#6b7280;
}

.language{
  color:#6b7280;
  margin-top:7px;
}

.bio{
  margin-top:20px;
  line-height:1.6;
  white-space:pre-wrap;
}

.stats{
  display:flex;
  gap:35px;
  margin-top:25px;
  flex-wrap:wrap;
}

.stat{
  cursor:pointer;
  padding:5px;
  border-radius:8px;
}

.stat:hover{

}

.stat strong{
  display:block;
  font-size:22px;
}

.stat-label{

}

}

.action{

  border-radius:8px;
  padding:11px 17px;

  margin-bottom:7px;
  font-weight:bold;
  cursor:pointer;
}

.action:disabled{
  opacity:.6;

}

.primary{
  background:#111827;
  color:#fff;
}

.secondary{
  background:#e5e7eb;

}

.follow{

  color:#fff;
}

.following{
  background:#e5e7eb;

}

.status{

.edit-box{

  margin-top:20px;
  padding:20px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:14px;
}

.edit-box label{
  display:block;
  font-weight:bold;

}

.edit-box input,
.edit-box textarea,

  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;

.edit-box textarea{
  min-height:100px;
  resize:vertical;
}

.save,
.cancel{
  margin-top:15px;
  padding:11px 17px;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.save{
  background:#111827;
  color:#fff;
}

.cancel{
  background:#e5e7eb;
}

.posts{
  margin-top:25px;
  background:#fff;
  padding:25px;
  border-radius:18px;
}

.post{
  padding:18px 0;
  border-bottom:1px solid #e5e7eb;
}

.post:last-child{
  border-bottom:0;
}

.post-date{
  color:#6b7280;
  font-size:12px;
  margin-bottom:9px;
}

.post-content{
  white-space:pre-wrap;
  line-height:1.6;
}

.post-image{
  width:100%;

  object-fit:cover;

  margin-top:12px;
}

.like-button{
  margin-top:12px;
  border:0;
  background:#f3f4f6;
  padding:8px 13px;
  border-radius:8px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:30px 10px;
}


/* =========================================
   FOLLOWERS / FOLLOWING MODAL
========================================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:500;
  padding:20px;
  overflow:auto;

.modal-box{

.modal-content{

}

.person{

.person:last-child{

}

.person-avatar{

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  overflow:hidden;
  flex-shrink:0;
}

.person-avatar img{
  width:100%;

}

.person-info{
  flex:1;

}

.person-name{
  font-weight:bold;
}

.person-username{

}

.view-profile{

  background:#111827;

  border-radius:7px;

.modal-loading{
  text-align:center;

}

.modal-empty{
  text-align:center;
  padding:30px;
  color:#6b7280;
}

.modal-error{

  padding:20px;

}

@media(max-width:650px){

  .nav{
    align-items:flex-start;

  }

  .profile-card{
    padding:20px;
  }

  .modal{
    padding:10px;
  }

  .modal-box{
    margin:20px auto;
  }

}

</style>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   APPLICATION STATE
===================================================== */

let accessToken =
localStorage.getItem("berakah_access_token");

let currentUser = null;

let profile = null;


/* =====================================================
   SUPABASE HEADERS
===================================================== */

function supabaseHeaders(extra = {}){

return {

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer " + accessToken,

...extra

};

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   CLEAR SESSION
===================================================== */

function clearSession(){

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

localStorage.removeItem(
"berakah_username"
);

localStorage.removeItem(
"berakah_auth_user_id"
);

accessToken = null;

}


/* =====================================================
   SESSION EXPIRED
===================================================== */

function sessionExpired(){

clearSession();

window.location.replace(
"login.html"
);

}


/* =====================================================
   URL PARAMETER
===================================================== */

function getURLParameter(name){

return new URLSearchParams(
window.location.search
).get(name);

}


/* =====================================================
   CURRENT USER
===================================================== */

async function getCurrentUser(){

if(!accessToken){

throw new Error("SESSION_EXPIRED");

}


const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method:"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if(!response.ok){

console.error(
"AUTH ERROR:",
text
);

throw new Error(
"SESSION_EXPIRED"
);

}


if(!text){

throw new Error(
"SESSION_EXPIRED"
);

}


try{

return JSON.parse(text);

}
catch(error){

throw new Error(
"SESSION_EXPIRED"
);

}

}


/* =====================================================
   LOAD OWN PROFILE
===================================================== */

async function loadOwnProfile(){

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&limit=1";


const response =
await fetch(

url,

{

method:"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if(
response.status === 401 ||
response.status === 403
){

throw new Error(
"SESSION_EXPIRED"
);

}


if(!response.ok){

throw new Error(
"Could not load your profile."
);

}


const rows =
text ?
JSON.parse(text) :
[];


if(!rows.length){

throw new Error(
"Your BERAKAH profile was not found."
);

}


profile =
rows[0];

}


/* =====================================================
   LOAD PROFILE BY ID
===================================================== */

async function loadProfileById(id){

if(!/^[0-9]+$/.test(id)){

throw new Error(
"Invalid profile ID."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&limit=1";


const response =
await fetch(

url,

{

method:"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if(
response.status === 401 ||
response.status === 403
){

throw new Error(
"SESSION_EXPIRED"
);

}


if(!response.ok){

throw new Error(
"Could not load profile."
);

}


const rows =
text ?
JSON.parse(text) :
[];


if(!rows.length){

throw new Error(
"Profile was not found."
);

}


profile =
rows[0];

}


/* =====================================================
   LOAD PROFILE BY USERNAME
===================================================== */

async function loadProfileByUsername(username){

username =
String(username || "")
.replace(/^@+/,"")
.trim();


if(!username){

throw new Error(
"Username is empty."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&username=eq." +
encodeURIComponent(username) +
"&limit=1";


const response =
await fetch(

url,

{

method:"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if(
response.status === 401 ||
response.status === 403
){

throw new Error(
"SESSION_EXPIRED"
);

}


if(!response.ok){

throw new Error(
"Could not load profile."
);

}


const rows =
text ?
JSON.parse(text) :
[];


if(!rows.length){

throw new Error(
"Username @" +
username +
" was not found."
);

}


profile =
rows[0];

}


/* =====================================================
   PROFILE NAME
===================================================== */

function profileName(){

return (

profile["Full name"] ||

profile.full_name ||

profile.name ||

profile.username ||

"BERAKAH"

);

}


/* =====================================================
   DISPLAY PROFILE
===================================================== */

function displayProfile(){

const fullName =
profileName();

const username =
profile.username ||
"berakah";

const language =
profile.language ||
"—";

const bio =
profile.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


document.getElementById(
"profileName"
).textContent =
fullName;


document.getElementById(
"profileUsername"
).textContent =
"@" + username;


document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
language.toUpperCase();


document.getElementById(
"profileBio"
).textContent =
bio;


/* AVATAR */

const avatar =
document.getElementById("avatar");


if(profile.avatar_url){

avatar.innerHTML =
`<img
src="${escapeHTML(profile.avatar_url)}"
alt="Profile picture">`;

}
else{

avatar.textContent =
String(fullName)
.charAt(0)
.toUpperCase() ||
"👤";

}


/* BUTTON PERMISSION */

setupProfileButtons();

}


/* =====================================================
   OWN PROFILE CHECK
===================================================== */

function isOwnProfile(){

if(!currentUser || !profile){

return false;

}


if(
profile.user_id &&
String(profile.user_id).toLowerCase() ===
String(currentUser.id).toLowerCase()
){

return true;

}


/* FALLBACK */

if(!profile.user_id){

const metadata =
currentUser.user_metadata || {};

const loggedUsername =
String(

metadata.username ||

metadata.user_name ||

metadata.userName ||

localStorage.getItem(
"berakah_username"
) ||

""

)
.replace(/^@+/,"")
.toLowerCase()
.trim();


const thisUsername =
String(
profile.username || ""
)
.replace(/^@+/,"")
.toLowerCase()
.trim();


if(
loggedUsername &&
thisUsername &&
loggedUsername === thisUsername
){

return true;

}

}


return false;

}


/* =====================================================
   BUTTON SETUP
===================================================== */

function setupProfileButtons(){

const editButton =
document.getElementById(
"editButton"
);

const followButton =
document.getElementById(
"followButton"
);


if(isOwnProfile()){

editButton.style.display =
"inline-block";

followButton.style.display =
"none";

}
else{

editButton.style.display =
"none";

followButton.style.display =
"inline-block";

checkFollowingStatus();

}

}


/* =====================================================
   EDIT PROFILE
===================================================== */

function openEdit(){

if(!isOwnProfile()){

return;

}


document.getElementById(
"editFullName"
).value =

profile["Full name"] ||

profile.full_name ||

profile.name ||

"";


document.getElementById(
"editUsername"
).value =
profile.username || "";


document.getElementById(
"editLanguage"
).value =
profile.language || "en";


document.getElementById(
"editBio"
).value =
profile.bio || "";


document.getElementById(
"editStatus"
).textContent =
"";


document.getElementById(
"editBox"
).style.display =
"block";

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit(){

document.getElementById(
"editBox"
).style.display =
"none";

}


/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile(){

if(!isOwnProfile()){

return;

}


const fullName =
document.getElementById(
"editFullName"
).value.trim();


const username =
document.getElementById(
"editUsername"
).value
.trim()
.replace(/^@+/,"");


const language =
document.getElementById(
"editLanguage"
).value;


const bio =
document.getElementById(
"editBio"
).value.trim();


const status =
document.getElementById(
"editStatus"
);

const button =
document.getElementById(
"saveButton"
);


if(!fullName){

status.textContent =
"Full name is required.";

return;

}


if(!username){

status.textContent =
"Username is required.";

return;

}


button.disabled =
true;

status.textContent =
"Saving...";


try{

const updateData = {

"Full name":
fullName,

username:
username,

language:
language,

bio:
bio

};


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(
profile.id
),

{

method:"PATCH",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=representation"

}),

body:
JSON.stringify(
updateData
)

}

);


const text =
await response.text();


if(
response.status === 401 ||
response.status === 403
){

throw new Error(
"SESSION_EXPIRED"
);

}


if(!response.ok){

throw new Error(
text ||
"Profile update failed."
);

}


const rows =
text ?
JSON.parse(text) :
[];


if(rows.length){

profile =
rows[0];

}


localStorage.setItem(
"berakah_username",
username
);


displayProfile();

status.textContent =
"Profile saved successfully!";


setTimeout(
function(){

document.getElementById(
"editBox"
).style.display =
"none";

status.textContent =
"";

},
1200
);

}
catch(error){

if(
error.message ===
"SESSION_EXPIRED"
){

sessionExpired();

return;

}

console.error(
"SAVE PROFILE ERROR:",
error
);

status.textContent =
error.message;

}
finally{

button.disabled =
false;

}

}


/* =====================================================
   LOAD POSTS
===================================================== */

async function loadPosts(){

if(!profile.user_id){

displayPosts([]);

return;

}


const url =
SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(
profile.user_id
) +
"&order=created_at.desc";


const response =
await fetch(

url,

{

method:"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if(
response.status === 401 ||
response.status === 403
){

throw new Error(
"SESSION_EXPIRED"
);

}


if(!response.ok){

console.warn(
"POSTS ERROR:",
text
);

displayPosts([]);

return;

}


const posts =
text ?
JSON.parse(text) :
[];


displayPosts(posts);

}


/* =====================================================
   DISPLAY POSTS
===================================================== */

function displayPosts(posts){

const list =
document.getElementById(
"postsList"
);


list.innerHTML = "";


document.getElementById(
"postsCount"
).textContent =
posts.length;


if(!posts.length){

list.innerHTML =
`<div class="empty">
No posts yet.
</div>`;

return;

}


posts.forEach(
post => {

const div =
document.createElement("div");

div.className =
"post";


let date = "";


if(post.created_at){

const d =
new Date(
post.created_at
);

if(!isNaN(d.getTime())){

date =
d.toLocaleString();

}

}


let image = "";


if(post.image_url){

image =
`<img
class="post-image"
src="${escapeHTML(post.image_url)}"
alt="Post image">`;

}


div.innerHTML = `

<div class="post-date">
${escapeHTML(date)}
</div>

<div class="post-content">
${escapeHTML(
post.content || ""
)}
</div>

${image}

<button
class="like-button"
type="button">
❤️ Like
</button>

`;


list.appendChild(div);

});

}

async function followUser(){

){

}


const button =
document.getElementById(
"followButton"
);

const status =
document.getElementById(
"status"
);


button.disabled =
true;


try{

const checkURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +

profile.user_id
);

await fetch(

{

headers:
supabaseHeaders()

}

);

await checkResponse.text();

checkResponse.status === 401 ||
checkResponse.status === 403
){

throw new Error(
"SESSION_EXPIRED"
);

}


if(!checkResponse.ok){

throw new Error(
"Could not check follow status."
);

}


const existing =
checkText ?
JSON.parse(checkText) :
[];


if(existing.length){

/* UNFOLLOW */

SUPABASE_URL +

currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);

await fetch(

deleteURL,

{

method:"DELETE",

headers:
supabaseHeaders()

}

);


if(
response.status === 401 ||

){

);

}


if(!response.ok){

);

}


button.textContent =
"Follow";

button.className =
"action follow";

status.textContent =
"Unfollowed.";

}
else{

/* FOLLOW */

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method:"POST",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profile.user_id

})

}

);

await response.text();


if(
response.status === 401 ||

}


/* =====================================================
   LOAD PEOPLE
===================================================== */

async function loadPeople(type){

if(!profile || !profile.user_id){

return;

}


const modal =
document.getElementById(
"peopleModal"
);

const title =
document.getElementById(
"modalTitle"
);

const content =
document.getElementById(
"modalContent"
);


modal.style.display =
"block";


content.innerHTML =
`<div class="modal-loading">
Loading ${type}...
</div>`;


title.textContent =
type === "followers"
? "Followers"
: "Following";


let url;


if(type === "followers"){

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=follower_id" +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);

}
else{

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=following_id" +
"&follower_id=eq." +
encodeURIComponent(
profile.user_id
);

}


try{

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if(
response.status === 401 ||
response.status === 403
){

throw new Error(
"SESSION_EXPIRED"
);

}


if(!response.ok){

throw new Error(
"Could not load " +
type +
"."
);

}


const rows =
text ?
JSON.parse(text) :
[];


if(!rows.length){

content.innerHTML =
`<div class="modal-empty">
No ${type} yet.
</div>`;

return;

}


const ids =
rows.map(
row =>
type === "followers"
? row.follower_id
: row.following_id
);


/*
Load the profiles belonging
to those Auth UUIDs.
*/

const profiles = [];


for(
const userId of ids
){

const profileURL =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(
userId
) +
"&limit=1";


const profileResponse =
await fetch(

profileURL,

{

headers:
supabaseHeaders()

}

);


const profileText =
await profileResponse.text();


if(
profileResponse.status === 401 ||
profileResponse.status === 403
){

throw new Error(
"SESSION_EXPIRED"
);

}


if(profileResponse.ok){

const profileRows =
profileText ?
JSON.parse(profileText) :
[];


if(profileRows.length){

profiles.push(
profileRows[0]
);

}

}

}


if(!profiles.length){

content.innerHTML =
`<div class="modal-empty">
No profiles found.
</div>`;

return;

}


content.innerHTML = "";


profiles.forEach(
person => {

const name =

person["Full name"] ||

person.full_name ||

person.name ||

person.username ||

"BERAKAH";


const username =
person.username ||
"berakah";


const row =
document.createElement(
"div"
);

row.className =
"person";


let avatarHTML;


if(person.avatar_url){

avatarHTML =
`<img
src="${escapeHTML(person.avatar_url)}"
alt="Profile picture">`;

}
else{

avatarHTML =
escapeHTML(
String(name)
.charAt(0)
.toUpperCase()
);

}


row.innerHTML = `

<div class="person-avatar">
${avatarHTML}
</div>

<div class="person-info">

<div class="person-name">
${escapeHTML(name)}
</div>

<div class="person-username">
@${escapeHTML(username)}
</div>

</div>

<button
class="view-profile"
type="button">
View
</button>

`;


row
.querySelector(".view-profile")
.addEventListener(
"click",
function(){

window.location.href =
"profile.html?username=" +
encodeURIComponent(
username
);

}
);


content.appendChild(row);

});

}
catch(error){

if(
error.message ===
"SESSION_EXPIRED"
){

sessionExpired();

return;

}


console.error(
"PEOPLE LIST ERROR:",
error
);

content.innerHTML =
`<div class="modal-error">
${escapeHTML(
error.message
)}
</div>`;

}

}

/* =====================================================

===================================================== */

async function start(){

try{

/* TOKEN */

if(!accessToken){

window.location.replace(
"login.html"
);

return;

}


/* AUTH */

currentUser =
await getCurrentUser();


/* PROFILE SELECTION */

const requestedId =
getURLParameter("id");

const requestedUsername =
getURLParameter("username");


if(requestedId){

await loadProfileById(
requestedId
);

}
else if(requestedUsername){

await loadProfileByUsername(
requestedUsername
);

}
else{

await loadOwnProfile();

}


/* DISPLAY */

displayProfile();


/* POSTS */

await loadPosts();


/* FOLLOW COUNTS */

await loadFollowCounts();


/* SHOW PAGE */

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"block";

}
catch(error){

console.error(
"BERAKAH PROFILE ERROR:",
error
);


if(
error.message ===
"SESSION_EXPIRED"
){

sessionExpired();

return;

}


document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"profile"
).style.display =
"none";


const errorBox =
document.getElementById(
"error"
);


errorBox.style.display =
"block";


errorBox.textContent =
error.message ||
"Could not load profile.";

}

}


/* =====================================================
   RUN
===================================================== */

start();
