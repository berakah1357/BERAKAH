<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


const accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;

let profileUserId = null;


/* =========================================
   HEADERS
========================================= */

function headers(extra) {

  return Object.assign(

    {
      "apikey":
        SUPABASE_ANON_KEY,

      "Authorization":
        "Bearer " + accessToken

    },

    extra || {}

  );

}


/* =========================================
   SAFE TEXT
========================================= */

function safe(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser() {

  if (!accessToken) {

    throw new Error(
      "You are not logged in. Please log in again."
    );

  }


  const response =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/user",

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Login session error:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    throw new Error(
      "Supabase returned no user."
    );

  }


  return JSON.parse(text);

}


/* =========================================
   GET PROFILE ID FROM URL
========================================= */

function getProfileId() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  return params.get("id");

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile() {

  const profileId =
    getProfileId();


  /*
    If there is no ?id= in the URL,
    show the currently logged-in user.
  */

  if (!profileId) {

    profileUserId =
      currentUser.id;

    return {

      id:
        currentUser.id,

      username:
        currentUser.user_metadata?.username ||
        currentUser.email?.split("@")[0] ||
        "BERAKAH User",

      bio:
        currentUser.user_metadata?.bio ||
        "Welcome to my BERAKAH profile."

    };

  }


  /*
    IMPORTANT:

    People page sends:

    profile.html?id=1
    profile.html?id=2
    profile.html?id=3

    So we search profiles by ID.
  */

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/profiles" +
      "?select=*" +
      "&id=eq." +
      encodeURIComponent(profileId) +
      "&limit=1",

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  console.log(
    "PROFILE RESPONSE:",
    text
  );


  if (!response.ok) {

    throw new Error(
      "Could not load profile:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    throw new Error(
      "Profile not found."
    );

  }


  const rows =
    JSON.parse(text);


  if (!rows.length) {

    throw new Error(
      "Profile not found."
    );

  }


  const profile =
    rows[0];


  profileUserId =
    profile.id;


  return profile;

}


/* =========================================
   LOAD POSTS
========================================= */

async function loadPosts() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/posts" +
      "?select=*" +
      "&user_id=eq." +
      encodeURIComponent(
        profileUserId
      ) +
      "&order=created_at.desc",

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Could not load posts:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    return [];

  }


  return JSON.parse(text);

}


/* =========================================
   LOAD FOLLOWERS
========================================= */

async function loadFollowers() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/follows" +
      "?select=id" +
      "&following_id=eq." +
      encodeURIComponent(
        profileUserId
      ),

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Could not load followers:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    return [];

  }


  return JSON.parse(text);

}


/* =========================================
   LOAD FOLLOWING
========================================= */

async function loadFollowing() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/follows" +
      "?select=id" +
      "&follower_id=eq." +
      encodeURIComponent(
        profileUserId
      ),

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Could not load following:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    return [];

  }


  return JSON.parse(text);

}


/* =========================================
   LOAD FOLLOW COUNTS
========================================= */

async function loadFollowCounts() {

  const followers =
    await loadFollowers();


  const following =
    await loadFollowing();


  document.getElementById(
    "followersCount"
  ).textContent =
    followers.length;


  document.getElementById(
    "followingCount"
  ).textContent =
    following.length;

}


/* =========================================
   CHECK FOLLOWING
========================================= */

async function checkFollowing() {

  if (
    String(profileUserId) ===
    String(currentUser.id)
  ) {

    return false;

  }


  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/follows" +
      "?select=id" +
      "&follower_id=eq." +
      encodeURIComponent(
        currentUser.id
      ) +
      "&following_id=eq." +
      encodeURIComponent(
        profileUserId
      ) +
      "&limit=1",

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Could not check follow status:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    return false;

  }


  const rows =
    JSON.parse(text);


  return rows.length > 0;

}


/* =========================================
   DISPLAY PROFILE
========================================= */

function displayProfile(profile) {

  const username =
    profile.username ||
    "BERAKAH User";


  document.getElementById(
    "profileName"
  ).textContent =
    username;


  document.getElementById(
    "profileUsername"
  ).textContent =
    "@" +
    username;


  document.getElementById(
    "profileBio"
  ).textContent =
    profile.bio ||
    "Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


  document.getElementById(
    "profileAvatar"
  ).textContent =
    username
      .charAt(0)
      .toUpperCase();

}

   DISPLAY POSTS
========================================= */

function displayPosts(posts) {

  const postsList =
    document.getElementById(
      "postsList"
    );


  postsList.innerHTML =
    "";


  document.getElementById(
    "postsCount"
  ).textContent =
    posts
