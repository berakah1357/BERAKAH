<!DOCTYPE html>

<head>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 2px;
}

.nav-links {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-links a,
.nav-links button {
  text-decoration: none;
  border: 1px solid #d1d5db;
  background: white;

  font-weight: 600;

}

  color: white;
}

main {

  margin: 25px auto;
  padding: 0 15px;
}

.loading,
.error {
  background: white;
  border-radius: 16px;
  padding: 30px;
  text-align: center;
}

.error {
  display: none;
  color: #b91c1c;

  white-space: pre-wrap;
}

.profile {
  display: none;
}

  height: 210px;
  background: linear-gradient(135deg, #111827, #374151);

.profile-card {
  background: white;
  padding: 25px;

}

.avatar img {

  height: 100%;
  object-fit: cover;
}

h1 {

}

.username {
  color: #6b7280;
}

.language {
  color: #6b7280;
  margin-top: 7px;
}

.bio {
  margin-top: 20px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.stats {
  display: flex;
  gap: 35px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stat {
  cursor: pointer;
}

.stat strong {
  display: block;
  font-size: 22px;
}

.stat-label {
  color: #374151;
}

.actions {
  margin-top: 25px;
}

.action {
  border: 0;
  border-radius: 8px;
  padding: 11px 17px;
  margin-right: 7px;
  margin-bottom: 7px;
  font-weight: bold;
  cursor: pointer;
}

.action:disabled {
  opacity: 0.6;
  cursor: wait;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.status {
  margin-top: 12px;
  font-weight: bold;
}

.edit-box {
  display: none;
  margin-top: 20px;
  padding: 20px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
}

.edit-box label {
  display: block;
  font-weight: bold;
  margin: 14px 0 6px;
}

.edit-box input,
.edit-box textarea,
.edit-box select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
}

.edit-box textarea {
  min-height: 100px;
  resize: vertical;
}

.save,
.cancel {
  margin-top: 15px;
  padding: 11px 17px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.save {
  background: #111827;
  color: white;
}

.cancel {
  background: #e5e7eb;
  color: #111827;
}

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 18px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: 0;
}

.post-date {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 9px;
}

.post-content {
  white-space: pre-wrap;
  line-height: 1.6;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 12px;
}

.like-button {
  margin-top: 12px;
  border: 0;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}

@media (max-width: 650px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .nav-links {
    width: 100%;
  }

  .cover {
    height: 160px;
  }

  .profile-card {
    padding: 20px;
  }

}

</style>

<script>

/* =====================================================
   BERAKAH SUPABASE CONFIGURATION
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
   ===================================================== */

let accessToken =
localStorage.getItem(
"berakah_access_token"
);

let currentUser = null;

let profile = null;


/* =====================================================
   SUPABASE HEADERS
   ===================================================== */

function supabaseHeaders(extra = {}) {

const headers = {

"apikey": SUPABASE_KEY,

"Authorization":
"Bearer " + accessToken

};

return {
...headers,
...extra
};

}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


/* =====================================================
   SHOW ERROR
   ===================================================== */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"none";

const error =
document.getElementById(
"error"
);

error.style.display =
"block";

error.textContent =
message;

}


/* =====================================================
   CLEAR BAD SESSION
   ===================================================== */

function clearSession() {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

localStorage.removeItem(
"berakah_username"
);

localStorage.removeItem(
"berakah_auth_user_id"
);

accessToken = null;

}


/* =====================================================
   GET URL PARAMETER
   ===================================================== */

function getURLParameter(name) {

const params =
new URLSearchParams(
window.location.search
);

return params.get(name);

}


/* =====================================================
   VERIFY SUPABASE SESSION
   ===================================================== */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"NO_SESSION"
);

}

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

console.error(
"SUPABASE SESSION ERROR:",
text
);

if (
response.status === 401 ||
response.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}

throw new Error(
"Could not verify login."
);

}


if (!text) {

throw new Error(
"SESSION_EXPIRED"
);

}


try {

return JSON.parse(text);

}
catch(error) {

throw new Error(
"SESSION_EXPIRED"
);

}

}


/* =====================================================
   LOAD OWN PROFILE
   ===================================================== */

async function loadOwnProfile() {

const userId =
currentUser.id;


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

if (
response.status === 401 ||
response.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}

throw new Error(
"Could not load your profile."
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Your BERAKAH profile was not found.\n\n" +
"Your account is logged in, but there is no profile row connected to this Auth account."
);

}


profile =
rows[0];

}


/* =====================================================
   LOAD PROFILE BY ID
   ===================================================== */

async function loadProfileById(id) {

if (!/^[0-9]+$/.test(id)) {

throw new Error(
"Invalid profile ID."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

if (
response.status === 401 ||
response.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}

throw new Error(
"Could not load profile."
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Profile was not found."
);

}


profile =
rows[0];

}


/* =====================================================
   LOAD PROFILE BY USERNAME
   ===================================================== */

async function loadProfileByUsername(username) {

username =
String(username || "")
replaceAtSymbol(username);


if (!username) {

throw new Error(
"Username is empty."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&username=eq." +
encodeURIComponent(username) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

if (
response.status === 401 ||
response.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}

throw new Error(
"Could not load profile."
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Username @" +
username +
" was not found."
);

}


profile =
rows[0];

}


/* =====================================================
   REMOVE @ FROM USERNAME
   ===================================================== */

function replaceAtSymbol(username) {

return String(username || "")
.replace(/^@+/, "")
.trim();

}


/* =====================================================
   PROFILE NAME
   ===================================================== */

function getProfileName() {

return (
profile["Full name"] ||
profile.full_name ||
profile.name ||
profile.username ||
"BERAKAH"
);

}


/* =====================================================
   DISPLAY PROFILE
   ===================================================== */

function displayProfile() {

const fullName =
getProfileName();


const username =
profile.username ||
"berakah";


const language =
profile.language ||
"—";


const bio =
profile.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


document.getElementById(
"profileName"
).textContent =
fullName;


document.getElementById(
"profileUsername"
).textContent =
"@" +
username;


document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
language.toUpperCase();


document.getElementById(
"profileBio"
).textContent =
bio;


/* =====================================================
   AVATAR
   ===================================================== */

const avatar =
document.getElementById(
"avatar"
);


if (profile.avatar_url) {

avatar.innerHTML =
`<img
src="${escapeHTML(profile.avatar_url)}"
alt="Profile picture">`;

}
else {

avatar.textContent =
String(fullName)
.charAt(0)
.toUpperCase() ||
"👤";

}


/* =====================================================
   EDIT / FOLLOW
   ===================================================== */

setupEditPermission();

}


/* =====================================================
   CHECK OWN PROFILE
   ===================================================== */

function isOwnProfile() {

if (!currentUser || !profile) {

return false;

}


if (
profile.user_id &&
String(profile.user_id).toLowerCase() ===
String(currentUser.id).toLowerCase()
) {

return true;

}


/* OLD PROFILE FALLBACK */

if (!profile.user_id) {

const metadata =
currentUser.user_metadata || {};


const loggedUsername =
String(
metadata.username ||
metadata.user_name ||
metadata.userName ||
localStorage.getItem(
"berakah_username"
) ||
""
)
.replace(/^@+/, "")
.toLowerCase()
.trim();


const profileUsername =
String(
profile.username ||
""
)
.replace(/^@+/, "")
.toLowerCase()
.trim();


if (
loggedUsername &&
profileUsername &&
loggedUsername === profileUsername
) {

return true;

}

}


return false;

}


/* =====================================================
   SETUP EDIT / FOLLOW
   ===================================================== */

function setupEditPermission() {

const editButton =
document.getElementById(
"editButton"
);

const followButton =
document.getElementById(
"followButton"
);


if (isOwnProfile()) {

editButton.style.display =
"inline-block";

followButton.style.display =
"none";

}
else {

editButton.style.display =
"none";

followButton.style.display =
"inline-block";

checkFollowingStatus();

}

}


/* =====================================================
   OPEN EDIT
   ===================================================== */

function openEdit() {

if (!isOwnProfile()) {

return;

}


document.getElementById(
"editFullName"
).value =
profile["Full name"] ||
profile.full_name ||
profile.name ||
"";


document.getElementById(
"editUsername"
).value =
profile.username ||
"";


document.getElementById(
"editLanguage"
).value =
profile.language ||
"ht";


document.getElementById(
"editBio"
).value =
profile.bio ||
"";


document.getElementById(
"editStatus"
).textContent =
"";


document.getElementById(
"editBox"
).style.display =
"block";

}


/* =====================================================
   CANCEL EDIT
   ===================================================== */

function cancelEdit() {

document.getElementById(
"editBox"
).style.display =
"none";

}


/* =====================================================
   SAVE PROFILE
   ===================================================== */

async function saveProfile() {

if (!isOwnProfile()) {

return;

}


const fullName =
document.getElementById(
"editFullName"
).value.trim();


const username =
replaceAtSymbol(
document.getElementById(
"editUsername"
).value
);


const language =
document.getElementById(
"editLanguage"
).value;


const bio =
document.getElementById(
"editBio"
).value.trim();


const status =
document.getElementById(
"editStatus"
);


const button =
document.getElementById(
"saveButton"
);


if (!fullName) {

status.textContent =
"Full name is required.";

return;

}


if (!username) {

status.textContent =
"Username is required.";

return;

}


button.disabled =
true;

status.textContent =
"Saving...";


try {

const updateData = {

"Full name":
fullName,

username:
username,

language:
language,

bio:
bio

};


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(
profile.id
),

{

method: "PATCH",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=representation"

}),

body:
JSON.stringify(
updateData
)

}

);


const text =
await response.text();


if (!response.ok) {

if (
response.status === 401 ||
response.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}

throw new Error(
"Profile update failed:\n" +
text
);

}


const updatedRows =
text ?
JSON.parse(text) :
[];


if (updatedRows.length) {

profile =
updatedRows[0];

}


localStorage.setItem(
"berakah_username",
username
);


displayProfile();


status.textContent =
"Profile saved successfully!";


setTimeout(
function() {

document.getElementById(
"editBox"
).style.display =
"none";

status.textContent =
"";

},
1200
);

}
catch(error) {

console.error(
"PROFILE SAVE ERROR:",
error
);

if (
error.message ===
"SESSION_EXPIRED"
) {

clearSession();

window.location.href =
"login.html";

return;

}

status.textContent =
error.message;

}
finally {

button.disabled =
false;

}

}


/* =====================================================
   LOAD POSTS
   ===================================================== */

async function loadPosts() {

const userId =
profile.user_id;


if (!userId) {

displayPosts([]);

return;

}


const url =
SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&order=created_at.desc";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

if (
response.status === 401 ||
response.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}

console.warn(
"Posts could not be loaded:",
text
);

displayPosts([]);

return;

}


const posts =
text ?
JSON.parse(text) :
[];


displayPosts(posts);

}


/* =====================================================
   DISPLAY POSTS
   ===================================================== */

function displayPosts(posts) {

const list =
document.getElementById(
"postsList"
);


list.innerHTML =
"";


document.getElementById(
"postsCount"
).textContent =
posts.length;


if (!posts.length) {

list.innerHTML =
`<div class="empty">
No posts yet.
</div>`;

return;

}


posts.forEach(
post => {

const div =
document.createElement(
"div"
);


div.className =
"post";


let date =
"";


if (post.created_at) {

const d =
new Date(
post.created_at
);

if (!isNaN(
d.getTime()
)) {

date =
d.toLocaleString();

}

}


let image =
"";


if (post.image_url) {

image =
`<img
class="post-image"
src="${escapeHTML(post.image_url)}"
alt="Post image">`;

}


div.innerHTML = `

<div class="post-date">
${escapeHTML(date)}
</div>

<div class="post-content">
${escapeHTML(post.content || "")}
</div>

${image}

<button
class="like-button"
type="button">

❤️ Like

</button>

`;


list.appendChild(div);

});

}


/* =====================================================
   LOAD FOLLOW COUNTS
   ===================================================== */

async function loadFollowCounts() {

if (!profile ||
!profile.user_id) {

return;

}


/* =====================================================
   FOLLOWERS
   ===================================================== */

const followersURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const followersResponse =
await fetch(

followersURL,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const followersText =
await followersResponse.text();


if (
followersResponse.status === 401 ||
followersResponse.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}


if (followersResponse.ok) {

const followers =
followersText ?
JSON.parse(followersText) :
[];


document.getElementById(
"followersCount"
).textContent =
followers.length;

}


/* =====================================================
   FOLLOWING
   ===================================================== */

const followingURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
profile.user_id
);


const followingResponse =
await fetch(

followingURL,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const followingText =
await followingResponse.text();


if (
followingResponse.status === 401 ||
followingResponse.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}


if (followingResponse.ok) {

const following =
followingText ?
JSON.parse(followingText) :
[];


document.getElementById(
"followingCount"
).textContent =
following.length;

}

}


/* =====================================================
   CHECK FOLLOWING STATUS
   ===================================================== */

async function checkFollowingStatus() {

if (
!currentUser ||
!profile ||
!profile.user_id
) {

return;

}


if (
String(currentUser.id).toLowerCase() ===
String(profile.user_id).toLowerCase()
) {

return;

}


const url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


try {

const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (
response.status === 401 ||
response.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}


if (!response.ok) {

return;

}


const rows =
text ?
JSON.parse(text) :
[];


const button =
document.getElementById(
"followButton"
);


if (rows.length) {

button.textContent =
"Following";

button.className =
"action following";

}
else {

button.textContent =
"Follow";

button.className =
"action follow";

}

}
catch(error) {

if (
error.message ===
"SESSION_EXPIRED"
) {

clearSession();

window.location.href =
"login.html";

}

console.warn(
"FOLLOW STATUS ERROR:",
error
);

}

}


/* =====================================================
   FOLLOW / UNFOLLOW
   ===================================================== */

async function followUser() {

if (
!currentUser ||
!profile ||
!profile.user_id
) {

return;

}


if (isOwnProfile()) {

return;

}


const button =
document.getElementById(
"followButton"
);


const status =
document.getElementById(
"status"
);


button.disabled =
true;


try {

const checkURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const checkResponse =
await fetch(

checkURL,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const checkText =
await checkResponse.text();


if (
checkResponse.status === 401 ||
checkResponse.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}


if (!checkResponse.ok) {

throw new Error(
"Could not check follow status."
);

}


const existing =
checkText ?
JSON.parse(checkText) :
[];


if (existing.length) {

/* =================================================
   UNFOLLOW
   ================================================= */

const deleteURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const deleteResponse =
await fetch(

deleteURL,

{

method: "DELETE",

headers:
supabaseHeaders()

}

);


const deleteText =
await deleteResponse.text();


if (
deleteResponse.status === 401 ||
deleteResponse.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}


if (!deleteResponse.ok) {

throw new Error(
"Could not unfollow."
);

}


button.textContent =
"Follow";

button.className =
"action follow";

status.textContent =
"Unfollowed.";

}
else {

/* =================================================
   FOLLOW
   ================================================= */

const followResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method: "POST",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profile.user_id

})

}

);


const followText =
await followResponse.text();


if (
followResponse.status === 401 ||
followResponse.status === 403
) {

throw new Error(
"SESSION_EXPIRED"
);

}


if (!followResponse.ok) {

throw new Error(
"Could not follow this user:\n" +
followText
);

}


button.textContent =
"Following";

button.className =
"action following";

status.textContent =
"Following.";

}


await loadFollowCounts();

}
catch(error) {

console.error(
"FOLLOW ERROR:",
error
);

if (
error.message ===
"SESSION_EXPIRED"
) {

clearSession();

window.location.href =
"login.html";

return;

}

status.textContent =
"Follow error: " +
error.message;

}
finally {

button.disabled =
false;

}

}

   LOGOUT
   ===================================================== */

document.getElementById(
"logoutButton"
).addEventListener(

clearSession();

);

);


/* =====================================================
   START APPLICATION
   ===================================================== */

async function start() {

try {

/* =================================================
   1. CHECK TOKEN
   ================================================= */

if (!accessToken) {

window.location.href =
"login.html";

return;

}


/* =================================================
   2. VERIFY AUTH SESSION
   ================================================= */

try {

currentUser =
await getCurrentUser();

}
catch(error) {

if (
error.message ===
"SESSION_EXPIRED" ||
error.message ===
"NO_SESSION"
) {

clearSession();

window.location.href =
"login.html";

return;

}

throw error;

}


/* =================================================
   3. CHECK REQUESTED PROFILE
   ================================================= */

const requestedId =
getURLParameter("id");

const requestedUsername =
getURLParameter("username");


if (requestedId) {

await loadProfileById(
requestedId
);

}
else if (requestedUsername) {

await loadProfileByUsername(
requestedUsername
);

}
else {

await loadOwnProfile();

}


/* =================================================
   4. DISPLAY PROFILE
   ================================================= */

displayProfile();


/* =================================================
   5. LOAD POSTS
   ================================================= */

await loadPosts();


/* =================================================
   6. LOAD FOLLOW COUNTS
   ================================================= */

await loadFollowCounts();


/* =================================================
   7. SHOW PAGE
   ================================================= */

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"block";

}
catch(error) {

console.error(
"BERAKAH PROFILE ERROR:",
error
);


if (
error.message ===
"SESSION_EXPIRED"
) {

clearSession();

window.location.href =
"login.html";

return;

}


showError(
error.message ||
"Something went wrong while loading your profile."
);

}

}


/* =====================================================
   RUN
   ===================================================== */

start();

</script>
