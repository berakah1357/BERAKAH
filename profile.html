<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons button,
.nav-buttons a {
  border: 1px solid #d1d5db;
  background: white;
  color: #111827;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
  text-decoration: none;
  font-weight: bold;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 850px;
  margin: 30px auto;
  padding: 0 15px;
}

#loading {
  background: white;
  padding: 30px;
  border-radius: 18px;
  text-align: center;
  font-weight: bold;
}

#error {
  display: none;
  background: white;
  color: #b91c1c;
  padding: 25px;
  border-radius: 18px;
  white-space: pre-wrap;
  margin-bottom: 20px;
}

.profile {
  display: none;
}

.cover {
  height: 180px;
  background: #111827;
  border-radius: 18px 18px 0 0;
}

.profile-card {
  background: white;
  padding: 25px;
  border-radius: 0 0 18px 18px;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  font-weight: bold;
  margin-top: -70px;
  border: 5px solid white;
}

h1 {
  margin: 15px 0 5px;
}

.username {
  color: #6b7280;
  font-size: 16px;
}

.bio {
  line-height: 1.6;
  margin-top: 20px;
}

.stats {
  display: flex;
  gap: 35px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stat strong {
  display: block;
  font-size: 20px;
}

.buttons {
  margin-top: 25px;
}

.action-button {
  padding: 11px 18px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-right: 8px;
  margin-bottom: 8px;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.action-button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#status {
  margin-top: 10px;
  font-weight: bold;
  min-height: 20px;
}

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 20px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: none;
}

.post-time {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 10px;
}

.post-content {
  line-height: 1.5;
  white-space: pre-wrap;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 10px;
}

.post-actions {
  margin-top: 12px;
}

.post-actions button {
  border: none;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}

@media (max-width: 600px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }
