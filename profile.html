/* =========================
   HEADERS
========================= */

function headers(extra) {

  return Object.assign({

    "apikey": SUPABASE_ANON_KEY,

    "Authorization":
      "Bearer " + accessToken

  }, extra || {});

}


/* =========================
   SAFE HTML
========================= */

function safe(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================
   CURRENT USER
========================= */

async function getCurrentUser() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/user",

      {
        headers:
          headers()
      }

    );


  if (!response.ok) {

    throw new Error(
      "Your login session has expired."
    );

  }


  return await response.json();

}


/* =========================

  }

}
