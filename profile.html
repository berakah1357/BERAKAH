<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


const accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;

let profileUserId = null;

let profileData = null;


/* =================================
   HEADERS
================================= */

function headers(extra) {

  return Object.assign({

    "apikey":
      SUPABASE_ANON_KEY,

    "Authorization":
      "Bearer " + accessToken

  }, extra || {});

}


/* =================================
   SAFE HTML
================================= */

function safe(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =================================
   GET PROFILE ID FROM URL
================================= */

function getProfileId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}


/* =================================
   GET CURRENT USER
================================= */

async function getCurrentUser() {

  const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/user",
      {
        headers:
          headers()
      }
    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Your login session has expired.\n\n" +
      text
    );

  }


  if (!text.trim()) {

    throw new Error(
      "Supabase returned no user."
    );

  }


  return JSON.parse(text);

}


/* =================================
   FIND PROFILE BY ID
================================= */

async function findProfile() {

  const requestedId =
    getProfileId();


  /*
    No ID means show my own profile.
  */

  if (!requestedId) {

    const username =
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "BERAKAH User";


    return {

      id:
        currentUser.id,

      username:
        username,

      full_name:
        currentUser.user_metadata?.full_name ||
        username,

      language:
        currentUser.user_metadata?.language ||
        ""

    };

  }


  /*
    Load profile from Supabase.
  */

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/profiles" +
      "?select=*" +
      "&id=eq." +
      encodeURIComponent(
        requestedId
      ) +
      "&limit=1",

      {
        headers:
          headers()
      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Could not load profile:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    throw new Error(
      "Profile not found."
    );

  }


  const rows =
    JSON.parse(text);


  if (!rows.length) {

    throw new Error(
      "Profile not found."
    );

  }


  return rows[0];

}
