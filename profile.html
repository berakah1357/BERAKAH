<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

button,
input,
textarea,
select {
  font: inherit;
}


/* =====================================================
   HEADER
   ===================================================== */

header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav {
  max-width: 1100px;
  margin: auto;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 2px;
}

.nav-links {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-links a,
.nav-links button {

  text-decoration: none;

  border: 1px solid #d1d5db;

  background: #fff;

  color: #111827;

  padding: 8px 11px;

  border-radius: 8px;

  font-weight: 600;

  cursor: pointer;
}

.nav-links a:hover,
.nav-links button:hover {
  background: #f3f4f6;
}

.nav-links .logout {
  background: #111827;
  color: white;
}

.nav-links .logout:hover {
  background: #374151;
}


/* =====================================================
   MAIN
   ===================================================== */

main {
  max-width: 950px;
  margin: 25px auto;
  padding: 0 15px;
}


/* =====================================================
   LOADING / ERROR
   ===================================================== */

.loading,
.error {

  background: white;

  border-radius: 16px;

  padding: 30px;

  text-align: center;

  box-shadow:
    0 3px 15px rgba(0,0,0,.05);
}

.error {

  display: none;

  color: #b91c1c;

  text-align: left;

  white-space: pre-wrap;
}


/* =====================================================
   PROFILE
   ===================================================== */

.profile {
  display: none;
}


/* =====================================================
   COVER
   ===================================================== */

.cover-wrapper {
  position: relative;
}

.cover {

  height: 230px;

  background:
    linear-gradient(
      135deg,
      #111827,
      #374151
    );

  border-radius: 18px 18px 0 0;

  overflow: hidden;

  position: relative;
}

.cover img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;
}


/* =====================================================
   COVER UPLOAD BUTTON
   ===================================================== */

.cover-upload {

  position: absolute;

  right: 15px;

  bottom: 15px;

  background: rgba(255,255,255,.92);

  color: #111827;

  border: 0;

  border-radius: 9px;

  padding: 9px 13px;

  font-weight: bold;

  cursor: pointer;

  display: none;
}

.cover-wrapper:hover .cover-upload {
  display: block;
}


/* =====================================================
   PROFILE CARD
   ===================================================== */

.profile-card {

  background: white;

  padding: 25px;

  border-radius: 0 0 18px 18px;

  box-shadow:
    0 3px 15px rgba(0,0,0,.05);
}


/* =====================================================
   AVATAR
   ===================================================== */

.avatar-area {
  position: relative;
  width: 125px;
}

.avatar {

  width: 125px;
  height: 125px;

  margin-top: -75px;

  border-radius: 50%;

  background: #e5e7eb;

  border: 5px solid white;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 48px;

  font-weight: bold;

  overflow: hidden;

  position: relative;

  z-index: 2;
}

.avatar img {

  width: 100%;
  height: 100%;

  object-fit: cover;
}

.avatar-upload {

  position: absolute;

  right: -5px;
  bottom: 2px;

  width: 38px;
  height: 38px;

  border-radius: 50%;

  border: 3px solid white;

  background: #111827;

  color: white;

  display: none;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 5;
}

.avatar-area:hover .avatar-upload {
  display: flex;
}


/* =====================================================
   PROFILE TEXT
   ===================================================== */

h1 {
  margin: 14px 0 4px;
  font-size: 30px;
}

.username {
  color: #6b7280;
  font-size: 15px;
}

.language {
  color: #6b7280;
  margin-top: 8px;
}

.bio {

  margin-top: 20px;

  line-height: 1.7;

  max-width: 750px;

  white-space: pre-wrap;
}


/* =====================================================
   STATS
   ===================================================== */

.stats {

  display: flex;

  gap: 40px;

  margin-top: 25px;

  flex-wrap: wrap;
}

.stat {

  cursor: pointer;
}

.stat strong {

  display: block;

  font-size: 22px;
}

.stat:hover strong {
  text-decoration: underline;
}


/* =====================================================
   ACTIONS
   ===================================================== */

.actions {
  margin-top: 25px;
}

.action {

  border: 0;

  border-radius: 9px;

  padding: 11px 17px;

  margin-right: 7px;

  margin-bottom: 7px;

  font-weight: bold;

  cursor: pointer;
}

.action:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.danger {
  background: #fee2e2;
  color: #991b1b;
}


/* =====================================================
   STATUS
   ===================================================== */

.status {

  margin-top: 12px;

  font-weight: bold;

  min-height: 20px;
}


/* =====================================================
   EDIT BOX
   ===================================================== */

.edit-box {

  display: none;

  margin-top: 20px;

  padding: 20px;

  background: #f9fafb;

  border: 1px solid #e5e7eb;

  border-radius: 14px;
}

.edit-box h3 {
  margin-top: 0;
}

.edit-box label {

  display: block;

  font-weight: bold;

  margin: 14px 0 6px;
}

.edit-box input,
.edit-box textarea,
.edit-box select {

  width: 100%;

  padding: 12px;

  border: 1px solid #d1d5db;

  border-radius: 8px;

  font-size: 15px;

  background: white;
}

.edit-box textarea {

  min-height: 110px;

  resize: vertical;
}

.save,
.cancel {

  margin-top: 15px;

  padding: 11px 17px;

  border: 0;

  border-radius: 8px;

  font-weight: bold;

  cursor: pointer;
}

.save {

  background: #111827;

  color: white;
}

.cancel {

  background: #e5e7eb;

  color: #111827;
}


/* =====================================================
   POSTS
   ===================================================== */

.posts {

  margin-top: 25px;

  background: white;

  padding: 25px;

  border-radius: 18px;

  box-shadow:
    0 3px 15px rgba(0,0,0,.05);

.posts-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;
}

.posts-header h2 {
  margin: 0;
}


/* =====================================================
   CREATE POST
   ===================================================== */

.create-post {

  margin-top: 20px;

  padding: 18px;

  background: #f9fafb;

  border: 1px solid #e5e7eb;

  border-radius: 14px;

  display: none;
}

.create-post textarea {

  width: 100%;

  min-height: 100px;

  resize: vertical;

  border: 1px solid #d1d5db;

  border-radius: 9px;

  padding: 12px;

  background: white;
}

.create-post-actions {

  margin-top: 10px;

  display: flex;

  gap: 8px;

  flex-wrap: wrap;
}

.create-post-button {

  border: 0;

  background: #111827;

  color: white;

  padding: 10px 15px;

  border-radius: 8px;

  font-weight: bold;

  cursor: pointer;
}


/* =====================================================
   POST
   ===================================================== */

.post {

  padding: 20px 0;

  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: 0;
}

.post-date {

  color: #6b7280;

  font-size: 12px;

  margin-bottom: 9px;
}

.post-content {

  white-space: pre-wrap;

  line-height: 1.7;

  font-size: 16px;
}

.post-image {

  width: 100%;

  max-height: 500px;

  object-fit: cover;

  border-radius: 12px;

  margin-top: 12px;
}

.post-actions {

  margin-top: 12px;

  display: flex;

  gap: 8px;

  flex-wrap: wrap;
}

.like-button,
.delete-post-button {

  border: 0;

  padding: 8px 13px;

  border-radius: 8px;

  cursor: pointer;

  font-weight: 600;
}

.like-button {
  background: #f3f4f6;
}

.delete-post-button {

  background: #fee2e2;

  color: #991b1b;
}


/* =====================================================
   EMPTY
   ===================================================== */

.empty {

  text-align: center;

  color: #6b7280;

  padding: 35px 10px;
}


/* =====================================================
   MODAL
   ===================================================== */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.5);

  z-index: 1000;

  align-items: center;

  justify-content: center;

  padding: 20px;
}

.modal-content {

  background: white;

  width: 100%;

  max-width: 500px;

  max-height: 85vh;

  overflow-y: auto;

  border-radius: 16px;

  padding: 22px;

  position: relative;
}

.modal-close {

  position: absolute;

  right: 15px;

  top: 12px;

  border: 0;

  background: #f3f4f6;

  width: 35px;

  height: 35px;

  border-radius: 50%;

  cursor: pointer;

  font-size: 18px;
}

.modal h3 {
  margin-top: 0;
}

.person-row {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  padding: 12px 0;

  border-bottom: 1px solid #e5e7eb;
}


/* =====================================================
   HIDDEN FILE INPUT
   ===================================================== */

.hidden-file {
  display: none;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 650px) {

  header {
    padding: 10px;
  }

  .nav {

    align-items: flex-start;

    flex-direction: column;
  }

  .nav-links {
    width: 100%;
  }

  .nav-links a,
  .nav-links button {

    flex: 1;

    text-align: center;

  }

  main {

  .cover {

  }

  .profile-card {
    padding: 18px;
  }

  .avatar {
    width: 105px;

  }

    font-size: 25px;
  }

  .stats {
    gap: 25px;
  }

  .posts {
    padding: 18px;
  }

}


/* =====================================================
   VERY SMALL SCREENS
   ===================================================== */

@media (max-width: 400px) {

  .nav-links a,
  .nav-links button {
    padding: 7px 6px;
    font-size: 12px;
  }

  .cover {
    height: 145px;
  }

}

</style>

<script>

/* =====================================================
   BERAKAH SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
   ===================================================== */

const accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;

let profile = null;


/* =====================================================
   SUPABASE HEADERS
   ===================================================== */

function supabaseHeaders(extra = {}) {

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + accessToken,

...extra

};

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


/* =====================================================
   URL PARAMETER
   ===================================================== */

function getURLParameter(name) {

const params =
new URLSearchParams(
window.location.search
);

return params.get(name);

}


/* =====================================================
   ERROR
   ===================================================== */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"none";

const error =
document.getElementById(
"error"
);

error.style.display =
"block";

error.textContent =
message;

}


/* =====================================================
   CURRENT AUTH USER
   ===================================================== */

async function getCurrentUser() {

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method: "GET",

headers:
supabaseHeaders()

}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Could not verify login:\n\n" +
text
);

}

if (!text) {

throw new Error(
"No logged-in user was returned."
);

}

return JSON.parse(text);

}


/* =====================================================
   LOAD OWN PROFILE
   ===================================================== */

async function loadOwnProfile() {

const userId =
currentUser.id;

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Could not load your profile:\n\n" +
text
);

}

const rows =
text ?
JSON.parse(text) :
[];

if (!rows.length) {

throw new Error(
"Your BERAKAH profile was not found.\n\n" +
"Auth ID:\n" +
userId
);

}

profile =
rows[0];

displayProfile();

}


/* =====================================================
   LOAD PROFILE BY ID
   ===================================================== */

async function loadProfileById(id) {

if (!/^[0-9]+$/.test(id)) {

throw new Error(
"Invalid profile ID."
);

}

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&limit=1";

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}

const rows =
text ?
JSON.parse(text) :
[];

if (!rows.length) {

throw new Error(
"Profile was not found."
);

}

profile =
rows[0];

displayProfile();

}


/* =====================================================
   LOAD PROFILE BY USERNAME
   ===================================================== */

async function loadProfileByUsername(username) {

username =
String(username || "")
.replace("@", "")
.trim();

if (!username) {

throw new Error(
"Username is empty."
);

}

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&username=eq." +
encodeURIComponent(username) +
"&limit=1";

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}

const rows =
text ?
JSON.parse(text) :
[];

if (!rows.length) {

throw new Error(
"Username @" +
username +
" was not found."
);

}

profile =
rows[0];

displayProfile();

}


/* =====================================================
   LANGUAGE NAME
   ===================================================== */

function getLanguageName(language) {

const languages = {

ht:
"Haitian Creole / Kreyòl Ayisyen",

en:
"English",

fr:
"Français",

es:
"Español"

};

return languages[language] ||
language ||
"Not specified";

}


/* =====================================================
   DISPLAY PROFILE
   ===================================================== */

function displayProfile() {

const fullName =
profile["Full name"] ||
profile.full_name ||
profile.name ||
profile.username ||
"BERAKAH";

const username =
profile.username ||
"berakah1357";

const language =
profile.language ||
"";

const bio =
profile.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


/* NAME */

document.getElementById(
"profileName"
).textContent =
fullName;


/* USERNAME */

document.getElementById(
"profileUsername"
).textContent =
"@" +
username;


/* LANGUAGE */

document.getElementById(
"profileLanguage"
).textContent =
"🌍 " +
getLanguageName(language);


/* BIO */

document.getElementById(
"profileBio"
).textContent =
bio;


/* AVATAR */

const avatar =
document.getElementById(
"avatar"
);

if (profile.avatar_url) {

/* =====================================================
   OWN PROFILE CHECK
   ===================================================== */

function isOwnProfile() {

if (!currentUser || !profile) {

return false;

}


/* PRIMARY CHECK */

if (
profile.user_id &&
String(profile.user_id).toLowerCase() ===
String(currentUser.id).toLowerCase()
) {

return true;

}


/* OLD PROFILE FALLBACK */

if (!profile.user_id) {

const metadata =
currentUser.user_metadata || {};

const loggedUsername =
String(
metadata.username ||
metadata.user_name ||
metadata.userName ||
""
)
.replace("@", "")
.toLowerCase()
.trim();

const profileUsername =
String(
profile.username ||
""
)
.replace("@", "")
.toLowerCase()
.trim();

if (
loggedUsername &&
profileUsername &&
loggedUsername === profileUsername
) {

return true;

}

}

return false;

}

/* =====================================================
   IMAGE TO BASE64
   ===================================================== */

function fileToDataURL(file) {

return new Promise(
(resolve, reject) => {

const reader =
new FileReader();

reader.onload =
function() {

resolve(
reader.result
);

};

reader.onerror =
function() {

reject(
new Error(
"Could not read image."
)
);

};

reader.readAsDataURL(file);

}
);

}

function displayPosts(posts) {

document.getElementById(
"postsList"
);

"";

"postsCount"
).textContent =
posts.length;

list.innerHTML =
`<div class="empty">

: ""}

posts.forEach(
post => {

document.createElement(
"div"
);

"post";

"";

d.toLocaleString();

"";

?

"";

</div>

post.content || ""
)}

${image}

<div class="post-actions">

class="like-button">

❤️ Like

</button>

${deleteButton}

</div>
