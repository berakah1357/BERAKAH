/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


const accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;

let profileData = null;

let profileDatabaseId = null;

let profileAuthUserId = null;


/* =========================================
   HEADERS
========================================= */

function headers(extra) {

return Object.assign(

{

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + accessToken

},

extra || {}

);

}


/* =========================================
   SAFE TEXT
========================================= */

function safe(value) {

return String(value ?? "")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* =========================================
   SHOW ERROR
========================================= */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"profile"
).style.display =
"none";


const error =
document.getElementById(
"error"
);


error.style.display =
"block";


error.textContent =
message;

}


/* =========================================
   PROFILE ID FROM URL
========================================= */

function getProfileId() {

const params =
new URLSearchParams(
window.location.search
);

return params.get("id");

}


/* =========================================
   CURRENT USER
========================================= */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"Your BERAKAH login session is missing. Please log in again."
);

}


const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method: "GET",

headers:
headers()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Login session error:\n\n" +
text
);

}


if (!text.trim()) {

throw new Error(
"Supabase returned no user."
);

}


return JSON.parse(text);

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile() {

const requestedId =
getProfileId();


if (!requestedId) {

throw new Error(
"No profile ID was provided."
);

}


/*
 IMPORTANT:

 The People page sends:

 profile.html?id=1

 profiles.id is BIGINT.

 Therefore this query MUST use
 the numeric profiles.id.

 After finding the row, we get:

 profiles.user_id

 which is the UUID used for:

 posts
 follows
 messages
 notifications
*/


const numericId =
Number(requestedId);


if (
!Number.isInteger(numericId) ||
numericId <= 0
) {

throw new Error(
"Invalid profile ID."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=id,created_at,\"Full name\",username,language,avatar_url,user_id" +
"&id=eq." +
numericId +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
headers()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile: " +
text
);

}


if (!text.trim()) {

throw new Error(
"Profile not found."
);

}


const rows =
JSON.parse(text);


if (!rows.length) {

throw new Error(
"Profile not found."
);

}


profileData =
rows[0];


profileDatabaseId =
profileData.id;


profileAuthUserId =
profileData.user_id;


/*
 Make sure this profile has
 its authentication UUID.
*/

if (!profileAuthUserId) {

throw new Error(
"This profile does not have a user_id UUID."
);

}


/* =========================================
   DISPLAY NAME
========================================= */

const fullName =
profileData["Full name"] ||
profileData.username ||
"BERAKAH User";


document.getElementById(
"profileName"
).textContent =
fullName;


/* =========================================
   USERNAME
========================================= */

const username =
profileData.username ||
"berakahuser";


document.getElementById(
"profileUsername"
).textContent =
"@" +
username.toLowerCase();


/* =========================================
   LANGUAGE
========================================= */

const language =
profileData.language ||
"—";


document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
language.toUpperCase();


/* =========================================
   AVATAR
========================================= */

const avatar =
document.getElementById(
"avatar"
);


if (profileData.avatar_url) {

avatar.innerHTML = `

<img
src="${safe(profileData.avatar_url)}"
alt="Profile picture">

`;

}
else {

avatar.textContent =
String(fullName)
.charAt(0)
.toUpperCase() ||
"B";

}


/* =========================================
   POSTS
========================================= */

const posts =
await loadPosts();


displayPosts(posts);


/* =========================================
   FOLLOW
========================================= */

await loadFollowCounts();

await updateFollowButton();


/* =========================================
   OWNER CHECK
========================================= */

if (
String(profileAuthUserId) ===
String(currentUser.id)
) {

document.getElementById(
"editButton"
).style.display =
"inline-block";


document.getElementById(
"followButton"
).style.display =
"none";

}
else {

document.getElementById(
"editButton"
).style.display =
"none";

}


/* =========================================
   SHOW PROFILE
========================================= */

document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"profile"
).style.display =
"block";

}


/* =========================================
   LOAD POSTS
========================================= */

async function loadPosts() {

if (!profileAuthUserId) {

return [];

}


/*
 IMPORTANT:

 posts.user_id is UUID.

 Use profiles.user_id,
 NOT profiles.id.
*/

const url =
SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(
profileAuthUserId
) +
"&order=created_at.desc";


const response =
await fetch(

url,

{

method: "GET",

headers:
headers()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load posts: " +
text
);

}


if (!text.trim()) {

return [];

}


return JSON.parse(text);

}


/* =========================================
   DISPLAY POSTS
========================================= */

function displayPosts(posts) {

const list =
document.getElementById(
"postsList"
);


list.innerHTML =
"";


document.getElementById(
"postsCount"
).textContent =
posts.length;


if (!posts.length) {

list.innerHTML = `

<div class="empty">
No posts yet.
</div>

`;

return;

}


posts.forEach(

function(post) {

const div =
document.createElement(
"div"
);


div.className =
"post";


let dateText =
"Date unavailable";


if (post.created_at) {

const date =
new Date(
post.created_at
);


if (!isNaN(date.getTime())) {

dateText =
date.toLocaleString();

}

}


let imageHTML =
"";


if (post.image_url) {

imageHTML = `

<img
  class="post-image"
  src="${safe(post.image_url)}"
  alt="Post image">

`;

}


div.innerHTML = `

<div class="post-time">
${safe(dateText)}
</div>

<div class="post-content">
${safe(post.content || "")}
</div>

${imageHTML}

<div class="post-actions">

<button
onclick="location.href='feed.html'">
❤️ Like
</button>

</div>

`;


list.appendChild(
div
);

});

}


/* =========================================
   LOAD FOLLOW COUNTS
========================================= */

async function loadFollowCounts() {

if (!profileAuthUserId) {

return;

}


/*
 Followers:

 following_id = profile owner UUID
*/

const followersResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&following_id=eq." +
encodeURIComponent(
profileAuthUserId
),

{

method: "GET",

headers:
headers()

}

);


const followersText =
await followersResponse.text();


if (!followersResponse.ok) {

throw new Error(
"Could not load followers: " +
followersText
);

}


const followers =
followersText.trim()
?
JSON.parse(followersText)
:
[];


/*
 Following:

 follower_id = profile owner UUID
*/

const followingResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
profileAuthUserId
),

{

method: "GET",

headers:
headers()

}

);


const followingText =
await followingResponse.text();


if (!followingResponse.ok) {

throw new Error(
"Could not load following: " +
followingText
);

}


const following =
followingText.trim()
?
JSON.parse(followingText)
:
[];


document.getElementById(
"followersCount"
).textContent =
followers.length;


document.getElementById(
"followingCount"
).textContent =
following.length;

}


/* =========================================
   CHECK FOLLOWING
========================================= */

async function checkFollowing() {

if (
!profileAuthUserId ||
String(profileAuthUserId) ===
String(currentUser.id)
) {

return false;

}


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profileAuthUserId
),

{

method: "GET",

headers:
headers()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not check follow status: " +
text
);

}


if (!text.trim()) {

return false;

}


return JSON.parse(text).length > 0;

}


/* =========================================
   UPDATE FOLLOW BUTTON
========================================= */

async function updateFollowButton() {

const button =
document.getElementById(
"followButton"
);


if (
!profileAuthUserId ||
String(profileAuthUserId) ===
String(currentUser.id)
) {

button.style.display =
"none";

return;

}


button.style.display =
"inline-block";


const following =
await checkFollowing();


if (following) {

button.textContent =
"Following";


button.className =
"action-button following";

}
else {

button.textContent =
"Follow";


button.className =
"action-button follow";

}

}


/* =========================================
   FOLLOW NOTIFICATION
========================================= */

async function createFollowNotification() {

try {

const actorName =
currentUser.user_metadata?.username ||
currentUser.email?.split("@")[0] ||
"BERAKAH User";


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/notifications",

{

method: "POST",

headers:
headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

user_id:
profileAuthUserId,

actor_id:
currentUser.id,

type:
"follow",

message:
actorName +
" follows you",

read:
false

})

);


return response.ok;

}
catch(error) {

console.error(
"NOTIFICATION ERROR:",
error
);

return false;

}

}


/* =========================================
   FOLLOW / UNFOLLOW
========================================= */

async function toggleFollow() {

const button =
document.getElementById(
"followButton"
);


const status =
document.getElementById(
"status"
);


button.disabled =
true;


try {

const following =
await checkFollowing();


if (following) {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profileAuthUserId
),

{

method: "DELETE",

headers:
headers()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not unfollow:\n\n" +
text
);

}


status.textContent =
"Unfollowed successfully.";

}
else {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method: "POST",

headers:
headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profileAuthUserId

})

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not follow:\n\n" +
text
);

}


await createFollowNotification();


status.textContent =
"Following successfully.";

}


await loadFollowCounts();

await updateFollowButton();

}
catch(error) {

console.error(
"FOLLOW ERROR:",
error
);


status.textContent =
error.message;

}
finally {

button.disabled =
false;

}

}

   OPEN EDIT PROFILE

function openEditProfile() {

const editBox =
document.getElementById(
"editBox"
);


editBox.style.display =
"block";


document.getElementById(
"editFullName"
).value =
profileData["Full name"] ||
profileData.username ||
"";


document.getElementById(
"editUsername"
).value =
profileData.username ||
"";


document.getElementById(
"editLanguage"
).value =
profileData.language ||
"ht";


document.getElementById(
"editStatus"
).textContent =
"";


editBox.scrollIntoView({

behavior:

/* =========================================
   CANCEL EDIT

function cancelEdit() {

document.getElementById(
"editBox"
).style.display =
"none";


document.getElementById(
"editStatus"
).textContent =
"";

}


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile() {

const button =
document.getElementById(
"saveProfileButton"
);


const editStatus =
document.getElementById(
"editStatus"
);


const fullName =
document.getElementById(
"editFullName"
).value
.trim();


const username =
document.getElementById(
"editUsername"
).value
.trim();


const language =
document.getElementById(
"editLanguage"
).value;


if (!fullName) {

editStatus.textContent =
"Please enter your full name.";

return;

}


if (!username) {

editStatus.textContent =
"Please enter your username.";

return;

}


button.disabled =
true;


editStatus.textContent =
"Saving...";


try {

/*
 IMPORTANT:

 The profiles primary key is BIGINT.

 Therefore update using:

 id = profileDatabaseId

 NOT user_id.
*/

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(
profileDatabaseId
),

{

method: "PATCH",

headers:
headers({

"Content-Type":
"application/json",

"Prefer":
"return=representation"

}),

body:
JSON.stringify({

"Full name":
fullName,

username:
username,

language:
language

})

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not save profile:\n\n" +
text
);

}


if (text.trim()) {

const saved =
JSON.parse(text);

/* =========================================
   OPEN MESSAGES
========================================= */

function openMessages() {

if (!profileAuthUserId) {

alert(
"This profile cannot receive messages because its user_id is missing."
);

return;

}


/*
 IMPORTANT:

 Messages use:

 profiles.user_id

 which is a UUID.

 NOT:

 profiles.id

 which is a BIGINT.
*/

window.location.href =
"messages.html?id=" +
encodeURIComponent(
profileAuthUserId
);

}

========================================= */

"logoutButton"
).addEventListener(

"click",

function() {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

location.href =
"login.html";

}

);


/* =========================================
   START
========================================= */

async function start() {

try {

if (!accessToken) {

location.href =
"login.html";

return;

}


currentUser =
await getCurrentUser();


await loadProfile();

}
catch(error) {

console.error(
"BERAKAH PROFILE ERROR:",
error
);


showError(
error.message
);

}

}


start();
