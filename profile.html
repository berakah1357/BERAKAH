<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

/* =========================
   HEADER
========================= */

header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav {
  max-width: 1050px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 2px;
}

.nav-links {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-links a,
.nav-links button {
  text-decoration: none;
  border: 1px solid #d1d5db;
  background: #fff;
  color: #111827;
  padding: 8px 11px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}

.nav-links .logout {
  background: #111827;
  color: white;
}

/* =========================
   MAIN
========================= */

main {
  max-width: 950px;
  margin: 25px auto;
  padding: 0 15px;
}

.loading,
.error {
  background: white;
  border-radius: 16px;
  padding: 30px;
  text-align: center;
}

.error {
  display: none;
  color: #b91c1c;
  text-align: left;
  white-space: pre-wrap;
}

/* =========================
   PROFILE
========================= */

.profile {
  display: none;
}

.cover {
  height: 200px;
  background: linear-gradient(
    135deg,
    #111827,
    #374151
  );
  border-radius: 18px 18px 0 0;
}

.profile-card {
  background: white;
  padding: 25px;
  border-radius: 0 0 18px 18px;
}

.avatar {
  width: 120px;
  height: 120px;
  margin-top: -70px;
  border-radius: 50%;
  background: #e5e7eb;
  border: 5px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 46px;
  font-weight: bold;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h1 {
  margin: 14px 0 4px;
}

.username {
  color: #6b7280;
}

.language {
  color: #6b7280;
  margin-top: 7px;
}

.bio {
  margin-top: 20px;
  line-height: 1.6;
  white-space: pre-wrap;
}

/* =========================
   STATS
========================= */

.stats {
  display: flex;
  gap: 45px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stat {
  cursor: pointer;
}

.stat strong {
  display: block;
  font-size: 22px;
}

.stat span {
  color: #6b7280;
}

/* =========================
   ACTIONS
========================= */

.actions {
  margin-top: 25px;
}

.action {
  border: 0;
  border-radius: 8px;
  padding: 11px 17px;
  margin-right: 7px;
  margin-bottom: 7px;
  font-weight: bold;
  cursor: pointer;
}

.action:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.status {
  margin-top: 12px;
  font-weight: bold;
}

/* =========================
   EDIT PROFILE
========================= */

.edit-box {
  display: none;
  margin-top: 20px;
  padding: 20px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
}

.edit-box label {
  display: block;
  font-weight: bold;
  margin: 14px 0 6px;
}

.edit-box input,
.edit-box textarea,
.edit-box select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
}

.edit-box textarea {
  min-height: 100px;
  resize: vertical;
}

.save,
.cancel {
  margin-top: 15px;
  padding: 11px 17px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.save {
  background: #111827;
  color: white;
}

.cancel {
  background: #e5e7eb;
}

/* =========================
   CONNECTION PANEL
========================= */

.connections {
  display: none;
  margin-top: 20px;
  background: white;
  border-radius: 18px;
  padding: 22px;
}

.connection-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.connection-header h2 {
  margin: 0;
}

.close-connections {
  border: 0;
  background: #e5e7eb;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: bold;
}

.connection-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.connection-user {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
}

.connection-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.connection-avatar {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 50%;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-weight: bold;
  font-size: 20px;
}

.connection-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.connection-info {
  min-width: 0;
}

.connection-name {
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
}

.connection-username {
  color: #6b7280;
  font-size: 14px;
}

.view-profile {
  border: 0;
  background: #111827;
  color: white;
  border-radius: 8px;
  padding: 8px 11px;
  cursor: pointer;
  font-weight: bold;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}

/* =========================
   POSTS
========================= */

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 18px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: 0;
}

.post-date {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 9px;
}

.post-content {
  white-space: pre-wrap;
  line-height: 1.6;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 12px;
}

.like-button {
  margin-top: 12px;
  border: 0;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .nav-links {
    width: 100%;
  }

  .stats {
    gap: 25px;
  }

  .profile-card {
    padding: 20px;
  }

  .connection-user {
    align-items: flex-start;
  }

  .view-profile {
    padding: 7px 9px;
  }

}

</style>

</head>

<script>

/* =====================================================
   BERAKAH SUPABASE
===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
===================================================== */

let accessToken =
localStorage.getItem(
"berakah_access_token"
);

let currentUser =
null;

let profile =
null;


/* =====================================================
   SUPABASE HEADERS
===================================================== */

function supabaseHeaders(extra = {}) {

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
accessToken,

...extra

};

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"none";

const error =
document.getElementById(
"error"
);

error.style.display =
"block";

error.textContent =
message;

}


/* =====================================================
   CLEAR SESSION
===================================================== */

function clearSession() {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

localStorage.removeItem(
"berakah_username"
);

localStorage.removeItem(
"berakah_auth_user_id"
);

}


/* =====================================================
   URL PARAMETER
===================================================== */

function getURLParameter(name) {

const params =
new URLSearchParams(
window.location.search
);

return params.get(name);

}


/* =====================================================
   AUTH USER
===================================================== */

async function getCurrentUser() {

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method:
"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

if (
response.status === 401 ||
response.status === 403
) {

clearSession();

window.location.href =
"login.html";

return null;

}

throw new Error(
"Could not verify login:\n\n" +
text
);

}


if (!text) {

throw new Error(
"No logged-in user was returned."
);

}


return JSON.parse(text);

}


/* =====================================================
   LOAD OWN PROFILE
===================================================== */

async function loadOwnProfile() {

const userId =
currentUser.id;


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";


const response =
await fetch(

url,

{

method:
"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load your profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Your BERAKAH profile was not found.\n\n" +
"Auth ID:\n" +
userId
);

}


profile =
rows[0];


displayProfile();

}


/* =====================================================
   LOAD PROFILE BY ID
===================================================== */

async function loadProfileById(id) {

if (!/^[0-9]+$/.test(id)) {

throw new Error(
"Invalid profile ID."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&limit=1";


const response =
await fetch(

url,

{

method:
"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Profile was not found."
);

}


profile =
rows[0];


displayProfile();

}


/* =====================================================
   LOAD PROFILE BY USERNAME
===================================================== */

async function loadProfileByUsername(username) {

username =
String(username || "")
.replace("@", "")
.trim();


if (!username) {

throw new Error(
"Username is empty."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&username=eq." +
encodeURIComponent(username) +
"&limit=1";


const response =
await fetch(

url,

{

method:
"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Username @" +
username +
" was not found."
);

}


profile =
rows[0];


displayProfile();

}


/* =====================================================
   PROFILE DISPLAY
===================================================== */

function displayProfile() {

const fullName =
profile["Full name"] ||
profile.full_name ||
profile.name ||
profile.username ||
"BERAKAH";


const username =
profile.username ||
"berakah1357";


const language =
profile.language ||
"—";


const bio =
profile.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


document.getElementById(
"profileName"
).textContent =
fullName;


document.getElementById(
"profileUsername"
).textContent =
"@" +
username;


document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
language.toUpperCase();


document.getElementById(
"profileBio"
).textContent =
bio;


/* AVATAR */

const avatar =
document.getElementById(
"avatar"
);


if (profile.avatar_url) {

avatar.innerHTML =
`<img
src="${escapeHTML(profile.avatar_url)}"
alt="Profile picture">`;

}
else {

avatar.textContent =
fullName
.charAt(0)
.toUpperCase();

}


/* EDIT / FOLLOW */

setupEditPermission();

}


/* =====================================================
   OWN PROFILE CHECK
===================================================== */

function isOwnProfile() {

if (!currentUser ||
!profile) {

return false;

}


if (
profile.user_id &&
String(profile.user_id).toLowerCase() ===
String(currentUser.id).toLowerCase()
) {

return true;

}


/*
Fallback for older rows
without user_id.
*/

if (!profile.user_id) {

const metadata =
currentUser.user_metadata || {};

const loggedUsername =
String(
metadata.username ||
metadata.user_name ||
metadata.userName ||
""
)
.replace("@", "")
.toLowerCase()
.trim();


const profileUsername =
String(
profile.username ||
""
)
.replace("@", "")
.toLowerCase()
.trim();


if (
loggedUsername &&
profileUsername &&
loggedUsername === profileUsername
) {

return true;

}

}


return false;

}


/* =====================================================
   EDIT / FOLLOW PERMISSION
===================================================== */

function setupEditPermission() {

const editButton =
document.getElementById(
"editButton"
);

const followButton =
document.getElementById(
"followButton"
);


if (isOwnProfile()) {

editButton.style.display =
"inline-block";

followButton.style.display =
"none";

}
else {

editButton.style.display =
"none";

followButton.style.display =
"inline-block";

checkFollowingStatus();

}

}


/* =====================================================
   OPEN EDIT
===================================================== */

function openEdit() {

if (!isOwnProfile()) {

return;

}


document.getElementById(
"editFullName"
).value =
profile["Full name"] ||
profile.full_name ||
profile.name ||
"";


document.getElementById(
"editUsername"
).value =
profile.username ||
"";


document.getElementById(
"editLanguage"
).value =
profile.language ||
"ht";


document.getElementById(
"editBio"
).value =
profile.bio ||
"";


document.getElementById(
"editStatus"
).textContent =
"";


document.getElementById(
"editBox"
).style.display =
"block";

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit() {

document.getElementById(
"editBox"
).style.display =
"none";

}


/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile() {

if (!isOwnProfile()) {

return;

}


const fullName =
document.getElementById(
"editFullName"
).value.trim();


const username =
document.getElementById(
"editUsername"
).value
.trim()
.replace("@", "");


const language =
document.getElementById(
"editLanguage"
).value;


const bio =
document.getElementById(
"editBio"
).value.trim();


const status =
document.getElementById(
"editStatus"
);


const button =
document.getElementById(
"saveButton"
);


if (!fullName) {

status.textContent =
"Full name is required.";

return;

}


if (!username) {

status.textContent =
"Username is required.";

return;

}


button.disabled =
true;

status.textContent =
"Saving...";


try {

const updateData = {

"Full name":
fullName,

username:
username,

language:
language,

bio:
bio

};


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(
profile.id
),

{

method:
"PATCH",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=representation"

}),

body:
JSON.stringify(
updateData
)

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Profile update failed:\n\n" +
text
);

}


const updatedRows =
text ?
JSON.parse(text) :
[];


if (updatedRows.length) {

profile =
updatedRows[0];

}


localStorage.setItem(
"berakah_username",
username
);


displayProfile();


status.textContent =
"Profile saved successfully!";


setTimeout(
function() {

document.getElementById(
"editBox"
).style.display =
"none";

document.getElementById(
"editStatus"
).textContent =
"";

},
1200
);

}
catch(error) {

console.error(
"PROFILE SAVE ERROR:",
error
);

status.textContent =
error.message;

}
finally {

button.disabled =
false;

}

}


/* =====================================================
   LOAD POSTS
===================================================== */

async function loadPosts() {

const userId =
profile.user_id;


if (!userId) {

displayPosts([]);

return;

}


const url =
SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&order=created_at.desc";


const response =
await fetch(

url,

{

method:
"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

console.warn(
"Posts could not be loaded:",
text
);

displayPosts([]);

return;

}


const posts =
text ?
JSON.parse(text) :
[];


displayPosts(posts);

}


/* =====================================================

/* =====================================================
   FOLLOW / UNFOLLOW
===================================================== */

async function followUser() {

if (!currentUser ||
!profile ||
!profile.user_id) {

return;

}


if (isOwnProfile()) {

return;

}


const button =
document.getElementById(
"followButton"
);

const status =
document.getElementById(
"status"
);


button.disabled =
true;


try {

const checkURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const checkResponse =
await fetch(

checkURL,

{

method:
"GET",

headers:
supabaseHeaders()

}

);


const checkText =
await checkResponse.text();


if (!checkResponse.ok) {

throw new Error(
checkText
);

}


const existing =
checkText ?
JSON.parse(checkText) :
[];


/* =========================
   UNFOLLOW
========================= */

if (existing.length) {

const deleteURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const deleteResponse =
await fetch(

deleteURL,

{

method:
"DELETE",

headers:
supabaseHeaders()

}

);


if (!deleteResponse.ok) {

const text =
await deleteResponse.text();

throw new Error(
"Could not unfollow:\n\n" +
text
);

}


button.textContent =
"Follow";

button.className =
"action follow";

status.textContent =
"Unfollowed.";

}


/* =========================
   FOLLOW
========================= */

else {

const followResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method:
"POST",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profile.user_id

})

}

);


if (!followResponse.ok) {

const text =
await followResponse.text();

throw new Error(
"Could not follow:\n\n" +
text
);

}


button.textContent =
"Following";

button.className =
"action following";

status.textContent =
"Following.";

}


/*
Refresh real counts.
*/

await loadFollowCounts();


}
catch(error) {

console.error(
"FOLLOW ERROR:",
error
);

status.textContent =
"Follow error:\n" +
error.message;

}
finally {

button.disabled =
false;

}

}


/* =====================================================
   LOAD FOLLOWERS
===================================================== */

async function loadFollowers() {

if (!profile ||
!profile.user_id) {

return;

}


openConnections(
"Followers"
);


const list =
document.getElementById(
"connectionList"
);


list.innerHTML =
`<div class="empty">
Loading followers...
</div>`;


const url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id,follower_id" +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


try {

const response =
await fetch(

url,

{

method:
"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(text);

}


const follows =
text ?
JSON.parse(text) :
[];


if (!follows.length) {

list.innerHTML =
`<div class="empty">
No followers yet.
</div>`;

return;

}


/*
Get the follower profile IDs
one by one.

This avoids depending on
foreign-key embedding names.
*/

const users = [];


for (
const follow
of follows
) {

const user =
await getProfileByUserId(
follow.follower_id
);

if (user) {

users.push(user);

}

}


displayConnectionUsers(
users
);

}
catch(error) {

console.error(
"FOLLOWERS ERROR:",
error
);

list.innerHTML =
`<div class="empty">
Could not load followers.
</div>`;

}

}

/* =====================================================
   GET PROFILE BY AUTH UUID
===================================================== */

async function getProfileByUserId(userId) {

if (!userId) {

return null;

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=id,user_id,username,\"Full name\",full_name,name,avatar_url" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";


try {

const response =
await fetch(

url,

{

method:
"GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

console.warn(
"Profile lookup failed:",
text
);

return null;

}


const rows =
text ?
JSON.parse(text) :
[];


return rows.length ?
rows[0] :
null;

}
catch(error) {

console.warn(
"Profile lookup error:",
error
);

return null;

}

</div>`;

user.full_name ||

"";

);

</div>

class="view-profile">

VIEW

</button>

`;

div.querySelector(
".view-profile"
);

/* =====================================================
   START
===================================================== */

async function start() {

try {

/*
No token = login.
*/

if (!accessToken) {

window.location.href =
"login.html";

return;

}


/*
Verify the fresh Supabase
session created by login.html.
*/

currentUser =
await getCurrentUser();


if (!currentUser) {

return;

}


/*
URL OPTIONS

profile.html
= own profile

profile.html?id=123
= numeric profile ID

profile.html?username=username
= username profile
*/

const requestedId =
getURLParameter("id");

const requestedUsername =
getURLParameter("username");


if (requestedId) {

await loadProfileById(
requestedId
);

}
else if (requestedUsername) {

await loadProfileByUsername(
requestedUsername
);

}
else {

await loadOwnProfile();

}


/*
Load profile data.
*/

await loadPosts();

await loadFollowCounts();


/*
Show profile.
*/

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"block";

}
catch(error) {

console.error(
"BERAKAH PROFILE ERROR:",
error
);

showError(
error.message ||
"Could not load profile."
);

}

}


start();

</script>
