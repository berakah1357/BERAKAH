<script>

/* =====================================================
   BERAKAH SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
   ===================================================== */

let accessToken =
localStorage.getItem(
"berakah_access_token"
);

let refreshToken =
localStorage.getItem(
"berakah_refresh_token"
);

let currentUser =
null;

let profile =
null;


/* =====================================================
   SUPABASE HEADERS
   ===================================================== */

function supabaseHeaders(extra = {}) {

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + accessToken,

...extra

};

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


/* =====================================================
   ERROR DISPLAY
   ===================================================== */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"none";

const error =
document.getElementById(
"error"
);

error.style.display =
"block";

error.textContent =
message;

}


/* =====================================================
   CLEAR SESSION
   ===================================================== */

function clearSession() {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

localStorage.removeItem(
"berakah_username"
);

localStorage.removeItem(
"berakah_auth_user_id"
);

accessToken =
null;

refreshToken =
null;

}


/* =====================================================
   REFRESH SUPABASE SESSION
   ===================================================== */

async function refreshSupabaseSession() {

if (!refreshToken) {

return false;

}


try {

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/token?grant_type=refresh_token",

{

method: "POST",

headers: {

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

refresh_token:
refreshToken

})

}

);


const data =
await response.json();


if (
!response.ok ||
!data.access_token
) {

console.warn(
"SESSION REFRESH FAILED:",
data
);

return false;

}


/*
Save the new access token.
*/

accessToken =
data.access_token;


if (data.refresh_token) {

refreshToken =
data.refresh_token;

}


localStorage.setItem(
"berakah_access_token",
accessToken
);


localStorage.setItem(
"berakah_refresh_token",
refreshToken
);


return true;

}
catch(error) {

console.error(
"SESSION REFRESH ERROR:",
error
);

return false;

}

}


/* =====================================================
   GET CURRENT AUTH USER
   ===================================================== */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"NO_SESSION"
);

}


let response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method: "GET",

headers:
supabaseHeaders()

}

);


let text =
await response.text();


/*
The old access token may have expired
or the session may have been replaced.

Try the refresh token.
*/

if (
response.status === 401 ||
response.status === 403
) {

console.warn(
"Access token invalid. Refreshing session..."
);


const refreshed =
await refreshSupabaseSession();


if (!refreshed) {

clearSession();

throw new Error(
"SESSION_EXPIRED"
);

}


/*
Retry with the NEW token.
*/

response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method: "GET",

headers:
supabaseHeaders()

}

);


text =
await response.text();

}


if (!response.ok) {

throw new Error(
"Could not verify login:\n\n" +
text
);

}


if (!text) {

throw new Error(
"No logged-in user was returned."
);

}


return JSON.parse(text);

}


/* =====================================================
   URL PARAMETER
   ===================================================== */

function getURLParameter(name) {

const params =
new URLSearchParams(
window.location.search
);

return params.get(name);

}


/* =====================================================
   LOAD OWN PROFILE
   ===================================================== */

async function loadOwnProfile() {

const userId =
currentUser.id;


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load your profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Your BERAKAH profile was not found.\n\n" +
"Auth ID:\n" +
userId
);

}


profile =
rows[0];

}


/* =====================================================
   LOAD PROFILE BY ID
   ===================================================== */

async function loadProfileById(id) {

if (!/^[0-9]+$/.test(id)) {

throw new Error(
"Invalid profile ID."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Profile was not found."
);

}


profile =
rows[0];

}


/* =====================================================
   LOAD PROFILE BY USERNAME
   ===================================================== */

async function loadProfileByUsername(username) {

username =
String(username || "")
.replace(/^@/, "")
.trim();


if (!username) {

throw new Error(
"Username is empty."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&username=eq." +
encodeURIComponent(username) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Username @" +
username +
" was not found."
);

}


profile =
rows[0];

}


/* =====================================================
   PROFILE NAME
   ===================================================== */

function getProfileFullName() {

return (
profile["Full name"] ||
profile.full_name ||
profile.name ||
profile.username ||
"BERAKAH"
);

}


/* =====================================================
   DISPLAY PROFILE
   ===================================================== */

function displayProfile() {

const fullName =
getProfileFullName();


const username =
profile.username ||
"berakah1357";


const language =
profile.language ||
"—";


const bio =
profile.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


document.getElementById(
"profileName"
).textContent =
fullName;


document.getElementById(
"profileUsername"
).textContent =
"@" + username;


document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
String(language).toUpperCase();


document.getElementById(
"profileBio"
).textContent =
bio;


/* AVATAR */

const avatar =
document.getElementById(
"avatar"
);


avatar.innerHTML =
"";


if (profile.avatar_url) {

const img =
document.createElement(
"img"
);

img.src =
profile.avatar_url;

img.alt =
"Profile picture";

avatar.appendChild(
img
);

}
else {

avatar.textContent =
fullName
.charAt(0)
.toUpperCase() ||
"👤";

}


/* BUTTONS */

setupProfileButtons();

}


/* =====================================================
   OWN PROFILE CHECK
   ===================================================== */

function isOwnProfile() {

if (
!currentUser ||
!profile
) {

return false;

}


if (
profile.user_id &&
String(profile.user_id).toLowerCase() ===
String(currentUser.id).toLowerCase()
) {

return true;

}


/*
Fallback for older profiles.
*/

if (!profile.user_id) {

const metadata =
currentUser.user_metadata ||
{};


const loggedUsername =
String(
metadata.username ||
metadata.user_name ||
metadata.userName ||
""
)
.replace(/^@/, "")
.toLowerCase()
.trim();


const profileUsername =
String(
profile.username ||
""
)
.replace(/^@/, "")
.toLowerCase()
.trim();


if (
loggedUsername &&
profileUsername &&
loggedUsername === profileUsername
) {

return true;

}

}


return false;

}


/* =====================================================
   PROFILE BUTTONS
   ===================================================== */

function setupProfileButtons() {

const editButton =
document.getElementById(
"editButton"
);

const followButton =
document.getElementById(
"followButton"
);


if (isOwnProfile()) {

editButton.style.display =
"inline-block";

followButton.style.display =
"none";

}
else {

editButton.style.display =
"none";

followButton.style.display =
"inline-block";

checkFollowingStatus();

}

}


/* =====================================================
   OPEN EDIT
   ===================================================== */

function openEdit() {

if (!isOwnProfile()) {

return;

}


document.getElementById(
"editFullName"
).value =
profile["Full name"] ||
profile.full_name ||
profile.name ||
"";


document.getElementById(
"editUsername"
).value =
profile.username ||
"";


document.getElementById(
"editLanguage"
).value =
profile.language ||
"ht";


document.getElementById(
"editBio"
).value =
profile.bio ||
"";


document.getElementById(
"editStatus"
).textContent =
"";


document.getElementById(
"editBox"
).style.display =
"block";

}


/* =====================================================
   CANCEL EDIT
   ===================================================== */

function cancelEdit() {

document.getElementById(
"editBox"
).style.display =
"none";

}


/* =====================================================
   SAVE PROFILE
   ===================================================== */

async function saveProfile() {

if (!isOwnProfile()) {

return;

}


const fullName =
document.getElementById(
"editFullName"
).value.trim();


const username =
document.getElementById(
"editUsername"
).value
.trim()
.replace(/^@/, "");


const language =
document.getElementById(
"editLanguage"
).value;


const bio =
document.getElementById(
"editBio"
).value.trim();


const status =
document.getElementById(
"editStatus"
);


const button =
document.getElementById(
"saveButton"
);


if (!fullName) {

status.textContent =
"Full name is required.";

return;

}


if (!username) {

status.textContent =
"Username is required.";

return;

}


button.disabled =
true;

status.textContent =
"Saving...";


try {

const updateData = {

"Full name":
fullName,

username:
username,

language:
language,

bio:
bio

};


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(
profile.id
),

{

method: "PATCH",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=representation"

}),

body:
JSON.stringify(
updateData
)

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Profile update failed:\n\n" +
text
);

}


const updatedRows =
text ?
JSON.parse(text) :
[];


if (updatedRows.length) {

profile =
updatedRows[0];

}


localStorage.setItem(
"berakah_username",
username
);


displayProfile();


status.textContent =
"Profile saved successfully!";


setTimeout(
function() {

document.getElementById(
"editBox"
).style.display =
"none";

status.textContent =
"";

},
1200
);


}
catch(error) {

console.error(
"PROFILE SAVE ERROR:",
error
);

status.textContent =
error.message;

}
finally {

button.disabled =
false;

}

}


/* =====================================================
   LOAD POSTS
   ===================================================== */

async function loadPosts() {

const userId =
profile.user_id;


if (!userId) {

displayPosts([]);

return;

}


const url =
SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&order=created_at.desc";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

console.warn(
"Posts could not be loaded:",
text
);

displayPosts([]);

return;

}


const posts =
text ?
JSON.parse(text) :
[];


displayPosts(posts);

}


/* =====================================================
   DISPLAY POSTS
   ===================================================== */

function displayPosts(posts) {

const list =
document.getElementById(
"postsList"
);


list.innerHTML =
"";


document.getElementById(
"postsCount"
).textContent =
posts.length;


if (!posts.length) {

list.innerHTML =
`<div class="empty">
No posts yet.
</div>`;

return;

}


posts.forEach(
post => {

const div =
document.createElement(
"div"
);

div.className =
"post";


let date =
"";


if (post.created_at) {

const d =
new Date(
post.created_at
);

if (!isNaN(
d.getTime()
)) {

date =
d.toLocaleString();

}

}


div.innerHTML = "";


const dateDiv =
document.createElement(
"div"
);

dateDiv.className =
"post-date";

dateDiv.textContent =
date;


const contentDiv =
document.createElement(
"div"
);

contentDiv.className =
"post-content";

contentDiv.textContent =
post.content || "";


div.appendChild(
dateDiv
);

div.appendChild(
contentDiv
);


if (post.image_url) {

const image =
document.createElement(
"img"
);

image.className =
"post-image";

image.src =
post.image_url;

image.alt =
"Post image";

div.appendChild(
image
);

}


const likeButton =
document.createElement(
"button"
);

likeButton.className =
"like-button";

likeButton.textContent =
"❤️ Like";

div.appendChild(
likeButton
);


list.appendChild(
div
);

});

}

/* =====================================================
   FOLLOW / UNFOLLOW
   ===================================================== */

async function followUser() {

if (
!currentUser ||
!profile ||
!profile.user_id ||
isOwnProfile()
) {

return;

}


const button =
document.getElementById(
"followButton"
);

const status =
document.getElementById(
"status"
);


button.disabled =
true;


try {

const checkURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const checkResponse =
await fetch(

checkURL,

{

method: "GET",

headers:
supabaseHeaders()

}

);


if (!checkResponse.ok) {

throw new Error(
"Could not check follow status."
);

}


const existing =
await checkResponse.json();


/* UNFOLLOW */

if (existing.length) {

const deleteURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const deleteResponse =
await fetch(

deleteURL,

{

method: "DELETE",

headers:
supabaseHeaders({

"Prefer":
"return=minimal"

})

}

);


if (!deleteResponse.ok) {

const errorText =
await deleteResponse.text();

throw new Error(
"Could not unfollow:\n" +
errorText
);

}


button.textContent =
"Follow";

button.className =
"action follow";

status.textContent =
"Unfollowed.";

}
/* FOLLOW */

else {

const followResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method: "POST",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profile.user_id

})

}

);


if (!followResponse.ok) {

const errorText =
await followResponse.text();

throw new Error(
"Could not follow:\n" +
errorText
);

}


button.textContent =
"Following";

button.className =
"action following";

status.textContent =
"Following.";

}


await loadFollowCounts();


setTimeout(
function() {

status.textContent =
"";

},
1500
);

}
catch(error) {

console.error(
"FOLLOW ERROR:",
error
);

status.textContent =
"Follow error: " +
error.message;

}
finally {

button.disabled =
false;

}

}


/* =====================================================
   LOAD PEOPLE
   ===================================================== */

async function loadPeople(type) {

if (
!profile ||
!profile.user_id
) {

return;

}


const peopleTitle =
document.getElementById(
"peopleTitle"
);

const peopleList =
document.getElementById(
"peopleList"
);

const peopleBox =
document.getElementById(
"peopleBox"
);


peopleBox.style.display =
"block";


peopleList.innerHTML =
`<div class="people-loading">
Loading...
</div>`;


if (type === "followers") {

peopleTitle.textContent =
"Followers";

}
else {

peopleTitle.textContent =
"Following";

}


let url;


if (type === "followers") {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id,follower_id" +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);

}
else {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id,following_id" +
"&follower_id=eq." +
encodeURIComponent(
profile.user_id
);

}


try {

const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
text
);

}


const follows =
text ?
JSON.parse(text) :
[];


if (!follows.length) {

peopleList.innerHTML =
`<div class="people-empty">
No ${type} yet.
</div>`;

return;

}


const userIds =
follows.map(
row =>
type === "followers"
? row.follower_id
: row.following_id
);


await loadPeopleProfiles(
userIds
);

}
catch(error) {

console.error(
"PEOPLE LOAD ERROR:",
error
);

peopleList.innerHTML =
`<div class="people-error">
Could not load ${type}.
</div>`;

}

}


/* =====================================================
   LOAD PEOPLE PROFILES
   ===================================================== */

async function loadPeopleProfiles(
userIds
) {

const peopleList =
document.getElementById(
"peopleList"
);


peopleList.innerHTML =
"";


for (
const userId of userIds
) {

try {

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=id,user_id,username,avatar_url,\"Full name\",full_name,name" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


if (!response.ok) {

continue;

}


const rows =
await response.json();


if (!rows.length) {

continue;

}


const person =
rows[0];


const fullName =
person["Full name"] ||
person.full_name ||
person.name ||
person.username ||
"BERAKAH";


const username =
person.username ||
"";


const div =
document.createElement(
"div"
);

div.className =
"person";


const info =
document.createElement(
"div"
);

info.className =
"person-info";


const avatar =
document.createElement(
"div"
);

avatar.className =
"person-avatar";


if (person.avatar_url) {

const img =
document.createElement(
"img"
);

img.src =
person.avatar_url;

img.alt =
"Profile picture";

avatar.appendChild(
img
);

}
else {

avatar.textContent =
fullName
.charAt(0)
.toUpperCase();

}


const textBox =
document.createElement(
"div"
);


const name =
document.createElement(
"div"
);

name.className =
"person-name";

name.textContent =
fullName;


const user =
document.createElement(
"div"
);

user.className =
"person-username";

user.textContent =
"@" + username;


textBox.appendChild(
name
);

textBox.appendChild(
user
);


info.appendChild(
avatar
);

info.appendChild(
textBox
);


const viewButton =
document.createElement(
"button"
);

viewButton.className =
"view-profile";

viewButton.textContent =
"VIEW";


viewButton.addEventListener(
"click",
function() {

window.location.href =
"profile.html?username=" +
encodeURIComponent(
username
);

}
);


div.appendChild(
info
);

div.appendChild(
viewButton
);


peopleList.appendChild(
div
);

}
catch(error) {

console.warn(
"Could not load person:",
error
);

}

}


if (!peopleList.children.length) {

peopleList.innerHTML =
`<div class="people-empty">
No profiles found.
</div>`;

}

}

/* =====================================================
   START
   ===================================================== */

async function start() {

try {

document.getElementById(
"loading"
).style.display =
"block";


document.getElementById(
"error"
).style.display =
"none";


/*
=====================================================
1. MAKE SURE WE HAVE A SESSION
=====================================================
*/

if (!accessToken) {

const refreshed =
await refreshSupabaseSession();


if (!refreshed) {

window.location.href =
"login.html";

return;

}

}


/*
=====================================================
2. VERIFY REAL SUPABASE USER
=====================================================
*/

currentUser =
await getCurrentUser();


/*
Save current Auth ID.
*/

localStorage.setItem(
"berakah_auth_user_id",
currentUser.id
);


/*
=====================================================
3. DETERMINE WHICH PROFILE TO OPEN
=====================================================
*/

const requestedId =
getURLParameter("id");


const requestedUsername =
getURLParameter("username");


if (requestedId) {

await loadProfileById(
requestedId
);

}
else if (requestedUsername) {

await loadProfileByUsername(
requestedUsername
);

}
else {

await loadOwnProfile();

}


/*
=====================================================
4. DISPLAY PROFILE
=====================================================
*/

displayProfile();


/*
=====================================================
5. LOAD POSTS
=====================================================
*/

await loadPosts();


/*
=====================================================
6. LOAD FOLLOW COUNTS
=====================================================
*/

await loadFollowCounts();


/*
=====================================================
7. SHOW PROFILE
=====================================================
*/

document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"profile"
).style.display =
"block";

}
catch(error) {

console.error(
"BERAKAH PROFILE ERROR:",
error
);


if (
error.message ===
"SESSION_EXPIRED" ||
error.message ===
"NO_SESSION"
) {

clearSession();

window.location.href =
"login.html";

return;

}


showError(
error.message
);

}

}


/* =====================================================
   START BERAKAH
   ===================================================== */

start();

</script>
