<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 850px;
  margin: 30px auto;
  padding: 0 15px;
}

.cover {
  height: 180px;
  background: #111827;
  border-radius: 18px 18px 0 0;
}

.profile-card {
  background: white;
  padding: 25px;
  border-radius: 0 0 18px 18px;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  margin-top: -70px;
  border: 5px solid white;
}

h1 {
  margin: 15px 0 5px;
}

.username {
  color: #6b7280;
}

.bio {
  line-height: 1.6;
  margin-top: 20px;
}

.stats {
  display: flex;
  gap: 35px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stat {
  cursor: default;
}

.stats strong {
  display: block;
  font-size: 20px;
}

.buttons {
  margin-top: 25px;
}

.action-button {
  padding: 11px 18px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-right: 8px;
  margin-bottom: 8px;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.action-button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 20px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: none;
}

.post-time {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 10px;
}

.post-content {
  line-height: 1.5;
  white-space: pre-wrap;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 10px;
}

.post-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.post-actions button {
  border: none;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

#loading {
  text-align: center;
  padding: 30px;
}

#error {
  text-align: center;
  color: #b91c1c;
  font-weight: bold;
  padding: 20px;
  white-space: pre-wrap;
}

#status {
  margin-top: 12px;
  font-weight: bold;
}

@media (max-width: 600px) {

  .cover {
    height: 140px;
  }

  .profile-card {
    padding: 20px;
  }

  .avatar {
    width: 90px;
    height: 90px;
    font-size: 35px;
    margin-top: -55px;
  }

}

</style>

</head>


<body>


<header>

<div class="nav">

<div class="logo">
BERAKAH
</div>

<div class="nav-buttons">

<button onclick="location.href='index.html'">
Home
</button>

<button onclick="location.href='feed.html'">
Feed
</button>

<button onclick="location.href='people.html'">
👥 People
</button>

<button onclick="location.href='marketplace.html'">
Market
</button>

<button onclick="location.href='notifications.html'">
🔔
</button>

<button
class="logout"
id="logoutButton">
Logout
</button>

</div>

</div>

</header>



<main>


<div id="loading">
Loading profile...
</div>


<div id="error"></div>


<div
id="profileContent"
style="display:none;"
>


<div class="cover"></div>


<section class="profile-card">


<div class="avatar">
