<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons a,
.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  color: #111827;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
  text-decoration: none;
  font-weight: bold;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 850px;
  margin: 30px auto;
  padding: 0 15px;
}

#loading {
  background: white;
  padding: 30px;
  border-radius: 18px;
  text-align: center;
  font-weight: bold;
}

#error {
  display: none;
  background: white;
  color: #b91c1c;
  padding: 25px;
  border-radius: 18px;
  white-space: pre-wrap;
  margin-bottom: 20px;
}

.profile {
  display: none;
}

.cover {
  height: 180px;
  background: #111827;
  border-radius: 18px 18px 0 0;
}

.profile-card {
  background: white;
  padding: 25px;
  border-radius: 0 0 18px 18px;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  font-weight: bold;
  margin-top: -70px;
  border: 5px solid white;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h1 {
  margin: 15px 0 5px;
}

.username {
  color: #6b7280;
  font-size: 16px;
}

.bio {
  line-height: 1.6;
  margin-top: 20px;
}

.stats {
  display: flex;
  gap: 35px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stat strong {
  display: block;
  font-size: 20px;
}

.buttons {
  margin-top: 25px;
}

.action-button {
  padding: 11px 18px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-right: 8px;
  margin-bottom: 8px;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.action-button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#status {
  margin-top: 10px;
  font-weight: bold;
  min-height: 20px;
}

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 20px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: none;
}

.post-time {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 10px;
}

.post-content {
  line-height: 1.5;
  white-space: pre-wrap;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 10px;
}

.post-actions {
  margin-top: 12px;
}

.post-actions button {
  border: none;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}


/* =========================================
   EDIT PROFILE
========================================= */

#editPanel {
  display: none;
  margin-top: 25px;
}

.edit-card {
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.edit-card h2 {
  margin-top: 0;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 16px;
  font-family: Arial, sans-serif;
}

.form-group textarea {
  min-height: 120px;
  resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #111827;
}

.photo-preview {
  text-align: center;
  margin-bottom: 20px;
}

.edit-avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #e5e7eb;
  margin: 0 auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 45px;
  font-weight: bold;
}

.edit-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-label {
  display: inline-block;
  padding: 10px 15px;
  background: #111827;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

#profilePhoto {
  display: none;
}

.edit-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.save-button {
  border: none;
  background: #111827;
  color: white;
  padding: 12px 20px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.cancel-button {
  border: none;
  background: #e5e7eb;
  color: #111827;
  padding: 12px 20px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

#editMessage {
  display: none;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
  font-weight: bold;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.edit-error {
  background: #fee2e2;
  color: #991b1b;
}


@media (max-width: 600px) {

  .nav {
    flex-direction: column;
    align-items: flex-start;
  }

  .nav-buttons {
    width: 100%;
  }

}

</style>

</head>

</main>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken =
localStorage.getItem(
"berakah_access_token"
);

let currentUser = null;

let profileUserId = null;

let currentProfile = null;


/* =========================================
   HEADERS
========================================= */

function headers(extra) {

return Object.assign({

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + accessToken

}, extra || {});

}


/* =========================================
   SAFE TEXT
========================================= */

function safe(value) {

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   ERROR
========================================= */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"none";

const error =
document.getElementById(
"error"
);

error.style.display =
"block";

error.textContent =
message;

}


/* =========================================
   CURRENT USER
========================================= */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"Your login session is missing. Please log in again."
);

}


const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


console.log(
"CURRENT USER:",
text
);


if (!response.ok) {

if (
response.status === 401 ||
response.status === 403
) {

throw new Error(
"Your login session has expired. Please log in again."
);

}

throw new Error(
"Login error:\n" +
text
);

}


return JSON.parse(text);

}


/* =========================================
   PROFILE ID
========================================= */

function getProfileId() {

const params =
new URLSearchParams(
window.location.search
);

return params.get("id");

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile() {


const requestedId =
getProfileId();


/*
If there is no ID,
show the logged-in user's profile.
*/

const targetId =
requestedId ||
currentUser.id;


console.log(
"PROFILE ID:",
targetId
);


/* =========================================
   GET PROFILE
========================================= */

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(targetId) +
"&limit=1",

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


console.log(
"PROFILE RESPONSE:",
text
);


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


if (!text.trim()) {

throw new Error(
"Profile not found."
);

}


const rows =
JSON.parse(text);


if (!rows.length) {

throw new Error(
"Profile not found for this account."
);

}


currentProfile =
rows[0];

profileUserId =
currentProfile.id;


/* =========================================
   NAME
========================================= */

const fullName =
currentProfile["Full name"] ||
currentProfile.username ||
"BERAKAH User";


document.getElementById(
"profileName"
).textContent =
fullName;


/* =========================================
   USERNAME
========================================= */

const username =
currentProfile.username ||
"berakahuser";


document.getElementById(
"profileUsername"
).textContent =
"@" +
username;


/* =========================================
   AVATAR
========================================= */

setAvatar(
currentProfile,
"profileAvatar"
);

const avatar =
document.getElementById(
"avatar"
);


const avatarPhoto =
currentProfile.avatar_url ||
currentProfile.profile_photo ||
currentProfile.photo_url ||
"";


if (avatarPhoto) {

avatar.innerHTML = `

<img
src="${safe(avatarPhoto)}"
alt="Profile photo">

`;

}
else {

avatar.textContent =
fullName
.charAt(0)
.toUpperCase();

}


/* =========================================
   BIO
========================================= */

document.getElementById(
"profileBio"
).textContent =
currentProfile.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


/* =========================================
   LOAD POSTS
========================================= */

const posts =
await loadPosts();


displayPosts(
posts
);


/* =========================================
   FOLLOW
========================================= */

await loadFollowCounts();

await updateFollowButton();


/* =========================================
   SHOW
========================================= */

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"block";


}


/* =========================================
   AVATAR HELPER
========================================= */

function setAvatar(
profile,
unused
) {

const fullName =
profile["Full name"] ||
profile.username ||
"BERAKAH User";


const photo =
profile.avatar_url ||
profile.profile_photo ||
profile.photo_url ||
"";


const editAvatar =
document.getElementById(
"editAvatar"
);


if (!editAvatar) {
return;
}


if (photo) {

editAvatar.innerHTML = `

<img
src="${safe(photo)}"
alt="Profile photo">

`;

}
else {

editAvatar.textContent =
fullName
.charAt(0)
.toUpperCase();

}

}


/* =========================================
   LOAD POSTS
========================================= */

async function loadPosts() {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(profileUserId) +
"&order=created_at.desc",

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


console.log(
"POSTS RESPONSE:",
text
);


if (!response.ok) {

throw new Error(
"Could not load posts:\n\n" +
text
);

}


if (!text.trim()) {

return [];

}


return JSON.parse(text);

}


/* =========================================
   DISPLAY POSTS
========================================= */

function displayPosts(posts) {

const postsList =
document.getElementById(
"postsList"
);


postsList.innerHTML =
"";


document.getElementById(
"postsCount"
).textContent =
posts.length;


if (!posts.length) {

postsList.innerHTML = `

<div class="empty">

No posts yet.

</div>

`;

return;

}


posts.forEach(
function(post) {

const div =
document.createElement(
"div"
);


div.className =
"post";


let dateText =
"Date unavailable";


if (post.created_at) {

const date =
new Date(
post.created_at
);


if (!isNaN(date.getTime())) {

dateText =
date.toLocaleString();

}

}


let imageHTML =
"";


if (post.image_url) {

imageHTML = `

<img
class="post-image"
src="${safe(post.image_url)}"
alt="Post image">

`;

}


div.innerHTML = `

<div class="post-time">

${safe(dateText)}

</div>


<div class="post-content">

${safe(post.content)}

</div>


${imageHTML}


<div class="post-actions">

<button
onclick="location.href='feed.html'">

❤️ Like

</button>

</div>

`;


postsList.appendChild(
div
);

});

}


/* =========================================
   FOLLOW COUNTS
========================================= */

async function loadFollowCounts() {


/* FOLLOWERS */

const followersResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&following_id=eq." +
encodeURIComponent(profileUserId),

{
headers: headers()
}

);


const followersText =
await followersResponse.text();


if (!followersResponse.ok) {

throw new Error(
"Could not load followers:\n\n" +
followersText
);

}


let followers = [];


if (followersText.trim()) {

followers =
JSON.parse(
followersText
);

}


/* FOLLOWING */

const followingResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(profileUserId),

{
headers: headers()
}

);


const followingText =
await followingResponse.text();


if (!followingResponse.ok) {

throw new Error(
"Could not load following:\n\n" +
followingText
);

}


let following = [];


if (followingText.trim()) {

following =
JSON.parse(
followingText
);

}


document.getElementById(
"followersCount"
).textContent =
followers.length;


document.getElementById(
"followingCount"
).textContent =
following.length;

}


/* =========================================
   CHECK FOLLOWING
========================================= */

async function checkFollowing() {

if (
String(profileUserId) ===
String(currentUser.id)
) {

return false;

}


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(currentUser.id) +
"&following_id=eq." +
encodeURIComponent(profileUserId),

{
headers: headers()
}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not check follow status:\n\n" +
text
);

}


if (!text.trim()) {

return false;

}


const rows =
JSON.parse(text);


return rows.length > 0;

}


/* =========================================
   FOLLOW BUTTON
========================================= */

async function updateFollowButton() {

const button =
document.getElementById(
"followButton"
);

const editButton =
document.getElementById(
"editButton"
);


if (
String(profileUserId) ===
String(currentUser.id)
) {

button.style.display =
"none";

editButton.style.display =
"inline-block";

return;

}


editButton.style.display =
"none";

button.style.display =
"inline-block";


const following =
await checkFollowing();


if (following) {

button.textContent =
"Following";

button.className =
"action-button following";

}
else {

button.textContent =
"Follow";

button.className =
"action-button follow";

}

}


/* =========================================
   NOTIFICATION
========================================= */

async function createFollowNotification() {

const actorName =
currentUser.user_metadata?.username ||
currentUser.email?.split("@")[0] ||
"BERAKAH User";


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/notifications",

{

method: "POST",

headers: headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

user_id:
profileUserId,

actor_id:
currentUser.id,

type:
"follow",

message:
actorName +
" follows you",

read:
false

})

}

);


if (!response.ok) {

console.error(
"Notification error:",
await response.text()
);

}

}


/* =========================================
   FOLLOW / UNFOLLOW
========================================= */

async function toggleFollow() {

const button =
document.getElementById(
"followButton"
);

const status =
document.getElementById(
"status"
);


button.disabled =
true;


try {


const following =
await checkFollowing();


if (following) {


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(currentUser.id) +
"&following_id=eq." +
encodeURIComponent(profileUserId),

{

method:
"DELETE",

headers:
headers()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not unfollow:\n\n" +
text
);

}


status.textContent =
"Unfollowed successfully.";

}
else {


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method:
"POST",

headers:
headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profileUserId

})

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not follow:\n\n" +
text
);

}


await createFollowNotification();


status.textContent =
"Following successfully.";

}


await loadFollowCounts();

await updateFollowButton();

}
catch(error) {

console.error(
"FOLLOW ERROR:",
error
);

status.textContent =
error.message;

}


button.disabled =
false;

}


/* =========================================
   EDIT PROFILE
========================================= */

function openEditProfile() {

if (
String(profileUserId) !==
String(currentUser.id)
) {

return;

}


const panel =
document.getElementById(
"editPanel"
);


panel.style.display =
"block";


/* FULL NAME */

document.getElementById(
"fullName"
).value =
currentProfile["Full name"] || "";


/* USERNAME */

document.getElementById(

/* =========================================
   PHOTO PREVIEW
========================================= */

document
.getElementById(
"profilePhoto"
)
.addEventListener(
"change",
function(event) {

const file =
event.target.files[0];


if (!file) {
return;
}


if (!file.type.startsWith("image/")) {

showEditMessage(
"Please choose an image file.",
false
);

return;

}


if (
file.size >
5 * 1024 * 1024
) {

showEditMessage(
"Photo must be smaller than 5 MB.",
false
);

return;

}


const reader =
new FileReader();


reader.onload =
function(e) {

document.getElementById(
"editAvatar"
).innerHTML = `

<img
src="${e.target.result}"
alt="Photo preview">

`;

};


reader.readAsDataURL(file);

});


/* =========================================
   EDIT MESSAGE
========================================= */

function showEditMessage(
message,
success
) {

const box =
document.getElementById(
"editMessage"
);

box.textContent =
message;

box.className =
success ?
"success" :
"edit-error";

box.style.display =
"block";

}


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile() {

const button =
document.getElementById(
"saveProfileButton"
);


button.disabled =
true;

button.textContent =
"Saving...";


try {


const fullName =
document.getElementById(
"fullName"
).value.trim();


let username =
document.getElementById(
"editUsername"
).value.trim();


const bio =
document.getElementById(
"editBio"
).value.trim();


/* REMOVE @ */

username =
username.replace(/^@/, "");


/* VALIDATE */

if (!username) {

throw new Error(
"Username is required."
);

}


if (username.length < 3) {

throw new Error(
"Username must be at least 3 characters."
);

}


if (
!/^[a-zA-Z0-9_]+$/.test(username)
) {

throw new Error(
"Username can only contain letters, numbers, and underscores."
);

}


/* =========================================
   UPDATE PROFILE
========================================= */

const updateData = {

"Full name":
fullName,

username:
username,

bio:
bio

};


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(currentUser.id),

{

method:
"PATCH",

headers:
headers({

"Content-Type":
"application/json",

"Prefer":
"return=representation"

}),

body:
JSON.stringify(
updateData
)

}

);


const text =
await response.text();


console.log(
"SAVE PROFILE:",
text
);


if (!response.ok) {

throw new Error(
"Could not save profile:\n\n" +
text
);

}


if (!text.trim()) {

throw new Error(
"Profile was not updated. Check your Supabase RLS policy."
);

}


/* =========================================
   UPDATE LOCAL PROFILE
========================================= */

currentProfile =
JSON.parse(text)[0];


/* =========================================
   UPDATE PAGE IMMEDIATELY
========================================= */

document.getElementById(
"profileName"
).textContent =
fullName ||
username;


document.getElementById(
"profileUsername"
).textContent =
"@" +
username;


document.getElementById(
"profileBio"
).textContent =
bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


/* AVATAR */

const avatar =
document.getElementById(
"avatar"
);


avatar.textContent =
(
fullName ||
username
)
.charAt(0)
.toUpperCase();


const editAvatar =
document.getElementById(
"editAvatar"
);


editAvatar.textContent =
(
fullName ||
username
)
.charAt(0)
.toUpperCase();


/* =========================================
   CLOSE EDITOR
========================================= */

document.getElementById(
"editPanel"
).style.display =
"none";


showEditMessage(
"",
true
);


document.getElementById(
"status"
).textContent =
"Profile updated successfully! ✅";


}
catch(error) {

console.error(
"SAVE ERROR:",
error
);

showEditMessage(
error.message,
false
);

}
finally {

button.disabled =
false;

button.textContent =
"💾 SAVE CHANGES";

}

}
