<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 850px;
  margin: 30px auto;
  padding: 0 15px;
}

.cover {
  height: 180px;
  background: #111827;
  border-radius: 18px 18px 0 0;
}

.profile-card {
  background: white;
  padding: 25px;
  border-radius: 0 0 18px 18px;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  margin-top: -70px;
  border: 5px solid white;
}

h1 {
  margin: 15px 0 5px;
}

.username {
  color: #6b7280;
}

.bio {
  line-height: 1.6;
  margin-top: 20px;
}

.stats {
  display: flex;
  gap: 35px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stats strong {
  display: block;
  font-size: 20px;
}

.buttons {
  margin-top: 25px;
}

.action-button {
  padding: 11px 18px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-right: 8px;
  margin-bottom: 8px;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 20px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: none;
}

.post-time {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 10px;
}

.post-content {
  line-height: 1.5;
  white-space: pre-wrap;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 10px;
}

.post-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.post-actions button {
  border: none;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.post-actions button.liked {
  background: #fee2e2;
}

.delete-button {
  color: #b91c1c;
}

#loading {
  text-align: center;
  padding: 30px;
}

#error {
  text-align: center;
  color: #b91c1c;
  font-weight: bold;
  padding: 20px;
  white-space: pre-wrap;
}

@media (max-width: 600px) {

  .cover {
    height: 140px;
  }

  .profile-card {
    padding: 20px;
  }

  .avatar {
    width: 90px;
    height: 90px;
    font-size: 35px;
    margin-top: -55px;
  }

}

</style>

</head>


<body>


<header>

<div class="nav">

<div class="logo">
BERAKAH
</div>

<div class="nav-buttons">

<button onclick="location.href='index.html'">
Home
</button>

<button onclick="location.href='feed.html'">
Feed
</button>

<button onclick="location.href='people.html'">
👥 People
</button>

<button onclick="location.href='marketplace.html'">
Market
</button>

<button onclick="location.href='notifications.html'">
🔔
</button>

<button
class="logout"
id="logoutButton">
Logout
</button>

</div>

</div>

</header>



<main>


<div id="loading">
Loading profile...
</div>


<div id="error"></div>


<div id="profileContent" style="display:none;">


<div class="cover"></div>


<section class="profile-card">


<div class="avatar">
👤
</div>


<h1 id="profileName">
BERAKAH User
</h1>


<div
class="username"
id="profileUsername">
@berakahuser
</div>


<p
class="bio"
id="profileBio">
Welcome to my BERAKAH profile.
Connect, share, build, and grow together.
</p>


<div class="stats">

<div>

<strong id="followersCount">
0
</strong>

Followers

</div>


<div>

<strong id="followingCount">
0
</strong>

Following

</div>


<div>

<strong id="postsCount">
0
</strong>

Posts

</div>

</div>


<div class="buttons">


<button
id="followButton"
class="action-button follow"
style="display:none;">
Follow
</button>


<button
id="editButton"
class="action-button primary"
style="display:none;">
EDIT PROFILE
</button>


<button
class="action-button secondary"
onclick="location.href='messages.html'">
💬 MESSAGES
</button>


<button
class="action-button secondary"
onclick="location.href='notifications.html'">
🔔 NOTIFICATIONS
</button>


</div>

</section>



<section class="posts">

<h2>Posts</h2>

<div id="postsList"></div>

</section>


</div>

</main>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


const accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;

let profileUserId = null;


/* =========================
   HEADERS
========================= */

function headers(extra) {

  return Object.assign({

    "apikey":
    SUPABASE_ANON_KEY,

    "Authorization":
    "Bearer " + accessToken

  }, extra || {});

}


/* =========================
   SAFE HTML
========================= */

function safe(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================
   CURRENT USER
========================= */

async function getCurrentUser() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/user",

      {
        headers:
        headers()
      }

    );


  if (!response.ok) {

    throw new Error(
      "Your login session has expired."
    );

  }


  return await response.json();

}


/* =========================
   GET PROFILE ID
========================= */

function getProfileId() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  /*
   First try ?id=
  */

  const id =
    params.get("id");


  if (id) {

    return id;

  }


  /*
   Then try ?username=
  */

  const username =
    params.get("username");


  if (username) {

    return username;

  }


  /*
   If nothing was supplied,
   show current user.
  */

  return currentUser.id;

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

  try {


    currentUser =
      await getCurrentUser();


    profileUserId =
      getProfileId();


    let userPosts = [];


    /* =========================
       IF PROFILE ID
    ========================= */

    if (
      profileUserId ===
      currentUser.id
      ||
      /^[0-9a-f-]{36}$/i.test(
        profileUserId
      )
    ) {


      const response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/posts" +
          "?select=*" +
          "&user_id=eq." +
          encodeURIComponent(
            profileUserId
          ) +
          "&order=created_at.desc",

          {
            headers:
            headers()
          }

        );


      const text =
        await response.text();


      if (!response.ok) {

        throw new Error(
          text ||
          "Could not load posts."
        );

      }


      if (text.trim()) {

        userPosts =
          JSON.parse(text);

      }

    }


    /* =========================
       IF USERNAME
    ========================= */

    else {


      const response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/posts" +
          "?select=*" +
          "&username=eq." +
          encodeURIComponent(
            profileUserId
          ) +
          "&order=created_at.desc",

          {
            headers:
            headers()
          }

        );


      const text =
        await response.text();


      if (!response.ok) {

        throw new Error(
          text ||
          "Could not load profile."
        );

      }


      if (text.trim()) {

        userPosts =
          JSON.parse(text);

      }


      if (userPosts.length) {

        profileUserId =
          userPosts[0].user_id;

      }

    }


    /* =========================
       FIND USERNAME
    ========================= */

    let username =
      "BERAKAH User";


    if (userPosts.length) {

      username =
        userPosts[0].username ||
        "BERAKAH User";

    }
    else if (
      String(profileUserId) ===
      String(currentUser.id)
    ) {

      username =
        currentUser
        .user_metadata
        ?.username ||

        currentUser
        .email
        ?.split("@")[0] ||

        "BERAKAH User";

    }


    /* =========================
       PROFILE DISPLAY
    ========================= */

    document.getElementById(
      "profileName"
    ).textContent =
      username;


    document.getElementById(
      "profileUsername"
    ).textContent =
      "@" +
      username.toLowerCase();


    document.getElementById(
      "profileBio"
    ).textContent =
      "Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


    document.getElementById(
      "postsCount"
    ).textContent =
      userPosts.length;


    /* =========================
       POSTS
    ========================= */

    const postsList =
      document.getElementById(
        "postsList"
      );


    postsList.innerHTML = "";


    if (!userPosts.length) {

      postsList.innerHTML =

        "<div class='post'>" +
        "No posts yet." +
        "</div>";

    }


    else {


      userPosts.forEach(
        function(post) {


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "post";


          /* DATE FIX */

          let formattedDate =
            "Date unavailable";


          if (
            post.created_at
          ) {

            const date =
              new Date(
                post.created_at
              );


            if (
              !isNaN(
                date.getTime()
              )
            ) {

              formattedDate =
                date.toLocaleString();

            }

          }


          /* =========================
             POST
          ========================= */

          div.innerHTML = `

            <div class="post-time">

              ${safe(formattedDate)}

            </div>


            <div class="post-content">

              ${safe(post.content)}

            </div>


            ${
              post.image_url

              ?

              `
              <img
                class="post-image"
                src="${safe(post.image_url)}"
                alt="Post image"
              >
              `

              :

              ""
            }


            <div class="post-actions">

              <button
                onclick="location.href='feed.html'">

                ❤️ Like

              </button>

            </div>

          `;


          postsList.appendChild(
            div
          );

        }
      );

    }


    /* =========================
       OWN PROFILE
    ========================= */

    if (
      String(profileUserId) ===
      String(currentUser.id)
    ) {

      document.getElementById(
        "editButton"
      ).style.display =
        "inline-block";


      document.getElementById(
        "followButton"
      ).style.display =
        "none";

    }


    /* =========================
       OTHER USER
    ========================= */

    else {

      document.getElementById(
        "followButton"
      ).style.display =
        "inline-block";

    }


    /* =========================
       SHOW PROFILE
    ========================= */

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "profileContent"
    ).style.display =
      "block";


  }

  catch(error) {


    console.error(
      error
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "error"
    ).textContent =
      "Could not load profile.\n\n" +
      error.message;

  }

}


/* =========================
   EDIT PROFILE
========================= */

document
.getElementById("editButton")
.addEventListener(
  "click",
  function() {

    alert(
      "Profile editing is coming next."
    );

  }
);


/* =========================
   FOLLOW BUTTON
========================= */

document
.getElementById("followButton")
.addEventListener(
  "click",
  function() {

    alert(
      "Follow system is the next step."
    );

  }
);


/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutButton")
.addEventListener(
  "click",
  function() {

    localStorage.removeItem(
      "berakah_access_token"
    );

    localStorage.removeItem(
      "berakah_refresh_token"
    );

    localStorage.removeItem(
      "berakah_user"
    );

    location.href =
      "login.html";

  }
);


/* =========================
   START
========================= */

if (!accessToken) {

  location.href =
    "login.html";

}
else {

  loadProfile();

}

</script>

</body>
</html>
