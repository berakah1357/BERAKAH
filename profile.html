<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav {
  max-width: 1000px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 2px;
}

.nav-links {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-links a,
.nav-links button {
  text-decoration: none;
  border: 1px solid #d1d5db;
  background: #fff;
  color: #111827;
  padding: 8px 11px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}

.nav-links .logout {
  background: #111827;
  color: white;
}

main {
  max-width: 900px;
  margin: 25px auto;
  padding: 0 15px;
}

.loading,
.error {
  background: white;
  border-radius: 16px;
  padding: 30px;
  text-align: center;
}

.error {
  display: none;
  color: #b91c1c;
  text-align: left;
  white-space: pre-wrap;
}

.profile {
  display: none;
}

.cover {
  height: 190px;
  background: linear-gradient(135deg, #111827, #374151);
  border-radius: 18px 18px 0 0;
}

.profile-card {
  background: white;
  padding: 25px;
  border-radius: 0 0 18px 18px;
}

.avatar {
  width: 115px;
  height: 115px;
  margin-top: -70px;
  border-radius: 50%;
  background: #e5e7eb;
  border: 5px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 46px;
  font-weight: bold;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h1 {
  margin: 14px 0 4px;
}

.username {
  color: #6b7280;
}

.language {
  color: #6b7280;
  margin-top: 7px;
}

.bio {
  margin-top: 20px;
  line-height: 1.6;
}

.stats {
  display: flex;
  gap: 12px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stat {
  min-width: 120px;
}

.stat-button {
  border: 0;
  background: transparent;
  padding: 8px 15px;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
}

.stat-button:hover {
  background: #f3f4f6;
}

.stat strong {
  display: block;
  font-size: 21px;
}

.actions {
  margin-top: 25px;
}

.action {
  border: 0;
  border-radius: 8px;
  padding: 11px 17px;
  margin-right: 7px;
  margin-bottom: 7px;
  font-weight: bold;
  cursor: pointer;
}

.action:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.status {
  margin-top: 12px;
  font-weight: bold;
}

.edit-box {
  display: none;
  margin-top: 20px;
  padding: 20px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
}

.edit-box label {
  display: block;
  font-weight: bold;
  margin: 14px 0 6px;
}

.edit-box input,
.edit-box textarea,
.edit-box select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
}

.edit-box textarea {
  min-height: 100px;
  resize: vertical;
}

.save,
.cancel {
  margin-top: 15px;
  padding: 11px 17px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.save {
  background: #111827;
  color: white;
}

.cancel {
  background: #e5e7eb;
}

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 18px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: 0;
}

.post-date {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 9px;
}

.post-content {
  white-space: pre-wrap;
  line-height: 1.6;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 12px;
}

.like-button {
  margin-top: 12px;
  border: 0;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}

/* =====================================================
   FOLLOWERS / FOLLOWING MODAL
   ===================================================== */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 1000;
  padding: 20px;
  align-items: center;
  justify-content: center;
}

.modal.show {
  display: flex;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 500px;
  max-height: 80vh;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,.25);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 20px;
  border-bottom: 1px solid #e5e7eb;
}

.modal-header h2 {
  margin: 0;
  font-size: 20px;
}

.close-modal {
  border: 0;
  background: #f3f4f6;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
}

.people-list {
  padding: 10px;
  max-height: 65vh;
  overflow-y: auto;
}

.people-loading,
.people-empty {
  padding: 35px 20px;
  text-align: center;
  color: #6b7280;
}

.person {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
}

.person:hover {
  background: #f3f4f6;
}

.person-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  overflow: hidden;
  flex-shrink: 0;
}

.person-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.person-info {
  min-width: 0;
}

.person-name {
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.person-username {
  color: #6b7280;
  font-size: 14px;
  margin-top: 3px;
}

@media (max-width: 650px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .nav-links {
    width: 100%;
  }

  .cover {
    height: 150px;
  }

  .profile-card {
    padding: 20px;
  }

  .stats {
    gap: 5px;
  }

  .stat-button {
    padding: 8px 10px;
  }

  .modal {
    padding: 10px;
  }

}

</style>

<script>

/* =====================================================
   BERAKAH SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
   ===================================================== */

const accessToken =
localStorage.getItem(
"berakah_access_token"
);

let currentUser = null;

let profile = null;


/* =====================================================
   SUPABASE HEADERS
   ===================================================== */

function supabaseHeaders(extra = {}) {

return {

"apikey": SUPABASE_KEY,

"Authorization":
"Bearer " + accessToken,

...extra

};

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


/* =====================================================
   ERROR
   ===================================================== */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"none";

const error =
document.getElementById(
"error"
);

error.style.display =
"block";

error.textContent =
message;

}


/* =====================================================
   URL PARAMETERS
   ===================================================== */

function getURLParameter(name) {

const params =
new URLSearchParams(
window.location.search
);

return params.get(name);

}


/* =====================================================
   AUTH USER
   ===================================================== */

async function getCurrentUser() {

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

headers:
supabaseHeaders()

}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Could not verify login:\n\n" +
text
);

}

if (!text) {

throw new Error(
"No logged-in user was returned."
);

}

return JSON.parse(text);

}


/* =====================================================
   LOAD OWN PROFILE
   ===================================================== */

async function loadOwnProfile() {

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&limit=1";

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Could not load your profile:\n\n" +
text
);

}

const rows =
text ?
JSON.parse(text) :
[];

if (!rows.length) {

throw new Error(
"Your BERAKAH profile was not found."
);

}

profile =
rows[0];

displayProfile();

}


/* =====================================================
   LOAD PROFILE BY ID
   ===================================================== */

async function loadProfileById(id) {

if (!/^[0-9]+$/.test(id)) {

throw new Error(
"Invalid profile ID."
);

}

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&limit=1";

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}

const rows =
text ?
JSON.parse(text) :
[];

if (!rows.length) {

throw new Error(
"Profile was not found."
);

}

profile =
rows[0];

displayProfile();

}


/* =====================================================
   LOAD PROFILE BY USERNAME
   ===================================================== */

async function loadProfileByUsername(username) {

username =
String(username || "")
.replace("@", "")
.trim();

if (!username) {

throw new Error(
"Username is empty."
);

}

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&username=eq." +
encodeURIComponent(username) +
"&limit=1";

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}

const rows =
text ?
JSON.parse(text) :
[];

if (!rows.length) {

throw new Error(
"Username @" +
username +
" was not found."
);

}

profile =
rows[0];

displayProfile();

}


/* =====================================================
   DISPLAY PROFILE
   ===================================================== */

function displayProfile() {

const fullName =
profile["Full name"] ||
profile.full_name ||
profile.name ||
profile.username ||
"BERAKAH";

const username =
profile.username ||
"berakah1357";

const language =
profile.language ||
"—";

const bio =
profile.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";

document.getElementById(
"profileName"
).textContent =
fullName;

document.getElementById(
"profileUsername"
).textContent =
"@" +
username;

document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
language.toUpperCase();

document.getElementById(
"profileBio"
).textContent =
bio;


/* AVATAR */

const avatar =
document.getElementById(
"avatar"
);

if (profile.avatar_url) {

avatar.innerHTML =
`<img
src="${escapeHTML(profile.avatar_url)}"
alt="Profile picture">`;

}
else {

avatar.textContent =
fullName
.charAt(0)
.toUpperCase();

}

setupEditPermission();

}


/* =====================================================
   OWN PROFILE CHECK
   ===================================================== */

function isOwnProfile() {

if (!currentUser || !profile) {

return false;

}

if (
profile.user_id &&
String(profile.user_id).toLowerCase() ===
String(currentUser.id).toLowerCase()
) {

return true;

}

return false;

}


/* =====================================================
   EDIT / FOLLOW
   ===================================================== */

function setupEditPermission() {

const editButton =
document.getElementById(
"editButton"
);

const followButton =
document.getElementById(
"followButton"
);

if (isOwnProfile()) {

editButton.style.display =
"inline-block";

followButton.style.display =
"none";

}
else {

editButton.style.display =
"none";

followButton.style.display =
"profile";

checkFollowingStatus();

}

}


/* =====================================================
   OPEN EDIT
   ===================================================== */

function openEdit() {

if (!isOwnProfile()) {

return;

}

document.getElementById(
"editFullName"
).value =
profile["Full name"] ||
profile.full_name ||
profile.name ||
"";

document.getElementById(
"editUsername"
).value =
profile.username ||
"";

document.getElementById(
"editLanguage"
).value =
profile.language ||
"ht";

document.getElementById(
"editBio"
).value =
profile.bio ||
"";

document.getElementById(
"editStatus"
).textContent =
"";

document.getElementById(
"editBox"
).style.display =
"block";

}


/* =====================================================
   CANCEL EDIT
   ===================================================== */

function cancelEdit() {

document.getElementById(
"editBox"
).style.display =
"none";

}


/* =====================================================
   SAVE PROFILE
   ===================================================== */

async function saveProfile() {

if (!isOwnProfile()) {

return;

}

const fullName =
document.getElementById(
"editFullName"
).value.trim();

const username =
document.getElementById(
"editUsername"
).value
.trim()
.replace(/^@+/, "");

const language =
document.getElementById(
"editLanguage"
).value;

const bio =
document.getElementById(
"editBio"
).value.trim();

const status =
document.getElementById(
"editStatus"
);

const button =
document.getElementById(
"saveButton"
);

if (!fullName) {

status.textContent =
"Full name is required.";

return;

}

if (!username) {

status.textContent =
"Username is required.";

return;

}

button.disabled =
true;

status.textContent =
"Saving...";

try {

const updateData = {

"Full name":
fullName,

username:
username,

language:
language,

bio:
bio

};

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(
profile.id
),

{

method: "PATCH",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=representation"

}),

body:
JSON.stringify(
updateData
)

}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(text);

}

const rows =
text ?
JSON.parse(text) :
[];

if (rows.length) {

profile =
rows[0];

}

localStorage.setItem(
"berakah_username",
username
);

displayProfile();

status.textContent =
"Profile saved successfully!";

setTimeout(
() => {

document.getElementById(
"editBox"
).style.display =
"none";

status.textContent =
"";

},
1200
);

}
catch(error) {

console.error(error);

status.textContent =
"Profile update failed:\n" +
error.message;

}

button.disabled =
false;

}


/* =====================================================
   LOAD POSTS
   ===================================================== */

async function loadPosts() {

if (!profile.user_id) {

displayPosts([]);

return;

}

const url =
SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(
profile.user_id
) +
"&order=created_at.desc";

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);

const text =
await response.text();

if (!response.ok) {

console.warn(
"Posts could not be loaded:",
text
);

displayPosts([]);

return;

}

const posts =
text ?
JSON.parse(text) :
[];

displayPosts(posts);

}


/* =====================================================
   DISPLAY POSTS
   ===================================================== */

function displayPosts(posts) {

const list =
document.getElementById(
"postsList"
);

list.innerHTML =
"";

document.getElementById(
"postsCount"
).textContent =
posts.length;

if (!posts.length) {

list.innerHTML =
`<div class="empty">
No posts yet.
</div>`;

return;

}

posts.forEach(post => {

const div =
document.createElement(
"div"
);

div.className =
"post";

let date = "";

if (post.created_at) {

const d =
new Date(
post.created_at
);

if (!isNaN(d.getTime())) {

date =
d.toLocaleString();

}

}

let image = "";

if (post.image_url) {

image =
`<img
class="post-image"
src="${escapeHTML(post.image_url)}"
alt="Post image">`;

}

div.innerHTML = `

<div class="post-date">
${escapeHTML(date)}
</div>

<div class="post-content">
${escapeHTML(post.content || "")}
</div>

${image}

<button class="like-button">
❤️ Like
</button>

`;

list.appendChild(div);

});

}


/* =====================================================
   LOAD FOLLOW COUNTS
   ===================================================== */

async function loadFollowCounts() {

if (!profile || !profile.user_id) {

return;

}


/* FOLLOWERS */

const followersURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);

const followersResponse =
await fetch(

followersURL,

{

headers:
supabaseHeaders()

}

);

if (followersResponse.ok) {

const rows =
await followersResponse.json();

document.getElementById(
"followersCount"
).textContent =
rows.length;

}


/* FOLLOWING */

const followingURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
profile.user_id
);

const followingResponse =
await fetch(

followingURL,

{

headers:
supabaseHeaders()

}

);

if (followingResponse.ok) {

const rows =
await followingResponse.json();

document.getElementById(
"followingCount"
).textContent =
rows.length;

}

}


/* =====================================================
   CHECK FOLLOWING
   ===================================================== */

async function checkFollowingStatus() {

if (
!currentUser ||
!profile ||
!profile.user_id ||
isOwnProfile()
) {

return;

}

const url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);

try {

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);

if (!response.ok) {

return;

}

const rows =
await response.json();

const button =
document.getElementById(
"followButton"
);

if (rows.length) {

"Following";

button.className =

}

}
catch(error) {

);

}

}


/* =====================================================
   FOLLOW / UNFOLLOW
   ===================================================== */

async function followUser() {

if (
!currentUser ||
!profile ||
!profile.user_id ||
isOwnProfile()
) {

return;

}

const button =
document.getElementById(
"followButton"
);

const status =
document.getElementById(
"status"
);

button.disabled =
true;

status.textContent =
"";

try {

const checkURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);

const checkResponse =
await fetch(

checkURL,

{

headers:
supabaseHeaders()

}

);

if (!checkResponse.ok) {

throw new Error(
await checkResponse.text()
);

}

const existing =
await checkResponse.json();


/* UNFOLLOW */

if (existing.length) {

const deleteURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);

const deleteResponse =
await fetch(

deleteURL,

{

method: "DELETE",

headers:
supabaseHeaders()

}

);

if (!deleteResponse.ok) {

throw new Error(
"Could not unfollow this person."
);

}

button.textContent =
"Follow";

button.className =
"action follow";

status.textContent =
"Unfollowed.";

}


/* FOLLOW */

else {

const followResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method: "POST",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profile.user_id

})

}

);

if (!followResponse.ok) {

const text =
await followResponse.text();

throw new Error(text);

}

button.textContent =
"Following";

button.className =
"action following";

status.textContent =
"Following.";

}

await loadFollowCounts();

}
catch(error) {

console.error(
"FOLLOW ERROR:",
error
);

status.textContent =
"Follow error: " +
error.message;

}

button.disabled =
false;

}


/* =====================================================
   LOAD PEOPLE
   ===================================================== */

async function loadPeople(type) {

if (!profile || !profile.user_id) {

return;

}

const list =
document.getElementById(
"peopleList"
);

const title =
document.getElementById(
"modalTitle"
);

title.textContent =
type === "followers"
? "Followers"
: "Following";

list.innerHTML =
`<div class="people-loading">
Loading...
</div>`;

document.getElementById(
"peopleModal"
).classList.add("show");

try {

let url;

if (type === "followers") {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=*" +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
) +
"&order=created_at.desc";

}
else {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=*" +
"&follower_id=eq." +
encodeURIComponent(
profile.user_id
) +
"&order=created_at.desc";

}

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(text);

}

const follows =
text ?
JSON.parse(text) :
[];

if (!follows.length) {

list.innerHTML =
`<div class="people-empty">
No ${type} yet.
</div>`;

return;

}


/*
Get each user's profile.
*/

const people =
await Promise.all(

follows.map(
async follow => {

const userId =
type === "followers"
? follow.follower_id
: follow.following_id;

return await getProfileByUserId(
userId
);

}
)

);

const validPeople =
people.filter(Boolean);

if (!validPeople.length) {

list.innerHTML =
`<div class="people-empty">
No profiles found.
</div>`;

return;

}

list.innerHTML =
"";

validPeople.forEach(
person => {

const item =
document.createElement(
"div"
);

item.className =
"person";

const fullName =
person["Full name"] ||
person.full_name ||
person.name ||
person.username ||
"BERAKAH";

const username =
person.username ||
"";

const avatar =
person.avatar_url
?
`<img
src="${escapeHTML(person.avatar_url)}"
alt="Profile picture">`
:
escapeHTML(
fullName
.charAt(0)
.toUpperCase()
);

item.innerHTML = `

<div class="person-avatar">
${avatar}
</div>

<div class="person-info">

<div class="person-name">
${escapeHTML(fullName)}
</div>

<div class="person-username">
@${escapeHTML(username)}
</div>

</div>

`;

item.addEventListener(
"click",
function() {

window.location.href =
"profile.html?username=" +
encodeURIComponent(
username
);

}
);

list.appendChild(item);

});

}
catch(error) {

console.error(
"PEOPLE LIST ERROR:",
error
);

list.innerHTML =
`<div class="people-empty">
Could not load this list.
</div>`;

}

}


/* =====================================================
   GET PROFILE BY USER ID
   ===================================================== */

async function getProfileByUserId(userId) {

if (!userId) {

return null;

}

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";

try {

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);

if (!response.ok) {

return null;

}

const rows =
await response.json();

return rows.length
? rows[0]
: null;

}
catch(error) {

console.warn(
"Could not load person:",
error
);

return null;

}

}

   ===================================================== */

async function start() {

try {

if (!accessToken) {

window.location.href =
"login.html";

return;

}

currentUser =
await getCurrentUser();

const requestedId =
getURLParameter("id");

const requestedUsername =
getURLParameter("username");

if (requestedId) {

await loadProfileById(
requestedId
);

}
else if (requestedUsername) {

await loadProfileByUsername(
requestedUsername
);

}
else {

await loadOwnProfile();

}

await loadPosts();

await loadFollowCounts();

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"block";

}
catch(error) {

console.error(
"BERAKAH PROFILE ERROR:",
error
);

showError(
error.message
);

}

}

start();
