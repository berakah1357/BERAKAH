<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BERAKAH - Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    header a {
      text-decoration: none;
      color: #111827;
      font-weight: bold;
    }

    .profile {
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
    }

    .cover {
      height: 180px;
      background: #111827;
      border-radius: 18px 18px 0 0;
    }

    .profile-card {
      background: white;
      padding: 25px;
      border-radius: 0 0 18px 18px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      margin-top: -70px;
      border: 5px solid white;
    }

    h1 {
      margin: 15px 0 5px;
    }

    .username {
      color: #6b7280;
    }

    .bio {
      margin-top: 20px;
      line-height: 1.6;
    }

    .stats {
      display: flex;
      gap: 35px;
      margin-top: 25px;
    }

    .stats strong {
      display: block;
      font-size: 20px;
    }

    .buttons {
      margin-top: 25px;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .posts {
      margin-top: 25px;
      background: white;
      padding: 25px;
      border-radius: 18px;
    }

    .post {
      padding: 20px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .post:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">BERAKAH</div>
    <a href="index.html">HOME</a>
  </header>

  <main class="profile">

    <div class="cover"></div>

    <section class="profile-card">

      <div class="avatar">👤</div>

      <h1>BERAKAH User</h1>

      <div class="username">@berakahuser</div>

      <p class="bio">
        Welcome to my BERAKAH profile.
        Connect, share, build, and grow together.
      </p>

      <div class="stats">
        <div>
          <strong>0</strong>
          Followers
        </div>

        <div>
          <strong>0</strong>
          Following
        </div>

        <div>
          <strong>0</strong>
          Posts
        </div>
      </div>

      <div class="buttons">
        <button class="primary">EDIT PROFILE</button>
        <button class="secondary">SHARE PROFILE</button>
      </div>

    </section>

    <section class="posts">

      <h2>Posts</h2>

      <div class="post">
        Your BERAKAH posts will appear here.
      </div>

    </section>

  </main>

</body>
</html>
