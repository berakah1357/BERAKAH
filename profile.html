<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav {
  max-width: 1000px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 2px;
}

.nav-links {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-links a,
.nav-links button {
  text-decoration: none;
  border: 1px solid #d1d5db;
  background: #fff;
  color: #111827;
  padding: 8px 11px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}

.nav-links .logout {
  background: #111827;
  color: white;
}

main {
  max-width: 900px;
  margin: 25px auto;
  padding: 0 15px;
}

.loading,
.error {
  background: white;
  border-radius: 16px;
  padding: 30px;
  text-align: center;
}

.error {
  display: none;
  color: #b91c1c;
  text-align: left;
  white-space: pre-wrap;
}

.profile {
  display: none;
}

.cover {
  height: 190px;
  background: linear-gradient(135deg, #111827, #374151);
  border-radius: 18px 18px 0 0;
}

.profile-card {
  background: white;
  padding: 25px;
  border-radius: 0 0 18px 18px;
}

.avatar {
  width: 115px;
  height: 115px;
  margin-top: -70px;
  border-radius: 50%;
  background: #e5e7eb;
  border: 5px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 46px;
  font-weight: bold;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h1 {
  margin: 14px 0 4px;
}

.username {
  color: #6b7280;
}

.language {
  color: #6b7280;
  margin-top: 7px;
}

.bio {
  margin-top: 20px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.stats {
  display: flex;
  gap: 12px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stat {
  min-width: 120px;
  border: 1px solid #e5e7eb;
  background: #f9fafb;
  padding: 13px 18px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.stat:hover {
  background: #eef2ff;
  transform: translateY(-1px);
}

.stat strong {
  display: block;
  font-size: 21px;
  margin-bottom: 3px;
}

.actions {
  margin-top: 25px;
}

.action {
  border: 0;
  border-radius: 8px;
  padding: 11px 17px;
  margin-right: 7px;
  margin-bottom: 7px;
  font-weight: bold;
  cursor: pointer;
}

.action:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.status {
  margin-top: 12px;
  font-weight: bold;
  min-height: 20px;
}

.edit-box {
  display: none;
  margin-top: 20px;
  padding: 20px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
}

.edit-box label {
  display: block;
  font-weight: bold;
  margin: 14px 0 6px;
}

.edit-box input,
.edit-box textarea,
.edit-box select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  background: white;
}

.edit-box textarea {
  min-height: 100px;
  resize: vertical;
}

.save,
.cancel {
  margin-top: 15px;
  padding: 11px 17px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.save {
  background: #111827;
  color: white;
}

.cancel {
  background: #e5e7eb;
  color: #111827;
}

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 18px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {

}

.post-date {
  color: #6b7280;
  font-size: 12px;

}

.post-content {
  white-space: pre-wrap;
  line-height: 1.6;
}

.post-image {

  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 12px;
}

.like-button {
  margin-top: 12px;
  border: 0;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}


/* =====================================================
   FOLLOWERS / FOLLOWING MODAL
   ===================================================== */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 1000;
  padding: 20px;
  overflow-y: auto;
}

.modal.show {

}

.modal-box {
  width: 100%;

}

.modal-header {

  justify-content: space-between;

}

.modal-header h2 {

}

.close-modal {
  width: 36px;

  border: 0;
  border-radius: 50%;
  background: #f3f4f6;
  font-size: 22px;
  cursor: pointer;
}

.modal-body {
  padding: 10px 15px 20px;
  max-height: 65vh;
  overflow-y: auto;
}

.person {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 5px;
  border-bottom: 1px solid #f0f0f0;
}

.person:last-child {
  border-bottom: 0;
}

.person-avatar {
  width: 50px;
  height: 50px;
  min-width: 50px;
  border-radius: 50%;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 20px;
  overflow: hidden;
}

.person-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.person-info {
  flex: 1;
  min-width: 0;
}

.person-name {
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.person-username {
  color: #6b7280;
  font-size: 14px;
  margin-top: 3px;
}

.person-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.person-button {
  border: 0;
  border-radius: 7px;
  padding: 8px 11px;
  font-weight: bold;
  cursor: pointer;
}

.view-button {
  background: #111827;
  color: white;
}

.follow-small {
  background: #111827;
  color: white;
}

.following-small {
  background: #e5e7eb;
  color: #111827;
}

.modal-loading {
  text-align: center;
  padding: 35px 10px;
  color: #6b7280;
}

.modal-empty {
  text-align: center;
  padding: 35px 10px;
  color: #6b7280;
}

.modal-error {
  color: #b91c1c;
  text-align: center;
  padding: 25px 10px;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 650px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .nav-links {
    width: 100%;
  }

  .nav-links a,
  .nav-links button {
    font-size: 13px;
  }

  .cover {
    height: 145px;
  }

  .profile-card {
    padding: 20px;
  }

  .avatar {
    width: 100px;

    margin-top: -60px;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .stat {
    min-width: 0;
  }

  .modal {
    padding: 10px;
  }

  .modal-box {
    max-height: 90vh;
  }

  .person {
    align-items: flex-start;
  }

  .person-actions {
    flex-direction: column;
  }

}

</style>

<script>

/* =====================================================
   BERAKAH SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
   ===================================================== */

let accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;

let profile = null;


/* =====================================================
   SUPABASE HEADERS
   ===================================================== */

function supabaseHeaders(extra = {}) {

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + accessToken,

...extra

};

}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


/* =====================================================
   ERROR
   ===================================================== */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"none";

const error =
document.getElementById(
"error"
);

error.style.display =
"block";

error.textContent =
message;

}


/* =====================================================
   URL PARAMETERS
   ===================================================== */

function getURLParameter(name) {

const params =
new URLSearchParams(
window.location.search
);

return params.get(name);

}


/* =====================================================
   CURRENT SUPABASE AUTH USER
   ===================================================== */

async function getCurrentUser() {

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not verify login.\n\n" +
text
);

}


if (!text) {

throw new Error(
"No logged-in user was returned."
);

}


return JSON.parse(text);

}


/* =====================================================
   LOAD OWN PROFILE
   ===================================================== */

async function loadOwnProfile() {

const userId =
currentUser.id;


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load your profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Your BERAKAH profile was not found."
);

}


profile =
rows[0];


displayProfile();

}


/* =====================================================
   LOAD PROFILE BY ID
   ===================================================== */

async function loadProfileById(id) {

if (!/^[0-9]+$/.test(id)) {

throw new Error(
"Invalid profile ID."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Profile was not found."
);

}


profile =
rows[0];


displayProfile();

}


/* =====================================================
   LOAD PROFILE BY USERNAME
   ===================================================== */

async function loadProfileByUsername(username) {

username =
String(username || "")
replaceAtSymbol(username)
.trim();


if (!username) {

throw new Error(
"Username is empty."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&username=eq." +
encodeURIComponent(username) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Username @" +
username +
" was not found."
);

}


profile =
rows[0];


displayProfile();

}


/* =====================================================
   REMOVE @
   ===================================================== */

function replaceAtSymbol(value) {

return String(value || "")
replace("@", "");

}


/* =====================================================
   DISPLAY PROFILE
   ===================================================== */

function displayProfile() {

const fullName =
profile["Full name"] ||
profile.full_name ||
profile.name ||
profile.username ||
"BERAKAH";


const username =
profile.username ||
"berakah1357";


const language =
profile.language ||
"—";


const bio =
profile.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


document.getElementById(
"profileName"
).textContent =
fullName;


document.getElementById(
"profileUsername"
).textContent =
"@" +
username;


document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
language.toUpperCase();


document.getElementById(
"profileBio"
).textContent =
bio;


/* AVATAR */

const avatar =
document.getElementById(
"avatar"
);


if (profile.avatar_url) {

avatar.innerHTML =
`<img
src="${escapeHTML(profile.avatar_url)}"
alt="Profile picture">`;

}
else {

avatar.textContent =
fullName
.charAt(0)
.toUpperCase() ||
"👤";

}


/* EDIT / FOLLOW */

setupEditPermission();

}


/* =====================================================
   OWN PROFILE CHECK
   ===================================================== */

function isOwnProfile() {

if (!currentUser ||
!profile) {

return false;

}


if (
profile.user_id &&
String(profile.user_id).toLowerCase() ===
String(currentUser.id).toLowerCase()
) {

return true;

}


if (!profile.user_id) {

const metadata =
currentUser.user_metadata || {};


const loggedUsername =
String(
metadata.username ||
metadata.user_name ||
metadata.userName ||
""
)
.replace("@", "")
.toLowerCase()
.trim();


const profileUsername =
String(
profile.username ||
""
)
.replace("@", "")
.toLowerCase()
.trim();


if (
loggedUsername &&
profileUsername &&
loggedUsername === profileUsername
) {

return true;

}

}


return false;

}


/* =====================================================
   EDIT / FOLLOW BUTTONS
   ===================================================== */

function setupEditPermission() {

const editButton =
document.getElementById(
"editButton"
);

const followButton =
document.getElementById(
"followButton"
);


if (isOwnProfile()) {

editButton.style.display =
"inline-block";

followButton.style.display =
"none";

}
else {

editButton.style.display =
"none";

followButton.style.display =
"inline-block";

checkFollowingStatus();

}

}


/* =====================================================
   OPEN EDIT
   ===================================================== */

function openEdit() {

if (!isOwnProfile()) {

return;

}


document.getElementById(
"editFullName"
).value =
profile["Full name"] ||
profile.full_name ||
profile.name ||
"";


document.getElementById(
"editUsername"
).value =
profile.username ||
"";


document.getElementById(
"editLanguage"
).value =
profile.language ||
"ht";


document.getElementById(
"editBio"
).value =
profile.bio ||
"";


document.getElementById(
"editStatus"
).textContent =
"";


document.getElementById(
"editBox"
).style.display =
"block";

}


/* =====================================================
   CANCEL EDIT
   ===================================================== */

function cancelEdit() {

document.getElementById(
"editBox"
).style.display =
"none";

}


/* =====================================================
   SAVE PROFILE
   ===================================================== */

async function saveProfile() {

if (!isOwnProfile()) {

return;

}


const fullName =
document.getElementById(
"editFullName"
).value.trim();


const username =
document.getElementById(
"editUsername"
).value
.trim()
.replace("@", "");


const language =
document.getElementById(
"editLanguage"
).value;


const bio =
document.getElementById(
"editBio"
).value.trim();


const status =
document.getElementById(
"editStatus"
);


const button =
document.getElementById(
"saveButton"
);


if (!fullName) {

status.textContent =
"Full name is required.";

return;

}


if (!username) {

status.textContent =
"Username is required.";

return;

}


button.disabled =
true;

status.textContent =
"Saving...";


try {

const updateData = {

"Full name":
fullName,

username:
username,

language:
language,

bio:
bio

};


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(
profile.id
),

{

method: "PATCH",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=representation"

}),

body:
JSON.stringify(
updateData
)

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Profile update failed:\n\n" +
text
);

}


const updatedRows =
text ?
JSON.parse(text) :
[];


if (updatedRows.length) {

profile =
updatedRows[0];

}


localStorage.setItem(
"berakah_username",
username
);


displayProfile();

/* =====================================================
   LOAD PEOPLE LIST
   ===================================================== */

async function openPeopleModal(type) {

if (!profile ||
!profile.user_id) {

return;

}


const modal =
document.getElementById(
"peopleModal"
);


const title =
document.getElementById(
"modalTitle"
);


const body =
document.getElementById(
"modalBody"
);


if (type === "followers") {

title.textContent =
"Followers";

}
else {

title.textContent =
"Following";

}


modal.classList.add(
"show"
);


body.innerHTML =
`<div class="modal-loading">
Loading...
</div>`;


try {


let url;


if (type === "followers") {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=follower_id" +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
) +
"&order=created_at.desc";

}
else {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=following_id" +
"&follower_id=eq." +
encodeURIComponent(
profile.user_id
) +
"&order=created_at.desc";

}


const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(text);

}


const follows =
text ?
JSON.parse(text) :
[];


if (!follows.length) {

body.innerHTML =
`<div class="modal-empty">
No ${type} yet.
</div>`;

return;

}


/*
Collect user IDs.
*/

const userIds =
follows.map(
row =>
type === "followers"
? row.follower_id
: row.following_id
);


/*
Load profiles one at a time.

This avoids depending on a
foreign-key relationship.
*/

const people = [];


for (
const userId of userIds
) {

try {

const profileURL =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(
userId
) +
"&limit=1";


const profileResponse =
await fetch(

profileURL,

{

headers:
supabaseHeaders()

}

);


if (!profileResponse.ok) {

continue;

}


const profileText =
await profileResponse.text();


const rows =
profileText
? JSON.parse(profileText)
: [];


if (rows.length) {

people.push(
rows[0]
);

}

}
catch(error) {

console.warn(
"Could not load person:",
userId,
error
);

}

}


displayPeopleList(
people,
body
);


}
catch(error) {

console.error(
"PEOPLE LIST ERROR:",
error
);

body.innerHTML =
`<div class="modal-error">
Could not load ${type}.
<br><br>
${escapeHTML(error.message)}
</div>`;

}

}

/* =====================================================
   START
   ===================================================== */

async function start() {

try {


/*
No access token.
*/

if (!accessToken) {

window.location.href =
"login.html";

return;

}


/*
Verify current Supabase
session.
*/

currentUser =
await getCurrentUser();


/*
Check requested profile.
*/

const requestedId =
getURLParameter(
"id"
);


const requestedUsername =
getURLParameter(
"username"
);


if (requestedId) {

await loadProfileById(
requestedId
);

}
else if (requestedUsername) {

await loadProfileByUsername(
requestedUsername
);

}
else {

await loadOwnProfile();

}


/*
Load profile data.
*/

await loadPosts();

await loadFollowCounts();


/*
Show profile.
*/

document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"profile"
).style.display =
"block";


}
catch(error) {

console.error(
"BERAKAH PROFILE ERROR:",
error
);


/*
If the old/stale token is
causing the Supabase
session_not_found error,
clear it and return to login.
*/

const message =
String(
error.message || ""
);


if (
message.includes(
"session_not_found"
)
) {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

localStorage.removeItem(
"berakah_username"
);

localStorage.removeItem(
"berakah_auth_user_id"
);

window.location.href =
"login.html";

return;

}


showError(
error.message
);

}

}


start();

</script>
