<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons button,
.nav-buttons a {
  border: 1px solid #d1d5db;
  background: white;
  color: #111827;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
  text-decoration: none;
  font-weight: bold;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 850px;
  margin: 30px auto;
  padding: 0 15px;
}

#loading {
  background: white;
  padding: 30px;
  border-radius: 18px;
  text-align: center;
  font-weight: bold;
}

#error {
  display: none;
  background: white;
  color: #b91c1c;
  padding: 25px;
  border-radius: 18px;
  white-space: pre-wrap;
  margin-bottom: 20px;
}

.profile {
  display: none;
}

.cover {
  height: 180px;
  background: #111827;
  border-radius: 18px 18px 0 0;
}

.profile-card {
  background: white;
  padding: 25px;
  border-radius: 0 0 18px 18px;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  font-weight: bold;
  margin-top: -70px;
  border: 5px solid white;
}

h1 {
  margin: 15px 0 5px;
}

.username {
  color: #6b7280;
  font-size: 16px;
}

.bio {
  line-height: 1.6;
  margin-top: 20px;
}

.stats {
  display: flex;
  gap: 35px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stat strong {
  display: block;
  font-size: 20px;
}

.buttons {
  margin-top: 25px;
}

.action-button {
  padding: 11px 18px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-right: 8px;
  margin-bottom: 8px;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

.action-button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#status {
  margin-top: 10px;
  font-weight: bold;
  min-height: 20px;
}

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 20px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: none;
}

.post-time {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 10px;
}

.post-content {
  line-height: 1.5;
  white-space: pre-wrap;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 10px;
}

.post-actions {
  margin-top: 12px;
}

.post-actions button {
  border: none;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}

@media (max-width: 600px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .person {
    align-items: flex-start;
    flex-direction: column;
  }

}

</style>

</head>

<body>

<header>

<div class="nav">

<div class="logo">
BERAKAH
</div>

<div class="nav-buttons">

<a href="index.html">
Home
</a>

<a href="feed.html">
Feed
</a>

<a href="people.html">
👥 People
</a>

<a href="marketplace.html">
Market
</a>

<a href="notifications.html">
🔔
</a>

<button
class="logout"
id="logoutButton">
Logout
</button>

</div>

</div>

</header>


<main>

<div id="loading">
Loading profile...
</div>

<div id="error"></div>


<div id="profile" class="profile">

<div class="cover"></div>


<section class="profile-card">

<div
class="avatar"
id="avatar">
👤
</div>


<h1 id="profileName">
BERAKAH User
</h1>


<div
class="username"
id="profileUsername">
@berakahuser
</div>


<p
class="bio"
id="profileBio">
Welcome to my BERAKAH profile.
Connect, share, build, and grow together.
</p>


<div class="stats">

<div class="stat">
<strong id="followersCount">0</strong>
Followers
</div>

<div class="stat">
<strong id="followingCount">0</strong>
Following
</div>

<div class="stat">
<strong id="postsCount">0</strong>
Posts
</div>

</div>


<div class="buttons">

<button
id="followButton"
class="action-button follow"
style="display:none;">
Follow
</button>


<button
id="editButton"
class="action-button primary"
style="display:none;">
EDIT PROFILE
</button>


<button
class="action-button secondary"
onclick="location.href='messages.html'">
💬 MESSAGES
</button>


<button
class="action-button secondary"
onclick="location.href='notifications.html'">
🔔 NOTIFICATIONS
</button>


<div id="status"></div>

</div>

</section>


<section class="posts">

<h2>Posts</h2>

<div id="postsList"></div>

</section>

</div>

</main>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken =
localStorage.getItem(
"berakah_access_token"
);

let currentUser = null;

let profileUserId = null;

let profileUsername = null;


/* =========================================
   HEADERS
========================================= */

function headers(extra) {

return Object.assign({

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + accessToken

}, extra || {});

}


/* =========================================
   SAFE TEXT
========================================= */

function safe(value) {

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   SHOW ERROR
========================================= */

function showError(message) {

document.getElementById(
"loading"
).style.display = "none";

document.getElementById(
"error"
).style.display = "block";

document.getElementById(
"error"
).textContent =
message;

}


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"Your login session is missing. Please log in again."
);

}


const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


console.log(
"CURRENT USER RESPONSE:",
text
);


if (!response.ok) {

if (response.status === 401 ||
response.status === 403) {

throw new Error(
"Your login session has expired. Please log in again."
);

}

throw new Error(
"Login error:\n" +
text
);

}


if (!text.trim()) {

throw new Error(
"Supabase returned no user."
);

}


return JSON.parse(text);

}


/* =========================================
   GET PROFILE ID FROM URL
========================================= */

function getProfileId() {

const params =
new URLSearchParams(
window.location.search
);

return params.get("id");

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile() {

const requestedId =
getProfileId();


if (!requestedId) {

throw new Error(
"No profile ID was provided."
);

}


console.log(
"REQUESTED PROFILE ID:",
requestedId
);


/* =========================================
   LOAD PROFILE FROM PROFILES TABLE
========================================= */

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(requestedId) +
"&limit=1",

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


console.log(
"PROFILE RESPONSE:",
text
);


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


if (!text.trim()) {

throw new Error(
"Supabase returned no profile."
);

}


const rows =
JSON.parse(text);


if (!rows.length) {

throw new Error(
"Profile not found for ID " +
requestedId
);

}


const profile =
rows[0];


profileUserId =
profile.id;


/* =========================================
   PROFILE USERNAME
========================================= */

profileUsername =
profile.username ||
"BERAKAH User";


document.getElementById(
"profileName"
).textContent =
profileUsername;


document.getElementById(
"profileUsername"
).textContent =
"@" +
profileUsername.toLowerCase();


/* =========================================
   AVATAR
========================================= */

const firstLetter =
profileUsername
.charAt(0)
.toUpperCase();


document.getElementById(
"avatar"
).textContent =
firstLetter;


/* =========================================
   BIO
========================================= */

if (profile.bio) {

document.getElementById(
"profileBio"
).textContent =
profile.bio;

}


/* =========================================
   LOAD POSTS
========================================= */

const posts =
await loadPosts();


displayPosts(posts);


/* =========================================
   LOAD FOLLOW DATA
========================================= */

await loadFollowCounts();

await updateFollowButton();


/* =========================================
   SHOW PROFILE
========================================= */

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"block";

}


/* =========================================
   LOAD POSTS
========================================= */

async function loadPosts() {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(profileUserId) +
"&order=created_at.desc",

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


console.log(
"POSTS RESPONSE:",
text
);


if (!response.ok) {

throw new Error(
"Could not load posts:\n\n" +
text
);

}


if (!text.trim()) {

return [];

}


return JSON.parse(text);

}


/* =========================================
   DISPLAY POSTS
========================================= */

function displayPosts(posts) {

const postsList =
document.getElementById(
"postsList"
);


postsList.innerHTML =
"";


document.getElementById(
"postsCount"
).textContent =
posts.length;


if (!posts.length) {

postsList.innerHTML = `

<div class="empty">

No posts yet.

</div>

`;

return;

}


posts.forEach(
function(post) {

const div =
document.createElement(
"div"
);


div.className =
"post";


let dateText =
"Date unavailable";


if (post.created_at) {

const date =
new Date(
post.created_at
);

if (!isNaN(date.getTime())) {

dateText =
date.toLocaleString();

}

}


let imageHTML =
"";


if (post.image_url) {

imageHTML = `

<img
class="post-image"
src="${safe(post.image_url)}"
alt="Post image">

`;

}


div.innerHTML = `

<div class="post-time">

${safe(dateText)}

</div>

<div class="post-content">

${safe(post.content)}

</div>

${imageHTML}

<div class="post-actions">

<button
onclick="location.href='feed.html'">

❤️ Like

</button>

</div>

`;


postsList.appendChild(
div
);

});

}


/* =========================================
   LOAD FOLLOW COUNTS
========================================= */

async function loadFollowCounts() {


/* FOLLOWERS */

const followersResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&following_id=eq." +
encodeURIComponent(profileUserId),

{
headers: headers()
}

);


const followersText =
await followersResponse.text();


if (!followersResponse.ok) {

throw new Error(
"Could not load followers:\n\n" +
followersText
);

}


let followers = [];


if (followersText.trim()) {

followers =
JSON.parse(
followersText
);

}


/* =========================================
   FOLLOWING
========================================= */

const followingResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(profileUserId),

{
headers: headers()
}

);


const followingText =
await followingResponse.text();


if (!followingResponse.ok) {

throw new Error(
"Could not load following:\n\n" +
followingText
);

}


let following = [];


if (followingText.trim()) {

following =
JSON.parse(
followingText
);

}


document.getElementById(
"followersCount"
).textContent =
followers.length;


document.getElementById(
"followingCount"
).textContent =
following.length;

}


/* =========================================
   CHECK FOLLOWING
========================================= */

async function checkFollowing() {

if (
String(profileUserId) ===
String(currentUser.id)
) {

return false;

}


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(currentUser.id) +
"&following_id=eq." +
encodeURIComponent(profileUserId),

{
headers: headers()
}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not check follow status:\n\n" +
text
);

}


if (!text.trim()) {

return false;

}


const rows =
JSON.parse(text);


return rows.length > 0;

}


/* =========================================
   UPDATE FOLLOW BUTTON
========================================= */

async function updateFollowButton() {

const button =
document.getElementById(
"followButton"
);

const editButton =
document.getElementById(
"editButton"
);


if (
String(profileUserId) ===
String(currentUser.id)
) {

button.style.display =
"none";

editButton.style.display =
"inline-block";

return;

}


editButton.style.display =
"none";

button.style.display =
"inline-block";


const following =
await checkFollowing();


if (following) {

button.textContent =
"Following";

button.className =
"action-button following";

}
else {

button.textContent =
"Follow";

button.className =
"action-button follow";

}

}


/* =========================================
   CREATE FOLLOW NOTIFICATION
========================================= */

async function createFollowNotification() {

const actorName =
currentUser.user_metadata?.username ||
currentUser.email?.split("@")[0] ||
"BERAKAH User";


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/notifications",

{

method: "POST",

headers: headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

user_id:
profileUserId,

actor_id:
currentUser.id,

type:
"follow",

message:
actorName +
" follows you",

read:
false

})

}

);


const text =
await response.text();


if (!response.ok) {

console.error(
"FOLLOW NOTIFICATION ERROR:",
text
);

return false;

}


return true;

}


/* =========================================
   FOLLOW / UNFOLLOW
========================================= */

async function toggleFollow() {

const button =
document.getElementById(
"followButton"
);

const status =
document.getElementById(
"status"
);


button.disabled =
true;


status.textContent =
"";


try {


const following =
await checkFollowing();


/* =========================================
   UNFOLLOW
========================================= */

if (following) {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(currentUser.id) +
"&following_id=eq." +
encodeURIComponent(profileUserId),

{

method: "DELETE",

headers: headers()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not unfollow:\n\n" +
text
);

}


status.textContent =
"Unfollowed successfully.";

}


/* =========================================
   FOLLOW
========================================= */

else {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method: "POST",

headers: headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profileUserId

})

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not follow:\n\n" +
text
);

}


await createFollowNotification();


status.textContent =
"Following successfully.";

}


await loadFollowCounts();

await updateFollowButton();

}

catch(error) {

console.error(
"FOLLOW ERROR:",
error
);

status.textContent =
error.message;

}

button.disabled =
false;

}


/* =========================================
   FOLLOW BUTTON
========================================= */

document.getElementById(
"followButton"
).addEventListener(
"click",
toggleFollow
);


/* =========================================
   EDIT PROFILE
========================================= */

document.getElementById(
"editButton"
).addEventListener(
"click",
function() {

alert(
"Profile editing is coming next."
);

});


/* =========================================
   LOGOUT
========================================= */

document.getElementById(
"logoutButton"
).addEventListener(
"click",
function() {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

location.href =
"login.html";

});


/* =========================================
   START
========================================= */

async function start() {

try {

if (!accessToken) {

location.href =
"login.html";

return;

}


currentUser =
await getCurrentUser();


console.log(
"LOGGED IN USER:",
currentUser.id
);


await loadProfile();

}

catch(error) {

console.error(
"BERAKAH PROFILE ERROR:",
error
);


showError(
error.message
);

}

}


start();

</script>

</body>

</html>
