<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;

}

header {
  background: white;

.header-inner {

.logo {

.nav {

.nav a,

.container {

.cover {

.profile-card {
  background: white;
  border-radius: 0 0 16px 16px;

}

.profile-top {
  display: flex;
  align-items: flex-end;

  margin-top: -60px;

.avatar-area {

  width: 125px;

}

.avatar {

  align-items: center;

}

.photo-help {

.profile-main {

}

.profile-name {

.profile-username {

.profile-language {

}

.profile-bio {

.stats {

}

.stat {

}

.stat span {

.btn {

}

.btn-secondary {

}

.btn-danger {

}

.edit-box {

  background: #f9fafb;

.edit-box input,

.edit-box textarea {

.section {

.post {

.post-content {

}

.post img {

}

.post-date {

.status {

.people-list {

.person {

.person-avatar {

}

.person-avatar img {

}

@media (max-width: 700px) {

    flex-direction: column;
    margin-top: -55px;
  }

  }

  }

<script>
const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const AVATAR_BUCKET = "avatars";

/*
  IMPORTANT:
  These internal localStorage names remain unchanged
  because other EPHPHAVORA pages depend on them.
*/
const ACCESS_TOKEN_KEY = "berakah_access_token";
const REFRESH_TOKEN_KEY = "berakah_refresh_token";
const USER_KEY = "berakah_user";
const USERNAME_KEY = "berakah_username";
const AUTH_USER_ID_KEY = "berakah_auth_user_id";

let accessToken =
  localStorage.getItem(ACCESS_TOKEN_KEY);

let currentUser = null;
let profile = null;

const avatar =
  document.getElementById("avatar");

const photoButton =
  document.getElementById("photoButton");

const photoMenu =
  document.getElementById("photoMenu");

const photoInput =
  document.getElementById("photoInput");

const choosePhotoBtn =

const removePhotoBtn =
  document.getElementById("removePhotoBtn");

const photoStatus =
  document.getElementById("photoStatus");

const photoHelp =
  document.getElementById("photoHelp");

const profileName =
  document.getElementById("profileName");

const profileUsername =
  document.getElementById("profileUsername");

const profileLanguage =
  document.getElementById("profileLanguage");

const profileBio =
  document.getElementById("profileBio");

const followersCount =

const followingCount =

const postsCount =

const followBtn =

const editBtn =

const notificationBtn =

const editBox =

const editFullName =

const editUsername =
  document.getElementById("editUsername");

  document.getElementById("editLanguage");

const editBio =
  document.getElementById("editBio");

const saveProfileBtn =
  document.getElementById("saveProfileBtn");

const cancelEditBtn =
  document.getElementById("cancelEditBtn");

const postsStatus =
  document.getElementById("postsStatus");

const followersContainer =
  document.getElementById("followers");

const followingContainer =

const logoutBtn =

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


async function supabaseFetch(path, options = {}) {

  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${accessToken}`,
    ...(options.headers || {})
  };

  return fetch(
    `${SUPABASE_URL}${path}`,
    {
      ...options,
      headers
    }
  );
}


async function getCurrentUser() {

  const response =
    await supabaseFetch("/auth/v1/user");

  if (!response.ok) {
    throw new Error("Not logged in");
  }

  return response.json();
}


function getQueryValue(name) {

  const params =
    new URLSearchParams(window.location.search);

  return params.get(name);
}


function isOwnProfile() {

  if (!currentUser || !profile) {
    return false;
  }

  return String(profile.user_id) ===
    String(currentUser.id);
}


function showPhotoStatus(message) {

  photoStatus.textContent = message;
  photoStatus.style.display = "block";
}


function hidePhotoStatus() {

  photoStatus.textContent = "";
  photoStatus.style.display = "none";
}


function displayProfile() {

  const fullName =
    profile["Full name"] ||
    profile.full_name ||
    profile.username ||
    "EPHPHAVORA User";

  profileName.textContent =
    fullName;

  profileUsername.textContent =
    profile.username
      ? "@" + profile.username
      : "@username";

  profileLanguage.textContent =
    profile.language ||
    "Language";

  profileBio.textContent =
    profile.bio ||
    "Welcome to EPHPHAVORA.";

  if (profile.avatar_url) {

    avatar.innerHTML =
      `<img src="${escapeHTML(profile.avatar_url)}" alt="Profile picture">`;

  } else {

    avatar.textContent =
      fullName
        .charAt(0)
        .toUpperCase() || "👤";
  }

  if (isOwnProfile()) {

    photoButton.style.display =
      "flex";

    photoHelp.style.display =
      "block";

    editBtn.style.display =
      "inline-block";

    followBtn.style.display =
      "none";

  } else {

    photoButton.style.display =
      "none";

    photoHelp.style.display =
      "none";

    editBtn.style.display =
      "none";

    followBtn.style.display =
      "inline-block";

    checkFollowing();
  }
}


photoButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    photoMenu.style.display =
      photoMenu.style.display === "block"
        ? "none"
        : "block";
  }
);


document.addEventListener(
  "click",
  function(event) {

    if (
      !photoMenu.contains(event.target) &&
      event.target !== photoButton
    ) {
      photoMenu.style.display =
        "none";
    }
  }
);


choosePhotoBtn.addEventListener(
  "click",
  function() {

    photoMenu.style.display =
      "none";

    photoInput.click();
  }
);


photoInput.addEventListener(
  "change",
  async function() {

    const file =
      photoInput.files &&
      photoInput.files[0];

    if (!file) {
      return;
    }

    /*
      10 MB maximum.
    */
    const MAX_SIZE =
      10 * 1024 * 1024;

    if (file.size > MAX_SIZE) {

      showPhotoStatus(
        "This picture is too large. Maximum size is 10 MB."
      );

      photoInput.value = "";

      return;
    }

    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {

      showPhotoStatus(
        "Please choose a JPG, PNG, or WEBP image."
      );

      photoInput.value = "";

      return;
    }

    if (!currentUser || !isOwnProfile()) {

      showPhotoStatus(
        "You can only change your own profile picture."
      );

      photoInput.value = "";

      return;
    }

    try {

      showPhotoStatus(
        "Uploading profile picture..."
      );

      const extension =
        file.type === "image/png"
          ? "png"
          : file.type === "image/webp"
            ? "webp"
            : "jpg";

      const filePath =
        `${currentUser.id}/profile-${Date.now()}.${extension}`;

      const uploadResponse =
        await supabaseFetch(
          `/storage/v1/object/${AVATAR_BUCKET}/${encodeURIComponent(filePath)}`,
          {
            method: "POST",
            headers: {
              "Content-Type": file.type,
              "x-upsert": "true"
            },
            body: file
          }
        );

      if (!uploadResponse.ok) {

        const errorText =
          await uploadResponse.text();

        console.error(
          "Avatar upload error:",
          uploadResponse.status,
          errorText
        );

        throw new Error(
          `Upload failed (${uploadResponse.status})`
        );
      }

      const publicURL =
        `${SUPABASE_URL}/storage/v1/object/public/${AVATAR_BUCKET}/${filePath}`;

      const profileUpdate =
        await supabaseFetch(
          `/rest/v1/profiles?id=eq.${profile.id}`,
          {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },
            body: JSON.stringify({
              avatar_url: publicURL
            })
          }
        );

      if (!profileUpdate.ok) {

        const errorText =
          await profileUpdate.text();

        console.error(
          "Profile avatar save error:",
          errorText
        );

        throw new Error(
          "Picture uploaded, but profile could not be updated."
        );
      }

      profile.avatar_url =
        publicURL;

      displayProfile();

      showPhotoStatus(
        "Profile picture updated successfully!"
      );

      photoInput.value = "";

    } catch (error) {

      console.error(
        "PROFILE PICTURE ERROR:",
        error
      );

      showPhotoStatus(
        "Could not upload profile picture."
      );

      photoInput.value = "";
    }
  }
);


removePhotoBtn.addEventListener(
  "click",
  async function() {

    photoMenu.style.display =
      "none";

    if (!currentUser || !isOwnProfile()) {

      showPhotoStatus(
        "You can only remove your own profile picture."
      );

      return;
    }

    if (!profile.avatar_url) {

      showPhotoStatus(
        "There is no profile picture to remove."
      );

      return;
    }

    const confirmed =
      confirm(
        "Remove your profile picture?"
      );

    if (!confirmed) {
      return;
    }

    try {

      showPhotoStatus(
        "Removing profile picture..."
      );

      const response =
        await supabaseFetch(
          `/rest/v1/profiles?id=eq.${profile.id}`,
          {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },
            body: JSON.stringify({
              avatar_url: null
            })
          }
        );

      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(
          "Remove avatar error:",
          errorText
        );

        throw new Error(
          "Could not remove profile picture."
        );
      }

      profile.avatar_url =
        null;

      displayProfile();

      showPhotoStatus(
        "Profile picture removed."
      );

    } catch (error) {

      console.error(
        "REMOVE PROFILE PICTURE ERROR:",
        error
      );

      showPhotoStatus(
        "Could not remove profile picture."
      );
    }
  }
);


async function loadProfile() {

  const requestedId =
    getQueryValue("id");

  const requestedUsername =
    getQueryValue("username");

  let response;

  if (requestedId) {

    response =
      await supabaseFetch(
        `/rest/v1/profiles?select=*&id=eq.${encodeURIComponent(requestedId)}&limit=1`
      );

  } else if (requestedUsername) {

    response =
      await supabaseFetch(
        `/rest/v1/profiles?select=*&username=eq.${encodeURIComponent(requestedUsername)}&limit=1`
      );

  } else {

    response =
      await supabaseFetch(
        `/rest/v1/profiles?select=*&user_id=eq.${encodeURIComponent(currentUser.id)}&limit=1`
      );
  }

  if (!response.ok) {

    throw new Error(
      "Could not load profile."
    );
  }

  const data =
    await response.json();

  if (!data.length) {

    throw new Error(
      "Profile not found."
    );
  }

  profile =
    data[0];

  displayProfile();
}


async function loadFollowCounts() {

  if (!profile || !profile.user_id) {
    return;
  }

  try {

    const followersResponse =
      await supabaseFetch(
        `/rest/v1/follows?select=id&following_id=eq.${encodeURIComponent(profile.user_id)}`
      );

    const followingResponse =
      await supabaseFetch(
        `/rest/v1/follows?select=id&follower_id=eq.${encodeURIComponent(profile.user_id)}`
      );

    if (followersResponse.ok) {

      const followers =
        await followersResponse.json();

      followersCount.textContent =
        followers.length;
    }

    if (followingResponse.ok) {

      const following =
        await followingResponse.json();

      followingCount.textContent =
        following.length;
    }

  } catch (error) {

    console.error(
      "FOLLOW COUNT ERROR:",
      error
    );
  }
}


async function checkFollowing() {

  if (
    !currentUser ||
    !profile ||
    !profile.user_id ||
    isOwnProfile()
  ) {
    return;
  }

  try {

    const response =
      await supabaseFetch(
        `/rest/v1/follows?select=id&follower_id=eq.${encodeURIComponent(currentUser.id)}&following_id=eq.${encodeURIComponent(profile.user_id)}&limit=1`
      );

    if (!response.ok) {
      return;
    }

    const data =
      await response.json();

    followBtn.textContent =
      data.length
        ? "Unfollow"
        : "Follow";

  } catch (error) {

    console.error(
      "FOLLOW CHECK ERROR:",
      error
    );
  }
}


async function toggleFollow() {

  if (
    !currentUser ||
    !profile ||
    !profile.user_id ||
    isOwnProfile()
  ) {
    return;
  }

  try {

    const checkResponse =
      await supabaseFetch(
        `/rest/v1/follows?select=id&follower_id=eq.${encodeURIComponent(currentUser.id)}&following_id=eq.${encodeURIComponent(profile.user_id)}&limit=1`
      );

    const existing =
      checkResponse.ok
        ? await checkResponse.json()
        : [];

    if (existing.length) {

      await supabaseFetch(
        `/rest/v1/follows?id=eq.${existing[0].id}`,
        {
          method: "DELETE"
        }
      );

      followBtn.textContent =
        "Follow";

    } else {

      const response =
        await supabaseFetch(
          "/rest/v1/follows",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },
            body: JSON.stringify({
              follower_id: currentUser.id,
              following_id: profile.user_id
            })
          }
        );

      if (!response.ok) {

        console.error(
          "Follow failed:",
          await response.text()
        );

        return;
      }

      followBtn.textContent =
        "Unfollow";

      await supabaseFetch(
        "/rest/v1/notifications",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({
            user_id: profile.user_id,
            from_user_id: currentUser.id,
            type: "follow",
            message: "started following you",
            read: false
          })
        }
      );
    }

    await loadFollowCounts();

  } catch (error) {

    console.error(
      "TOGGLE FOLLOW ERROR:",
      error
    );
  }
}


followBtn.addEventListener(
  "click",
  toggleFollow
);

saveProfileBtn.addEventListener(
  "click",
  async function() {

    if (!isOwnProfile()) {
      return;
    }

    try {

      saveProfileBtn.disabled =
        true;

      saveProfileBtn.textContent =
        "Saving...";

      const updatedProfile = {
        "Full name":
          editFullName.value.trim(),

        username:
          editUsername.value.trim(),

        language:
          editLanguage.value,

        bio:
          editBio.value.trim()
      };

      const response =
        await supabaseFetch(
          `/rest/v1/profiles?id=eq.${profile.id}`,
          {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
              "Prefer": "return=representation"
            },
            body: JSON.stringify(
              updatedProfile
            )
          }
        );

      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(
          "PROFILE SAVE ERROR:",
          errorText
        );

        alert(
          "Could not save profile."
        );

        return;
      }

      const data =
        await response.json();

      if (data.length) {
        profile = data[0];
      } else {
        Object.assign(
          profile,
          updatedProfile
        );
      }

      displayProfile();

      editBox.style.display =
        "none";

      alert(
        "Profile updated successfully!"
      );

    } catch (error) {

      console.error(
        "SAVE PROFILE ERROR:",
        error
      );

      alert(
        "Could not save profile."
      );

    } finally {

      saveProfileBtn.disabled =
        false;

      saveProfileBtn.textContent =
        "Save";
    }
  }
);


async function loadPosts() {

  if (!profile || !profile.user_id) {
    return;
  }

  try {

    const response =
      await supabaseFetch(
        `/rest/v1/posts?select=*&user_id=eq.${encodeURIComponent(profile.user_id)}&order=created_at.desc`
      );

    if (!response.ok) {

      postsStatus.textContent =
        "Could not load posts.";

      return;
    }

    const data =
      await response.json();

    postsCount.textContent =
      data.length;

    if (!data.length) {

      postsStatus.textContent =
        "No posts yet.";

      postsContainer.innerHTML =
        "";

      return;
    }

    postsStatus.style.display =
      "none";

    postsContainer.innerHTML =
      data.map(post => {

        const content =
          escapeHTML(
            post.content || ""
          );

        const image =
          post.image_url
            ? `<img src="${escapeHTML(post.image_url)}" alt="Post image">`
            : "";

        const date =
          post.created_at
            ? new Date(
                post.created_at
              ).toLocaleString()
            : "";

        const deleteButton =
          isOwnProfile()
            ? `
              <button
                class="btn btn-danger"
                onclick="deletePost('${post.id}')"
                style="margin-top:10px;"
              >
                Delete
              </button>
            `
            : "";

        return `
          <div class="post">

            <div class="post-content">
              ${content}
            </div>

            ${image}

            <div class="post-date">
              ${escapeHTML(date)}
            </div>

            ${deleteButton}

          </div>
        `;

      }).join("");

  } catch (error) {

    console.error(
      "LOAD POSTS ERROR:",
      error
    );

    postsStatus.textContent =
      "Could not load posts.";
  }
}


async function deletePost(postId) {

  if (!isOwnProfile()) {
    return;
  }

  const confirmed =
    confirm(
      "Delete this post?"
    );

  if (!confirmed) {
    return;
  }

  try {

    const response =
      await supabaseFetch(
        `/rest/v1/posts?id=eq.${encodeURIComponent(postId)}`,
        {
          method: "DELETE"
        }
      );

    if (!response.ok) {

      alert(
        "Could not delete post."
      );

      return;
    }

    await loadPosts();

  } catch (error) {

    console.error(
      "DELETE POST ERROR:",
      error
    );

    alert(
      "Could not delete post."
    );
  }
}


async function loadPeopleList(
  type,
  container
) {

  if (!profile || !profile.user_id) {
    return;
  }

  const column =
    type === "followers"
      ? "follower_id"
      : "following_id";

  const otherColumn =
    type === "followers"
      ? "following_id"
      : "follower_id";

  try {

    const response =
      await supabaseFetch(
        `/rest/v1/follows?select=${column}&${otherColumn}=eq.${encodeURIComponent(profile.user_id)}`
      );

    if (!response.ok) {

      container.innerHTML =
        `<div class="status">Could not load ${type}.</div>`;

      return;
    }

    const rows =
      await response.json();

    if (!rows.length) {

      container.innerHTML =
        `<div class="status">No ${type} yet.</div>`;

      return;
    }

    const ids =
      rows
        .map(row => row[column])
        .filter(Boolean);

    const uniqueIds =
      [...new Set(ids.map(String))];

    const query =
      uniqueIds
        .map(id =>
          `"${id}"`
        )
        .join(",");

    const profilesResponse =
      await supabaseFetch(
        `/rest/v1/profiles?select=id,user_id,"Full name",username,language,avatar_url&user_id=in.(${encodeURIComponent(query)})`
      );

    if (!profilesResponse.ok) {

      container.innerHTML =
        `<div class="status">Could not load people.</div>`;

      return;
    }

    const people =
      await profilesResponse.json();

    if (!people.length) {

      container.innerHTML =
        `<div class="status">No ${type} yet.</div>`;

      return;
    }

    container.innerHTML =
      people.map(person => {

        const name =
          person["Full name"] ||
          person.username ||
          "EPHPHAVORA User";

        const initial =
          name
            .charAt(0)
            .toUpperCase();

        const personAvatar =
          person.avatar_url
            ? `<img src="${escapeHTML(person.avatar_url)}" alt="Profile picture">`
            : initial;

        const profileLink =
          person.id
            ? `profile.html?id=${encodeURIComponent(person.id)}`
            : "#";

        return `
          <div class="person">

            <div class="person-avatar">
              ${personAvatar}
            </div>

            <div>
              <a
                href="${profileLink}"
                style="text-decoration:none;color:#111827;font-weight:700;"
              >
                ${escapeHTML(name)}
              </a>

              <div style="color:#6b7280;font-size:13px;">
                ${person.username ? "@" + escapeHTML(person.username) : ""}
              </div>

            </div>

          </div>
        `;

      }).join("");

  } catch (error) {

    console.error(
      `LOAD ${type.toUpperCase()} ERROR:`,
      error
    );

    container.innerHTML =
      `<div class="status">Could not load ${type}.</div>`;
  }
}

async function start() {

  try {

    if (!accessToken) {

      window.location.href =
        "login.html";

      return;
    }

    currentUser =
      await getCurrentUser();

    localStorage.setItem(
      AUTH_USER_ID_KEY,
      currentUser.id
    );

    await loadProfile();

    await loadFollowCounts();

    await loadPosts();

    await loadPeopleList(
      "followers",
      followersContainer
    );

    await loadPeopleList(
      "following",
      followingContainer
    );

  } catch (error) {

    console.error(
      "PROFILE START ERROR:",
      error
    );

    document.body.innerHTML = `
      <div style="
        max-width:600px;
        margin:80px auto;
        padding:30px;
        text-align:center;
        font-family:Arial,sans-serif;
      ">

        <h2>EPHPHAVORA</h2>

        <p>
          Could not load this profile.
        </p>

        <p style="color:#6b7280;">
          ${escapeHTML(error.message)}
        </p>

        <a
          href="login.html"
          style="
            display:inline-block;
            margin-top:15px;
            padding:10px 16px;
            background:#111827;
            color:white;
            text-decoration:none;
            border-radius:8px;
          "
        >
          Go to Login
        </a>

      </div>
    `;
  }
}


start();
