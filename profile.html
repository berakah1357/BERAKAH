<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

/* =========================
   HEADER
========================= */

header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 2px;
}

.nav-links {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-links a,
.nav-links button {
  text-decoration: none;
  border: 1px solid #d1d5db;
  background: #fff;
  color: #111827;
  padding: 8px 11px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}

.nav-links .logout {
  background: #111827;
  color: white;
}

/* =========================
   MAIN
========================= */

main {
  max-width: 900px;
  margin: 25px auto;
  padding: 0 15px;
}

.loading,
.error {
  background: white;
  border-radius: 16px;
  padding: 30px;
  text-align: center;
}

.error {
  display: none;
  color: #b91c1c;
  text-align: left;
  white-space: pre-wrap;
}

/* =========================
   PROFILE
========================= */

.profile {
  display: none;
}

.cover {
  height: 190px;
  background: linear-gradient(
    135deg,
    #111827,
    #374151
  );
  border-radius: 18px 18px 0 0;
}

.profile-card {
  background: white;
  padding: 25px;
  border-radius: 0 0 18px 18px;
}

.avatar {
  width: 115px;
  height: 115px;
  margin-top: -70px;
  border-radius: 50%;
  background: #e5e7eb;
  border: 5px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 46px;
  font-weight: bold;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h1 {
  margin: 14px 0 4px;
}

.username {
  color: #6b7280;
}

.language {
  color: #6b7280;
  margin-top: 7px;
}

.bio {
  margin-top: 20px;
  line-height: 1.6;
  white-space: pre-wrap;
}

/* =========================
   STATS
========================= */

.stats {
  display: flex;
  gap: 12px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.stat {
  min-width: 120px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px 18px;
  cursor: pointer;
  transition: 0.2s;
}

.stat:hover {
  background: #f3f4f6;
}

.stat strong {
  display: block;
  font-size: 21px;
  margin-bottom: 3px;
}

/* =========================
   BUTTONS
========================= */

.actions {
  margin-top: 25px;
}

.action {
  border: 0;
  border-radius: 8px;
  padding: 11px 17px;
  margin-right: 7px;
  margin-bottom: 7px;
  font-weight: bold;
  cursor: pointer;
}

.action:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.primary {
  background: #111827;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.follow {
  background: #111827;
  color: white;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

/* =========================
   STATUS
========================= */

.status {
  margin-top: 12px;
  font-weight: bold;
}

/* =========================
   EDIT BOX
========================= */

.edit-box {
  display: none;
  margin-top: 20px;
  padding: 20px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
}

.edit-box label {
  display: block;
  font-weight: bold;
  margin: 14px 0 6px;
}

.edit-box input,
.edit-box textarea,
.edit-box select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  background: white;
}

.edit-box textarea {
  min-height: 100px;
  resize: vertical;
}

.save {
  margin-top: 15px;
  padding: 11px 17px;
  border: 0;
  border-radius: 8px;
  background: #111827;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.cancel {
  margin-top: 15px;
  padding: 11px 17px;
  border: 0;
  border-radius: 8px;
  background: #e5e7eb;
  font-weight: bold;
  cursor: pointer;
}

/* =========================
   POSTS
========================= */

.posts {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

.post {
  padding: 18px 0;
  border-bottom: 1px solid #e5e7eb;
}

.post:last-child {
  border-bottom: 0;
}

.post-date {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 9px;
}

.post-content {
  white-space: pre-wrap;
  line-height: 1.6;
}

.post-image {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 12px;
}

.like-button {
  margin-top: 12px;
  border: 0;
  background: #f3f4f6;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}

/* =========================
   FOLLOWERS / FOLLOWING
========================= */

.people-section {
  margin-top: 25px;
  background: white;
  padding: 25px;
  border-radius: 18px;
  display: none;
}

.people-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 15px;
}

.people-header h2 {
  margin: 0;
}

.close-people {
  border: 0;
  background: #e5e7eb;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
}

.people-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.person {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  background: #fff;
}

.person-avatar {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 20px;
  overflow: hidden;
}

.person-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.person-info {
  flex: 1;
  min-width: 0;
}

.person-name {
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.person-username {
  color: #6b7280;
  font-size: 14px;
  margin-top: 3px;
}

.person-view {
  border: 0;
  background: #111827;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .nav-links {
    width: 100%;
  }

  .cover {
    height: 150px;
  }

  .profile-card {
    padding: 20px;
  }

  .avatar {
    width: 100px;
    height: 100px;
    margin-top: -60px;
  }

  .stat {
    flex: 1;
    min-width: 100px;
  }

  .person-view {
    padding: 7px 9px;
    font-size: 12px;
  }

}

</style>

<script>

/* =====================================================
   BERAKAH SUPABASE CONFIGURATION
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
===================================================== */

let accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;

let profile = null;


/* =====================================================
   SUPABASE HEADERS
===================================================== */

function supabaseHeaders(extra = {}) {

const headers = {

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

};

if (accessToken) {

headers["Authorization"] =
"Bearer " + accessToken;

}

return {

...headers,

...extra

};

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


/* =====================================================
   CLEAR SESSION
===================================================== */

function clearSession() {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

localStorage.removeItem(
"berakah_username"
);

localStorage.removeItem(
"berakah_auth_user_id"
);

accessToken = null;

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"none";

const error =
document.getElementById(
"error"
);

error.style.display =
"block";

error.textContent =
message;

}


/* =====================================================
   URL PARAMETER
===================================================== */

function getURLParameter(name) {

const params =
new URLSearchParams(
window.location.search
);

return params.get(name);

}


/* =====================================================
   SUPABASE AUTH USER
===================================================== */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"NO_SESSION"
);

}


const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


/*
If Supabase says the session no longer
exists, remove the broken browser session.
*/

if (
response.status === 401 ||
response.status === 403
) {

clearSession();

throw new Error(
"SESSION_EXPIRED"
);

}


if (!response.ok) {

throw new Error(
"Could not verify login.\n\n" +
text
);

}


if (!text) {

throw new Error(
"No logged-in user was returned."
);

}


try {

return JSON.parse(text);

}
catch(error) {

throw new Error(
"Invalid authentication response."
);

}

}


/* =====================================================
   LOAD OWN PROFILE
===================================================== */

async function loadOwnProfile() {

const userId =
currentUser.id;


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load your profile:\n\n" +
text
);

}


let rows = [];

try {

rows =
text ?
JSON.parse(text) :
[];

}
catch(error) {

throw new Error(
"Invalid profile response."
);

}


if (!rows.length) {

throw new Error(
"Your BERAKAH profile was not found.\n\n" +
"Auth ID:\n" +
userId
);

}


profile =
rows[0];

displayProfile();

}


/* =====================================================
   LOAD PROFILE BY ID
===================================================== */

async function loadProfileById(id) {

if (!/^[0-9]+$/.test(id)) {

throw new Error(
"Invalid profile ID."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Profile was not found."
);

}


profile =
rows[0];

displayProfile();

}


/* =====================================================
   LOAD PROFILE BY USERNAME
===================================================== */

async function loadProfileByUsername(username) {

/*
Clean the username.

@JODBELEM1357
becomes
JODBELEM1357
*/

username =
String(username || "")
.replace("@", "")
.trim();


if (!username) {

throw new Error(
"Username is empty."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&username=eq." +
encodeURIComponent(username) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Username @" +
username +
" was not found."
);

}


profile =
rows[0];

displayProfile();

}


/* =====================================================
   DISPLAY PROFILE
===================================================== */

function displayProfile() {

const fullName =
profile["Full name"] ||
profile.full_name ||
profile.name ||
profile.username ||
"BERAKAH";


const username =
profile.username ||
"berakah1357";


const language =
profile.language ||
"—";


const bio =
profile.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


document.getElementById(
"profileName"
).textContent =
fullName;


document.getElementById(
"profileUsername"
).textContent =
"@" +
username;


document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
String(language).toUpperCase();


document.getElementById(
"profileBio"
).textContent =
bio;


/* =========================
   AVATAR
========================= */

const avatar =
document.getElementById(
"avatar"
);


if (profile.avatar_url) {

avatar.innerHTML =
`<img
src="${escapeHTML(profile.avatar_url)}"
alt="Profile picture">`;

}
else {

avatar.textContent =
String(fullName)
.charAt(0)
.toUpperCase();

}


/* =========================
   PERMISSIONS
========================= */

setupEditPermission();

}


/* =====================================================
   IS OWN PROFILE
===================================================== */

function isOwnProfile() {

if (!currentUser ||
!profile) {

return false;

}


if (
profile.user_id &&
String(profile.user_id).toLowerCase() ===
String(currentUser.id).toLowerCase()
) {

return true;

}


/*
Fallback for older profile records.
*/

if (!profile.user_id) {

const metadata =
currentUser.user_metadata ||
{};


const loggedUsername =
String(
metadata.username ||
metadata.user_name ||
metadata.userName ||
localStorage.getItem(
"berakah_username"
) ||
""
)
.replace("@", "")
.toLowerCase()
.trim();


const profileUsername =
String(
profile.username ||
""
)
.replace("@", "")
.toLowerCase()
.trim();


if (
loggedUsername &&
profileUsername &&
loggedUsername === profileUsername
) {

return true;

}

}


return false;

}


/* =====================================================
   EDIT / FOLLOW PERMISSION
===================================================== */

function setupEditPermission() {

const editButton =
document.getElementById(
"editButton"
);

const followButton =
document.getElementById(
"followButton"
);


if (isOwnProfile()) {

editButton.style.display =
"inline-block";

followButton.style.display =
"none";

}
else {

editButton.style.display =
"none";

followButton.style.display =
"inline-block";

checkFollowingStatus();

}

}


/* =====================================================
   OPEN EDIT
===================================================== */

function openEdit() {

if (!isOwnProfile()) {

return;

}


document.getElementById(
"editFullName"
).value =
profile["Full name"] ||
profile.full_name ||
profile.name ||
"";


document.getElementById(
"editUsername"
).value =
profile.username ||
"";


document.getElementById(
"editLanguage"
).value =
profile.language ||
"en";


document.getElementById(
"editBio"
).value =
profile.bio ||
"";


document.getElementById(
"editStatus"
).textContent =
"";


document.getElementById(
"editBox"
).style.display =
"block";

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit() {

document.getElementById(
"editBox"
).style.display =
"none";

}


/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile() {

if (!isOwnProfile()) {

return;

}


const fullName =
document.getElementById(
"editFullName"
).value.trim();


const username =
document.getElementById(
"editUsername"
).value
.trim()
.replace(/^@+/, "");


const language =
document.getElementById(
"editLanguage"
).value;


const bio =
document.getElementById(
"editBio"
).value.trim();


const status =
document.getElementById(
"editStatus"
);


const button =
document.getElementById(
"saveButton"
);


if (!fullName) {

status.textContent =
"Full name is required.";

return;

}


if (!username) {

status.textContent =
"Username is required.";

return;

}


/*
Basic username validation.
*/

if (!/^[a-zA-Z0-9_.-]+$/.test(username)) {

status.textContent =
"Username can contain letters, numbers, _, . or - only.";

return;

}


button.disabled =
true;

status.textContent =
"Saving...";


try {

const updateData = {

"Full name":
fullName,

username:
username,

language:
language,

bio:
bio

};


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(profile.id),

{

method: "PATCH",

headers:
supabaseHeaders({

"Prefer":
"return=representation"

}),

body:
JSON.stringify(updateData)

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Profile update failed:\n\n" +
text
);

}


const updatedRows =
text ?
JSON.parse(text) :
[];


if (updatedRows.length) {

profile =
updatedRows[0];

}


localStorage.setItem(
"berakah_username",
username
);


displayProfile();

status.textContent =
"Profile saved successfully!";


setTimeout(
function() {

document.getElementById(
"editBox"
).style.display =
"none";

document.getElementById(
"editStatus"
).textContent =
"";

},
1200
);

}
catch(error) {

console.error(
"PROFILE SAVE ERROR:",
error
);

status.textContent =
error.message;

}
finally {

button.disabled =
false;

}

}


/* =====================================================
   LOAD POSTS
===================================================== */

async function loadPosts() {

const userId =
profile.user_id;


if (!userId) {

displayPosts([]);

return;

}


const url =
SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&order=created_at.desc";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

console.warn(
"Posts could not be loaded:",
text
);

displayPosts([]);

return;

}


let posts = [];

try {

posts =
text ?
JSON.parse(text) :
[];

}
catch(error) {

posts = [];

}


displayPosts(posts);

}


/* =====================================================
   DISPLAY POSTS
===================================================== */

function displayPosts(posts) {

const list =
document.getElementById(
"postsList"
);


list.innerHTML =
"";


document.getElementById(
"postsCount"
).textContent =
posts.length;


if (!posts.length) {

list.innerHTML =
`<div class="empty">
No posts yet.
</div>`;

return;

}


posts.forEach(
post => {

const div =
document.createElement(
"div"
);


div.className =
"post";


let date =
"";


if (post.created_at) {

const d =
new Date(
post.created_at
);

if (!isNaN(
d.getTime()
)) {

date =
d.toLocaleString();

}

}


let image =
"";


if (post.image_url) {

image =
`<img
class="post-image"
src="${escapeHTML(post.image_url)}"
alt="Post image">`;

}


div.innerHTML = `

<div class="post-date">
${escapeHTML(date)}
</div>

<div class="post-content">
${escapeHTML(post.content || "")}
</div>

${image}

<button
class="like-button">

❤️ Like

</button>

`;


list.appendChild(div);

});

}

===================================================== */

async function checkFollowingStatus() {

if (!currentUser ||
!profile ||
!profile.user_id) {

return;

}


if (
String(currentUser.id).toLowerCase() ===
String(profile.user_id).toLowerCase()
) {

return;

}


const url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


try {

const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);

}

await response.text();

text ?
JSON.parse(text) :
[];

/* =====================================================
   FOLLOW / UNFOLLOW
===================================================== */

async function followUser() {

if (!currentUser ||
!profile ||
!profile.user_id) {

return;

}


if (isOwnProfile()) {

return;

}


const button =
document.getElementById(
"followButton"
);


const status =
document.getElementById(
"status"
);


button.disabled =
true;


try {

/*
Check whether the follow already exists.
*/

const checkURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const checkResponse =
await fetch(

checkURL,

{

method: "GET",

headers:
supabaseHeaders()

}

);


if (!checkResponse.ok) {

throw new Error(
"Could not check follow status."
);

}


const checkText =
await checkResponse.text();


const existing =
checkText ?
JSON.parse(checkText) :
[];


/* =========================
   UNFOLLOW
========================= */

if (existing.length > 0) {

const deleteURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const deleteResponse =
await fetch(

deleteURL,

{

method: "DELETE",

headers:
supabaseHeaders()

}

);


if (!deleteResponse.ok) {

const deleteText =
await deleteResponse.text();

throw new Error(
"Could not unfollow.\n\n" +
deleteText
);

}


button.textContent =
"Follow";

button.className =
"action follow";

status.textContent =
"Unfollowed.";

}


/* =========================
   FOLLOW
========================= */

else {

const followResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method: "POST",

headers:
supabaseHeaders({

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profile.user_id

})

}

);


if (!followResponse.ok) {

const text =
await followResponse.text();

throw new Error(
"Could not follow this user.\n\n" +
text
);

}


button.textContent =
"Following";

button.className =
"action following";

status.textContent =
"Following.";

}


/*
Refresh real counts.
*/

await loadFollowCounts();


setTimeout(
function() {

status.textContent =
"";

},
1500
);

}
catch(error) {

console.error(
"FOLLOW ERROR:",
error
);

status.textContent =
error.message;

}
finally {

button.disabled =
false;

}

}


/* =====================================================
   LOAD PEOPLE
===================================================== */

async function loadPeople(type) {

if (!profile ||
!profile.user_id) {

return;

}


const section =
document.getElementById(
"peopleSection"
);


const title =
document.getElementById(
"peopleTitle"
);


const loading =
document.getElementById(
"peopleLoading"
);


const list =
document.getElementById(
"peopleList"
);


section.style.display =
"block";


list.innerHTML =
"";


loading.style.display =
"block";


if (type === "followers") {

title.textContent =
"Followers";

}
else {

title.textContent =
"Following";

}


let url = "";


/* =========================
   FOLLOWERS
========================= */

if (type === "followers") {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id,follower_id" +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
) +
"&order=id.desc";

}


/* =========================
   FOLLOWING
========================= */

else {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id,following_id" +
"&follower_id=eq." +
encodeURIComponent(
profile.user_id
) +
"&order=id.desc";

}


try {

const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
text
);

}


const follows =
text ?
JSON.parse(text) :
[];


if (!follows.length) {

loading.style.display =
"none";

list.innerHTML =
`<div class="empty">
No ${type} yet.
</div>`;

return;

}


/*
Get the user UUIDs.
*/

const userIds =
follows
.map(
row =>
type === "followers"
? row.follower_id
: row.following_id
)
.filter(Boolean);


/*
Load profiles belonging to those UUIDs.

We do one request rather than
one request per person.
*/

const profileRequests =
userIds.map(
userId =>
fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?select=id,user_id,username,\"Full name\",full_name,name,avatar_url" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1",

{

method: "GET",

headers:
supabaseHeaders()

}

)
);


const profileResponses =
await Promise.all(
profileRequests
);


const people = [];


for (
let i = 0;
i < profileResponses.length;
i++
) {

const personResponse =
profileResponses[i];


if (!personResponse.ok) {

continue;

}


const personText =
await personResponse.text();


if (!personText) {

continue;

}


try {

const personRows =
JSON.parse(
personText
);


if (personRows.length) {

people.push(
personRows[0]
);

}

}
catch(error) {}

}


loading.style.display =
"none";


displayPeople(people);

}
catch(error) {

console.error(
"PEOPLE LOAD ERROR:",
error
);

loading.style.display =
"none";

list.innerHTML =
`<div class="empty">
Could not load ${type}.
</div>`;

}

}


/* =====================================================
   DISPLAY PEOPLE
===================================================== */

function displayPeople(people) {

const list =
document.getElementById(
"peopleList"
);


list.innerHTML =
"";


if (!people.length) {

list.innerHTML =
`<div class="empty">
No profiles found.
</div>`;

return;

}


people.forEach(
person => {

const fullName =
person["Full name"] ||
person.full_name ||
person.name ||
person.username ||
"BERAKAH";


const username =
person.username ||
"";


const item =
document.createElement(
"div"
);


item.className =
"person";


const avatar =
document.createElement(
"div"
);

avatar.className =
"person-avatar";


if (person.avatar_url) {

avatar.innerHTML =
`<img
src="${escapeHTML(person.avatar_url)}"
alt="Profile picture">`;

}
else {

avatar.textContent =
String(fullName)
.charAt(0)
.toUpperCase();

}


const info =
document.createElement(
"div"
);

info.className =
"person-info";


const name =
document.createElement(
"div"
);

name.className =
"person-name";

name.textContent =
fullName;


const user =
document.createElement(
"div"
);

user.className =
"person-username";

user.textContent =
username
? "@" + username
: "";


info.appendChild(
name
);

info.appendChild(
user
);


const view =
document.createElement(
"button"
);

view.className =
"person-view";

view.textContent =
"View";


view.addEventListener(
"click",
function() {

if (person.user_id) {

window.location.href =
"profile.html?username=" +
encodeURIComponent(
username
);

}
else if (person.id) {

window.location.href =
"profile.html?id=" +
encodeURIComponent(
person.id
);

}

}
);


item.appendChild(
avatar
);

item.appendChild(
info
);

item.appendChild(
view
);


list.appendChild(
item
);

});

}

/* =====================================================
   START
===================================================== */

async function start() {

try {

/*
No session.
*/

if (!accessToken) {

window.location.href =
"login.html";

return;

}


/*
Verify actual Supabase account.
*/

try {

currentUser =
await getCurrentUser();

}
catch(error) {

/*
Old/dead JWT.

This fixes:

403
session_not_found
*/

if (
error.message ===
"SESSION_EXPIRED" ||
error.message ===
"NO_SESSION"
) {

clearSession();

window.location.href =
"login.html";

return;

}

throw error;

}


/*
Read URL.
*/

const requestedId =
getURLParameter("id");


const requestedUsername =
getURLParameter("username");


/*
Load requested profile.
*/

if (requestedId) {

await loadProfileById(
requestedId
);

}
else if (requestedUsername) {

await loadProfileByUsername(
requestedUsername
);

}
else {

await loadOwnProfile();

}


/*
Load profile information.
*/

await loadPosts();

await loadFollowCounts();


/*
Show page.
*/

document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"profile"
).style.display =
"block";

}
catch(error) {

console.error(
"BERAKAH PROFILE ERROR:",
error
);


if (
error.message ===
"SESSION_EXPIRED" ||
error.message ===
"NO_SESSION"
) {

clearSession();

window.location.href =
"login.html";

return;

}


showError(
error.message
);

}

}


/* =====================================================
   RUN
===================================================== */

start();

</script>
