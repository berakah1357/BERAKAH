<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


const accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;

let profileUserId = null;

let profileUsername = null;


/* =========================================
   HEADERS
========================================= */

function headers(extra) {

  return Object.assign({

    "apikey":
      SUPABASE_ANON_KEY,

    "Authorization":
      "Bearer " + accessToken

  }, extra || {});

}


/* =========================================
   SAFE TEXT
========================================= */

function safe(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================
   GET URL ID
========================================= */

function getProfileId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}


/* =========================================
   GET URL USERNAME
========================================= */

function getProfileUsername() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("username");

}


/* =========================================
   CURRENT USER
========================================= */

async function getCurrentUser() {

  if (!accessToken) {

    throw new Error(
      "You are not logged in. Please log in again."
    );

  }


  const response =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/user",

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  console.log(
    "CURRENT USER:",
    text
  );


  if (!response.ok) {

    throw new Error(
      "Login error:\n" +
      text
    );

  }


  if (!text.trim()) {

    throw new Error(
      "Supabase returned no user."
    );

  }


  return JSON.parse(text);

}


/* =========================================
   FIND PROFILE
========================================= */

async function findProfile() {

  const id =
    getProfileId();

  const username =
    getProfileUsername();


  /*
    IMPORTANT:

    People page uses:

    profile.html?id=1

    Therefore ID is checked FIRST.
  */


  if (id) {

    console.log(
      "Looking for profile ID:",
      id
    );


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/profiles" +
        "?select=*" +
        "&id=eq." +
        encodeURIComponent(id) +
        "&limit=1",

        {
          method: "GET",
          headers: headers()
        }

      );


    const text =
      await response.text();


    console.log(
      "PROFILE RESPONSE:",
      text
    );


    if (!response.ok) {

      throw new Error(
        "Could not load profile:\n\n" +
        text
      );

    }


    if (!text.trim()) {

      throw new Error(
        "Profile not found."
      );

    }


    const rows =
      JSON.parse(text);


    if (!rows.length) {

      throw new Error(
        "Profile not found for ID " +
        id
      );

    }


    return rows[0];

  }


  /*
    USERNAME SUPPORT

    This allows:

    profile.html?username=glory1357
  */


  if (username) {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/profiles" +
        "?select=*" +
        "&username=eq." +
        encodeURIComponent(username) +
        "&limit=1",

        {
          method: "GET",
          headers: headers()
        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        text ||
        "Could not find profile."
      );

    }


    if (text.trim()) {

      const rows =
        JSON.parse(text);


      if (rows.length) {

        return rows[0];

      }

    }


    throw new Error(
      "Profile not found."
    );

  }


  /*
    NO ID:

    Show current user's profile.
  */


  const myProfileResponse =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/profiles" +
      "?select=*" +
      "&id=eq." +
      encodeURIComponent(
        currentUser.id
      ) +
      "&limit=1",

      {
        headers: headers()
      }

    );


  const myProfileText =
    await myProfileResponse.text();


  if (
    myProfileResponse.ok &&
    myProfileText.trim()
  ) {

    const rows =
      JSON.parse(
        myProfileText
      );


    if (rows.length) {

      return rows[0];

    }

  }


  /*
    Fallback if profile row
    does not exist.
  */

  return {

    id:
      currentUser.id,

    username:
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "BERAKAH User",

    bio:
      "Welcome to my BERAKAH profile. Connect, share, build, and grow together."

  };

}


/* =========================================
   LOAD POSTS
========================================= */

async function loadPosts() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/posts" +
      "?select=*" +
      "&user_id=eq." +
      encodeURIComponent(
        profileUserId
      ) +
      "&order=created_at.desc",

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  console.log(
    "POSTS:",
    text
  );


  if (!response.ok) {

    throw new Error(
      "Could not load posts:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    return [];

  }


  return JSON.parse(text);

}


/* =========================================
   LOAD FOLLOWERS
========================================= */

async function loadFollowers() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/follows" +
      "?select=id" +
      "&following_id=eq." +
      encodeURIComponent(
        profileUserId
      ),

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  console.log(
    "FOLLOWERS:",
    text
  );


  if (!response.ok) {

    throw new Error(
      "Could not load followers:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    return 0;

  }


  const rows =
    JSON.parse(text);


  return rows.length;

}


/* =========================================
   LOAD FOLLOWING
========================================= */

async function loadFollowing() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/follows" +
      "?select=id" +
      "&follower_id=eq." +
      encodeURIComponent(
        profileUserId
      ),

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  console.log(
    "FOLLOWING:",
    text
  );


  if (!response.ok) {

    throw new Error(
      "Could not load following:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    return 0;

  }


  const rows =
    JSON.parse(text);


  return rows.length;

}


/* =========================================
   LOAD FOLLOW COUNTS
========================================= */

async function loadFollowCounts() {

  const followers =
    await loadFollowers();


  const following =
    await loadFollowing();


  document.getElementById(
    "followersCount"
  ).textContent =
    followers;


  document.getElementById(
    "followingCount"
  ).textContent =
    following;

}


/* =========================================
   CHECK FOLLOWING
========================================= */

async function checkFollowing() {

  if (
    String(profileUserId) ===
    String(currentUser.id)
  ) {

    return false;

  }


  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/follows" +
      "?select=id" +
      "&follower_id=eq." +
      encodeURIComponent(
        currentUser.id
      ) +
      "&following_id=eq." +
      encodeURIComponent(
        profileUserId
      ) +
      "&limit=1",

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Could not check follow status:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    return false;

  }


  const rows =
    JSON.parse(text);


  return rows.length > 0;

}


/* =========================================
   CREATE NOTIFICATION
========================================= */

async function createFollowNotification() {

  try {

    const actorName =
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "BERAKAH User";


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/notifications",

        {
          method: "POST",

          headers:
            headers({

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"

            }),

          body:
            JSON.stringify({

              user_id:
                profileUserId,

              actor_id:
                currentUser.id,

              type:
                "follow",

              message:
                actorName +
                " follows you",

              read:
                false

            })

        }

      );


    const text =
      await response.text();


    console.log(
      "NOTIFICATION:",
      text
    );


    if (!response.ok) {

      console.warn(
        "Notification was not created:",
        text
      );

      return false;

    }


    return true;

  }

  catch(error) {

    console.warn(
      "Notification error:",
      error
    );

    return false;

  }

}


/* =========================================
   DISPLAY POSTS
========================================= */

function displayPosts(posts) {

  const postsList =
    document.getElementById(
      "postsList"
    );


  postsList.innerHTML =
    "";


  document.getElementById(
    "postsCount"
  ).textContent =
    posts.length;


  if (!posts.length) {

    postsList.innerHTML = `

      <div class="empty-posts">
        No posts yet.
      </div>

    `;

    return;

  }


  posts.forEach(
    function(post) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "post";


      let dateText =
        "Date unavailable";


      if (post.created_at) {

        const date =
          new Date(
            post.created_at
          );


        if (
          !isNaN(
            date.getTime()
          )
        ) {

          dateText =
            date.toLocaleString();

        }

      }


      let imageHTML =
        "";


      if (
        post.image_url
      ) {

        imageHTML = `

          <img
            class="post-image"
            src="${safe(post.image_url)}"
            alt="Post image"
            onerror="this.style.display='none';"
          >

        `;

      }


      div.innerHTML = `

        <div class="post-time">
          ${safe(dateText)}
        </div>

        <div class="post-content">
          ${safe(post.content)}
        </div>

        ${imageHTML}

        <div class="post-actions">

          <button
            type="button"
            onclick="location.href='feed.html'">

            ❤️ Like

          </
