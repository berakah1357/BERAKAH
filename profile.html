* {

}

body {

header {

/* ==============================

   ============================== */

.modal {

.modal-loading,

/* ==============================

<script>


/* =====================================================
   BERAKAH SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
   ===================================================== */

let accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser =
null;


let profile =
null;


/* =====================================================
   SUPABASE HEADERS
   ===================================================== */

function supabaseHeaders(extra = {}) {

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + accessToken,

...extra

};

}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


/* =====================================================
   URL PARAMETER
   ===================================================== */

function getURLParameter(name) {

const params =
new URLSearchParams(
window.location.search
);

return params.get(name);

}


/* =====================================================
   ERROR DISPLAY
   ===================================================== */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"none";

const error =
document.getElementById(
"error"
);

error.style.display =
"block";

error.textContent =
message;

}


/* =====================================================
   SUPABASE REQUEST HELPER
   ===================================================== */

async function supabaseFetch(
url,
options = {}
) {

const response =
await fetch(
url,
{

...options,

headers:
supabaseHeaders(
options.headers || {}
)

}
);

return response;

}


/* =====================================================
   GET CURRENT AUTH USER
   ===================================================== */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"Your login session is missing. Please log in again."
);

}


const response =
await supabaseFetch(

SUPABASE_URL +
"/auth/v1/user",

{

method: "GET"

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Your login session is no longer valid.\n\nPlease log in again."
);

}


if (!text) {

throw new Error(
"No logged-in user was returned."
);

}


return JSON.parse(text);

}


/* =====================================================
   LOAD OWN PROFILE
   ===================================================== */

async function loadOwnProfile() {

const userId =
currentUser.id;


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";


const response =
await supabaseFetch(
url,
{
method: "GET"
}
);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load your profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Your BERAKAH profile was not found.\n\n" +
"Auth account exists, but no matching profiles.user_id was found."
);

}


profile =
rows[0];

}


/* =====================================================
   LOAD PROFILE BY NUMERIC ID
   ===================================================== */

async function loadProfileById(id) {

if (!/^[0-9]+$/.test(id)) {

throw new Error(
"Invalid profile ID."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&limit=1";


const response =
await supabaseFetch(
url,
{
method: "GET"
}
);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Profile was not found."
);

}


profile =
rows[0];

}


/* =====================================================
   LOAD PROFILE BY USERNAME
   ===================================================== */

async function loadProfileByUsername(username) {

username =
String(username || "")
replaceAtSymbol(username)
.trim();


if (!username) {

throw new Error(
"Username is empty."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&username=eq." +
encodeURIComponent(username) +
"&limit=1";


const response =
await supabaseFetch(
url,
{
method: "GET"
}
);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Username @" +
username +
" was not found."
);

}


profile =
rows[0];

}


/* =====================================================
   REMOVE @ FROM USERNAME
   ===================================================== */

function replaceAtSymbol(username) {

return String(username || "")
replace(/^@/, "");

}


/* =====================================================
   DISPLAY PROFILE
   ===================================================== */

function displayProfile() {

const fullName =
profile["Full name"] ||
profile.full_name ||
profile.name ||
profile.username ||
"BERAKAH";


const username =
profile.username ||
"berakah1357";


const language =
profile.language ||
"—";


const bio =
profile.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


document.getElementById(
"profileName"
).textContent =
fullName;


document.getElementById(
"profileUsername"
).textContent =
"@" +
username;


document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
String(language).toUpperCase();


document.getElementById(
"profileBio"
).textContent =
bio;


/* AVATAR */

const avatar =
document.getElementById(
"avatar"
);


if (profile.avatar_url) {

avatar.innerHTML =
"<img src=\"" +
escapeHTML(profile.avatar_url) +
"\" alt=\"Profile picture\">";

}
else {

avatar.textContent =
fullName
.charAt(0)
.toUpperCase();

}


/* EDIT / FOLLOW */

setupEditPermission();

}


/* =====================================================
   OWN PROFILE CHECK
   ===================================================== */

function isOwnProfile() {

if (!currentUser ||
!profile) {

return false;

}


if (
profile.user_id &&
String(profile.user_id).toLowerCase() ===
String(currentUser.id).toLowerCase()
) {

return true;

}


return false;

}


/* =====================================================
   EDIT / FOLLOW BUTTONS
   ===================================================== */

function setupEditPermission() {

const editButton =
document.getElementById(
"editButton"
);

const followButton =
document.getElementById(
"followButton"
);


if (isOwnProfile()) {

editButton.style.display =
"inline-block";

followButton.style.display =
"none";

}
else {

editButton.style.display =
"none";

followButton.style.display =
"inline-block";

checkFollowingStatus();

}

}


/* =====================================================
   OPEN EDIT
   ===================================================== */

function openEdit() {

if (!isOwnProfile()) {

return;

}


document.getElementById(
"editFullName"
).value =
profile["Full name"] ||
profile.full_name ||
profile.name ||
"";


document.getElementById(
"editUsername"
).value =
profile.username ||
"";


document.getElementById(
"editLanguage"
).value =
profile.language ||
"en";


document.getElementById(
"editBio"
).value =
profile.bio ||
"";


document.getElementById(
"editStatus"
).textContent =
"";


document.getElementById(
"editBox"
).style.display =
"block";

}


/* =====================================================
   CANCEL EDIT
   ===================================================== */

function cancelEdit() {

document.getElementById(
"editBox"
).style.display =
"none";

}


/* =====================================================
   SAVE PROFILE
   ===================================================== */

async function saveProfile() {

if (!isOwnProfile()) {

return;

}


const fullName =
document.getElementById(
"editFullName"
).value.trim();


const username =
replaceAtSymbol(
document.getElementById(
"editUsername"
).value
.trim()
);


const language =
document.getElementById(
"editLanguage"
).value;


const bio =
document.getElementById(
"editBio"
).value.trim();


const status =
document.getElementById(
"editStatus"
);


const button =
document.getElementById(
"saveButton"
);


if (!fullName) {

status.textContent =
"Full name is required.";

return;

}


if (!username) {

status.textContent =
"Username is required.";

return;

}


if (!/^[a-zA-Z0-9_.-]+$/.test(username)) {

status.textContent =
"Username can only contain letters, numbers, underscore, dot, or dash.";

return;

}


button.disabled =
true;

status.textContent =
"Saving...";


try {

const updateData = {

"Full name":
fullName,

username:
username,

language:
language,

bio:
bio

};


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(
profile.id
);


const response =
await supabaseFetch(

url,

{

method: "PATCH",

headers: {

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify(
updateData
)

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
text || "Profile update failed."
);

}


const updatedRows =
text ?
JSON.parse(text) :
[];


if (updatedRows.length) {

profile =
updatedRows[0];

}


localStorage.setItem(
"berakah_username",
username
);


displayProfile();


status.textContent =
"Profile saved successfully!";


setTimeout(
function() {

document.getElementById(
"editBox"
).style.display =
"none";

status.textContent =
"";

},
1200
);

}
catch(error) {

console.error(
"PROFILE SAVE ERROR:",
error
);

status.textContent =
"Could not save profile.";

}


button.disabled =
false;

}


/* =====================================================
   LOAD POSTS
   ===================================================== */

async function loadPosts() {

const userId =
profile.user_id;


if (!userId) {

displayPosts([]);

return;

}


const url =
SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&order=created_at.desc";


const response =
await supabaseFetch(
url,
{
method: "GET"
}
);


const text =
await response.text();


if (!response.ok) {

console.warn(
"Posts could not be loaded:",
text
);

displayPosts([]);

return;

}


const posts =
text ?
JSON.parse(text) :
[];


displayPosts(posts);

}


/* =====================================================
   DISPLAY POSTS
   ===================================================== */

function displayPosts(posts) {

const list =
document.getElementById(
"postsList"
);


list.innerHTML =
"";


document.getElementById(
"postsCount"
).textContent =
posts.length;


if (!posts.length) {

list.innerHTML =
"<div class=\"empty\">No posts yet.</div>";

return;

}


posts.forEach(
function(post) {

const div =
document.createElement(
"div"
);


div.className =
"post";


let date =
"";


if (post.created_at) {

const d =
new Date(
post.created_at
);

if (!isNaN(
d.getTime()
)) {

date =
d.toLocaleString();

}

}


let image =
"";


if (post.image_url) {

image =
"<img class=\"post-image\" src=\"" +
escapeHTML(post.image_url) +
"\" alt=\"Post image\">";

}


div.innerHTML =

"<div class=\"post-date\">" +
escapeHTML(date) +
"</div>" +

"<div class=\"post-content\">" +
escapeHTML(
post.content || ""
) +
"</div>" +

image +

"<button class=\"like-button\">" +
"❤️ Like" +
"</button>";


list.appendChild(div);

});

}

/* =====================================================
   GET FOLLOW RELATION IDS
   ===================================================== */

async function getFollowIds(type) {

if (!profile ||
!profile.user_id) {

return [];

}


let url = "";


/*
FOLLOWERS:

People whose follower_id
points TO this profile.

following_id = profile.user_id
*/

if (type === "followers") {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=follower_id" +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);

}


/*
FOLLOWING:

People this profile follows.

follower_id = profile.user_id
*/

if (type === "following") {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=following_id" +
"&follower_id=eq." +
encodeURIComponent(
profile.user_id
);

}


if (!url) {

return [];

}


const response =
await supabaseFetch(
url,
{
method: "GET"
}
);


const text =
await response.text();


if (!response.ok) {

throw new Error(
text || "Could not load follow records."
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (type === "followers") {

return rows
.map(
row => row.follower_id
)
.filter(Boolean);

}


return rows
.map(
row => row.following_id
)
.filter(Boolean);

}


/* =====================================================
   LOAD PROFILES FROM USER UUIDS
   ===================================================== */

async function loadProfilesByUserIds(
userIds
) {

if (!userIds.length) {

return [];

}


/*
IMPORTANT:

The follows table stores Auth UUIDs.

The profiles table also uses
user_id for the Auth UUID.

We therefore query:

profiles.user_id IN (...)

instead of assuming that
profiles.id equals follows ID.
*/


const encodedIds =
userIds
.map(
id => encodeURIComponent(id)
)
.join(",");


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=in.(" +
encodedIds +
")";


const response =
await supabaseFetch(
url,
{
method: "GET"
}
);


const text =
await response.text();


if (!response.ok) {

throw new Error(
text || "Could not load profiles."
);

}


const rows =
text ?
JSON.parse(text) :
[];


/*
Keep the same order as the
follow records.
*/

const profileMap =
new Map();


rows.forEach(
row => {

if (row.user_id) {

profileMap.set(
String(row.user_id).toLowerCase(),
row
);

}

});


return userIds
.map(
id =>
profileMap.get(
String(id).toLowerCase()
)
)
.filter(Boolean);

}

/* =====================================================
   FOLLOW / UNFOLLOW
   ===================================================== */

async function followUser() {

if (!currentUser ||
!profile ||
!profile.user_id) {

return;

}


if (isOwnProfile()) {

return;

}


const button =
document.getElementById(
"followButton"
);


const status =
document.getElementById(
"status"
);


button.disabled =
true;


try {


/* CHECK EXISTING */

const checkURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const checkResponse =
await supabaseFetch(
checkURL,
{
method: "GET"
}
);


const checkText =
await checkResponse.text();


if (!checkResponse.ok) {

throw new Error(
"Could not check follow status."
);

}


const existing =
checkText ?
JSON.parse(checkText) :
[];


/* =================================
   UNFOLLOW
   ================================= */

if (existing.length) {

const deleteURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const deleteResponse =
await supabaseFetch(

deleteURL,

{

method: "DELETE"

}

);


if (!deleteResponse.ok) {

const deleteText =
await deleteResponse.text();

throw new Error(
deleteText ||
"Could not unfollow."
);

}


button.textContent =
"Follow";

button.className =
"action follow";

status.textContent =
"Unfollowed.";

}


/* =================================
   FOLLOW
   ================================= */

else {

const followResponse =
await supabaseFetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method: "POST",

headers: {

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profile.user_id

})

}

);


if (!followResponse.ok) {

const text =
await followResponse.text();

throw new Error(
text ||
"Could not follow this user."
);

}


button.textContent =
"Following";

button.className =
"action following";

status.textContent =
"Following.";

}


await loadFollowCounts();


setTimeout(
function() {

status.textContent =
"";

},
1500
);

}
catch(error) {

console.error(
"FOLLOW ERROR:",
error
);

status.textContent =
"Follow error.";

}


button.disabled =
false;

}

/* =====================================================
   START PROFILE
   ===================================================== */

async function start() {

try {


/* =================================
   TOKEN CHECK
   ================================= */

if (!accessToken) {

window.location.href =
"login.html";

return;

}


/* =================================
   VERIFY AUTH SESSION
   ================================= */

try {

currentUser =
await getCurrentUser();

}
catch(error) {

/*
The browser may have an old
expired Supabase token.

Clear it and return to login.
*/

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

localStorage.removeItem(
"berakah_username"
);

localStorage.removeItem(
"berakah_auth_user_id"
);

window.location.href =
"login.html";

return;

}


/* =================================
   URL OPTIONS
   ================================= */

const requestedId =
getURLParameter(
"id"
);


const requestedUsername =
getURLParameter(
"username"
);


/* =================================
   LOAD REQUESTED PROFILE
   ================================= */

if (requestedId) {

await loadProfileById(
requestedId
);

}
else if (requestedUsername) {

await loadProfileByUsername(
requestedUsername
);

}
else {

await loadOwnProfile();

}


/* =================================
   DISPLAY
   ================================= */

displayProfile();


/* =================================
   LOAD POSTS
   ================================= */

await loadPosts();


/* =================================
   LOAD FOLLOW COUNTS
   ================================= */

await loadFollowCounts();


/* =================================
   SHOW PROFILE
   ================================= */

document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"profile"
).style.display =
"block";


}
catch(error) {

console.error(
"BERAKAH PROFILE ERROR:",
error
);

showError(
error.message ||
"Something went wrong while loading your profile."
);

}

}


/* =====================================================
   RUN
   ===================================================== */

start();
