<script>

/* =====================================================
   BERAKAH SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
   ===================================================== */

const accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;

let profile = null;


/* =====================================================
   SUPABASE HEADERS
   ===================================================== */

function supabaseHeaders(extra = {}) {

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + accessToken,

...extra

};

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


/* =====================================================
   ERROR
   ===================================================== */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"none";

const error =
document.getElementById(
"error"
);

error.style.display =
"block";

error.textContent =
message;

}


/* =====================================================
   GET URL PARAMETERS
   ===================================================== */

function getURLParameter(name) {

const params =
new URLSearchParams(
window.location.search
);

return params.get(name);

}


/* =====================================================
   GET CURRENT AUTH USER
   ===================================================== */

async function getCurrentUser() {

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not verify login:\n\n" +
text
);

}


if (!text) {

throw new Error(
"No logged-in user was returned."
);

}


return JSON.parse(text);

}


/* =====================================================
   LOAD OWN PROFILE
   ===================================================== */

async function loadOwnProfile() {

const userId =
currentUser.id;


/*
Find profile using the Auth UUID.

This is the important correction.

The profile ID is NOT required.
*/

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load your profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Your BERAKAH profile was not found.\n\n" +
"Auth ID:\n" +
userId
);

}


profile =
rows[0];


displayProfile();

}


/* =====================================================
   LOAD PROFILE BY NUMERIC ID
   ===================================================== */

async function loadProfileById(id) {

if (!/^[0-9]+$/.test(id)) {

throw new Error(
"Invalid profile ID."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Profile was not found."
);

}


profile =
rows[0];


displayProfile();

}


/* =====================================================
   LOAD PROFILE BY USERNAME
   ===================================================== */

async function loadProfileByUsername(username) {

username =
String(username || "")
.replace("@", "")
.trim();


if (!username) {

throw new Error(
"Username is empty."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&username=eq." +
encodeURIComponent(username) +
"&limit=1";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


const rows =
text ?
JSON.parse(text) :
[];


if (!rows.length) {

throw new Error(
"Username @" +
username +
" was not found."
);

}


profile =
rows[0];


displayProfile();

}


/* =====================================================
   DISPLAY PROFILE
   ===================================================== */

function displayProfile() {

const fullName =
profile["Full name"] ||
profile.full_name ||
profile.name ||
profile.username ||
"BERAKAH";


const username =
profile.username ||
"berakah1357";


const language =
profile.language ||
"—";


const bio =
profile.bio ||
"Welcome to my BERAKAH profile. Connect, share, build, and grow together.";


document.getElementById(
"profileName"
).textContent =
fullName;


document.getElementById(
"profileUsername"
).textContent =
"@" +
username;


document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
language.toUpperCase();


document.getElementById(
"profileBio"
).textContent =
bio;


/* AVATAR */

const avatar =
document.getElementById(
"avatar"
);


if (profile.avatar_url) {

avatar.innerHTML =
`<img
src="${escapeHTML(profile.avatar_url)}"
alt="Profile picture">`;

}
else {

avatar.textContent =
fullName
.charAt(0)
.toUpperCase();

}


/* EDIT PERMISSION */

setupEditPermission();

}


/* =====================================================
   CHECK OWN PROFILE
   ===================================================== */

function isOwnProfile() {

if (!currentUser || !profile) {

return false;

}


/*
MAIN OWNERSHIP CHECK

profiles.user_id
must equal
auth.users.id
*/

if (
profile.user_id &&
String(profile.user_id).toLowerCase() ===
String(currentUser.id).toLowerCase()
) {

return true;

}


/*
FALLBACK FOR OLD PROFILE ROWS

Compare username if user_id
was not filled in.
*/

if (!profile.user_id) {

const metadata =
currentUser.user_metadata || {};

const loggedUsername =
String(
metadata.username ||
metadata.user_name ||
metadata.userName ||
""
)
.replace("@", "")
.toLowerCase()
.trim();


const profileUsername =
String(
profile.username || ""
)
.replace("@", "")
.toLowerCase()
.trim();


if (
loggedUsername &&
profileUsername &&
loggedUsername === profileUsername
) {

return true;

}

}


return false;

}


/* =====================================================
   EDIT / FOLLOW BUTTONS
   ===================================================== */

function setupEditPermission() {

const editButton =
document.getElementById(
"editButton"
);

const followButton =
document.getElementById(
"followButton"
);


if (isOwnProfile()) {

editButton.style.display =
"inline-block";

followButton.style.display =
"none";

}
else {

editButton.style.display =
"none";

followButton.style.display =
"inline-block";

checkFollowingStatus();

}

}


/* =====================================================
   OPEN EDIT
   ===================================================== */

function openEdit() {

if (!isOwnProfile()) {

document.getElementById(
"status"
).textContent =
"You can only edit your own profile.";

return;

}


document.getElementById(
"editFullName"
).value =
profile["Full name"] ||
profile.full_name ||
profile.name ||
"";


document.getElementById(
"editUsername"
).value =
profile.username ||
"";


document.getElementById(
"editLanguage"
).value =
profile.language ||
"ht";


document.getElementById(
"editBio"
).value =
profile.bio ||
"";


document.getElementById(
"editStatus"
).textContent =
"";


document.getElementById(
"editBox"
).style.display =
"block";

}


/* =====================================================
   CANCEL
   ===================================================== */

function cancelEdit() {

document.getElementById(
"editBox"
).style.display =
"none";

}


/* =====================================================
   SAVE PROFILE
   ===================================================== */

async function saveProfile() {

if (!isOwnProfile()) {

document.getElementById(
"editStatus"
).textContent =
"You cannot edit this profile.";

return;

}


const fullName =
document.getElementById(
"editFullName"
).value.trim();


const username =
document.getElementById(
"editUsername"
).value
.trim()
.replace("@", "");


const language =
document.getElementById(
"editLanguage"
).value;


const bio =
document.getElementById(
"editBio"
).value.trim();


const status =
document.getElementById(
"editStatus"
);


const button =
document.getElementById(
"saveButton"
);


if (!fullName) {

status.textContent =
"Full name is required.";

return;

}


if (!username) {

status.textContent =
"Username is required.";

return;

}


button.disabled =
true;

status.textContent =
"Saving...";


try {


const updateData = {

"Full name":
fullName,

username:
username,

language:
language,

bio:
bio

};


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(
profile.id
),

{

method: "PATCH",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=representation"

}),

body:
JSON.stringify(
updateData
)

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Profile update failed:\n\n" +
text
);

}


const updatedRows =
text ?
JSON.parse(text) :
[];


if (updatedRows.length) {

profile =
updatedRows[0];

}


/*
Also keep username in the browser
session for the rest of BERAKAH.
*/

localStorage.setItem(
"berakah_username",
username
);


displayProfile();


status.textContent =
"Profile saved successfully!";


setTimeout(
function() {

document.getElementById(
"editBox"
).style.display =
"none";

status.textContent =
"";

},
1200
);


}
catch(error) {

console.error(
"PROFILE SAVE ERROR:",
error
);

status.textContent =
error.message;

}


button.disabled =
false;

}


/* =====================================================
   LOAD POSTS
   ===================================================== */

async function loadPosts() {

const userId =
profile.user_id;


if (!userId) {

displayPosts([]);

return;

}


const url =
SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&order=created_at.desc";


const response =
await fetch(

url,

{

method: "GET",

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

console.warn(
"Posts could not be loaded:",
text
);

displayPosts([]);

return;

}


const posts =
text ?
JSON.parse(text) :
[];


displayPosts(posts);

}


/* =====================================================
   DISPLAY POSTS
   ===================================================== */

function displayPosts(posts) {

const list =
document.getElementById(
"postsList"
);


list.innerHTML =
"";


document.getElementById(
"postsCount"
).textContent =
posts.length;


if (!posts.length) {

list.innerHTML =
`<div class="empty">
No posts yet.
</div>`;

return;

}


posts.forEach(
post => {

const div =
document.createElement(
"div"
);


div.className =
"post";


let date =
"";


if (post.created_at) {

const d =
new Date(
post.created_at
);

if (!isNaN(
d.getTime()
)) {

date =
d.toLocaleString();

}

}


let image =
"";


if (post.image_url) {

image =
`<img
class="post-image"
src="${escapeHTML(post.image_url)}"
alt="Post image">`;

}


div.innerHTML = `

<div class="post-date">
${escapeHTML(date)}
</div>

<div class="post-content">
${escapeHTML(
post.content || ""
)}
</div>

${image}

<button
class="like-button">

❤️ Like

</button>

`;


list.appendChild(div);

});

}


/* =====================================================
   FOLLOW COUNTS
   ===================================================== */

async function loadFollowCounts() {

if (!profile.user_id) {

return;

}


/* FOLLOWERS */

const followersURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const followersResponse =
await fetch(

followersURL,

{

headers:
supabaseHeaders()

}

);


const followersText =
await followersResponse.text();


if (followersResponse.ok) {

const followers =
followersText ?
JSON.parse(followersText) :
[];


document.getElementById(
"followersCount"
).textContent =
followers.length;

}


/* FOLLOWING */

const followingURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
profile.user_id
);


const followingResponse =
await fetch(

followingURL,

{

headers:
supabaseHeaders()

}

);


const followingText =
await followingResponse.text();


if (followingResponse.ok) {

const following =
followingText ?
JSON.parse(followingText) :
[];


document.getElementById(
"followingCount"
).textContent =
following.length;

}

}


/* =====================================================
   CHECK FOLLOWING
   ===================================================== */

async function checkFollowingStatus() {

if (!currentUser ||
!profile ||
!profile.user_id) {

return;

}


if (
String(currentUser.id).toLowerCase() ===
String(profile.user_id).toLowerCase()
) {

return;

}


const url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


try {

const response =
await fetch(

url,

{

headers:
supabaseHeaders()

}

);


const text =
await response.text();


if (!response.ok) {

return;

}


const rows =
text ?
JSON.parse(text) :
[];


const button =
document.getElementById(
"followButton"
);


if (rows.length) {

button.textContent =
"Following";

button.className =
"action following";

}
else {

button.textContent =
"Follow";

button.className =
"action follow";

}

}
catch(error) {

console.warn(
"Could not check follow status:",
error
);

}

}


/* =====================================================
   FOLLOW / UNFOLLOW
   ===================================================== */

async function followUser() {

if (!currentUser ||
!profile ||
!profile.user_id) {

return;

}


if (isOwnProfile()) {

return;

}


const button =
document.getElementById(
"followButton"
);


const status =
document.getElementById(
"status"
);


button.disabled =
true;


try {


const checkURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const checkResponse =
await fetch(

checkURL,

{

headers:
supabaseHeaders()

}

);


const checkText =
await checkResponse.text();


if (!checkResponse.ok) {

throw new Error(
checkText
);

}


const existing =
checkText ?
JSON.parse(checkText) :
[];


if (existing.length) {


const deleteURL =
SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);


const deleteResponse =
await fetch(

deleteURL,

{

method: "DELETE",

headers:
supabaseHeaders()

}

);


if (!deleteResponse.ok) {

throw new Error(
"Could not unfollow."
);

}


button.textContent =
"Follow";

button.className =
"action follow";

status.textContent =
"Unfollowed.";

}
else {


const followResponse =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method: "POST",

headers:
supabaseHeaders({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
profile.user_id

})

}

);


if (!followResponse.ok) {

const text =
await followResponse.text();

throw new Error(text);

}


button.textContent =
"Following";

button.className =
"action following";

status.textContent =
"Following.";

}


await loadFollowCounts();

}
catch(error) {

console.error(
"FOLLOW ERROR:",
error
);

status.textContent =
"Follow error: " +
error.message;

}


button.disabled =
false;

}

async function start() {

try {


/*
NO TOKEN = LOGIN
*/

if (!accessToken) {

window.location.href =
"login.html";

return;

}


/*
VERIFY THE ACTUAL
SUPABASE AUTH ACCOUNT
*/

currentUser =
await getCurrentUser();


/*
CHECK URL

profile.html
= own profile

profile.html?id=123
= profile by numeric ID

profile.html?username=holiness1357
= profile by username
*/

const requestedId =
getURLParameter("id");

const requestedUsername =
getURLParameter("username");


if (requestedId) {

await loadProfileById(
requestedId
);

}
else if (requestedUsername) {

await loadProfileByUsername(
requestedUsername
);

}
else {

/*
THIS IS THE IMPORTANT FIX.

No profile ID is required.

Automatically load the
profile belonging to the
currently logged-in Auth UUID.
*/

await loadOwnProfile();

}


await loadPosts();

await loadFollowCounts();


document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"profile"
).style.display =
"block";


}
catch(error) {

console.error(
"BERAKAH PROFILE ERROR:",
error
);

showError(
error.message
);

}

}


start();
