/* =====================================================
   BERAKAH SUPABASE
===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const accessToken =
localStorage.getItem("berakah_access_token");

let currentUser = null;
let profileData = null;

/*
  profiles.id = BIGINT
  profiles.user_id = UUID

  We keep both separately.
*/

let profileDatabaseId = null;
let profileAuthUserId = null;


/* =====================================================
   HEADERS
===================================================== */

function headers(extra = {}) {

return Object.assign({

"apikey": SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + accessToken,

"Accept":
"application/json"

}, extra);

}


/* =====================================================
   SAFE HTML
===================================================== */

function safe(value) {

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

document.getElementById("loading")
.style.display = "none";

document.getElementById("profile")
.style.display = "none";

const box =
document.getElementById("error");

box.style.display = "block";

box.textContent = message;

}


/* =====================================================
   GET PROFILE ID FROM URL
===================================================== */

function getProfileId() {

const params =
new URLSearchParams(
window.location.search
);

return params.get("id");

}


/* =====================================================
   GET CURRENT AUTH USER
===================================================== */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"Your login session is missing.\n\nPlease log in again."
);

}

const response =
await fetch(
SUPABASE_URL + "/auth/v1/user",
{
method:"GET",
headers:headers()
}
);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Login session error:\n\n" + text
);

}

if (!text.trim()) {

throw new Error(
"Supabase returned no user."
);

}

return JSON.parse(text);

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile() {

const requestedId =
getProfileId();

if (!requestedId) {

throw new Error(
"No profile ID was provided.\n\nExample:\nprofile.html?id=3"
);

}


/*
 IMPORTANT:

 The People page sends:

 profile.html?id=1

 profile.html?id=2

 profile.html?id=3

 These are BIGINT profiles.id values.

 We therefore query:

 id=eq.<number>

 NOT:

 user_id=eq.<number>
*/


if (!/^[0-9]+$/.test(requestedId)) {

throw new Error(
"Invalid profile ID: " +
requestedId +
"\n\nThe profile link must use the numeric profiles.id."
);

}


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=id,created_at,\"Full name\",username,language,avatar_url,user_id" +
"&id=eq." +
requestedId +
"&limit=1";


console.log(
"PROFILE REQUEST:",
url
);


const response =
await fetch(
url,
{
method:"GET",
headers:headers()
}
);


const text =
await response.text();


console.log(
"PROFILE RESPONSE:",
text
);


if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}


if (!text.trim()) {

throw new Error(
"Profile request returned an empty response."
);

}


const rows =
JSON.parse(text);


if (!rows.length) {

throw new Error(
"No profile was found for ID " +
requestedId +
"."
);

}


profileData =
rows[0];


/*
 SAVE BOTH IDS
*/

profileDatabaseId =
profileData.id;

profileAuthUserId =
profileData.user_id;


console.log(
"PROFILE DATABASE ID:",
profileDatabaseId
);

console.log(
"PROFILE AUTH UUID:",
profileAuthUserId
);


/* =====================================================
   DISPLAY PROFILE
===================================================== */

const fullName =
profileData["Full name"] ||
profileData.username ||
"BERAKAH User";


const username =
profileData.username ||
"berakahuser";


document.getElementById(
"profileName"
).textContent =
fullName;


document.getElementById(
"profileUsername"
).textContent =
"@" + username.toLowerCase();


document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
(
profileData.language
?
profileData.language.toUpperCase()
:
"—"
);


/* =====================================================
   AVATAR
===================================================== */

const avatar =
document.getElementById("avatar");


if (profileData.avatar_url) {

avatar.innerHTML = "";

const image =
document.createElement("img");

image.src =
profileData.avatar_url;

image.alt =
"Profile picture";

avatar.appendChild(image);

}
else {

avatar.textContent =
String(fullName)
.charAt(0)
.toUpperCase() ||
"B";

}


/* =====================================================
   POSTS
===================================================== */

const posts =
await loadPosts();

displayPosts(posts);


/* =====================================================
   FOLLOW COUNTS
===================================================== */

await loadFollowCounts();


/* =====================================================
   FOLLOW BUTTON
===================================================== */

await updateFollowButton();


/* =====================================================
   OWNER CHECK
===================================================== */

if (
profileAuthUserId &&
String(profileAuthUserId) ===
String(currentUser.id)
) {

document.getElementById(
"editButton"
).style.display =
"inline-block";

}


/* =====================================================
   SHOW PROFILE
===================================================== */

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"block";

}


/* =====================================================
   LOAD POSTS
===================================================== */

async function loadPosts() {

if (!profileAuthUserId) {

console.log(
"No profile user UUID. No posts loaded."
);

return [];

}


/*
 IMPORTANT:

 posts.user_id is UUID.

 Therefore we use:

 user_id=eq.<UUID>

 NOT profiles.id.
*/


const url =
SUPABASE_URL +
"/rest/v1/posts" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(profileAuthUserId) +
"&order=created_at.desc";


console.log(
"POSTS REQUEST:",
url
);


const response =
await fetch(
url,
{
method:"GET",
headers:headers()
}
);


const text =
await response.text();


console.log(
"POSTS RESPONSE:",
text
);


if (!response.ok) {

throw new Error(
"Could not load posts:\n\n" +
text
);

}


if (!text.trim()) {

return [];

}


return JSON.parse(text);

}


/* =====================================================
   DISPLAY POSTS
===================================================== */

function displayPosts(posts) {

const list =
document.getElementById("postsList");

list.innerHTML = "";

document.getElementById(
"postsCount"
).textContent =
posts.length;


if (!posts.length) {

list.innerHTML = `
<div class="empty">
No posts yet.
</div>
`;

return;

}


posts.forEach(function(post) {

const div =
document.createElement("div");

div.className =
"post";


let dateText =
"Date unavailable";


if (post.created_at) {

const date =
new Date(post.created_at);

if (!isNaN(date.getTime())) {

dateText =
date.toLocaleString();

}

}


let imageHTML = "";


if (post.image_url) {

imageHTML = `
<img
class="post-image"
src="${safe(post.image_url)}"
alt="Post image">
`;

}


div.innerHTML = `

<div class="post-time">
${safe(dateText)}
</div>

<div class="post-content">
${safe(post.content || "")}
</div>

${imageHTML}

<div class="post-actions">

<button
type="button"
onclick="location.href='feed.html'">
❤️ Like
</button>

</div>
`;


list.appendChild(div);

});

}


/* =====================================================
   FOLLOW COUNTS
===================================================== */

async function loadFollowCounts() {

if (!profileAuthUserId) {

return;

}


/*
 Followers:

 following_id = profile UUID
*/

const followersUrl =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&following_id=eq." +
encodeURIComponent(profileAuthUserId);


const followersResponse =
await fetch(
followersUrl,
{
method:"GET",
headers:headers()
}
);


const followersText =
await followersResponse.text();


console.log(
"FOLLOWERS:",
followersText
);


if (!followersResponse.ok) {

throw new Error(
"Could not load followers:\n\n" +
followersText
);

}


const followers =
followersText.trim()
?
JSON.parse(followersText)
:
[];


/*
 Following:

 follower_id = profile UUID
*/

const followingUrl =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(profileAuthUserId);


const followingResponse =
await fetch(
followingUrl,
{
method:"GET",
headers:headers()
}
);


const followingText =
await followingResponse.text();


console.log(
"FOLLOWING:",
followingText
);


if (!followingResponse.ok) {

throw new Error(
"Could not load following:\n\n" +
followingText
);

}


const following =
followingText.trim()
?
JSON.parse(followingText)
:
[];


document.getElementById(
"followersCount"
).textContent =
followers.length;


document.getElementById(
"followingCount"
).textContent =
following.length;

}


/* =====================================================
   CHECK FOLLOWING
===================================================== */

async function checkFollowing() {

if (
!profileAuthUserId ||
String(profileAuthUserId) ===
String(currentUser.id)
) {

return false;

}


const url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=id" +
"&follower_id=eq." +
encodeURIComponent(currentUser.id) +
"&following_id=eq." +
encodeURIComponent(profileAuthUserId);


const response =
await fetch(
url,
{
method:"GET",
headers:headers()
}
);


const text =
await response.text();


if (!response.ok) {

throw new Error(
"Could not check follow status:\n\n" +
text
);

}


if (!text.trim()) {

return false;

}


return JSON.parse(text).length > 0;

}


/* =====================================================
   UPDATE FOLLOW BUTTON
===================================================== */

async function updateFollowButton() {

const button =
document.getElementById("followButton");


if (
!profileAuthUserId ||
String(profileAuthUserId) ===
String(currentUser.id)
) {

button.style.display =
"none";

return;

}


button.style.display =
"inline-block";


const following =
await checkFollowing();


if (following) {

button.textContent =
"Following";

button.className =
"action-button following";

}
else {

button.textContent =
"Follow";

button.className =
"action-button follow";

}

}


/* =====================================================
   CREATE NOTIFICATION
===================================================== */

async function createFollowNotification() {

const actorName =
currentUser.user_metadata?.username ||
currentUser.email?.split("@")[0] ||
"BERAKAH User";


const response =
await fetch(
SUPABASE_URL +
"/rest/v1/notifications",
{
method:"POST",
headers:headers({
"Content-Type":"application/json",
"Prefer":"return=minimal"
}),
body:JSON.stringify({

user_id:
profileAuthUserId,

actor_id:
currentUser.id,

type:
"follow",

message:
actorName + " follows you",

read:false

})
}
);


if (!response.ok) {

console.log(
"Notification could not be created."
);

}

}


/* =====================================================
   FOLLOW / UNFOLLOW
===================================================== */

async function toggleFollow() {

const button =
document.getElementById("followButton");

const status =
document.getElementById("status");


button.disabled =
true;


try {

const following =
await checkFollowing();


if (following) {

const url =
SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(currentUser.id) +
"&following_id=eq." +
encodeURIComponent(profileAuthUserId);


const response =
await fetch(
url,
{
method:"DELETE",
headers:headers()
}
);


const text =
await response.text();


if (!response.ok) {

throw new Error(
text ||
"Could not unfollow."
);

}


status.textContent =
"Unfollowed successfully.";

}
else {

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/follows",
{
method:"POST",
headers:headers({
"Content-Type":"application/json",
"Prefer":"return=minimal"
}),
body:JSON.stringify({

follower_id:
currentUser.id,

following_id:
profileAuthUserId

})
}
);


const text =
await response.text();


if (!response.ok) {

throw new Error(
text ||
"Could not follow."
);

}


await createFollowNotification();


status.textContent =
"Following successfully.";

}


await loadFollowCounts();

await updateFollowButton();

}
catch(error) {

console.error(
"FOLLOW ERROR:",
error
);

status.textContent =
error.message;

}


button.disabled =
false;

}


/* =====================================================
   OPEN EDIT PROFILE
===================================================== */

function openEditProfile() {

const editBox =
document.getElementById("editBox");


editBox.style.display =
"block";


document.getElementById(
"editFullName"
).value =
profileData["Full name"] ||
profileData.username ||
"";


document.getElementById(
"editUsername"
).value =
profileData.username ||
"";


document.getElementById(
"editLanguage"
).value =
profileData.language ||
"";


document.getElementById(
"editStatus"
).textContent =
"";


editBox.scrollIntoView({
behavior:"smooth"
});

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit() {

document.getElementById(
"editBox"
).style.display =
"none";

document.getElementById(
"editStatus"
).textContent =
"";

}


/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile() {

const button =
document.getElementById(
"saveProfileButton"
);

const status =
document.getElementById(
"editStatus"
);


const fullName =
document.getElementById(
"editFullName"
).value.trim();


const username =
document.getElementById(
"editUsername"
).value.trim();


const language =
document.getElementById(
"editLanguage"
).value;


if (!fullName) {

status.textContent =
"Please enter your full name.";

return;

}


if (!username) {

status.textContent =
"Please enter your username.";

return;

}


button.disabled =
true;

status.textContent =
"Saving...";


try {


/*
 IMPORTANT:

 profiles.id is BIGINT.

 We update using the numeric database ID.

 We do NOT use the UUID here.
*/


const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(profileDatabaseId);


const response =
await fetch(
url,
{
method:"PATCH",

headers:headers({

"Content-Type":
"application/json",

"Prefer":
"return=representation"

}),

body:JSON.stringify({

"Full name":
fullName,

username:
username,

language:
language

})
}
);


const text =
await response.text();


console.log(
"SAVE PROFILE RESPONSE:",
text
);


if (!response.ok) {

throw new Error(
"Could not save profile:\n\n" +
text
);

}


if (text.trim()) {

const savedRows =
JSON.parse(text);

if (savedRows.length) {

profileData =
