<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

header {

.modal-loading,

@media (max-width: 650px) {

<script>

/* =====================================================
   EPHPHAVORA SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const AVATAR_BUCKET =
"avatars";


/* =====================================================
   SESSION
   ===================================================== */

let accessToken =
localStorage.getItem(
"berakah_access_token"
);

let currentUser =
null;

let profile =
null;


/* =====================================================
   SUPABASE HEADERS
   ===================================================== */

function supabaseHeaders(extra = {}) {

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + accessToken,

...extra

};

}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


/* =====================================================
   URL PARAMETER
   ===================================================== */

function getURLParameter(name) {

const params =
new URLSearchParams(
window.location.search
);

return params.get(name);

}


/* =====================================================
   ERROR DISPLAY
   ===================================================== */

function showError(message) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"none";

const error =
document.getElementById(
"error"
);

error.style.display =
"block";

error.textContent =
message;

}


/* =====================================================
   SUPABASE REQUEST HELPER
   ===================================================== */

async function supabaseFetch(
url,
options = {}
) {

const response =
await fetch(
url,
{

...options,

headers:
supabaseHeaders(
options.headers || {}
)

}
);

return response;

}


/* =====================================================
   GET CURRENT AUTH USER
   ===================================================== */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"Your login session is missing. Please log in again."
);

}

const response =
await supabaseFetch(

SUPABASE_URL +
"/auth/v1/user",

{

method: "GET"

}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Your login session is no longer valid.\n\nPlease log in again."
);

}

if (!text) {

throw new Error(
"No logged-in user was returned."
);

}

return JSON.parse(text);

}


/* =====================================================
   LOAD OWN PROFILE
   ===================================================== */

async function loadOwnProfile() {

const userId =
currentUser.id;

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";

const response =
await supabaseFetch(
url,
{
method: "GET"
}
);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Could not load your profile:\n\n" +
text
);

}

const rows =
text ?
JSON.parse(text) :
[];

if (!rows.length) {

throw new Error(
"Your EPHPHAVORA profile was not found.\n\n" +
"Auth account exists, but no matching profiles.user_id was found."
);

}

profile =
rows[0];

}


/* =====================================================
   LOAD PROFILE BY NUMERIC ID
   ===================================================== */

async function loadProfileById(id) {

if (!/^[0-9]+$/.test(id)) {

throw new Error(
"Invalid profile ID."
);

}

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&id=eq." +
encodeURIComponent(id) +
"&limit=1";

const response =
await supabaseFetch(
url,
{
method: "GET"
}
);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}

const rows =
text ?
JSON.parse(text) :
[];

if (!rows.length) {

throw new Error(
"Profile was not found."
);

}

profile =
rows[0];

}


/* =====================================================
   LOAD PROFILE BY USERNAME
   ===================================================== */

async function loadProfileByUsername(username) {

username =
String(username || "")
.replace(/^@/, "")
.trim();

if (!username) {

throw new Error(
"Username is empty."
);

}

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&username=eq." +
encodeURIComponent(username) +
"&limit=1";

const response =
await supabaseFetch(
url,
{
method: "GET"
}
);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Could not load profile:\n\n" +
text
);

}

const rows =
text ?
JSON.parse(text) :
[];

if (!rows.length) {

throw new Error(
"Username @" +
username +
" was not found."
);

}

profile =
rows[0];

}


/* =====================================================
   DISPLAY PROFILE
   ===================================================== */

function displayProfile() {

const fullName =
profile["Full name"] ||
profile.full_name ||
profile.name ||
profile.username ||
"EPHPHAVORA";

const username =
profile.username ||
"ephphavora";

const language =
profile.language ||
"—";

const bio =
profile.bio ||
"Welcome to my EPHPHAVORA profile. Connect, share, build, and grow together.";

document.getElementById(
"profileName"
).textContent =
fullName;

document.getElementById(
"profileUsername"
).textContent =
"@" +
username;

document.getElementById(
"profileLanguage"
).textContent =
"Language: " +
String(language).toUpperCase();

document.getElementById(
"profileBio"
).textContent =
bio;


/* AVATAR */

const avatar =
document.getElementById(
"avatar"
);

if (profile.avatar_url) {

avatar.innerHTML =
"<img src=\"" +
escapeHTML(profile.avatar_url) +
"\" alt=\"Profile picture\">";

}
else {

avatar.textContent =
fullName
.charAt(0)
.toUpperCase();

}


/* PHOTO BUTTON */

const photoButton =
document.getElementById(
"photoButton"
);

if (isOwnProfile()) {

photoButton.style.display =
"block";

}
else {

photoButton.style.display =
"none";

document.getElementById(
"photoMenu"
).style.display =
"none";

}


/* EDIT / FOLLOW */

setupEditPermission();

}


/* =====================================================
   OWN PROFILE CHECK
   ===================================================== */

function isOwnProfile() {

if (!currentUser ||
!profile) {

return false;

}

if (
profile.user_id &&
String(profile.user_id).toLowerCase() ===
String(currentUser.id).toLowerCase()
) {

return true;

}

return false;

}


/* =====================================================
   PHOTO MENU
   ===================================================== */

function togglePhotoMenu() {

if (!isOwnProfile()) {

return;

}

const menu =
document.getElementById(
"photoMenu"
);

if (menu.style.display === "block") {

menu.style.display =
"none";

}
else {

menu.style.display =
"block";

}

}


/* =====================================================
   SELECT PHOTO
   ===================================================== */

function choosePhoto() {

if (!isOwnProfile()) {

return;

}

document.getElementById(
"photoInput"
).click();

}


/* =====================================================
   HANDLE PHOTO SELECTION
   ===================================================== */

async function handlePhotoSelection(event) {

const file =
event.target.files[0];

if (!file) {

return;

}

const status =
document.getElementById(
"photoStatus"
);

status.textContent =
"";


/* CHECK FILE TYPE */

const allowedTypes = [
"image/jpeg",
"image/png",
"image/webp"
];

if (!allowedTypes.includes(file.type)) {

status.textContent =
"Please choose a JPG, PNG, or WEBP image.";

event.target.value =
"";

return;

}


/* CHECK FILE SIZE */

if (file.size > 5 * 1024 * 1024) {

status.textContent =
"Image is too large. Maximum size is 5 MB.";

event.target.value =
"";

return;

}


/* UPLOAD */

await uploadProfilePhoto(file);

event.target.value =
"";

}


/* =====================================================
   UPLOAD PROFILE PHOTO
   ===================================================== */

async function uploadProfilePhoto(file) {

if (!isOwnProfile()) {

return;

}

const status =
document.getElementById(
"photoStatus"
);

const button =
document.getElementById(
"choosePhotoButton"
);

button.disabled =
true;

status.textContent =
"Uploading profile picture...";

try {

const extension =
file.type === "image/png"
? "png"
: file.type === "image/webp"
? "webp"
: "jpg";

const filePath =
currentUser.id +
"/profile-" +
Date.now() +
"." +
extension;


/* STORAGE UPLOAD */

const uploadURL =
SUPABASE_URL +
"/storage/v1/object/" +
AVATAR_BUCKET +
"/" +
encodeURIComponent(
filePath
);

const uploadResponse =
await fetch(
uploadURL,
{

method: "POST",

headers: {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
accessToken,

"Content-Type":
file.type,

"x-upsert":
"true"

},

body:
file

}
);

const uploadText =
await uploadResponse.text();

"editUsername"
).value

}

status.textContent =
"Username can only contain letters, numbers, underscore, dot, or dash.";

return;

}

button.disabled =
true;

"Saving...";

try {

"Full name":
fullName,

username:
username,

language:
language,

bio:
bio

};

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?id=eq." +
encodeURIComponent(
profile.id
);

const response =
await supabaseFetch(

url,

{

method: "PATCH",

headers: {

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify(
updateData
)

}

);

await response.text();

throw new Error(
text ||
"Profile update failed."
);

}

const updatedRows =
text ?
JSON.parse(text) :
[];

if (updatedRows.length) {

profile =
updatedRows[0];

}

localStorage.setItem(
"berakah_username",
username
);

displayProfile();

status.textContent =
"Profile saved successfully!";

function() {

document.getElementById(
"editBox"
).style.display =
"none";

status.textContent =
"";

},
1200
);

}
catch(error) {

"PROFILE SAVE ERROR:",

"Could not save profile.";

/* =====================================================
   GET FOLLOW RELATION IDS
   ===================================================== */

async function getFollowIds(type) {

if (!profile ||
!profile.user_id) {

return [];

}

let url = "";

if (type === "followers") {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=follower_id" +
"&following_id=eq." +
encodeURIComponent(
profile.user_id
);

}

if (type === "following") {

url =
SUPABASE_URL +
"/rest/v1/follows" +
"?select=following_id" +
"&follower_id=eq." +
encodeURIComponent(
profile.user_id
);

}

if (!url) {

return [];

}

const response =
await supabaseFetch(
url,
{
method: "GET"
}
);

const text =
await response.text();

if (!response.ok) {

throw new Error(
text ||
"Could not load follow records."
);

}

const rows =
text ?
JSON.parse(text) :
[];

if (type === "followers") {

return rows
.map(
row => row.follower_id
)
.filter(Boolean);

}

return rows
.map(
row => row.following_id
)
.filter(Boolean);

}


/* =====================================================
   LOAD PROFILES FROM USER UUIDS
   ===================================================== */

async function loadProfilesByUserIds(
userIds
) {

if (!userIds.length) {

return [];

}

const encodedIds =
userIds
.map(
id => encodeURIComponent(id)
)
.join(",");

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=*" +
"&user_id=in.(" +
encodedIds +
")";

const response =
await supabaseFetch(
url,
{
method: "GET"
}
);

const text =
await response.text();

if (!response.ok) {

throw new Error(
text ||
"Could not load profiles."
);

}

const rows =
text ?
JSON.parse(text) :
[];

const profileMap =
new Map();

rows.forEach(
row => {

if (row.user_id) {

profileMap.set(
String(row.user_id).toLowerCase(),
row
);

}

});

return userIds
.map(
id =>
profileMap.get(
String(id).toLowerCase()
)
)
.filter(Boolean);

}

/* =====================================================
   START PROFILE
   ===================================================== */

async function start() {

try {

if (!accessToken) {

window.location.href =
"login.html";

return;

}

try {

currentUser =
await getCurrentUser();

}
catch(error) {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

localStorage.removeItem(
"berakah_username"
);

localStorage.removeItem(
"berakah_auth_user_id"
);

window.location.href =
"login.html";

return;

}


/* URL OPTIONS */

const requestedId =
getURLParameter(
"id"
);

const requestedUsername =
getURLParameter(
"username"
);


/* LOAD PROFILE */

if (requestedId) {

await loadProfileById(
requestedId
);

}
else if (requestedUsername) {

await loadProfileByUsername(
requestedUsername
);

}
else {

await loadOwnProfile();

}


/* DISPLAY */

displayProfile();


/* POSTS */

await loadPosts();


/* FOLLOW COUNTS */

await loadFollowCounts();


/* SHOW */

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"profile"
).style.display =
"block";

}
catch(error) {

console.error(
"EPHPHAVORA PROFILE ERROR:",
error
);

showError(
error.message ||
"Something went wrong while loading your profile."
);

}

}


/* =====================================================
   RUN
   ===================================================== */

start();
