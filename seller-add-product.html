<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BERAKAH - Add Product</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #111827;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    nav a,
    nav button {
      text-decoration: none;
      border: none;
      background: #f3f4f6;
      color: #111827;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    nav a:hover,
    nav button:hover {
      background: #e5e7eb;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .seller-box {
      background: #f3f4f6;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    .seller-box strong {
      color: #111827;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #2563eb;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .button-area {
      margin-top: 25px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 13px 20px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 9px;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .login-required {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .login-required h2 {
      margin-bottom: 10px;
    }

    .login-required p {
      color: #6b7280;
      margin-bottom: 20px;
    }

    .login-link {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 9px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
      }

      nav {
        width: 100%;
      }

      nav a,
      nav button {
        flex: 1;
        text-align: center;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html" class="logo">BERAKAH</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="marketplace.html">Market</a>
    <a href="seller-dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
    <button onclick="logout()">Logout</button>
  </nav>

</header>


<div class="container">

  <!-- LOGIN REQUIRED -->

  <div class="card login-required" id="loginRequired">

    <h2>Seller Login Required</h2>

    <p>
      Please log in to your BERAKAH account before adding a product.
    </p>

    <a href="login.html" class="login-link">
      Go to Login
    </a>

  </div>


  <!-- PRODUCT FORM -->

  <div class="card" id="productCard">

    <h1>Add Product</h1>

    <p class="subtitle">
      Add a product to your BERAKAH marketplace.
    </p>


    <div class="seller-box">

      Seller:
      <strong id="sellerDisplay">ephphavora</strong>

    </div>


    <form id="productForm">

      <!-- PRODUCT NAME -->

      <div class="form-group">

        <label for="name">
          Product Name
        </label>

        <input
          type="text"
          id="name"
          placeholder="Enter product name"
          required
        >

      </div>


      <!-- PRICE -->

      <div class="row">

        <div class="form-group">

          <label for="price">
            Price
          </label>

          <input
            type="number"
            id="price"
            placeholder="0.00"
            min="0"
            step="0.01"
            required
          >

        </div>


        <!-- STOCK -->

        <div class="form-group">

          <label for="stock">
            Stock
          </label>

          <input
            type="number"
            id="stock"
            placeholder="0"
            min="0"
            step="1"
            value="1"
            required
          >

        </div>

      </div>


      <!-- CATEGORY -->

      <div class="form-group">

        <label for="category">
          Category
        </label>

        <select id="category" required>

          <option value="">
            Select category
          </option>

          <option value="Clothing">
            Clothing
          </option>

          <option value="Electronics">
            Electronics
          </option>

          <option value="Beauty">
            Beauty
          </option>

          <option value="Food">
            Food
          </option>

          <option value="Home">
            Home
          </option>

          <option value="Services">
            Services
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <!-- DESCRIPTION -->

      <div class="form-group">

        <label for="description">
          Description
        </label>

        <textarea
          id="description"
          placeholder="Describe your product..."
        ></textarea>

      </div>


      <!-- IMAGE URL -->

      <div class="form-group">

        <label for="image_url">
          Product Image URL
        </label>

        <input
          type="url"
          id="image_url"
          placeholder="https://example.com/product-image.jpg"
        >

      </div>


      <!-- BUTTONS -->

      <div class="button-area">

        <button
          type="submit"
          class="btn btn-primary"
          id="submitButton"
        >
          Add Product
        </button>

        <a
          href="seller-dashboard.html"
          class="btn btn-secondary"
          style="text-decoration:none;"
        >
          Cancel
        </a>

      </div>


      <div
        id="status"
        class="status"
      ></div>

    </form>

  </div>

</div>


<script>

  /*
   * ==========================================
   * BERAKAH SUPABASE CONFIGURATION
   * ==========================================
   */

  const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


  /*
   * ==========================================
   * GET LOGIN SESSION
   * ==========================================
   */

  const accessToken =
    localStorage.getItem("berakah_access_token");

  const authUserId =
    localStorage.getItem("berakah_auth_user_id");


  /*
   * ==========================================
   * SELLER NAME
   *
   * IMPORTANT:
   * Always lowercase.
   * ==========================================
   */

  const sellerName =
    (
      localStorage.getItem("berakah_username")
      || "ephphavora"
    ).toLowerCase();


  /*
   * ==========================================
   * ELEMENTS
   * ==========================================
   */

  const productCard =
    document.getElementById("productCard");

  const loginRequired =
    document.getElementById("loginRequired");

  const sellerDisplay =
    document.getElementById("sellerDisplay");

  const productForm =
    document.getElementById("productForm");

  const statusBox =
    document.getElementById("status");

  const submitButton =
    document.getElementById("submitButton");


  /*
   * ==========================================
   * CHECK LOGIN
   * ==========================================
   */

  if (!accessToken || !authUserId) {

    productCard.style.display = "none";

    loginRequired.style.display = "block";

  } else {

    sellerDisplay.textContent = sellerName;

  }


  /*
   * ==========================================
   * SHOW STATUS
   * ==========================================
   */

  function showStatus(message, type) {

    statusBox.textContent = message;

    statusBox.className =
      "status " + type;

  }


  /*
   * ==========================================
   * ADD PRODUCT
   * ==========================================
   */

  productForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    if (!accessToken || !authUserId) {

      showStatus(
        "You must be logged in first.",
        "error"
      );

      return;

    }


    const name =
      document.getElementById("name").value.trim();

    const price =
      parseFloat(
        document.getElementById("price").value
      );

    const stock =
      parseInt(
        document.getElementById("stock").value,
        10
      );

    const category =
      document.getElementById("category").value;

    const description =
      document.getElementById("description").value.trim();

    const imageUrl =
      document.getElementById("image_url").value.trim();


    /*
     * ========================================
     * VALIDATION
     * ========================================
     */

    if (!name) {

      showStatus(
        "Please enter a product name.",
        "error"
      );

      return;

    }


    if (isNaN(price) || price < 0) {

      showStatus(
        "Please enter a valid price.",
        "error"
      );

      return;

    }


    if (isNaN(stock) || stock < 0) {

      showStatus(
        "Please enter a valid stock quantity.",
        "error"
      );

      return;

    }


    if (!category) {

      showStatus(
        "Please select a category.",
        "error"
      );

      return;

    }


    /*
     * ========================================
     * PRODUCT DATA
     * ========================================
     *
     * These are the known columns:
     *
     * name
     * price
     * image_url
     * seller_name
     * seller_id
     * category
     * stock
     *
     * created_at is automatically handled
     * by Supabase if configured as default.
     */

    const productData = {

      name: name,

      price: price,

      image_url: imageUrl || null,

      seller_name: sellerName,

      seller_id: authUserId,

      category: category,

      stock: stock

    };


    /*
     * ========================================
     * SEND TO SUPABASE
     * ========================================
     */

    submitButton.textContent =
      "Adding Product...";

    productCard.classList.add("loading");


    try {

      const response =
        await fetch(
          `${SUPABASE_URL}/rest/v1/products`,
          {

            method: "POST",

            headers: {

              "apikey": SUPABASE_KEY,

              "Authorization":
                `Bearer ${accessToken}`,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=representation"

            },

            body:
              JSON.stringify(productData)

          }
        );


      const responseText =
        await response.text();


      /*
       * ======================================
       * ERROR
       * ======================================
       */

      if (!response.ok) {

        console.error(
          "Supabase product error:",
          responseText
        );

        let errorMessage =
          "Failed to add product.";

        try {

          const errorData =
            JSON.parse(responseText);

          if (errorData.message) {

            errorMessage =
              errorData.message;

          } else if (errorData.hint) {

            errorMessage =
              errorData.hint;

          } else if (errorData.details) {

            errorMessage =
              errorData.details;

          }

        } catch (error) {

          if (responseText) {

            errorMessage =
              responseText;

          }

        }


        showStatus(
          errorMessage,
          "error"
        );

        return;

      }


      /*
       * ======================================
       * SUCCESS
       * ======================================
       */

      showStatus(
        "Product added successfully!",
        "success"
      );


      productForm.reset();


      /*
       * Give Supabase a moment, then go
       * to seller dashboard.
       */

      setTimeout(function() {

        window.location.href =
          "seller-dashboard.html";

      }, 1200);


    } catch (error) {

      console.error(error);

      showStatus(
        "Connection error. Please try again.",
        "error"
      );

    } finally {

      submitButton.textContent =
        "Add Product";

      productCard.classList.remove("loading");

    }

  });


  /*
   * ==========================================
   * LOGOUT
   * ==========================================
   */

  function logout() {

    localStorage.removeItem(
      "berakah_access_token"
    );

    localStorage.removeItem(
      "berakah_refresh_token"
    );

    localStorage.removeItem(
      "berakah_user"
    );

    localStorage.removeItem(
      "berakah_username"
    );

    localStorage.removeItem(
      "berakah_auth_user_id"
    );

    window.location.href =
      "login.html";

  }

</script>

</body>
</html>
