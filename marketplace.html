<!DOCTYPE html>
<html>
<head>
<title>BERAKAH Marketplace</title>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  padding:30px;
}

.product{
  background:white;
  padding:20px;
  margin:20px auto;
  max-width:400px;
  border-radius:10px;
}

.price{
  font-size:24px;
  font-weight:bold;
}

button{
  padding:12px;
  width:100%;
  background:#111827;
  color:white;
  border:none;
  margin-top:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>🛍️ BERAKAH Marketplace</h1>

<div id="products"></div>

<script>

let productsContainer = document.getElementById("products");

let products = JSON.parse(
  localStorage.getItem("berakahProducts") || "[]"
);

if (products.length === 0) {

  productsContainer.innerHTML = `
    <h2>No products yet.</h2>
  `;

} else {

  products.forEach(function(product) {

    let card = document.createElement("div");

    card.className = "product";

    card.innerHTML = `

      <h2>${product.name}</h2>

      <div class="price">
        $${product.price}
      </div>

      <p>${product.description || ""}</p>

      <p>🏪 BERAKAH</p>

      <button onclick="openProduct()">
        VIEW PRODUCT 👁️
      </button>

      <button onclick="alert('ADDED TO CART 🛒')">
        ADD TO CART
      </button>

    `;

    productsContainer.appendChild(card);

  });

}

function openProduct() {
  window.location.href = "product.html";
}

</script>

</body>
</html>
