<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Marketplace</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

/* =========================
   HEADER
========================= */

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 15px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #111827;
    text-decoration: none;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

nav a {
    text-decoration: none;
    color: #374151;
    font-size: 14px;
}

nav a:hover {
    color: #2563eb;
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px 20px 50px;
}

.page-title {
    margin-bottom: 20px;
}

.page-title h1 {
    margin: 0 0 6px;
    font-size: 30px;
}

.page-title p {
    margin: 0;
    color: #6b7280;
}

/* =========================
   ACTION BAR
========================= */

.market-actions {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 15px;

    display: flex;
    gap: 10px;
    flex-wrap: wrap;

    margin-bottom: 25px;
}

.search-box {
    flex: 1;
    min-width: 220px;
}

.search-box input,
.category-select {
    width: 100%;
    padding: 12px;

    border: 1px solid #d1d5db;
    border-radius: 8px;

    font-size: 15px;
}

.category-select {
    min-width: 180px;
}

.btn {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-success {
    background: #16a34a;
    color: white;
}

.btn-success:hover {
    background: #15803d;
}

/* =========================
   ADD PRODUCT
========================= */

.add-product-box {
    display: none;

    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;

    padding: 20px;
    margin-bottom: 25px;
}

.add-product-box.show {
    display: block;
}

.add-product-box h2 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    font-size: 14px;
    font-weight: bold;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 11px;

    border: 1px solid #d1d5db;
    border-radius: 8px;

    font-size: 14px;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.form-buttons {
    margin-top: 15px;

    display: flex;
    gap: 10px;
}

/* =========================
   STATUS
========================= */

.status {
    margin-bottom: 20px;
    color: #6b7280;
}

.error {
    color: #dc2626;
}

.success {
    color: #16a34a;
}

/* =========================
   PRODUCTS
========================= */

.products-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(230px, 1fr));

    gap: 20px;
}

.product-card {
    background: white;

    border: 1px solid #e5e7eb;
    border-radius: 12px;

    overflow: hidden;

    display: flex;
    flex-direction: column;

    transition: transform 0.15s ease,
                box-shadow 0.15s ease;
}

.product-card:hover {
    transform: translateY(-3px);

    box-shadow:
        0 8px 20px rgba(0,0,0,0.08);
}

.product-image {
    width: 100%;
    height: 210px;

    object-fit: cover;

    background: #eef2f7;
}

.no-image {
    width: 100%;
    height: 210px;

    background: #eef2f7;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 50px;
}

.product-info {
    padding: 15px;

    display: flex;
    flex-direction: column;

    flex: 1;
}

.product-category {
    display: inline-block;

    width: fit-content;

    background: #eff6ff;
    color: #2563eb;

    padding: 5px 9px;

    border-radius: 20px;

    font-size: 11px;
    font-weight: bold;

    margin-bottom: 8px;
}

.product-name {
    margin: 0 0 8px;

    font-size: 18px;
}

.product-description {
    color: #6b7280;

    font-size: 14px;

    line-height: 1.4;

    margin-bottom: 10px;

    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;

    overflow: hidden;
}

.product-price {
    font-size: 21px;
    font-weight: bold;

    color: #111827;

    margin-bottom: 8px;
}

.product-seller {
    font-size: 13px;
    color: #6b7280;

    margin-bottom: 6px;
}

.product-stock {
    font-size: 13px;

    margin-bottom: 15px;
}

.in-stock {
    color: #16a34a;
}

.out-stock {
    color: #dc2626;
}

.product-buttons {
    margin-top: auto;

    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.product-buttons button {
    flex: 1;
    min-width: 90px;
}

.btn-view {
    background: #f3f4f6;
    color: #111827;
}

.btn-cart {
    background: #2563eb;
    color: white;
}

.btn-delete {
    background: #fee2e2;
    color: #dc2626;
}

/* =========================
   EMPTY
========================= */

.empty {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 12px;

    padding: 50px 20px;

    text-align: center;

    color: #6b7280;
}

/* =========================
   CART
========================= */

.cart-button {
    position: relative;
}

.cart-count {
    background: #dc2626;
    color: white;

    border-radius: 50%;

    min-width: 18px;
    height: 18px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    font-size: 10px;

    position: relative;
    top: -2px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    header {
        align-items: flex-start;
        flex-direction: column;
    }

    nav {
        width: 100%;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .products-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

}

@media (max-width: 450px) {

    .products-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken =
    localStorage.getItem("berakah_access_token");

let currentUser = null;

let allProducts = [];


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
    endpoint,
    options = {}
) {

    const response = await fetch(
        SUPABASE_URL + endpoint,
        {
            ...options,

            headers: {
                "apikey": SUPABASE_KEY,

                "Authorization":
                    "Bearer " + accessToken,

                "Content-Type":
                    "application/json",

                ...(options.headers || {})
            }
        }
    );

    const text = await response.text();

    let data = null;

    try {
        data = text ? JSON.parse(text) : null;
    } catch {
        data = text;
    }

    if (!response.ok) {

        throw new Error(
            data?.message ||
            data?.msg ||
            "Supabase request failed"
        );

    }

    return data;

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser() {

    if (!accessToken) {

        window.location.href =
            "login.html";

        return false;

    }

    try {

        currentUser =
            await supabaseRequest(
                "/auth/v1/user"
            );

        return true;

    } catch (error) {

        console.error(error);

        localStorage.removeItem(
            "berakah_access_token"
        );

        window.location.href =
            "login.html";

        return false;

    }

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    const status =
        document.getElementById("status");

    try {

        status.textContent =
            "Loading marketplace...";

        allProducts =
            await supabaseRequest(
                "/rest/v1/products" +
                "?select=*" +
                "&order=created_at.desc"
            );

        renderProducts(
            allProducts
        );

        status.textContent =
            `${allProducts.length} product(s)`;

    } catch (error) {

        console.error(error);

        status.className =
            "status error";

        status.textContent =
            "Could not load products: " +
            error.message;

    }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(products) {

    const grid =
        document.getElementById(
            "productsGrid"
        );

    if (!products ||
        products.length === 0) {

        grid.innerHTML = `

            <div class="empty"
                 style="grid-column:1/-1;">

                <div style="font-size:50px;">
                    🛒
                </div>

                <h2>No products yet</h2>

                <p>
                    Be the first person to
                    add a product to BERAKAH Marketplace.
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        products.map(
            product => createProductCard(product)
        ).join("");

}


/* =====================================================
   PRODUCT CARD
===================================================== */

function createProductCard(product) {

    const name =
        escapeHTML(
            product.name || "Unnamed Product"
        );

    const description =
        escapeHTML(
            product.description ||
            "No description available."
        );

    const seller =
        escapeHTML(
            product.seller_name ||
            "BERAKAH Member"
        );

    const category =
        escapeHTML(
            product.category ||
            "Other"
        );


    const price =
        Number(product.price || 0)
            .toFixed(2);


    const stock =
        Number(product.stock ?? 1);


    let imageHTML = "";

    if (product.image_url) {

        imageHTML = `

            <img
                class="product-image"
                src="${escapeAttribute(product.image_url)}"
                alt="${name}"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

            <div
                class="no-image"
                style="display:none;">

                🛍️

            </div>

        `;

    } else {

        imageHTML = `

            <div class="no-image">
                🛍️
            </div>

        `;

    }


    let stockHTML;

    if (stock > 0) {

        stockHTML = `

            <div class="product-stock in-stock">

                📦 ${stock} available

            </div>

        `;

    } else {

        stockHTML = `

            <div class="product-stock out-stock">

                ❌ Out of stock

            </div>

        `;

    }


    let deleteButton = "";

    if (
        currentUser &&
        product.seller_id === currentUser.id
    ) {

        deleteButton = `

            <button
                class="btn btn-delete"
                onclick="deleteProduct('${product.id}')">

                🗑️ Delete

            </button>

        `;

    }


    return `

        <div class="product-card">

            ${imageHTML}

            <div class="product-info">

                <div class="product-category">

                    ${category}

                </div>


                <h3 class="product-name">

                    ${name}

                </h3>


                <div class="product-description">

                    ${description}

                </div>


                <div class="product-price">

                    $${price}

                </div>


                <div class="product-seller">

                    👤 Seller:
                    <strong>${seller}</strong>

                </div>


                ${stockHTML}


                <div class="product-buttons">

                    <button
                        class="btn btn-view"
                        onclick="viewProduct('${product.id}')">

                        👁️ View

                    </button>


                    <button
                        class="btn btn-cart"
                        ${stock <= 0 ? "disabled" : ""}
                        onclick="addToCart('${product.id}')">

                        🛒 Add

                    </button>


                    ${deleteButton}

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   SEARCH + CATEGORY FILTER
===================================================== */

function filterProducts() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
         .trim()
         .toLowerCase();


    const category =
        document.getElementById(
            "categoryFilter"
        ).value;


    const filtered =
        allProducts.filter(
            product => {

                const name =
                    String(
                        product.name || ""
                    ).toLowerCase();


                const description =
                    String(
                        product.description || ""
                    ).toLowerCase();


                const seller =
                    String(
                        product.seller_name || ""
                    ).toLowerCase();


                const productCategory =
                    String(
                        product.category || "Other"
                    );


                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    description.includes(search) ||
                    seller.includes(search);


                const matchesCategory =
                    !category ||
                    productCategory === category;


                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );


    renderProducts(filtered);


    document.getElementById(
        "status"
    ).textContent =
        `${filtered.length} product(s) found`;

}


/* =====================================================
   ADD PRODUCT FORM
===================================================== */

function toggleAddProduct() {

    const box =
        document.getElementById(
            "addProductBox"
        );

    box.classList.toggle("show");

}


/* =====================================================
   ADD PRODUCT
===================================================== */

async function addProduct() {

    if (!currentUser) {

        alert(
            "Please log in first."
        );

        return;

    }


    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const price =
        document.getElementById(
            "productPrice"
        ).value;


    const category =
        document.getElementById(
            "productCategory"
        ).value;


    const description =
        document.getElementById(
            "productDescription"
        ).value.trim();


    const stock =
        document.getElementById(
            "productStock"
        ).value;


    const imageInput =
        document.getElementById(
            "productImage"
        );


    if (!name) {

        alert(
            "Please enter a product name."
        );

        return;

    }


    if (
        price === "" ||
        Number(price) < 0
    ) {

        alert(
            "Please enter a valid price."
        );

        return;

    }


    if (!category) {

        alert(
            "Please select a category."
        );

        return;

    }


    if (
        stock === "" ||
        Number(stock) < 0
    ) {

        alert(
            "Please enter a valid stock amount."
        );

        return;

    }


    let imageURL = null;


    /* =========================
       IMAGE
    ========================= */

    if (
        imageInput.files &&
        imageInput.files.length > 0
    ) {

        const file =
            imageInput.files[0];


        if (
            !file.type.startsWith("image/")
        ) {

            alert(
                "Please select an image file."
            );

            return;

        }


        if (
            file.size >
            5 * 1024 * 1024
        ) {

            alert(
                "Image must be smaller than 5MB."
            );

            return;

        }


        imageURL =
            await fileToDataURL(file);

    }


    try {

        const sellerName =
            currentUser.user_metadata?.full_name ||
            currentUser.user_metadata?.name ||
            currentUser.email ||
            "BERAKAH Member";


        const product = {

            name: name,

            description:
                description || null,

            price:
                Number(price),

            image_url:
                imageURL,

            seller_name:
                sellerName,

            seller_id:
                currentUser.id,

            category:
                category,

            stock:
                Number(stock)

        };


        await supabaseRequest(
            "/rest/v1/products",
            {
                method: "POST",

                headers: {
                    "Prefer":
                        "return=minimal"
                },

                body:
                    JSON.stringify(product)
            }
        );


        alert(
            "Product published successfully! 🛍️"
        );


        document.getElementById(
            "productName"
        ).value = "";


        document.getElementById(
            "productPrice"
        ).value = "";


        document.getElementById(
            "productCategory"
        ).value = "";


        document.getElementById(
            "productDescription"
        ).value = "";


        document.getElementById(
            "productStock"
        ).value = "1";


        document.getElementById(
            "productImage"
        ).value = "";


        document.getElementById(
            "addProductBox"
        ).classList.remove("show");


        await loadProducts();


    } catch (error) {

        console.error(error);

        alert(
            "Could not publish product:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   FILE TO DATA URL
===================================================== */

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () => resolve(
                    reader.result
                );


            reader.onerror =
                () => reject(
                    new Error(
                        "Could not read image."
                    )
                );


            reader.readAsDataURL(file);

        }
    );

}


/* =====================================================
   VIEW PRODUCT
===================================================== */

function viewProduct(productId) {

    localStorage.setItem(
        "berakahProduct",
        productId
    );


    window.location.href =
        "product.html?id=" +
        encodeURIComponent(productId);

}


/* =====================================================
   CART
===================================================== */

function getCart() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "berakahCart"
            )
        ) || [];

    } catch {

        return [];

    }

}


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(cart) {

    localStorage.setItem(
        "berakahCart",
        JSON.stringify(cart)
    );

    updateCartCount();

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(productId) {

    const product =
        allProducts.find(
            item =>
                String(item.id) ===
                String(productId)
        );


    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }


    const stock =
        Number(product.stock ?? 1);


    if (stock <= 0) {

        alert(
            "This product is out of stock."
        );

        return;

    }


    const cart =
        getCart();


    const existing =
        cart.find(
            item =>
                String(item.id) ===
                String(product.id)
        );


    if (existing) {

        if (
            existing.quantity >= stock
        ) {

            alert(
                "You cannot add more than the available stock."
            );

            return;

        }


        existing.quantity += 1;

    } else {

        cart.push({

            id:
                product.id,

            name:
                product.name,

            price:
                Number(product.price || 0),

            image_url:
                product.image_url,

            seller_name:
                product.seller_name,

            quantity:
                1

        });

    }


    saveCart(cart);


    alert(
        product.name +
        " added to cart! 🛒"
    );

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount() {

    const cart =
        getCart();


    const count =
        cart.reduce(
            (total, item) =>
                total +
                Number(item.quantity || 0),
            0
        );


    document.getElementById(
        "cartCount"
    ).textContent =
        count;

}


/* =====================================================
   OPEN CART
===================================================== */

function openCart() {

    window.location.href =
        "cart.html";

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(productId) {

    if (!currentUser) {

        return;

    }


    const product =
        allProducts.find(
            item =>
                String(item.id) ===
                String(productId)
        );


    if (!product) {

        return;

    }


    if (
        product.seller_id !==
        currentUser.id
    ) {

        alert(
            "You can only delete your own products."
        );

        return;

    }


    const confirmed =
        confirm(
            "Delete this product?"
        );


    if (!confirmed) {

        return;

    }


    try {

        await supabaseRequest(
            "/rest/v1/products" +
            "?id=eq." +
            encodeURIComponent(productId),

            {
                method: "DELETE"
            }
        );


        alert(
            "Product deleted."
        );


        await loadProducts();


    } catch (error) {

        console.error(error);

        alert(
            "Could not delete product:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        "berakah_access_token"
    );

    localStorage.removeItem(
        "berakah_refresh_token"
    );

    window.location.href =
        "login.html";

}


/* =====================================================
   START
===================================================== */

async function startMarketplace() {

    const loggedIn =
        await loadUser();


    if (!loggedIn) {

        return;

    }


    updateCartCount();

    await loadProducts();

}


/* START */

startMarketplace();
