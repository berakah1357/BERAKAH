<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BERAKAH - Marketplace</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #111827;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    nav a,
    nav button {
      border: none;
      background: #f3f4f6;
      color: #111827;
      text-decoration: none;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    nav a:hover,
    nav button:hover {
      background: #e5e7eb;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .hero {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .hero p {
      margin: 0;
      color: #6b7280;
    }

    /* SEARCH */

    .search-area {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
    }

    .search-box input,
    .category-select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    .search-box input:focus,
    .category-select:focus {
      outline: none;
      border-color: #2563eb;
    }

    .refresh-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 12px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .refresh-btn:hover {
      background: #1d4ed8;
    }

    /* RESULTS */

    .market-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .market-header h2 {
      margin: 0;
    }

    #productCount {
      color: #6b7280;
      font-size: 14px;
    }

    /* PRODUCTS */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .product-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
    }

    .product-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #f3f4f6;
    }

    .product-content {
      padding: 16px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-category {
      display: inline-block;
      background: #f3f4f6;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .seller {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stock {
      font-size: 13px;
      margin-bottom: 14px;
    }

    .in-stock {
      color: #166534;
    }

    .out-stock {
      color: #991b1b;
    }

    .buy-btn {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 11px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .buy-btn:hover {
      background: #1d4ed8;
    }

    .buy-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    /* LOADING */

    .loading {
      background: white;
      border-radius: 14px;
      padding: 40px;
      text-align: center;
      color: #6b7280;
    }

    /* EMPTY */

    .empty {
      background: white;
      border-radius: 14px;
      padding: 50px 20px;
      text-align: center;
      color: #6b7280;
    }

    /* ERROR */

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    /* MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 500;
    }

    .modal {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .modal h2 {
      margin-top: 0;
    }

    .modal-product {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e5e7eb;
    }

    .modal-product img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      background: #f3f4f6;
    }

    .modal-product-info {
      flex: 1;
    }

    .modal-product-name {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .quantity-label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .quantity-input {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .confirm-btn {
      background: #2563eb;
      color: white;
    }

    .cancel-btn {
      background: #e5e7eb;
      color: #111827;
    }

    /* MOBILE */

    @media (max-width: 950px) {

      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }

    }

    @media (max-width: 700px) {

      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      nav {
        width: 100%;
      }

      nav a,
      nav button {
        flex: 1;
        text-align: center;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 500px) {

      .products-grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 26px;
      }

      .hero {
        padding: 22px;
      }

    }

  </style>

</head>


<body>


<header>

  <a
    href="index.html"
    class="logo"
  >
    BERAKAH
  </a>


  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="marketplace.html">
      Market
    </a>

    <a href="seller-dashboard.html">
      Dashboard
    </a>

    <a href="profile.html">
      Profile
    </a>

    <button onclick="logout()">
      Logout
    </button>

  </nav>

</header>


<div class="container">


  <!-- HERO -->

  <div class="hero">

    <h1>
      BERAKAH Marketplace
    </h1>

    <p>
      Discover products and services from BERAKAH sellers.
    </p>

  </div>


  <!-- SEARCH -->

  <div class="search-area">

    <div class="search-box">

      <input
        type="search"
        id="searchInput"
        placeholder="Search products..."
        oninput="filterProducts()"
      >

    </div>


    <div style="min-width:180px;">

      <select
        id="categorySelect"
        class="category-select"
        onchange="filterProducts()"
      >

        <option value="">
          All Categories
        </option>

        <option value="Clothing">
          Clothing
        </option>

        <option value="Electronics">
          Electronics
        </option>

        <option value="Beauty">
          Beauty
        </option>

        <option value="Food">
          Food
        </option>

        <option value="Home">
          Home
        </option>

        <option value="Services">
          Services
        </option>

        <option value="Other">
          Other
        </option>

      </select>

    </div>


    <button
      class="refresh-btn"
      onclick="loadProducts()"
    >
      🔄 Refresh
    </button>

  </div>


  <!-- ERROR -->

  <div
    id="errorBox"
    class="error"
  ></div>


  <!-- PRODUCT HEADER -->

  <div class="market-header">

    <h2>
      Products
    </h2>

    <span id="productCount">
      Loading...
    </span>

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >
    Loading marketplace...
  </div>


  <!-- EMPTY -->

  <div
    id="empty"
    class="empty"
    style="display:none;"
  >

    <h3>
      No products found
    </h3>

    <p>
      Sellers haven't added products yet.
    </p>

  </div>


  <!-- PRODUCTS -->

  <div
    id="productsGrid"
    class="products-grid"
  ></div>


</div>


<!-- BUY MODAL -->

<div
  id="buyModalOverlay"
  class="modal-overlay"
>

  <div class="modal">

    <h2>
      Product Details
    </h2>


    <div
      id="modalProduct"
      class="modal-product"
    ></div>


    <label
      class="quantity-label"
      for="quantity"
    >
      Quantity
    </label>


    <input
      id="quantity"
      class="quantity-input"
      type="number"
      min="1"
      value="1"
    >


    <div class="modal-actions">

      <button
        class="cancel-btn"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="confirm-btn"
        onclick="confirmOrder()"
      >
        Continue
      </button>

    </div>

  </div>

</div>


<script>


/*
==================================================
BERAKAH SUPABASE CONFIGURATION
==================================================
*/

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/*
==================================================
SESSION
==================================================
*/

const accessToken =
  localStorage.getItem(
    "berakah_access_token"
  );


/*
==================================================
PRODUCT DATA
==================================================
*/

let allProducts = [];

let selectedProduct = null;


/*
==================================================
HEADERS
==================================================
*/

function getHeaders() {

  const headers = {

    "apikey":
      SUPABASE_KEY,

    "Content-Type":
      "application/json"

  };


  if (accessToken) {

    headers["Authorization"] =
      `Bearer ${accessToken}`;

  }


  return headers;

}


/*
==================================================
LOAD PRODUCTS
==================================================
*/

async function loadProducts() {

  const loading =
    document.getElementById("loading");

  const grid =
    document.getElementById("productsGrid");

  const empty =
    document.getElementById("empty");

  const errorBox =
    document.getElementById("errorBox");


  loading.style.display =
    "block";

  grid.innerHTML = "";

  empty.style.display =
    "none";

  errorBox.style.display =
    "none";


  try {


    /*
    ==============================================
    GET PRODUCTS
    ==============================================
    */

    const url =
      `${SUPABASE_URL}/rest/v1/products` +
      `?select=id,name,price,image_url,seller_name,created_at,seller_id,category,stock` +
      `&order=created_at.desc`;


    const response =
      await fetch(
        url,
        {
          method: "GET",
          headers: getHeaders()
        }
      );


    const responseText =
      await response.text();


    if (!response.ok) {

      throw new Error(
        responseText ||
        "Unable to load products."
      );

    }


    try {

      allProducts =
        JSON.parse(responseText);

    } catch {

      allProducts = [];

    }


    loading.style.display =
      "none";


    /*
    ==============================================
    DISPLAY
    ==============================================
    */

    filterProducts();


  } catch (error) {

    console.error(
      "Marketplace error:",
      error
    );


    loading.style.display =
      "none";


    errorBox.textContent =
      "Could not load marketplace: " +
      error.message;


    errorBox.style.display =
      "block";


    document.getElementById(
      "productCount"
    ).textContent =
      "0 products";

  }

}


/*
==================================================
FILTER PRODUCTS
==================================================
*/

function filterProducts() {

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  const category =
    document.getElementById(
      "categorySelect"
    ).value
      .toLowerCase();


  const filtered =
    allProducts.filter(
      function(product) {


        const name =
          String(
            product.name || ""
          ).toLowerCase();


        const seller =
          String(
            product.seller_name || ""
          ).toLowerCase();


        const productCategory =
          String(
            product.category || ""
          ).toLowerCase();


        const matchesSearch =
          !search ||
          name.includes(search) ||
          seller.includes(search);


        const matchesCategory =
          !category ||
          productCategory === category;


        return (
          matchesSearch &&
          matchesCategory
        );

      }
    );


  renderProducts(filtered);

}


/*
==================================================
RENDER PRODUCTS
==================================================
*/

function renderProducts(products) {

  const grid =
    document.getElementById(
      "productsGrid"
    );

  const empty =
    document.getElementById(
      "empty"
    );

  const count =
    document.getElementById(
      "productCount"
    );


  grid.innerHTML = "";


  count.textContent =
    `${products.length} product${products.length === 1 ? "" : "s"}`;


  if (!products.length) {

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  products.forEach(
    function(product) {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "product-card";


      const image =
        product.image_url ||
        "https://via.placeholder.com/600x400?text=BERAKAH";


      const price =
        Number(
          product.price || 0
        ).toFixed(2);


      const stock =
        Number(
          product.stock || 0
        );


      const isAvailable =
        stock > 0;


      const seller =
        (
          product.seller_name ||
          "BERAKAH Seller"
        ).toLowerCase();


      card.innerHTML = `

        <img
          src="${escapeHtml(image)}"
          alt="${escapeHtml(product.name || "Product")}"
          class="product-image"
          onerror="this.src='https://via.placeholder.com/600x400?text=BERAKAH'"
        >

        <div class="product-content">

          <div class="product-name">
            ${escapeHtml(
              product.name ||
              "Unnamed Product"
            )}
          </div>

          <div class="product-price">
            $${price}
          </div>

          <div class="product-category">
            ${escapeHtml(
              product.category ||
              "Other"
            )}
          </div>

          <div class="seller">
            Seller:
            <strong>
              ${escapeHtml(seller)}
            </strong>
          </div>

          <div class="stock ${
            isAvailable
              ? "in-stock"
              : "out-stock"
          }">

            ${
              isAvailable
                ? `${stock} available`
                : "Out of stock"
            }

          </div>

          <button
            class="buy-btn"
            ${
              !isAvailable
                ? "disabled"
                : ""
            }
            onclick="openBuyModal('${escapeJs(String(product.id))}')"
          >
            ${
              isAvailable
                ? "Buy"
                : "Out of Stock"
            }
          </button>

        </div>

      `;


      grid.appendChild(card);

    }
  );

}


/*
==================================================
OPEN BUY MODAL
==================================================
*/

function openBuyModal(productId) {

  selectedProduct =
    allProducts.find(
      product =>
        String(product.id) ===
        String(productId)
    );


  if (!selectedProduct) {

    alert(
      "Product could not be found."
    );

    return;

  }


  const image =
    selectedProduct.image_url ||
    "https://via.placeholder.com/600x400?text=BERAKAH";


  const price =
    Number(
      selectedProduct.price || 0
    ).toFixed(2);


  document.getElementById(
    "modalProduct"
  ).innerHTML = `

    <img
      src="${escapeHtml(image)}"
      alt="${escapeHtml(selectedProduct.name || "Product")}"
    >

    <div class="modal-product-info">

      <div class="modal-product-name">
        ${escapeHtml(
          selectedProduct.name ||
          "Product"
        )}
      </div>

      <div>
        $${price}
      </div>

      <div style="color:#6b7280;font-size:13px;margin-top:6px;">
        Seller:
        ${
          escapeHtml(
            (
              selectedProduct.seller_name ||
              "BERAKAH Seller"
            ).toLowerCase()
          )
        }
      </div>

    </div>

  `;


  document.getElementById(
    "quantity"
  ).value = 1;


  document.getElementById(
    "quantity"
  ).max =
    selectedProduct.stock || 1;


  document.getElementById(
    "buyModalOverlay"
  ).style.display =
    "flex";

}


/*
==================================================
CLOSE MODAL
==================================================
*/

function closeModal() {

  document.getElementById(
    "buyModalOverlay"
  ).style.display =
    "none";

  selectedProduct =
    null;

}


/*
==================================================
CONFIRM ORDER
==================================================
*/

async function confirmOrder() {

  if (!selectedProduct) {

    return;

  }


  /*
  ================================================
  LOGIN CHECK
  ================================================
  */

  const currentToken =
    localStorage.getItem(
      "berakah_access_token"
    );


  const buyerId =
    localStorage.getItem(
      "berakah_auth_user_id"
    );


  if (!currentToken || !buyerId) {

    alert(
      "Please log in to buy a product."
    );


    window.location.href =
      "login.html";


    return;

  }


  const quantity =
    parseInt(
      document.getElementById(
        "quantity"
      ).value,
      10
    );


  const stock =
    Number(
      selectedProduct.stock || 0
    );


  if (
    isNaN(quantity) ||
    quantity < 1
  ) {

    alert(
      "Please enter a valid quantity."
    );

    return;

  }


  if (quantity > stock) {

    alert(
      "There is not enough stock available."
    );

    return;

  }


  const price =
    Number(
      selectedProduct.price || 0
    );


  const total =
    price * quantity;


  /*
  ================================================
  ORDER DATA
  ================================================
  */

  const orderData = {

    product_id:
      selectedProduct.id,

    quantity:
      quantity,

    price:
      price,

    total:
      total,

    buyer_id:
      buyerId,

    status:
      "pending"

  };


  try {


    /*
    ==============================================
    CREATE ORDER
    ==============================================
    */

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/orders`,
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${currentToken}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify(
              orderData
            )

        }
      );


    const responseText =
      await response.text();


    if (!response.ok) {

      console.error(
        "Order error:",
        responseText
      );


      let message =
        "Could not create order.";


      try {

        const data =
          JSON.parse(
            responseText
          );


        message =
          data.message ||
          data.details ||
          data.hint ||
          message;

      } catch {}


      alert(message);

      return;

    }


    /*
    ==============================================
    SUCCESS
    ==============================================
    */

    closeModal();


    alert(
      `Order created successfully!\n\n` +
      `Product: ${selectedProduct.name}\n` +
      `Quantity: ${quantity}\n` +
      `Total: $${total.toFixed(2)}\n\n` +
      `Payment processing will be connected next.`
    );


    loadProducts();


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Connection error. Please try again."
    );

  }

}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/*
==================================================
ESCAPE JAVASCRIPT
==================================================
*/

function escapeJs(value) {

  return String(value)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    );

}


/*
==================================================
LOGOUT
==================================================
*/

function logout() {

  localStorage.removeItem(
    "berakah_access_token"
  );

  localStorage.removeItem(
    "berakah_refresh_token"
  );

  localStorage.removeItem(
    "berakah_user"
  );

  localStorage.removeItem(
    "berakah_username"
  );

  localStorage.removeItem(
    "berakah_auth_user_id"
  );

  window.location.href =
    "login.html";

}


/*
==================================================
START
==================================================
*/

loadProducts();

</script>


</body>
</html>
