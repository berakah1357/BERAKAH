<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EPHPHAVORA - Seller Earnings</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  padding: 16px 20px;
  border-bottom: 1px solid #e5e7eb;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: #111827;
}

.back-btn {
  text-decoration: none;
  background: #111827;
  color: white;
  padding: 10px 15px;
  border-radius: 8px;
  font-size: 14px;
}

.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 20px;
}

h1 {
  margin-bottom: 6px;
}

.subtitle {
  color: #6b7280;
  margin-top: 0;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin: 25px 0;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 14px;
  border: 1px solid #e5e7eb;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.card-label {
  color: #6b7280;
  font-size: 14px;
  margin-bottom: 8px;
}

.card-value {
  font-size: 28px;
  font-weight: bold;
}

.section {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 20px;
  margin-top: 20px;
  overflow-x: auto;
}

.section h2 {
  margin-top: 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

th,
td {
  padding: 13px 10px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
  font-size: 14px;
}

th {
  background: #f9fafb;
}

.status {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: bold;
}

.status-paid {
  background: #dcfce7;
  color: #166534;
}

.status-pending {
  background: #fef3c7;
  color: #92400e;
}

.empty {
  text-align: center;
  padding: 30px;
  color: #6b7280;
}

.message {
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 20px;
  display: none;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.success {
  background: #dcfce7;
  color: #166534;
}

@media (max-width: 750px) {
  .cards {
    grid-template-columns: 1fr;
  }

  .header-inner {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">EPHPHAVORA</div>
    <a class="back-btn" href="seller-orders.html">← Seller Orders</a>
  </div>
</header>

<div class="container">

  <h1>Seller Earnings</h1>
  <p class="subtitle">Track your paid orders and sales on EPHPHAVORA.</p>

  <div id="message" class="message"></div>

  <div class="cards">

    <div class="card">
      <div class="card-label">Total Sales</div>
      <div class="card-value" id="totalSales">$0.00</div>
    </div>

    <div class="card">
      <div class="card-label">Paid Orders</div>
      <div class="card-value" id="paidOrders">0</div>
    </div>

    <div class="card">
      <div class="card-label">Total Orders</div>
      <div class="card-value" id="totalOrders">0</div>
    </div>

  </div>

  <div class="section">
    <h2>Order Earnings</h2>

    <table>
      <thead>
        <tr>
          <th>Order</th>
          <th>Product</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Payment</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody id="ordersTable">
        <tr>
          <td colspan="7" class="empty">Loading earnings...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const TOKEN_KEY = "berakah_access_token";

const token = localStorage.getItem(TOKEN_KEY);

const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
  message.style.display = "block";
}

function money(value) {
  return "$" + Number(value || 0).toFixed(2);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function getCurrentUser() {

  if (!token) {
    throw new Error("You are not logged in.");
  }

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/user",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + token
      }
    }
  );

  if (!response.ok) {
    throw new Error("Unable to verify your account.");
  }

  return await response.json();
}

async function loadEarnings() {

  try {

    const user = await getCurrentUser();

    const sellerId = user.id;

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/orders" +
      "?select=*" +
      "&seller_id=eq." +
      encodeURIComponent(sellerId) +
      "&order=created_at.desc",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + token
        }
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      console.error(errorText);
      throw new Error("Unable to load seller orders.");
    }

    const orders = await response.json();

    const paidOrders = orders.filter(
      order => order.payment_status === "paid"
    );

    const totalSales = paidOrders.reduce(
      (sum, order) => sum + Number(order.total || 0),
      0
    );

    document.getElementById("totalSales").textContent =
      money(totalSales);

    document.getElementById("paidOrders").textContent =
      paidOrders.length;

    document.getElementById("totalOrders").textContent =
      orders.length;

    const table = document.getElementById("ordersTable");

    if (orders.length === 0) {

      table.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            No seller orders found yet.
          </td>
        </tr>
      `;

      return;
    }

    table.innerHTML = orders.map(order => {

      const paymentClass =
        order.payment_status === "paid"
          ? "status-paid"
          : "status-pending";

      const paymentText =
        order.payment_status || "pending";

      const orderStatus =
        order.status || "pending";

      const date = order.created_at
        ? new Date(order.created_at).toLocaleString()
        : "";

      return `
        <tr>

          <td>
            <strong>
              ${escapeHtml(order.order_number)}
            </strong>
          </td>

          <td>
            ${escapeHtml(order.product_name)}
          </td>

          <td>
            ${escapeHtml(order.quantity)}
          </td>

          <td>
            <strong>
              ${money(order.total)}
            </strong>
          </td>

          <td>
            <span class="status ${paymentClass}">
              ${escapeHtml(paymentText)}
            </span>
          </td>

          <td>
            ${escapeHtml(orderStatus)}
          </td>

          <td>
            ${escapeHtml(date)}
          </td>

        </tr>
      `;

    }).join("");

  } catch (error) {

    console.error(error);

    showMessage(
      error.message || "Something went wrong.",
      "error"
    );

    document.getElementById("ordersTable").innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Unable to load earnings.
        </td>
      </tr>
    `;
  }
}

loadEarnings();

setInterval(loadEarnings, 5000);

</script>

</body>
</html>
