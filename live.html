<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EPHPHAVORA LIVE</title>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}

header {
  background: #111827;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid #293244;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.back {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.title {
  text-align: center;
  margin: 10px 0 5px;
  font-size: 30px;
}

.subtitle {
  text-align: center;
  color: #9ca3af;
  margin-bottom: 20px;
}

.status {
  text-align: center;
  margin: 15px auto;
  padding: 10px 15px;
  border-radius: 10px;
  background: #172033;
  max-width: 500px;
}

.status.live {
  background: #3b1118;
}

.video-box {
  background: #000;
  border-radius: 15px;
  overflow: hidden;
  min-height: 350px;
  position: relative;
  border: 1px solid #293244;
}

video {
  width: 100%;
  height: 100%;
  min-height: 350px;
  object-fit: cover;
  display: block;
  background: #000;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 20px 0;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  background: #2563eb;
  color: white;
}

button:hover {
  opacity: .9;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.danger {
  background: #dc2626;
}

.secondary {
  background: #374151;
}

.success {
  background: #16a34a;
}

.info-card {
  background: #111827;
  border: 1px solid #293244;
  border-radius: 15px;
  padding: 18px;
  margin-top: 20px;
}

.info-card h3 {
  margin-top: 0;
}

.share-box {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.share-box input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #374151;
  background: #0b1020;
  color: white;
}

.chat {
  margin-top: 20px;
  background: #111827;
  border: 1px solid #293244;
  border-radius: 15px;
  padding: 15px;
}

.chat-messages {
  height: 220px;
  overflow-y: auto;
  background: #0b1020;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 10px;
}

.chat-message {
  padding: 7px 5px;
  border-bottom: 1px solid #1f2937;
  word-break: break-word;
}

.chat-message strong {
  color: #60a5fa;
}

.chat-input {
  display: flex;
  gap: 8px;
}

.chat-input input {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #374151;
  background: #0b1020;
  color: white;
}

.reactions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 15px 0;
  flex-wrap: wrap;
}

.reaction {
  font-size: 24px;
  padding: 8px 12px;
  background: #1f2937;
}

.viewer-count {
  text-align: center;
  margin: 10px;
  color: #d1d5db;
}

#floatingReactions {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 999;
}

.float-reaction {
  position: absolute;
  bottom: 80px;
  font-size: 35px;
  animation: floatUp 2.5s ease-out forwards;
}

@keyframes floatUp {
  0% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  100% {
    opacity: 0;
    transform: translateY(-500px) scale(1.7);
  }
}

.hidden {
  display: none !important;
}

.notice {
  text-align: center;
  color: #fbbf24;
  margin: 10px;
}

footer {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">EPHPHAVORA</div>
  <a class="back" href="index.html">← Home</a>
</header>

<div class="container">

  <h1 class="title">🔴 EPHPHAVORA LIVE</h1>

  <div class="subtitle">
    Go live, connect with people, and build your community.
  </div>

  <div id="status" class="status">
    Ready
  </div>

  <div id="notice" class="notice"></div>

  <div class="video-box">
    <video id="video" autoplay playsinline></video>
  </div>

  <div id="viewerCount" class="viewer-count">
    👥 Viewers: 0
  </div>

  <div class="controls">

    <button id="goLiveBtn">
      🔴 GO LIVE
    </button>

    <button id="cameraBtn" class="secondary" disabled>
      📷 Camera
    </button>

    <button id="micBtn" class="secondary" disabled>
      🎤 Microphone
    </button>

    <button id="shareBtn" class="success" disabled>
      🔗 SHARE LIVE
    </button>

    <button id="endBtn" class="danger" disabled>
      END LIVE
    </button>

  </div>

  <div id="shareSection" class="info-card hidden">

    <h3>🔗 Share this LIVE</h3>

    <div class="share-box">
      <input id="shareUrl" readonly>
      <button id="copyBtn">COPY</button>
    </div>

  </div>

  <div class="reactions">

    <button class="reaction" data-reaction="❤️">❤️</button>
    <button class="reaction" data-reaction="🔥">🔥</button>
    <button class="reaction" data-reaction="👏">👏</button>
    <button class="reaction" data-reaction="😍">😍</button>
    <button class="reaction" data-reaction="🎉">🎉</button>

  </div>

  <div class="chat">

    <h3>💬 LIVE Chat</h3>

    <div id="chatMessages" class="chat-messages"></div>

    <div class="chat-input">

      <input
        id="chatInput"
        type="text"
        placeholder="Write a message..."
        maxlength="500"
      >

      <button id="sendChatBtn">
        SEND
      </button>

    </div>

  </div>

</div>

<div id="floatingReactions"></div>

<footer>
  © 2026 EPHPHAVORA
</footer>


<script>
/* =========================================================
   EPHPHAVORA LIVE
   ========================================================= */

/*
  IMPORTANT:
  This browser code does NOT contain a LiveKit API secret.

  The development token server is used for the current MVP.
  For production, replace this with your own secure token
  endpoint/serverless function.
*/

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


const LIVEKIT_TOKEN_SERVER_ID =
  "ephphavora-16wbwu";


const video =
  document.getElementById("video");

const goLiveBtn =
  document.getElementById("goLiveBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const micBtn =
  document.getElementById("micBtn");

const shareBtn =
  document.getElementById("shareBtn");

const endBtn =
  document.getElementById("endBtn");

const shareSection =
  document.getElementById("shareSection");

const shareUrl =
  document.getElementById("shareUrl");

const copyBtn =
  document.getElementById("copyBtn");

const statusBox =
  document.getElementById("status");

const notice =
  document.getElementById("notice");

const viewerCount =
  document.getElementById("viewerCount");

const chatMessages =
  document.getElementById("chatMessages");

const chatInput =
  document.getElementById("chatInput");

const sendChatBtn =
  document.getElementById("sendChatBtn");

const floatingReactions =
  document.getElementById("floatingReactions");


let room = null;

let currentUser = null;

let currentStreamId = null;

let currentRoomName = null;

let isHost = false;

let cameraEnabled = false;

let micEnabled = false;


/* =========================================================
   AUTH
   ========================================================= */

function getAccessToken() {

  return localStorage.getItem(
    "berakah_access_token"
  );

}


async function loadCurrentUser() {

  const token = getAccessToken();

  if (!token) {
    return null;
  }

  try {

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/user",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + token
        }
      }
    );

    if (!response.ok) {
      return null;
    }

    const user = await response.json();

    return {
      userId: user.id,
      email: user.email || "",
      username:
        localStorage.getItem("berakah_username") ||
        localStorage.getItem("berakah_user") ||
        user.email ||
        "EPHPHAVORA User"
    };

  } catch (error) {

    console.error(
      "User loading error:",
      error
    );

    return null;
  }

}


/* =========================================================
   SUPABASE HELPERS
   ========================================================= */

async function supabaseRequest(
  endpoint,
  options = {}
) {

  const token = getAccessToken();

  const headers = {
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (token) {
    headers["Authorization"] =
      "Bearer " + token;
  }

  return fetch(
    SUPABASE_URL + endpoint,
    {
      ...options,
      headers
    }
  );

}


/* =========================================================
   LIVE STREAM DATABASE
   ========================================================= */

async function createLiveStream(
  hostUserId,
  roomName
) {

  try {

    const response =
      await supabaseRequest(
        "/rest/v1/live_streams",
        {
          method: "POST",

          headers: {
            "Prefer": "return=representation"
          },

          body: JSON.stringify({
            host_user_id: hostUserId,
            room_name: roomName,
            title: "EPHPHAVORA LIVE",
            status: "live"
          })
        }
      );

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Live stream database error:",
        errorText
      );

      return null;
    }

    const data =
      await response.json();

    return data[0] || null;

  } catch (error) {

    console.error(
      "Create live stream error:",
      error
    );

    return null;
  }

}


async function endLiveStream() {

  if (!currentStreamId) {
    return;
  }

  try {

    const response =
      await supabaseRequest(
        "/rest/v1/live_streams?id=eq." +
        encodeURIComponent(currentStreamId),
        {
          method: "PATCH",

          body: JSON.stringify({
            status: "ended",
            ended_at: new Date().toISOString()
          })
        }
      );

    if (!response.ok) {

      console.error(
        "Could not update live stream."
      );

    }

  } catch (error) {

    console.error(
      "End stream database error:",
      error
    );

  }

}


/* =========================================================
   FIND ACTIVE STREAM
   ========================================================= */

async function findLiveStream(
  roomName
) {

  try {

    const response =
      await supabaseRequest(
        "/rest/v1/live_streams" +
        "?room_name=eq." +
        encodeURIComponent(roomName) +
        "&status=eq.live" +
        "&select=*"
      );

    if (!response.ok) {
      return null;
    }

    const data =
      await response.json();

    return data[0] || null;

  } catch (error) {

    console.error(
      "Find live stream error:",
      error
    );

    return null;
  }

}


/* =========================================================
   UI
   ========================================================= */

function setStatus(
  text,
  live = false
) {

  statusBox.textContent = text;

  statusBox.classList.toggle(
    "live",
    live
  );

}


function setNotice(text) {

  notice.textContent = text;

}


function updateViewerCount() {

  if (!room) {

    viewerCount.textContent =
      "👥 Viewers: 0";

    return;
  }

  const count =
    room.remoteParticipants.size;

  viewerCount.textContent =
    "👥 Viewers: " + count;

}


/* =========================================================
   VIDEO TRACK
   ========================================================= */

function attachTrack(
  track
) {

  if (!track) {
    return;
  }

  try {

    track.attach(video);

  } catch (error) {

    console.error(
      "Track attach error:",
      error
    );

  }

}


/* =========================================================
   REMOTE PARTICIPANTS
   ========================================================= */

function handleParticipant(
  participant
) {

  participant.trackPublications.forEach(
    publication => {

      if (
        publication.track
      ) {

        attachTrack(
          publication.track
        );

      }

    }
  );

  participant.on(
    "trackSubscribed",
    track => {

      attachTrack(track);

    }
  );

}


/* =========================================================
   LIVEKIT ROOM EVENTS
   ========================================================= */

function setupRoomEvents() {

  if (!room) {
    return;
  }


  room.on(
    "participantConnected",
    participant => {

      handleParticipant(
        participant
      );

      updateViewerCount();

    }
  );


  room.on(
    "participantDisconnected",
    () => {

      updateViewerCount();

    }
  );


  room.on(
    "trackSubscribed",
    track => {

      attachTrack(track);

    }
  );


  room.on(
    "disconnected",
    () => {

      setStatus(
        "Disconnected"
      );

      updateViewerCount();

    }
  );


  room.on(
    "dataReceived",
    (
      payload,
      participant
    ) => {

      try {

        const data =
          JSON.parse(
            new TextDecoder().decode(
              payload
            )
          );

        if (
          data.type === "chat"
        ) {

          addChatMessage(
            data.username ||
            participant?.identity ||
            "User",
            data.text
          );

        }

        if (
          data.type === "reaction"
        ) {

          showFloatingReaction(
            data.reaction
          );

        }

      } catch (error) {

        console.error(
          "Data packet error:",
          error
        );

      }

    }
  );

}


/* =========================================================
   CREATE ROOM
   ========================================================= */

function createRoom() {

  room =
    new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true
    });

  setupRoomEvents();

}


/* =========================================================
   START LIVE
   ========================================================= */

async function startLive() {

  if (isHost) {
    return;
  }

  if (!currentUser) {

    setNotice(
      "Please log in before going LIVE."
    );

    return;
  }


  try {

    isHost = true;

    setNotice(
      "Starting your LIVE..."
    );

    setStatus(
      "Connecting..."
    );

    currentRoomName =
      "ephphavora-live-" +
      currentUser.userId;


    const tokenSource =
      LivekitClient.TokenSource
        .developmentTokenServer(
          LIVEKIT_TOKEN_SERVER_ID
        );


    const token =
      await tokenSource.fetch(
        currentRoomName,
        currentUser.username
      );


    createRoom();


    await room.connect(
      token.serverUrl,
      token.participantToken
    );


    await room.localParticipant
      .setCameraEnabled(true);


    await room.localParticipant
      .setMicrophoneEnabled(true);


    cameraEnabled = true;

    micEnabled = true;


    const publications =
      room.localParticipant
        .trackPublications;


    publications.forEach(
      publication => {

        if (publication.track) {

          attachTrack(
            publication.track
          );

        }

      }
    );


    currentStreamId = null;

    const stream =
      await createLiveStream(
        currentUser.userId,
        currentRoomName
      );


    if (stream) {

      currentStreamId =
        stream.id;

    } else {

      setNotice(
        "LIVE started, but the stream database record could not be created."
      );

    }


    const url =
      window.location.origin +
      window.location.pathname +
      "?room=" +
      encodeURIComponent(
        currentRoomName
      );


    shareUrl.value = url;

    shareSection.classList.remove(
      "hidden"
    );


    setStatus(
      "🔴 LIVE",
      true
    );


    setNotice(
      "You are LIVE now!"
    );


    goLiveBtn.disabled = true;

    cameraBtn.disabled = false;

    micBtn.disabled = false;

    shareBtn.disabled = false;

    endBtn.disabled = false;

    goLiveBtn.textContent =
      "🔴 LIVE";


    updateViewerCount();


  } catch (error) {

    console.error(
      "Start LIVE error:",
      error
    );

    isHost = false;

    setStatus(
      "Could not start LIVE"
    );

    setNotice(
      error.message ||
      "Unable to start LIVE."
    );

    if (room) {

      try {
        await room.disconnect();
      } catch (e) {}

      room = null;

    }

  }

}


/* =========================================================
   JOIN LIVE
   ========================================================= */

async function joinLive(
  roomName
) {

  if (!roomName) {
    return;
  }


  try {

    setNotice(
      "Joining LIVE..."
    );

    setStatus(
      "Connecting..."
    );


    const stream =
      await findLiveStream(
        roomName
      );


    if (!stream) {

      setNotice(
        "This LIVE is not active or could not be found."
      );

      setStatus(
        "LIVE unavailable"
      );

      return;
    }


    currentStreamId =
      stream.id;

    currentRoomName =
      roomName;

    isHost = false;


    const username =
      currentUser?.username ||
      "EPHPHAVORA Viewer";


    const tokenSource =
      LivekitClient.TokenSource
        .developmentTokenServer(
          LIVEKIT_TOKEN_SERVER_ID
        );


    const token =
      await tokenSource.fetch(
        roomName,
        username
      );


    createRoom();


    await room.connect(
      token.serverUrl,
      token.participantToken
    );


    /*
      Viewer does NOT publish camera or microphone.
    */

    await room.localParticipant
      .setCameraEnabled(false);

    await room.localParticipant
      .setMicrophoneEnabled(false);


    room.remoteParticipants.forEach(
      participant => {

        handleParticipant(
          participant
        );

      }
    );


    const url =
      window.location.href;


    shareUrl.value = url;

    shareSection.classList.remove(
      "hidden"
    );


    setStatus(
      "🔴 WATCHING LIVE",
      true
    );


    setNotice(
      "You joined the LIVE."
    );


    goLiveBtn.textContent =
      "JOINED LIVE";

    goLiveBtn.disabled = true;


    cameraBtn.disabled = true;

    micBtn.disabled = true;

    shareBtn.disabled = false;

    endBtn.disabled = false;

    endBtn.textContent =
      "LEAVE LIVE";


    updateViewerCount();


  } catch (error) {

    console.error(
      "Join LIVE error:",
      error
    );

    setStatus(
      "Could not join LIVE"
    );

    setNotice(
      error.message ||
      "Unable to join LIVE."
    );


    if (room) {

      try {
        await room.disconnect();
      } catch (e) {}

      room = null;

    }

  }

}


/* =========================================================
   CAMERA
   ========================================================= */

async function toggleCamera() {

  if (!room || !isHost) {
    return;
  }

  try {

    cameraEnabled =
      !cameraEnabled;


    await room.localParticipant
      .setCameraEnabled(
        cameraEnabled
      );


    cameraBtn.textContent =
      cameraEnabled
        ? "📷 Camera ON"
        : "📷 Camera OFF";


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );

  }

}


/* =========================================================
   MICROPHONE
   ========================================================= */

async function toggleMic() {

  if (!room || !isHost) {
    return;
  }

  try {

    micEnabled =
      !micEnabled;


    await room.localParticipant
      .setMicrophoneEnabled(
        micEnabled
      );


    micBtn.textContent =
      micEnabled
        ? "🎤 Microphone ON"
        : "🔇 Microphone OFF";


  } catch (error) {

    console.error(
      "Microphone error:",
      error
    );

  }

}


/* =========================================================
   SHARE
   ========================================================= */

async function shareLive() {

  const url =
    shareUrl.value;


  if (!url) {
    return;
  }


  if (
    navigator.share
  ) {

    try {

      await navigator.share({
        title:
          "EPHPHAVORA LIVE",
        text:
          "Join my EPHPHAVORA LIVE!",
        url: url
      });

      return;

    } catch (error) {}

  }


  try {

    await navigator.clipboard
      .writeText(url);

    setNotice(
      "LIVE link copied!"
    );

  } catch (error) {

    shareUrl.select();

    document.execCommand(
      "copy"
    );

    setNotice(
      "LIVE link copied!"
    );

  }

}


async function copyShareUrl() {

  const url =
    shareUrl.value;


  if (!url) {
    return;
  }


  try {

    await navigator.clipboard
      .writeText(url);

    copyBtn.textContent =
      "COPIED!";

    setTimeout(
      () => {
        copyBtn.textContent =
          "COPY";
      },
      1500
    );

  } catch (error) {

    shareUrl.select();

    document.execCommand(
      "copy"
    );

    copyBtn.textContent =
      "COPIED!";

  }

}


/* =========================================================
   END / LEAVE LIVE
   ========================================================= */

async function endLive() {

  if (!room) {
    return;
  }


  const hostEnding =
    isHost;


  if (hostEnding) {

    await endLiveStream();

  }


  try {

    await room.disconnect();

  } catch (error) {

    console.error(
      "Disconnect error:",
      error
    );

  }


  room = null;

  currentStreamId = null;

  currentRoomName = null;

  cameraEnabled = false;

  micEnabled = false;


  video.srcObject = null;


  setStatus(
    hostEnding
      ? "LIVE ended"
      : "Left LIVE"
  );


  setNotice(
    hostEnding
      ? "Your LIVE has ended."
      : "You left the LIVE."
  );


  if (hostEnding) {

    goLiveBtn.disabled = false;

    goLiveBtn.textContent =
      "🔴 GO LIVE";

  } else {

    goLiveBtn.disabled = false;

    goLiveBtn.textContent =
      "🔴 GO LIVE";

  }


  cameraBtn.disabled = true;

  micBtn.disabled = true;

  shareBtn.disabled = true;

  endBtn.disabled = true;


  endBtn.textContent =
    "END LIVE";


  shareSection.classList.add(
    "hidden"
  );


  viewerCount.textContent =
    "👥 Viewers: 0";


  isHost = false;

}


/* =========================================================
   CHAT
   ========================================================= */

function addChatMessage(
  username,
  text
) {

  if (!text) {
    return;
  }


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "chat-message";


  const strong =
    document.createElement(
      "strong"
    );


  strong.textContent =
    username + ": ";


  const span =
    document.createElement(
      "span"
    );


  span.textContent =
    text;


  div.appendChild(
    strong
  );

  div.appendChild(
    span
  );


  chatMessages.appendChild(
    div
  );


  chatMessages.scrollTop =
    chatMessages.scrollHeight;

}


async function sendChat() {

  const text =
    chatInput.value.trim();


  if (!text) {
    return;
  }


  if (!room) {

    setNotice(
      "Join a LIVE first."
    );

    return;
  }


  const username =
    currentUser?.username ||
    "EPHPHAVORA User";


  const payload = {

    type: "chat",

    username: username,

    text: text

  };


  try {

    const encoder =
      new TextEncoder();


    await room.localParticipant
      .publishData(
        encoder.encode(
          JSON.stringify(payload)
        ),
        {
          reliable: true
        }
      );


    addChatMessage(
      username,
      text
    );


    chatInput.value = "";


  } catch (error) {

    console.error(
      "Chat error:",
      error
    );

  }

}


/* =========================================================
   REACTIONS
   ========================================================= */

async function sendReaction(
  reaction
) {

  if (!room) {
    return;
  }


  showFloatingReaction(
    reaction
  );


  const payload = {

    type: "reaction",

    reaction: reaction

  };


  try {

    const encoder =
      new TextEncoder();


    await room.localParticipant
      .publishData(
        encoder.encode(
          JSON.stringify(payload)
        ),
        {
          reliable: true
        }
      );

  } catch (error) {

    console.error(
      "Reaction error:",
      error
    );

  }

}


function showFloatingReaction(
  reaction
) {

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "float-reaction";


  div.textContent =
    reaction;


  div.style.left =
    Math.random() * 90 + "%";


  floatingReactions.appendChild(
    div
  );


  setTimeout(
    () => {
      div.remove();
    },
    2500
  );

}


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

/*
  IMPORTANT FIX:

  There is ONLY ONE click listener for goLiveBtn.

  The previous version could run startLive()
  and joinLive() at the same time because it used
  addEventListener() plus onclick.

  This version branches correctly.
*/

goLiveBtn.addEventListener(
  "click",
  async () => {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const roomFromURL =
      params.get("room");


    if (roomFromURL) {

      await joinLive(
        roomFromURL
      );

    } else {

      await startLive();

    }

  }
);


cameraBtn.addEventListener(
  "click",
  toggleCamera
);


micBtn.addEventListener(
  "click",
  toggleMic
);


shareBtn.addEventListener(
  "click",
  shareLive
);


copyBtn.addEventListener(
  "click",
  copyShareUrl
);


endBtn.addEventListener(
  "click",
  endLive
);


sendChatBtn.addEventListener(
  "click",
  sendChat
);


chatInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      sendChat();

    }

  }
);


document
  .querySelectorAll(
    ".reaction"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          sendReaction(
            button.dataset.reaction
          );

        }
      );

    }
  );


/* =========================================================
   INITIALIZATION
   ========================================================= */

async function initialize() {

  currentUser =
    await loadCurrentUser();


  const params =
    new URLSearchParams(
      window.location.search
    );


  const roomFromURL =
    params.get("room");


  if (roomFromURL) {

    /*
      We are viewing an existing LIVE.
    */

    goLiveBtn.textContent =
      "🔴 JOIN LIVE";


    if (!currentUser) {

      setNotice(
        "You can watch as a viewer. Log in to participate in chat."
      );

    }


  } else {

    /*
      We are on the host page.
    */

    if (!currentUser) {

      setNotice(
        "Log in to EPHPHAVORA before going LIVE."
      );

      goLiveBtn.disabled =
        false;

    }

  }

}


initialize();


/* =========================================================
   CLEANUP
   ========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if (room) {

      try {
        room.disconnect();
      } catch (error) {}

    }

  }
);

</script>
