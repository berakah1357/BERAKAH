}

body {

header {

}

#goLiveBtn {

.control {

}

#shareBtn {

}

}

.info {

.card {

}

.card-number {
  font-size: 24px;

}

.card-label {

  margin-top: 5px;
}

.share-box {
  display: none;
  margin-top: 18px;
  background: #171720;
  border-radius: 10px;
  padding: 15px;
}

.share-title {
  font-weight: bold;
  margin-bottom: 8px;
}

#shareLink {
  width: 100%;
  padding: 11px;
  border: 0;
  border-radius: 7px;

}

}

/* =========================
   LIVE CHAT
========================= */

.chat-box {
  margin-top: 20px;
  background: #171720;
  border-radius: 12px;
  padding: 15px;
}

.chat-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}

.chat-messages {
  height: 260px;
  overflow-y: auto;
  background: #0f0f15;
  border-radius: 9px;
  padding: 10px;
}

.chat-empty {
  color: #777;
  text-align: center;
  padding: 30px 10px;
}

.chat-message {
  margin-bottom: 10px;
  padding: 9px 11px;
  background: #25252f;
  border-radius: 9px;
  word-wrap: break-word;
}

.chat-name {
  font-weight: bold;
  color: #8db8ff;
  margin-bottom: 3px;
}

.chat-text {
  color: white;
  line-height: 1.4;
}

.chat-input-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

#chatInput {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 0;
  border-radius: 8px;

  color: white;
  font-size: 15px;
  outline: none;
}

#chatInput::placeholder {
  color: #888;
}

#sendChatBtn {
  background: #2563eb;
  color: white;
  min-width: 90px;
}

/* =========================
   LIVE REACTIONS
========================= */

.reaction-box {
  margin-top: 20px;
  background: #171720;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.reaction-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}

.reaction-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.reaction-btn {
  background: #25252f;
  color: white;
  font-size: 28px;
  width: 62px;
  height: 52px;
  padding: 0;
  border-radius: 12px;
  transition: transform .15s;
}

.reaction-btn:hover {
  transform: scale(1.12);
}

.reaction-btn:active {
  transform: scale(.92);
}

.reaction-btn:disabled {
  opacity: .4;
}

#reactionArea {
  position: fixed;
  right: 20px;
  bottom: 90px;
  width: 100px;
  height: 300px;
  pointer-events: none;
  z-index: 100;
  overflow: hidden;
}

.floating-reaction {
  position: absolute;
  bottom: 0;
  font-size: 38px;
  animation: floatReaction 2.2s ease-out forwards;
}

@keyframes floatReaction {

  0% {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
  }

  100% {
    opacity: 0;
    transform:
      translateY(-280px)
      scale(1.5);
  }

}

@media (max-width: 600px) {

  .container {
    padding: 10px;
  }

  .video-area,
  #videoGrid {
    min-height: 330px;
  }

  .video-tile {
    min-height: 280px;
  }

  .video-tile video {
    min-height: 280px;
  }

  button {
    flex: 1 1 140px;
  }

  .chat-input-row {
    flex-direction: column;
  }

  #sendChatBtn {
    width: 100%;
  }

  .reaction-btn {
    width: 58px;
    height: 50px;
  }

  #reactionArea {
    right: 5px;
    bottom: 70px;
  }
}

>

</div>

<div class="reaction-buttons">

  >
    ❤️
  </button>

  >

    disabled
  >

  >

  </button>

</div>

  </div></div><!-- Floating reactions --><div id="reactionArea"></div><script>

const LIVEKIT_URL =
  "wss://ephphavora-wciizjcm.livekit.cloud";

const LIVEKIT_TOKEN_SERVER_ID =
  "ephphavora-16wbwu";

let room = null;

let cameraOn = true;
let micOn = true;

let currentRoomName = null;

const statusEl =
  document.getElementById("status");

const messageEl =
  document.getElementById("message");

const videoGrid =
  document.getElementById("videoGrid");

const goLiveBtn =
  document.getElementById("goLiveBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const micBtn =
  document.getElementById("micBtn");

const shareBtn =
  document.getElementById("shareBtn");

const endBtn =
  document.getElementById("endBtn");

const viewerCount =
  document.getElementById("viewerCount");

const liveStatus =
  document.getElementById("liveStatus");

const shareBox =
  document.getElementById("shareBox");

const shareLink =
  document.getElementById("shareLink");

const copyBtn =
  document.getElementById("copyBtn");

const chatMessages =
  document.getElementById("chatMessages");

const chatEmpty =
  document.getElementById("chatEmpty");

const chatInput =
  document.getElementById("chatInput");

const sendChatBtn =
  document.getElementById("sendChatBtn");

const reactionArea =
  document.getElementById("reactionArea");

const reactionButtons =
  document.querySelectorAll(
    ".reaction-btn"
  );


function showMessage(text) {

  messageEl.style.display =
    "block";

  messageEl.textContent =
    text;
}


function clearMessage() {

  messageEl.style.display =
    "none";

  messageEl.textContent =
    "";
}


function getUserInfo() {

  const username =
    localStorage.getItem(
      "berakah_username"
    ) ||
    localStorage.getItem(
      "berakah_user"
    );

  const userId =
    localStorage.getItem(
      "berakah_auth_user_id"
    );

  return {

    username:
      username ||
      "EPHPHAVORA User",

    userId:
      userId ||
      crypto.randomUUID()

  };
}


function createHostRoomName() {

  const user =
    getUserInfo();

  return (
    "ephphavora-live-" +
    user.userId
  );
}


function getRoomFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("room");
}


async function getConnectionDetails(
  roomName
) {

  const user =
    getUserInfo();

  const tokenSource =
    LivekitClient.TokenSource
      .developmentTokenServer(
        LIVEKIT_TOKEN_SERVER_ID
      );

  const connectionDetails =
    await tokenSource.fetch({

      roomName:
        roomName,

      participantName:
        user.username,

      participantIdentity:
        user.userId

    });

  return connectionDetails;
}


/* =========================
   VIDEO
========================= */


function addVideoTrack(
  track,
  participant,
  isLocal
) {

  const tile =
    document.createElement(
      "div"
    );

  tile.className =
    "video-tile";

  tile.dataset.identity =
    participant.identity;

  const videoElement =
    track.attach();

  videoElement.autoplay =
    true;

  videoElement.playsInline =
    true;

  videoElement.muted =
    isLocal;

  tile.appendChild(
    videoElement
  );

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "name-label";

  name.textContent =
    isLocal
      ? "You"
      : (
          participant.name ||
          participant.identity
        );

  tile.appendChild(
    name
  );

  videoGrid.appendChild(
    tile
  );
}


function removeParticipant(
  participant
) {

  const tiles =
    videoGrid.querySelectorAll(
      ".video-tile"
    );

  tiles.forEach(tile => {

    if (
      tile.dataset.identity ===
      participant.identity
    ) {

      tile.remove();

    }

  });
}


function updateViewerCount() {

  if (!room) {

    viewerCount.textContent =
      "0";

    return;
  }

  viewerCount.textContent =
    String(
      room.remoteParticipants.size
    );
}


/* =========================
   SHARE
========================= */


function showShareLink() {

  if (!currentRoomName) {
    return;
  }

  const url =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(
      currentRoomName
    );

  shareLink.value =
    url;

  shareBox.style.display =
    "block";

  shareBtn.disabled =
    false;
}


/* =========================
   LIVE CHAT
========================= */


function addChatMessage(
  username,
  text
) {

  if (chatEmpty) {
    chatEmpty.remove();
  }

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "chat-message";

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "chat-name";

  name.textContent =
    username;

  const messageText =
    document.createElement(
      "div"
    );

  messageText.className =
    "chat-text";

  messageText.textContent =
    text;

  message.appendChild(
    name
  );

  message.appendChild(
    messageText
  );

  chatMessages.appendChild(
    message
  );

  chatMessages.scrollTop =
    chatMessages.scrollHeight;
}


function setupChat() {

  if (!room) {
    return;
  }

  room.on(
    LivekitClient.RoomEvent.DataReceived,
    (
      payload,
      participant
    ) => {

      try {

        const decoder =
          new TextDecoder();

        const data =
          JSON.parse(
            decoder.decode(
              payload
            )
          );

        if (
          data.type ===
          "chat"
        ) {

          addChatMessage(
            data.username ||
            participant?.name ||
            "EPHPHAVORA User",
            data.text
          );

        }

        if (
          data.type ===
          "reaction"
        ) {

          showFloatingReaction(
            data.reaction
          );

        }

      } catch (error) {

        console.error(
          "LIVE DATA RECEIVE ERROR:",
          error
        );

      }

    }
  );

}


async function sendChatMessage() {

  if (
    !room ||
    !room.localParticipant
  ) {
    return;
  }

  const text =
    chatInput.value.trim();

  if (!text) {
    return;
  }

  const user =
    getUserInfo();

  const chatData =
    JSON.stringify({

      type:
        "chat",

      username:
        user.username,

      text:
        text

    });

  try {

    await room.localParticipant
      .publishData(
        new TextEncoder().encode(
          chatData
        ),
        {
          reliable: true
        }
      );

    addChatMessage(
      user.username,
      text
    );

    chatInput.value =
      "";

  } catch (error) {

    console.error(
      "LIVE CHAT SEND ERROR:",
      error
    );

    showMessage(
      "Unable to send comment."
    );

  }

}


sendChatBtn.addEventListener(
  "click",
  sendChatMessage
);


chatInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      sendChatMessage();

    }

  }
);


/* =========================
   LIVE REACTIONS
========================= */


function showFloatingReaction(
  reaction
) {

  const element =
    document.createElement(
      "div"
    );

  element.className =
    "floating-reaction";

  element.textContent =
    reaction;

  const randomPosition =
    Math.floor(
      Math.random() * 70
    );

  element.style.left =
    randomPosition + "px";

  reactionArea.appendChild(
    element
  );

  setTimeout(() => {

    element.remove();

  }, 2300);

}


async function sendReaction(
  reaction
) {

  if (
    !room ||
    !room.localParticipant
  ) {
    return;
  }

  const reactionData =
    JSON.stringify({

      type:
        "reaction",

      reaction:
        reaction

    });

  try {

    await room.localParticipant
      .publishData(
        new TextEncoder().encode(
          reactionData
        ),
        {
          reliable: true
        }
      );

    showFloatingReaction(
      reaction
    );

  } catch (error) {

    console.error(
      "REACTION SEND ERROR:",
      error
    );

  }

}


reactionButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        const reaction =
          button.dataset.reaction;

        sendReaction(
          reaction
        );

      }
    );

  }
);


function enableReactions() {

  reactionButtons.forEach(
    button => {

      button.disabled =
        false;

    }
  );

}


function disableReactions() {

  reactionButtons.forEach(
    button => {

      button.disabled =
        true;

    }
  );

}


/* =========================
   START HOST LIVE
========================= */


async function startLive() {

  try {

    clearMessage();

    statusEl.textContent =
      "Connecting to EPHPHAVORA LIVE...";

    goLiveBtn.disabled =
      true;

    const roomName =
      createHostRoomName();

    currentRoomName =
      roomName;

    const connectionDetails =
      await getConnectionDetails(
        roomName
      );

    room =
      new LivekitClient.Room({
        adaptiveStream: true,
        dynacast: true
      });

    setupChat();

    room.on(
      LivekitClient.RoomEvent.TrackSubscribed,
      (
        track,
        publication,
        participant
      ) => {

        if (
          track.kind ===
          LivekitClient.Track.Kind.Video
        ) {

          addVideoTrack(
            track,
            participant,
            false
          );

        }

        updateViewerCount();

      }
    );

    room.on(
      LivekitClient.RoomEvent.TrackUnsubscribed,
      (
        track,
        publication,
        participant
      ) => {

        track.detach();

        removeParticipant(
          participant
        );

        updateViewerCount();

      }
    );

    room.on(
      LivekitClient.RoomEvent.ParticipantConnected,
      () => {

        updateViewerCount();

      }
    );

    room.on(
      LivekitClient.RoomEvent.ParticipantDisconnected,
      participant => {

        removeParticipant(
          participant
        );

        updateViewerCount();

      }
    );

    room.on(
      LivekitClient.RoomEvent.Disconnected,
      () => {

        statusEl.textContent =
          "Disconnected from LIVE.";

        liveStatus.textContent =
          "OFF";

        cameraBtn.disabled =
          true;

        micBtn.disabled =
          true;

        shareBtn.disabled =
          true;

        endBtn.disabled =
          true;

        sendChatBtn.disabled =
          true;

        disableReactions();

        goLiveBtn.disabled =
          false;

        shareBox.style.display =
          "none";

        updateViewerCount();

      }
    );

    await room.connect(
      connectionDetails.serverUrl ||
      LIVEKIT_URL,
      connectionDetails.participantToken
    );

    await room.localParticipant
      .setCameraEnabled(true);

    await room.localParticipant
      .setMicrophoneEnabled(true);

    const publications =
      room.localParticipant
        .videoTrackPublications;

    publications.forEach(
      publication => {

        if (
          publication.track
        ) {

          addVideoTrack(
            publication.track,
            room.localParticipant,
            true
          );

        }

      }
    );

    cameraOn =
      true;

    micOn =
      true;

    cameraBtn.disabled =
      false;

    micBtn.disabled =
      false;

    shareBtn.disabled =
      false;

    endBtn.disabled =
      false;

    sendChatBtn.disabled =
      false;

    enableReactions();

    statusEl.textContent =
      "🔴 You are LIVE on EPHPHAVORA!";

    liveStatus.textContent =
      "LIVE";

    showShareLink();

    updateViewerCount();

  } catch (error) {

    console.error(
      "EPHPHAVORA LIVE ERROR:",
      error
    );

    statusEl.textContent =
      "Unable to start LIVE.";

    showMessage(
      error.message ||
      "Something went wrong."
    );

    goLiveBtn.disabled =
      false;

  }

}


/* =========================
   JOIN VIEWER LIVE
========================= */


async function joinLive(roomName) {

  try {

    clearMessage();

    statusEl.textContent =
      "Joining EPHPHAVORA LIVE...";

    goLiveBtn.disabled =
      true;

    const connectionDetails =
      await getConnectionDetails(
        roomName
      );

    currentRoomName =
      roomName;

    room =
      new LivekitClient.Room({
        adaptiveStream: true,
        dynacast: true
      });

    setupChat();

    room.on(
      LivekitClient.RoomEvent.TrackSubscribed,
      (
        track,
        publication,
        participant
      ) => {

        if (
          track.kind ===
          LivekitClient.Track.Kind.Video
        ) {

          addVideoTrack(
            track,
            participant,
            false
          );

        }

        updateViewerCount();

      }
    );

    room.on(
      LivekitClient.RoomEvent.TrackUnsubscribed,
      (
        track,
        publication,
        participant
      ) => {

        track.detach();

        removeParticipant(
          participant
        );

        updateViewerCount();

      }
    );

    room.on(
      LivekitClient.RoomEvent.ParticipantConnected,
      () => {

        updateViewerCount();

      }
    );

    room.on(
      LivekitClient.RoomEvent.ParticipantDisconnected,
      participant => {

        removeParticipant(
          participant
        );

        updateViewerCount();

      }
    );

    room.on(
      LivekitClient.RoomEvent.Disconnected,
      () => {

        statusEl.textContent =
          "LIVE ended.";

        liveStatus.textContent =
          "OFF";

        sendChatBtn.disabled =
          true;

        disableReactions();

        updateViewerCount();

      }
    );

    await room.connect(
      connectionDetails.serverUrl ||
      LIVEKIT_URL,
      connectionDetails.participantToken
    );

    await room.localParticipant
      .setCameraEnabled(false);

    await room.localParticipant
      .setMicrophoneEnabled(false);

    cameraOn =
      false;

    micOn =
      false;

    cameraBtn.disabled =
      true;

    micBtn.disabled =
      true;

    shareBtn.disabled =
      false;

    endBtn.disabled =
      false;

    sendChatBtn.disabled =
      false;

    enableReactions();

    statusEl.textContent =
      "👀 You are watching EPHPHAVORA LIVE";

    liveStatus.textContent =
      "LIVE";

    showShareLink();

    updateViewerCount();

  } catch (error) {

    console.error(
      "EPHPHAVORA VIEWER ERROR:",
      error
    );

    statusEl.textContent =
      "Unable to join LIVE.";

    showMessage(
      error.message ||
      "This LIVE may have ended."
    );

    goLiveBtn.disabled =
      false;

  }

}


/* =========================
   CAMERA
========================= */


async function toggleCamera() {

  if (!room) return;

  cameraOn =
    !cameraOn;

  await room.localParticipant
    .setCameraEnabled(
      cameraOn
    );

  cameraBtn.textContent =
    cameraOn
      ? "📷 Camera ON"
      : "📷 Camera OFF";
}


/* =========================
   MICROPHONE
========================= */


async function toggleMic() {

  if (!room) return;

  micOn =
    !micOn;

  await room.localParticipant
    .setMicrophoneEnabled(
      micOn
    );

  micBtn.textContent =
    micOn
      ? "🎤 Mic ON"
      : "🎤 Mic OFF";
}


/* =========================
   SHARE LIVE
========================= */


async function shareLive() {

  if (!shareLink.value) {
    return;
  }

  try {

    await navigator.clipboard.writeText(
      shareLink.value
    );

    shareBtn.textContent =
      "✅ LINK COPIED";

    setTimeout(() => {

      shareBtn.textContent =
        "🔗 SHARE LIVE";

    }, 2000);

  } catch {

    shareLink.select();

    showMessage(
      "Copy the LIVE link manually."
    );

  }

}


/* =========================
   COPY LINK
========================= */


async function copyLink() {

  if (!shareLink.value) {
    return;
  }

  try {

    await navigator.clipboard.writeText(
      shareLink.value
    );

    copyBtn.textContent =
      "✅ COPIED";

    setTimeout(() => {

      copyBtn.textContent =
        "📋 COPY LINK";

    }, 2000);

  } catch {

    shareLink.select();

    document.execCommand(
      "copy"
    );

  }

}


/* =========================
   END LIVE
========================= */


async function endLive() {

  if (!room) {
    return;
  }

  await room.disconnect();

  videoGrid.innerHTML =
    "";

  room =
    null;

  currentRoomName =
    null;

  statusEl.textContent =
    "LIVE ended.";

  liveStatus.textContent =
    "OFF";

  viewerCount.textContent =
    "0";

  cameraBtn.disabled =
    true;

  micBtn.disabled =
    true;

  shareBtn.disabled =
    true;

  endBtn.disabled =
    true;

  sendChatBtn.disabled =
    true;

  disableReactions();

  goLiveBtn.disabled =
    false;

  shareBox.style.display =
    "none";

  cameraBtn.textContent =
    "📷 Camera ON";

  micBtn.textContent =
    "🎤 Mic ON";

  cameraOn =
    true;

  micOn =
    true;

}


/* =========================
   BUTTON EVENTS
========================= */


goLiveBtn.addEventListener(
  "click",
  startLive
);

cameraBtn.addEventListener(
  "click",
  toggleCamera
);

micBtn.addEventListener(
  "click",
  toggleMic
);

shareBtn.addEventListener(
  "click",
  shareLive
);

copyBtn.addEventListener(
  "click",
  copyLink
);

endBtn.addEventListener(
  "click",
  endLive
);


/* =========================
   VIEWER MODE
========================= */


const roomFromURL =
  getRoomFromURL();

if (roomFromURL) {

  goLiveBtn.textContent =
    "👀 JOIN LIVE";

  statusEl.textContent =
    "A LIVE was shared with you.";

  goLiveBtn.onclick =
    () => joinLive(roomFromURL);

}
