<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EPHPHAVORA LIVE</title>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050505;
  color: white;
}

header {
  height: 64px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid #292929;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: white;
}

.logo span {
  color: #ff1744;
}

.back {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.live-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 15px;
}

.live-title {
  font-size: 22px;
  font-weight: bold;
}

.live-badge {
  display: none;
  background: #ff1744;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}

.video-area {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #111;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #292929;
}

#remoteVideo,
#localVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

#localVideo {
  position: absolute;
  right: 15px;
  bottom: 15px;
  width: 180px;
  height: 110px;
  border-radius: 10px;
  border: 2px solid white;
  display: none;
  z-index: 5;
}

.empty-message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #aaa;
  padding: 20px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

button {
  border: none;
  border-radius: 9px;
  padding: 12px 17px;
  background: #242424;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:hover {
  opacity: .85;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.go-live {
  background: #ff1744;
  font-weight: bold;
}

.end-live {
  background: #b00020;
  display: none;
}

.join-live {
  background: #1976d2;
}

.status {
  margin-top: 12px;
  color: #aaa;
  font-size: 14px;
  min-height: 20px;
}

.room-info {
  margin-top: 15px;
  background: #111;
  padding: 15px;
  border-radius: 12px;
  display: none;
}

.room-info strong {
  color: #fff;
}

.viewer-count {
  margin-top: 5px;
  color: #aaa;
}

.chat-section {
  margin-top: 20px;
  background: #111;
  border-radius: 12px;
  padding: 15px;
}

.chat-section h3 {
  margin-top: 0;
}

#messages {
  height: 180px;
  overflow-y: auto;
  background: #080808;
  border-radius: 9px;
  padding: 10px;
}

.message {
  padding: 7px 0;
  border-bottom: 1px solid #202020;
}

.message strong {
  color: #ff1744;
}

.chat-input {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.chat-input input {
  flex: 1;
  background: #222;
  color: white;
  border: 1px solid #333;
  border-radius: 9px;
  padding: 12px;
  outline: none;
}

.reactions {
  margin-top: 15px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.reactions button {
  font-size: 20px;
  padding: 8px 12px;
}

.notice {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  background: #222;
  color: white;
  padding: 12px 18px;
  border-radius: 10px;
  display: none;
  z-index: 100;
  max-width: 90%;
  text-align: center;
}

@media (max-width: 600px) {
  main {
    padding: 10px;
  }

  .logo {
    font-size: 18px;
  }

  #localVideo {
    width: 120px;
    height: 80px;
    right: 8px;
    bottom: 8px;
  }

  button {
    padding: 10px 13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    EPHPHAVORA <span>LIVE</span>
  </div>

  <a class="back" href="index.html">← Back</a>
</header>

<main>

  <div class="live-header">
    <div class="live-title">Live Stream</div>
    <div id="liveBadge" class="live-badge">🔴 LIVE</div>
  </div>

  <div class="video-area">

    <video
      id="remoteVideo"
      autoplay
      playsinline
      controls
    ></video>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>

    <div id="emptyMessage" class="empty-message">
      Ready to go LIVE
    </div>

  </div>

  <div class="controls">

    <button
      id="goLiveBtn"
      class="go-live"
    >
      🔴 GO LIVE
    </button>

    <button
      id="joinBtn"
      class="join-live"
      style="display:none;"
    >
      ▶ JOIN LIVE
    </button>

    <button
      id="cameraBtn"
      style="display:none;"
    >
      📷 Camera
    </button>

    <button
      id="micBtn"
      style="display:none;"
    >
      🎤 Mic
    </button>

    <button
      id="shareBtn"
      style="display:none;"
    >
      🔗 Share LIVE
    </button>

    <button
      id="endBtn"
      class="end-live"
    >
      ⛔ END LIVE
    </button>

  </div>

  <div id="status" class="status">
    Checking login...
  </div>

  <div id="roomInfo" class="room-info">

    <div>
      Room:
      <strong id="roomNameDisplay"></strong>
    </div>

    <div class="viewer-count">
      👥 Viewers:
      <span id="viewerCount">0</span>
    </div>

  </div>

  <div class="chat-section">

    <h3>💬 LIVE Chat</h3>

    <div id="messages"></div>

    <div class="chat-input">

      <input
        id="chatInput"
        type="text"
        placeholder="Write a message..."
        maxlength="300"
      >

      <button id="sendChatBtn">
        Send
      </button>

    </div>

  </div>

  <div class="reactions">

    <button onclick="sendReaction('❤️')">❤️</button>
    <button onclick="sendReaction('🔥')">🔥</button>
    <button onclick="sendReaction('👏')">👏</button>
    <button onclick="sendReaction('🙏')">🙏</button>
    <button onclick="sendReaction('🎉')">🎉</button>

  </div>

</main>

<div id="notice" class="notice"></div>

<script>

/* =========================================================
   EPHPHAVORA LIVE
   ========================================================= */

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const LIVEKIT_URL =
  "wss://ephphavora-wciizjcm.livekit.cloud";

/*
  IMPORTANT:
  Development token server only.
  Do NOT put LiveKit API secret in this file.
*/
const TOKEN_SERVER_ID =
  "ephphavora-16wbwu";


/* =========================================================
   ELEMENTS
   ========================================================= */

const goLiveBtn =
  document.getElementById("goLiveBtn");

const joinBtn =
  document.getElementById("joinBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const micBtn =
  document.getElementById("micBtn");

const shareBtn =
  document.getElementById("shareBtn");

const endBtn =
  document.getElementById("endBtn");

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const emptyMessage =
  document.getElementById("emptyMessage");

const statusEl =
  document.getElementById("status");

const liveBadge =
  document.getElementById("liveBadge");

const roomInfo =
  document.getElementById("roomInfo");

const roomNameDisplay =
  document.getElementById("roomNameDisplay");

const viewerCount =
  document.getElementById("viewerCount");

const messages =
  document.getElementById("messages");

const chatInput =
  document.getElementById("chatInput");

const sendChatBtn =
  document.getElementById("sendChatBtn");

const notice =
  document.getElementById("notice");


/* =========================================================
   STATE
   ========================================================= */

let room = null;

let currentUser = null;

let currentRoomName = null;

let currentStreamId = null;

let isHost = false;

let cameraEnabled = false;

let micEnabled = false;


/* =========================================================
   NOTICE
   ========================================================= */

function showNotice(message) {

  notice.textContent = message;

  notice.style.display = "block";

  setTimeout(() => {

    notice.style.display = "none";

  }, 3500);
}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message) {

  statusEl.textContent = message;

  console.log("[EPHPHAVORA LIVE]", message);
}


/* =========================================================
   AUTH
   ========================================================= */

async function loadCurrentUser() {

  const accessToken =
    localStorage.getItem("berakah_access_token");

  if (!accessToken) {

    currentUser = null;

    setStatus(
      "Please log in before starting or joining LIVE."
    );

    goLiveBtn.disabled = true;

    return null;
  }

  try {

    const response =
      await fetch(
        SUPABASE_URL + "/auth/v1/user",
        {
          method: "GET",

          headers: {
            apikey: SUPABASE_KEY,
            Authorization:
              "Bearer " + accessToken
          }
        }
      );

    if (!response.ok) {

      throw new Error(
        "Authentication failed"
      );
    }

    const authUser =
      await response.json();

    const username =
      localStorage.getItem(
        "berakah_username"
      ) ||
      authUser.email ||
      "EPHPHAVORA User";

    currentUser = {

      userId: authUser.id,

      username: username,

      email: authUser.email || ""

    };

    setStatus(
      "Logged in as " +
      currentUser.username
    );

    goLiveBtn.disabled = false;

    return currentUser;

  } catch (error) {

    console.error(error);

    currentUser = null;

    setStatus(
      "Login session expired. Please log in again."
    );

    goLiveBtn.disabled = true;

    return null;
  }
}


/* =========================================================
   SUPABASE HEADERS
   ========================================================= */

function supabaseHeaders() {

  const token =
    localStorage.getItem(
      "berakah_access_token"
    );

  return {

    apikey: SUPABASE_KEY,

    Authorization:
      "Bearer " + token,

    "Content-Type":
      "application/json"

  };
}


/* =========================================================
   CREATE LIVE STREAM
   ========================================================= */

async function createLiveStream() {

  if (!currentUser) return null;

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/live_streams",
        {
          method: "POST",

          headers: {
            ...supabaseHeaders(),

            Prefer:
              "return=representation"
          },

          body: JSON.stringify({

            host_user_id:
              currentUser.userId,

            room_name:
              currentRoomName,

            title:
              "EPHPHAVORA LIVE",

            status:
              "live"

          })

        }
      );

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Supabase live_streams error:",
        errorText
      );

      return null;
    }

    const data =
      await response.json();

    if (data && data.length > 0) {

      currentStreamId =
        data[0].id;

      return data[0];
    }

    return null;

  } catch (error) {

    console.error(
      "createLiveStream error:",
      error
    );

    return null;
  }
}


/* =========================================================
   END LIVE STREAM
   ========================================================= */

async function endLiveStream() {

  if (!currentStreamId) return;

  try {

    await fetch(

      SUPABASE_URL +
      "/rest/v1/live_streams?id=eq." +
      encodeURIComponent(
        currentStreamId
      ),

      {

        method: "PATCH",

        headers: {
          ...supabaseHeaders(),

          Prefer:
            "return=minimal"
        },

        body: JSON.stringify({

          status:
            "ended",

          ended_at:
            new Date().toISOString()

        })

      }

    );

  } catch (error) {

    console.error(
      "endLiveStream error:",
      error
    );
  }
}


/* =========================================================
   FIND LIVE STREAM
   ========================================================= */

async function findLiveStream() {

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/live_streams" +
        "?status=eq.live" +
        "&order=started_at.desc" +
        "&limit=1",

        {

          method: "GET",

          headers: {

            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              (
                localStorage.getItem(
                  "berakah_access_token"
                ) || ""
              )

          }

        }

      );

    if (!response.ok) {

      throw new Error(
        "Could not find LIVE"
      );
    }

    const data =
      await response.json();

    if (!data || !data.length) {

      return null;
    }

    return data[0];

  } catch (error) {

    console.error(error);

    return null;
  }
}


/* =========================================================
   LIVEKIT TOKEN SOURCE
   ========================================================= */

function getTokenSource() {

  if (
    !window.LivekitClient ||
    !LivekitClient.TokenSource
  ) {

    throw new Error(
      "LiveKit SDK did not load."
    );
  }

  return LivekitClient.TokenSource
    .developmentTokenServer(
      TOKEN_SERVER_ID
    );
}


/* =========================================================
   START LIVE
   ========================================================= */

async function startLive() {

  if (!currentUser) {

    showNotice(
      "Please log in first."
    );

    return;
  }

  try {

    setStatus(
      "Preparing your LIVE room..."
    );

    goLiveBtn.disabled = true;

    isHost = true;

    currentRoomName =
      "ephphavora-" +
      crypto.randomUUID();

    roomNameDisplay.textContent =
      currentRoomName;

    /*
      CORRECT LIVEKIT SDK 2.x FORMAT
    */

    const tokenSource =
      getTokenSource();

    const token =
      await tokenSource.fetch({

        roomName:
          currentRoomName,

        participantName:
          currentUser.username,

        participantIdentity:
          currentUser.userId

      });

    console.log(
      "LiveKit token received."
    );

    room =
      new LivekitClient.Room({

        adaptiveStream: true,

        dynacast: true

      });

    setupRoomListeners();

    setStatus(
      "Connecting to LiveKit..."
    );

    await room.connect(
      LIVEKIT_URL,
      token.participantToken ||
      token
    );

    console.log(
      "Connected to LiveKit."
    );

    await room.localParticipant
      .setCameraEnabled(true);

    await room.localParticipant
      .setMicrophoneEnabled(true);

    cameraEnabled = true;

    micEnabled = true;

    attachLocalVideo();

    updateControls();

    const stream =
      await createLiveStream();

    if (!stream) {

      console.warn(
        "LIVE connected, but Supabase stream record was not created."
      );

      showNotice(
        "LIVE is connected. Database record needs attention."
      );

    }

    liveBadge.style.display =
      "block";

    roomInfo.style.display =
      "block";

    emptyMessage.style.display =
      "none";

    setStatus(
      "🔴 You are LIVE!"
    );

    showNotice(
      "🔴 EPHPHAVORA LIVE started!"
    );

  } catch (error) {

    console.error(
      "START LIVE ERROR:",
      error
    );

    goLiveBtn.disabled = false;

    isHost = false;

    setStatus(
      "LIVE error: " +
      (
        error.message ||
        error
      )
    );

    showNotice(
      "Could not start LIVE. Check the error message."
    );

  }

}


/* =========================================================
   JOIN LIVE
   ========================================================= */

async function joinLive(roomName) {

  if (!currentUser) {

    showNotice(
      "Please log in first."
    );

    return;
  }

  try {

    setStatus(
      "Joining LIVE..."
    );

    joinBtn.disabled = true;

    isHost = false;

    currentRoomName =
      roomName;

    roomNameDisplay.textContent =
      currentRoomName;

    /*
      CORRECT LIVEKIT SDK 2.x FORMAT
    */

    const tokenSource =
      getTokenSource();

    const token =
      await tokenSource.fetch({

        roomName:
          roomName,

        participantName:
          currentUser.username,

        participantIdentity:
          currentUser.userId ||
          (
            "viewer-" +
            crypto.randomUUID()
          )

      });

    room =
      new LivekitClient.Room({

        adaptiveStream: true,

        dynacast: true

      });

    setupRoomListeners();

    await room.connect(

      LIVEKIT_URL,

      token.participantToken ||
      token

    );

    roomInfo.style.display =
      "block";

    emptyMessage.style.display =
      "none";

    setStatus(
      "🟢 Joined LIVE."
    );

    showNotice(
      "You joined the LIVE."
    );

    updateControls();

  } catch (error) {

    console.error(
      "JOIN LIVE ERROR:",
      error
    );

    joinBtn.disabled = false;

    setStatus(
      "Join error: " +
      (
        error.message ||
        error
      )
    );

  }

}


/* =========================================================
   ROOM LISTENERS
   ========================================================= */

function setupRoomListeners() {

  if (!room) return;

  room.on(

    LivekitClient.RoomEvent
      .TrackSubscribed,

    (
      track,
      publication,
      participant
    ) => {

      console.log(
        "Track subscribed:",
        track.kind,
        participant.identity
      );

      if (
        track.kind ===
        LivekitClient.Track.Kind.Video
      ) {

        track.attach(
          remoteVideo
        );

        remoteVideo.style.display =
          "block";

        emptyMessage.style.display =
          "none";

      }

      if (
        track.kind ===
        LivekitClient.Track.Kind.Audio
      ) {

        track.attach();
      }

    }

  );


  room.on(

    LivekitClient.RoomEvent
      .TrackUnsubscribed,

    track => {

      track.detach();
    }

  );


  room.on(

    LivekitClient.RoomEvent
      .ParticipantConnected,

    participant => {

      console.log(
        "Participant joined:",
        participant.identity
      );

      updateViewerCount();

    }

  );


  room.on(

    LivekitClient.RoomEvent
      .ParticipantDisconnected,

    participant => {

      console.log(
        "Participant left:",
        participant.identity
      );

      updateViewerCount();

    }

  );


  room.on(

    LivekitClient.RoomEvent
      .Disconnected,

    () => {

      console.log(
        "Disconnected from LiveKit."
      );

      updateViewerCount();

    }

  );


  room.on(

    LivekitClient.RoomEvent
      .DataReceived,

    (
      payload,
      participant
    ) => {

      try {

        const message =
          new TextDecoder()
            .decode(payload);

        const data =
          JSON.parse(message);

        if (
          data.type ===
          "chat"
        ) {

          addMessage(

            data.username ||
            "User",

            data.message

          );

        }

        if (
          data.type ===
          "reaction"
        ) {

          showNotice(

            (
              data.emoji ||
              "❤️"
            ) +
            " " +
            (
              data.username ||
              "User"
            )

          );

        }

      } catch (error) {

        console.error(
          "Data error:",
          error
        );

      }

    }

  );

}


/* =========================================================
   LOCAL VIDEO
   ========================================================= */

function attachLocalVideo() {

  if (!room) return;

  const publication =
    room.localParticipant
      .getTrackPublication(
        LivekitClient.Track.Source.Camera
      );

  if (
    publication &&
    publication.track
  ) {

    publication.track.attach(
      localVideo
    );

    localVideo.style.display =
      "block";

  }

}


/* =========================================================
   CAMERA
   ========================================================= */

async function toggleCamera() {

  if (!room) return;

  cameraEnabled =
    !cameraEnabled;

  await room.localParticipant
    .setCameraEnabled(
      cameraEnabled
    );

  if (cameraEnabled) {

    attachLocalVideo();

  } else {

    localVideo.style.display =
      "none";

  }

  updateControls();

}


/* =========================================================
   MICROPHONE
   ========================================================= */

async function toggleMic() {

  if (!room) return;

  micEnabled =
    !micEnabled;

  await room.localParticipant
    .setMicrophoneEnabled(
      micEnabled
    );

  updateControls();

}


/* =========================================================
   CONTROLS
   ========================================================= */

function updateControls() {

  if (!room) {

    cameraBtn.style.display =
      "none";

    micBtn.style.display =
      "none";

    shareBtn.style.display =
      "none";

    endBtn.style.display =
      "none";

    return;

  }

  cameraBtn.style.display =
    "inline-block";

  micBtn.style.display =
    "inline-block";

  shareBtn.style.display =
    "inline-block";

  endBtn.style.display =
    "inline-block";

  cameraBtn.textContent =
    cameraEnabled
      ? "📷 Camera ON"
      : "📷 Camera OFF";

  micBtn.textContent =
    micEnabled
      ? "🎤 Mic ON"
      : "🎤 Mic OFF";

}


/* =========================================================
   VIEWER COUNT
   ========================================================= */

function updateViewerCount() {

  if (!room) {

    viewerCount.textContent =
      "0";

    return;
  }

  let count =
    room.remoteParticipants.size;

  /*
    Host does not count as viewer.
  */

  viewerCount.textContent =
    String(count);

}


/* =========================================================
   SHARE LIVE
   ========================================================= */

async function shareLive() {

  if (!currentRoomName) {

    showNotice(
      "No LIVE room available."
    );

    return;
  }

  const url =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(
      currentRoomName
    );

  try {

    if (
      navigator.share
    ) {

      await navigator.share({

        title:
          "EPHPHAVORA LIVE",

        text:
          "Join my EPHPHAVORA LIVE",

        url:
          url

      });

    } else {

      await navigator.clipboard
        .writeText(url);

      showNotice(
        "LIVE link copied!"
      );

    }

  } catch (error) {

    console.log(
      "Share cancelled."
    );

  }

}


/* =========================================================
   CHAT
   ========================================================= */

async function sendChat() {

  const message =
    chatInput.value.trim();

  if (!message) return;

  if (!room) {

    showNotice(
      "Join a LIVE first."
    );

    return;
  }

  const data = {

    type:
      "chat",

    username:
      currentUser?.username ||
      "User",

    message:
      message

  };

  try {

    const encoder =
      new TextEncoder();

    const payload =
      encoder.encode(
        JSON.stringify(data)
      );

    await room.localParticipant
      .publishData(
        payload,
        {
          reliable: true
        }
      );

    addMessage(
      data.username,
      data.message
    );

    chatInput.value =
      "";

  } catch (error) {

    console.error(
      "Chat error:",
      error
    );

  }

}


function addMessage(
  username,
  message
) {

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message";

  const strong =
    document.createElement(
      "strong"
    );

  strong.textContent =
    username + ":";

  const text =
    document.createTextNode(
      " " + message
    );

  div.appendChild(
    strong
  );

  div.appendChild(
    text
  );

  messages.appendChild(
    div
  );

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================================================
   REACTIONS
   ========================================================= */

async function sendReaction(
  emoji
) {

  if (!room) {

    showNotice(
      "Join a LIVE first."
    );

    return;
  }

  const data = {

    type:
      "reaction",

    username:
      currentUser?.username ||
      "User",

    emoji:
      emoji

  };

  try {

    const payload =
      new TextEncoder()
        .encode(
          JSON.stringify(data)
        );

    await room.localParticipant
      .publishData(
        payload,
        {
          reliable: true
        }
      );

    showNotice(
      emoji
    );

  } catch (error) {

    console.error(
      "Reaction error:",
      error
    );

  }

}


/* =========================================================
   END LIVE
   ========================================================= */

async function endLive() {

  try {

    setStatus(
      "Ending LIVE..."
    );

    await endLiveStream();

    if (room) {

      await room.disconnect();

      room = null;

    }

    currentStreamId =
      null;

    currentRoomName =
      null;

    isHost =
      false;

    cameraEnabled =
      false;

    micEnabled =
      false;

    localVideo.srcObject =
      null;

    remoteVideo.srcObject =
      null;

    localVideo.style.display =
      "none";

    liveBadge.style.display =
      "none";

    roomInfo.style.display =
      "none";

    emptyMessage.style.display =
      "flex";

    setStatus(
      "LIVE ended."
    );

    showNotice(
      "LIVE ended successfully."
    );

    goLiveBtn.style.display =
      "inline-block";

    goLiveBtn.disabled =
      false;

    joinBtn.style.display =
      "none";

    updateControls();

  } catch (error) {

    console.error(
      "End LIVE error:",
      error
    );

    setStatus(
      "LIVE ended."
    );

  }

}


/* =========================================================
   EVENT LISTENERS
   ========================================================= */

goLiveBtn.addEventListener(
  "click",
  startLive
);

joinBtn.addEventListener(
  "click",
  async () => {

    const stream =
      await findLiveStream();

    if (!stream) {

      showNotice(
        "No LIVE stream is currently available."
      );

      return;
    }

    joinLive(
      stream.room_name
    );

  }
);

cameraBtn.addEventListener(
  "click",
  toggleCamera
);

micBtn.addEventListener(
  "click",
  toggleMic
);

shareBtn.addEventListener(
  "click",
  shareLive
);

endBtn.addEventListener(
  "click",
  endLive
);

sendChatBtn.addEventListener(
  "click",
  sendChat
);

chatInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      sendChat();

    }

  }
);


/* =========================================================
   PAGE START
   ========================================================= */

async function initializePage() {

  await loadCurrentUser();

  /*
    If URL contains ?room=ROOMNAME,
    automatically prepare JOIN LIVE.
  */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const roomFromUrl =
    params.get("room");

  if (roomFromUrl) {

    joinBtn.style.display =
      "inline-block";

    goLiveBtn.style.display =
      "none";

    setStatus(
      "LIVE link detected. Tap JOIN LIVE."
    );

  } else {

    joinBtn.style.display =
      "none";

    goLiveBtn.style.display =
      "inline-block";

  }

  updateControls();

}

initializePage();

</script>
