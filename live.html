<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EPHPHAVORA LIVE</title>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050505;
  color: white;
}

header {
  height: 64px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid #292929;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.logo span {
  color: #ff1744;
}

.back {
  color: white;
  text-decoration: none;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.live-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.live-title {
  font-size: 22px;
  font-weight: bold;
}

.live-badge {
  display: none;
  background: #ff1744;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}

.video-area {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #111;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #292929;
}

#remoteVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

#localVideo {
  position: absolute;
  right: 15px;
  bottom: 15px;
  width: 180px;
  height: 110px;
  object-fit: cover;
  border-radius: 10px;
  border: 2px solid white;
  display: none;
  z-index: 5;
}

.empty-message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  text-align: center;
  padding: 20px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

button {
  border: none;
  border-radius: 9px;
  padding: 12px 17px;
  background: #242424;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:hover {
  opacity: .85;
}

button:disabled {
  opacity: .45;
}

.go-live {
  background: #ff1744;
  font-weight: bold;
}

.join-live {
  background: #1976d2;
}

.end-live {
  background: #b00020;
  display: none;
}

.status {
  margin-top: 12px;
  color: #aaa;
  min-height: 20px;
  font-size: 14px;
}

.room-info {
  margin-top: 15px;
  background: #111;
  padding: 15px;
  border-radius: 12px;
  display: none;
}

.viewer-count {
  margin-top: 5px;
  color: #aaa;
}

.chat-section {
  margin-top: 20px;
  background: #111;
  border-radius: 12px;
  padding: 15px;
}

.chat-section h3 {
  margin-top: 0;
}

#messages {
  height: 180px;
  overflow-y: auto;
  background: #080808;
  border-radius: 9px;
  padding: 10px;
}

.message {
  padding: 7px 0;
  border-bottom: 1px solid #202020;
}

.message strong {
  color: #ff1744;
}

.chat-input {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.chat-input input {
  flex: 1;
  background: #222;
  color: white;
  border: 1px solid #333;
  border-radius: 9px;
  padding: 12px;
  outline: none;
}

.reactions {
  margin-top: 15px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.reactions button {
  font-size: 20px;
  padding: 8px 12px;
}

.notice {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  background: #222;
  color: white;
  padding: 12px 18px;
  border-radius: 10px;
  display: none;
  z-index: 100;
  max-width: 90%;
  text-align: center;
}

@media (max-width: 600px) {

  main {
    padding: 10px;
  }

  .logo {
    font-size: 18px;
  }

  #localVideo {
    width: 120px;
    height: 80px;
    right: 8px;
    bottom: 8px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    EPHPHAVORA <span>LIVE</span>
  </div>

  <a class="back" href="index.html">
    ← Back
  </a>

</header>

<main>

  <div class="live-header">

    <div class="live-title">
      Live Stream
    </div>

    <div
      id="liveBadge"
      class="live-badge"
    >
      🔴 LIVE
    </div>

  </div>

  <div class="video-area">

    <video
      id="remoteVideo"
      autoplay
      playsinline
      controls
    ></video>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>

    <div
      id="emptyMessage"
      class="empty-message"
    >
      Ready to go LIVE
    </div>

  </div>

  <div class="controls">

    <button
      id="goLiveBtn"
      class="go-live"
    >
      🔴 GO LIVE
    </button>

    <button
      id="joinBtn"
      class="join-live"
      style="display:none"
    >
      ▶ JOIN LIVE
    </button>

    <button
      id="cameraBtn"
      style="display:none"
    >
      📷 Camera
    </button>

    <button
      id="micBtn"
      style="display:none"
    >
      🎤 Mic
    </button>

    <button
      id="shareBtn"
      style="display:none"
    >
      🔗 Share LIVE
    </button>

    <button
      id="endBtn"
      class="end-live"
    >
      ⛔ END LIVE
    </button>

  </div>

  <div
    id="status"
    class="status"
  >
    Loading...
  </div>

  <div
    id="roomInfo"
    class="room-info"
  >

    <div>
      Room:
      <strong id="roomNameDisplay"></strong>
    </div>

    <div class="viewer-count">
      👥 Viewers:
      <span id="viewerCount">0</span>
    </div>

  </div>

  <div class="chat-section">

    <h3>💬 LIVE Chat</h3>

    <div id="messages"></div>

    <div class="chat-input">

      <input
        id="chatInput"
        type="text"
        maxlength="300"
        placeholder="Write a message..."
      >

      <button id="sendChatBtn">
        Send
      </button>

    </div>

  </div>

  <div class="reactions">

    <button onclick="sendReaction('❤️')">
      ❤️
    </button>

    <button onclick="sendReaction('🔥')">
      🔥
    </button>

    <button onclick="sendReaction('👏')">
      👏
    </button>

    <button onclick="sendReaction('🙏')">
      🙏
    </button>

    <button onclick="sendReaction('🎉')">
      🎉
    </button>

  </div>

</main>

<div
  id="notice"
  class="notice"
></div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const LIVEKIT_URL =
  "wss://ephphavora-wciizjcm.livekit.cloud";

/*
  KEEP YOUR CURRENT WORKING TOKEN SERVER ID.
*/
const TOKEN_SERVER_ID =
  "ephphavora-16wbwu";


/* =========================================================
   ELEMENTS
========================================================= */

const goLiveBtn =
  document.getElementById("goLiveBtn");

const joinBtn =
  document.getElementById("joinBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const micBtn =
  document.getElementById("micBtn");

const shareBtn =
  document.getElementById("shareBtn");

const endBtn =
  document.getElementById("endBtn");

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const emptyMessage =
  document.getElementById("emptyMessage");

const statusEl =
  document.getElementById("status");

const liveBadge =
  document.getElementById("liveBadge");

const roomInfo =
  document.getElementById("roomInfo");

const roomNameDisplay =
  document.getElementById("roomNameDisplay");

const viewerCount =
  document.getElementById("viewerCount");

const messages =
  document.getElementById("messages");

const chatInput =
  document.getElementById("chatInput");

const sendChatBtn =
  document.getElementById("sendChatBtn");

const notice =
  document.getElementById("notice");


/* =========================================================
   STATE
========================================================= */

let room = null;

let currentUser = null;

let currentRoomName = null;

let currentStreamId = null;

let isHost = false;

let cameraEnabled = false;

let micEnabled = false;


/* =========================================================
   HELPERS
========================================================= */

function setStatus(message) {

  statusEl.textContent =
    message;

  console.log(
    "[EPHPHAVORA LIVE]",
    message
  );

}


function showNotice(message) {

  notice.textContent =
    message;

  notice.style.display =
    "block";

  setTimeout(() => {

    notice.style.display =
      "none";

  }, 3500);

}


/* =========================================================
   HOST AUTH
========================================================= */

async function loadHostUser() {

  const accessToken =
    localStorage.getItem(
      "berakah_access_token"
    );

  if (!accessToken) {

    return null;

  }

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/auth/v1/user",

        {

          headers: {

            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              accessToken

          }

        }

      );

    if (!response.ok) {

      return null;

    }

    const authUser =
      await response.json();

    return {

      userId:
        authUser.id,

      username:
        localStorage.getItem(
          "berakah_username"
        ) ||
        authUser.email ||
        "EPHPHAVORA User",

      email:
        authUser.email || ""

    };

  } catch (error) {

    console.error(
      error
    );

    return null;

  }

}


/* =========================================================
   TOKEN SOURCE
========================================================= */

function getTokenSource() {

  return LivekitClient
    .TokenSource
    .developmentTokenServer(
      TOKEN_SERVER_ID
    );

}


/* =========================================================
   GET LIVEKIT TOKEN
========================================================= */

async function getLiveKitToken(
  roomName,
  participantName,
  participantIdentity
) {

  const tokenSource =
    getTokenSource();

  const result =
    await tokenSource.fetch({

      roomName:
        roomName,

      participantName:
        participantName,

      participantIdentity:
        participantIdentity

    });

  return result;

}


/* =========================================================
   START HOST LIVE
========================================================= */

async function startLive() {

  currentUser =
    await loadHostUser();

  if (!currentUser) {

    showNotice(
      "Please log in to start a LIVE."
    );

    setStatus(
      "Login required to host."
    );

    return;

  }

  try {

    isHost = true;

    goLiveBtn.disabled =
      true;

    setStatus(
      "Creating LIVE room..."
    );

    currentRoomName =
      "ephphavora-" +
      crypto.randomUUID();

    roomNameDisplay.textContent =
      currentRoomName;

    const credentials =
      await getLiveKitToken(

        currentRoomName,

        currentUser.username,

        currentUser.userId

      );

    room =
      new LivekitClient.Room({
        adaptiveStream: true,
        dynacast: true
      });

    setupRoomListeners();

    await room.connect(

      credentials.serverUrl ||
      LIVEKIT_URL,

      credentials.participantToken

    );

    await room.localParticipant
      .setCameraEnabled(true);

    await room.localParticipant
      .setMicrophoneEnabled(true);

    cameraEnabled = true;

    micEnabled = true;

    attachLocalVideo();

    await createLiveStream();

    showHostUI();

    setStatus(
      "🔴 You are LIVE!"
    );

    showNotice(
      "EPHPHAVORA LIVE started!"
    );

  } catch (error) {

    console.error(
      "START LIVE ERROR:",
      error
    );

    goLiveBtn.disabled =
      false;

    isHost = false;

    setStatus(
      "LIVE error: " +
      (
        error.message ||
        error
      )
    );

  }

}


/* =========================================================
   CREATE SUPABASE STREAM
========================================================= */

async function createLiveStream() {

  if (!currentUser) return;

  const accessToken =
    localStorage.getItem(
      "berakah_access_token"
    );

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/live_streams",

        {

          method: "POST",

          headers: {

            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              accessToken,

            "Content-Type":
              "application/json",

            Prefer:
              "return=representation"

          },

          body:
            JSON.stringify({

              host_user_id:
                currentUser.userId,

              room_name:
                currentRoomName,

              title:
                "EPHPHAVORA LIVE",

              status:
                "live"

            })

        }

      );

    if (!response.ok) {

      console.error(
        await response.text()
      );

      return;

    }

    const data =
      await response.json();

    if (
      data &&
      data.length
    ) {

      currentStreamId =
        data[0].id;

    }

  } catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   FIND LIVE STREAM
========================================================= */

async function findLiveStream() {

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/live_streams" +
        "?status=eq.live" +
        "&order=started_at.desc" +
        "&limit=1",

        {

          headers: {

            apikey:
              SUPABASE_KEY

          }

        }

      );

    if (!response.ok) {

      throw new Error(
        "Could not find LIVE."
      );

    }

    const data =
      await response.json();

    if (
      !data ||
      !data.length
    ) {

      return null;

    }

    return data[0];

  } catch (error) {

    console.error(
      error
    );

    return null;

  }

}


/* =========================================================
   VIEWER JOIN
========================================================= */

async function joinLive(
  roomName
) {

  try {

    isHost = false;

    /*
      VIEWERS DO NOT NEED
      TO BE LOGGED IN.
    */

    const viewerIdentity =
      "viewer-" +
      crypto.randomUUID();

    const viewerName =
      "Viewer-" +
      Math.floor(
        Math.random() * 100000
      );

    currentRoomName =
      roomName;

    roomNameDisplay.textContent =
      roomName;

    setStatus(
      "Joining EPHPHAVORA LIVE..."
    );

    const credentials =
      await getLiveKitToken(

        roomName,

        viewerName,

        viewerIdentity

      );

    room =
      new LivekitClient.Room({

        adaptiveStream: true,

        dynacast: true

      });

    setupRoomListeners();

    await room.connect(

      credentials.serverUrl ||
      LIVEKIT_URL,

      credentials.participantToken

    );

    roomInfo.style.display =
      "block";

    emptyMessage.style.display =
      "none";

    liveBadge.style.display =
      "block";

    setStatus(
      "🟢 You are watching LIVE."
    );

    showViewerUI();

    updateViewerCount();

  } catch (error) {

    console.error(
      "VIEWER JOIN ERROR:",
      error
    );

    setStatus(
      "Viewer error: " +
      (
        error.message ||
        error
      )
    );

    showNotice(
      "Could not join this LIVE."
    );

  }

}


/* =========================================================
   ROOM EVENTS
========================================================= */

function setupRoomListeners() {

  room.on(

    LivekitClient.RoomEvent
      .TrackSubscribed,

    (
      track,
      publication,
      participant
    ) => {

      console.log(
        "HOST TRACK RECEIVED:",
        track.kind,
        participant.identity
      );

      if (
        track.kind ===
        LivekitClient.Track.Kind.Video
      ) {

        track.attach(
          remoteVideo
        );

        remoteVideo.style.display =
          "block";

        emptyMessage.style.display =
          "none";

      }

      if (
        track.kind ===
        LivekitClient.Track.Kind.Audio
      ) {

        track.attach();

      }

    }

  );


  room.on(

    LivekitClient.RoomEvent
      .TrackUnsubscribed,

    track => {

      track.detach();

    }

  );


  room.on(

    LivekitClient.RoomEvent
      .ParticipantConnected,

    participant => {

      console.log(
        "Participant connected:",
        participant.identity
      );

      updateViewerCount();

    }

  );


  room.on(

    LivekitClient.RoomEvent
      .ParticipantDisconnected,

    participant => {

      console.log(
        "Participant disconnected:",
        participant.identity
      );

      updateViewerCount();

    }

  );


  room.on(

    LivekitClient.RoomEvent
      .DataReceived,

    payload => {

      try {

        const text =
          new TextDecoder()
            .decode(payload);

        const data =
          JSON.parse(text);

        if (
          data.type ===
          "chat"
        ) {

          addMessage(

            data.username,

            data.message

          );

        }

        if (
          data.type ===
          "reaction"
        ) {

          showNotice(

            data.emoji +
            " " +
            data.username

          );

        }

      } catch (error) {

        console.error(
          error
        );

      }

    }

  );


  room.on(

    LivekitClient.RoomEvent
      .Disconnected,

    () => {

      updateViewerCount();

    }

  );

}


/* =========================================================
   HOST UI
========================================================= */

function showHostUI() {

  goLiveBtn.style.display =
    "none";

  joinBtn.style.display =
    "none";

  cameraBtn.style.display =
    "inline-block";

  micBtn.style.display =
    "inline-block";

  shareBtn.style.display =
    "inline-block";

  endBtn.style.display =
    "inline-block";

  liveBadge.style.display =
    "block";

  roomInfo.style.display =
    "block";

  emptyMessage.style.display =
    "none";

  updateControls();

}


/* =========================================================
   VIEWER UI
========================================================= */

function showViewerUI() {

  goLiveBtn.style.display =
    "none";

  joinBtn.style.display =
    "none";

  cameraBtn.style.display =
    "none";

  micBtn.style.display =
    "none";

  shareBtn.style.display =
    "inline-block";

  endBtn.style.display =
    "none";

  liveBadge.style.display =
    "block";

  roomInfo.style.display =
    "block";

}


/* =========================================================
   LOCAL VIDEO
========================================================= */

function attachLocalVideo() {

  if (!room) return;

  const publication =
    room.localParticipant
      .getTrackPublication(
        LivekitClient.Track.Source.Camera
      );

  if (
    publication &&
    publication.track
  ) {

    publication.track.attach(
      localVideo
    );

    localVideo.style.display =
      "block";

  }

}


/* =========================================================
   CAMERA
========================================================= */

async function toggleCamera() {

  if (!room || !isHost)
    return;

  cameraEnabled =
    !cameraEnabled;

  await room.localParticipant
    .setCameraEnabled(
      cameraEnabled
    );

  if (cameraEnabled) {

    attachLocalVideo();

  } else {

    localVideo.style.display =
      "none";

  }

  updateControls();

}


/* =========================================================
   MIC
========================================================= */

async function toggleMic() {

  if (!room || !isHost)
    return;

  micEnabled =
    !micEnabled;

  await room.localParticipant
    .setMicrophoneEnabled(
      micEnabled
    );

  updateControls();

}


/* =========================================================
   CONTROLS
========================================================= */

function updateControls() {

  cameraBtn.textContent =
    cameraEnabled
      ? "📷 Camera ON"
      : "📷 Camera OFF";

  micBtn.textContent =
    micEnabled
      ? "🎤 Mic ON"
      : "🎤 Mic OFF";

}


/* =========================================================
   VIEWER COUNT
========================================================= */

function updateViewerCount() {

  if (!room) {

    viewerCount.textContent =
      "0";

    return;

  }

  viewerCount.textContent =
    String(
      room.remoteParticipants.size
    );

}


/* =========================================================
   SHARE
========================================================= */

async function shareLive() {

  if (!currentRoomName) {

    showNotice(
      "No LIVE available."
    );

    return;

  }

  const url =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(
      currentRoomName
    );

  try {

    if (
      navigator.share
    ) {

      await navigator.share({

        title:
          "EPHPHAVORA LIVE",

        text:
          "Join my EPHPHAVORA LIVE",

        url:
          url

      });

    } else {

      await navigator.clipboard
        .writeText(url);

      showNotice(
        "LIVE link copied!"
      );

    }

  } catch (error) {

    console.log(
      "Share cancelled."
    );

  }

}


/* =========================================================
   CHAT
========================================================= */

async function sendChat() {

  const message =
    chatInput.value.trim();

  if (!message)
    return;

  if (!room) {

    showNotice(
      "Join a LIVE first."
    );

    return;

  }

  const username =
    currentUser?.username ||
    "Viewer";

  const data = {

    type:
      "chat",

    username:
      username,

    message:
      message

  };

  try {

    const payload =
      new TextEncoder()
        .encode(
          JSON.stringify(data)
        );

    await room.localParticipant
      .publishData(

        payload,

        {
          reliable: true
        }

      );

    addMessage(
      username,
      message
    );

    chatInput.value =
      "";

  } catch (error) {

    console.error(
      error
    );

  }

}


function addMessage(
  username,
  message
) {

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message";

  const strong =
    document.createElement(
      "strong"
    );

  strong.textContent =
    username + ":";

  div.appendChild(
    strong
  );

  div.appendChild(
    document.createTextNode(
      " " + message
    )
  );

  messages.appendChild(
    div
  );

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================================================
   REACTION
========================================================= */

async function sendReaction(
  emoji
) {

  if (!room) {

    showNotice(
      "Join a LIVE first."
    );

    return;

  }

  const data = {

    type:
      "reaction",

    username:
      currentUser?.username ||
      "Viewer",

    emoji:
      emoji

  };

  try {

    const payload =
      new TextEncoder()
        .encode(
          JSON.stringify(data)
        );

    await room.localParticipant
      .publishData(

        payload,

        {
          reliable: true
        }

      );

    showNotice(
      emoji
    );

  } catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   END LIVE
========================================================= */

async function endLive() {

  if (!isHost)
    return;

  try {

    if (currentStreamId) {

      const accessToken =
        localStorage.getItem(
          "berakah_access_token"
        );

      await fetch(

        SUPABASE_URL +
        "/rest/v1/live_streams?id=eq." +
        encodeURIComponent(
          currentStreamId
        ),

        {

          method:
            "PATCH",

          headers: {

            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              accessToken,

            "Content-Type":
              "application/json",

            Prefer:
              "return=minimal"

          },

          body:
            JSON.stringify({

              status:
                "ended",

              ended_at:
                new Date()
                  .toISOString()

            })

        }

      );

    }

    if (room) {

      await room.disconnect();

    }

    room = null;

    currentStreamId =
      null;

    currentRoomName =
      null;

    isHost =
      false;

    liveBadge.style.display =
      "none";

    roomInfo.style.display =
      "none";

    localVideo.style.display =
      "none";

    remoteVideo.srcObject =
      null;

    emptyMessage.style.display =
      "flex";

    goLiveBtn.style.display =
      "inline-block";

    goLiveBtn.disabled =
      false;

    cameraBtn.style.display =
      "none";

    micBtn.style.display =
      "none";

    shareBtn.style.display =
      "none";

    endBtn.style.display =
      "none";

    setStatus(
      "LIVE ended."
    );

    showNotice(
      "LIVE ended."
    );

  } catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   BUTTONS
========================================================= */

goLiveBtn.addEventListener(
  "click",
  startLive
);

joinBtn.addEventListener(
  "click",
  async () => {

    const stream =
      await findLiveStream();

    if (!stream) {

      showNotice(
        "No LIVE stream is currently available."
      );

      return;

    }

    await joinLive(
      stream.room_name
    );

  }
);

cameraBtn.addEventListener(
  "click",
  toggleCamera
);

micBtn.addEventListener(
  "click",
  toggleMic
);

shareBtn.addEventListener(
  "click",
  shareLive
);

endBtn.addEventListener(
  "click",
  endLive
);

sendChatBtn.addEventListener(
  "click",
  sendChat
);

chatInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      sendChat();

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const sharedRoom =
    params.get("room");

  /*
    SHARED LINK:
    NO LOGIN REQUIRED.
  */

  if (sharedRoom) {

    goLiveBtn.style.display =
      "none";

    joinBtn.style.display =
      "inline-block";

    setStatus(
      "LIVE link detected. Joining..."
    );

    /*
      Automatically join.
    */

    await joinLive(
      sharedRoom
    );

    return;

  }

  /*
    NORMAL HOST PAGE.
  */

  currentUser =
    await loadHostUser();

  if (currentUser) {

    setStatus(
      "Logged in as " +
      currentUser.username
    );

  } else {

    setStatus(
      "Log in to start a LIVE."
    );

  }

}

initialize();

</script>
