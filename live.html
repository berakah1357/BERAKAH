<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPHPHAVORA LIVE</title>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:white;
}

header{
  height:64px;
  background:#111118;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #25252f;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.live-title{
  color:#ff3040;
}

.back{
  color:white;
  text-decoration:none;
  background:#24242d;
  padding:9px 14px;
  border-radius:8px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.status{
  text-align:center;
  padding:12px;
  margin-bottom:15px;
  background:#171720;
  border-radius:10px;
  color:#bbb;
}

.video-area{
  position:relative;
  width:100%;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  min-height:420px;
}

#videoGrid{
  width:100%;
  min-height:420px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:4px;
  background:#000;
}

.video-tile{
  position:relative;
  min-height:300px;
  background:#111;
  overflow:hidden;
}

.video-tile video{
  width:100%;
  height:100%;
  min-height:300px;
  object-fit:cover;
  display:block;
}

.name-label{
  position:absolute;
  bottom:10px;
  left:10px;
  background:rgba(0,0,0,.65);
  padding:6px 10px;
  border-radius:7px;
  font-size:13px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:18px;
}

button{
  border:0;
  padding:12px 18px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}

#goLiveBtn{
  background:#ff3040;
  color:white;
}

.control{
  background:#292933;
  color:white;
}

#shareBtn{
  background:#2563eb;
  color:white;
}

#endBtn{
  background:#8b111b;
  color:white;
}

#subscribeBtn{
  background:#f59e0b;
  color:white;
  min-width:150px;
}

#subscribeBtn.subscribed{
  background:#16a34a;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:18px;
  flex-wrap:wrap;
}

.card{
  flex:1;
  min-width:140px;
  background:#171720;
  border-radius:10px;
  padding:15px;
  text-align:center;
}

.card-number{
  font-size:24px;
  font-weight:bold;
}

.card-label{
  color:#aaa;
  margin-top:5px;
}

.creator-box{
  margin-top:18px;
  background:#171720;
  border-radius:12px;
  padding:18px;
  text-align:center;
}

.creator-name{
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.creator-subtitle{
  color:#aaa;
  margin-bottom:14px;
}

.share-box{
  display:none;
  margin-top:18px;
  background:#171720;
  border-radius:10px;
  padding:15px;
}

.share-title{
  font-weight:bold;
  margin-bottom:8px;
}

#shareLink{
  width:100%;
  padding:11px;
  border:0;
  border-radius:7px;
  background:#25252f;
  color:white;
  margin-bottom:10px;
}

#message{
  margin-top:18px;
  padding:14px;
  background:#171720;
  border-radius:10px;
  display:none;
  color:#ffb8bd;
}

/* CHAT */

.chat-box{
  margin-top:20px;
  background:#171720;
  border-radius:12px;
  padding:15px;
}

.chat-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.chat-messages{
  height:260px;
  overflow-y:auto;
  background:#0f0f15;
  border-radius:9px;
  padding:10px;
}

.chat-empty{
  color:#777;
  text-align:center;
  padding:30px 10px;
}

.chat-message{
  margin-bottom:10px;
  padding:9px 11px;
  background:#25252f;
  border-radius:9px;
  word-wrap:break-word;
}

.chat-name{
  font-weight:bold;
  color:#8db8ff;
  margin-bottom:3px;
}

.chat-text{
  color:white;
  line-height:1.4;
}

.chat-input-row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

#chatInput{
  flex:1;
  min-width:0;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#25252f;
  color:white;
  font-size:15px;
  outline:none;
}

#chatInput::placeholder{
  color:#888;
}

#sendChatBtn{
  background:#2563eb;
  color:white;
  min-width:90px;
}

/* REACTIONS */

.reaction-box{
  margin-top:20px;
  background:#171720;
  border-radius:12px;
  padding:15px;
  text-align:center;
}

.reaction-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.reaction-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.reaction-btn{
  background:#25252f;
  color:white;
  font-size:28px;
  width:62px;
  height:52px;
  padding:0;
  border-radius:12px;
}

#reactionArea{
  position:fixed;
  right:20px;
  bottom:90px;
  width:100px;
  height:300px;
  pointer-events:none;
  z-index:100;
  overflow:hidden;
}

.floating-reaction{
  position:absolute;
  bottom:0;
  font-size:38px;
  animation:floatReaction 2.2s ease-out forwards;
}

@keyframes floatReaction{
  0%{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  100%{
    opacity:0;
    transform:translateY(-280px) scale(1.5);
  }
}

@media(max-width:600px){

  .container{
    padding:10px;
  }

  .video-area,
  #videoGrid{
    min-height:330px;
  }

  .video-tile{
    min-height:280px;
  }

  .video-tile video{
    min-height:280px;
  }

  button{
    flex:1 1 140px;
  }

  .chat-input-row{
    flex-direction:column;
  }

  #sendChatBtn{
    width:100%;
  }

  .reaction-btn{
    width:58px;
    height:50px;
  }

  #reactionArea{
    right:5px;
    bottom:70px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    EPHPHAVORA
    <span class="live-title">🔴 LIVE</span>
  </div>

  <a class="back" href="feed.html">
    ← Feed
  </a>

</header>

<div class="container">

  <div id="status" class="status">
    Ready to go live.
  </div>

  <div class="video-area">
    <div id="videoGrid"></div>
  </div>

  <div class="controls">

    <button id="goLiveBtn">
      🔴 GO LIVE
    </button>

    <button
      id="cameraBtn"
      class="control"
      disabled
    >
      📷 Camera ON
    </button>

    <button
      id="micBtn"
      class="control"
      disabled
    >
      🎤 Mic ON
    </button>

    <button
      id="shareBtn"
      class="control"
      disabled
    >
      🔗 SHARE LIVE
    </button>

    <button
      id="endBtn"
      disabled
    >
      🛑 END LIVE
    </button>

  </div>

  <!-- CREATOR / SUBSCRIBE -->

  <div
    id="creatorBox"
    class="creator-box"
    style="display:none;"
  >

    <div
      id="creatorName"
      class="creator-name"
    >
      EPHPHAVORA Creator
    </div>

    <div class="creator-subtitle">
      Follow this creator and stay connected.
    </div>

    <button
      id="subscribeBtn"
      disabled
    >
      ⭐ SUBSCRIBE
    </button>

  </div>

  <div class="info">

    <div class="card">

      <div
        id="viewerCount"
        class="card-number"
      >
        0
      </div>

      <div class="card-label">
        Viewers
      </div>

    </div>

    <div class="card">

      <div
        id="subscriberCount"
        class="card-number"
      >
        0
      </div>

      <div class="card-label">
        Subscribers
      </div>

    </div>

    <div class="card">

      <div
        id="liveStatus"
        class="card-number"
      >
        OFF
      </div>

      <div class="card-label">
        Live Status
      </div>

    </div>

  </div>

  <div
    id="message"
  ></div>

  <!-- SHARE -->

  <div
    id="shareBox"
    class="share-box"
  >

    <div class="share-title">
      🔗 Share this LIVE
    </div>

    <input
      id="shareLink"
      readonly
    >

    <button
      id="copyBtn"
      class="control"
    >
      📋 COPY LINK
    </button>

  </div>

  <!-- CHAT -->

  <div class="chat-box">

    <div class="chat-title">
      💬 LIVE CHAT
    </div>

    <div
      id="chatMessages"
      class="chat-messages"
    >

      <div
        class="chat-empty"
        id="chatEmpty"
      >
        No comments yet.
      </div>

    </div>

    <div class="chat-input-row">

      <input
        id="chatInput"
        type="text"
        maxlength="200"
        placeholder="Write a comment..."
      >

      <button
        id="sendChatBtn"
        class="control"
        disabled
      >
        SEND
      </button>

    </div>

  </div>

  <!-- REACTIONS -->

  <div class="reaction-box">

    <div class="reaction-title">
      ❤️ LIVE REACTIONS
    </div>

    <div class="reaction-buttons">

      <button
        class="reaction-btn"
        data-reaction="❤️"
        disabled
      >
        ❤️
      </button>

      <button
        class="reaction-btn"
        data-reaction="👍"
        disabled
      >
        👍
      </button>

      <button
        class="reaction-btn"
        data-reaction="🔥"
        disabled
      >
        🔥
      </button>

      <button
        class="reaction-btn"
        data-reaction="😂"
        disabled
      >
        😂
      </button>

    </div>

  </div>

</div>

<div id="reactionArea"></div>

<script>

/* =========================================================
   EPHPHAVORA CONFIGURATION
========================================================= */

const LIVEKIT_URL =
  "wss://ephphavora-wciizjcm.livekit.cloud";

const LIVEKIT_TOKEN_SERVER_ID =
  "ephphavora-16wbwu";

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const ACCESS_TOKEN_KEY =
  "berakah_access_token";

const USERNAME_KEY =
  "berakah_username";

const USER_KEY =
  "berakah_user";

const AUTH_USER_ID_KEY =
  "berakah_auth_user_id";


/* =========================================================
   STATE
========================================================= */

let room = null;

let cameraOn = true;
let micOn = true;

let currentRoomName = null;

let creatorId = null;

let isViewer = false;


/* =========================================================
   ELEMENTS
========================================================= */

const statusEl =
  document.getElementById("status");

const messageEl =
  document.getElementById("message");

const videoGrid =
  document.getElementById("videoGrid");

const goLiveBtn =
  document.getElementById("goLiveBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const micBtn =
  document.getElementById("micBtn");

const shareBtn =
  document.getElementById("shareBtn");

const endBtn =
  document.getElementById("endBtn");

const viewerCount =
  document.getElementById("viewerCount");

const subscriberCount =
  document.getElementById("subscriberCount");

const liveStatus =
  document.getElementById("liveStatus");

const shareBox =
  document.getElementById("shareBox");

const shareLink =
  document.getElementById("shareLink");

const copyBtn =
  document.getElementById("copyBtn");

const creatorBox =
  document.getElementById("creatorBox");

const creatorName =
  document.getElementById("creatorName");

const subscribeBtn =
  document.getElementById("subscribeBtn");

const chatMessages =
  document.getElementById("chatMessages");

const chatEmpty =
  document.getElementById("chatEmpty");

const chatInput =
  document.getElementById("chatInput");

const sendChatBtn =
  document.getElementById("sendChatBtn");

const reactionArea =
  document.getElementById("reactionArea");

const reactionButtons =
  document.querySelectorAll(".reaction-btn");


/* =========================================================
   USER
========================================================= */

function getUserInfo(){

  const username =
    localStorage.getItem(USERNAME_KEY) ||
    localStorage.getItem(USER_KEY);

  const userId =
    localStorage.getItem(AUTH_USER_ID_KEY);

  return {

    username:
      username ||
      "EPHPHAVORA User",

    userId:
      userId ||
      null

  };
}


/* =========================================================
   SUPABASE
========================================================= */

function getAccessToken(){

  return localStorage.getItem(
    ACCESS_TOKEN_KEY
  );
}


async function supabaseFetch(
  path,
  options = {}
){

  const token =
    getAccessToken();

  const headers = {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      `Bearer ${token}`,

    ...(options.headers || {})

  };

  return fetch(
    `${SUPABASE_URL}${path}`,
    {
      ...options,
      headers
    }
  );
}


/* =========================================================
   MESSAGES
========================================================= */

function showMessage(text){

  messageEl.style.display =
    "block";

  messageEl.textContent =
    text;
}


function clearMessage(){

  messageEl.style.display =
    "none";

  messageEl.textContent =
    "";
}


/* =========================================================
   ROOM
========================================================= */

function createHostRoomName(){

  const user =
    getUserInfo();

  if(!user.userId){

    throw new Error(
      "Please log in before starting LIVE."
    );

  }

  return (
    "ephphavora-live-" +
    user.userId
  );
}


function getRoomFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("room");
}


/*
   The host room name is:

   ephphavora-live-USER_UUID

   This lets us identify the creator.
*/

function getCreatorIdFromRoom(
  roomName
){

  if(!roomName){
    return null;
  }

  const prefix =
    "ephphavora-live-";

  if(
    !roomName.startsWith(prefix)
  ){
    return null;
  }

  return roomName.substring(
    prefix.length
  );
}


/* =========================================================
   LIVEKIT TOKEN
========================================================= */

async function getConnectionDetails(
  roomName
){

  const user =
    getUserInfo();

  const tokenSource =
    LivekitClient.TokenSource
      .developmentTokenServer(
        LIVEKIT_TOKEN_SERVER_ID
      );

  return tokenSource.fetch({

    roomName:
      roomName,

    participantName:
      user.username,

    participantIdentity:
      user.userId ||
      crypto.randomUUID()

  });
}


/* =========================================================
   VIDEO
========================================================= */

function addVideoTrack(
  track,
  participant,
  isLocal
){

  const existing =
    videoGrid.querySelector(
      `[data-identity="${CSS.escape(
        participant.identity
      )}"]`
    );

  if(existing){
    existing.remove();
  }

  const tile =
    document.createElement("div");

  tile.className =
    "video-tile";

  tile.dataset.identity =
    participant.identity;

  const videoElement =
    track.attach();

  videoElement.autoplay =
    true;

  videoElement.playsInline =
    true;

  videoElement.muted =
    isLocal;

  tile.appendChild(
    videoElement
  );

  const name =
    document.createElement("div");

  name.className =
    "name-label";

  name.textContent =
    isLocal
      ? "You"
      : (
        participant.name ||
        participant.identity
      );

  tile.appendChild(
    name
  );

  videoGrid.appendChild(
    tile
  );
}


function removeParticipant(
  participant
){

  const tiles =
    videoGrid.querySelectorAll(
      ".video-tile"
    );

  tiles.forEach(tile => {

    if(
      tile.dataset.identity ===
      participant.identity
    ){

      tile.remove();

    }

  });
}


function updateViewerCount(){

  if(!room){

    viewerCount.textContent =
      "0";

    return;
  }

  viewerCount.textContent =
    String(
      room.remoteParticipants.size
    );
}


/* =========================================================
   SHARE
========================================================= */

function showShareLink(){

  if(!currentRoomName){
    return;
  }

  const url =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(
      currentRoomName
    );

  shareLink.value =
    url;

  shareBox.style.display =
    "block";

  shareBtn.disabled =
    false;
}


/* =========================================================
   SUBSCRIBERS
========================================================= */

async function loadSubscriberCount(){

  if(!creatorId){
    return;
  }

  try{

    const response =
      await supabaseFetch(
        `/rest/v1/live_subscribers?select=id&creator_id=eq.${encodeURIComponent(
          creatorId
        )}`
      );

    if(!response.ok){

      console.error(
        "SUBSCRIBER COUNT ERROR:",
        await response.text()
      );

      return;
    }

    const rows =
      await response.json();

    subscriberCount.textContent =
      String(rows.length);

  }catch(error){

    console.error(
      "SUBSCRIBER COUNT ERROR:",
      error
    );

  }
}


async function checkSubscription(){

  const user =
    getUserInfo();

  if(
    !user.userId ||
    !creatorId ||
    user.userId === creatorId
  ){

    subscribeBtn.style.display =
      user.userId === creatorId
        ? "none"
        : "inline-block";

    return;
  }

  try{

    const response =
      await supabaseFetch(
        `/rest/v1/live_subscribers?select=id&creator_id=eq.${encodeURIComponent(
          creatorId
        )}&subscriber_id=eq.${encodeURIComponent(
          user.userId
        )}&limit=1`
      );

    if(!response.ok){
      return;
    }

    const rows =
      await response.json();

    if(rows.length){

      subscribeBtn.textContent =
        "✅ SUBSCRIBED";

      subscribeBtn.classList.add(
        "subscribed"
      );

    }else{

      subscribeBtn.textContent =
        "⭐ SUBSCRIBE";

      subscribeBtn.classList.remove(
        "subscribed"
      );

    }

  }catch(error){

    console.error(
      "SUBSCRIPTION CHECK ERROR:",
      error
    );

  }
}


async function toggleSubscribe(){

  const user =
    getUserInfo();

  if(!user.userId){

    showMessage(
      "Please log in to subscribe."
    );

    return;
  }

  if(!creatorId){

    showMessage(
      "Creator information is unavailable."
    );

    return;
  }

  if(user.userId === creatorId){

    return;
  }

  try{

    subscribeBtn.disabled =
      true;

    const checkResponse =
      await supabaseFetch(
        `/rest/v1/live_subscribers?select=id&creator_id=eq.${encodeURIComponent(
          creatorId
        )}&subscriber_id=eq.${encodeURIComponent(
          user.userId
        )}&limit=1`
      );

    const existing =
      checkResponse.ok
        ? await checkResponse.json()
        : [];

    if(existing.length){

      const deleteResponse =
        await supabaseFetch(
          `/rest/v1/live_subscribers?id=eq.${encodeURIComponent(
            existing[0].id
          )}`,
          {
            method:"DELETE"
          }
        );

      if(!deleteResponse.ok){

        showMessage(
          "Could not unsubscribe."
        );

        return;
      }

      subscribeBtn.textContent =
        "⭐ SUBSCRIBE";

      subscribeBtn.classList.remove(
        "subscribed"
      );

    }else{

      const insertResponse =
        await supabaseFetch(
          "/rest/v1/live_subscribers",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json",
              "Prefer":
                "return=minimal"
            },
            body:JSON.stringify({

              creator_id:
                creatorId,

              subscriber_id:
                user.userId

            })
          }
        );

      if(!insertResponse.ok){

        console.error(
          "SUBSCRIBE ERROR:",
          await insertResponse.text()
        );

        showMessage(
          "Could not subscribe."
        );

        return;
      }

      subscribeBtn.textContent =
        "✅ SUBSCRIBED";

      subscribeBtn.classList.add(
        "subscribed"
      );

    }

    await loadSubscriberCount();

  }catch(error){

    console.error(
      "TOGGLE SUBSCRIBE ERROR:",
      error
    );

    showMessage(
      "Could not update subscription."
    );

  }finally{

    subscribeBtn.disabled =
      false;

  }

}


subscribeBtn.addEventListener(
  "click",
  toggleSubscribe
);


/* =========================================================
   CREATOR
========================================================= */

async function loadCreator(){

  if(!creatorId){
    return;
  }

  creatorBox.style.display =
    "block";

  subscribeBtn.disabled =
    false;

  try{

    const response =
      await supabaseFetch(
        `/rest/v1/profiles?select=username,"Full name"&user_id=eq.${encodeURIComponent(
          creatorId
        )}&limit=1`
      );

    if(response.ok){

      const data =
        await response.json();

      if(data.length){

        const creator =
          data[0];

        creatorName.textContent =
          creator["Full name"] ||
          creator.username ||
          "EPHPHAVORA Creator";

      }

    }

  }catch(error){

    console.error(
      "CREATOR LOAD ERROR:",
      error
    );

  }

  await loadSubscriberCount();
  await checkSubscription();
}


/* =========================================================
   CHAT
========================================================= */

function addChatMessage(
  username,
  text
){

  if(chatEmpty){
    chatEmpty.remove();
  }

  const message =
    document.createElement("div");

  message.className =
    "chat-message";

  const name =
    document.createElement("div");

  name.className =
    "chat-name";

  name.textContent =
    username;

  const messageText =
    document.createElement("div");

  messageText.className =
    "chat-text";

  messageText.textContent =
    text;

  message.appendChild(name);
  message.appendChild(messageText);

  chatMessages.appendChild(
    message
  );

  chatMessages.scrollTop =
    chatMessages.scrollHeight;
}


function setupChat(){

  if(!room){
    return;
  }

  room.on(
    LivekitClient.RoomEvent.DataReceived,
    (
      payload,
      participant
    ) => {

      try{

        const decoder =
          new TextDecoder();

        const data =
          JSON.parse(
            decoder.decode(payload)
          );

        if(
          data.type === "chat"
        ){

          addChatMessage(
            data.username ||
            participant?.name ||
            "EPHPHAVORA User",
            data.text
          );

        }

        if(
          data.type === "reaction"
        ){

          showFloatingReaction(
            data.reaction
          );

        }

      }catch(error){

        console.error(
          "LIVE DATA RECEIVE ERROR:",
          error
        );

      }

    }
  );

}


async function sendChatMessage(){

  if(
    !room ||
    !room.localParticipant
  ){
    return;
  }

  const text =
    chatInput.value.trim();

  if(!text){
    return;
  }

  const user =
    getUserInfo();

  const chatData =
    JSON.stringify({

      type:"chat",

      username:
        user.username,

      text:text

    });

  try{

    await room.localParticipant
      .publishData(
        new TextEncoder().encode(
          chatData
        ),
        {
          reliable:true
        }
      );

    addChatMessage(
      user.username,
      text
    );

    chatInput.value =
      "";

  }catch(error){

    console.error(
      "LIVE CHAT SEND ERROR:",
      error
    );

    showMessage(
      "Unable to send comment."
    );

  }

}


sendChatBtn.addEventListener(
  "click",
  sendChatMessage
);


chatInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      sendChatMessage();

    }

  }
);


/* =========================================================
   REACTIONS
========================================================= */

function showFloatingReaction(
  reaction
){

  const element =
    document.createElement("div");

  element.className =
    "floating-reaction";

  element.textContent =
    reaction;

  element.style.left =
    Math.floor(
      Math.random() * 70
    ) + "px";

  reactionArea.appendChild(
    element
  );

  setTimeout(
    () => element.remove(),
    2300
  );
}


async function sendReaction(
  reaction
){

  if(
    !room ||
    !room.localParticipant
  ){
    return;
  }

  const reactionData =
    JSON.stringify({

      type:"reaction",

      reaction:
        reaction

    });

  try{

    await room.localParticipant
      .publishData(
        new TextEncoder().encode(
          reactionData
        ),
        {
          reliable:true
        }
      );

    showFloatingReaction(
      reaction
    );

  }catch(error){

    console.error(
      "REACTION SEND ERROR:",
      error
    );

  }

}


reactionButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        sendReaction(
          button.dataset.reaction
        );

      }
    );

  }
);


function enableReactions(){

  reactionButtons.forEach(
    button => {
      button.disabled = false;
    }
  );

}


function disableReactions(){

  reactionButtons.forEach(
    button => {
      button.disabled = true;
    }
  );

}


/* =========================================================
   ROOM EVENT HANDLERS
========================================================= */

function setupRoomEvents(){

  room.on(
    LivekitClient.RoomEvent.TrackSubscribed,
    (
      track,
      publication,
      participant
    ) => {

      if(
        track.kind ===
        LivekitClient.Track.Kind.Video
      ){

        addVideoTrack(
          track,
          participant,
          false
        );

      }

      updateViewerCount();

    }
  );


  room.on(
    LivekitClient.RoomEvent.TrackUnsubscribed,
    (
      track,
      publication,
      participant
    ) => {

      track.detach();

      removeParticipant(
        participant
      );

      updateViewerCount();

    }
  );


  room.on(
    LivekitClient.RoomEvent.ParticipantConnected,
    () => {

      updateViewerCount();

    }
  );


  room.on(
    LivekitClient.RoomEvent.ParticipantDisconnected,
    participant => {

      removeParticipant(
        participant
      );

      updateViewerCount();

    }
  );


  room.on(
    LivekitClient.RoomEvent.Disconnected,
    () => {

      statusEl.textContent =
        "LIVE ended.";

      liveStatus.textContent =
        "OFF";

      cameraBtn.disabled =
        true;

      micBtn.disabled =
        true;

      shareBtn.disabled =
        true;

      endBtn.disabled =
        true;

      sendChatBtn.disabled =
        true;

      disableReactions();

      if(isViewer){

        goLiveBtn.disabled =
          false;

      }else{

        goLiveBtn.disabled =
          false;

      }

      updateViewerCount();

    }
  );

}


/* =========================================================
   START HOST LIVE
========================================================= */

async function startLive(){

  try{

    clearMessage();

    isViewer =
      false;

    statusEl.textContent =
      "Connecting to EPHPHAVORA LIVE...";

    goLiveBtn.disabled =
      true;

    const user =
      getUserInfo();

    creatorId =
      user.userId;

    if(!creatorId){

      throw new Error(
        "Please log in before starting LIVE."
      );

    }

    const roomName =
      createHostRoomName();

    currentRoomName =
      roomName;

    const connectionDetails =
      await getConnectionDetails(
        roomName
      );

    room =
      new LivekitClient.Room({
        adaptiveStream:true,
        dynacast:true
      });

    setupChat();
    setupRoomEvents();

    await room.connect(
      connectionDetails.serverUrl ||
      LIVEKIT_URL,
      connectionDetails.participantToken
    );

    await room.localParticipant
      .setCameraEnabled(true);

    await room.localParticipant
      .setMicrophoneEnabled(true);

    cameraOn =
      true;

    micOn =
      true;

    cameraBtn.disabled =
      false;

    micBtn.disabled =
      false;

    shareBtn.disabled =
      false;

    endBtn.disabled =
      false;

    sendChatBtn.disabled =
      false;

    enableReactions();

    creatorBox.style.display =
      "block";

    creatorName.textContent =
      "You are the LIVE creator";

    subscribeBtn.style.display =
      "none";

    statusEl.textContent =
      "🔴 You are LIVE on EPHPHAVORA!";

    liveStatus.textContent =
      "LIVE";

    showShareLink();

    updateViewerCount();

    await loadSubscriberCount();

    /*
      Attach the local video after
      the camera is enabled.
    */

    room.localParticipant
      .videoTrackPublications
      .forEach(
        publication => {

          if(publication.track){

            addVideoTrack(
              publication.track,
              room.localParticipant,
              true
            );

          }

        }
      );

  }catch(error){

    console.error(
      "EPHPHAVORA LIVE ERROR:",
      error
    );

    statusEl.textContent =
      "Unable to start LIVE.";

    showMessage(
      error.message ||
      "Something went wrong."
    );

    goLiveBtn.disabled =
      false;

  }

}


/* =========================================================
   JOIN VIEWER LIVE
========================================================= */

async function joinLive(
  roomName
){

  try{

    clearMessage();

    isViewer =
      true;

    statusEl.textContent =
      "Joining EPHPHAVORA LIVE...";

    goLiveBtn.disabled =
      true;

    creatorId =
      getCreatorIdFromRoom(
        roomName
      );

    if(!creatorId){

      throw new Error(
        "Invalid LIVE link."
      );

    }

    currentRoomName =
      roomName;

    const connectionDetails =
      await getConnectionDetails(
        roomName
      );

    room =
      new LivekitClient.Room({
        adaptiveStream:true,
        dynacast:true
      });

    setupChat();
    setupRoomEvents();

    await room.connect(
      connectionDetails.serverUrl ||
      LIVEKIT_URL,
      connectionDetails.participantToken
    );

    await room.localParticipant
      .setCameraEnabled(false);

    await room.localParticipant
      .setMicrophoneEnabled(false);

    cameraOn =
      false;

    micOn =
      false;

    cameraBtn.disabled =
      true;

    micBtn.disabled =
      true;

    shareBtn.disabled =
      false;

    endBtn.disabled =
      false;

    sendChatBtn.disabled =
      false;

    enableReactions();

    statusEl.textContent =
      "👀 You are watching EPHPHAVORA LIVE";

    liveStatus.textContent =
      "LIVE";

    showShareLink();

    updateViewerCount();

    await loadCreator();

  }catch(error){

    console.error(
      "EPHPHAVORA VIEWER ERROR:",
      error
    );

    statusEl.textContent =
      "Unable to join LIVE.";

    showMessage(
      error.message ||
      "This LIVE may have ended."
    );

    goLiveBtn.disabled =
      false;

  }

}


/* =========================================================
   CAMERA
========================================================= */

async function toggleCamera(){

  if(
    !room ||
    isViewer
  ){
    return;
  }

  cameraOn =
    !cameraOn;

  await room.localParticipant
    .setCameraEnabled(
      cameraOn
    );

  cameraBtn.textContent =
    cameraOn
      ? "📷 Camera ON"
      : "📷 Camera OFF";
}


/* =========================================================
   MICROPHONE
========================================================= */

async function toggleMic(){

  if(
    !room ||
    isViewer
  ){
    return;
  }

  micOn =
    !micOn;

  await room.localParticipant
    .setMicrophoneEnabled(
      micOn
    );

  micBtn.textContent =
    micOn
      ? "🎤 Mic ON"
      : "🎤 Mic OFF";
}


/* =========================================================
   SHARE
========================================================= */

async function shareLive(){

  if(!shareLink.value){
    return;
  }

  try{

    await navigator.clipboard.writeText(
      shareLink.value
    );

    shareBtn.textContent =
      "✅ LINK COPIED";

    setTimeout(
      () => {
        shareBtn.textContent =
          "🔗 SHARE LIVE";
      },
      2000
    );

  }catch{

    shareLink.select();

    showMessage(
      "Copy the LIVE link manually."
    );

  }

}


/* =========================================================
   COPY
========================================================= */

async function copyLink(){

  if(!shareLink.value){
    return;
  }

  try{

    await navigator.clipboard.writeText(
      shareLink.value
    );

    copyBtn.textContent =
      "✅ COPIED";

    setTimeout(
      () => {
        copyBtn.textContent =
          "📋 COPY LINK";
      },
      2000
    );

  }catch{

    shareLink.select();

    document.execCommand(
      "copy"
    );

  }

}


/* =========================================================
   END LIVE / LEAVE
========================================================= */

async function endLive(){

  if(!room){
    return;
  }

  await room.disconnect();

  videoGrid.innerHTML =
    "";

  room =
    null;

  currentRoomName =
    null;

  creatorId =
    null;

  statusEl.textContent =
    isViewer
      ? "You left the LIVE."
      : "LIVE ended.";

  liveStatus.textContent =
    "OFF";

  viewerCount.textContent =
    "0";

  cameraBtn.disabled =
    true;

  micBtn.disabled =
    true;

  shareBtn.disabled =
    true;

  endBtn.disabled =
    true;

  sendChatBtn.disabled =
    true;

  disableReactions();

  goLiveBtn.disabled =
    false;

  shareBox.style.display =
    "none";

  creatorBox.style.display =
    "none";

  cameraBtn.textContent =
    "📷 Camera ON";

  micBtn.textContent =
    "🎤 Mic ON";

  cameraOn =
    true;

  micOn =
    true;

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

goLiveBtn.addEventListener(
  "click",
  () => {

    /*
      IMPORTANT:
      One button handler only.
      This fixes the old JOIN LIVE
      + START LIVE double-trigger bug.
    */

    const roomFromURL =
      getRoomFromURL();

    if(roomFromURL){

      joinLive(
        roomFromURL
      );

    }else{

      startLive();

    }

  }
);


cameraBtn.addEventListener(
  "click",
  toggleCamera
);


micBtn.addEventListener(
  "click",
  toggleMic
);


shareBtn.addEventListener(
  "click",
  shareLive
);


copyBtn.addEventListener(
  "click",
  copyLink
);


endBtn.addEventListener(
  "click",
  endLive
);


/* =========================================================
   VIEWER MODE
========================================================= */

const roomFromURL =
  getRoomFromURL();

if(roomFromURL){

  goLiveBtn.textContent =
    "👀 JOIN LIVE";

  statusEl.textContent =
    "A LIVE was shared with you.";

  creatorId =
    getCreatorIdFromRoom(
      roomFromURL
    );

  creatorBox.style.display =
    "block";

  loadCreator();

}

</script>
