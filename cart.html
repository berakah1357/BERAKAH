<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Cart</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 15px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #111827;
    text-decoration: none;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

nav a {
    text-decoration: none;
    color: #374151;
    font-size: 14px;
}

nav a:hover {
    color: #2563eb;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 20px 50px;
}

h1 {
    margin-top: 0;
}

.cart-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
}

.cart-items {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.cart-item {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 15px;

    display: grid;
    grid-template-columns: 100px 1fr auto;
    gap: 15px;
    align-items: center;
}

.cart-image {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
    background: #eef2f7;
}

.no-image {
    width: 100px;
    height: 100px;
    border-radius: 8px;
    background: #eef2f7;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 35px;
}

.item-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
}

.item-seller {
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 8px;
}

.item-price {
    font-weight: bold;
    font-size: 16px;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
}

.quantity button {
    width: 32px;
    height: 32px;

    border: 1px solid #d1d5db;
    background: white;

    border-radius: 6px;

    cursor: pointer;

    font-size: 18px;
}

.quantity button:hover {
    background: #f3f4f6;
}

.quantity span {
    min-width: 30px;
    text-align: center;
    font-weight: bold;
}

.item-total {
    font-size: 18px;
    font-weight: bold;
    text-align: right;
}

.remove-button {
    border: none;
    background: #fee2e2;
    color: #dc2626;

    padding: 8px 10px;

    border-radius: 7px;

    cursor: pointer;

    margin-top: 8px;
}

.remove-button:hover {
    background: #fecaca;
}

.summary {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;

    padding: 20px;

    height: fit-content;

    position: sticky;
    top: 90px;
}

.summary h2 {
    margin-top: 0;
}

.summary-row {
    display: flex;
    justify-content: space-between;

    margin: 12px 0;
}

.summary-total {
    border-top: 1px solid #e5e7eb;
    padding-top: 15px;

    font-size: 22px;
    font-weight: bold;
}

.btn {
    width: 100%;

    border: none;
    border-radius: 8px;

    padding: 12px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    margin-top: 10px;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-success {
    background: #16a34a;
    color: white;
}

.btn-success:hover {
    background: #15803d;
}

.btn-danger {
    background: #fee2e2;
    color: #dc2626;
}

.btn-danger:hover {
    background: #fecaca;
}

.empty {
    background: white;
    border: 1px solid #e5e7eb;

    border-radius: 12px;

    padding: 60px 20px;

    text-align: center;
}

.empty-icon {
    font-size: 60px;
}

.empty h2 {
    margin-bottom: 8px;
}

.empty p {
    color: #6b7280;
}

@media (max-width: 750px) {

    header {
        flex-direction: column;
        align-items: flex-start;
    }

    .cart-layout {
        grid-template-columns: 1fr;
    }

    .summary {
        position: static;
    }

    .cart-item {
        grid-template-columns: 80px 1fr;
    }

    .cart-image,
    .no-image {
        width: 80px;
        height: 80px;
    }

    .item-total {
        grid-column: 2;
        text-align: left;
    }

}

@media (max-width: 450px) {

    .cart-item {
        grid-template-columns: 1fr;
    }

    .cart-image,
    .no-image {
        width: 100%;
        height: 180px;
    }

    .item-total {
        grid-column: auto;
    }

}

</style>

</head>

<body>

<header>

<a
    href="index.html"
    class="logo">

    BERAKAH

</a>

<nav>

<a href="index.html">
Home
</a>

<a href="feed.html">
Feed
</a>

<a href="people.html">
👥 People
</a>

<a href="marketplace.html">
Market
</a>

<a href="notifications.html">
🔔 Notifications
</a>

<a href="messages.html">
💬 Messages
</a>

<a href="marketplace.html">
🛒 Market
</a>

<a href="#"
   onclick="logout()">

Logout

</a>

</nav>

</header>


<main class="container">

<h1>🛒 Your Cart</h1>

<div
    id="cartContent">

</div>

</main>


<script>

/* =====================================================
   CART
===================================================== */

function getCart() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "berakahCart"
            )
        ) || [];

    } catch {

        return [];

    }

}


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(cart) {

    localStorage.setItem(
        "berakahCart",
        JSON.stringify(cart)
    );

}


/* =====================================================
   DISPLAY CART
===================================================== */

function renderCart() {

    const cart =
        getCart();

    const container =
        document.getElementById(
            "cartContent"
        );


    if (
        !cart ||
        cart.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🛒
                </div>

                <h2>
                    Your cart is empty
                </h2>

                <p>
                    Find something you like
                    in the BERAKAH Marketplace.
                </p>

                <button
                    class="btn btn-primary"
                    onclick="goShopping()">

                    🛍️ Continue Shopping

                </button>

            </div>

        `;

        return;

    }


    let subtotal = 0;


    cart.forEach(
        item => {

            subtotal +=
                Number(item.price || 0) *
                Number(item.quantity || 1);

        }
    );


    const itemsHTML =
        cart.map(
            (item, index) =>
                createCartItem(
                    item,
                    index
                )
        ).join("");


    container.innerHTML = `

        <div class="cart-layout">

            <div>

                <div class="cart-items">

                    ${itemsHTML}

                </div>

                <button
                    class="btn btn-danger"
                    onclick="clearCart()">

                    🧹 Clear Cart

                </button>

            </div>


            <div class="summary">

                <h2>
                    Order Summary
                </h2>

                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <strong>
                        ${getItemCount(cart)}
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong>
                        $${subtotal.toFixed(2)}
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Shipping
                    </span>

                    <span>
                        Calculated at checkout
                    </span>

                </div>


                <div class="summary-row summary-total">

                    <span>
                        Total
                    </span>

                    <span>
                        $${subtotal.toFixed(2)}
                    </span>

                </div>


                <button
                    class="btn btn-success"
                    onclick="checkout()">

                    💳 Checkout

                </button>


                <button
                    class="btn btn-primary"
                    onclick="goShopping()">

                    ← Continue Shopping

                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   CREATE CART ITEM
===================================================== */

function createCartItem(
    item,
    index
) {

    const name =
        escapeHTML(
            item.name ||
            "Product"
        );


    const seller =
        escapeHTML(
            item.seller_name ||
            "BERAKAH Member"
        );


    const price =
        Number(
            item.price || 0
        );


    const quantity =
        Number(
            item.quantity || 1
        );


    const total =
        price * quantity;


    let imageHTML = "";


    if (item.image_url) {

        imageHTML = `

            <img
                class="cart-image"
                src="${escapeAttribute(item.image_url)}"
                alt="${name}">

        `;

    } else {

        imageHTML = `

            <div class="no-image">
                🛍️
            </div>

        `;

    }


    return `

        <div class="cart-item">

            ${imageHTML}


            <div>

                <div class="item-name">

                    ${name}

                </div>


                <div class="item-seller">

                    👤 ${seller}

                </div>


                <div class="item-price">

                    $${price.toFixed(2)}

                </div>


                <div class="quantity">

                    <button
                        onclick="changeQuantity(${index}, -1)">

                        −

                    </button>


                    <span>

                        ${quantity}

                    </span>


                    <button
                        onclick="changeQuantity(${index}, 1)">

                        +

                    </button>

                </div>


                <button
                    class="remove-button"
                    onclick="removeItem(${index})">

                    🗑️ Remove

                </button>

            </div>


            <div class="item-total">

                $${total.toFixed(2)}

            </div>

        </div>

    `;

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQuantity(
    index,
    amount
) {

    const cart =
        getCart();


    if (
        !cart[index]
    ) {

        return;

    }


    const newQuantity =
        Number(
            cart[index].quantity || 1
        ) + amount;


    if (newQuantity <= 0) {

        cart.splice(
            index,
            1
        );

    } else {

        cart[index].quantity =
            newQuantity;

    }


    saveCart(cart);

    renderCart();

}


/* =====================================================
   REMOVE ITEM
===================================================== */

function removeItem(index) {

    const cart =
        getCart();


    if (
        !cart[index]
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Remove this product from your cart?"
        );


    if (!confirmed) {

        return;

    }


    cart.splice(
        index,
        1
    );


    saveCart(cart);

    renderCart();

}


/* =====================================================
   CLEAR CART
===================================================== */

function clearCart() {

    const cart =
        getCart();


    if (
        cart.length === 0
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Clear your entire cart?"
        );


    if (!confirmed) {

        return;

    }


    localStorage.removeItem(
        "berakahCart"
    );


    renderCart();

}


/* =====================================================
   ITEM COUNT
===================================================== */

function getItemCount(cart) {

    return cart.reduce(
        (total, item) =>
            total +
            Number(
                item.quantity || 0
            ),
        0
    );

}


/* =====================================================
   CONTINUE SHOPPING
===================================================== */

function goShopping() {

    window.location.href =
        "marketplace.html";

}


/* =====================================================
   CHECKOUT
===================================================== */

function checkout() {

    const cart =
        getCart();


    if (
        cart.length === 0
    ) {

        alert(
            "Your cart is empty."
        );

        return;

    }


    /*
       Part 9D will replace this
       with the real Supabase
       order/checkout system.
    */

    alert(
        "Checkout is coming next! 🛍️"
    );

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        "berakah_access_token"
    );

    localStorage.removeItem(
        "berakah_refresh_token"
    );


    window.location.href =
        "login.html";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");

}


/* =====================================================
   START
===================================================== */

renderCart();

</script>

</body>

</html>
