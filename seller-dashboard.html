<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Seller Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  padding: 16px 20px;
  border-bottom: 1px solid #e5e7eb;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  color: #374151;
  padding: 8px 10px;
  border-radius: 8px;
}

nav a:hover {
  background: #f3f4f6;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 25px 18px 50px;
}

h1 {
  margin-bottom: 5px;
}

.welcome {
  color: #6b7280;
  margin-top: 0;
}

.message {
  background: #fff;
  border: 1px solid #e5e7eb;
  padding: 14px;
  border-radius: 10px;
  margin: 20px 0;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin: 20px 0;
}

.stat {
  background: white;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
}

.stat-title {
  color: #6b7280;
  font-size: 14px;
}

.stat-value {
  font-size: 28px;
  font-weight: bold;
  margin-top: 8px;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 20px 0;
}

button,
.action-link {
  border: none;
  background: #111827;
  color: white;
  padding: 11px 16px;
  border-radius: 8px;
  cursor: pointer;
  text-decoration: none;
  font-size: 14px;
}

button:hover,
.action-link:hover {
  opacity: .9;
}

.section {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 20px;
  margin-top: 20px;
}

.section h2 {
  margin-top: 0;
}

.product {
  display: flex;
  gap: 15px;
  padding: 15px 0;
  border-bottom: 1px solid #e5e7eb;
  align-items: center;
}

.product:last-child {
  border-bottom: none;
}

.product img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 10px;
  background: #f3f4f6;
}

.product-info {
  flex: 1;
}

.product-name {
  font-size: 18px;
  font-weight: bold;
}

.product-meta {
  color: #6b7280;
  margin-top: 5px;
  font-size: 14px;
}

.order {
  padding: 14px 0;
  border-bottom: 1px solid #e5e7eb;
}

.order:last-child {
  border-bottom: none;
}

.empty {
  color: #6b7280;
  padding: 10px 0;
}

.error {
  color: #b91c1c;
}

@media (max-width: 800px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .header-inner {
    align-items: flex-start;
    flex-direction: column;
  }

  nav {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">🛍️ BERAKAH</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="marketplace.html">Market</a>
      <a href="seller-dashboard.html">Seller Dashboard</a>
      <a href="profile.html">Profile</a>
    </nav>

  </div>
</header>

<div class="container">

  <h1>Seller Dashboard</h1>
  <p class="welcome">
    Welcome back, <strong>EPHPhAVORA</strong> 👋
  </p>

  <div id="message" class="message">
    Loading dashboard...
  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">Total Orders</div>
      <div id="totalOrders" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Products</div>
      <div id="totalProducts" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Paid Orders</div>
      <div id="paidOrders" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Sales</div>
      <div id="sales" class="stat-value">$0.00</div>
    </div>

  </div>

  <div class="actions">
    <a class="action-link" href="marketplace.html">Marketplace</a>

    <a class="action-link" href="seller-add-product.html">
      Add Product
    </a>

    <button onclick="loadDashboard()">
      Refresh
    </button>
  </div>

  <div class="section">

    <h2>Recent Orders</h2>

    <div id="orders">
      Loading orders...
    </div>

  </div>

  <div class="section">

    <h2>My Products</h2>

    <div id="products">
      Loading products...
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

/*
  This MUST match seller_name in Supabase.
*/
const SELLER_NAME = "EPHPHAVORA";


async function supabaseFetch(table, query = "") {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${table}${query}`,
    {
      method: "GET",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      }
    }
  );

  if (!response.ok) {

    const errorText = await response.text();

    throw new Error(
      `${table}: ${response.status} ${errorText}`
    );
  }

  return await response.json();
}


async function loadDashboard() {

  const message =
    document.getElementById("message");

  const productsBox =
    document.getElementById("products");

  const ordersBox =
    document.getElementById("orders");

  message.textContent =
    "Loading dashboard...";

  message.className =
    "message";

  productsBox.innerHTML =
    "Loading products...";

  ordersBox.innerHTML =
    "Loading orders...";


  try {

    /*
      IMPORTANT:
      These are the REAL columns in your products table:
      name
      price
      image_url
      seller_name
      created_at
      seller_id
      category
      stock
    */

    const products =
      await supabaseFetch(
        "products",
        `?select=*&seller_name=eq.${encodeURIComponent(SELLER_NAME)}&order=created_at.desc`
      );


    /*
      Orders table is currently empty,
      but we still load it so the dashboard
      is ready when the first order arrives.
    */

    const orders =
      await supabaseFetch(
        "orders",
        "?select=*"
      );


    /*
      PRODUCT COUNT
    */

    document.getElementById(
      "totalProducts"
    ).textContent = products.length;


    /*
      FIND THIS SELLER'S ORDERS.

      We use product IDs first because
      the products table already gives us
      the seller's products.
    */

    const productIds =
      new Set(products.map(product => product.id));


    const sellerOrders =
      orders.filter(order =>
        productIds.has(order.product_id)
      );


    /*
      ORDER STATS
    */

    document.getElementById(
      "totalOrders"
    ).textContent = sellerOrders.length;


    const paidOrders =
      sellerOrders.filter(order =>
        String(order.payment_status || "").toLowerCase() === "paid"
      );


    document.getElementById(
      "paidOrders"
    ).textContent = paidOrders.length;


    /*
      SALES
    */

    let totalSales = 0;

    paidOrders.forEach(order => {

      const price =
        Number(order.price || 0);

      const quantity =
        Number(order.quantity || 1);

      totalSales += price * quantity;

    });


    document.getElementById(
      "sales"
    ).textContent =
      "$" + totalSales.toFixed(2);


    /*
      DISPLAY PRODUCTS
    */

    if (products.length === 0) {

      productsBox.innerHTML =
        `<div class="empty">
          No products found for ${SELLER_NAME}.
        </div>`;

    } else {

      productsBox.innerHTML =
        products.map(product => {

          const image =
            product.image_url || "";

          return `

            <div class="product">

              ${
                image
                ? `<img src="${image}" alt="">`
                : `<div style="
                    width:80px;
                    height:80px;
                    border-radius:10px;
                    background:#f3f4f6;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                  ">📦</div>`
              }

              <div class="product-info">

                <div class="product-name">
                  ${escapeHtml(product.name || "Unnamed Product")}
                </div>

                <div class="product-meta">
                  Price: $${Number(product.price || 0).toFixed(2)}
                  &nbsp; • &nbsp;
                  Stock: ${Number(product.stock || 0)}
                </div>

                <div class="product-meta">
                  Category:
                  ${escapeHtml(product.category || "Uncategorized")}
                </div>

              </div>

            </div>

          `;

        }).join("");

    }


    /*
      DISPLAY ORDERS
    */

    if (sellerOrders.length === 0) {

      ordersBox.innerHTML =
        `<div class="empty">
          No orders yet.
        </div>`;

    } else {

      ordersBox.innerHTML =
        sellerOrders
        .sort(
          (a, b) =>
            new Date(b.created_at) -
            new Date(a.created_at)
        )
        .slice(0, 10)
        .map(order => {

          return `

            <div class="order">

              <strong>
                ${escapeHtml(
                  order.product_name || "Product"
                )}
              </strong>

              <div class="product-meta">
                Quantity:
                ${Number(order.quantity || 0)}
                &nbsp; • &nbsp;
                Price:
                $${Number(order.price || 0).toFixed(2)}
              </div>

              <div class="product-meta">
                Payment:
                ${escapeHtml(
                  order.payment_status || "Unknown"
                )}
              </div>

            </div>

          `;

        }).join("");

    }


    /*
      SUCCESS
    */

    message.textContent =
      `Dashboard loaded successfully. ${products.length} product(s) found.`;

  } catch (error) {

    console.error(error);

    message.textContent =
      "Could not load dashboard data: " +
      error.message;

    message.className =
      "message error";

    productsBox.innerHTML =
      `<div class="empty error">
        Unable to load products.
      </div>`;

    ordersBox.innerHTML =
      `<div class="empty error">
        Unable to load orders.
      </div>`;

  }

}


/*
  Prevent database text from becoming HTML.
*/

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/*
  Start dashboard automatically.
*/

loadDashboard();

</script>

</body>
</html>
