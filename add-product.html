<!DOCTYPE html>
<html>
<head>

<title>BERAKAH Add Product</title>

<style>

body{
  font-family:Arial;
  background:#f5f5f5;
  padding:30px;
}

.container{
  background:white;
  max-width:500px;
  margin:auto;
  padding:30px;
  border-radius:12px;
}

input, textarea{
  width:100%;
  padding:12px;
  margin:8px 0 18px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  background:#111827;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:6px;
}

h1{
  text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>➕ ADD PRODUCT</h1>

<label>Product Name</label>
<input id="productName" type="text" placeholder="Example: SMARTPHONE">

<label>Product Image</label>
<input
  type="file"
  id="productImage"
  accept="image/*"
>

<label>Price</label>
<input
  id="productPrice"
  type="number"
  placeholder="250"
>

<label>Stock</label>
<input
  id="productStock"
  type="number"
  placeholder="10"
  min="0"
>

<label>Description</label>
<textarea
  id="productDescription"
  placeholder="Describe your product"
></textarea>

<button onclick="addProduct()">
ADD PRODUCT
</button>

<button onclick="window.location.href='marketplace.html'">
VIEW MARKETPLACE
</button>

</div>

<script>

function addProduct(){

  let name =
    document.getElementById("productName").value.trim();

  let price =
    Number(document.getElementById("productPrice").value);

  let stock =
    Number(document.getElementById("productStock").value);

  let description =
    document.getElementById("productDescription").value.trim();

  let file =
    document.getElementById("productImage").files[0];

  if(!name || !price || stock < 0){

    alert("PLEASE COMPLETE PRODUCT NAME, PRICE AND STOCK");

    return;

  }

  if(file){

    let reader = new FileReader();

    reader.onload = function(e){

      saveProduct(
        name,
        price,
        stock,
        description,
        e.target.result
      );

    };

    reader.readAsDataURL(file);

  }else{

    saveProduct(
      name,
      price,
      stock,
      description,
      ""
    );

  }

}


function saveProduct(
  name,
  price,
  stock,
  description,
  image
){

  let product = {

    id: Date.now(),

    name: name,

    price: price,

    stock: stock,

    description: description,

    image: image,

    seller: "BERAKAH"

  };


  let products = JSON.parse(
    localStorage.getItem("berakahProducts") || "[]"
  );


  products.push(product);


  localStorage.setItem(
    "berakahProducts",
    JSON.stringify(products)
  );


  alert("PRODUCT SAVED 🚀");


  window.location.href =
    "marketplace.html";

}

</script>

</body>
</html>
