<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Seller Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

nav a {
    text-decoration: none;
    color: #374151;
    margin-left: 15px;
    font-size: 14px;
}

nav a:hover {
    color: #2563eb;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px;
}

.welcome {
    margin-bottom: 25px;
}

.welcome h1 {
    margin: 0 0 8px;
}

.welcome p {
    margin: 0;
    color: #6b7280;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 30px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.stat-title {
    color: #6b7280;
    font-size: 14px;
}

.stat-value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

.actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

button,
.action-link {
    border: 0;
    background: #2563eb;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    font-weight: bold;
}

button:hover,
.action-link:hover {
    opacity: .9;
}

.section {
    margin-bottom: 30px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.section-header h2 {
    margin: 0;
}

.orders {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
}

th,
td {
    padding: 14px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
    white-space: nowrap;
}

th {
    background: #f9fafb;
    font-size: 13px;
}

td {
    font-size: 14px;
}

.status {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    background: #eef2ff;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.product {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.product img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: #f3f4f6;
}

.product-body {
    padding: 15px;
}

.product-name {
    font-weight: bold;
    margin-bottom: 8px;
}

.price {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 6px;
}

.category {
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 6px;
}

.stock {
    font-size: 13px;
}

.empty {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
    color: #6b7280;
}

.message {
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}

@media (max-width: 900px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .products {
        grid-template-columns: repeat(2, 1fr);
    }

    nav {
        display: none;
    }
}

@media (max-width: 600px) {
    .stats {
        grid-template-columns: 1fr;
    }

    .products {
        grid-template-columns: 1fr;
    }

    header {
        padding: 15px;
    }

    .container {
        padding: 20px 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🛍️ BERAKAH</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="marketplace.html">Market</a>
        <a href="seller-dashboard.html">Seller Dashboard</a>
        <a href="profile.html">Profile</a>
    </nav>
</header>

<div class="container">

    <div class="welcome">
        <h1>Seller Dashboard</h1>
        <p>Welcome back, <strong id="sellerName">EPHPhAVORA</strong> 👋</p>
    </div>

    <div id="message" class="message"></div>

    <div class="stats">

        <div class="card">
            <div class="stat-title">Total Orders</div>
            <div class="stat-value" id="totalOrders">0</div>
        </div>

        <div class="card">
            <div class="stat-title">Products</div>
            <div class="stat-value" id="totalProducts">0</div>
        </div>

        <div class="card">
            <div class="stat-title">Paid Orders</div>
            <div class="stat-value" id="paidOrders">0</div>
        </div>

        <div class="card">
            <div class="stat-title">Sales</div>
            <div class="stat-value" id="salesTotal">$0.00</div>
        </div>

    </div>

    <div class="actions">

        <a class="action-link" href="marketplace.html">
            🛒 Marketplace
        </a>

        <a class="action-link" href="add-product.html">
            ➕ Add Product
        </a>

        <button onclick="loadDashboard()">
            🔄 Refresh
        </button>

    </div>

    <!-- ORDERS -->

    <div class="section">

        <div class="section-header">
            <h2>📦 Recent Orders</h2>
        </div>

        <div class="orders" id="ordersContainer">
            <div class="empty">
                Loading orders...
            </div>
        </div>

    </div>

    <!-- PRODUCTS -->

    <div class="section">

        <div class="section-header">
            <h2>🛍️ My Products</h2>
        </div>

        <div class="products" id="productsContainer">
            <div class="empty">
                Loading products...
            </div>
        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

/*
    CURRENT SELLER

    Your products table currently stores:

    seller = EPHPhAVORA

    So we use that exact value.
*/

const SELLER_NAME = "EPHPhAVORA";

function showMessage(text, type = "error") {

    const box = document.getElementById("message");

    box.textContent = text;

    box.className = "message " + type;

    box.style.display = "block";
}

function hideMessage() {

    document.getElementById("message").style.display = "none";

}

function money(value) {

    const number = Number(value || 0);

    return "$" + number.toFixed(2);

}

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

async function supabaseFetch(endpoint) {

    const response = await fetch(
        SUPABASE_URL + endpoint,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Content-Type": "application/json"
            }
        }
    );

    if (!response.ok) {

        const errorText = await response.text();

        throw new Error(errorText);

    }

    return await response.json();
}


/* =========================
   LOAD PRODUCTS
========================= */

async function getProducts() {

    const seller =
        encodeURIComponent(SELLER_NAME);

    const endpoint =
        "/rest/v1/products" +
        "?select=*" +
        "&seller=eq." + seller +
        "&order=created.desc";

    return await supabaseFetch(endpoint);

}


/* =========================
   LOAD ORDERS
========================= */

async function getOrders() {

    /*
       Orders use seller_id.

       We first load all orders and then
       match them against this seller's
       products using product_id.
    */

    return await supabaseFetch(
        "/rest/v1/orders?select=*&order=created_at.desc"
    );

}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(products) {

    const container =
        document.getElementById("productsContainer");

    document.getElementById("totalProducts")
        .textContent = products.length;

    if (!products.length) {

        container.innerHTML = `
            <div class="empty">
                You don't have any products yet.
                <br><br>
                <a class="action-link" href="add-product.html">
                    Add Your First Product
                </a>
            </div>
        `;

        return;
    }

    container.innerHTML =
        products.map(product => {

            const image =
                product.image ||
                "https://via.placeholder.com/500x350?text=Product";

            return `

                <div class="product">

                    <img
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(product.name)}"
                    >

                    <div class="product-body">

                        <div class="product-name">
                            ${escapeHTML(product.name)}
                        </div>

                        <div class="price">
                            ${money(product.price)}
                        </div>

                        <div class="category">
                            ${escapeHTML(product.category || "Other")}
                        </div>

                        <div class="stock">
                            Stock:
                            <strong>
                                ${escapeHTML(product.stock ?? 0)}
                            </strong>
                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   DISPLAY ORDERS
========================= */

function displayOrders(orders, products) {

    const container =
        document.getElementById("ordersContainer");

    /*
       Get the product IDs belonging
       to this seller.
    */

    const sellerProductIds =
        new Set(
            products.map(product =>
                String(product.id)
            )
        );

    /*
       Match orders to this seller's
       products.
    */

    const sellerOrders =
        orders.filter(order =>
            sellerProductIds.has(
                String(order.product_id)
            )
        );

    document.getElementById("totalOrders")
        .textContent = sellerOrders.length;

    const paid =
        sellerOrders.filter(order =>
            String(order.payment_status || "")
                .toLowerCase() === "paid"
        );

    document.getElementById("paidOrders")
        .textContent = paid.length;

    const sales =
        paid.reduce(
            (total, order) => {

                const price =
                    Number(order.price || 0);

                const quantity =
                    Number(order.quantity || 0);

                return total + (price * quantity);

            },
            0
        );

    document.getElementById("salesTotal")
        .textContent = money(sales);

    if (!sellerOrders.length) {

        container.innerHTML = `
            <div class="empty">
                No orders yet.
            </div>
        `;

        return;
    }

    container.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Payment</th>
                    <th>Paid At</th>
                    <th>Order Date</th>

                </tr>

            </thead>

            <tbody>

                ${
                    sellerOrders.map(order => `

                        <tr>

                            <td>
                                ${escapeHTML(
                                    order.product_name ||
                                    "Product"
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    order.quantity || 0
                                )}
                            </td>

                            <td>
                                ${money(order.price)}
                            </td>

                            <td>

                                <span class="status">

                                    ${escapeHTML(
                                        order.payment_status ||
                                        "pending"
                                    )}

                                </span>

                            </td>

                            <td>
                                ${
                                    order.paid_at
                                    ? new Date(
                                        order.paid_at
                                      ).toLocaleString()
                                    : "-"
                                }
                            </td>

                            <td>
                                ${
                                    order.created_at
                                    ? new Date(
                                        order.created_at
                                      ).toLocaleString()
                                    : "-"
                                }
                            </td>

                        </tr>

                    `).join("")
                }

            </tbody>

        </table>

    `;

}


/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard() {

    hideMessage();

    document.getElementById("sellerName")
        .textContent = SELLER_NAME;

    try {

        const products =
            await getProducts();

        const orders =
            await getOrders();

        displayProducts(products);

        displayOrders(
            orders,
            products
        );

    }

    catch(error) {

        console.error(error);

        showMessage(
            "Could not load dashboard data. Check the browser console for details."
        );

        document.getElementById("ordersContainer")
            .innerHTML = `
                <div class="empty">
                    Unable to load orders.
                </div>
            `;

        document.getElementById("productsContainer")
            .innerHTML = `
                <div class="empty">
                    Unable to load products.
                </div>
            `;

    }

}


/* START */

loadDashboard();

</script>

</body>
</html>
