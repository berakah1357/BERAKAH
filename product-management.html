<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Product Management</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px 20px;
}

.header {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  color: #374151;
  padding: 8px 10px;
  border-radius: 7px;
  font-size: 14px;
}

nav a:hover {
  background: #f3f4f6;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 25px 15px 50px;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #6b7280;
  margin-top: 0;
}

.section {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.field {
  display: flex;
  flex-direction: column;
}

.field.full {
  grid-column: 1 / -1;
}

label {
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 7px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: #111827;
}

.image-preview {
  margin-top: 10px;
}

.image-preview img {
  max-width: 180px;
  max-height: 180px;
  border-radius: 10px;
  object-fit: cover;
  display: none;
}

.main-button {
  background: #111827;
  color: white;
  border: none;
  padding: 13px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 15px;
}

.main-button:hover {
  opacity: .9;
}

.cancel-button {
  background: #6b7280;
  color: white;
  border: none;
  padding: 13px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 15px;
  display: none;
  margin-left: 8px;
}

.message {
  display: none;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.products {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.product {
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  overflow: hidden;
  background: white;
}

.product-image {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #f3f4f6;
}

.no-image {
  height: 180px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f3f4f6;
  color: #9ca3af;
}

.product-body {
  padding: 15px;
}

.product-body h3 {
  margin: 0 0 8px;
}

.product-price {
  font-size: 18px;
  font-weight: bold;
}

.product-category {
  color: #6b7280;
  font-size: 14px;
  margin-top: 5px;
}

.product-description {
  color: #4b5563;
  font-size: 14px;
  margin-top: 8px;
  line-height: 1.5;
}

.product-buttons {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.edit-button,
.delete-button {
  flex: 1;
  border: none;
  padding: 10px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

.edit-button {
  background: #e5e7eb;
  color: #111827;
}

.delete-button {
  background: #fee2e2;
  color: #991b1b;
}

.loading {
  color: #6b7280;
  padding: 20px 0;
}

.empty {
  color: #6b7280;
  padding: 20px 0;
}

@media(max-width:800px) {

  .products {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media(max-width:600px) {

  .form-grid {
    grid-template-columns: 1fr;
  }

  .field.full {
    grid-column: auto;
  }

  .products {
    grid-template-columns: 1fr;
  }

  nav {
    display: none;
  }

}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
BERAKAH
</div>

<nav>

<a href="index.html">Home</a>

<a href="marketplace.html">Market</a>

<a href="seller-dashboard.html">
Dashboard
</a>

<a href="seller-orders.html">
Seller Orders
</a>

<a href="orders.html">
My Orders
</a>

<a href="profile.html">
Profile
</a>

</nav>

</div>

</header>


<div class="container">

<h1>🛍️ Product Management</h1>

<p class="subtitle">
Add, edit and manage your products.
</p>


<div id="message"
class="message">
</div>


<!-- PRODUCT FORM -->

<div class="section">

<h2 id="formTitle">
➕ Add New Product
</h2>

<form id="productForm">

<div class="form-grid">


<div class="field">

<label>
Product Name
</label>

<input
type="text"
id="productName"
required
placeholder="Example: Smartphone">

</div>


<div class="field">

<label>
Price
</label>

<input
type="number"
id="productPrice"
required
min="0"
step="0.01"
placeholder="250.00">

</div>


<div class="field">

<label>
Category
</label>

<select id="productCategory"
required>

<option value="">
Select category
</option>

<option value="Electronics">
Electronics
</option>

<option value="Fashion">
Fashion
</option>

<option value="Beauty">
Beauty
</option>

<option value="Home">
Home
</option>

<option value="Food">
Food
</option>

<option value="Services">
Services
</option>

<option value="Other">
Other
</option>

</select>

</div>


<div class="field">

<label>
Inventory / Stock
</label>

<input
type="number"
id="productStock"
min="0"
step="1"
value="0"
placeholder="10">

</div>


<div class="field full">

<label>
Product Description
</label>

<textarea
id="productDescription"
placeholder="Describe your product...">
</textarea>

</div>


<div class="field full">

<label>
Product Image
</label>

<input
type="file"
id="productImage"
accept="image/*">

<div class="image-preview">

<img
id="imagePreview"
alt="Product preview">

</div>

</div>


</div>


<button
type="submit"
class="main-button"
id="saveButton">

➕ ADD PRODUCT

</button>


<button
type="button"
class="cancel-button"
id="cancelButton"
onclick="cancelEdit()">

CANCEL

</button>

</form>

</div>


<!-- PRODUCT LIST -->

<div class="section">

<h2>
🛍️ My Products
</h2>

<div
id="products"
class="products">

<div class="loading">
Loading products...
</div>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const token =
localStorage.getItem("berakah_access_token");

let currentUser = null;

let products = [];

let editingProductId = null;

let selectedImage = null;


/* =========================
   AUTHENTICATION
========================= */

async function getUser() {

if (!token) {

throw new Error(
"You are not logged in. Please log in first."
);

}

const response =
await fetch(
SUPABASE_URL + "/auth/v1/user",
{

headers: {

"apikey": SUPABASE_KEY,

"Authorization":
"Bearer " + token

}

});


if (!response.ok) {

throw new Error(
"Your login session has expired."
);

}

currentUser =
await response.json();

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

const url =
SUPABASE_URL +
"/rest/v1/products?select=*&seller_id=eq." +
currentUser.id +
"&order=created_at.desc";


const response =
await fetch(url, {

headers: {

"apikey": SUPABASE_KEY,

"Authorization":
"Bearer " + token

}

});


if (!response.ok) {

const error =
await response.text();

throw new Error(
"Could not load products: " +
error
);

}


products =
await response.json();

displayProducts();

}


/* =========================
   IMAGE PREVIEW
========================= */

document
.getElementById("productImage")
.addEventListener(
"change",
function(event) {

const file =
event.target.files[0];

if (!file) {
return;
}

const reader =
new FileReader();

reader.onload =
function(e) {

selectedImage =
e.target.result;

const preview =
document.getElementById(
"imagePreview"
);

preview.src =
selectedImage;

preview.style.display =
"block";

};

reader.readAsDataURL(file);

});


/* =========================
   ADD / EDIT PRODUCT
========================= */

document
.getElementById("productForm")
.addEventListener(
"submit",
async function(event) {

event.preventDefault();

try {

const name =
document.getElementById(
"productName"
).value.trim();

const price =
Number(
document.getElementById(
"productPrice"
).value
);

const category =
document.getElementById(
"productCategory"
).value;

const description =
document.getElementById(
"productDescription"
).value.trim();

const stock =
Number(
document.getElementById(
"productStock"
).value
);


if (!name) {

throw new Error(
"Product name is required."
);

}


if (price < 0) {

throw new Error(
"Price cannot be negative."
);

}


/* PRODUCT DATA */

const productData = {

product_name: name,

price: price,

category: category,

description: description,

stock: stock,

seller_id: currentUser.id

};


/*
Only send image when a new
image was selected.
*/

if (selectedImage) {

productData.image =
selectedImage;

}


let response;


if (editingProductId) {

/* UPDATE */

response =
await fetch(

SUPABASE_URL +
"/rest/v1/products?id=eq." +
editingProductId +
"&seller_id=eq." +
currentUser.id,

{

method: "PATCH",

headers: {

"apikey": SUPABASE_KEY,

"Authorization":
"Bearer " + token,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify(
productData
)

});

} else {

/* INSERT */

response =
await fetch(

SUPABASE_URL +
"/rest/v1/products",

{

method: "POST",

headers: {

"apikey": SUPABASE_KEY,

"Authorization":
"Bearer " + token,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify(
productData
)

});

}


if (!response.ok) {

const error =
await response.text();

throw new Error(error);

}


showMessage(

editingProductId
? "Product updated successfully! ✅"
: "Product added successfully! 🛍️",

"success"

);


resetForm();

await loadProducts();


} catch(error) {

console.error(error);

showMessage(
error.message,
"error"
);

}

});


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts() {

const box =
document.getElementById(
"products"
);


if (!products.length) {

box.innerHTML =
"<div class='empty'>No products yet.</div>";

return;

}


box.innerHTML =
products.map(product => {

const name =
product.product_name ||
product.name ||
"Product";

const price =
Number(product.price || 0)
.toFixed(2);

const category =
product.category ||
"Other";

const description =
product.description ||
"No description.";

const stock =
product.stock ??
product.inventory ??
0;

const image =
product.image ||
product.image_url ||
product.product_image ||
null;


return `

<div class="product">

${
image

?

`<img
class="product-image"
src="${escapeHTML(image)}"
alt="${escapeHTML(name)}">`

:

`<div class="no-image">
🖼️ No Image
</div>`

}

<div class="product-body">

<h3>
${escapeHTML(name)}
</h3>

<div class="product-price">
$${price}
</div>

<div class="product-category">
🏷️ ${escapeHTML(category)}
</div>

<div class="product-category">
📦 Stock: ${Number(stock)}
</div>

<div class="product-description">
${escapeHTML(description)}
</div>

<div class="product-buttons">

<button
class="edit-button"
onclick="editProduct('${product.id}')">

✏️ EDIT

</button>

<button
class="delete-button"
onclick="deleteProduct('${product.id}')">

🗑️ DELETE

</button>

</div>

</div>

</div>

`;

}).join("");

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(id) {

const product =
products.find(
p => String(p.id) === String(id)
);


if (!product) {
return;
}


editingProductId =
product.id;


document.getElementById(
"productName"
).value =
product.product_name ||
product.name ||
"";


document.getElementById(
"productPrice"
).value =
product.price || "";


document.getElementById(
"productCategory"
).value =
product.category || "";


document.getElementById(
"productDescription"
).value =
product.description || "";


document.getElementById(
"productStock"
).value =
product.stock ??
product.inventory ??
0;


selectedImage = null;


const image =
product.image ||
product.image_url ||
product.product_image;


const preview =
document.getElementById(
"imagePreview"
);


if (image) {

preview.src =
image;

preview.style.display =
"block";

} else {

preview.style.display =
"none";

}


document.getElementById(
"formTitle"
).textContent =
"✏️ Edit Product";


document.getElementById(
"saveButton"
).textContent =
"💾 UPDATE PRODUCT";


document.getElementById(
"cancelButton"
).style.display =
"inline-block";


window.scrollTo({
top: 0,
behavior: "smooth"
});

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id) {

const confirmed =
confirm(
"Are you sure you want to delete this product?"
);


if (!confirmed) {
return;
}


try {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/products?id=eq." +
id +
"&seller_id=eq." +
currentUser.id,

{

method: "DELETE",

headers: {

"apikey": SUPABASE_KEY,

"Authorization":
"Bearer " + token

}

});


if (!response.ok) {

const error =
await response.text();

throw new Error(error);

}


showMessage(
"Product deleted successfully. 🗑️",
"success"
);


await loadProducts();


} catch(error) {

console.error(error);

showMessage(
error.message,
"error"
);

}

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

resetForm();

}


/* =========================
   RESET FORM
========================= */

function resetForm() {

editingProductId =
null;

selectedImage =
null;

document.getElementById(
"productForm"
).reset();


document.getElementById(
"productStock"
).value =
"0";


document.getElementById(
"formTitle"
).textContent =
"➕ Add New Product";


document.getElementById(
"saveButton"
).textContent =
"➕ ADD PRODUCT";


document.getElementById(
"cancelButton"
).style.display =
"none";


document.getElementById(
"imagePreview"
).style.display =
"none";

}


/* =========================
   MESSAGE
========================= */

function showMessage(
text,
type
) {

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " + type;

box.style.display =
"block";


setTimeout(
function() {

box.style.display =
"none";

},
4000
);

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

async function start() {

try {

await getUser();

await loadProducts();

} catch(error) {

console.error(error);

showMessage(
error.message,
"error"
);

}

}


start();

</script>

</body>
</html>
