<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Seller Orders</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  padding: 15px;
  border-bottom: 1px solid #ddd;
}

header h2 {
  margin: 0 0 12px;
}

nav a {
  margin-right: 10px;
  text-decoration: none;
  color: #2563eb;
  font-size: 14px;
}

.container {
  max-width: 900px;
  margin: 25px auto;
  padding: 15px;
}

.order {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.order h3 {
  margin-top: 0;
}

.status {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 13px;
  margin: 8px 0;
}

.pending {
  background: #fef3c7;
  color: #92400e;
}

.processing {
  background: #dbeafe;
  color: #1e40af;
}

.shipped {
  background: #e0e7ff;
  color: #3730a3;
}

.delivered {
  background: #dcfce7;
  color: #166534;
}

.cancelled {
  background: #fee2e2;
  color: #991b1b;
}

button {
  border: none;
  padding: 10px 14px;
  margin: 5px 5px 0 0;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: .85;
}

.process-btn {
  background: #2563eb;
  color: white;
}

.ship-btn {
  background: #4f46e5;
  color: white;
}

.deliver-btn {
  background: #16a34a;
  color: white;
}

.cancel-btn {
  background: #dc2626;
  color: white;
}

.message {
  text-align: center;
  padding: 30px;
  background: white;
  border-radius: 12px;
}

.customer {
  background: #f9fafb;
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
}

.price {
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>

<h2>BERAKAH</h2>

<nav>
<a href="index.html">Home</a>
<a href="marketplace.html">Market</a>
<a href="orders.html">My Orders</a>
<a href="profile.html">Profile</a>
</nav>

</header>

<div class="container">

<h1>📦 SELLER ORDERS</h1>

<p>Manage orders for your products.</p>

<div id="orders">
<div class="message">Loading orders...</div>
</div>

</div>

<script>

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"YOUR_SUPABASE_ANON_KEY";

const TOKEN =
localStorage.getItem("berakah_access_token");

async function loadOrders() {

    const container =
        document.getElementById("orders");

    if (!TOKEN) {

        container.innerHTML =
        '<div class="message">Please log in first.</div>';

        return;
    }

    try {

        const userResponse =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/user",
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                        "Bearer " + TOKEN
                    }
                }
            );

        if (!userResponse.ok) {

            container.innerHTML =
            '<div class="message">Session expired. Please log in again.</div>';

            return;
        }

        const user =
            await userResponse.json();

        const sellerId =
            user.id;

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/orders?select=*&seller_id=eq." +
                encodeURIComponent(sellerId) +
                "&order=created_at.desc",
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                        "Bearer " + TOKEN
                    }
                }
            );

        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);
        }

        const orders =
            await response.json();

        if (!orders.length) {

            container.innerHTML =
            '<div class="message">No seller orders yet.</div>';

            return;
        }

        container.innerHTML = "";

        orders.forEach(order => {

            const status =
                String(
                    order.status || "pending"
                ).toLowerCase();

            const div =
                document.createElement("div");

            div.className = "order";

            let buttons = "";

            if (status === "pending") {

                buttons +=
                '<button class="process-btn" onclick="updateStatus(' +
                order.id +
                ', \'processing\')">' +
                'START PROCESSING' +
                '</button>';

                buttons +=
                '<button class="cancel-btn" onclick="updateStatus(' +
                order.id +
                ', \'cancelled\')">' +
                'CANCEL' +
                '</button>';
            }

            if (status === "processing") {

                buttons +=
                '<button class="ship-btn" onclick="updateStatus(' +
                order.id +
                ', \'shipped\')">' +
                'MARK SHIPPED' +
                '</button>';
            }

            if (status === "shipped") {

                buttons +=
                '<button class="deliver-btn" onclick="updateStatus(' +
                order.id +
                ', \'delivered\')">' +
                'MARK DELIVERED' +
                '</button>';
            }

            div.innerHTML = `

                <h3>
                    Order #${order.order_number || order.id}
                </h3>

                <div class="status ${status}">
                    ${status.toUpperCase()}
                </div>

                <p>
                    <strong>${order.product_name || "Product"}</strong>
                </p>

                <p>
                    Quantity: ${order.quantity || 1}
                </p>

                <p class="price">
                    $${Number(order.total || 0).toFixed(2)}
                </p>

                <div class="customer">

                    <strong>Customer</strong>

                    <p>
                        ${order.customer_name || ""}
                    </p>

                    <p>
                        ${order.customer_email || ""}
                    </p>

                    <p>
                        ${order.customer_phone || ""}
                    </p>

                    <p>
                        ${order.customer_address || ""}
                    </p>

                </div>

                <div>
                    ${buttons}
                </div>
            `;

            container.appendChild(div);

        });

    } catch (error) {

        console.error(error);

        container.innerHTML =
        '<div class="message">Could not load seller orders.</div>';
    }
}


async function updateStatus(orderId, newStatus) {

    if (!TOKEN) {

        alert("Please log in first.");

        return;
    }

    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/orders?id=eq." +
                encodeURIComponent(orderId),
                {
                    method: "PATCH",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                        "Bearer " + TOKEN,
                        "Content-Type":
                        "application/json",
                        "Prefer":
                        "return=minimal"
                    },

                    body: JSON.stringify({
                        status: newStatus,
                        updated_at:
                            new Date().toISOString()
                    })
                }
            );

        if (!response.ok) {

            const error =
                await response.text();

            console.error(error);

            alert(
                "Could not update order status."
            );

            return;
        }

        await loadOrders();

    } catch (error) {

        console.error(error);

        alert(
            "Could not update order status."
        );
    }
}


loadOrders();

setInterval(
    loadOrders,
    5000
);

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible"
        ) {
            loadOrders();
        }

    }
);

</script>

</body>
</html>
