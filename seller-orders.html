<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Seller Orders</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px 20px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #2563eb;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

nav a {
  text-decoration: none;
  color: #374151;
  padding: 8px 10px;
  border-radius: 7px;
  font-size: 14px;
}

nav a:hover {
  background: #eff6ff;
}

.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 15px;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #6b7280;
}

.stats {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  margin: 25px 0;
}

.stat {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

.stat h3 {
  margin: 0;
  color: #6b7280;
  font-size: 14px;
}

.stat p {
  font-size: 25px;
  font-weight: bold;
  margin: 8px 0 0;
}

.orders {
  display: grid;
  gap: 15px;
}

.order {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

.order-header {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
}

.order-number {
  font-weight: bold;
  font-size: 17px;
}

.date {
  color: #6b7280;
  font-size: 13px;
}

.product {
  margin-top: 15px;
  font-size: 17px;
  font-weight: bold;
}

.details {
  margin-top: 8px;
  color: #4b5563;
}

.status-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}

select {
  padding: 9px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
}

button {
  border: none;
  border-radius: 7px;
  padding: 9px 14px;
  cursor: pointer;
  font-weight: bold;
}

.update {
  background: #2563eb;
  color: white;
}

.payment {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
  margin-top: 10px;
}

.pending {
  background: #fef3c7;
  color: #92400e;
}

.paid {
  background: #dcfce7;
  color: #166534;
}

.failed {
  background: #fee2e2;
  color: #991b1b;
}

.refunded {
  background: #e5e7eb;
  color: #374151;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  background: #eff6ff;
  color: #1e40af;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.empty {
  text-align: center;
  padding: 50px;
  background: white;
  border-radius: 12px;
  color: #6b7280;
}

</style>

</head>

<body>

<header>

<div class="header-inner">

<div class="logo">
BERAKAH
</div>

<nav>

<a href="index.html">Home</a>

<a href="feed.html">Feed</a>

<a href="people.html">👥 People</a>

<a href="marketplace.html">Market</a>

<a href="seller-dashboard.html">
Dashboard
</a>

<a href="seller-orders.html">
📦 Seller Orders
</a>

<a href="product-management.html">
Products
</a>

<a href="inventory.html">
Inventory
</a>

<a href="orders.html">
My Orders
</a>

<a href="profile.html">
Profile
</a>

</nav>

</div>

</header>


<div class="container">

<h1>📦 Seller Orders</h1>

<p class="subtitle">
Manage orders and payment status.
</p>


<div class="stats">

<div class="stat">

<h3>Total Orders</h3>

<p id="totalOrders">
0
</p>

</div>


<div class="stat">

<h3>Pending Payments</h3>

<p id="pendingPayments">
0
</p>

</div>


<div class="stat">

<h3>Paid Orders</h3>

<p id="paidOrders">
0
</p>

</div>


<div class="stat">

<h3>Paid Value</h3>

<p id="paidValue">
$0.00
</p>

</div>

</div>


<div id="message"></div>


<div
class="orders"
id="orders">

<div class="empty">
Loading orders...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const TOKEN =
localStorage.getItem(
"berakah_access_token"
);

let currentUser = null;
let orders = [];


function headers() {

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + TOKEN,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

};

}


async function getUser() {

if (!TOKEN) {

location.href =
"login.html";

return null;

}

const response =
await fetch(
SUPABASE_URL +
"/auth/v1/user",
{
headers: headers()
}
);

if (!response.ok) {

location.href =
"login.html";

return null;

}

return await response.json();

}


async function loadOrders() {

const url =
SUPABASE_URL +
"/rest/v1/orders" +
"?select=*" +
"&seller_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&order=created_at.desc";


const response =
await fetch(
url,
{
headers: headers()
}
);


if (!response.ok) {

throw new Error(
await response.text()
);

}


orders =
await response.json();


renderOrders();

}


function renderOrders() {

const container =
document.getElementById(
"orders"
);


document.getElementById(
"totalOrders"
).textContent =
orders.length;


const pending =
orders.filter(
o =>
(o.payment_status ||
"pending") ===
"pending"
).length;


const paid =
orders.filter(
o =>
o.payment_status ===
"paid"
);


document.getElementById(
"pendingPayments"
).textContent =
pending;


document.getElementById(
"paidOrders"
).textContent =
paid.length;


const value =
paid.reduce(
(sum, order) =>
sum + Number(order.total || 0),
0
);


document.getElementById(
"paidValue"
).textContent =
"$" +
value.toFixed(2);


if (!orders.length) {

container.innerHTML = `

<div class="empty">
No orders yet.
</div>

`;

return;

}


container.innerHTML =
orders.map(order => {

const number =
order.order_number ||
"BRK-" + order.id;

const payment =
order.payment_status ||
"pending";

const status =
order.status ||
"pending";

const date =
order.created_at
?
new Date(
order.created_at
).toLocaleString()
:
"";


return `

<div class="order">

<div class="order-header">

<div>

<div class="order-number">
#${escapeHTML(number)}
</div>

<div class="date">
${escapeHTML(date)}
</div>

</div>

<div>

<strong>
$${Number(order.total || 0).toFixed(2)}
</strong>

</div>

</div>


<div class="product">

${escapeHTML(
order.product_name ||
"Product"
)}

</div>


<div class="details">

Customer:
${escapeHTML(
order.customer_name ||
order.shipping_name ||
"Customer"
)}

<br>

Quantity:
${escapeHTML(
order.quantity ||
1
)}

<br>

Order Status:
<strong>
${escapeHTML(status)}
</strong>

</div>


<div>

<span class="payment ${payment}">

${paymentIcon(payment)}
${paymentLabel(payment)}

</span>

</div>


<div class="status-row">

<select
id="payment-${order.id}">

<option
value="pending"
${payment === "pending" ? "selected" : ""}>
🟡 Pending
</option>

<option
value="paid"
${payment === "paid" ? "selected" : ""}>
🟢 Paid
</option>

<option
value="failed"
${payment === "failed" ? "selected" : ""}>
🔴 Failed
</option>

<option
value="refunded"
${payment === "refunded" ? "selected" : ""}>
↩️ Refunded
</option>

</select>


<button
class="update"
onclick="updatePayment(${order.id})">

Update Payment

</button>

</div>

</div>

`;

}).join("");

}


function paymentIcon(status) {

if (status === "paid")
return "🟢";

if (status === "failed")
return "🔴";

if (status === "refunded")
return "↩️";

return "🟡";

}


function paymentLabel(status) {

if (status === "paid")
return "PAID";

if (status === "failed")
return "FAILED";

if (status === "refunded")
return "REFUNDED";

return "PENDING";

}


async function updatePayment(id) {

const select =
document.getElementById(
"payment-" + id
);


const paymentStatus =
select.value;


const body = {

payment_status:
paymentStatus

};


if (paymentStatus === "paid") {

body.paid_at =
new Date().toISOString();

} else {

body.paid_at =
null;

}


const response =
await fetch(
SUPABASE_URL +
"/rest/v1/orders" +
"?id=eq." +
encodeURIComponent(id) +
"&seller_id=eq." +
encodeURIComponent(
currentUser.id
),
{

method: "PATCH",

headers: headers(),

body:
JSON.stringify(body)

}
);


if (!response.ok) {

showMessage(
"Payment update failed.",
true
);

console.error(
await response.text()
);

return;

}


showMessage(
"Payment status updated successfully."
);


await loadOrders();

}


function showMessage(
text,
error = false
) {

const element =
document.getElementById(
"message"
);

element.className =
error
? "message error"
: "message";

element.textContent =
text;

setTimeout(
() => {
element.textContent = "";
},
3000
);

}


function escapeHTML(value) {

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


async function start() {

try {

currentUser =
await getUser();

if (!currentUser)
return;

await loadOrders();

} catch(error) {

console.error(error);

showMessage(
"Unable to load seller orders.",
true
);

}

}


start();

</script>

</body>

</html>
