<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Seller Orders</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 18px;
  text-align: center;
}

nav {
  background: white;
  padding: 14px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

nav a {
  margin: 0 10px;
  text-decoration: none;
  color: #111827;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 20px;
}

h1 {
  margin-bottom: 8px;
}

.subtitle {
  color: #6b7280;
  margin-bottom: 20px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  cursor: pointer;
  font-weight: bold;
  margin: 4px;
}

.refresh {
  background: #111827;
  color: white;
}

.processing {
  background: #f59e0b;
  color: white;
}

.shipped {
  background: #2563eb;
  color: white;
}

.delivered {
  background: #16a34a;
  color: white;
}

.cancel {
  background: #dc2626;
  color: white;
}

.order {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-top: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.order h2 {
  margin-top: 0;
}

.status {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  background: #e5e7eb;
  font-weight: bold;
  margin: 8px 0;
}

.error {
  background: #fee2e2;
  color: #991b1b;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.success {
  background: #dcfce7;
  color: #166534;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.loading {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

.customer {
  background: #f9fafb;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

</style>

</head>

<body>

<header>
  <h1>BERAKAH</h1>
  <p>Seller Dashboard</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="marketplace.html">Market</a>
  <a href="orders.html">My Orders</a>
  <a href="profile.html">Profile</a>
</nav>

<div class="container">

  <h1>📦 SELLER ORDERS</h1>

  <p class="subtitle">
    Manage orders for your products.
  </p>

  <button
    class="refresh"
    onclick="loadOrders()">
    🔄 REFRESH ORDERS
  </button>

  <div id="message"></div>

  <div id="orders">
    <div class="loading">
      Loading orders...
    </div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


function showMessage(message, type = "error") {

  const box =
    document.getElementById("message");

  box.innerHTML =
    `<div class="${type}">${message}</div>`;

}


function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


async function fetchWithTimeout(url, options = {}, timeout = 10000) {

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );

  try {

    const response =
      await fetch(
        url,
        {
          ...options,
          signal: controller.signal
        }
      );

    return response;

  } finally {

    clearTimeout(timer);

  }

}


async function loadOrders() {

  const ordersBox =
    document.getElementById("orders");

  const messageBox =
    document.getElementById("message");

  messageBox.innerHTML = "";

  ordersBox.innerHTML =
    `<div class="loading">
      Loading orders...
    </div>`;

  const token =
    localStorage.getItem(
      "berakah_access_token"
    );

  if (!token) {

    ordersBox.innerHTML = "";

    showMessage(
      "No login session found. Please log in again."
    );

    return;
  }


  try {

    /* VERIFY LOGIN */

    const userResponse =
      await fetchWithTimeout(
        SUPABASE_URL +
        "/auth/v1/user",
        {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + token
          }
        }
      );


    if (!userResponse.ok) {

      const errorText =
        await userResponse.text();

      console.error(
        "USER ERROR:",
        errorText
      );

      localStorage.removeItem(
        "berakah_access_token"
      );

      ordersBox.innerHTML = "";

      showMessage(
        "Your login session has expired. Please log in again."
      );

      return;
    }


    const user =
      await userResponse.json();

    const sellerId =
      user.id;


    /* LOAD SELLER ORDERS */

    const url =
      SUPABASE_URL +
      "/rest/v1/orders" +
      "?select=*" +
      "&seller_id=eq." +
      encodeURIComponent(sellerId) +
      "&order=created_at.desc";


    console.log(
      "SELLER ID:",
      sellerId
    );

    console.log(
      "ORDERS URL:",
      url
    );


    const response =
      await fetchWithTimeout(
        url,
        {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          }
        }
      );


    const responseText =
      await response.text();


    console.log(
      "ORDERS RESPONSE:",
      response.status,
      responseText
    );


    if (!response.ok) {

      ordersBox.innerHTML = "";

      showMessage(
        "Supabase returned an error:<br><br>" +
        escapeHTML(responseText)
      );

      return;
    }


    let orders = [];

    try {

      orders =
        JSON.parse(responseText);

    } catch (error) {

      ordersBox.innerHTML = "";

      showMessage(
        "The orders response could not be read."
      );

      return;
    }


    if (!Array.isArray(orders)) {

      ordersBox.innerHTML = "";

      showMessage(
        "Unexpected orders response."
      );

      return;
    }


    if (orders.length === 0) {

      ordersBox.innerHTML =
        `<div class="loading">
          No orders found for your products.
        </div>`;

      return;
    }


    ordersBox.innerHTML =
      orders
        .map(order => createOrderHTML(order))
        .join("");


  } catch (error) {

    console.error(
      "SELLER ORDERS ERROR:",
      error
    );


    ordersBox.innerHTML = "";

    if (error.name === "AbortError") {

      showMessage(
        "The connection to Supabase timed out. Please try again."
      );

    } else {

      showMessage(
        "Could not load seller orders.<br><br>" +
        escapeHTML(error.message)
      );

    }

  }

}


function createOrderHTML(order) {

  const status =
    String(order.status || "pending")
      .toLowerCase();


  let buttons = "";


  if (status === "pending") {

    buttons = `
      <button
        class="processing"
        onclick="updateOrder(${order.id}, 'processing')">
        START PROCESSING
      </button>

      <button
        class="cancel"
        onclick="updateOrder(${order.id}, 'cancelled')">
        CANCEL ORDER
      </button>
    `;

  }


  else if (status === "processing") {

    buttons = `
      <button
        class="shipped"
        onclick="updateOrder(${order.id}, 'shipped')">
        MARK SHIPPED
      </button>
    `;

  }


  else if (status === "shipped") {

    buttons = `
      <button
        class="delivered"
        onclick="updateOrder(${order.id}, 'delivered')">
        MARK DELIVERED
      </button>
    `;

  }


  return `
    <div class="order">

      <h2>
        Order #${escapeHTML(
          order.order_number || order.id
        )}
      </h2>

      <div class="status">
        ${escapeHTML(
          String(status).toUpperCase()
        )}
      </div>

      <p>
        <strong>Product:</strong>
        ${escapeHTML(
          order.product_name ||
          (order.products &&
           order.products.name) ||
          "Product"
        )}
      </p>

      <p>
        <strong>Quantity:</strong>
        ${escapeHTML(order.quantity || 1)}
      </p>

      <p>
        <strong>Price:</strong>
        $${escapeHTML(order.price || 0)}
      </p>

      <p>
        <strong>Total:</strong>
        $${escapeHTML(order.total || 0)}
      </p>

      <div class="customer">

        <strong>Customer</strong>

        <p>
          ${escapeHTML(
            order.shipping_name ||
            order.customer_name ||
            ""
          )}
        </p>

        <p>
          ${escapeHTML(
            order.shipping_email ||
            order.customer_email ||
            ""
          )}
        </p>

        <p>
          ${escapeHTML(
            order.shipping_phone ||
            order.customer_phone ||
            ""
          )}
        </p>

        <p>
          ${escapeHTML(
            order.shipping_address ||
            order.customer_address ||
            ""
          )}
        </p>

      </div>

      <p>
        <strong>Payment:</strong>
        ${escapeHTML(
          order.payment_status || "pending"
        )}
      </p>

      ${buttons}

    </div>
  `;

}


async function updateOrder(orderId, newStatus) {

  const token =
    localStorage.getItem(
      "berakah_access_token"
    );

  if (!token) {

    alert(
      "Your login session has expired."
    );

    return;
  }


  try {

    const response =
      await fetchWithTimeout(
        SUPABASE_URL +
        "/rest/v1/orders?id=eq." +
        encodeURIComponent(orderId),
        {
          method: "PATCH",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({
            status: newStatus,
            updated_at:
              new Date().toISOString()
          })
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      alert(
        "Could not update order:\n\n" +
        errorText
      );

      return;
    }


    showMessage(
      "Order updated successfully.",
      "success"
    );

    await loadOrders();

  } catch (error) {

    alert(
      "Could not update order:\n\n" +
      error.message
    );

  }

}


loadOrders();

setInterval(
  loadOrders,
  15000
);

</script>

</body>

</html>
