<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BERAKAH - Seller Orders</title><style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:white;
  padding:15px 20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:24px;
  font-weight:bold;
  text-decoration:none;
  color:#111827;
}

nav{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

nav a{
  text-decoration:none;
  color:#374151;
  font-size:14px;
}

.container{
  max-width:1000px;
  margin:30px auto;
  padding:0 15px;
}

h1{
  margin-bottom:10px;
}

.subtitle{
  color:#6b7280;
  margin-bottom:25px;
}

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat-number{
  font-size:28px;
  font-weight:bold;
}

.stat-label{
  color:#6b7280;
  margin-top:5px;
}

.order{
  background:white;
  border-radius:14px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  flex-wrap:wrap;
  padding-bottom:15px;
  border-bottom:1px solid #e5e7eb;
}

.order-number{
  font-size:18px;
  font-weight:bold;
}

.date{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

.status{
  display:inline-block;
  padding:7px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  background:#fef3c7;
  color:#92400e;
}

.customer{
  padding:18px 0;
  line-height:1.7;
}

.customer-title{
  font-weight:bold;
  margin-bottom:5px;
}

.products{
  border-top:1px solid #e5e7eb;
  border-bottom:1px solid #e5e7eb;
}

.product{
  display:flex;
  justify-content:space-between;
  padding:14px 0;
}

.product-name{
  font-weight:bold;
}

.quantity{
  color:#6b7280;
  font-size:14px;
  margin-top:4px;
}

.price{
  font-weight:bold;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:bold;
  padding:18px 0;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.actions button{
  flex:1;
  min-width:120px;
  padding:11px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.processing{
  background:#e0e7ff;
  color:#3730a3;
}

.shipped{
  background:#dbeafe;
  color:#1d4ed8;
}

.delivered{
  background:#dcfce7;
  color:#166534;
}

.cancel{
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  background:white;
  padding:50px 20px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.empty-icon{
  font-size:55px;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:450px){

  .stats{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

}

</style></head><body><header>  <div class="header-inner"><a
  href="index.html"
  class="logo">

  BERAKAH

</a>

<nav>

  <a href="index.html">
    Home
  </a>

  <a href="marketplace.html">
    Market
  </a>

  <a href="orders.html">
    My Orders
  </a>

</nav>

  </div></header><div class="container">  <h1>📦 SELLER ORDERS</h1>  <div class="subtitle">
    Manage orders received from your customers.
  </div>  <div class="stats"><div class="stat">

  <div
    id="totalOrders"
    class="stat-number">

    0

  </div>

  <div class="stat-label">
    Total Orders
  </div>

</div>


<div class="stat">

  <div
    id="newOrders"
    class="stat-number">

    0

  </div>

  <div class="stat-label">
    New
  </div>

</div>


<div class="stat">

  <div
    id="processingOrders"
    class="stat-number">

    0

  </div>

  <div class="stat-label">
    Processing
  </div>

</div>


<div class="stat">

  <div
    id="deliveredOrders"
    class="stat-number">

    0

  </div>

  <div class="stat-label">
    Delivered
  </div>

</div>

  </div>  <div id="orders"></div></div><script>


/* =========================
   GET ORDERS
========================= */

let orders = JSON.parse(
  localStorage.getItem(
    "berakahOrders"
  ) || "[]"
);


/* =========================
   ELEMENTS
========================= */

let container =
  document.getElementById(
    "orders"
  );


/* =========================
   UPDATE STATS
========================= */

function updateStats(){

  let total = orders.length;

  let newOrders =
    orders.filter(function(order){

      return (
        order.status === "NEW" ||
        !order.status
      );

    }).length;


  let processing =
    orders.filter(function(order){

      return order.status ===
        "PROCESSING";

    }).length;


  let delivered =
    orders.filter(function(order){

      return order.status ===
        "DELIVERED";

    }).length;


  document.getElementById(
    "totalOrders"
  ).textContent = total;


  document.getElementById(
    "newOrders"
  ).textContent = newOrders;


  document.getElementById(
    "processingOrders"
  ).textContent = processing;


  document.getElementById(
    "deliveredOrders"
  ).textContent = delivered;

}


/* =========================
   DISPLAY ORDERS
========================= */

function displayOrders(){

  container.innerHTML = "";


  if(orders.length === 0){

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📦
        </div>

        <h2>
          No Orders Yet
        </h2>

        <p>
          Customer orders will appear here.
        </p>

      </div>

    `;

    return;

  }


  orders
    .slice()
    .reverse()
    .forEach(function(order){

      let card =
        document.createElement(
          "div"
        );

      card.className = "order";


      let date = "";

      if(order.createdAt){

        date =
          new Date(
            order.createdAt
          ).toLocaleString();

      }


      let productsHTML = "";


      (order.products || [])
        .forEach(function(product){

          let name =
            product.name ||
            product.productName ||
            "Product";


          let quantity =
            Number(
              product.quantity
            ) || 1;


          let price =
            Number(
              product.price
            ) || 0;


          let itemTotal =
            price * quantity;


          productsHTML += `

            <div class="product">

              <div>

                <div class="product-name">

                  ${escapeHTML(name)}

                </div>

                <div class="quantity">

                  Quantity: ${quantity}

                </div>

              </div>

              <div class="price">

                $${itemTotal.toFixed(2)}

              </div>

            </div>

          `;

        });


      let status =
        order.status || "NEW";


      card.innerHTML = `

        <div class="order-top">

          <div>

            <div class="order-number">

              Order #${escapeHTML(
                order.orderNumber ||
                String(order.id || "")
              )}

            </div>

            <div class="date">

              ${escapeHTML(date)}

            </div>

          </div>

          <div
            class="status"
            id="status-${order.orderNumber}">

            ${escapeHTML(status)}

          </div>

        </div>


        <div class="customer">

          <div class="customer-title">
            👤 Customer
          </div>

          <strong>
            ${escapeHTML(
              order.customerName || ""
            )}
          </strong>

          <br>

          📧
          ${escapeHTML(
            order.customerEmail || ""
          )}

          <br>

          📞
          ${escapeHTML(
            order.customerPhone || ""
          )}

          <br>

          📍
          ${escapeHTML(
            order.customerAddress || ""
          )}

        </div>


        <div class="products">

          ${productsHTML}

        </div>


        <div class="total">

          <span>
            TOTAL
          </span>

          <span>
            $${Number(
              order.total || 0
            ).toFixed(2)}
          </span>

        </div>


        <div class="actions">

          <button
            class="processing"
            onclick="updateStatus(
              '${escapeAttribute(
                order.orderNumber
              )}',
              'PROCESSING'
            )">

            PROCESSING

          </button>


          <button
            class="shipped"
            onclick="updateStatus(
              '${escapeAttribute(
                order.orderNumber
              )}',
              'SHIPPED'
            )">

            SHIPPED

          </button>


          <button
            class="delivered"
            onclick="updateStatus(
              '${escapeAttribute(
                order.orderNumber
              )}',
              'DELIVERED'
            )">

            DELIVERED

          </button>


          <button
            class="cancel"
            onclick="updateStatus(
              '${escapeAttribute(
                order.orderNumber
              )}',
              'CANCELLED'
            )">

            CANCEL

          </button>

        </div>

      `;


      container.appendChild(card);

    });

}


/* =========================
   UPDATE ORDER STATUS
========================= */

function updateStatus(
  orderNumber,
  newStatus
){

  let found =
    orders.find(function(order){

      return String(
        order.orderNumber
      ) === String(orderNumber);

    });


  if(!found){

    alert(
      "ORDER NOT FOUND"
    );

    return;

  }


  found.status =
    newStatus;


  found.updatedAt =
    new Date().toISOString();


  localStorage.setItem(
    "berakahOrders",
    JSON.stringify(orders)
  );


  updateStats();

  displayOrders();


  alert(
    "ORDER STATUS UPDATED: " +
    newStatus
  );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


/* =========================
   START
========================= */

updateStats();

displayOrders();

</script></body></html>
