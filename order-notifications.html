<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Order Notifications</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #2563eb;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

nav a {
  text-decoration: none;
  color: #374151;
  padding: 8px 10px;
  border-radius: 7px;
  font-size: 14px;
}

nav a:hover {
  background: #eff6ff;
  color: #2563eb;
}

.container {
  max-width: 800px;
  margin: 30px auto;
  padding: 0 15px;
}

.title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 25px;
}

h1 {
  margin: 0;
}

.subtitle {
  color: #6b7280;
  margin-top: 7px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 7px;
  padding: 9px 13px;
  cursor: pointer;
  font-weight: bold;
}

.refresh {
  background: #2563eb;
  color: white;
}

.read {
  background: #e5e7eb;
  color: #374151;
}

.notification {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 12px;
  display: flex;
  gap: 15px;
  border-left: 4px solid #2563eb;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.notification.unread {
  background: #eff6ff;
}

.icon {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 50%;
  background: #dbeafe;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 23px;
}

.content {
  flex: 1;
}

.notification-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.notification-message {
  color: #4b5563;
  line-height: 1.5;
}

.notification-time {
  color: #9ca3af;
  font-size: 12px;
  margin-top: 8px;
}

.badge {
  display: inline-block;
  margin-left: 7px;
  padding: 3px 7px;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 10px;
}

.order-link {
  display: inline-block;
  margin-top: 10px;
  text-decoration: none;
  color: #2563eb;
  font-weight: bold;
  font-size: 13px;
}

.empty,
.loading,
.error {
  background: white;
  border-radius: 12px;
  padding: 40px 20px;
  text-align: center;
}

.loading {
  color: #6b7280;
}

.error {
  color: #991b1b;
  background: #fee2e2;
}

@media (max-width: 700px) {

  .header-inner {
    flex-direction: column;
    align-items: flex-start;
  }

  .title-row {
    flex-direction: column;
    align-items: flex-start;
  }

}

</style>

</head>


<body>


<header>

  <div class="header-inner">

    <div class="logo">
      BERAKAH
    </div>

    <nav>

      <a href="index.html">Home</a>

      <a href="feed.html">Feed</a>

      <a href="people.html">👥 People</a>

      <a href="marketplace.html">Market</a>

      <a href="notifications.html">
        🔔 Notifications
      </a>

      <a href="messages.html">
        💬 Messages
      </a>

      <a href="orders.html">
        My Orders
      </a>

      <a href="order-tracking.html">
        🚚 Tracking
      </a>

      <a href="profile.html">
        Profile
      </a>

    </nav>

  </div>

</header>


<div class="container">


  <div class="title-row">

    <div>

      <h1>
        🛍️ Order Notifications
      </h1>

      <div class="subtitle">
        Updates about your BERAKAH purchases.
      </div>

    </div>


    <div class="actions">

      <button
        class="refresh"
        onclick="loadNotifications()"
      >
        🔄 Refresh
      </button>

      <button
        class="read"
        onclick="markAllRead()"
      >
        ✓ Mark All Read
      </button>

    </div>

  </div>


  <div id="notificationList">

    <div class="loading">
      Loading order notifications...
    </div>

  </div>


</div>


<script>

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const ACCESS_TOKEN =
  localStorage.getItem(
    "berakah_access_token"
  );


let currentUser = null;

let notifications = [];


// =====================================
// HEADERS
// =====================================

function headers() {

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + ACCESS_TOKEN,

    "Content-Type":
      "application/json"

  };

}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// =====================================
// CURRENT USER
// =====================================

async function getCurrentUser() {

  if (!ACCESS_TOKEN) {

    window.location.href =
      "login.html";

    return null;

  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/user",
      {
        headers: headers()
      }
    );


  if (!response.ok) {

    localStorage.removeItem(
      "berakah_access_token"
    );

    window.location.href =
      "login.html";

    return null;

  }


  return await response.json();

}


// =====================================
// DATE
// =====================================

function formatDate(date) {

  if (!date) return "";

  return new Date(date)
    .toLocaleString(
      "en-US",
      {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }
    );

}


// =====================================
// STATUS INFORMATION
// =====================================

function getStatusInfo(status) {

  const data = {

    pending: {
      icon: "🛍️",
      title: "Order Received",
      message:
        "Your order has been received and is waiting for confirmation."
    },

    confirmed: {
      icon: "✅",
      title: "Order Confirmed",
      message:
        "Your order has been confirmed by the seller."
    },

    processing: {
      icon: "⚙️",
      title: "Order Processing",
      message:
        "Your order is now being prepared."
    },

    shipped: {
      icon: "🚚",
      title: "Order Shipped",
      message:
        "Your order has been shipped."
    },

    delivered: {
      icon: "🎉",
      title: "Order Delivered",
      message:
        "Your order has been delivered."
    },

    cancelled: {
      icon: "❌",
      title: "Order Cancelled",
      message:
        "Your order has been cancelled."
    }

  };


  return (
    data[status] ||
    data.pending
  );

}


// =====================================
// LOAD ORDERS
// =====================================

async function loadOrders() {

  const url =
    SUPABASE_URL +
    "/rest/v1/orders" +
    "?select=*" +
    "&buyer_id=eq." +
    encodeURIComponent(
      currentUser.id
    ) +
    "&order=created_at.desc";


  const response =
    await fetch(
      url,
      {
        headers: headers()
      }
    );


  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(error);

  }


  return await response.json();

}


// =====================================
// READ STATE
// =====================================

function getReadState() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "berakah_order_notifications_read"
      ) || "{}"
    );

  } catch {

    return {};

  }

}


function saveReadState(state) {

  localStorage.setItem(
    "berakah_order_notifications_read",
    JSON.stringify(state)
  );

}


// =====================================
// CREATE NOTIFICATIONS
// =====================================

function createNotifications(orders) {

  const readState =
    getReadState();


  return orders.map(order => {

    const status =
      String(
        order.status || "pending"
      ).toLowerCase();


    const info =
      getStatusInfo(status);


    const orderNumber =
      order.order_number ||
      "BRK-" + order.id;


    const product =
      order.product_name ||
      "your product";


    const notificationId =
      "order-" +
      order.id +
      "-" +
      status;


    return {

      id:
        notificationId,

      icon:
        info.icon,

      title:
        info.title,

      message:
        `${info.message} Order #${orderNumber} for ${product}.`,

      date:
        order.updated_at ||
        order.created_at,

      unread:
        !readState[notificationId],

      orderId:
        order.id

    };

  });

}


// =====================================
// RENDER
// =====================================

function renderNotifications() {

  const container =
    document.getElementById(
      "notificationList"
    );


  if (!notifications.length) {

    container.innerHTML = `

      <div class="empty">

        <h3>
          No order notifications yet 🛍️
        </h3>

        <p>
          Updates about your purchases will appear here.
        </p>

        <a
          href="marketplace.html"
          class="order-link"
        >
          Browse Marketplace
        </a>

      </div>

    `;

    return;

  }


  container.innerHTML =
    notifications.map(notification => `

      <div
        class="notification ${
          notification.unread
            ? "unread"
            : ""
        }"
        onclick="
          markRead('${notification.id}')
        "
      >

        <div class="icon">

          ${notification.icon}

        </div>


        <div class="content">

          <div class="notification-title">

            ${escapeHTML(
              notification.title
            )}

            ${
              notification.unread
              ? `<span class="badge">
                   NEW
                 </span>`
              : ""
            }

          </div>


          <div class="notification-message">

            ${escapeHTML(
              notification.message
            )}

          </div>


          <div class="notification-time">

            ${formatDate(
              notification.date
            )}

          </div>


          <a
            href="order-tracking.html"
            class="order-link"
            onclick="event.stopPropagation()"
          >
            🚚 Track Order
          </a>

        </div>

      </div>

    `).join("");

}


// =====================================
// LOAD NOTIFICATIONS
// =====================================

async function loadNotifications() {

  const container =
    document.getElementById(
      "notificationList"
    );


  container.innerHTML = `

    <div class="loading">
      Loading order notifications...
    </div>

  `;


  try {

    if (!currentUser) {

      currentUser =
        await getCurrentUser();

    }


    if (!currentUser) return;


    const orders =
      await loadOrders();


    notifications =
      createNotifications(
        orders
      );


    renderNotifications();


  } catch (error) {

    console.error(error);


    container.innerHTML = `

      <div class="error">

        Unable to load order notifications.

        <br><br>

        Please refresh the page.

      </div>

    `;

  }

}


// =====================================
// MARK ONE READ
// =====================================

function markRead(id) {

  const state =
    getReadState();


  state[id] = true;


  saveReadState(state);


  notifications =
    notifications.map(
      notification => {

        if (
          notification.id === id
        ) {

          notification.unread =
            false;

        }

        return notification;

      }
    );


  renderNotifications();

}


// =====================================
// MARK ALL READ
// =====================================

function markAllRead() {

  const state =
    getReadState();


  notifications.forEach(
    notification => {

      state[
        notification.id
      ] = true;

      notification.unread =
        false;

    }
  );


  saveReadState(state);

  renderNotifications();

}


// =====================================
// START
// =====================================

async function start() {

  currentUser =
    await getCurrentUser();


  if (!currentUser) return;


  await loadNotifications();

}


// =====================================
// AUTO REFRESH
// =====================================

setInterval(
  () => {

    if (currentUser) {

      loadNotifications();

    }

  },
  30000
);


start();

</script>

</body>
</html>
