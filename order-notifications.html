<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Notifications</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #2563eb;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

nav a {
  text-decoration: none;
  color: #374151;
  padding: 8px 10px;
  border-radius: 7px;
  font-size: 14px;
}

nav a:hover {
  background: #eff6ff;
  color: #2563eb;
}

.container {
  max-width: 800px;
  margin: 30px auto;
  padding: 0 15px;
}

.page-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

h1 {
  margin: 0;
}

.subtitle {
  color: #6b7280;
  margin-top: 7px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 7px;
  padding: 9px 13px;
  cursor: pointer;
  font-weight: bold;
}

.refresh-btn {
  background: #2563eb;
  color: white;
}

.read-btn {
  background: #e5e7eb;
  color: #374151;
}

.notification-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.notification {
  background: white;
  border-radius: 12px;
  padding: 18px;
  display: flex;
  gap: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  border-left: 4px solid #2563eb;
}

.notification.unread {
  background: #eff6ff;
}

.icon {
  width: 45px;
  height: 45px;
  min-width: 45px;
  border-radius: 50%;
  background: #dbeafe;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 22px;
}

.content {
  flex: 1;
}

.title {
  font-weight: bold;
  margin-bottom: 5px;
}

.message {
  color: #4b5563;
  line-height: 1.5;
}

.time {
  color: #9ca3af;
  font-size: 12px;
  margin-top: 8px;
}

.badge {
  display: inline-block;
  margin-left: 8px;
  padding: 3px 7px;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 10px;
}

.empty {
  background: white;
  border-radius: 12px;
  padding: 45px 20px;
  text-align: center;
  color: #6b7280;
}

.loading {
  text-align: center;
  padding: 40px;
  color: #6b7280;
}

.error {
  background: #fee2e2;
  color: #991b1b;
  border-radius: 10px;
  padding: 20px;
  text-align: center;
}

@media (max-width: 700px) {

  .header-inner {
    flex-direction: column;
    align-items: flex-start;
  }

  .page-title {
    flex-direction: column;
    align-items: flex-start;
  }

}

</style>

</head>


<body>


<header>

  <div class="header-inner">

    <div class="logo">
      BERAKAH
    </div>

    <nav>

      <a href="index.html">Home</a>

      <a href="marketplace.html">Market</a>

      <a href="seller-dashboard.html">
        Dashboard
      </a>

      <a href="seller-orders.html">
        Seller Orders
      </a>

      <a href="product-management.html">
        Products
      </a>

      <a href="inventory.html">
        Inventory
      </a>

      <a href="orders.html">
        My Orders
      </a>

      <a href="order-tracking.html">
        Tracking
      </a>

      <a href="notifications.html">
        🔔 Notifications
      </a>

      <a href="profile.html">
        Profile
      </a>

    </nav>

  </div>

</header>


<div class="container">


  <div class="page-title">

    <div>

      <h1>
        Notifications 🔔
      </h1>

      <div class="subtitle">
        Stay updated with your BERAKAH activity.
      </div>

    </div>


    <div class="actions">

      <button
        class="refresh-btn"
        onclick="loadNotifications()"
      >
        🔄 Refresh
      </button>

      <button
        class="read-btn"
        onclick="markAllRead()"
      >
        ✓ Mark All Read
      </button>

    </div>

  </div>


  <div id="notificationList">

    <div class="loading">
      Loading notifications...
    </div>

  </div>


</div>


<script>

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const ACCESS_TOKEN =
  localStorage.getItem(
    "berakah_access_token"
  );


let currentUser = null;

let notifications = [];


// =====================================
// SUPABASE HEADERS
// =====================================

function headers() {

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + ACCESS_TOKEN,

    "Content-Type":
      "application/json"

  };

}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// =====================================
// CURRENT USER
// =====================================

async function getCurrentUser() {

  if (!ACCESS_TOKEN) {

    window.location.href =
      "login.html";

    return null;

  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/user",
      {
        headers: headers()
      }
    );


  if (!response.ok) {

    localStorage.removeItem(
      "berakah_access_token"
    );

    window.location.href =
      "login.html";

    return null;

  }


  return await response.json();

}


// =====================================
// DATE FORMAT
// =====================================

function formatDate(date) {

  if (!date) {
    return "";
  }

  const d =
    new Date(date);

  return d.toLocaleString(
    "en-US",
    {
      month: "short",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


// =====================================
// STATUS MESSAGE
// =====================================

function createOrderNotification(order) {

  const status =
    String(
      order.status || "pending"
    ).toLowerCase();


  const orderNumber =
    order.order_number ||
    ("BRK-" + order.id);


  const product =
    order.product_name ||
    "your product";


  const messages = {

    pending: {

      icon: "🛍️",

      title: "New Order",

      message:
        `Your order #${orderNumber} for ${product} has been placed and is waiting for confirmation.`

    },

    confirmed: {

      icon: "✅",

      title: "Order Confirmed",

      message:
        `Your order #${orderNumber} for ${product} has been confirmed.`

    },

    processing: {

      icon: "⚙️",

      title: "Order Processing",

      message:
        `Your order #${orderNumber} for ${product} is now being processed.`

    },

    shipped: {

      icon: "🚚",

      title: "Order Shipped",

      message:
        `Your order #${orderNumber} for ${product} has been shipped.`

    },

    delivered: {

      icon: "🎉",

      title: "Order Delivered",

      message:
        `Your order #${orderNumber} for ${product} has been delivered.`

    },

    cancelled: {

      icon: "❌",

      title: "Order Cancelled",

      message:
        `Your order #${orderNumber} for ${product} has been cancelled.`

    }

  };


  const data =
    messages[status] ||
    messages.pending;


  return {

    id:
      "order-" +
      order.id,

    icon:
      data.icon,

    title:
      data.title,

    message:
      data.message,

    date:
      order.created_at,

    unread:
      true,

    orderId:
      order.id

  };

}


// =====================================
// LOAD CUSTOMER ORDERS
// =====================================

async function loadOrdersForNotifications() {

  const url =
    SUPABASE_URL +
    "/rest/v1/orders" +
    "?select=*" +
    "&buyer_id=eq." +
    encodeURIComponent(
      currentUser.id
    ) +
    "&order=created_at.desc";


  const response =
    await fetch(
      url,
      {
        headers: headers()
      }
    );


  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(error);

  }


  return await response.json();

}


// =====================================
// LOCAL READ STATE
// =====================================

function getReadState() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "berakah_read_notifications"
      ) || "{}"
    );

  } catch {

    return {};

  }

}


function saveReadState(state) {

  localStorage.setItem(
    "berakah_read_notifications",
    JSON.stringify(state)
  );

}


// =====================================
// LOAD NOTIFICATIONS
// =====================================

async function loadNotifications() {

  const container =
    document.getElementById(
      "notificationList"
    );


  container.innerHTML = `

    <div class="loading">
      Loading notifications...
    </div>

  `;


  try {

    if (!currentUser) {

      currentUser =
        await getCurrentUser();

    }


    if (!currentUser) {
      return;
    }


    const orders =
      await loadOrdersForNotifications();


    const readState =
      getReadState();


    notifications =
      orders.map(
        order =>
          createOrderNotification(
            order
          )
      );


    notifications =
      notifications.map(
        notification => {

          notification.unread =
            !readState[
              notification.id
            ];

          return notification;

        }
      );


    renderNotifications();

  } catch (error) {

    console.error(error);

    container.innerHTML = `

      <div class="error">

        Unable to load notifications.

        <br><br>

        Please refresh the page.

      </div>

    `;

  }

}


// =====================================
// RENDER
// =====================================

function renderNotifications() {

  const container =
    document.getElementById(
      "notificationList"
    );


  if (!notifications.length) {

    container.innerHTML = `

      <div class="empty">

        <h3>
          No notifications yet 🔔
        </h3>

        <p>
          Your BERAKAH updates will appear here.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    notifications
      .map(notification => `

        <div
          class="notification ${
            notification.unread
              ? "unread"
              : ""
          }"
          onclick="
            markNotificationRead(
              '${notification.id}'
            )
          "
        >

          <div class="icon">

            ${notification.icon}

          </div>


          <div class="content">

            <div class="title">

              ${escapeHTML(
                notification.title
              )}

              ${
                notification.unread
                ? `<span class="badge">
                     NEW
                   </span>`
                : ""
              }

            </div>


            <div class="message">

              ${escapeHTML(
                notification.message
              )}

            </div>


            <div class="time">

              ${formatDate(
                notification.date
              )}

            </div>

          </div>

        </div>

      `)
      .join("");

}


// =====================================
// MARK ONE READ
// =====================================

function markNotificationRead(id) {

  const state =
    getReadState();


  state[id] = true;


  saveReadState(state);


  notifications =
    notifications.map(
      notification => {

        if (
          notification.id === id
        ) {

          notification.unread =
            false;

        }

        return notification;

      }
    );


  renderNotifications();

}


// =====================================
// MARK ALL READ
// =====================================

function markAllRead() {

  const state =
    getReadState();


  notifications.forEach(
    notification => {

      state[
        notification.id
      ] = true;

      notification.unread =
        false;

    }
  );


  saveReadState(state);

  renderNotifications();

}


// =====================================
// START
// =====================================

async function start() {

  currentUser =
    await getCurrentUser();

  if (!currentUser) {
    return;
  }

  await loadNotifications();

}


// =====================================
// AUTO REFRESH
// =====================================

setInterval(
  () => {

    if (currentUser) {

      loadNotifications();

    }

  },
  30000
);


start();

</script>


</body>
</html>
