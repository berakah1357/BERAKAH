```html
<!DOCTYPE html>
<html>

<head>

<title>BERAKAH Seller Dashboard</title>

<style>

body{
  font-family:Arial;
  background:#f5f5f5;
  padding:20px;
}

.dashboard{
  max-width:700px;
  margin:auto;
}

.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:12px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  cursor:pointer;
  background:#111827;
  color:white;
  border-radius:6px;
}

select{
  padding:8px;
  margin-top:5px;
}

</style>

</head>

<body>

<div class="dashboard">

<h1>🏪 BERAKAH SELLER DASHBOARD</h1>

<div class="card">

<h2>📦 My Products</h2>

<div id="products"></div>

</div>


<div class="card">

<h2>💰 Sales</h2>

<div id="sales">$0</div>

</div>


<div class="card">

<h2>📋 Orders</h2>

<p>
Total Orders:
<strong id="ordersCount">0</strong>
</p>

<div id="orders"></div>

</div>

</div>


<script>

let products = JSON.parse(
  localStorage.getItem("berakahProducts") || "[]"
);

let orders = JSON.parse(
  localStorage.getItem("berakahOrders") || "[]"
);


let productsBox =
  document.getElementById("products");


/* PRODUCTS */

if(products.length === 0){

  productsBox.innerHTML =
    "<p>No products yet.</p>";

}else{

  products.forEach(function(product){

    productsBox.innerHTML += `

      <div>

        <h3>${product.name}</h3>

        <p>Price: $${product.price}</p>

        <p>Stock: ${product.stock ?? 0}</p>

        <p>Seller: ${product.seller || "BERAKAH"}</p>

        <button onclick="editProduct(${product.id})">
          ✏️ EDIT
        </button>

        <button onclick="deleteProduct(${product.id})">
          🗑️ DELETE
        </button>

      </div>

      <hr>

    `;

  });

}


/* ORDERS */

let ordersBox =
  document.getElementById("orders");

let totalOrders =
  orders.length;

document.getElementById("ordersCount").innerHTML =
  totalOrders;


let sales = 0;


if(orders.length === 0){

  ordersBox.innerHTML =
    "<p>No orders yet.</p>";

}else{

  orders.forEach(function(order){

    sales += Number(order.total) || 0;

    ordersBox.innerHTML += `

      <div>

        <h3>Order #${order.id}</h3>

        <p>
          Customer: ${order.customerName}
        </p>

        <p>
          Total: $${order.total}
        </p>

        <p>
          Status:
        </p>

        <select
          onchange="updateOrderStatus(${order.id}, this.value)"
        >

          <option value="NEW"
            ${order.status === "NEW" ? "selected" : ""}>
            NEW
          </option>

          <option value="PROCESSING"
            ${order.status === "PROCESSING" ? "selected" : ""}>
            PROCESSING
          </option>

          <option value="SHIPPED"
            ${order.status === "SHIPPED" ? "selected" : ""}>
            SHIPPED
          </option>

          <option value="COMPLETED"
            ${order.status === "COMPLETED" ? "selected" : ""}>
            COMPLETED
          </option>

        </select>

      </div>

      <hr>

    `;

  });

}


document.getElementById("sales").innerHTML =
  "$" + sales;


/* EDIT PRODUCT */

function editProduct(productId){

  let products = JSON.parse(
    localStorage.getItem("berakahProducts") || "[]"
  );

  let product = products.find(function(p){

    return Number(p.id) === Number(productId);

  });


  if(!product){

    alert("PRODUCT NOT FOUND");

    return;

  }


  let newName = prompt(
    "Product name:",
    product.name
  );


  if(newName === null) return;


  let newPrice = prompt(
    "Price:",
    product.price
  );


  if(newPrice === null) return;


  let newStock = prompt(
    "Stock:",
    product.stock ?? 0
  );


  if(newStock === null) return;


  product.name =
    newName.trim();

  product.price =
    Number(newPrice);

  product.stock =
    Number(newStock);


  localStorage.setItem(
    "berakahProducts",
    JSON.stringify(products)
  );


  alert("PRODUCT UPDATED 🚀");

  location.reload();

}


/* DELETE PRODUCT */

function deleteProduct(productId){

  let products = JSON.parse(
    localStorage.getItem("berakahProducts") || "[]"
  );


  let product = products.find(function(p){

    return Number(p.id) === Number(productId);

  });


  if(!product){

    alert("PRODUCT NOT FOUND");

    return;

  }


  let confirmed = confirm(
    "DELETE " + product.name + "?"
  );


  if(!confirmed) return;


  products = products.filter(function(p){

    return Number(p.id) !== Number(productId);

  });


  localStorage.setItem(
    "berakahProducts",
    JSON.stringify(products)
  );


  alert("PRODUCT DELETED 🗑️");

  location.reload();

}


/* UPDATE ORDER STATUS */

function updateOrderStatus(orderId, newStatus){

  let orders = JSON.parse(
    localStorage.getItem("berakahOrders") || "[]"
  );


  let order = orders.find(function(o){

    return Number(o.id) === Number(orderId);

  });


  if(!order){

    alert("ORDER NOT FOUND");

    return;

  }


  order.status =
    newStatus;


  localStorage.setItem(
    "berakahOrders",
    JSON.stringify(orders)
  );


  alert("ORDER STATUS UPDATED 🚀");

}

</script>

</body>

</html>
```
