<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Seller Orders</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#111827;
}

header{
    background:white;
    border-bottom:1px solid #e5e7eb;
    padding:15px 20px;
}

.header-inner{
    max-width:1200px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:1px;
}

nav{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

nav a{
    color:#374151;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px 60px;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    margin:0 0 8px;
}

.page-title p{
    margin:0;
    color:#6b7280;
}

.status-message{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:20px;
    line-height:1.5;
}

.status-message.error{
    display:block;
    background:#fef2f2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.status-message.success{
    display:block;
    background:#f0fdf4;
    color:#166534;
    border:1px solid #bbf7d0;
}

.orders-container{
    display:grid;
    gap:20px;
}

.order-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    overflow:hidden;
}

.order-header{
    padding:18px 20px;
    border-bottom:1px solid #e5e7eb;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.order-number{
    font-size:18px;
    font-weight:800;
}

.order-date{
    color:#6b7280;
    font-size:13px;
    margin-top:5px;
}

.status-badge{
    display:inline-block;
    padding:7px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
}

.status-pending{
    background:#fff7ed;
    color:#c2410c;
}

.status-confirmed{
    background:#eff6ff;
    color:#1d4ed8;
}

.status-processing{
    background:#f5f3ff;
    color:#6d28d9;
}

.status-shipped{
    background:#ecfeff;
    color:#0e7490;
}

.status-delivered{
    background:#f0fdf4;
    color:#15803d;
}

.status-cancelled{
    background:#fef2f2;
    color:#b91c1c;
}

.order-body{
    padding:20px;
}

.order-grid{
    display:grid;
    grid-template-columns:
        repeat(2,minmax(0,1fr));
    gap:20px;
}

.info-section{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:16px;
}

.info-section h3{
    margin:0 0 14px;
    font-size:15px;
}

.info-row{
    margin-bottom:10px;
}

.info-row:last-child{
    margin-bottom:0;
}

.info-label{
    color:#6b7280;
    font-size:12px;
    margin-bottom:3px;
}

.info-value{
    font-weight:600;
    word-break:break-word;
}

.product-box{
    margin-top:20px;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:16px;
}

.product-box h3{
    margin:0 0 15px;
}

.product-name{
    font-size:17px;
    font-weight:800;
}

.product-details{
    color:#6b7280;
    margin-top:6px;
    line-height:1.6;
}

.order-total{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:20px;
    padding-top:18px;

    border-top:1px solid #e5e7eb;

    font-size:20px;
    font-weight:800;
}

.actions{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.actions select{
    flex:1;
    min-width:200px;

    padding:12px;

    border:1px solid #d1d5db;
    border-radius:9px;

    background:white;
    font-size:15px;
}

.update-button{
    padding:12px 18px;

    border:0;
    border-radius:9px;

    background:#111827;
    color:white;

    font-weight:bold;
    cursor:pointer;
}

.update-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.empty{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;

    text-align:center;
    padding:60px 20px;
}

.empty h2{
    margin-top:0;
}

.empty p{
    color:#6b7280;
}

.loading{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

.refresh-button{
    padding:10px 15px;

    border:1px solid #d1d5db;
    border-radius:9px;

    background:white;

    font-weight:bold;
    cursor:pointer;
}

.top-actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

@media(max-width:700px){

    .header-inner{
        flex-direction:column;
    }

    nav{
        justify-content:center;
    }

    .order-grid{
        grid-template-columns:1fr;
    }

    .order-header{
        align-items:flex-start;
    }

    .actions{
        flex-direction:column;
    }

    .actions select{
        width:100%;
        min-width:0;
    }

    .update-button{
        width:100%;
    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<div class="logo">
BERAKAH
</div>

<nav>

<a href="index.html">
Home
</a>

<a href="feed.html">
Feed
</a>

<a href="marketplace.html">
Market
</a>

<a href="orders.html">
My Orders
</a>

<a href="profile.html">
Profile
</a>

</nav>

</div>

</header>


<main class="container">


<div class="page-title">

<h1>
📦 Seller Orders
</h1>

<p>
Manage orders from customers who purchased your products.
</p>

</div>


<div id="statusMessage"
     class="status-message">
</div>


<div class="top-actions">

<strong id="orderCount">
Loading orders...
</strong>

<button
    class="refresh-button"
    onclick="loadOrders()">

🔄 Refresh

</button>

</div>


<div id="ordersContainer"
     class="orders-container">

<div class="loading">

Loading seller orders...

</div>

</div>


</main>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =====================================================
   SESSION
===================================================== */

const accessToken =
localStorage.getItem(
    "berakah_access_token"
);


let currentUser = null;


/* =====================================================
   ELEMENTS
===================================================== */

const ordersContainer =
document.getElementById(
    "ordersContainer"
);

const orderCount =
document.getElementById(
    "orderCount"
);

const statusMessage =
document.getElementById(
    "statusMessage"
);


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showMessage(
    message,
    type
){

    statusMessage.textContent =
        message;

    statusMessage.className =
        "status-message " +
        type;

}


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
    endpoint,
    options={}
){

    const response =
        await fetch(
            SUPABASE_URL + endpoint,
            {

                ...options,

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})

                }

            }
        );


    const text =
        await response.text();


    let data = null;


    try{

        data =
            text
            ? JSON.parse(text)
            : null;

    }catch(error){

        data = text;

    }


    if(!response.ok){

        console.error(
            "SUPABASE ERROR:",
            data
        );


        throw new Error(

            data?.message ||

            data?.msg ||

            data?.hint ||

            data?.details ||

            "Supabase request failed."

        );

    }


    return data;

}


/* =====================================================
   LOAD CURRENT USER
===================================================== */

async function loadCurrentUser(){

    if(!accessToken){

        window.location.href =
            "login.html";

        return false;

    }


    try{

        currentUser =
            await supabaseRequest(
                "/auth/v1/user"
            );

        return true;

    }catch(error){

        console.error(error);

        localStorage.removeItem(
            "berakah_access_token"
        );

        localStorage.removeItem(
            "berakah_refresh_token"
        );

        window.location.href =
            "login.html";

        return false;

    }

}


/* =====================================================
   LOAD SELLER ORDERS
===================================================== */

async function loadOrders(){

    ordersContainer.innerHTML = `

        <div class="loading">
            Loading seller orders...
        </div>

    `;


    try{

        const loggedIn =
            await loadCurrentUser();


        if(!loggedIn){

            return;

        }


        /*
         * GET ORDERS FOR CURRENT SELLER
         */

        const endpoint =
            "/rest/v1/orders" +

            "?select=*" +

            "&seller_id=eq." +

            encodeURIComponent(
                currentUser.id
            ) +

            "&order=created_at.desc";


        const orders =
            await supabaseRequest(
                endpoint
            );


        displayOrders(
            orders || []
        );


    }catch(error){

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        orderCount.textContent =
            "Could not load orders";


        ordersContainer.innerHTML = "";


        showMessage(
            error.message,
            "error"
        );

    }

}


/* =====================================================
   DISPLAY ORDERS
===================================================== */

function displayOrders(
    orders
){

    orderCount.textContent =
        orders.length +
        (
            orders.length === 1
            ? " order"
            : " orders"
        );


    if(!orders.length){

        ordersContainer.innerHTML = `

            <div class="empty">

                <h2>
                    📦 No Orders Yet
                </h2>

                <p>
                    Customer orders for your products
                    will appear here.
                </p>

            </div>

        `;

        return;

    }


    ordersContainer.innerHTML =
        orders
        .map(
            function(order){

                return createOrderCard(
                    order
                );

            }
        )
        .join("");

}


/* =====================================================
   CREATE ORDER CARD
===================================================== */

function createOrderCard(
    order
){

    const status =
        String(
            order.status ||
            "pending"
        ).toLowerCase();


    const statusClass =
        "status-" +
        status;


    const orderNumber =
        order.order_number ||
        order.id ||
        "Unknown";


    const createdAt =
        order.created_at
        ? new Date(
            order.created_at
          ).toLocaleString()
        : "Unknown";


    const quantity =
        Number(
            order.quantity || 1
        );


    const price =
        Number(
            order.price || 0
        );


    const total =
        Number(
            order.total ||
            price * quantity
        );


    return `

        <div class="order-card">


            <div class="order-header">

                <div>

                    <div class="order-number">

                        Order #${escapeHTML(
                            orderNumber
                        )}

                    </div>

                    <div class="order-date">

                        ${escapeHTML(
                            createdAt
                        )}

                    </div>

                </div>


                <span class="status-badge ${statusClass}">

                    ${escapeHTML(
                        status
                    )}

                </span>

            </div>


            <div class="order-body">


                <div class="order-grid">


                    <!-- CUSTOMER -->

                    <div class="info-section">

                        <h3>
                            👤 Customer
                        </h3>


                        <div class="info-row">

                            <div class="info-label">
                                Name
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    order.customer_name ||
                                    order.shipping_name ||
                                    "Not provided"
                                )}

                            </div>

                        </div>


                        <div class="info-row">

                            <div class="info-label">
                                Email
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    order.customer_email ||
                                    order.shipping_email ||
                                    "Not provided"
                                )}

                            </div>

                        </div>


                        <div class="info-row">

                            <div class="info-label">
                                Phone
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    order.customer_phone ||
                                    order.shipping_phone ||
                                    "Not provided"
                                )}

                            </div>

                        </div>

                    </div>


                    <!-- SHIPPING -->

                    <div class="info-section">

                        <h3>
                            📍 Shipping
                        </h3>


                        <div class="info-row">

                            <div class="info-label">
                                Name
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    order.shipping_name ||
                                    order.customer_name ||
                                    "Not provided"
                                )}

                            </div>

                        </div>


                        <div class="info-row">

                            <div class="info-label">
                                Address
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    order.shipping_address ||
                                    order.customer_address ||
                                    "Not provided"
                                )}

                            </div>

                        </div>

                    </div>


                </div>


                <!-- PRODUCT -->

                <div class="product-box">

                    <h3>
                        🛍️ Product
                    </h3>


                    <div class="product-name">

                        ${escapeHTML(
                            order.product_name ||
                            "Product"
                        )}

                    </div>


                    <div class="product-details">

                        Quantity:
                        <strong>
                            ${quantity}
                        </strong>

                        <br>

                        Price:
                        <strong>
                            $${price.toFixed(2)}
                        </strong>

                    </div>


                    <div class="order-total">

                        <span>
                            TOTAL
                        </span>

                        <span>
                            $${total.toFixed(2)}
                        </span>

                    </div>

                </div>


                <!-- STATUS ACTIONS -->

                <div class="actions">

                    <select
                        id="status-${escapeHTML(
                            String(order.id)
                        )}">

                        <option
                            value="pending"
                            ${status === "pending" ? "selected" : ""}>

                            Pending

                        </option>

                        <option
                            value="confirmed"
                            ${status === "confirmed" ? "selected" : ""}>

                            Confirmed

                        </option>

                        <option
                            value="processing"
                            ${status === "processing" ? "selected" : ""}>

                            Processing

                        </option>

                        <option
                            value="shipped"
                            ${status === "shipped" ? "selected" : ""}>

                            Shipped

                        </option>

                        <option
                            value="delivered"
                            ${status === "delivered" ? "selected" : ""}>

                            Delivered

                        </option>

                        <option
                            value="cancelled"
                            ${status === "cancelled" ? "selected" : ""}>

                            Cancelled

                        </option>

                    </select>


                    <button
                        class="update-button"
                        onclick="updateOrderStatus('${escapeHTML(
                            String(order.id)
                        )}')">

                        UPDATE STATUS

                    </button>

                </div>


            </div>

        </div>

    `;

}


/* =====================================================
   UPDATE ORDER STATUS
===================================================== */

async function updateOrderStatus(
    orderId
){

    const select =
        document.getElementById(
            "status-" + orderId
        );


    if(!select){

        return;

    }


    const newStatus =
        select.value;


    const confirmed =
        confirm(
            "Change this order status to " +
            newStatus.toUpperCase() +
            "?"
        );


    if(!confirmed){

        return;

    }


    const buttons =
        document.querySelectorAll(
            ".update-button"
        );


    buttons.forEach(
        function(button){

            button.disabled =
                true;

        }
    );


    try{

        /*
         * IMPORTANT:
         * Only update the order if
         * it belongs to the current seller.
         */

        const endpoint =
            "/rest/v1/orders" +

            "?id=eq." +

            encodeURIComponent(
                orderId
            ) +

            "&seller_id=eq." +

            encodeURIComponent(
                currentUser.id
            );


        await supabaseRequest(

            endpoint,

            {

                method:
                    "PATCH",

                headers:{

                    "Prefer":
                        "return=representation"

                },

                body:
                    JSON.stringify({

                        status:
                            newStatus

                    })

            }

        );


        showMessage(
            "Order status updated successfully.",
            "success"
        );


        await loadOrders();


    }catch(error){

        console.error(
            "UPDATE STATUS ERROR:",
            error
        );


        showMessage(
            "Could not update order: " +
            error.message,
            "error"
        );


        buttons.forEach(
            function(button){

                button.disabled =
                    false;

            }
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

loadOrders();


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    loadOrders,
    30000
);

</script>

</body>

</html>
