/* =====================================================
   BERAKAH SELLER DASHBOARD
===================================================== */


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken =
  localStorage.getItem(
    "berakah_access_token"
  );

let currentUser = null;

let myProducts = [];

let myOrders = [];


/* =========================
   SUPABASE REQUEST
========================= */

async function supabaseRequest(
  endpoint,
  options = {}
){

  const response =
    await fetch(
      SUPABASE_URL + endpoint,
      {
        ...options,

        headers:{
          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            "application/json",

          ...(options.headers || {})
        }
      }
    );


  const text =
    await response.text();


  let data = null;


  try{

    data =
      text ?
      JSON.parse(text) :
      null;

  }
  catch{

    data = text;

  }


  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.msg ||
      "Supabase request failed."
    );

  }


  return data;

}


/* =========================
   LOAD CURRENT USER
========================= */

async function loadCurrentUser(){

  if(!accessToken){

    window.location.href =
      "login.html";

    return false;

  }


  try{

    currentUser =
      await supabaseRequest(
        "/auth/v1/user"
      );


    if(!currentUser ||
       !currentUser.id){

      throw new Error(
        "No valid seller account found."
      );

    }


    const username =
      localStorage.getItem(
        "berakah_username"
      ) ||
      currentUser.user_metadata?.username ||
      currentUser.user_metadata?.full_name ||
      currentUser.email ||
      "BERAKAH Seller";


    document.getElementById(
      "userBox"
    ).innerHTML = `

      <strong>👤 Seller:</strong>
      ${escapeHTML(username)}

      <br>

      <small>
        ${escapeHTML(
          currentUser.email || ""
        )}
      </small>

    `;


    return true;

  }
  catch(error){

    console.error(error);


    localStorage.removeItem(
      "berakah_access_token"
    );


    window.location.href =
      "login.html";


    return false;

  }

}


/* =========================
   LOAD SELLER PRODUCTS
========================= */

async function loadMyProducts(){

  const box =
    document.getElementById(
      "products"
    );


  try{

    myProducts =
      await supabaseRequest(

        "/rest/v1/products" +
        "?select=*" +
        "&seller_id=eq." +
        encodeURIComponent(
          currentUser.id
        ) +
        "&order=created_at.desc"

      );


    if(
      !myProducts ||
      myProducts.length === 0
    ){

      box.innerHTML = `

        <div class="empty">

          📦

          <h3>
            No products yet
          </h3>

          <p>
            Go to the marketplace
            and publish your first product.
          </p>

        </div>

      `;

      return;

    }


    box.innerHTML =
      myProducts.map(
        function(product){

          return `

            <div class="product-card">

              <h3>
                ${escapeHTML(
                  product.name ||
                  "Unnamed Product"
                )}
              </h3>

              <p>
                💰 Price:
                <strong>
                  $${Number(
                    product.price || 0
                  ).toFixed(2)}
                </strong>
              </p>

              <p>
                📦 Stock:
                <strong>
                  ${Number(
                    product.stock || 0
                  )}
                </strong>
              </p>

              <p>
                🏷️ Category:
                ${escapeHTML(
                  product.category ||
                  "Other"
                )}
              </p>

            </div>

          `;

        }
      ).join("");


  }
  catch(error){

    console.error(error);

    box.innerHTML = `

      <div class="error">

        Could not load your products.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================
   LOAD SELLER ORDERS
========================= */

function loadMyOrders(){

  const box =
    document.getElementById(
      "orders"
    );


  let allOrders = [];


  try{

    allOrders =
      JSON.parse(
        localStorage.getItem(
          "berakahOrders"
        ) || "[]"
      );

  }
  catch{

    allOrders = [];

  }


  /*
   IMPORTANT:

   An order can contain products
   from different sellers.

   We only keep orders where at least
   one product belongs to the logged-in
   seller.
  */

  myOrders =
    allOrders.filter(
      function(order){

        if(
          !order.products ||
          !Array.isArray(
            order.products
          )
        ){

          return false;

        }


        return order.products.some(
          function(product){

            return String(
              product.seller_id || ""
            ) ===
            String(
              currentUser.id
            );

          }
        );

      }
    );


  updateStats();


  if(myOrders.length === 0){

    box.innerHTML = `

      <div class="empty">

        📋

        <h3>
          No customer orders yet
        </h3>

        <p>
          Orders for your products
          will appear here.
        </p>

      </div>

    `;

    return;

  }


  const sorted =
    [...myOrders].sort(
      function(a,b){

        return Number(
          b.id || 0
        ) -
        Number(
          a.id || 0
        );

      }
    );


  box.innerHTML =
    sorted.map(
      function(order){

        return createOrderCard(
          order
        );

      }
    ).join("");

}


/* =========================
   CREATE ORDER CARD
========================= */

function createOrderCard(order){

  const sellerProducts =
    (order.products || [])
    .filter(
      function(product){

        return String(
          product.seller_id || ""
        ) ===
        String(
          currentUser.id
        );

      }
    );


  const sellerTotal =
    sellerProducts.reduce(
      function(sum,product){

        const price =
          Number(
            product.price || 0
          );

        const quantity =
          Math.max(
            1,
            Number(
              product.quantity
            ) || 1
          );


        return sum +
          price * quantity;

      },
      0
    );


  const orderNumber =
    order.orderNumber ||
    order.id ||
    "UNKNOWN";


  const status =
    order.status ||
    "NEW";


  let itemsHTML = "";


  sellerProducts.forEach(
    function(product){

      const quantity =
        Math.max(
          1,
          Number(
            product.quantity
          ) || 1
        );


      const price =
        Number(
          product.price || 0
        );


      itemsHTML += `

        <div class="order-item">

          <strong>
            ${escapeHTML(
              product.name ||
              "Product"
            )}
          </strong>

          <br>

          Quantity:
          ${quantity}

          <br>

          Price:
          $${price.toFixed(2)}

          <br>

          Subtotal:
          $${(
            price * quantity
          ).toFixed(2)}

        </div>

      `;

    }
  );


  return `

    <div class="order-card">

      <div class="order-header">

        <h3>
          Order #${escapeHTML(
            orderNumber
          )}
        </h3>

        <span class="status-badge">

          ${escapeHTML(
            status
          )}

        </span>

      </div>


      <div class="customer">

        <strong>
          👤 Customer
        </strong>

        <br><br>

        Name:
        ${escapeHTML(
          order.customerName ||
          ""
        )}

        <br>

        Email:
        ${escapeHTML(
          order.customerEmail ||
          ""
        )}

        <br>

        Phone:
        ${escapeHTML(
          order.customerPhone ||
          "Not provided"
        )}

        <br>

        Address:
        ${escapeHTML(
          order.customerAddress ||
          ""
        )}

      </div>


      <h4>
        🛍️ Your Products
      </h4>


      ${itemsHTML}


      <p>

        <strong>
          YOUR SALES:
        $${sellerTotal.toFixed(2)}
        </strong>

      </p>


      <div class="status-buttons">

        <button
          class="processing"
          onclick="updateOrderStatus(
            '${escapeAttribute(
              orderNumber
            )}',
            'PROCESSING'
          )">

          PROCESSING

        </button>


        <button
          class="shipped"
          onclick="updateOrderStatus(
            '${escapeAttribute(
              orderNumber
            )}',
            'SHIPPED'
          )">

          SHIPPED

        </button>


        <button
          class="delivered"
          onclick="updateOrderStatus(
            '${escapeAttribute(
              orderNumber
            )}',
            'DELIVERED'
          )">

          DELIVERED

        </button>


        <button
          class="cancel"
          onclick="updateOrderStatus(
            '${escapeAttribute(
              orderNumber
            )}',
            'CANCELLED'
          )">

          CANCEL

        </button>

      </div>

    </div>

  `;

}


/* =========================
   UPDATE STATS
========================= */

function updateStats(){

  let newCount = 0;

  let processingCount = 0;

  let deliveredCount = 0;

  let sales = 0;


  myOrders.forEach(
    function(order){

      const status =
        order.status ||
        "NEW";


      if(status === "NEW"){

        newCount++;

      }


      if(status === "PROCESSING"){

        processingCount++;

      }


      if(status === "DELIVERED"){

        deliveredCount++;

      }


      const sellerProducts =
        (order.products || [])
        .filter(
          function(product){

            return String(
              product.seller_id || ""
            ) ===
            String(
              currentUser.id
            );

          }
        );


      sellerProducts.forEach(
        function(product){

          sales +=
            (
              Number(
                product.price || 0
              ) *
              Math.max(
                1,
                Number(
                  product.quantity
                ) || 1
              )
            );

        }
      );

    }
  );


  document.getElementById(
    "ordersCount"
  ).textContent =
    myOrders.length;


  document.getElementById(
    "newCount"
  ).textContent =
    newCount;


  document.getElementById(
    "processingCount"
  ).textContent =
    processingCount;


  document.getElementById(
    "deliveredCount"
  ).textContent =
    deliveredCount;


  document.getElementById(
    "sales"
  ).textContent =
    "$" +
    sales.toFixed(2);

}


/* =========================
   UPDATE ORDER STATUS
========================= */

function updateOrderStatus(
  orderNumber,
  newStatus
){

  let orders = [];


  try{

    orders =
      JSON.parse(
        localStorage.getItem(
          "berakahOrders"
        ) || "[]"
      );

  }
  catch{

    orders = [];

  }


  const order =
    orders.find(
      function(order){

        return String(
          order.orderNumber ||
          order.id
        ) ===
        String(
          orderNumber
        );

      }
    );


  if(!order){

    alert(
      "ORDER NOT FOUND"
    );

    return;

  }


  /*
   SECURITY CHECK:

   The seller can only change an order
   if one of its products belongs to
   the logged-in seller.
  */

  const ownsProduct =
    (order.products || [])
    .some(
      function(product){

        return String(
          product.seller_id || ""
        ) ===
        String(
          currentUser.id
        );

      }
    );


  if(!ownsProduct){

    alert(
      "You can only update orders containing your products."
    );

    return;

  }


  order.status =
    newStatus;


  order.updatedAt =
    new Date().toISOString();


  localStorage.setItem(
    "berakahOrders",
    JSON.stringify(
      orders
    )
  );


  /*
   Keep the confirmation page
   synchronized with the latest order.
  */

  const lastOrder =
    JSON.parse(
      localStorage.getItem(
        "berakahLastOrder"
      ) || "null"
    );


  if(
    lastOrder &&
    String(
      lastOrder.orderNumber ||
      lastOrder.id
    ) ===
    String(
      orderNumber
    )
  ){

    lastOrder.status =
      newStatus;

    lastOrder.updatedAt =
      order.updatedAt;


    localStorage.setItem(
      "berakahLastOrder",
      JSON.stringify(
        lastOrder
      )
    );

  }


  alert(
    "ORDER STATUS UPDATED: " +
    newStatus
  );


  loadMyOrders();

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("'","&#039;")
    .replaceAll('"',"&quot;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}


/* =========================
   START
========================= */

async function startDashboard(){

  const loggedIn =
    await loadCurrentUser();


  if(!loggedIn){

    return;

  }


  await loadMyProducts();

  loadMyOrders();

}


startDashboard();
