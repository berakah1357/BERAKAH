<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BERAKAH Order Confirmation</title><style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
  padding:30px 15px;
}

.container{
  max-width:650px;
  margin:auto;
}

.card{
  background:white;
  border-radius:16px;
  padding:30px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.success{
  text-align:center;
}

.check{
  font-size:60px;
}

h1{
  margin:10px 0;
}

.order-number{
  font-size:20px;
  font-weight:bold;
  margin:15px 0;
}

.status{
  display:inline-block;
  padding:8px 16px;
  border-radius:20px;
  background:#fef3c7;
  color:#92400e;
  font-weight:bold;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:15px 0;
  border-bottom:1px solid #e5e7eb;
}

.item:last-child{
  border-bottom:none;
}

.item-name{
  font-weight:bold;
}

.item-quantity{
  color:#6b7280;
  margin-top:5px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:bold;
  padding-top:20px;
}

.customer-info{
  line-height:1.7;
}

.buttons{
  display:flex;
  gap:12px;
  margin-top:20px;
}

button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#111827;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

@media(max-width:500px){

  .buttons{
    flex-direction:column;
  }

  .item{
    flex-direction:column;
    gap:5px;
  }

}

</style></head><body><div class="container">  <div class="card success"><div class="check">✅</div>

<h1>ORDER CONFIRMED!</h1>

<p>
  Thank you for your purchase.
</p>

<div
  id="orderNumber"
  class="order-number">
</div>

<div
  id="status"
  class="status">
  NEW
</div>

  </div>  <div class="card"><h2>🛍️ Order Details</h2>

<div id="items"></div>

<div class="total">

  <span>TOTAL</span>

  <span id="total">$0.00</span>

</div>

  </div>  <div class="card"><h2>👤 Customer Information</h2>

<div
  id="customer"
  class="customer-info">
</div>

  </div>  <div class="buttons"><button
  class="primary"
  onclick="continueShopping()">

  CONTINUE SHOPPING

</button>

<button
  class="secondary"
  onclick="viewOrders()">

  MY ORDERS

</button>

  </div></div><script>

/* =========================
   GET LAST ORDER
========================= */

let order = JSON.parse(
  localStorage.getItem("berakahLastOrder") || "null"
);


/* =========================
   CHECK ORDER
========================= */

if(!order){

  document.querySelector(".container").innerHTML = `

    <div class="card success">

      <div class="check">📦</div>

      <h1>NO ORDER FOUND</h1>

      <p>
        We could not find a recent order.
      </p>

      <button
        class="primary"
        onclick="continueShopping()">

        GO TO MARKETPLACE

      </button>

    </div>

  `;

}


/* =========================
   DISPLAY ORDER
========================= */

if(order){

  /* ORDER NUMBER */

  document.getElementById(
    "orderNumber"
  ).textContent =
    "Order #" +
    order.orderNumber;


  /* STATUS */

  document.getElementById(
    "status"
  ).textContent =
    order.status || "NEW";


  /* PRODUCTS */

  let itemsContainer =
    document.getElementById("items");

  let products =
    order.products || [];


  products.forEach(function(product){

    let price =
      Number(product.price) || 0;

    let quantity =
      Number(product.quantity) || 1;

    let itemTotal =
      price * quantity;


    let item =
      document.createElement("div");

    item.className = "item";


    item.innerHTML = `

      <div>

        <div class="item-name">

          ${escapeHTML(
            product.name ||
            product.productName ||
            "Product"
          )}

        </div>

        <div class="item-quantity">

          Quantity: ${quantity}

        </div>

      </div>


      <div>

        $${itemTotal.toFixed(2)}

      </div>

    `;


    itemsContainer.appendChild(item);

  });


  /* TOTAL */

  document.getElementById(
    "total"
  ).textContent =
    "$" +
    Number(order.total || 0).toFixed(2);


  /* CUSTOMER */

  document.getElementById(
    "customer"
  ).innerHTML = `

    <strong>Name:</strong>
    ${escapeHTML(order.customerName)}

    <br>

    <strong>Email:</strong>
    ${escapeHTML(order.customerEmail)}

    <br>

    <strong>Phone:</strong>
    ${escapeHTML(order.customerPhone)}

    <br>

    <strong>Address:</strong>
    ${escapeHTML(order.customerAddress)}

  `;

}


/* =========================
   BUTTONS
========================= */

function continueShopping(){

  window.location.href =
    "marketplace.html";

}


function viewOrders(){

  window.location.href =
    "orders.html";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script></body></html>
