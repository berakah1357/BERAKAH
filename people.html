<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - People</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 3px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons a,
.nav-buttons button {
  padding: 8px 11px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  background: white;
  color: #111827;
  text-decoration: none;
  font-weight: bold;
  cursor: pointer;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 700px;
  margin: 30px auto;
  padding: 0 15px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

h1 {
  margin-top: 0;
}

#status {
  padding: 12px;
  margin-bottom: 15px;
  background: #f3f4f6;
  border-radius: 10px;
  white-space: pre-wrap;
  line-height: 1.5;
}

.person {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.person-info {
  min-width: 0;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #111827;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 20px;
  margin-bottom: 8px;
}

.username {
  font-weight: bold;
  font-size: 17px;
  overflow-wrap: anywhere;
}

.member {
  color: #6b7280;
  font-size: 13px;
  margin-top: 4px;
}

.profile-button {
  flex-shrink: 0;
  background: #111827;
  color: white;
  padding: 10px 14px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

.profile-button:hover {
  background: #374151;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}

.error {
  color: #b91c1c;
  background: #fef2f2;
}

@media (max-width: 600px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .person {
    align-items: flex-start;
    flex-direction: column;
  }

  .profile-button {
    width: 100%;
    text-align: center;
  }

}

</style>

</head>


<body>


<header>

<div class="nav">

<div class="logo">
BERAKAH
</div>

<div class="nav-buttons">

<a href="index.html">
Home
</a>

<a href="feed.html">
Feed
</a>

<a href="marketplace.html">
Market
</a>

<a href="notifications.html">
🔔
</a>

<button id="logoutButton">
Logout
</button>

</div>

</div>

</header>


<main>

<div class="card">

<h1>
👥 People
</h1>

<div id="status">
Connecting to BERAKAH...
</div>

<div id="people"></div>

</div>

</main>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


const accessToken =
localStorage.getItem(
"berakah_access_token"
);


let currentUser = null;


/* =========================================
   HEADERS
========================================= */

function headers(extra) {

  return Object.assign(

    {

      "apikey":
        SUPABASE_ANON_KEY,

      "Authorization":
        "Bearer " + accessToken

    },

    extra || {}

  );

}


/* =========================================
   SAFE TEXT
========================================= */

function safe(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================
   STATUS
========================================= */

function setStatus(text, error = false) {

  const element =
    document.getElementById("status");

  element.textContent = text;

  element.className =
    error ? "error" : "";

}


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser() {

  setStatus(
    "Step 1: Checking your BERAKAH login..."
  );


  if (!accessToken) {

    throw new Error(
      "You are not logged in. Please log in again."
    );

  }


  const response =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/user",

      {

        method: "GET",

        headers:
          headers()

      }

    );


  const text =
    await response.text();


  console.log(
    "AUTH RESPONSE:",
    text
  );


  if (!response.ok) {

    throw new Error(
      "Login error:\n\n" +
      text
    );

  }


  if (!text.trim()) {

    throw new Error(
      "Supabase returned no user."
    );

  }


  return JSON.parse(text);

}


/* =========================================
   LOAD PEOPLE
========================================= */

async function loadPeople() {

  setStatus(
    "Step 2: Loading BERAKAH members..."
  );


  /*
    IMPORTANT:

    We explicitly request the REAL
    profile ID.

    The ID is what Profile.html
    needs in:

    profile.html?id=UUID
  */

  const url =
    SUPABASE_URL +
    "/rest/v1/profiles" +
    "?select=id,username,language";


  console.log(
    "PROFILES URL:",
    url
  );


  const response =
    await fetch(

      url,

      {

        method: "GET",

        headers:
          headers()

      }

    );


  const text =
    await response.text();


  console.log(
    "PROFILES RESPONSE:",
    text
  );


  if (!response.ok) {

    throw new Error(
      "Could not load people:\n\n" +
      text
    );

  }


  let profiles = [];


  if (text.trim()) {

    profiles =
      JSON.parse(text);

  }


  const container =
    document.getElementById(
      "people"
    );


  container.innerHTML =
    "";


  /*
    Remove current user.
  */

  const otherUsers =
    profiles.filter(

      function(profile) {

        return (
          profile.id &&
          String(profile.id) !==
          String(currentUser.id)
        );

      }

    );


  if (!otherUsers.length) {

    container.innerHTML = `

      <div class="empty">

        👥

        <br><br>

        No other BERAKAH users found yet.

      </div>

    `;


    setStatus(
      "Step 3: People loaded successfully.\n\n" +
      "No other users found."
    );


    return;

  }


  /*
    DISPLAY USERS
  */

  otherUsers.forEach(

    function(profile) {

      /*
        This MUST be the Supabase UUID.
      */

      const profileId =
        String(profile.id);


      const username =
        profile.username ||
        "BERAKAH User";


      const firstLetter =
        username
          .charAt(0)
          .toUpperCase();


      const profileLink =
        "profile.html?id=" +
        encodeURIComponent(profileId);


      console.log(
        "PROFILE LINK:",
        profileLink
      );


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "person";


      div.innerHTML = `

        <div class="person-info">

          <div class="avatar">
            ${safe(firstLetter)}
          </div>

          <div class="username">
            ${safe(username)}
          </div>

          <div class="member">
            BERAKAH member
          </div>

        </div>


        <a
          class="profile-button"
          href="${safe(profileLink)}"
        >
          View profile
        </a>

      `;


      container.appendChild(
        div
      );

    }

  );


  setStatus(
    "Step 3: People loaded successfully.\n\n" +
    "Found " +
    otherUsers.length +
    " other BERAKAH member(s)."
  );

}


/* =========================================
   LOGOUT
========================================= */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(

    "click",

    function() {

      localStorage.removeItem(
        "berakah_access_token"
      );

      localStorage.removeItem(
        "berakah_refresh_token"
      );

      localStorage.removeItem(
        "berakah_user"
      );


      location.href =
        "login.html";

    }

  );


/* =========================================
   START
========================================= */

async function start() {

  try {

    currentUser =
      await getCurrentUser();


    console.log(
      "CURRENT USER ID:",
      currentUser.id
    );


    await loadPeople();

  }

  catch(error) {

    console.error(
      "BERAKAH PEOPLE ERROR:",
      error
    );


    setStatus(
      "ERROR:\n\n" +
      error.message,
      true
    );

  }

}


start();

</script>

</body>

</html>
