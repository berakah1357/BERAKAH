let accessToken =

);

let currentUser = null;


/* LOGIN CHECK */

if (!accessToken) {

  location.href =
    "login.html";

/* HEADERS */

function getHeaders(extra = {}) {

  return {

    "apikey":
      SUPABASE_ANON_KEY,

    "Authorization":
      "Bearer " + accessToken,

    ...extra

  };

}


/* ESCAPE HTML */

function escapeHtml(value) {

  return String(value || "")

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


/* CURRENT USER */

async function getCurrentUser() {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/user",
        {
          headers:
            getHeaders()
        }
      );

    if (!response.ok) {

      throw new Error(
        "Session expired."
      );

    }

    currentUser =
      await response.json();

    return true;

  } catch (error) {

    localStorage.clear();

    location.href =
      "login.html";

    return false;

  }

}
