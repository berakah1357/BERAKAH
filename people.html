<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - People</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 2px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 650px;
  margin: 25px auto;
  padding: 0 15px;
}

.container {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

h1 {
  margin-top: 0;
}

.person {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 5px;
  border-bottom: 1px solid #eee;
}

.avatar {
  width: 50px;
  height: 50px;
  min-width: 50px;
  border-radius: 50%;
  background: #111827;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: pointer;
}

.person-info {
  flex: 1;
}

.username {
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.status {
  color: #6b7280;
  font-size: 12px;
  margin-top: 4px;
}

.follow-button {
  border: none;
  border-radius: 8px;
  padding: 9px 14px;
  background: #111827;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.following {
  background: #e5e7eb;
  color: #111827;
}

#loading {
  text-align: center;
  padding: 25px;
}

#message {
  text-align: center;
  margin-bottom: 15px;
  font-weight: bold;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 25px;
}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
BERAKAH
</div>

<div class="nav-buttons">

<button onclick="location.href='index.html'">
Home
</button>

<button onclick="location.href='feed.html'">
Feed
</button>

<button onclick="location.href='marketplace.html'">
Market
</button>

<button onclick="location.href='notifications.html'">
🔔
</button>

<button class="logout" id="logoutButton">
Logout
</button>

</div>

</div>

</header>


<main>

<div class="container">

<h1>👥 People</h1>

<div id="message"></div>

<div id="loading">
Loading people...
</div>

<div id="people"></div>

</div>

</main>


<script>

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const accessToken =
localStorage.getItem(
"berakah_access_token"
);

let currentUser = null;


/* LOGIN */

if (!accessToken) {

location.href =
"login.html";

}


/* HEADERS */

function headers() {

return {

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + accessToken

};

}


/* ESCAPE */

function escapeHtml(value) {

return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* CURRENT USER */

async function getCurrentUser() {

const response =
await fetch(
SUPABASE_URL +
"/auth/v1/user",
{
headers: headers()
}
);

if (!response.ok) {

throw new Error(
"Your login session has expired."
);

}

return await response.json();

}


/* LOAD PEOPLE */

async function loadPeople() {

const loading =
document.getElementById(
"loading"
);

const people =
document.getElementById(
"people"
);

const message =
document.getElementById(
"message"
);

try {

/*
GET POSTS

The posts table contains:

user_id
username

We already know this
works because your Feed
is showing both users.
*/

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/posts" +
"?select=user_id,username" +
"&order=created_at.desc",

{
headers: headers()
}

);


if (!response.ok) {

const errorText =
await response.text();

throw new Error(
"Posts request failed: " +
errorText
);

}


const posts =
await response.json();


/*
CREATE UNIQUE USER LIST
*/

const users = [];
const seen = new Set();


for (
const post of posts
) {

if (!post.user_id) {
continue;
}

if (
post.user_id ===
currentUser.id
) {
continue;
}

if (
seen.has(post.user_id)
) {
continue;
}

seen.add(post.user_id);

users.push({

id:
post.user_id,

username:
post.username ||
"BERAKAH User"

});

}


/*
STOP LOADING
*/

loading.style.display =
"none";


/*
NO OTHER USERS
*/

if (!users.length) {

people.innerHTML =

"<div class='empty'>" +

"No other BERAKAH users found yet." +

"</div>";

return;

}


/*
DISPLAY USERS

We intentionally do NOT
request follows yet.
*/

for (
const user of users
) {

const row =
document.createElement(
"div"
);

row.className =
"person";


const username =
user.username;


const initial =
username
.charAt(0)
.toUpperCase();


row.innerHTML = `

<div
class="avatar"
onclick="
openProfile('${user.id}')
"
>
${escapeHtml(initial)}
</div>

<div class="person-info">

<div
class="username"
onclick="
openProfile('${user.id}')
"
>
${escapeHtml(username)}
</div>

<div class="status">
View profile
</div>

</div>

<button
class="follow-button"
onclick="
toggleFollow(
'${user.id}',
this
)
"
>
Follow
</button>

`;


people.appendChild(row);

}

} catch(error) {

loading.style.display =
"none";

message.textContent =
error.message;

}

}


/* OPEN PROFILE */

function openProfile(userId) {

location.href =
"profile.html?user=" +
encodeURIComponent(userId);

}


/* FOLLOW */

async function toggleFollow(
userId,
button
) {

button.disabled =
true;

try {

/*
CHECK FOLLOW
*/

const check =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
userId
),

{
headers:
headers()
}

);


const existing =
await check.json();


/*
UNFOLLOW
*/

if (
Array.isArray(existing) &&
existing.length > 0
) {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows" +
"?follower_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&following_id=eq." +
encodeURIComponent(
userId
),

{
method:
"DELETE",

headers:
headers()
}

);

if (!response.ok) {

throw new Error(
"Could not unfollow."
);

}

button.textContent =
"Follow";

button.classList.remove(
"following"
);

}


/*
FOLLOW
*/

else {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/follows",

{

method:
"POST",

headers: {

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " +
accessToken,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:
JSON.stringify({

follower_id:
currentUser.id,

following_id:
userId

})

}

);


if (!response.ok) {

const errorText =
await response.text();

throw new Error(
errorText ||
"Could not follow user."
);

}


button.textContent =
"Following";

button.classList.add(
"following"
);

}

} catch(error) {

alert(
error.message
);

}

button.disabled =
false;

}


/* LOGOUT */

document
.getElementById(
"logoutButton"
)
.addEventListener(
"click",
function() {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

location.href =
"login.html";

}
);


/* START */

(async function() {

try {

currentUser =
await getCurrentUser();

await loadPeople();

} catch(error) {

document.getElementById(
"loading"
).style.display =
"none";

document.getElementById(
"message"
).textContent =
error.message;

}

})();

</script>

</body>
</html>
