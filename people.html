<script>

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const token =
localStorage.getItem(
"berakah_access_token"
);


function headers() {

return {
"apikey": SUPABASE_ANON_KEY,
"Authorization": "Bearer " + token
};

}


function escapeHtml(value) {

return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* GET CURRENT USER */

async function getUser() {

const response =
await fetch(
SUPABASE_URL + "/auth/v1/user",
{
headers: headers()
}
);

if (!response.ok) {

throw new Error(
"LOGIN ERROR\n\n" +
await response.text()
);

}

return await response.json();

}


/* GET POSTS */

async function getPosts() {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/posts?select=user_id,username&order=created_at.desc",

{
headers: headers()
}

);

if (!response.ok) {

throw new Error(
"POSTS ERROR\n\n" +
await response.text()
);

}

return await response.json();

}


/* SHOW PEOPLE */

async function load() {

const loading =
document.getElementById("loading");

const people =
document.getElementById("people");

const error =
document.getElementById("error");


try {

if (!token) {

location.href =
"login.html";

return;

}


const user =
await getUser();


const posts =
await getPosts();


const users = [];
const seen = new Set();


for (const post of posts) {

if (!post.user_id) {
continue;
}


/* DON'T SHOW MYSELF */

if (post.user_id === user.id) {
continue;
}


/* REMOVE DUPLICATES */

if (seen.has(post.user_id)) {
continue;
}

seen.add(post.user_id);


users.push({

id: post.user_id,

username:
post.username ||
"BERAKAH User"

});

}


loading.style.display =
"none";


if (users.length === 0) {

people.innerHTML =
"<p>No other BERAKAH users found yet.</p>";

return;

}


for (const person of users) {

const div =
document.createElement("div");

div.className =
"person";


const firstLetter =
person.username
.charAt(0)
.toUpperCase();


div.innerHTML = `

<div class="avatar">
${escapeHtml(firstLetter)}
</div>

<div class="info">

<div class="username">
${escapeHtml(person.username)}
</div>

<div class="status">
BERAKAH member
</div>

</div>
