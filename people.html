<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - People</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

/* HEADER */

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 2px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 14px;
}

.nav-buttons button:hover {
  background: #f3f4f6;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

/* MAIN */

main {
  max-width: 650px;
  margin: 25px auto;
  padding: 0 15px;
}

.container {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

h1 {
  margin-top: 0;
  margin-bottom: 20px;
}

/* MESSAGE */

#message {
  text-align: center;
  margin-bottom: 15px;
  font-weight: bold;
}

/* LOADING */

#loading {
  text-align: center;
  padding: 25px;
  color: #6b7280;
}

/* PERSON */

.person {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 5px;
  border-bottom: 1px solid #eeeeee;
}

.person:last-child {
  border-bottom: none;
}

/* AVATAR */

.avatar {
  width: 52px;
  height: 52px;
  min-width: 52px;
  border-radius: 50%;
  background: #111827;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.avatar:hover {
  opacity: 0.85;
}

/* INFO */

.person-info {
  flex: 1;
  min-width: 0;
}

.username {
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  word-break: break-word;
}

.username:hover {
  text-decoration: underline;
}

.status {
  color: #6b7280;
  font-size: 12px;
  margin-top: 4px;
}

/* FOLLOW BUTTON */

.follow-button {
  border: none;
  border-radius: 8px;
  padding: 9px 15px;
  background: #111827;
  color: white;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

.follow-button:hover {
  opacity: 0.9;
}

.follow-button.following {
  background: #e5e7eb;
  color: #111827;
}

.follow-button:disabled {
  opacity: 0.6;
  cursor: wait;
}

/* EMPTY */

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}

/* MOBILE */

@media (max-width: 600px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .nav-buttons {
    width: 100%;
  }

  .nav-buttons button {
    flex: 1;
  }

  .person {
    gap: 9px;
  }

  .follow-button {
    padding: 8px 11px;
    font-size: 12px;
  }

}

</style>

</head>

</div>
