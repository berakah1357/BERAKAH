<main>

<h1>🔔 Notifications</h1>

<div id="status">
Loading notifications...
</div>

<div id="notifications"></div>

<button
class="logout"
onclick="logout()">
Logout
</button>

</div>

</main>


<script>

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const accessToken =
localStorage.getItem(
"berakah_access_token"
);

let currentUser = null;


function headers() {

return {

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + accessToken

};

}


async function start() {

const status =
document.getElementById("status");


try {

if (!accessToken) {

status.textContent =
"No login session found.";

return;

}


const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{
headers:
headers()
}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(text);

}


currentUser =
JSON.parse(text);


status.textContent =
"Logged in successfully as: " +
(
currentUser.user_metadata?.username ||
currentUser.email
);


await loadNotifications();


}

catch(error) {

console.error(error);

status.textContent =
"ERROR: " +
error.message;

}

}


async function loadNotifications() {

const container =
document.getElementById(
"notifications"
);


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/notifications" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&order=created_at.desc",

{
headers:
headers()
}

);


const text =
await response.text();


console.log(
"NOTIFICATION RESPONSE:",
text
);


if (!response.ok) {

throw new Error(
text
);

}


let rows = [];


if (text.trim()) {

rows =
JSON.parse(text);

}


if (!rows.length) {

container.innerHTML =
`
<div class="notification">
🔔 No notifications yet.
</div>
`;

return;
