<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Notifications</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons a,
.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  color: #111827;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
  text-decoration: none;
  font-weight: bold;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 700px;
  margin: 30px auto;
  padding: 0 15px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

h1 {
  margin-top: 0;
}

.status {
  padding: 12px;
  margin-bottom: 18px;
  background: #f3f4f6;
  border-radius: 10px;
  white-space: pre-wrap;
  line-height: 1.5;
}

.notification {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  margin-bottom: 12px;
  background: white;
}

.notification.unread {
  background: #f9fafb;
  border-left: 4px solid #111827;
}

.avatar {
  width: 50px;
  height: 50px;
  min-width: 50px;
  border-radius: 50%;
  background: #111827;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
}

.notification-content {
  flex: 1;
  min-width: 0;
}

.message {
  font-size: 15px;
  line-height: 1.4;
}

.time {
  color: #6b7280;
  font-size: 12px;
  margin-top: 5px;
}

.notification-button {
  border: none;
  background: #111827;
  color: white;
  padding: 8px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
  flex-shrink: 0;
}

.mark-all {
  margin-bottom: 18px;
  border: none;
  background: #111827;
  color: white;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.mark-all:disabled,
.notification-button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 35px 10px;
}

@media (max-width: 600px) {

  .nav {
    align-items: flex-start;
    flex-direction: column;
  }

  .nav-buttons {
    width: 100%;
  }

  .notification {
    align-items: flex-start;
  }

  .notification-button {
    padding: 8px 10px;
  }

}

</style>

</head>

<body>

<header>

<div class="nav">

<div class="logo">
BERAKAH
</div>

<div class="nav-buttons">

<a href="index.html">
Home
</a>

<a href="feed.html">
Feed
</a>

<a href="people.html">
👥 People
</a>

<a href="marketplace.html">
Market
</a>

<a href="notifications.html">
🔔
</a>

<button
class="logout"
id="logoutButton">
Logout
</button>

</div>

</div>

</header>


<main>

<div class="card">

<h1>
🔔 Notifications
</h1>

<div
id="status"
class="status">
Loading notifications...
</div>

<button
id="markAllButton"
class="mark-all">
Mark all as read
</button>

<div id="notifications"></div>

</div>

</main>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";

const accessToken =
localStorage.getItem(
"berakah_access_token"
);

let currentUser = null;


/* =========================================
   HEADERS
========================================= */

function headers(extra) {

return Object.assign({

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " + accessToken

}, extra || {});

}


/* =========================================
   SAFE TEXT
========================================= */

function safe(value) {

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

document.getElementById(
"status"
).textContent = text;

}


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser() {

if (!accessToken) {

throw new Error(
"Your login session is missing. Please log in again."
);

}

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{
method: "GET",
headers: headers()
}

);

const text =
await response.text();

if (!response.ok) {

throw new Error(
"Login session error:\n\n" +
text
);

}

if (!text.trim()) {

throw new Error(
"Supabase returned no user."
);

}

return JSON.parse(text);

}


/* =========================================
   GET PROFILE BY AUTH UUID
========================================= */

/*
 IMPORTANT:

 actor_id is a UUID.

 profiles.id is a BIGINT.

 Therefore we CANNOT do:

 profile.html?id=UUID

 We first find:

 profiles.user_id = actor_id

 Then we get:

 profiles.id

 Then we open:

 profile.html?id=BIGINT
*/

async function getProfileByUserId(
userId
) {

if (!userId) {

return null;

}

const url =
SUPABASE_URL +
"/rest/v1/profiles" +
"?select=id,\"Full name\",username,avatar_url,user_id" +
"&user_id=eq." +
encodeURIComponent(userId) +
"&limit=1";


const response =
await fetch(

url,

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


if (!response.ok) {

console.error(
"PROFILE LOOKUP ERROR:",
text
);

return null;

}


if (!text.trim()) {

return null;

}


const rows =
JSON.parse(text);


if (!rows.length) {

return null;

}


return rows[0];

}


/* =========================================
   LOAD NOTIFICATIONS
========================================= */

async function loadNotifications() {

setStatus(
"Loading your BERAKAH notifications..."
);


const url =
SUPABASE_URL +
"/rest/v1/notifications" +
"?select=*" +
"&user_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&order=created_at.desc";


console.log(
"NOTIFICATIONS URL:",
url
);


const response =
await fetch(

url,

{
method: "GET",
headers: headers()
}

);


const text =
await response.text();


console.log(
"NOTIFICATIONS RESPONSE:",
text
);


if (!response.ok) {

throw new Error(
"Could not load notifications:\n\n" +
text
);

}


let notifications = [];


if (text.trim()) {

notifications =
JSON.parse(text);

}


await displayNotifications(
notifications
);


setStatus(
"Notifications loaded successfully.\n\n" +
notifications.length +
" notification(s)."
);

}


/* =========================================
   DISPLAY NOTIFICATIONS
========================================= */

async function displayNotifications(
notifications
) {

const container =
document.getElementById(
"notifications"
);

container.innerHTML =
"";


if (!notifications.length) {

container.innerHTML = `

<div class="empty">

🔔

<br><br>

You have no notifications yet.

</div>

`;

return;

}


/*
 Process every notification.

 If actor_id exists:

 UUID
   ↓
profiles.user_id
   ↓
profiles.id
   ↓
profile.html?id=NUMBER
*/

for (
const notification of notifications
) {

const div =
document.createElement(
"div"
);

div.className =
"notification";


if (!notification.read) {

div.classList.add(
"unread"
);

}


/* -----------------------------------------
   FIND ACTOR PROFILE
----------------------------------------- */

let actorProfile = null;


if (notification.actor_id) {

actorProfile =
await getProfileByUserId(
notification.actor_id
);

}


/* -----------------------------------------
   MESSAGE
----------------------------------------- */

const message =
notification.message ||
"Someone interacted with you on BERAKAH.";


/* -----------------------------------------
   TIME
----------------------------------------- */

let time =
"";


if (notification.created_at) {

const date =
new Date(
notification.created_at
);

if (!isNaN(date.getTime())) {

time =
date.toLocaleString();

}

}


/* -----------------------------------------
   AVATAR
----------------------------------------- */

let firstLetter =
"B";


if (
actorProfile &&
actorProfile["Full name"]
) {

firstLetter =
actorProfile["Full name"]
.charAt(0)
.toUpperCase();

}
else if (
actorProfile &&
actorProfile.username
) {

firstLetter =
actorProfile.username
.charAt(0)
.toUpperCase();

}


/* -----------------------------------------
   VIEW BUTTON
----------------------------------------- */

let viewButtonHTML =
"";


if (
actorProfile &&
actorProfile.id
) {

viewButtonHTML = `

<button
class="notification-button"
data-profile-id="${safe(actorProfile.id)}"
data-notification-id="${safe(notification.id || "")}">
View
</button>

`;

}


/* -----------------------------------------
   HTML
----------------------------------------- */

div.innerHTML = `

<div class="avatar">
${safe(firstLetter)}
</div>

<div class="notification-content">

<div class="message">
${safe(message)}
</div>

<div class="time">
${safe(time)}
</div>

</div>

${viewButtonHTML}

`;


/* -----------------------------------------
   VIEW BUTTON EVENT
----------------------------------------- */

const viewButton =
div.querySelector(
".notification-button"
);


if (viewButton) {

viewButton.addEventListener(
"click",
async function() {

const profileId =
this.dataset.profileId;

const notificationId =
this.dataset.notificationId;


/*
 Mark this notification
 as read before opening
 the profile.
*/

if (notificationId) {

await markNotificationRead(
notificationId
);

}


/*
 IMPORTANT:

 profileId is now numeric.

 Example:

 profileId = 1

 NOT:

 profileId =
f4fecfb1-efc5-4a79-b9aa-881003f0ec24
*/

location.href =
"profile.html?id=" +
encodeURIComponent(
profileId
);

});

}


/* -----------------------------------------
   ADD TO PAGE
----------------------------------------- */

container.appendChild(
div
);

}

}


/* =========================================
   MARK ONE NOTIFICATION READ
========================================= */

async function markNotificationRead(
notificationId
) {

if (!notificationId) {

return;

}


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/notifications" +
"?id=eq." +
encodeURIComponent(
notificationId
),

{

method: "PATCH",

headers: headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

read: true

})

}

);


if (!response.ok) {

console.error(
"Could not mark notification read."
);

}

}


/* =========================================
   MARK ALL READ
========================================= */

async function markAllRead() {

const button =
document.getElementById(
"markAllButton"
);

button.disabled =
true;

button.textContent =
"Marking as read...";


try {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/notifications" +
"?user_id=eq." +
encodeURIComponent(
currentUser.id
) +
"&read=eq.false",

{

method: "PATCH",

headers: headers({

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

}),

body:
JSON.stringify({

read: true

})

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(
text ||
"Could not mark notifications as read."
);

}


setStatus(
"All notifications marked as read."
);


await loadNotifications();

}
catch(error) {

console.error(
"MARK ALL ERROR:",
error
);

setStatus(
error.message
);

}


button.disabled =
false;

button.textContent =
"Mark all as read";

}


/* =========================================
   LOGOUT
========================================= */

document
.getElementById(
"logoutButton"
)
.addEventListener(
"click",
function() {

localStorage.removeItem(
"berakah_access_token"
);

localStorage.removeItem(
"berakah_refresh_token"
);

localStorage.removeItem(
"berakah_user"
);

location.href =
"login.html";

}
);


/* =========================================
   MARK ALL BUTTON
========================================= */

document
.getElementById(
"markAllButton"
)
.addEventListener(
"click",
markAllRead
);


/* =========================================
   START
========================================= */

async function start() {

try {

if (!accessToken) {

location.href =
"login.html";

return;

}


currentUser =
await getCurrentUser();


console.log(
"CURRENT USER:",
currentUser.id
);


await loadNotifications();

}
catch(error) {

console.error(
"BERAKAH NOTIFICATIONS ERROR:",
error
);

setStatus(
"ERROR:\n\n" +
error.message
);

}

}


start();

</script>

</body>

</html>
