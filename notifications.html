<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Notifications</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 15px 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    flex-wrap: wrap;
    gap: 10px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #2563eb;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

nav a {
    text-decoration: none;
    color: #374151;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
}

nav a:hover {
    background: #eff6ff;
    color: #2563eb;
}

.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 0 15px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
}

button {
    border: none;
    background: #2563eb;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #1d4ed8;
}

.refresh {
    background: #4b5563;
}

.refresh:hover {
    background: #374151;
}

.notification {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;

    display: flex;
    align-items: center;
    gap: 14px;

    cursor: pointer;

    border: 1px solid #e5e7eb;

    transition: 0.15s;
}

.notification:hover {
    background: #f9fafb;
}

.notification.unread {
    background: #eff6ff;
    border-left: 4px solid #2563eb;
}

.icon {
    width: 45px;
    height: 45px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #e5e7eb;

    font-size: 22px;

    flex-shrink: 0;
}

.notification-content {
    flex: 1;
}

.notification-text {
    font-size: 15px;
    line-height: 1.4;
}

.notification-time {
    margin-top: 5px;
    color: #6b7280;
    font-size: 12px;
}

.unread-label {
    font-size: 11px;
    color: #2563eb;
    font-weight: bold;
}

.empty {
    background: white;
    padding: 50px 20px;
    text-align: center;
    border-radius: 12px;
    color: #6b7280;
}

.loading {
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 12px;
    color: #6b7280;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

@media (max-width: 600px) {

    header {
        align-items: flex-start;
    }

    .notification {
        padding: 13px;
    }

    .icon {
        width: 40px;
        height: 40px;
        font-size: 19px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        BERAKAH
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="feed.html">
            Feed
        </a>

        <a href="people.html">
            👥 People
        </a>

        <a href="marketplace.html">
            Market
        </a>

        <a href="notifications.html">
            🔔 Notifications
        </a>

        <a href="messages.html">
            💬 Messages
        </a>

        <a href="#" onclick="logout()">
            Logout
        </a>

    </nav>

</header>


<div class="container">


    <div class="top">

        <h1>
            🔔 Notifications
        </h1>

        <div>

            <button onclick="markAllRead()">
                ✓ Mark All Read
            </button>

            <button
                class="refresh"
                onclick="loadNotifications()"
            >
                🔄 Refresh
            </button>

        </div>

    </div>


    <div id="errorBox"></div>


    <div id="notificationsList">

        <div class="loading">
            Loading notifications...
        </div>

    </div>


</div>


<script>


const SUPABASE_URL =
    "https://utoyoglycqjmqznczfxa.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


let accessToken =
    localStorage.getItem(
        "berakah_access_token"
    );


let currentUser = null;

let notifications = [];

let profiles = {};



/* =========================================
   SUPABASE REQUEST
========================================= */

async function supabaseFetch(
    path,
    options = {}
) {

    const headers = {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " + accessToken,

        "Content-Type":
            "application/json",

        ...(options.headers || {})

    };


    const response =
        await fetch(
            SUPABASE_URL + path,
            {
                ...options,
                headers
            }
        );


    const text =
        await response.text();


    let data = null;


    try {

        data =
            text
                ? JSON.parse(text)
                : null;

    } catch {

        data = text;

    }


    if (!response.ok) {

        throw new Error(
            typeof data === "object"
                ? JSON.stringify(data)
                : data
        );

    }


    return data;

}



/* =========================================
   CHECK LOGIN
========================================= */

async function checkLogin() {

    if (!accessToken) {

        window.location.href =
            "login.html";

        return false;

    }


    try {

        currentUser =
            await supabaseFetch(
                "/auth/v1/user"
            );

        return true;

    } catch (error) {

        console.error(error);

        localStorage.removeItem(
            "berakah_access_token"
        );

        localStorage.removeItem(
            "berakah_refresh_token"
        );

        window.location.href =
            "login.html";

        return false;

    }

}



/* =========================================
   LOAD PROFILES
========================================= */

async function loadProfiles() {

    const data =
        await supabaseFetch(
            "/rest/v1/profiles?select=id,user_id,%22Full%20name%22,username"
        );


    profiles = {};


    (data || []).forEach(
        profile => {

            profiles[
                profile.user_id
            ] = profile;

        }
    );

}



/* =========================================
   PROFILE NAME
========================================= */

function getProfileName(
    userId
) {

    const profile =
        profiles[userId];


    if (!profile) {

        return "Someone";

    }


    return (
        profile["Full name"] ||
        profile.full_name ||
        profile.name ||
        profile.username ||
        "Someone"
    );

}



/* =========================================
   PROFILE ID
========================================= */

function getProfileId(
    userId
) {

    const profile =
        profiles[userId];


    if (!profile) {
        return null;
    }


    return profile.id;

}



/* =========================================
   ICON
========================================= */

function getNotificationIcon(
    type
) {

    switch (type) {

        case "follow":
            return "👥";

        case "like":
            return "❤️";

        case "message":
            return "💬";

        case "comment":
            return "💬";

        default:
            return "🔔";

    }

}



/* =========================================
   LOAD NOTIFICATIONS
========================================= */

async function loadNotifications() {

    const list =
        document.getElementById(
            "notificationsList"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.innerHTML = "";


    list.innerHTML = `
        <div class="loading">
            Loading notifications...
        </div>
    `;


    try {

        await loadProfiles();


        const data =
            await supabaseFetch(
                "/rest/v1/notifications" +
                "?select=*" +
                "&order=created_at.desc"
            );


        notifications =
            data || [];


        renderNotifications();


    } catch (error) {

        console.error(error);


        errorBox.innerHTML = `
            <div class="error">
                Could not load notifications:
                ${escapeHtml(error.message)}
            </div>
        `;


        list.innerHTML = "";

    }

}



/* =========================================
   RENDER
========================================= */

function renderNotifications() {

    const list =
        document.getElementById(
            "notificationsList"
        );


    if (
        notifications.length === 0
    ) {

        list.innerHTML = `
            <div class="empty">

                🔔

                <br><br>

                You have no notifications yet.

            </div>
        `;

        return;

    }


    list.innerHTML = "";


    notifications.forEach(
        notification => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "notification " +
                (
                    notification.read
                        ? ""
                        : "unread"
                );


            const name =
                getProfileName(
                    notification.actor_id
                );


            const icon =
                getNotificationIcon(
                    notification.type
                );


            item.innerHTML = `

                <div class="icon">
                    ${icon}
                </div>

                <div class="notification-content">

                    <div class="notification-text">

                        <strong>
                            ${escapeHtml(name)}
                        </strong>

                        ${escapeHtml(
                            notification.message ||
                            "You have a new notification."
                        )}

                    </div>

                    <div class="notification-time">

                        ${formatTime(
                            notification.created_at
                        )}

                        ${
                            notification.read
                                ? ""
                                : `
                                    <span class="unread-label">
                                        • NEW
                                    </span>
                                `
                        }

                    </div>

                </div>

            `;


            item.onclick =
                () => {

                    openNotification(
                        notification
                    );

                };


            list.appendChild(item);

        }
    );

}



/* =========================================
   OPEN NOTIFICATION
========================================= */

async function openNotification(
    notification
) {

    await markNotificationRead(
        notification.id
    );


    if (
        notification.type ===
        "follow"
    ) {

        const profileId =
            getProfileId(
                notification.actor_id
            );


        if (profileId) {

            window.location.href =
                "profile.html?id=" +
                profileId;

            return;

        }

    }


    if (
        notification.type ===
        "message"
    ) {

        window.location.href =
            "messages.html";

        return;

    }


    if (
        notification.type ===
        "like"
    ) {

        window.location.href =
            "feed.html";

        return;

    }


    if (
        notification.type ===
        "comment"
    ) {

        window.location.href =
            "feed.html";

        return;

    }

}



/* =========================================
   MARK ONE READ
========================================= */

async function markNotificationRead(
    notificationId
) {

    try {

        await supabaseFetch(

            "/rest/v1/notifications" +
            "?id=eq." +
            encodeURIComponent(
                notificationId
            ),

            {
                method: "PATCH",

                headers: {
                    "Prefer":
                        "return=minimal"
                },

                body: JSON.stringify({
                    read: true
                })
            }

        );


        const notification =
            notifications.find(
                n =>
                    n.id ===
                    notificationId
            );


        if (notification) {

            notification.read =
                true;

        }


        renderNotifications();


    } catch (error) {

        console.error(
            "Could not mark notification read:",
            error
        );

    }

}



/* =========================================
   MARK ALL READ
========================================= */

async function markAllRead() {

    try {

        await supabaseFetch(

            "/rest/v1/notifications" +
            "?user_id=eq." +
            encodeURIComponent(
                currentUser.id
            ) +
            "&read=eq.false",

            {
                method: "PATCH",

                headers: {
                    "Prefer":
                        "return=minimal"
                },

                body: JSON.stringify({
                    read: true
                })

            }

        );


        notifications.forEach(
            notification => {

                notification.read =
                    true;

            }
        );


        renderNotifications();


    } catch (error) {

        console.error(error);


        document.getElementById(
            "errorBox"
        ).innerHTML = `

            <div class="error">

                Could not mark notifications
                as read:

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}



/* =========================================
   TIME
========================================= */

function formatTime(
    dateString
) {

    if (!dateString) {
        return "";
    }


    const date =
        new Date(dateString);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        [],
        {
            dateStyle: "short",
            timeStyle: "short"
        }
    );

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================================
   LOGOUT
========================================= */

function logout() {

    localStorage.removeItem(
        "berakah_access_token"
    );

    localStorage.removeItem(
        "berakah_refresh_token"
    );


    window.location.href =
        "login.html";

}



/* =========================================
   AUTO REFRESH
========================================= */

setInterval(
    () => {

        if (currentUser) {

            loadNotifications();

        }

    },
    10000
);



/* =========================================
   START
========================================= */

async function start() {

    const loggedIn =
        await checkLogin();


    if (!loggedIn) {
        return;
    }


    await loadNotifications();

}


start();

</script>

</body>

</html>
