<script>

/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL =
"https://utoyoglycqjmqznczfxa.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_OypM4-7GHnq_n8-HRhw-dA_Ehzak_CA";


/* =========================================
   LOGIN
========================================= */

const accessToken =
localStorage.getItem(
"berakah_access_token"
);

let currentUser = null;


/* =========================================
   HEADERS
========================================= */

function headers(extra) {

  return Object.assign(

    {
      "apikey":
        SUPABASE_ANON_KEY,

      "Authorization":
        "Bearer " + accessToken
    },

    extra || {}

  );

}


/* =========================================
   SAFE HTML
========================================= */

function safe(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================
   STATUS MESSAGE
========================================= */

function setStatus(message) {

  document.getElementById(
    "status"
  ).textContent = message;

}


/* =========================================
   GET LOGGED-IN USER
========================================= */

async function getCurrentUser() {

  setStatus(
    "Step 1: Checking login..."
  );


  if (!accessToken) {

    throw new Error(
      "No login session found. Please log in again."
    );

  }


  setStatus(
    "Step 2: Connecting to Supabase..."
  );


  const response =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/user",

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  console.log(
    "AUTH RESPONSE:",
    text
  );


  if (!response.ok) {

    throw new Error(
      "AUTH ERROR:\n" +
      text
    );

  }


  if (!text.trim()) {

    throw new Error(
      "Supabase returned an empty user."
    );

  }


  return JSON.parse(text);

}


/* =========================================
   LOAD NOTIFICATIONS
========================================= */

async function loadNotifications() {

  setStatus(
    "Step 3: Loading notifications..."
  );


  console.log(
    "CURRENT USER ID:",
    currentUser.id
  );


  const url =
    SUPABASE_URL +
    "/rest/v1/notifications" +
    "?select=*" +
    "&user_id=eq." +
    encodeURIComponent(
      currentUser.id
    ) +
    "&order=created_at.desc";


  console.log(
    "NOTIFICATION URL:",
    url
  );


  const response =
    await fetch(

      url,

      {
        method: "GET",
        headers: headers()
      }

    );


  const text =
    await response.text();


  console.log(
    "NOTIFICATIONS RESPONSE:",
    text
  );


  if (!response.ok) {

    throw new Error(
      "NOTIFICATIONS ERROR:\n" +
      text
    );

  }


  let notifications = [];


  if (text.trim()) {

    notifications =
      JSON.parse(text);

  }


  const container =
    document.getElementById(
      "notifications"
    );


  container.innerHTML =
    "";


  /* =====================================
     NO NOTIFICATIONS
  ===================================== */

  if (!notifications.length) {

    container.innerHTML = `

      <div class="empty">

        🔔

        <br><br>

        No notifications yet.

      </div>

    `;


    setStatus(
      "Step 4: Notifications loaded.\n\n" +
      "No notifications found for this account."
    );


    return;

  }


  /* =====================================
     DISPLAY NOTIFICATIONS
  ===================================== */

  notifications.forEach(
    function(notification) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "notification";


      if (
        notification.read === false
      ) {

        div.classList.add(
          "unread"
        );

      }


      let dateText =
        "Date unavailable";


      if (
        notification.created_at
      ) {

        const date =
          new Date(
            notification.created_at
          );


        if (
          !isNaN(
            date.getTime()
          )
        ) {

          dateText =
            date.toLocaleString();

        }

      }


      let message =
        notification.message ||
        "New notification";


      /*
       * FOLLOW NOTIFICATION
       */

      if (
        notification.type === "follow"
        &&
        !notification.message
      ) {

        message =
          "Someone followed you";

      }


      div.innerHTML = `

        <div class="notification-message">

          🔔
          ${safe(message)}

        </div>

        <div class="notification-time">

          ${safe(dateText)}

        </div>

      `;


      container.appendChild(
        div
      );

    }
  );


  setStatus(
