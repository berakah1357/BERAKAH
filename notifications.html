<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BERAKAH - Notifications</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: white;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
}

.nav-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.nav-buttons button {
  border: 1px solid #d1d5db;
  background: white;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
}

.logout {
  background: #111827 !important;
  color: white !important;
}

main {
  max-width: 700px;
  margin: 30px auto;
  padding: 0 15px;
}

.notifications-card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

h1 {
  margin-top: 0;
}

.notification {
  padding: 16px 5px;
  border-bottom: 1px solid #e5e7eb;
}

.notification:last-child {
  border-bottom: none;
}

.notification.unread {
  background: #f3f4f6;
  border-radius: 10px;
  padding: 16px;
}

.notification-message {
  font-weight: bold;
  margin-bottom: 6px;
}

.notification-time {
  color: #6b7280;
  font-size: 12px;
}

.notification-actions {
  margin-top: 10px;
}

.notification-actions button {
  border: none;
  background: #111827;
  color: white;
  padding: 8px 12px;
  border-radius: 7px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 30px 10px;
}

#loading {
  text-align: center;
  padding: 30px;
}

#error {
  color: #b91c1c;
  white-space: pre-wrap;
  text-align: center;
  padding: 20px;
}

</style>

</head
